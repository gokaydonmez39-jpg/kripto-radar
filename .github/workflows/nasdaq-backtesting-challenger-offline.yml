name: XRAY NASDAQ A35 Backtesting Challenger Offline

on:
  pull_request:
    paths:
      - 'personal-swing/performance_lab/backtesting_challenger.py'
      - 'personal-swing/performance_lab/test_backtesting_challenger.py'
      - 'personal-swing/performance_lab/BACKTESTING_CHALLENGER_README.md'
      - '.github/workflows/nasdaq-backtesting-challenger-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: '3.11'
      - name: Install isolated research dependencies only
        run: |
          python -m pip install --disable-pip-version-check 'backtesting==0.6.6' 'exchange_calendars>=4.7,<5'
          python -c "import backtesting; assert backtesting.__version__ == '0.6.6'"
      - name: Offline synthetic comparison - normal
        working-directory: personal-swing/performance_lab
        env:
          PYTHONNOUSERSITE: '1'
        run: python -m unittest -v test_backtesting_challenger
      - name: Offline synthetic comparison - optimized
        working-directory: personal-swing/performance_lab
        env:
          PYTHONNOUSERSITE: '1'
        run: python -O -m unittest -v test_backtesting_challenger
