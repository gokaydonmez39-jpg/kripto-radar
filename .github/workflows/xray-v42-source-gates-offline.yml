name: XRAY v42 Official Sources and Gate Dependency Offline (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/xray_v42_ranked_source_gate_contract.json'
      - 'nasdaq-xray/xray_v42_offline_source_gate_audit.py'
      - 'nasdaq-xray/test_xray_v42_offline_source_gate_audit.py'
      - '.github/workflows/xray-v42-source-gates-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-v42-offline-gates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  static-gates-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run normal and optimized fail-closed source dependency regression
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/xray_v42_offline_source_gate_audit.py nasdaq-xray/test_xray_v42_offline_source_gate_audit.py
          cd nasdaq-xray
          python -m unittest -v test_xray_v42_offline_source_gate_audit.py
          python -O -m unittest -v test_xray_v42_offline_source_gate_audit.py
          python xray_v42_offline_source_gate_audit.py xray_v42_ranked_source_gate_contract.json
      - name: No IO/network/broker imports in offline gate contract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('nasdaq-xray/xray_v42_offline_source_gate_audit.py')
          tree=ast.parse(p.read_text(encoding='utf-8'))
          mods=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Import): mods.extend(x.name.split('.')[0] for x in node.names)
              if isinstance(node,ast.ImportFrom) and node.module: mods.append(node.module.split('.')[0])
          forbidden={'urllib','socket','requests','http','subprocess','alpaca','ccxt','os'}
          if forbidden.intersection(mods):raise SystemExit('XRAY_V42_IO_SIDE_EFFECT_IMPORT')
          print('XRAY_V42_READONLY_IMPORT_AUDIT_PASS')
          PY