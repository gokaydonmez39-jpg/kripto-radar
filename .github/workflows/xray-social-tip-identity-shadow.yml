name: XRAY Untrusted Social Ticker Identity Quarantine (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/social_tip_identity_shadow.py'
      - 'nasdaq-xray/tests/test_social_tip_identity_shadow.py'
      - 'nasdaq-xray/research/aura_ten_untrusted_tips_20261018_v1.json'
      - '.github/workflows/xray-social-tip-identity-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'nasdaq-xray/social_tip_identity_shadow.py'
      - 'nasdaq-xray/tests/test_social_tip_identity_shadow.py'
      - 'nasdaq-xray/research/aura_ten_untrusted_tips_20261018_v1.json'
      - '.github/workflows/xray-social-tip-identity-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-social-tip-quarantine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-no-vendor-no-order:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and run adversarial offline tests in standard and optimized Python
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/social_tip_identity_shadow.py nasdaq-xray/tests/test_social_tip_identity_shadow.py
          python -m unittest discover -s nasdaq-xray/tests -p 'test_social_tip_identity_shadow.py' -v
          python -O -m unittest discover -s nasdaq-xray/tests -p 'test_social_tip_identity_shadow.py' -v
      - name: Verify exact committed social list against real canonical NASDAQ identity-only file
        run: |
          set -euo pipefail
          python nasdaq-xray/social_tip_identity_shadow.py \
            --tip nasdaq-xray/research/aura_ten_untrusted_tips_20261018_v1.json \
            --master nasdaq-xray/canonical_current_master_manifest.json \
            --out "$RUNNER_TEMP/aura_identity_research_only.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"aura_identity_research_only.json").read_text())
          assert result["status"]=="RESEARCH_ONLY_IDENTITY_SCREEN_NO_AL"
          assert result["identity_only_symbols"]==["ASTS","CRWV","NBIS","OUST","RKLB","TMDX"]
          assert result["not_in_master_symbols"]==["MP","SMR","UUUU","VRT"]
          assert result["unknown_identity_symbols"]==[]
          assert result["buy_signals"]==0 and result["notifications"]==0
          assert result["execution"]=="NONE" and result["real_money"]=="NO-GO"
          assert result["price_verified"] is False and result["r92_authority"] is False
          assert result["market_data_license_attested"] is False
          print("XRAY_AURA_REAL_MASTER_IDENTITY_ONLY=PASS_6_SCOPE_4_NOT_PRESENT_NO_AL")
          PY
      - name: Verify no network or broker call within source module
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path("nasdaq-xray/social_tip_identity_shadow.py").read_text())
          banned={"requests","httpx","urllib","socket","subprocess","alpaca","ccxt","yfinance","websocket"}
          imported=set()
          for x in ast.walk(tree):
              if isinstance(x,ast.Import): imported.update(n.name.split('.')[0] for n in x.names)
              elif isinstance(x,ast.ImportFrom) and x.module: imported.add(x.module.split('.')[0])
          assert not (imported & banned),imported & banned
          print("XRAY_SOCIAL_INTAKE_NO_NETWORK_NO_BROKER=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xray-aura-10-identity-only-no-al
          path: ${{ runner.temp }}/aura_identity_research_only.json
          if-no-files-found: ignore
          retention-days: 7
