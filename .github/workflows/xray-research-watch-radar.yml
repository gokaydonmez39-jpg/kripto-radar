name: XRAY C4.17 Research WATCH Radar
on:
  workflow_dispatch:
  schedule:
    - cron: "17 15,20,23 * * 1-5"
  push:
    branches: [main]
    paths:
      - nasdaq-xray/research_watch_radar.py
      - nasdaq-xray/preentry_watch_observer.py
      - nasdaq-xray/forward_watch_metrics.py
      - .github/workflows/xray-research-watch-radar.yml
      - nasdaq-xray/canonical_current_final_tech.json
  workflow_run:
    workflows: ["XRAY Canonical Current Final Factory"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: xray-c417-watch-radar
  cancel-in-progress: false
jobs:
  research-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify fail-closed WATCH-only invariants
        run: |
          python -m py_compile nasdaq-xray/research_watch_radar.py
          python nasdaq-xray/research_watch_radar.py --selftest
          python -m py_compile nasdaq-xray/preentry_watch_observer.py
          python nasdaq-xray/preentry_watch_observer.py --selftest
          python -m py_compile nasdaq-xray/forward_watch_metrics.py
          python nasdaq-xray/forward_watch_metrics.py --selftest
      - name: Recalculate SHA-bound research watch and rejects
        run: |
          python nasdaq-xray/research_watch_radar.py --out "$RUNNER_TEMP/xray_research_watch_radar.json"
          python - <<'PY'
          import json,os,pathlib
          j=json.load(open(pathlib.Path(os.environ["RUNNER_TEMP"])/"xray_research_watch_radar.json"))
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["alpha_authority"] is False and j["decision_authority"] is False
          assert j["buy_candidates"]==[] and j["orders"]==[] and j["go"] is False
          assert j["live_watch_count"]==(j["observed_b_watch_count"] if j["source_exact"] else 0)
          if not j["source_exact"]:
              assert j["research_watch"]==[] and j["status"]=="STALE_SNAPSHOT_WATCH_BLOCKED"
          summary=pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as f:
              f.write("# C4.17 Research WATCH — NOT AL\n\n")
              f.write("ASOF: "+str(j["asof_et"])+"\n\n")
              f.write("Status: **"+j["status"]+"**\n\n")
              f.write("Live WATCH: "+str(j["live_watch_count"])+" / Pre-G9 AL: "+str(j["pre_g9_al_count"])+"\n\n")
              f.write("Stale SHA bindings: "+", ".join(j["binding_discrepancies"])+"\n\n")
              f.write("No order execution; REAL_MONEY=NO-GO.\n")
              f.write("\n## Source-bound WATCH symbols (research only)\n\n")
              f.write("| Symbol | Setup | Classification |\n|---|---|---|\n")
              for item in j["research_watch"]:
                  assert item["al"] is False and item["setup"]=="B_ARMED"
                  sym=item["symbol"]
                  assert isinstance(sym,str) and sym and sym.isalnum(),"WATCH_SYMBOL_INVALID"
                  f.write(f"| {sym} | B_ARMED | WATCH_ONLY — NOT AL |\n")
              if not j["source_exact"]:
                  f.write("\nSnapshot invalid: no live WATCH records promoted.\n")
          PY
      - name: Classify early WATCH opportunities and source-vs-technical failures
        run: |
          python nasdaq-xray/preentry_watch_observer.py --out "$RUNNER_TEMP/xray_preentry_watch.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"xray_preentry_watch.json"
          j=json.loads(p.read_text())
          assert j["schema"]=="XRAY_C417_PREENTRY_ATTRITION_WATCH_V1"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["alpha_authority"] is False and j["delivery_authority"] is False
          assert j["r92_candidates"]==j["buy_candidates"]==j["orders"]==[]
          assert sum(j["disjoint_class_counts"].values())==j["observed_final_count"]
          assert all(r["al"] is False and r["order"] is False
                     for r in j["preentry_watch"]+j["historical_diagnostic_only"])
          if not j["current_source_ready"]:
              assert j["status"]=="DATA_BLOCKED_STALE_OR_INCOMPLETE_SOURCE"
              assert j["preentry_watch"]==[] and j["prospective_watch_count"]==0
              assert j["disjoint_class_counts"].get("TECH_FAIL",0)==0
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("\\n## Pre-entry WATCH / DATA_BLOCKED vs TECH_FAIL\\n\\n")
              f.write("Status: **"+j["status"]+"**\\n\\n")
              f.write("Current prospective WATCH: **"+str(j["prospective_watch_count"])+"**\\n\\n")
              f.write("Disjoint classes: "+json.dumps(j["disjoint_class_counts"],sort_keys=True)+"\\n\\n")
              f.write("No AL, no broker, no device-delivery assertion.\\n")
          print("XRAY_PREENTRY_WATCH_CONTRACT=PASS_SEPARATE_NO_BUY")
          PY
      - name: Verify 2-8 session outcomes are pending without real future evidence
        run: |
          python nasdaq-xray/forward_watch_metrics.py --out "$RUNNER_TEMP/xray_forward_watch_metrics.json"
          python - <<'PY'
          import json,os,pathlib
          j=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"xray_forward_watch_metrics.json").read_text())
          assert j["schema"]=="XRAY_FORWARD_WATCH_PAPER_METRICS_V1"
          assert j["status"]=="FORWARD_EVIDENCE_NOT_CONFIGURED"
          assert j["measured"] is False and j["horizons"]=={}
          assert j["alpha_authority"] is False and j["buy_candidates"]==j["orders"]==[]
          print("XRAY_FORWARD_PROSPECTIVE_TRACKER=CONTRACT_PASS_OUTCOMES_PENDING_NOT_FAKE")
          PY
      - name: Preserve inspectable WATCH JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-c417-watch-radar
          path: |
            ${{ runner.temp }}/xray_research_watch_radar.json
            ${{ runner.temp }}/xray_preentry_watch.json
            ${{ runner.temp }}/xray_forward_watch_metrics.json
          retention-days: 14
          if-no-files-found: error
