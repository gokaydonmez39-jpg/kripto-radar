name: XRAY P0 CA 31 Roles Quality Complete All Exact-SHA Join
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_ca_quality_31_role_binding.py"
      - ".github/workflows/xray-p0-ca-quality-31-role-join.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resolve-incomplete-provider-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify invoking SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download immutable source-artifact event quality and CA role records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/roles" "$RUNNER_TEMP/quality"
          gh run download 38181849385 -R "${{ github.repository }}" \
            -n xray-31-ca-direct13-acquirer18-sha-bound-shadow -D "$RUNNER_TEMP/roles"
          gh run download 38182564771 -R "${{ github.repository }}" \
            -n xray-515-ca-complete-all-data-quality-shadow -D "$RUNNER_TEMP/quality"
          test -s "$RUNNER_TEMP/roles/xray_history_ca_31_roles.json"
          test -s "$RUNNER_TEMP/quality/xray_ca_515_all_complete.json"
      - name: Verify exact source lineage and negative tests in normal and optimized Python
        run: |
          python -m py_compile nasdaq-xray/p0_ca_quality_31_role_binding.py
          for flag in normal optimized; do
            opts=()
            if [ "$flag" = optimized ]; then opts=(-O); fi
            python "${opts[@]}" nasdaq-xray/p0_ca_quality_31_role_binding.py \
              --roles "$RUNNER_TEMP/roles/xray_history_ca_31_roles.json" \
              --quality "$RUNNER_TEMP/quality/xray_ca_515_all_complete.json" \
              --selftest
          done
      - name: Produce SHA bound sanitized conservative result
        run: |
          python nasdaq-xray/p0_ca_quality_31_role_binding.py \
            --roles "$RUNNER_TEMP/roles/xray_history_ca_31_roles.json" \
            --quality "$RUNNER_TEMP/quality/xray_ca_515_all_complete.json" \
            --out "$RUNNER_TEMP/xray_31_quality_role_bound.json"
      - name: Require no false historical issuer-clean state or GO
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_31_quality_role_bound.json").read_text())
          assert d["schema"]=="XRAY_P0_31_QUALITY_INCOMPLETE_EVENTS_SOURCE_JOIN_V1"
          assert d["status"]=="SHADOW_INCOMPLETE_CA_EVENTS_BOUND_TO_EXISTING_REVIEW"
          assert d["prior_direct_security_requiring_review"]==13
          assert d["prior_acquirer_cap_table_requiring_review"]==18
          assert d["outside_existing_31_count"]==0
          assert d["source_price_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],text=True).strip()
          assert d["source_master_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/canonical_current_master_manifest.json"],text=True).strip()
          assert d["canonical_HISTORY_PASS_created"]==d["C417_PRIMARY_MC_created"]==0
          assert d["R92_created"] is False and d["GO"] is False
          assert d["provider_raw_events_or_OHLCV_persisted"] is False
          print("XRAY_CA_31_QUALITY_HIDDEN_EVENTS=SHADOW_ONLY_NO_FABRICATED_PRIMARY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xray-p0-31-ca-quality-hidden-events-bound-no-go
          path: ${{ runner.temp }}/xray_31_quality_role_bound.json
          retention-days: 14
          if-no-files-found: error
