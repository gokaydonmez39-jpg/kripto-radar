name: XRAY Preopen Source and Alternative MC Readiness (Fail-Closed)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/research_preopen_source_audit.py"
      - "nasdaq-xray/preopen_live_release_gate.py"
      - "nasdaq-xray/monday_launch_microaudit.py"
      - "nasdaq-xray/monday_live_actions_attestor.py"
      - ".github/workflows/xray-preopen-source-audit.yml"
  workflow_run:
    workflows:
      - "XRAY Canonical Current Pre-MC Factory"
      - "XRAY Canonical Current Post-MC Factory"
      - "XRAY Canonical Current Final Factory"
    types: [completed]
    branches: [main]
  # Multiple independent preopen observations withstand late GitHub cron runs.
  # 12:xx UTC is EDT 08:xx; 13:xx UTC is EDT 09:xx / EST 08:xx.
  # 14:15 UTC restores a final 09:15 ET check after November DST change.
  # The Python NASDAQ calendar is always the gate; extra UTC ticks are NOT GO.
  schedule:
    - cron: "5 12 * * 1-5"
    - cron: "25 12 * * 1-5"
    - cron: "5 13 * * 1-5"
    - cron: "15 13 * * 1-5"
    - cron: "15 14 * * 1-5"
permissions:
  contents: read
  actions: read
concurrency:
  group: xray-preopen-source-audit-v1
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - name: Reject mixed commit evidence before preopen checks
        shell: bash
        env:
          XRAY_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$XRAY_EXPECTED_SHA" ]] || exit 2
          now_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ -n "$now_main" && "$now_main" == "$XRAY_EXPECTED_SHA" ]] || {
            echo "XRAY_PREOPEN_STALE_INVOCATION_SHA_FAIL_CLOSED"
            exit 2
          }
          echo "XRAY_PREOPEN_CURRENT_MAIN_SHA_EXACT=PASS"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official NASDAQ calendar for dynamic opening proof
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Monday launch root/stage/delivery/notification-chain contract microaudit
        run: |
          python -m py_compile nasdaq-xray/monday_launch_microaudit.py
          python nasdaq-xray/monday_launch_microaudit.py --selftest
          python nasdaq-xray/monday_launch_microaudit.py --out "$RUNNER_TEMP/xray_monday_launch_microaudit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_monday_launch_microaudit.json").read_text())
          assert j["schema"]=="XRAY_MONDAY_LAUNCH_STATIC_MICROAUDIT_V1"
          assert j["contract_status"]=="PASS" and not j["contract_blockers"]
          assert j["alpha_authority"] is False and j["no_real_device_receipt_claim"] is True
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          print("XRAY_MONDAY_LAUNCH_TOPOLOGY_CONTRACT=PASS_NOT_PRODUCTION_GO")
          PY
      - name: Inspect real root, stages, preopen, E2E and delivery Actions receipts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m py_compile nasdaq-xray/monday_live_actions_attestor.py
          python nasdaq-xray/monday_live_actions_attestor.py --selftest
          python nasdaq-xray/monday_live_actions_attestor.py --out "$RUNNER_TEMP/xray_monday_live_actions.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_monday_live_actions.json").read_text())
          assert j["schema"]=="XRAY_MONDAY_LIVE_ACTIONS_EXECUTION_WITNESS_V1"
          assert j["main_stable_during_observation"] is True
          assert len(j["execution_witnesses"])==8
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert not j["alpha_authority"] and not j["real_user_device_receipt_attested"]
          print("XRAY_MONDAY_LIVE_ACTIONS_REPORT=RECORDED_NOT_PROVIDER_OR_DEVICE_RELEASE")
          PY
      - name: Compile and test true positive/negative proof boundaries
        run: |
          python -m py_compile nasdaq-xray/research_preopen_source_audit.py nasdaq-xray/e2e_production_readiness.py nasdaq-xray/preopen_live_release_gate.py
          python nasdaq-xray/research_preopen_source_audit.py --selftest
          python nasdaq-xray/e2e_production_readiness.py --selftest
          python nasdaq-xray/preopen_live_release_gate.py --selftest
      - name: Verify exact current Git source blobs and blocked classifications
        run: |
          python nasdaq-xray/research_preopen_source_audit.py --output "$RUNNER_TEMP/xray_preopen_source_readiness.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          obj=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_preopen_source_readiness.json").read_text())
          assert obj["schema"]=="XRAY_PREOPEN_SOURCE_AUDIT_V1"
          assert obj["execution"]=="NONE" and obj["real_money"]=="NO-GO"
          assert obj["research_go"] is False
          assert obj["actual_device_notification_receipt_proven"] is False
          assert obj["shadow_massive_not_primary"] is True
          assert obj["non_display_license_proven_by_this_audit"] is False
          assert obj["bigdata_free_credit_availability_proven_by_this_audit"] is False
          print("XRAY_PREOPEN_SOURCE_GUARDS=PASS_NO_ALPHA_NO_REAL_MONEY_NO_LICENSE_INFERENCE")
          PY
      - name: Refresh official halt and suspension evidence in this preopen audit (ephemeral only)
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, "nasdaq-xray")
          from preopen_live_release_gate import official_window
          now=dt.datetime.now(dt.timezone.utc)
          active=official_window(now)["preopen"]
          if not active:
              print("XRAY_PREOPEN_OFFICIAL_REFRESH=SKIPPED_OUTSIDE_OFFICIAL_PREOPEN")
              raise SystemExit(0)
          subprocess.run([sys.executable,"nasdaq-xray/official_source_guard.py"],check=True)
          target=Path("nasdaq-xray/canonical_official_source_guard.json")
          guard=json.loads(target.read_text(encoding="utf-8"))
          stamp=dt.datetime.fromisoformat(guard["generated_at_utc"].replace("Z","+00:00"))
          assert stamp.tzinfo is not None
          age=(dt.datetime.now(dt.timezone.utc)-stamp).total_seconds()
          assert 0<=age<=180,"OFFICIAL_REFRESH_NOT_FRESH"
          assert guard["schema"]=="XRAY_OFFICIAL_SOURCE_GUARD_V1"
          assert guard["execution"]=="NONE" and guard["real_money"]=="NO-GO"
          assert guard["alpha_authority"] is False
          assert guard["sources"].get("trade_halts",{}).get("status") in ("PASS","UNKNOWN")
          assert guard["sources"].get("security_status",{}).get("status") in ("PASS","UNKNOWN")
          if (guard["sources"]["trade_halts"]["status"]!="PASS"
              or guard["sources"]["security_status"]["status"]!="PASS"):
              print("XRAY_PREOPEN_OFFICIAL_REFRESH=DEGRADED_FAIL_CLOSED")
          else:
              print("XRAY_PREOPEN_OFFICIAL_REFRESH=LIVE_FRESH_GUARDS_SHADOW_ONLY")
          print("XRAY_PREOPEN_OFFICIAL_REFRESH_AGE_SECONDS="+str(round(age)))
          print("XRAY_PREOPEN_OFFICIAL_REFRESH=EPHEMERAL_NOT_COMMITTED_NO_ALPHA")
          PY
      - name: Current NASDAQ official preopen truth report, never false release
        run: |
          python nasdaq-xray/preopen_live_release_gate.py --out "$RUNNER_TEMP/xray_current_preopen.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_current_preopen.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"]=="XRAY_CURRENT_PREOPEN_SOURCE_AND_DELIVERY_GATE_V1"
          assert r["execution"]=="NONE" and r["real_money"]=="NO-GO"
          assert r["real_device_receipt_verified"] is False
          assert r["r92_created"] is False and r["c417_primary_created"] is False
          assert r["alpha_promotion_authorized"] is False
          assert r["automated_orders_authorized"] is False
          assert r["no_vendor_bars_or_private_account_data_emitted"] is True
          assert isinstance(r["candidate_local_preopen_blockers"], list)
          assert r["candidate_local_research_preconditions_attested"] is (not bool(r["candidate_local_preopen_blockers"]))
          if r["candidate_local_research_preconditions_attested"]:
              assert r["registered_candidate_count"] > 0
              assert r["candidate_local_preopen_status"] == "CURRENT_R92_LOCAL_PRECONDITIONS_ONLY_NO_DEVICE_RECEIPT"
              assert r["real_device_receipt_verified"] is False
          else:
              assert r["candidate_local_preopen_status"] == "LOCAL_RESEARCH_BLOCKED_NO_GO"
              assert r["candidate_local_preopen_blockers"]
          if not r["research_source_chain_ready"]:
              assert r["status"]=="PREOPEN_BLOCKED_NO_GO" and r["blockers"]
          print("XRAY_PREOPEN_OPERATIONAL_TRUTH="+r["status"])
          PY
      - name: Upload public operational counts only
        uses: actions/upload-artifact@v4
        with:
          name: xray-preopen-source-readiness-v1
          path: |
            ${{ runner.temp }}/xray_preopen_source_readiness.json
            ${{ runner.temp }}/xray_current_preopen.json
            ${{ runner.temp }}/xray_monday_launch_microaudit.json
            ${{ runner.temp }}/xray_monday_live_actions.json
          retention-days: 14
          if-no-files-found: error
