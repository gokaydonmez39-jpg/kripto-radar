name: XRAY Preopen Source and Alternative MC Readiness (Fail-Closed)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/research_preopen_source_audit.py"
      - "nasdaq-xray/provider_automation_governance.json"
      - "nasdaq-xray/provider_automation_governance_selftest.py"
      - "nasdaq-xray/preopen_live_release_gate.py"
      - "nasdaq-xray/preopen_personal_research_receipt_guard.py"
      - "nasdaq-xray/monday_launch_microaudit.py"
      - "nasdaq-xray/all_workflow_schedule_audit.py"
      - "nasdaq-xray/repository_integrity_audit.py"
      - "nasdaq-xray/current_terminal_epoch_forensics.py"
      - "nasdaq-xray/personal_full_universe_sip_root_bridge.py"
      - "nasdaq-xray/alpaca_full_universe_30d_daily_proxy_shadow.py"
      - "nasdaq-xray/alpaca_personal_joint_260_d30_rth_shadow.py"
      - "nasdaq-xray/personal_six_gate_causal_breaker.py"
      - "nasdaq-xray/personal_sec_current_cik_shadow.py"
      - "nasdaq-xray/root_history_recovery_microaudit.py"
      - "nasdaq-xray/history_unknown_source_triage.py"
      - "nasdaq-xray/sina_state_hash_guard.py"
      - "nasdaq-xray/sina_stage.py"
      - ".github/workflows/**"
      - "nasdaq-xray/monday_live_actions_attestor.py"
      - "nasdaq-xray/delivery_issue_receipt_guard.py"
      - "nasdaq-xray/delivery_scheduler_guard.py"
      - "nasdaq-xray/delivery_scheduler_guard_selftest.py"
      - "nasdaq-xray/delivery_ledger_merge.py"
      - "nasdaq-xray/github_native_root_watchdog.py"
      - ".github/workflows/nasdaq-xray-delivery.yml"
      - ".github/workflows/xray-preopen-source-audit.yml"
  workflow_run:
    workflows:
      - "XRAY Canonical Current Pre-MC Factory"
      - "XRAY Canonical Current Post-MC Factory"
      - "XRAY Canonical Current Final Factory"
    types: [completed]
    branches: [main]
  # Multiple independent preopen observations withstand late GitHub cron runs.
  # 12:xx UTC is EDT 08:xx; 13:xx UTC is EDT 09:xx / EST 08:xx.
  # 14:15 UTC restores a final 09:15 ET check after November DST change.
  # The Python NASDAQ calendar is always the gate; extra UTC ticks are NOT GO.
  schedule:
    - cron: "5 12 * * 1-5"
    - cron: "25 12 * * 1-5"
    - cron: "5 13 * * 1-5"
    - cron: "15 13 * * 1-5"
    - cron: "15 14 * * 1-5"
permissions:
  contents: read
  actions: read
concurrency:
  group: xray-preopen-source-audit-v1
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - name: Reject mixed commit evidence before preopen checks
        id: epoch_guard
        shell: bash
        env:
          XRAY_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$XRAY_EXPECTED_SHA" ]] || {
            echo "XRAY_PREOPEN_UNEXPECTED_CHECKOUT_SHA_FAIL_CLOSED" >&2
            exit 2
          }
          now_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ -n "$now_main" ]] || {
            echo "XRAY_PREOPEN_MAIN_SHA_UNAVAILABLE_FAIL_CLOSED" >&2
            exit 2
          }
          if [[ "$now_main" != "$XRAY_EXPECTED_SHA" ]]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "XRAY_PREOPEN_STALE_INVOCATION=SAFE_NOOP_NO_EVIDENCE"
            exit 0
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "XRAY_PREOPEN_CURRENT_MAIN_SHA_EXACT=PASS"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.epoch_guard.outputs.valid == 'true'
        with:
          python-version: "3.12"
      - name: Install pinned official NASDAQ calendar and source YAML parser
        if: steps.epoch_guard.outputs.valid == 'true'
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0" "PyYAML==6.0.2"
      - name: Early exact-root personal SIP bridge adversarial selftests before provider calls
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          python nasdaq-xray/alpaca_full_universe_30d_daily_proxy_shadow.py
          python -O nasdaq-xray/alpaca_full_universe_30d_daily_proxy_shadow.py
          python nasdaq-xray/alpaca_personal_joint_260_d30_rth_shadow.py --selftest
          python -O nasdaq-xray/alpaca_personal_joint_260_d30_rth_shadow.py --selftest
          python nasdaq-xray/personal_six_gate_causal_breaker.py --selftest
          python -O nasdaq-xray/personal_six_gate_causal_breaker.py --selftest
          python nasdaq-xray/personal_sec_current_cik_shadow.py --selftest
          python -O nasdaq-xray/personal_sec_current_cik_shadow.py --selftest
          python -m py_compile nasdaq-xray/personal_full_universe_sip_root_bridge.py
          python nasdaq-xray/personal_full_universe_sip_root_bridge.py --selftest
          python -O nasdaq-xray/personal_full_universe_sip_root_bridge.py --selftest
      - name: Automatically inspect all tracked source and delivery links
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python nasdaq-xray/repository_integrity_audit.py --selftest
          PYTHONDONTWRITEBYTECODE=1 python nasdaq-xray/all_workflow_schedule_audit.py --selftest
          PYTHONDONTWRITEBYTECODE=1 python nasdaq-xray/repository_integrity_audit.py --out "$RUNNER_TEMP/xray_repo_inventory.json"
      - name: Explain exact current terminal drift without rewriting last authoritative epoch
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python nasdaq-xray/current_terminal_epoch_forensics.py --selftest
          PYTHONDONTWRITEBYTECODE=1 python nasdaq-xray/current_terminal_epoch_forensics.py --out "$RUNNER_TEMP/xray_current_terminal_epoch_forensics.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          v=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_current_terminal_epoch_forensics.json").read_text())
          assert v["schema"]=="XRAY_CURRENT_TERMINAL_EPOCH_FORENSICS_V1"
          assert v["canonical_terminal_overwritten"] is False
          assert v["current_asof_terminal_generated"] is False
          assert v["g9_approved_by_report"] is False
          assert v["r92_created_by_report"] is False
          assert v["execution"]=="NONE" and v["real_money"]=="NO-GO"
          print("XRAY_CURRENT_TERMINAL_EPOCH_CAUSAL_REPORT="+v["status"])
          PY
      - name: Verify zero-dollar BusinessQuant and Twelve backups remain fail-closed
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          python -m py_compile nasdaq-xray/provider_automation_governance_selftest.py
          python nasdaq-xray/provider_automation_governance_selftest.py
          python -O nasdaq-xray/provider_automation_governance_selftest.py
          echo "XRAY_BACKUP_BQ_TWELVE_AUTHORITY=DOCUMENTED_RESEARCH_ONLY_RUNNER_RIGHTS_NOT_ATTESTED_NO_PRIMARY"
      - name: Monday launch root/stage/delivery/notification-chain contract microaudit
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          python -m py_compile nasdaq-xray/monday_launch_microaudit.py
          python nasdaq-xray/monday_launch_microaudit.py --selftest
          python -m py_compile nasdaq-xray/delivery_issue_receipt_guard.py
          python nasdaq-xray/delivery_issue_receipt_guard.py --selftest
          python nasdaq-xray/delivery_scheduler_guard_selftest.py
          python nasdaq-xray/delivery_ledger_merge.py --selftest
          python nasdaq-xray/monday_launch_microaudit.py --out "$RUNNER_TEMP/xray_monday_launch_microaudit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_monday_launch_microaudit.json").read_text())
          assert j["schema"]=="XRAY_MONDAY_LAUNCH_STATIC_MICROAUDIT_V1"
          assert j["contract_status"]=="PASS" and not j["contract_blockers"]
          assert j["alpha_authority"] is False and j["no_real_device_receipt_claim"] is True
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          print("XRAY_MONDAY_LAUNCH_TOPOLOGY_CONTRACT=PASS_NOT_PRODUCTION_GO")
          PY
      - name: Exact-history forensic recovery + verifiable state hash regressions
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          python -m py_compile nasdaq-xray/root_history_recovery_microaudit.py nasdaq-xray/sina_state_hash_guard.py
          python nasdaq-xray/sina_state_hash_guard.py
          python nasdaq-xray/sina_transport_rescue.py
          python nasdaq-xray/root_history_recovery_microaudit.py --selftest
          python nasdaq-xray/history_unknown_source_triage.py --selftest
          python nasdaq-xray/history_unknown_source_triage.py --output "$RUNNER_TEMP/xray_history_unknown_triage.json"
          python nasdaq-xray/root_history_recovery_microaudit.py --out "$RUNNER_TEMP/xray_root_history_recovery.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_root_history_recovery.json").read_text())
          assert x["schema"]=="XRAY_ROOT_HISTORY_RECOVERY_MICROAUDIT_V1"
          triage=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_history_unknown_triage.json").read_text())
          assert triage["schema"]=="XRAY_HISTORY_UNKNOWN_SOURCE_TRIAGE_V1"
          assert triage["unknown_count"]==x["unknown_count"]
          assert triage["cursor"]==triage["classifications"]==triage["total_scope"]
          assert triage["alpha_authority"] is False
          print("XRAY_HISTORY_CURSOR_UNDERCOUNT_GUARD=PASS_EXACT_RESULTS")
          assert x["unknown_count"]==sum(x["unknown_reason_counts"].values())
          assert x["source_state_hash_integrity"] in ("PASS_DETERMINISTIC_BLOB_INTERNAL","LEGACY_HASH_NOT_INDEPENDENTLY_VERIFIABLE")
          assert x["eligible_single_round_real_provider_retries_now"]<=32
          assert not x["alpha_authority"] and not x["real_user_device_receipt_attested"]
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          print("XRAY_ROOT_HISTORY_DIAGNOSTIC=VERIFIED_COUNTS_WITHOUT_MARKET_PASS")
          PY
      - name: Complete automatic workflow schedule, privilege and licensing topology
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          python -m py_compile nasdaq-xray/all_workflow_schedule_audit.py
          python nasdaq-xray/all_workflow_schedule_audit.py --selftest
          python nasdaq-xray/all_workflow_schedule_audit.py --out "$RUNNER_TEMP/xray_all_workflow_schedule_audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_all_workflow_schedule_audit.json"
          j=json.loads(p.read_text())
          assert j["schema"]=="XRAY_ALL_GITHUB_WORKFLOW_SCHEDULE_PRIVILEGE_AUDIT_V1"
          assert j["contract_status"]=="PASS" and not j["blockers"]
          assert j["scheduled_count"]==27 and j["expected_scheduled_count"]==27 and len(j["automated_schedules"])==27
          assert j["issue_writers"]==[]  # User preference: ChatGPT-only; zero GitHub Issue writers
          assert j["alpha_authority"] is False and j["device_delivery_attested"] is False
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          print("XRAY_ALL_WORKFLOW_TRIGGER_PRIVILEGE=PASS_TOPOLOGY_NOT_DATA_GO")
          PY
      - name: Inspect real root, stages, preopen, E2E and delivery Actions receipts
        if: steps.epoch_guard.outputs.valid == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m py_compile nasdaq-xray/monday_live_actions_attestor.py
          python nasdaq-xray/monday_live_actions_attestor.py --selftest
          python nasdaq-xray/monday_live_actions_attestor.py --out "$RUNNER_TEMP/xray_monday_live_actions.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_monday_live_actions.json").read_text())
          assert j["schema"]=="XRAY_MONDAY_LIVE_ACTIONS_EXECUTION_WITNESS_V1"
          assert j["main_stable_during_observation"] is True
          assert len(j["execution_witnesses"])==17
          assert len(j["supplemental_scheduled_witnesses"])==7
          assert len(j["workflow_inventory"]["supplemental"])==7
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert not j["alpha_authority"] and not j["real_user_device_receipt_attested"]
          print("XRAY_MONDAY_LIVE_ACTIONS_REPORT=RECORDED_NOT_PROVIDER_OR_DEVICE_RELEASE")
          PY
      - name: Compile and test true positive/negative proof boundaries
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          python -m py_compile nasdaq-xray/research_preopen_source_audit.py nasdaq-xray/e2e_production_readiness.py nasdaq-xray/preopen_live_release_gate.py
          python nasdaq-xray/research_preopen_source_audit.py --selftest
          python nasdaq-xray/e2e_production_readiness.py --selftest
          python nasdaq-xray/preopen_live_release_gate.py --selftest
      - name: Verify exact current Git source blobs and blocked classifications
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          python nasdaq-xray/research_preopen_source_audit.py --output "$RUNNER_TEMP/xray_preopen_source_readiness.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          obj=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_preopen_source_readiness.json").read_text())
          assert obj["schema"]=="XRAY_PREOPEN_SOURCE_AUDIT_V1"
          assert obj["execution"]=="NONE" and obj["real_money"]=="NO-GO"
          assert obj["research_go"] is False
          assert obj["actual_device_notification_receipt_proven"] is False
          assert obj["shadow_massive_not_primary"] is True
          assert obj["non_display_license_proven_by_this_audit"] is False
          assert obj["bigdata_free_credit_availability_proven_by_this_audit"] is False
          print("XRAY_PREOPEN_SOURCE_GUARDS=PASS_NO_ALPHA_NO_REAL_MONEY_NO_LICENSE_INFERENCE")
          PY
      - name: Refresh official halt and suspension evidence in this preopen audit (ephemeral only)
        if: steps.epoch_guard.outputs.valid == 'true'
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, "nasdaq-xray")
          from preopen_live_release_gate import official_window
          now=dt.datetime.now(dt.timezone.utc)
          active=official_window(now)["preopen"]
          if not active:
              print("XRAY_PREOPEN_OFFICIAL_REFRESH=SKIPPED_OUTSIDE_OFFICIAL_PREOPEN")
              raise SystemExit(0)
          subprocess.run([sys.executable,"nasdaq-xray/official_source_guard.py"],check=True)
          target=Path("nasdaq-xray/canonical_official_source_guard.json")
          guard=json.loads(target.read_text(encoding="utf-8"))
          stamp=dt.datetime.fromisoformat(guard["generated_at_utc"].replace("Z","+00:00"))
          assert stamp.tzinfo is not None
          age=(dt.datetime.now(dt.timezone.utc)-stamp).total_seconds()
          assert 0<=age<=180,"OFFICIAL_REFRESH_NOT_FRESH"
          assert guard["schema"]=="XRAY_OFFICIAL_SOURCE_GUARD_V1"
          assert guard["execution"]=="NONE" and guard["real_money"]=="NO-GO"
          assert guard["alpha_authority"] is False
          assert guard["sources"].get("trade_halts",{}).get("status") in ("PASS","UNKNOWN")
          assert guard["sources"].get("security_status",{}).get("status") in ("PASS","UNKNOWN")
          if (guard["sources"]["trade_halts"]["status"]!="PASS"
              or guard["sources"]["security_status"]["status"]!="PASS"):
              print("XRAY_PREOPEN_OFFICIAL_REFRESH=DEGRADED_FAIL_CLOSED")
          else:
              print("XRAY_PREOPEN_OFFICIAL_REFRESH=LIVE_FRESH_GUARDS_SHADOW_ONLY")
          print("XRAY_PREOPEN_OFFICIAL_REFRESH_AGE_SECONDS="+str(round(age)))
          print("XRAY_PREOPEN_OFFICIAL_REFRESH=EPHEMERAL_NOT_COMMITTED_NO_ALPHA")
          PY
      - name: Current NASDAQ official preopen truth report, never false release
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          python nasdaq-xray/preopen_live_release_gate.py --out "$RUNNER_TEMP/xray_current_preopen.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_current_preopen.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"]=="XRAY_CURRENT_PREOPEN_SOURCE_AND_DELIVERY_GATE_V1"
          assert r["execution"]=="NONE" and r["real_money"]=="NO-GO"
          assert r["real_device_receipt_verified"] is False
          assert r["r92_created"] is False and r["c417_primary_created"] is False
          assert r["alpha_promotion_authorized"] is False
          assert r["automated_orders_authorized"] is False
          assert r["no_vendor_bars_or_private_account_data_emitted"] is True
          assert isinstance(r["candidate_local_preopen_blockers"], list)
          assert r["candidate_local_research_preconditions_attested"] is (not bool(r["candidate_local_preopen_blockers"]))
          if r["candidate_local_research_preconditions_attested"]:
              assert r["registered_candidate_count"] > 0
              assert r["candidate_local_preopen_status"] == "CURRENT_R92_LOCAL_PRECONDITIONS_ONLY_NO_DEVICE_RECEIPT"
              assert r["real_device_receipt_verified"] is False
          else:
              assert r["candidate_local_preopen_status"] == "LOCAL_RESEARCH_BLOCKED_NO_GO"
              assert r["candidate_local_preopen_blockers"]
          if not r["research_source_chain_ready"]:
              assert r["status"]=="PREOPEN_BLOCKED_NO_GO" and r["blockers"]
          print("XRAY_PREOPEN_OPERATIONAL_TRUTH="+r["status"])
          PY
      - name: Verify newest 15-Oct EOD research WATCH receipt, never AL or phone delivery
        if: steps.epoch_guard.outputs.valid == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile nasdaq-xray/preopen_personal_research_receipt_guard.py
          python nasdaq-xray/preopen_personal_research_receipt_guard.py --selftest
          python -O nasdaq-xray/preopen_personal_research_receipt_guard.py --selftest
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          target=root/"xray_preopen_research_receipt_source.json"
          output=root/"xray_preopen_research_watch_truth.json"
          repo=os.environ["GITHUB_REPOSITORY"]
          def api(endpoint):
              try:
                  call=subprocess.run(["gh","api","repos/"+repo+"/"+endpoint],
                   text=True,capture_output=True,timeout=20)
                  return json.loads(call.stdout) if call.returncode==0 else {}
              except (OSError,ValueError,subprocess.TimeoutExpired):
                  return {}
          def latest(file):
              data=api("actions/workflows/"+file+"/runs?per_page=12")
              for row in data.get("workflow_runs",[]):
                  if row.get("conclusion")=="success" and row.get("status")=="completed" and row.get("head_branch")=="main":
                      return row
              return None
          src=latest("xray-personal-full-universe-sip-coverage.yml")
          accept=latest("xray-research-operations-acceptance.yml")
          if src and accept:
              folder=root/"research_receipt"
              folder.mkdir(exist_ok=True)
              try:
                  command=["gh","run","download",str(accept["id"]),"--repo",repo,
                      "-n","xray-personal-research-operations-exact-receipt-no-al",
                      "-D",str(folder)]
                  done=subprocess.run(command,capture_output=True,timeout=50)
                  docs=list(folder.glob("*.json"))
                  if done.returncode==0 and len(docs)==1:
                      target.write_bytes(docs[0].read_bytes())
              except (OSError,subprocess.TimeoutExpired):
                  pass
          cmd=[sys.executable,"nasdaq-xray/preopen_personal_research_receipt_guard.py",
               "--out",str(output)]
          if target.is_file():
              cmd.extend(["--receipt",str(target)])
          if src:
              cmd.extend(["--source-run-id",str(src["id"])])
          subprocess.run(cmd,check=True)
          data=json.loads(output.read_text())
          assert data["schema"]=="XRAY_PREOPEN_EOD_WATCH_RECEIPT_GATE_V1"
          assert data["can_claim_opening_full_go"] is False
          assert data["independent_c417_price_dv30_attested"] is False
          assert data["independent_c417_mc_and_corporate_events_attested"] is False
          assert data["fresh_live_rth_intraday_or_g9_attested"] is False
          assert data["platform_notification_sent_by_this_audit"] is False
          assert data["iphone_delivery_receipt_attested"] is False
          assert data["registered_R92_count"]==0
          assert data["no_broker_orders"] is True
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Independent last-completed EOD research receipt (NOT opening AL)\n\n")
              f.write("Status: **"+data["status"]+"**; asof "+data["asof_et"]+
                      "; research liquidity proxy "+str(data["research_rth_proxy_count"])+
                      "; technical WATCH "+str(data["research_watch_count"])+".\n\n")
              f.write("Live intraday/G9, primary DV30/MC, registered R92 and actual iPhone receipt: **NOT ATTESTED**.\n")
          print("XRAY_PREOPEN_WATCH_RECEIPT=NO_FALSE_GO_"+data["status"])
          PY
      - name: Upload public operational counts only
        if: steps.epoch_guard.outputs.valid == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-preopen-source-readiness-v1
          path: |
            ${{ runner.temp }}/xray_preopen_source_readiness.json
            ${{ runner.temp }}/xray_current_preopen.json
            ${{ runner.temp }}/xray_preopen_research_watch_truth.json
            ${{ runner.temp }}/xray_monday_launch_microaudit.json
            ${{ runner.temp }}/xray_monday_live_actions.json
            ${{ runner.temp }}/xray_all_workflow_schedule_audit.json
            ${{ runner.temp }}/xray_root_history_recovery.json
            ${{ runner.temp }}/xray_repo_inventory.json
            ${{ runner.temp }}/xray_current_terminal_epoch_forensics.json
          retention-days: 14
          if-no-files-found: error
