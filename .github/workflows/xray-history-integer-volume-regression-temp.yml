name: XRAY HISTORY exact integer volume isolated regression TEMP
on:
  push:
    branches: [xray/history-exact-integer-volume-fence-20261015]
    paths:
      - ".github/workflows/xray-history-integer-volume-regression-temp.yml"
permissions:
  contents: read
jobs:
  negative-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned calendar (no market-data API requests)
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Compile and execute exact-session HISTORY negative controls
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/c418_history_exact_session_shadow_guard.py
          python nasdaq-xray/c418_history_exact_session_shadow_guard.py --selftest
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("nasdaq-xray/c418_history_exact_session_shadow_guard.py")
          spec=importlib.util.spec_from_file_location("c418_history",p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          legacy_fractional_ok = (type(500.25) in (int,float) and
                                  __import__("math").isfinite(500.25) and 500.25>0)
          assert legacy_fractional_ok is True, "OLD_BUG_NOT_REPRODUCIBLE"
          assert m.exact_positive_share_count(500.25) is False
          assert m.exact_positive_share_count(500.0) is True
          assert m.exact_positive_share_count(float(2**53)) is False
          assert m.exact_positive_share_count(2**53+1) is True
          print("XRAY_HISTORY_FRACTIONAL_BUG=RED_OLD_PREDICATE_GREEN_NEW_GUARD")
          print("XRAY_C418_HISTORY=SHADOW_ONLY_NO_CANONICAL_PROMOTION_NO_VENDOR_CALLS")
          PY
