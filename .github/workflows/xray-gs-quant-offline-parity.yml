name: XRAY GS Quant 2.2.2 Offline Numerical Parity (NO AL)
on:
  pull_request:
    paths:
      - 'research/test_gs_quant_parity.py'
      - '.github/workflows/xray-gs-quant-offline-parity.yml'
  push:
    branches: [main]
    paths:
      - 'research/test_gs_quant_parity.py'
      - '.github/workflows/xray-gs-quant-offline-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gs-quant-local-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed public version; no Marquee credentials
        run: python -m pip install 'gs-quant==2.2.2'
      - name: Verify independent finite series parity and shock sensitivity
        run: |
          python -m unittest discover -s research -p 'test_gs_quant_parity.py' -v
          python -O -m unittest discover -s research -p 'test_gs_quant_parity.py' -v
      - name: No institution API/no production changes
        run: echo 'RESEARCH_ONLY; NO_GS_MARQUEE; NO_BROKER; NO_AL; NO_SHEETS; NO_NOTIFICATION'
