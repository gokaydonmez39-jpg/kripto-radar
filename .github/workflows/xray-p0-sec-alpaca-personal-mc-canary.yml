name: XRAY P0 SEC Alpaca Personal MC Arithmetic Canary (No GO)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py"
      - ".github/workflows/xray-p0-sec-alpaca-personal-mc-canary.yml"
permissions:
  contents: read
jobs:
  official-no-primary-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Exact canonical invocation SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pinned official NASDAQ calendar and adversarial offline tests
        run: |
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python -m py_compile nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py
          python nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py --selftest
          python -O nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py --selftest
      - name: Measure official SEC + personal free historical SIP canary without persistence
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT || vars.XRAY_SEC_USER_AGENT }}
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          python nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py \
            --out "$RUNNER_TEMP/xray_p0_sec_alpaca_mc_canary.json"
      - name: Confirm no RAW/PRIMARY/R92/GO authority
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_p0_sec_alpaca_mc_canary.json").read_text())
          assert x["schema"]=="XRAY_P0_SEC_ALPACA_MC_PERSONAL_CANARY_SHADOW_V1"
          assert x["C417_PRIMARY_MC"] is False and x["C417_CURRENT_PRIMARY_CREATED"]==0
          assert x["R92_created"] is False and x["GO"] is False
          assert x["numeric_shares_price_or_marketcap_persisted"] is False
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          print("XRAY_P0_SEC_ALPACA_CANARY_RESULT="+x["status"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-p0-personal-sec-alpaca-mc-canary-no-primary
          path: ${{ runner.temp }}/xray_p0_sec_alpaca_mc_canary.json
          retention-days: 14
          if-no-files-found: error
