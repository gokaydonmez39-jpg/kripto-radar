name: XRAY P0 SEC Alpaca Personal MC Arithmetic Canary (No GO)
on:
  workflow_dispatch:
  # Exercise actual PR source changes without secrets or vendor calls.
  pull_request:
    paths:
      - "nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py"
      - "nasdaq-xray/p0_sec_alpaca_mc_cohort_shadow.py"
      - ".github/workflows/xray-p0-sec-alpaca-personal-mc-canary.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py"
      - ".github/workflows/xray-p0-sec-alpaca-personal-mc-canary.yml"
permissions:
  contents: read
jobs:
  official-no-primary-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Exact canonical invocation SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pinned official NASDAQ calendar and adversarial offline tests
        run: |
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python -m py_compile nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py
          python nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py --selftest
          python -O nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py --selftest
          python -m py_compile nasdaq-xray/p0_sec_alpaca_mc_cohort_shadow.py
          python nasdaq-xray/p0_sec_alpaca_mc_cohort_shadow.py --selftest
          python -O nasdaq-xray/p0_sec_alpaca_mc_cohort_shadow.py --selftest
      - name: Measure official SEC + personal free historical SIP canary without persistence
        if: ${{ github.event_name != 'pull_request' }}
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT }}
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          python nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py \
            --out "$RUNNER_TEMP/xray_p0_sec_alpaca_mc_canary.json"
      - name: Confirm no RAW/PRIMARY/R92/GO authority
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,"nasdaq-xray")
          from p0_sec_alpaca_personal_mc_canary import require_completed_source_canary
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_p0_sec_alpaca_mc_canary.json").read_text())
          print("XRAY_P0_SEC_ALPACA_CANARY_RESULT="+str(x.get("status")))
          require_completed_source_canary(x)
          print("XRAY_P0_SEC_ALPACA_CANARY_LIVE_SOURCE=MEASURED_SHADOW_ONLY_NO_PRIMARY_NO_R92")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event_name != 'pull_request' }}
        with:
          name: xray-p0-personal-sec-alpaca-mc-canary-no-primary
          path: ${{ runner.temp }}/xray_p0_sec_alpaca_mc_canary.json
          retention-days: 14
          if-no-files-found: error
