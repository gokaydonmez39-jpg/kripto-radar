name: XRAY 9-Oct New Listings Fail-Only Official PRICE Replay
on:
  push:
    branches: [audit/c417-mc-alternatives-sec-pit-20261010]
    paths:
      - "nasdaq-xray/price_official_listing_registry.json"
      - "nasdaq-xray/price_official_listing_selftest.py"
      - ".github/workflows/xray-official-new-ipo-20261009-failonly-shadow.yml"
  pull_request:
    paths:
      - "nasdaq-xray/price_official_listing_registry.json"
      - "nasdaq-xray/price_official_listing_selftest.py"
      - ".github/workflows/xray-official-new-ipo-20261009-failonly-shadow.yml"
permissions:
  contents: read
jobs:
  same-asof-three-ipo-failonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official exchange calendar and source-free import dependencies
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0" akshare
      - name: Run actual production FAIL-only helper selftest and exact current 9-Oct in-memory replay
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/price_official_listing_selftest.py nasdaq-xray/price_dv30_recover_from_fullstate.py
          python nasdaq-xray/price_official_listing_selftest.py
          git diff --exit-code -- nasdaq-xray/canonical_current_price_dv30.json nasdaq-xray/canonical_current_terminal.json
      - name: Emit counts-only witness, keep market observations out
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path("nasdaq-xray")
          reg=json.loads((root/"price_official_listing_registry.json").read_text())
          price=json.loads((root/"canonical_current_price_dv30.json").read_text())
          assert price["asof_et"]=="2026-10-09"
          expected={"AIOK","RTSN","TRXB"}
          assert price["unknown_symbols"]==["AIOK","GRAL","RTSN","TRXB"]
          assert all(reg["records"][x]["first_trade_date"]=="2026-10-09" for x in expected)
          assert all(reg["records"][x]["source_url"].startswith("https://") for x in expected)
          assert set(price["pass_symbols"]).isdisjoint(expected)
          assert len(price["pass_symbols"])==514
          payload={
            "schema":"XRAY_20261009_NEW_IPO_FAIL_ONLY_CI_V1",
            "git_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "canonical_price_git_blob_sha":subprocess.check_output(
              ["git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],text=True).strip(),
            "asof_et":"2026-10-09",
            "listing_symbols_fail_only_if_replayed":sorted(expected),
            "listing_count":3,
            "canonical_pass_before_replay":514,
            "canonical_unknown_before_replay":4,
            "gral_remains_unknown":True,
            "actual_canonical_written":False,
            "provider_entitlement_proven":False,
            "primary_mc_authority":False,
            "canonical_history_authority":False,
            "alpha_authority":False,
            "execution":"NONE","real_money":"NO-GO","unknown_never_pass":True
          }
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"ipo_three_failonly_counts.json").write_text(
              json.dumps(payload,sort_keys=True,indent=2)+chr(10))
          print("XRAY_OFFICIAL_IPO_FAIL_ONLY=PASS_3_REAL_PRICE_UNKNOWN_NO_GRAL_PASS_NO_SOURCE_AUTHORITY")
          PY
      - name: Upload only bounded official-replay witness
        uses: actions/upload-artifact@v4
        with:
          name: xray-20261009-official-three-ipo-failonly-proof
          path: ${{ runner.temp }}/ipo_three_failonly_counts.json
          retention-days: 14
          if-no-files-found: error
