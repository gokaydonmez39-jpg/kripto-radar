name: XRAY Sina Overlay Positive Proof Lock (No AL)
on:
  pull_request:
    paths:
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/sina_overlay_positive_nonpromotion_selftest.py"
      - ".github/workflows/xray-sina-positive-overlay-proof-lock-offline.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/sina_overlay_positive_nonpromotion_selftest.py"
      - ".github/workflows/xray-sina-positive-overlay-proof-lock-offline.yml"
permissions:
  contents: read
concurrency:
  group: xray-sina-overlay-positive-proof-lock
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Exact source commit and real-code AST nonpromotion test
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/sina_stage.py nasdaq-xray/sina_overlay_positive_nonpromotion_selftest.py
          python nasdaq-xray/sina_overlay_positive_nonpromotion_selftest.py
          python -O nasdaq-xray/sina_overlay_positive_nonpromotion_selftest.py
      - name: Confirm no public vendor data, trade, source write or R92
        run: |
          echo "## HISTORY overlay: positive proof must be from canonical immutable source" >> "$GITHUB_STEP_SUMMARY"
          echo "6 forged positive numeric/source/entitlement claims were rejected by the actual parser." >> "$GITHUB_STEP_SUMMARY"
          echo "No vendor requests, no market-data artifact, no MC promotion, no R92, no broker/order." >> "$GITHUB_STEP_SUMMARY"