name: XRAY NASDAQ PurgedCV + XNAS Independent Science CI (NO AL)
on:
  pull_request:
    paths:
      - 'research/test_nasdaq_purgedcv_xnas.py'
      - '.github/workflows/xray-nasdaq-purgedcv-xnas.yml'
  push:
    branches: [main]
    paths:
      - 'research/test_nasdaq_purgedcv_xnas.py'
      - '.github/workflows/xray-nasdaq-purgedcv-xnas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-quant-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin MIT purgedcv source, use NASDAQ calendar 4.x
        run: |
          python -m pip install 'exchange_calendars>=4.7,<5' 'git+https://github.com/landtml/purgedcv.git@aee3396422192d18bc30d376dfe9e31b2399abab'
      - name: Independent no-leakage and XNAS DST/early-close adversarial tests
        run: |
          python -m unittest discover -s research -p 'test_nasdaq_purgedcv_xnas.py' -v
          python -O -m unittest discover -s research -p 'test_nasdaq_purgedcv_xnas.py' -v
      - name: No auth, no market calls, no orders, no alerts
        run: echo 'NO_SECRETS; NO_ORDERS; NO_PRODUCTION_AL; NO_PRIVATE_SHEET_WRITE; NO_PUSH'
