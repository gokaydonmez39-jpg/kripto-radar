name: XRAY Research Candidate Delivery

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/chatgpt_canonical_state_v2.json"
      - "nasdaq-xray/delivery_prepare.py"
      - ".github/workflows/nasdaq-xray-delivery.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nasdaq-xray-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare fail-closed registered research alert
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          out=$(python nasdaq-xray/delivery_prepare.py)
          echo "$out"
          if echo "$out" | grep -q "XRAY_DELIVERY_READY=PASS"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create deduplicated research candidate issue
        if: steps.prep.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          delivery_key=$(python -c 'import json; print(json.load(open("nasdaq-xray/material_alert_meta.json"))["delivery_key"])')
          ticker=$(python -c 'import json; print(json.load(open("nasdaq-xray/material_alert_meta.json"))["symbol"])')
          title="[XRAY RESEARCH AL ADAYI] $ticker — $delivery_key"
          existing=$(gh issue list --state all --search "$delivery_key in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Research candidate issue already exists: #$existing"
          else
            gh issue create --title "$title" --body-file nasdaq-xray/material_alert_issue.md --label "xray-signal" ||             gh issue create --title "$title" --body-file nasdaq-xray/material_alert_issue.md
          fi

      - name: Delivery noop is healthy
        if: steps.prep.outputs.ready != 'true'
        run: echo "XRAY_DELIVERY_HEALTH=PASS_NO_REGISTERED_CANDIDATE"
