              symbols=["GRAL","TLAC","WQEY"]
              sh=hashlib.sha256("\n".join(symbols).encode()).hexdigest()
              q={
                "schema":"XRAY_RESOLVER_EPOCH_REQUEST_V1","status":"READY",
                "task_id":r.TASK_ID,"execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
                "asof_et":"2026-10-05","queue_hash":"Q",
                "compiled_policy_blob_sha":"16c50cc8f887a5234a4be23862d7c8d0e564b0ac",
                "compiled_policy_hash":"68684c130849016dd5148c1afdaa888766dc8070506af892420e493629a92fa4",
                "compiled_policy_version":"C4.17","source_price_blob_sha":psha,
                "symbols":symbols,"symbol_count":3,"symbol_hash":sh,
                "price_unknown_symbols":[],"price_blocked_symbols":symbols,
              }
              req.write_text(json.dumps(q,sort_keys=True)+"\n")
              rqsha=bsha(req)
              cm={
                "schema":"XRAY_RESOLVER_REQUEST_CHUNK_MANIFEST_V1",
                "task_id":r.TASK_ID,"execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
                "asof_et":"2026-10-05","request_blob_sha":rqsha,"queue_hash":"Q",
                "symbol_hash":sh,"symbol_count":3,"coverage_complete":True,
              }
              manifest.write_text(json.dumps(cm,sort_keys=True)+"\n")
              msha=bsha(manifest)
              bridge={
                "symbols":symbols,"symbol_count":3,"symbol_hash":sh,
                "price_unknown_symbols":[],"price_blocked_symbols":symbols,
                "source_price_blob_sha":psha,"source_request_blob_sha":rqsha,
