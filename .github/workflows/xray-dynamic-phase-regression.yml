name: XRAY Dynamic Phase Regression

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/price_dv30_phase.py"
      - "nasdaq-xray/build_current_resolver_request.py"
      - "nasdaq-xray/price_dv30_recover_from_fullstate.py"
      - "nasdaq-xray/history_phase.py"
      - "nasdaq-xray/legal_phase.py"
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/master_sec_spac_proof_20261005.json"
      - "nasdaq-xray/alpha_semantics.py"
      - "nasdaq-xray/stage1_shadow.py"
      - "nasdaq-xray/regime_breadth_shadow.py"
      - "nasdaq-xray/deep_pre_r1_shadow.py"
      - "nasdaq-xray/family_c_engine.py"
      - "nasdaq-xray/final_tech_shadow.py"
      - "nasdaq-xray/build_candidate_legal_guard.py"
      - "nasdaq-xray/sec_ticker_cik_cache.json"
      - "nasdaq-xray/build_current_event_request.py"
      - "nasdaq-xray/build_current_event_state.py"
      - "nasdaq-xray/build_current_terminal.py"
      - "nasdaq-xray/recover_pre_mc_snapshot.py"
      - "nasdaq-xray/test_alpha_semantics.py"
      - "nasdaq-xray/test_deep_repair_regressions.py"
      - ".github/workflows/xray-canonical-current-pre-mc.yml"
      - ".github/workflows/xray-canonical-current-final.yml"
      - ".github/workflows/xray-canonical-current-post-mc.yml"
      - ".github/workflows/xray-dynamic-phase-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-dynamic-phase-regression
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install regression runtime
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt

      - name: Compile dynamic phase scripts
        run: |
          python -m py_compile \
            nasdaq-xray/sina_stage.py \
            nasdaq-xray/price_dv30_phase.py \
            nasdaq-xray/build_current_resolver_request.py \
            nasdaq-xray/price_dv30_recover_from_fullstate.py \
            nasdaq-xray/history_phase.py \
            nasdaq-xray/legal_phase.py \
            nasdaq-xray/alpha_semantics.py \
            nasdaq-xray/stage1_shadow.py \
            nasdaq-xray/regime_breadth_shadow.py \
            nasdaq-xray/deep_pre_r1_shadow.py \
            nasdaq-xray/family_c_engine.py \
            nasdaq-xray/final_tech_shadow.py \
            nasdaq-xray/build_candidate_legal_guard.py \
            nasdaq-xray/build_current_event_request.py \
            nasdaq-xray/build_current_event_state.py \
            nasdaq-xray/build_current_terminal.py \
            nasdaq-xray/recover_pre_mc_snapshot.py \
            nasdaq-xray/test_alpha_semantics.py \
            nasdaq-xray/test_deep_repair_regressions.py
      - name: Assert discovery price floor cannot exceed canonical floor
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"nasdaq-xray")
          import sina_stage as s
          assert s.HARD_PRICE==5.0,s.HARD_PRICE
          assert s.DISCOVERY_PRICE_FLOOR<=s.HARD_PRICE,(s.DISCOVERY_PRICE_FLOOR,s.HARD_PRICE)
          print("DISCOVERY_PRICE_FLOOR_BOUND=PASS")
          PY

      - name: Assert pointer-bound prior settlement core fallback
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,sys,tempfile
          sys.path.insert(0,"nasdaq-xray")
          import build_current_resolver_request as m
          with tempfile.TemporaryDirectory() as td:
              repo=pathlib.Path(td)/"repo"; root=repo/"nasdaq-xray"; root.mkdir(parents=True)
              exact={
                "schema":"XRAY_RESOLVER_EPOCH_RESULT_V1","status":"COMMITTED",
                "task_id":m.TASK,"execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
                "asof_et":"2026-10-02","settlement_status":"PASS","compiled_policy_version":"C4.17",
                "settlement_symbols":["AAPL","NVDA","MSFT"]
              }
              payload=json.dumps(exact,sort_keys=True)+"\n"
              b=payload.encode(); sha=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
              # Pointer path has drifted, but an immutable exact-SHA archive exists.
              current=root/"prior_bridge.json"; current.write_text(payload+"DRIFT")
              archive=root/"pointer_evidence_archive"/(sha+".json")
              archive.parent.mkdir(parents=True); archive.write_text(payload)
              pointer=root/"pointer.json"
              pointer.write_text(json.dumps({
                "schema":"XRAY_GITHUB_DURABLE_STATE_V3","authority":"GITHUB_CURRENT_POINTER",
                "state_json":{"task_id":m.TASK,"asof_et":"2026-10-02",
                  "settlement_resolver_evidence":{"path":"nasdaq-xray/prior_bridge.json","blob_sha":sha,
                    "asof_et":"2026-10-02","settlement_status":"PASS"}}
              }))
              old_root,old_ptr=m.ROOT,m.POINTER
              try:
                  m.ROOT=root;m.POINTER=pointer
                  core,path,got=m.prior_core_symbol("2026-10-02")
                  assert core=="MSFT",(core,path,got)
                  assert path=="nasdaq-xray/pointer_evidence_archive/"+sha+".json",(core,path,got)
                  assert got==sha,(core,path,got)
              finally:
                  m.ROOT,m.POINTER=old_root,old_ptr
          print("POINTER_SETTLEMENT_CORE_FALLBACK=PASS")
          PY

      - name: Assert old stricter PRICE pass survives corrected floor
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"nasdaq-xray")
          import price_dv30_recover_from_fullstate as r
          assert r.monotonic_legacy_pass_reusable({"price":">10","dv30":">=50000000 exact30 median"}) is True
          assert r.monotonic_legacy_pass_reusable({"price":">=5","dv30":">=50000000 exact30 median"}) is False
          assert r.monotonic_legacy_pass_reusable({"price":">10","dv30":">=60000000 exact30 median"}) is False
          print("MONOTONIC_LEGACY_PRICE_PASS_REUSE=PASS")
          PY

      - name: Assert identity-only replay preserves exact same-policy PRICE baseline
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"nasdaq-xray")
          import price_dv30_recover_from_fullstate as r

          asof="2026-10-06"
          queue=["A","B","C"]
          full={
            "asof_et":asof,
            "queue_hash":"fixture_queue_hash",
            "queue":queue,
            "raw_identity_total":99,
            "unknown_count":96,
          }
          prior={
            "schema":"XRAY_CANONICAL_PRICE_DV30_V1",
            "task_id":r.TASK_ID,
            "asof_et":asof,
            "execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
            "source_master_queue_hash":"fixture_queue_hash",
            "source_master_count":3,
            "thresholds":{"price":">=5","dv30":">=50000000 exact30 median"},
            "gate_order":["PRICE","DV30"],
            "counts":{"PASS_PRICE_DV30":1,"FAIL_DV30":1,"BLOCK_CURRENT_RUN":1},
            "unknown_count":0,"unknown_symbols":[],
            "blocked_count":1,"blocked_symbols":["C"],
            "pass_count":1,"pass_symbols":["A"],
            "results":{
              "A":{"status":"PASS_PRICE_DV30"},
              "B":{"status":"FAIL_DV30"},
              "C":{"status":"BLOCK_CURRENT_RUN"},
            },
          }
          assert r.current_price_baseline_valid(prior,full,asof,queue) is True
          # Identity metadata may change while the PRICE queue remains byte-semantically identical.
          full2=dict(full,raw_identity_total=120,unknown_count=117)
          assert r.current_price_baseline_valid(prior,full2,asof,queue) is True
          # Any PRICE-scope drift must disable reuse and force a fresh fail-closed replay.
          assert r.current_price_baseline_valid(prior,dict(full2,queue_hash="changed"),asof,queue) is False
          assert r.current_price_baseline_valid(prior,full2,asof,queue+["D"]) is False
          stale=dict(prior,thresholds={"price":">10","dv30":">=50000000 exact30 median"})
          assert r.current_price_baseline_valid(stale,full2,asof,queue) is False
          wf=Path(".github/workflows/xray-canonical-current-pre-mc.yml").read_text()
          assert "Select exact same-policy PRICE baseline after identity replay" in wf
          assert "steps.price_baseline.outputs.reuse == 'true'" in wf
          print("IDENTITY_REPLAY_EXACT_PRICE_BASELINE_REUSE=PASS")
          PY

      - name: Assert global ASOF sentinel is fail-closed and performance-only
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"nasdaq-xray")
          import price_dv30_recover_from_fullstate as r
          exp=["2026-09-01"]*29+["2026-10-06"]
          redo=["AAPL","MSFT","NVDA"]+[f"S{i}" for i in range(3001)]
          assert not hasattr(r,"nasdaq"),"NASDAQ_WEB_PROVIDER_MUST_REMAIN_REMOVED"
          fast,meta=r.global_asof_sentinel_nonterminal(redo,"2026-10-06",exp)
          assert fast is False,(fast,meta)
          assert meta["status"]=="DISABLED_NO_SINGLE_SOURCE_GLOBAL_SENTINEL",meta
          assert meta["reason"]=="NASDAQ_WEB_AUTOMATION_DISABLED_NORMAL_FAIL_CLOSED_PATH_REQUIRED",meta
          assert meta["no_pass_or_fail_created"] is True,meta
          fast2,meta2=r.global_asof_sentinel_nonterminal(["AAPL","MSFT"],"2026-10-06",exp)
          assert fast2 is False,(fast2,meta2)
          assert meta2==meta,(meta2,meta)
          print("GLOBAL_ASOF_SENTINEL_DISABLED_FAIL_CLOSED=PASS")
          PY

      - name: Assert PRICE publication lag recheck is fail-closed and local
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"nasdaq-xray")
          import price_dv30_recover_from_fullstate as r
          asof="2026-10-06"
          exp=[f"2026-09-{d:02d}" for d in range(1,30)]+[asof]
          px={
            "schema":"XRAY_CANONICAL_PRICE_DV30_V1","asof_et":asof,
            "execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
            "source_master_count":3,"thresholds":{"price":">=5","dv30":">=50000000 exact30 median"},
            "gate_order":["PRICE","DV30"],"counts":{"UNKNOWN":3},
            "pass_count":0,"blocked_count":0,"unknown_count":3,
            "global_asof_sentinel_fast_fail":True,
            "global_asof_sentinel":{"status":"GLOBAL_SENTINELS_NONTERMINAL"},
            "results":{x:{"status":"UNKNOWN","provenance":"GLOBAL_ASOF_SENTINEL_FAIL_CLOSED",
              "info":{"reason":"GLOBAL_ASOF_SENTINEL_NONTERMINAL_FAIL_CLOSED"}} for x in ("AAPL","MSFT","NVDA")},
          }
          assert r.publication_lag_artifact(px,asof) is True
          assert r.publication_lag_artifact(dict(px,global_asof_sentinel_fast_fail=False),asof) is False
          assert not hasattr(r,"nasdaq"),"NASDAQ_WEB_PROVIDER_MUST_REMAIN_REMOVED"
          started,meta=r.publication_recheck(asof,exp)
          assert started is False,(started,meta)
          assert meta["status"]=="DISABLED_NO_SINGLE_SOURCE_GLOBAL_SENTINEL",meta
          assert meta["no_pass_or_fail_created"] is True,meta
          assert r.should_defer_redo_to_bridge("CURRENT_PRICE_ARTIFACT",True,False) is True
          assert r.should_defer_redo_to_bridge("CURRENT_PRICE_ARTIFACT",True,True) is False
          print("PRICE_PUBLICATION_LAG_RECHECK=PASS")
          PY

      - name: Assert incomplete PRICE snapshot routes to resolver, not corruption recovery
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"nasdaq-xray")
          import price_dv30_recover_from_fullstate as r
          px={
            "asof_et":"2026-10-05","execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
            "source_master_count":3,"source_master_queue_hash":"Q",
            "counts":{"PASS_PRICE_DV30":1,"UNKNOWN":1,"BLOCK_CURRENT_RUN":1},
            "results":{"PASS":{},"U":{},"B":{}},
            "pass_count":1,"pass_symbols":["PASS"],
            "unknown_count":1,"unknown_symbols":["U"],
            "blocked_count":1,"blocked_symbols":["B"],
          }
          assert r.price_snapshot_integrity(px,"2026-10-05") is True,px
          broken=dict(px,counts={"PASS_PRICE_DV30":1,"UNKNOWN":1})
          assert r.price_snapshot_integrity(broken,"2026-10-05") is False,broken
          base={
            "schema":"XRAY_RESOLVER_EPOCH_RESULT_V1","status":"COMMITTED",
            "task_id":r.TASK_ID,"execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
            "asof_et":"2026-10-05","queue_hash":"Q","compiled_policy_version":"C4.17",
            "compiled_policy_hash":"68684c130849016dd5148c1afdaa888766dc8070506af892420e493629a92fa4",
            "source_price_blob_sha":"P","price_resolutions":{},
            "price_resolution_compact":{"block_current_run":{"U":{"reason":"X"}}},
          }
          assert r.bridge_refresh_relevant(px,base,"2026-10-05","P") is True
          px_after=dict(px,unknown_count=0,unknown_symbols=[],blocked_count=2,blocked_symbols=["U","B"],
                        counts={"PASS_PRICE_DV30":1,"BLOCK_CURRENT_RUN":2})
          assert r.bridge_refresh_relevant(px_after,base,"2026-10-05","P") is False
          terminal=dict(base,price_resolution_compact={},terminal_overrides={"B":{"decision":"FAIL_DV30"}})
          assert r.bridge_refresh_relevant(px_after,terminal,"2026-10-05","P") is True
          assert r.bridge_replacement_allowed("UNKNOWN","BLOCK_CURRENT_RUN") is True
          assert r.bridge_replacement_allowed("BLOCK_CURRENT_RUN","FAIL_DV30") is True
          assert r.bridge_replacement_allowed("BLOCK_CURRENT_RUN","BLOCK_CURRENT_RUN") is False
          assert r.bridge_replacement_allowed("PASS_PRICE_DV30","FAIL_DV30") is False
          assert r.should_defer_redo_to_bridge("FULL_STATE",True) is False
          assert r.should_defer_redo_to_bridge("CURRENT_PRICE_ARTIFACT",True) is True
          assert r.should_defer_redo_to_bridge("PRIOR_PRICE_ARTIFACT",True) is True
          v2_block=r.expand_rallies_scanner_exact30_v2({
            "fail_price":{},"fail_dv30":{},"pass_price_dv30":{},
            "block_current_run":{"U":{
              "reason":"CROSS_SOURCE_CURRENT_ASOF_ALIGNMENT_UNPROVEN",
              "observed_usable_sessions":29,
              "corroboration":"TEST","no_synthetic_bar":True,
            }},
            "unresolved_symbols":[],
          },["U"])
          assert v2_block["U"]["decision"]=="BLOCK_CURRENT_RUN",v2_block
          assert r.valid_bridge_price_resolution(v2_block["U"],"2026-10-05") is True,v2_block
          v2_pass=r.expand_rallies_scanner_exact30_v2({
            "fail_price":{},"fail_dv30":{},
            "pass_price_dv30":{"P":{"price":10.0,"dv30":60000000.0,"known_session_count":30}},
            "block_current_run":{},"unresolved_symbols":[],
          },["P"])
          assert v2_pass["P"]["decision"]=="PASS_PRICE_DV30",v2_pass
          assert r.valid_bridge_price_resolution(v2_pass["P"],"2026-10-05") is True,v2_pass
          stable_a={
            "schema":"XRAY_CANONICAL_PRICE_DV30_V1","task_id":r.TASK_ID,"asof_et":"2026-10-05",
            "execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
            "source_master_queue_hash":"Q","source_master_count":1,
            "expected30":["D"],"gate_order":["PRICE","DV30"],
            "thresholds":{"price":">=5","dv30":">=50000000 exact30 median"},
            "counts":{"BLOCK_CURRENT_RUN":1},"unknown_count":0,"unknown_symbols":[],
            "blocked_count":1,"blocked_symbols":["X"],"pass_count":0,"pass_symbols":[],
            "pass_hash":r.hashlib.sha256(b"").hexdigest(),
            "results":{"X":{"status":"BLOCK_CURRENT_RUN","info":{"reason":"R"},"provenance":"A"}},
            "exception_bridge_meta":{"status":"A"},
          }
          stable_b={**stable_a,
            "results":{"X":{"status":"BLOCK_CURRENT_RUN","info":{"reason":"R"},"provenance":"B",
                            "block_recovery_attempt":{"status":"UNRESOLVED"}}},
            "exception_bridge_meta":{"status":"B"}}
          assert r.price_decision_semantic_view(stable_a)==r.price_decision_semantic_view(stable_b)
          changed={**stable_b,"results":{"X":{"status":"FAIL_DV30","info":{"reason":"R"},"provenance":"B"}}}
          assert r.price_decision_semantic_view(stable_a)!=r.price_decision_semantic_view(changed)
          changed_info={**stable_b,"results":{"X":{"status":"BLOCK_CURRENT_RUN","info":{"reason":"R2"},"provenance":"B"}}}
          assert r.price_decision_semantic_view(stable_a)!=r.price_decision_semantic_view(changed_info)
          deferred={
            "schema":"XRAY_CANONICAL_PRICE_DV30_V1","asof_et":"2026-10-05",
            "execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
            "source_master_count":3001,
            "thresholds":{"price":">=5","dv30":">=50000000 exact30 median"},
            "gate_order":["PRICE","DV30"],
            "counts":{"UNKNOWN":3001},"pass_count":0,"blocked_count":0,"unknown_count":3001,
            "results":{f"S{i}":{"status":"UNKNOWN","provenance":"DYNAMIC_BRIDGE_DEFERRED"} for i in range(3001)},
          }
          assert r.deferred_bootstrap_artifact(deferred,"2026-10-05") is True
          deferred["results"]["S0"]["provenance"]="FULLSTATE_ZERO_DOLLAR_EXACT30"
          assert r.deferred_bootstrap_artifact(deferred,"2026-10-05") is False
          from pathlib import Path
          wf=Path(".github/workflows/xray-canonical-current-pre-mc.yml").read_text()
          assert "deferred_bootstrap_artifact(px,latest_completed)" in wf
          assert "REBUILD_DEFERRED_DV30_BOOTSTRAP" in wf
          print("PRICE_RESOLVER_INCOMPLETE_SNAPSHOT_ROUTING=PASS")
          PY

      - name: Assert resolver authority uniqueness is scoped by role
        run: |
          python - <<'PY'
          import sys,tempfile
          from pathlib import Path
          sys.path.insert(0,"nasdaq-xray")
          import build_current_resolver_request as r
          td=Path(tempfile.mkdtemp())
          residual=(td/"residual.json",{
            "authority":"CANONICAL_RESOLVER_RESIDUAL",
            "source_price_path":"nasdaq-xray/canonical_current_price_dv30.json",
            "source_price_blob_sha":"current-price",
            "source_request_path":"nasdaq-xray/canonical_current_resolver_request.json",
            "source_request_blob_sha":"current-request",
          })
          handoff=(td/"handoff.json",{
            "authority":"C417_DV30_FULL_SCOPE_MC_HANDOFF_V4",
            "bridge_role":"FULL_SCOPE_MC_HANDOFF_PROVENANCE",
            "source_price_path":"nasdaq-xray/canonical_current_price_dv30.json",
            "source_price_blob_sha":"current-price",
          })
          got=r.select_current_policy_resolver_bridge([residual,handoff],"current-price","current-request")
          assert got is residual,got
          assert r._resolver_role(residual[1])=="CURRENT_RESIDUAL_REQUEST_AUTHORITY"
          assert r._resolver_role(handoff[1])=="FULL_SCOPE_MC_HANDOFF_AUTHORITY"
          stale=(td/"stale.json",{
            "authority":"STALE_RESIDUAL",
            "source_price_path":"nasdaq-xray/canonical_current_price_dv30.json",
            "source_price_blob_sha":"old-price",
            "source_request_path":"nasdaq-xray/canonical_current_resolver_request.json",
            "source_request_blob_sha":"old-request",
          })
          assert r.select_current_policy_resolver_bridge([stale,handoff],"current-price","current-request") is None
          try:
              r.select_current_policy_resolver_bridge(
                [residual,(td/"residual2.json",dict(residual[1],authority="OTHER_RESIDUAL"))],
                "current-price","current-request")
          except AssertionError as e:
              assert "AMBIGUOUS_CURRENT_POLICY_RESOLVER_BRIDGE_EXACT_PRICE" in str(e),e
          else:
              raise AssertionError("same-role exact duplicate must fail closed")
          print("RESOLVER_ROLE_SCOPED_AUTHORITY=PASS")
          PY

      - name: Assert no frozen 20260930 ASOF constants
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[
            Path("nasdaq-xray/price_dv30_phase.py"),
            Path("nasdaq-xray/price_dv30_recover_from_fullstate.py"),
            Path("nasdaq-xray/history_phase.py"),
            Path("nasdaq-xray/legal_phase.py"),
            Path("nasdaq-xray/stage1_shadow.py"),
            Path("nasdaq-xray/regime_breadth_shadow.py"),
            Path("nasdaq-xray/deep_pre_r1_shadow.py"),
            Path("nasdaq-xray/family_c_engine.py"),
            Path("nasdaq-xray/final_tech_shadow.py"),
            Path("nasdaq-xray/build_current_event_request.py"),
            Path("nasdaq-xray/build_current_terminal.py"),
          ]
          bad=[]
          for p in paths:
            t=p.read_text()
            if 'ASOF="2026-09-30"' in t or "ASOF='2026-09-30'" in t:
              bad.append(str(p))
          assert not bad,bad
          print("DYNAMIC_ASOF_STATIC_GATE=PASS")
          PY
      - name: Assert prelegal workflow uses Git-compatible blob and scope hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path(".github/workflows/xray-canonical-current-final.yml").read_text()
          assert 'return hashlib.sha1(f"blob {len(b)}\\0".encode()+b).hexdigest()' in t
          assert 'return hashlib.sha1(f"blob {len(b)}\\\\0".encode()+b).hexdigest()' not in t
          assert 'h=hashlib.sha256(("\\n".join(symbols)+"\\n").encode()).hexdigest()' in t
          assert 'h=hashlib.sha256(("\\\\n".join(symbols)+"\\\\n").encode()).hexdigest()' not in t
          print("PRELEGAL_WORKFLOW_HASH_BINDING=PASS")
          PY

      - name: Run deterministic alpha semantics regression
        run: |
          python nasdaq-xray/test_alpha_semantics.py
          python nasdaq-xray/test_deep_repair_regressions.py

      - name: Assert frozen technical failures outrank transient watch states
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"nasdaq-xray")
          import pandas as pd
          import final_tech_shadow as ft
          dates=pd.bdate_range("2025-01-02",periods=300)
          d=pd.DataFrame({"date":dates,"open":[100.0]*300,"high":[103.0]*300,
                          "low":[99.0]*300,"close":[102.0]*300,"volume":[1_000_000.0]*300})
          ti=len(d)-2
          d.loc[d.index[-1],["open","high","low","close"]]=[109.0,112.0,108.0,110.0]
          td=d.date.iloc[ti].date().isoformat()
          base={"setup_id":"TEST","symbol":"TEST","family":"D","trigger_date":td,
                "A":10.0,"P":100.0,"anchor":97.0,"entry_low":100.0,"entry_high":102.5,
                "entry_model":102.5,"chase_limit":105.0,"S0":95.0,"T1":110.0,
                "anchor_available_idx":ti-1,
                "anchor_available_date":d.date.iloc[ti-1].date().isoformat(),
                "target_source":"TEST_STRUCTURAL","target_zone":None,"target_overlap":False,
                "synthetic_target":False,
                "source_geometry":{"trigger_date":td,"P":100.0,"anchor":97.0}}
          rr=ft.eval_one("TEST","D",base["source_geometry"],d,"CLEAN_DISCOVERY",
                         frozen=base,recorded_before=True)
          assert rr["lifecycle"]=="CHASE_NO_VALID_FILL",rr
