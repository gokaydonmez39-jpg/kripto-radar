name: XRAY Dynamic Phase Regression

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/price_dv30_phase.py"
      - "nasdaq-xray/build_current_resolver_request.py"
      - "nasdaq-xray/price_dv30_recover_from_fullstate.py"
      - "nasdaq-xray/history_phase.py"
      - "nasdaq-xray/legal_phase.py"
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/alpha_semantics.py"
      - "nasdaq-xray/stage1_shadow.py"
      - "nasdaq-xray/regime_breadth_shadow.py"
      - "nasdaq-xray/deep_pre_r1_shadow.py"
      - "nasdaq-xray/family_c_engine.py"
      - "nasdaq-xray/final_tech_shadow.py"
      - "nasdaq-xray/build_candidate_legal_guard.py"
      - "nasdaq-xray/sec_ticker_cik_cache.json"
      - "nasdaq-xray/build_current_event_request.py"
      - "nasdaq-xray/build_current_terminal.py"
      - "nasdaq-xray/recover_pre_mc_snapshot.py"
      - "nasdaq-xray/test_alpha_semantics.py"
      - "nasdaq-xray/test_deep_repair_regressions.py"
      - ".github/workflows/xray-canonical-current-pre-mc.yml"
      - ".github/workflows/xray-canonical-current-final.yml"
      - ".github/workflows/xray-canonical-current-post-mc.yml"
      - ".github/workflows/xray-dynamic-phase-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-dynamic-phase-regression
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install regression runtime
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt

      - name: Compile dynamic phase scripts
        run: |
          python -m py_compile \
            nasdaq-xray/sina_stage.py \
            nasdaq-xray/price_dv30_phase.py \
            nasdaq-xray/build_current_resolver_request.py \
            nasdaq-xray/price_dv30_recover_from_fullstate.py \
            nasdaq-xray/history_phase.py \
            nasdaq-xray/legal_phase.py \
            nasdaq-xray/alpha_semantics.py \
            nasdaq-xray/stage1_shadow.py \
            nasdaq-xray/regime_breadth_shadow.py \
            nasdaq-xray/deep_pre_r1_shadow.py \
            nasdaq-xray/family_c_engine.py \
            nasdaq-xray/final_tech_shadow.py \
            nasdaq-xray/build_candidate_legal_guard.py \
            nasdaq-xray/build_current_event_request.py \
            nasdaq-xray/build_current_terminal.py \
            nasdaq-xray/recover_pre_mc_snapshot.py \
            nasdaq-xray/test_alpha_semantics.py \
            nasdaq-xray/test_deep_repair_regressions.py
      - name: Assert discovery price floor cannot exceed canonical floor
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"nasdaq-xray")
          import sina_stage as s
          assert s.HARD_PRICE==5.0,s.HARD_PRICE
          assert s.DISCOVERY_PRICE_FLOOR<=s.HARD_PRICE,(s.DISCOVERY_PRICE_FLOOR,s.HARD_PRICE)
          print("DISCOVERY_PRICE_FLOOR_BOUND=PASS")
          PY

      - name: Assert pointer-bound prior settlement core fallback
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,sys,tempfile
          sys.path.insert(0,"nasdaq-xray")
          import build_current_resolver_request as m
          with tempfile.TemporaryDirectory() as td:
              repo=pathlib.Path(td)/"repo"; root=repo/"nasdaq-xray"; root.mkdir(parents=True)
              exact={
                "schema":"XRAY_RESOLVER_EPOCH_RESULT_V1","status":"COMMITTED",
                "task_id":m.TASK,"execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
                "asof_et":"2026-10-02","settlement_status":"PASS","compiled_policy_version":"C4.17",
                "settlement_symbols":["AAPL","NVDA","MSFT"]
              }
              payload=json.dumps(exact,sort_keys=True)+"\n"
              b=payload.encode(); sha=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
              # Pointer path has drifted, but an immutable exact-SHA archive exists.
              current=root/"prior_bridge.json"; current.write_text(payload+"DRIFT")
              archive=root/"pointer_evidence_archive"/(sha+".json")
              archive.parent.mkdir(parents=True); archive.write_text(payload)
              pointer=root/"pointer.json"
              pointer.write_text(json.dumps({
                "schema":"XRAY_GITHUB_DURABLE_STATE_V3","authority":"GITHUB_CURRENT_POINTER",
                "state_json":{"task_id":m.TASK,"asof_et":"2026-10-02",
                  "settlement_resolver_evidence":{"path":"nasdaq-xray/prior_bridge.json","blob_sha":sha,
                    "asof_et":"2026-10-02","settlement_status":"PASS"}}
              }))
              old_root,old_ptr=m.ROOT,m.POINTER
              try:
                  m.ROOT=root;m.POINTER=pointer
                  core,path,got=m.prior_core_symbol("2026-10-02")
                  assert core=="MSFT",(core,path,got)
                  assert path=="nasdaq-xray/pointer_evidence_archive/"+sha+".json",(core,path,got)
                  assert got==sha,(core,path,got)
              finally:
                  m.ROOT,m.POINTER=old_root,old_ptr
          print("POINTER_SETTLEMENT_CORE_FALLBACK=PASS")
          PY

      - name: Assert old stricter PRICE pass survives corrected floor
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"nasdaq-xray")
          import price_dv30_recover_from_fullstate as r
          assert r.monotonic_legacy_pass_reusable({"price":">10","dv30":">=50000000 exact30 median"}) is True
          assert r.monotonic_legacy_pass_reusable({"price":">=5","dv30":">=50000000 exact30 median"}) is False
          assert r.monotonic_legacy_pass_reusable({"price":">10","dv30":">=60000000 exact30 median"}) is False
          print("MONOTONIC_LEGACY_PRICE_PASS_REUSE=PASS")
          PY

      - name: Assert incomplete PRICE snapshot routes to resolver, not corruption recovery
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"nasdaq-xray")
          import price_dv30_recover_from_fullstate as r
          px={
            "asof_et":"2026-10-05","execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
            "source_master_count":3,"source_master_queue_hash":"Q",
            "counts":{"PASS_PRICE_DV30":1,"UNKNOWN":1,"BLOCK_CURRENT_RUN":1},
            "results":{"PASS":{},"U":{},"B":{}},
            "pass_count":1,"pass_symbols":["PASS"],
            "unknown_count":1,"unknown_symbols":["U"],
            "blocked_count":1,"blocked_symbols":["B"],
          }
          assert r.price_snapshot_integrity(px,"2026-10-05") is True,px
          broken=dict(px,counts={"PASS_PRICE_DV30":1,"UNKNOWN":1})
          assert r.price_snapshot_integrity(broken,"2026-10-05") is False,broken
          base={
            "schema":"XRAY_RESOLVER_EPOCH_RESULT_V1","status":"COMMITTED",
            "task_id":r.TASK_ID,"execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
            "asof_et":"2026-10-05","queue_hash":"Q","compiled_policy_version":"C4.17",
            "compiled_policy_hash":"68684c130849016dd5148c1afdaa888766dc8070506af892420e493629a92fa4",
            "source_price_blob_sha":"P","price_resolutions":{},
            "price_resolution_compact":{"block_current_run":{"U":{"reason":"X"}}},
          }
          assert r.bridge_refresh_relevant(px,base,"2026-10-05","P") is True
          px_after=dict(px,unknown_count=0,unknown_symbols=[],blocked_count=2,blocked_symbols=["U","B"],
                        counts={"PASS_PRICE_DV30":1,"BLOCK_CURRENT_RUN":2})
          assert r.bridge_refresh_relevant(px_after,base,"2026-10-05","P") is False
          terminal=dict(base,price_resolution_compact={},terminal_overrides={"B":{"decision":"FAIL_DV30"}})
          assert r.bridge_refresh_relevant(px_after,terminal,"2026-10-05","P") is True
          assert r.bridge_replacement_allowed("UNKNOWN","BLOCK_CURRENT_RUN") is True
          assert r.bridge_replacement_allowed("BLOCK_CURRENT_RUN","FAIL_DV30") is True
          assert r.bridge_replacement_allowed("BLOCK_CURRENT_RUN","BLOCK_CURRENT_RUN") is False
          assert r.bridge_replacement_allowed("PASS_PRICE_DV30","FAIL_DV30") is False
          print("PRICE_RESOLVER_INCOMPLETE_SNAPSHOT_ROUTING=PASS")
          PY

      - name: Assert no frozen 20260930 ASOF constants
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[
            Path("nasdaq-xray/price_dv30_phase.py"),
            Path("nasdaq-xray/price_dv30_recover_from_fullstate.py"),
            Path("nasdaq-xray/history_phase.py"),
            Path("nasdaq-xray/legal_phase.py"),
            Path("nasdaq-xray/stage1_shadow.py"),
            Path("nasdaq-xray/regime_breadth_shadow.py"),
            Path("nasdaq-xray/deep_pre_r1_shadow.py"),
            Path("nasdaq-xray/family_c_engine.py"),
            Path("nasdaq-xray/final_tech_shadow.py"),
            Path("nasdaq-xray/build_current_event_request.py"),
            Path("nasdaq-xray/build_current_terminal.py"),
          ]
          bad=[]
          for p in paths:
            t=p.read_text()
            if 'ASOF="2026-09-30"' in t or "ASOF='2026-09-30'" in t:
              bad.append(str(p))
          assert not bad,bad
          print("DYNAMIC_ASOF_STATIC_GATE=PASS")
          PY
      - name: Run deterministic alpha semantics regression
        run: |
          python nasdaq-xray/test_alpha_semantics.py
          python nasdaq-xray/test_deep_repair_regressions.py

      - name: Assert frozen technical failures outrank transient watch states
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"nasdaq-xray")
          import pandas as pd
          import final_tech_shadow as ft
          dates=pd.bdate_range("2025-01-02",periods=300)
          d=pd.DataFrame({"date":dates,"open":[100.0]*300,"high":[103.0]*300,
                          "low":[99.0]*300,"close":[102.0]*300,"volume":[1_000_000.0]*300})
          ti=len(d)-2
          d.loc[d.index[-1],["open","high","low","close"]]=[109.0,112.0,108.0,110.0]
          td=d.date.iloc[ti].date().isoformat()
          base={"setup_id":"TEST","symbol":"TEST","family":"D","trigger_date":td,
                "A":10.0,"P":100.0,"anchor":97.0,"entry_low":100.0,"entry_high":102.5,
                "entry_model":102.5,"chase_limit":105.0,"S0":95.0,"T1":110.0,
                "anchor_available_idx":ti-1,
                "anchor_available_date":d.date.iloc[ti-1].date().isoformat(),
                "target_source":"TEST_STRUCTURAL","target_zone":None,"target_overlap":False,
                "synthetic_target":False,
                "source_geometry":{"trigger_date":td,"P":100.0,"anchor":97.0}}
          rr=ft.eval_one("TEST","D",base["source_geometry"],d,"CLEAN_DISCOVERY",
                         frozen=base,recorded_before=True)
          assert rr["lifecycle"]=="CHASE_NO_VALID_FILL",rr
          assert rr["risk_pass"] is True and rr["target_overlap"] is False and rr["rr"]["basic_pass"] is False and rr["rr"]["severe_pass"] is False,rr
          assert rr["result"]=="FAIL_RR",rr
          overlap=dict(base,setup_id="TEST-R1",T1=101.0,target_overlap=True)
          r1=ft.eval_one("TEST","D",overlap["source_geometry"],d,"CLEAN_DISCOVERY",
                         frozen=overlap,recorded_before=True)
          assert r1["result"]=="FAIL_R1_ENTRY_OVERLAP",r1
          print("FROZEN_TERMINAL_FAIL_PRECEDENCE=PASS")
          PY

      - name: Assert Family-C event ATR and trigger ATR separation
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"nasdaq-xray")
          import pandas as pd
          import family_c_engine as fc
          rows=[]
          dates=pd.bdate_range("2025-12-01",periods=32)
          for i,d in enumerate(dates):
              rows.append({"date":d,"open":100.0,"high":101.0,"low":99.0,"close":100.0,"volume":1_000_000.0})
          df=pd.DataFrame(rows)
          r0=21
          # pre-event close=100, reaction opening gap=+6; reaction floor stays intact.
          df.loc[r0,["open","high","low","close"]]=[106.0,112.0,104.0,110.0]
          df.loc[r0+1,["open","high","low","close"]]=[109.0,111.0,103.0,109.0]
          df.loc[r0+2,["open","high","low","close"]]=[108.0,110.0,102.0,108.0]
          for i in range(r0+3,r0+6):
              df.loc[i,["open","high","low","close"]]=[107.0,110.0,105.0,108.0]
          t=r0+6
          df.loc[t,["open","high","low","close"]]=[111.0,114.0,106.0,113.0]
          rs=df.date.iloc[r0].date().isoformat()
          td=df.date.iloc[t].date().isoformat()
          old_reaction,old_atr,old_rvol=fc.reaction_session,fc.atr_wilder,fc.rvol20_at
          try:
              fc.reaction_session=lambda edt,sessions:(rs,"AMC")
              pre=r0-1
              fc.atr_wilder=lambda frame,end_idx,n=14: 10.0 if end_idx==pre else 20.0
              fc.rvol20_at=lambda frame,idx:2.0
              g,d=fc.eval_event("TEST",df,{"event_datetime_et":"2026-01-01T16:30:00-05:00"},
                                df.date.iloc[-1].date().isoformat(),[], "CLEAN_DISCOVERY",
                                weekly_pass_dates={td})
              assert g and g["confirmed"] is True,(g,d)
              assert abs(g["A_pre_event"]-10.0)<1e-12,g
              assert abs(g["A_trigger"]-20.0)<1e-12,g
              assert abs(g["A"]-20.0)<1e-12,g
              assert abs(g["gap_atr"]-0.6)<1e-12,g
              assert abs(g["base_width_atr"]-0.35)<1e-12,g
          finally:
              fc.reaction_session,fc.atr_wilder,fc.rvol20_at=old_reaction,old_atr,old_rvol
          print("FAMILY_C_EVENT_TRIGGER_ATR_SEPARATION=PASS")
          PY

      - name: Assert identity type guard
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path("nasdaq-xray/sina_stage.py").read_text()
          assert "WHEN_ISSUED" in t
          assert r"when[- ]issued" in t
          print("WHEN_ISSUED_IDENTITY_GUARD=PASS")
          PY
