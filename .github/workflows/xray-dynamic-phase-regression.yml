name: XRAY Dynamic Phase Regression

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/price_dv20_phase.py"
      - "nasdaq-xray/price_dv20_recover_from_fullstate.py"
      - "nasdaq-xray/history_phase.py"
      - "nasdaq-xray/legal_phase.py"
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/alpha_semantics.py"
      - "nasdaq-xray/stage1_shadow.py"
      - "nasdaq-xray/regime_breadth_shadow.py"
      - "nasdaq-xray/deep_pre_r1_shadow.py"
      - "nasdaq-xray/family_c_engine.py"
      - "nasdaq-xray/final_tech_shadow.py"
      - "nasdaq-xray/build_current_event_request.py"
      - "nasdaq-xray/build_current_terminal.py"
      - "nasdaq-xray/test_alpha_semantics.py"
      - ".github/workflows/xray-dynamic-phase-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic runtime
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt

      - name: Install regression runtime
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt

      - name: Compile dynamic phase scripts
        run: |
          python -m py_compile \
            nasdaq-xray/sina_stage.py \
            nasdaq-xray/price_dv20_phase.py \
            nasdaq-xray/price_dv20_recover_from_fullstate.py \
            nasdaq-xray/history_phase.py \
            nasdaq-xray/legal_phase.py \
            nasdaq-xray/alpha_semantics.py \
            nasdaq-xray/stage1_shadow.py \
            nasdaq-xray/regime_breadth_shadow.py \
            nasdaq-xray/deep_pre_r1_shadow.py \
            nasdaq-xray/family_c_engine.py \
            nasdaq-xray/final_tech_shadow.py \
            nasdaq-xray/build_current_event_request.py \
            nasdaq-xray/build_current_terminal.py \
            nasdaq-xray/test_alpha_semantics.py
      - name: Assert no frozen 20260930 ASOF constants
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[
            Path("nasdaq-xray/price_dv20_phase.py"),
            Path("nasdaq-xray/price_dv20_recover_from_fullstate.py"),
            Path("nasdaq-xray/history_phase.py"),
            Path("nasdaq-xray/legal_phase.py"),
            Path("nasdaq-xray/stage1_shadow.py"),
            Path("nasdaq-xray/regime_breadth_shadow.py"),
            Path("nasdaq-xray/deep_pre_r1_shadow.py"),
            Path("nasdaq-xray/family_c_engine.py"),
            Path("nasdaq-xray/final_tech_shadow.py"),
            Path("nasdaq-xray/build_current_event_request.py"),
            Path("nasdaq-xray/build_current_terminal.py"),
          ]
          bad=[]
          for p in paths:
            t=p.read_text()
            if 'ASOF="2026-09-30"' in t or "ASOF='2026-09-30'" in t:
              bad.append(str(p))
          assert not bad,bad
          print("DYNAMIC_ASOF_STATIC_GATE=PASS")
          PY
      - name: Run deterministic alpha semantics regression
        run: python nasdaq-xray/test_alpha_semantics.py

      - name: Assert identity type guard
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path("nasdaq-xray/sina_stage.py").read_text()
          assert "WHEN_ISSUED" in t
          assert r"when[- ]issued" in t
          print("WHEN_ISSUED_IDENTITY_GUARD=PASS")
          PY
