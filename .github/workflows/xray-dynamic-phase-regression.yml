              assert abs(g["gap_atr"]-0.6)<1e-12,g
              assert abs(g["base_width_atr"]-0.35)<1e-12,g
          finally:
              fc.reaction_session,fc.atr_wilder,fc.rvol20_at=old_reaction,old_atr,old_rvol
          print("FAMILY_C_EVENT_TRIGGER_ATR_SEPARATION=PASS")
          PY

