          try:
              fc.reaction_session=lambda edt,sessions:(rs,"AMC")
              pre=r0-1
              fc.atr_wilder=lambda frame,end_idx,n=14: 10.0 if end_idx==pre else 20.0
              fc.rvol20_at=lambda frame,idx:2.0
              g,d=fc.eval_event("TEST",df,{"event_datetime_et":"2026-01-01T16:30:00-05:00"},
