name: XRAY Safe Workflow Self-Heal

on:
  schedule:
    - cron: "12,32,52 * * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-safe-self-heal.yml"

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: xray-safe-workflow-self-heal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect critical workflows and perform one safe retry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            "xray-validate-compiled-policy-v3.yml"
            "xray-dynamic-policy-invariants.yml"
            "xray-dynamic-phase-regression.yml"
            "xray-canonical-current-post-mc.yml"
            "xray-canonical-current-final.yml"
            "nasdaq-xray-delivery.yml"
            "xray-resilience-observability.yml"
            "xray-strict-g9-gate.yml"
          )

          for wf in "${workflows[@]}"; do
            data="$(gh api "repos/$REPO/actions/workflows/$wf/runs?branch=main&per_page=10")"
            run="$(printf '%s' "$data" | jq -c '[.workflow_runs[] | select(.status=="completed")][0] // empty')"
            if [ -z "$run" ]; then
              echo "XRAY_HEAL no completed run: $wf"
              continue
            fi

            id="$(printf '%s' "$run" | jq -r '.id')"
            conclusion="$(printf '%s' "$run" | jq -r '.conclusion // "unknown"')"
            attempt="$(printf '%s' "$run" | jq -r '.run_attempt // 1')"

            if [ "$conclusion" = "success" ]; then
              echo "XRAY_HEAL healthy: $wf run=$id"
              continue
            fi

            title="[XRAY SYSTEM ALERT] $wf unresolved"
            existing="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"

            if [ "$attempt" -lt 2 ]; then
              echo "XRAY_HEAL retrying failed jobs once: $wf run=$id"
              gh api -X POST "repos/$REPO/actions/runs/$id/rerun-failed-jobs" >/dev/null || true
              continue
            fi

            if [ -z "$existing" ]; then
              gh issue create --repo "$REPO" --title "$title" --body "Critical XRAY workflow remains failed after one safe retry.

Workflow: `$wf`
Run: `$id`
Conclusion: `$conclusion`
Run attempt: `$attempt`

Self-heal did NOT edit source code, policy, alpha thresholds, market evidence, or the production pointer. Manual/root-cause review is required.

EXECUTION=NONE
REAL_MONEY=NO-GO" >/dev/null
            fi
          done
