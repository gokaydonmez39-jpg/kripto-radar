name: XRAY Personal Research Technical Source Contract
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/personal_research_technical_policy_v1.json"
      - "nasdaq-xray/personal_research_policy_guard.py"
      - "nasdaq-xray/chatgpt_compiled_policy_v3.json"
      - ".github/workflows/xray-personal-research-source-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-personal-research-source-contract
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify invoking source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run personal policy positive and adversarial checks
        run: |
          python -m py_compile nasdaq-xray/personal_research_policy_guard.py
          python nasdaq-xray/personal_research_policy_guard.py --selftest
          python -O nasdaq-xray/personal_research_policy_guard.py --selftest
          python nasdaq-xray/personal_research_policy_guard.py --out "$RUNNER_TEMP/xray_personal_policy_validation.json"
      - name: Verify machine-readable no-promotion declaration
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_personal_policy_validation.json").read_text())
          assert j["schema"]=="XRAY_PERSONAL_POLICY_VALIDATION_V1"
          assert j["technical_research_policy_valid"] is True
          assert j["canonical_c417_changed"] is False
          assert j["canonical_r92_enabled"] is False
          assert j["enterprise_rights_waived"] is False
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          print("XRAY_PERSONAL_TECHNICAL_POLICY=PASS_RESEARCH_ONLY")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xray-personal-research-policy-contract
          path: ${{ runner.temp }}/xray_personal_policy_validation.json
          if-no-files-found: error
          retention-days: 14
