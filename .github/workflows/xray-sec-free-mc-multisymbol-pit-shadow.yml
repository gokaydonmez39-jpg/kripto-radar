name: XRAY SEC Free MC Multi-Symbol PIT Shadow Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/sec_free_mc_multisymbol_pit_audit.py"
      - "nasdaq-xray/sec_official_free_mc_transport_probe.py"
      - "nasdaq-xray/sec_frames_bulk_shares_shadow.py"
      - ".github/workflows/xray-sec-free-mc-multisymbol-pit-shadow.yml"
permissions:
  contents: read
concurrency:
  group: xray-sec-multisymbol-pit-shadow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  official-sec-vintages:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify SEC evidence source exact triggering commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "XRAY_SEC_PIT_CHECKOUT_SHA_DRIFT:FAIL_CLOSED" >&2
            exit 1
          fi
          echo "XRAY_SEC_PIT_SOURCE_SHA_EXACT=PASS"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Nasdaq trading-session calendar
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Prove SEC current exchange map, CIK and negative source guards
        run: |
          python -m py_compile nasdaq-xray/sec_official_free_mc_transport_probe.py nasdaq-xray/sec_free_mc_multisymbol_pit_audit.py
          python nasdaq-xray/sec_official_free_mc_transport_probe.py --selftest
          python nasdaq-xray/sec_free_mc_multisymbol_pit_audit.py --selftest
          python -m py_compile nasdaq-xray/sec_frames_bulk_shares_shadow.py
          python nasdaq-xray/sec_frames_bulk_shares_shadow.py --selftest
      - name: Sample official SEC share vintages, never classify PRIMARY MC
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT || vars.XRAY_SEC_USER_AGENT }}
        run: |
          python nasdaq-xray/sec_free_mc_multisymbol_pit_audit.py --offset 0 --limit 35 --output "$RUNNER_TEMP/xray_sec_multisymbol_pit_shadow.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_sec_multisymbol_pit_shadow.json").read_text())
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["c417_primary_mc_count"]==0 and j["production_alpha_authority"] is False
          assert j["market_cap_calculated"] is False and j["price_binding_attested"] is False
          assert j["corporate_action_binding_attested"] is False
          assert j["sample_count"]==35==len(j["statuses"])
          assert j["batch_offset"]==0 and j["batch_limit"]==35
          assert j["remediation_count_exact"] is True
          assert sum(j["remediation_counts"].values())==j["sample_count"]
          assert j["remediation_counts"].get("PIT_SHARES_PRESENT_MORE_VALIDATION_REQUIRED",0)<=35
          assert j["c417_primary_mc_count"]==0
          print("XRAY_SEC_OFFICIAL_35_OF_PRICE_PASS=SHADOW_ONLY_NO_MC_AUTHORITY")
          print("XRAY_SEC_MULTI_SOURCE_AUDIT=PASS_NO_FALSE_MC")
          PY
      - name: Discover issuer-wide SEC share facts via bounded official frames, never MC
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT || vars.XRAY_SEC_USER_AGENT }}
        run: |
          python nasdaq-xray/sec_frames_bulk_shares_shadow.py --out "$RUNNER_TEMP/xray_sec_frames_shadow.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_sec_frames_shadow.json").read_text())
          assert j["schema"]=="XRAY_C418_SEC_FRAMES_SHARE_DISCOVERY_SHADOW_V1"
          assert j["current_price_pass_scope_count"]==514
          import subprocess
          for actual_key, file in (
              ("source_price_git_blob_sha","nasdaq-xray/canonical_current_price_dv30.json"),
              ("source_master_git_blob_sha","nasdaq-xray/canonical_current_master_manifest.json")):
              expected=subprocess.check_output(["git","hash-object",file],text=True).strip()
              assert j[actual_key]==expected,(actual_key,"CANONICAL_SHA_MISMATCH")
          assert j["c417_mc_primary_created"] is False
          assert j["c417_history_pass_created"] is False
          assert j["r92_eligible"] is False
          assert j["market_cap_calculated"] is False
          assert j["raw_shares_in_report"] is False
          assert j["issuer_share_class_pit_attested"] is False
          assert j["filing_acceptance_intraday_attested"] is False
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          if j["status"]=="SHADOW_FRAME_DISCOVERY_COMPLETE_NOT_PIT":
              assert j["received_symbols"]==514
              assert len(j["status_by_symbol"])==514
              from collections import Counter
              assert dict(Counter(j["status_by_symbol"].values()))==j["classes"]
              assert j["frames_http200"]==6
              assert sum(j["classes"].values())==514
          else:
              assert j["status"] in ("SOURCE_NOT_AVAILABLE","SOURCE_PARTIAL_FRAME_TRANSPORT")
          print("XRAY_SEC_FRAMES_READBACK="+j["status"]+"_NO_PRIMARY_NO_AL")
          PY
      - name: Persist operational results only, 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-sec-multi-pit-shadow-operational-v1
          path: |
            ${{ runner.temp }}/xray_sec_multisymbol_pit_shadow.json
            ${{ runner.temp }}/xray_sec_frames_shadow.json
          retention-days: 14
          if-no-files-found: warn
