name: XRAY Backup SIP Batch and Root Trigger Regression (No Vendor Calls)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_full_universe_asof_sip_availability.py"
      - ".github/workflows/xray-personal-full-universe-sip-coverage.yml"
      - ".github/workflows/xray-sip-backup-trigger-regression.yml"
      - ".github/workflows/xray-candidate-local-alpaca-sip-recovery.yml"
      - ".github/workflows/xray-personal-full-cohort-early-watch.yml"
      - ".github/workflows/xray-alpaca-delayed-sip-research.yml"
      - ".github/workflows/xray-personal-current-sip-price-unknown-shadow.yml"
      - "nasdaq-xray/tests/test_sip_quota_dedup_workflows.py"
      - "nasdaq-xray/tests/test_alpaca_page_pacing.py"
      - "nasdaq-xray/alpaca_sip_request_pacer.py"
      - "nasdaq-xray/alpaca_free_sip_shadow_guard.py"
      - "nasdaq-xray/alpaca_personal_joint_260_d30_rth_shadow.py"
      - "nasdaq-xray/alpaca_personal_price_20261013_exact30_census.py"
      - "nasdaq-xray/all_workflow_schedule_audit.py"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_full_universe_asof_sip_availability.py"
      - ".github/workflows/xray-personal-full-universe-sip-coverage.yml"
      - ".github/workflows/xray-sip-backup-trigger-regression.yml"
      - ".github/workflows/xray-candidate-local-alpaca-sip-recovery.yml"
      - ".github/workflows/xray-personal-full-cohort-early-watch.yml"
      - ".github/workflows/xray-alpaca-delayed-sip-research.yml"
      - ".github/workflows/xray-personal-current-sip-price-unknown-shadow.yml"
      - "nasdaq-xray/tests/test_sip_quota_dedup_workflows.py"
      - "nasdaq-xray/tests/test_alpaca_page_pacing.py"
      - "nasdaq-xray/alpaca_sip_request_pacer.py"
      - "nasdaq-xray/alpaca_free_sip_shadow_guard.py"
      - "nasdaq-xray/alpaca_personal_joint_260_d30_rth_shadow.py"
      - "nasdaq-xray/alpaca_personal_price_20261013_exact30_census.py"
      - "nasdaq-xray/all_workflow_schedule_audit.py"
permissions:
  contents: read
jobs:
  backup-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only offline calendar and YAML parser
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0 PyYAML==6.0.3
      - name: Batch error isolation vs quota/auth transport exact tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/alpaca_full_universe_asof_sip_availability.py
          python nasdaq-xray/alpaca_full_universe_asof_sip_availability.py --selftest
          python -O nasdaq-xray/alpaca_full_universe_asof_sip_availability.py --selftest
      - name: Test every SIP HTTP page is paced (offline)
        run: |
          python -m unittest discover -s nasdaq-xray/tests -p test_alpaca_page_pacing.py -v
          python -O -m unittest discover -s nasdaq-xray/tests -p test_alpaca_page_pacing.py -v
          python nasdaq-xray/alpaca_free_sip_shadow_guard.py --selftest
          python -O nasdaq-xray/alpaca_free_sip_shadow_guard.py --selftest
      - name: Prove no accidental double-billing of full-universe SIP scans (offline)
        run: |
          set -euo pipefail
          python -m unittest discover -s nasdaq-xray/tests -p test_sip_quota_dedup_workflows.py -v
          python -O -m unittest discover -s nasdaq-xray/tests -p test_sip_quota_dedup_workflows.py -v
      - name: Verify all workflow security inventory negatives and holiday gate interaction
        run: |
          set -euo pipefail
          python nasdaq-xray/all_workflow_schedule_audit.py --selftest
          python -O nasdaq-xray/all_workflow_schedule_audit.py --selftest
      - name: Prove scheduled daily backup and no hourly source duplication
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          f=Path(".github/workflows/xray-personal-full-universe-sip-coverage.yml")
          d=yaml.load(f.read_text(),Loader=yaml.BaseLoader)
          on=d["on"]
          assert on["schedule"][0]["cron"]=="10 22 * * 1-5"
          assert "workflow_dispatch" in on
          assert not any(t in on for t in ("push","pull_request","workflow_run"))
          jobs=d["jobs"]
          gate=jobs["coverage"].get("if")
          assert gate=="$"+"{{ needs.session-gate.outputs.allow == 'true' }}", (
              "SCHEDULED_SIP_VENDOR_MUST_REQUIRE_OFFICIAL_SESSION")
          assert jobs["coverage"]["needs"]==["session-gate"]
          sess=jobs["session-gate"]
          assert sess["outputs"]["allow"]=="$"+"{{ steps.session.outputs.allow_compute }}"
          assert any(x.get("id")=="session" and
              "root_weekend_quota_guard.py --emit" in x.get("run","")
              for x in sess["steps"])
          assert "source_circuit_breaker_open" in Path(
              "nasdaq-xray/alpaca_full_universe_asof_sip_availability.py"
          ).read_text()
          for key in ("history260","root-source-bridge","joint-rth30-shadow",
                      "six-gate-causal-breaker"):
              assert key in jobs and "needs" in jobs[key]
          assert d["permissions"]["contents"]=="read"
          assert not d["concurrency"]["cancel-in-progress"]=="true"
          print("XRAY_BACKUP_EPOCH_DEDUP=PASS_DAILY_SCHEDULE_MANUAL_ONLY_NO_ROOT_HOURLY_NO_AL")
          PY
