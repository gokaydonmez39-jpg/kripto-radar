name: XRAY Personal Full-Universe SIP EOD Coverage (Research Only)
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_full_universe_asof_sip_availability.py"
      - "nasdaq-xray/alpaca_full_universe_260_52_sip_shadow.py"
      - "nasdaq-xray/alpaca_full_universe_30d_daily_proxy_shadow.py"
      - "nasdaq-xray/alpaca_personal_joint_260_d30_rth_shadow.py"
      - "nasdaq-xray/personal_six_gate_causal_breaker.py"
      - "nasdaq-xray/personal_sec_current_cik_shadow.py"
      - "nasdaq-xray/personal_full_universe_sip_root_bridge.py"
      - ".github/workflows/xray-personal-full-universe-sip-coverage.yml"
  schedule:
    - cron: "10 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-personal-full-universe-sip-coverage
  cancel-in-progress: false

jobs:
  coverage:
    name: Verify every source symbol's delayed SIP session-day availability
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned NASDAQ trading calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Verify full-scope, no-false-source and 429 negatives
        run: |
          python -m py_compile nasdaq-xray/alpaca_full_universe_asof_sip_availability.py
          python nasdaq-xray/alpaca_full_universe_asof_sip_availability.py --selftest
          python -O nasdaq-xray/alpaca_full_universe_asof_sip_availability.py --selftest
      - name: Measure all current Nasdaq root symbols without storing prices
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          python nasdaq-xray/alpaca_full_universe_asof_sip_availability.py \
            --out "$RUNNER_TEMP/xray_personal_full_universe_sip_asof_coverage.json"
      - name: Verify exact full coverage classifications and zero alpha
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_personal_full_universe_sip_asof_coverage.json"
          d=json.loads(p.read_text())
          assert d["schema"]=="XRAY_ALPACA_PERSONAL_UNIVERSE_ASOF_SIP_COVERAGE_V1"
          assert d["source_sina_queue_count"]==d["measured_scope_count"]==len(d["symbol_classifications"])
          assert d["source_sina_queue_count"]==sum(d["classification_counts"].values())
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          assert d["no_vendor_ohlcv_persisted"] is True and d["no_canonical_promotion"] is True
          assert d["registered_R92_count"]==0
          print("XRAY_PERSONAL_SIP_FULL_UNIVERSE_PARTITION=PASS_EVIDENCE_ONLY")
          PY
      - name: Archive source availability flags without vendor OHLCV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-personal-full-universe-sip-coverage-no-ohlcv
          path: ${{ runner.temp }}/xray_personal_full_universe_sip_asof_coverage.json
          if-no-files-found: warn
          retention-days: 14

  history260:
    name: Personal full NASDAQ SIP 260 daily and 52 weekly research
    needs: [coverage]
    if: ${{ needs.coverage.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official session calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Verify full-universe 260 daily and 52 week proof adversarial regressions
        run: |
          python -m py_compile nasdaq-xray/alpaca_full_universe_30d_daily_proxy_shadow.py
          python nasdaq-xray/alpaca_full_universe_30d_daily_proxy_shadow.py
          python -O nasdaq-xray/alpaca_full_universe_30d_daily_proxy_shadow.py
          python -m py_compile nasdaq-xray/alpaca_full_universe_260_52_sip_shadow.py
          python nasdaq-xray/alpaca_full_universe_260_52_sip_shadow.py --selftest
          python -O nasdaq-xray/alpaca_full_universe_260_52_sip_shadow.py --selftest
      - name: Measure exact 260 official sessions for every Nasdaq symbol
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          python nasdaq-xray/alpaca_full_universe_260_52_sip_shadow.py \
            --out "$RUNNER_TEMP/xray_nasdaq_full_260_52_sip_shadow.json"
      - name: Validate complete no-alpha history research partition
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_nasdaq_full_260_52_sip_shadow.json").read_text())
          assert x["schema"]=="XRAY_PERSONAL_FULL_NASDAQ_SIP_260_DAILY_52_WEEK_RESEARCH_V1"
          assert x["scope_count"]==x["classified_count"]==len(x["symbol_classifications"])
          assert sum(x["classification_counts"].values())==x["scope_count"]
          assert sum(x["history_nonpass_cause_counts"].values())==x["scope_count"]
          assert set(x["symbol_nonpass_cause_classes"])==set(x["symbol_classifications"])
          assert x["cause_labels_are_diagnostics_not_ticker_age_or_verified_history"] is True
          assert x["official_first_trade_fail_only_veto_count"]==x["classification_counts"].get("FAIL_OWN_ISSUER_LT260_OFFICIAL_FIRST_TRADE",0)
          assert x["full_history_260_52_observed_count"]+x["full_history_missing_or_unknown_count"]==x["scope_count"]
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          assert x["no_vendor_ohlcv_persisted"] and x["registered_R92_count"]==0
          assert x["canonical_price_history_mc_untouched"]
          d=x["daily30_source_proxy"]
          assert d["schema"]=="XRAY_FULL_UNIVERSE_30DAY_SIP_DAILY_PROXY_NO_RTH_AUTHORITY_V1"
          assert d["scope_count"]==x["scope_count"]==len(d["symbol_classifications"])
          assert sum(d["classification_counts"].values())==d["scope_count"]
          assert d["research_daily_proxy_not_official_rth_dv30"] is True
          assert d["corporate_action_adjustment_and_issuer_identity_unproven"] is True
          assert d["no_vendor_ohlcv_persisted"] is True and d["registered_R92_count"]==0
          assert d["hist_260_zero_volume_symbols"]==d["hist_260_zero_volume_outside_last30"]+d["hist_260_zero_volume_within_last30"]+d["hist_260_zero_volume_other_30day_unknown"]
          print("XRAY_NASDAQ_260_52_FULL_SCOPE_SHADOW=PASS_COMPLETE_PARTITION_NOT_PRIMARY")
          PY
      - name: Preserve all 260/52 classifications but never OHLCV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-personal-full-nasdaq-260-52-no-ohlcv
          path: ${{ runner.temp }}/xray_nasdaq_full_260_52_sip_shadow.json
          if-no-files-found: warn
          retention-days: 14

  root-source-bridge:
    name: Bind both actual SIP measurements to exact root identity and ASOF
    needs: [coverage, history260]
    if: ${{ needs.coverage.result == 'success' && needs.history260.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official Nasdaq session calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Verify exact queue, source day, source contradiction and zero-alpha negatives
        run: |
          python -m py_compile nasdaq-xray/personal_full_universe_sip_root_bridge.py
          python nasdaq-xray/personal_full_universe_sip_root_bridge.py --selftest
          python -O nasdaq-xray/personal_full_universe_sip_root_bridge.py --selftest
      - name: Download this run's actual daily SIP source classifications
        uses: actions/download-artifact@v4
        with:
          name: xray-personal-full-universe-sip-coverage-no-ohlcv
          path: ${{ runner.temp }}/daily
      - name: Download this run's actual 260/52 SIP source classifications
        uses: actions/download-artifact@v4
        with:
          name: xray-personal-full-nasdaq-260-52-no-ohlcv
          path: ${{ runner.temp }}/history
      - name: Bind real source artifacts to exact current root identity
        run: |
          python nasdaq-xray/personal_full_universe_sip_root_bridge.py \
            --daily "$RUNNER_TEMP/daily/xray_personal_full_universe_sip_asof_coverage.json" \
            --history "$RUNNER_TEMP/history/xray_nasdaq_full_260_52_sip_shadow.json" \
            --out "$RUNNER_TEMP/xray_personal_sip_root_bridge.json"
      - name: Enforce bounded research-only output and no canonical promotions
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_personal_sip_root_bridge.json").read_text())
          assert d["schema"]=="XRAY_PERSONAL_SIP_ROOT_SOURCE_BRIDGE_V1"
          assert d["same_asof_same_universe_join"] is True
          assert d["research_observations_not_canonical_pass"] is True
          assert d["no_c417_dv30_or_mc_pass"] is True
          assert d["daily30_source_proxy_not_official_rth_dv30"] is True
          assert d["last30_sip_daily_valid_source_count"]>=d["260_daily_52_week_observed"]
          assert 0<=d["260_52_and_daily30_ge50m_joint_research_count"]<=d["260_daily_52_week_observed"]
          assert d["joint_scope_has_no_rth_mc_technical_or_signal_authority"] is True
          assert len(d["260_52_and_daily30_ge50m_joint_sha256"])==64
          assert d["historical_zero_volume_outside_latest30_count"]>=0
          assert d["no_official_rth_exact_volume"] is True
          assert d["no_technical_or_event_clear"] is True
          assert d["no_vetted_r92_or_delivery"] is True
          assert d["no_vendor_ohlcv_persisted"] is True
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          print("XRAY_PERSONAL_SOURCE_BRIDGE=EXACT_ROOT_LATEST_SIP_RESEARCH_NO_AL")
          PY
      - name: Archive SHA-bound non-vendor source observations only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-personal-exact-root-sip-source-bridge-no-ohlcv
          path: ${{ runner.temp }}/xray_personal_sip_root_bridge.json
          if-no-files-found: warn
          retention-days: 14

  joint-rth30-shadow:
    name: Personal joint 260-session and daily30 research cohort 30Min RTH bound
    needs: [coverage, history260, root-source-bridge]
    if: ${{ needs.coverage.result == 'success' && needs.history260.result == 'success' && needs.root-source-bridge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official session calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Reject stale SHA cohort, missing RTH slots and throttled provider false positives
        run: |
          python -m py_compile nasdaq-xray/alpaca_personal_joint_260_d30_rth_shadow.py
          python nasdaq-xray/alpaca_personal_joint_260_d30_rth_shadow.py --selftest
          python -O nasdaq-xray/alpaca_personal_joint_260_d30_rth_shadow.py --selftest
      - name: Download exact latest 260/52 plus daily30 source flags
        uses: actions/download-artifact@v4
        with:
          name: xray-personal-full-nasdaq-260-52-no-ohlcv
          path: ${{ runner.temp }}/history
      - name: Download SHA-bound source bridge from this identical run
        uses: actions/download-artifact@v4
        with:
          name: xray-personal-exact-root-sip-source-bridge-no-ohlcv
          path: ${{ runner.temp }}/bridge
      - name: Measure official 30-minute RTH completed-session lower bound on exact joint cohort
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          python nasdaq-xray/alpaca_personal_joint_260_d30_rth_shadow.py \
            --history "$RUNNER_TEMP/history/xray_nasdaq_full_260_52_sip_shadow.json" \
            --bridge "$RUNNER_TEMP/bridge/xray_personal_sip_root_bridge.json" \
            --out "$RUNNER_TEMP/xray_personal_joint_rth30_shadow.json"
      - name: Enforce zero primary, no persisted vendor OHLCV and complete subset partition
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_personal_joint_rth30_shadow.json").read_text())
          assert x["schema"]=="XRAY_PERSONAL_JOINT_HISTORY_DAILY30_EXACT_RTH30_BOUND_V1"
          assert x["joint_cohort_count"]==sum(x["classification_counts"].values())==len(x["classifications"])
          assert x["rth_lower_bound_ge50m_shadow_count"]+x["rth_upper_bound_lt50m_shadow_count"]+x["rth_ambiguous_shadow_count"]+x["rth_incomplete_or_unknown_count"]==x["joint_cohort_count"]
          assert x["official_c417_primary_dv30_attested"] is False
          assert x["official_RTH_close_auction_volume_attested"] is False
          assert x["official_RTH_corrections_attested"] is False
          assert x["canonical_master_price_history_mc_untouched"] is True
          assert x["vendor_ohlcv_persisted"] is False
          assert x["source_rights_not_inferred"] is True
          assert x["registered_R92_count"]==0
          assert sum(x["rth_integrity_cause_counts"].values())==len(x["symbol_rth_integrity_failure_codes"])
          assert set(x["symbol_rth_integrity_failure_codes"]).issubset({k for k,v in x["classifications"].items() if v=="UNKNOWN_INCOMPLETE_OR_INTEGRITY_SHADOW"})
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          print("XRAY_PERSONAL_JOINT_260_RTH30=PASS_RESEARCH_ONLY_NOT_PRIMARY")
          PY
      - name: Preserve only categorical 30Min research evidence, no raw market data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-personal-joint-260-daily30-rth30-no-ohlcv
          path: ${{ runner.temp }}/xray_personal_joint_rth30_shadow.json
          if-no-files-found: warn
          retention-days: 14

  six-gate-causal-breaker:
    name: Audit every issuer's first unresolved causal gate across all six links
    needs: [coverage, history260, root-source-bridge, joint-rth30-shadow]
    if: ${{ needs.coverage.result == 'success' && needs.history260.result == 'success' && needs.root-source-bridge.result == 'success' && needs.joint-rth30-shadow.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Nasdaq sessions calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Prove no forged MC, price, technical or R92 can be promoted through six gates
        run: |
          python -m py_compile nasdaq-xray/personal_six_gate_causal_breaker.py
          python nasdaq-xray/personal_six_gate_causal_breaker.py --selftest
          python -O nasdaq-xray/personal_six_gate_causal_breaker.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: xray-personal-full-universe-sip-coverage-no-ohlcv
          path: ${{ runner.temp }}/daily
      - uses: actions/download-artifact@v4
        with:
          name: xray-personal-full-nasdaq-260-52-no-ohlcv
          path: ${{ runner.temp }}/history
      - uses: actions/download-artifact@v4
        with:
          name: xray-personal-exact-root-sip-source-bridge-no-ohlcv
          path: ${{ runner.temp }}/bridge
      - uses: actions/download-artifact@v4
        with:
          name: xray-personal-joint-260-daily30-rth30-no-ohlcv
          path: ${{ runner.temp }}/rth
      - name: Construct exact-sha complete universe causal routing only from same-run receipts
        run: |
          python nasdaq-xray/personal_six_gate_causal_breaker.py \
            --daily "$RUNNER_TEMP/daily/xray_personal_full_universe_sip_asof_coverage.json" \
            --history "$RUNNER_TEMP/history/xray_nasdaq_full_260_52_sip_shadow.json" \
            --bridge "$RUNNER_TEMP/bridge/xray_personal_sip_root_bridge.json" \
            --rth "$RUNNER_TEMP/rth/xray_personal_joint_rth30_shadow.json" \
            --out "$RUNNER_TEMP/xray_six_gate_causal_breaker.json"
      - name: Assert every symbol has one next action and none authorizes AL
        run: |
          python - <<'PY'
          import json,os
          from collections import Counter
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_six_gate_causal_breaker.json").read_text())
          assert d["schema"]=="XRAY_PERSONAL_SIX_GATE_CAUSAL_BREAKER_V1"
          assert len(d["per_symbol_causal_routing"])==d["scope_count"]
          assert sum(d["first_unresolved_gate_counts"].values())==d["scope_count"]
          assert sum(d["next_safe_evidence_action_counts"].values())==d["scope_count"]
          assert d["six_gate_dependency_order"]==["SOURCE","HISTORY","PRICE_DV30","MC","TECH","R92_DELIVERY"]
          assert d["rth30_lower_bound_observed"]==len(d["next_gate_mc_sec_research_only_symbols"])
          assert d["c417_price_dv30_primary_attested"] is False
          assert d["issuer_class_mc_current_attested"] is False
          assert d["technical_a_b_d_r1_event_regime_attested"] is False
          assert d["registered_r92_count"]==0 and d["iphone_device_delivery_attested"] is False
          assert d["no_vendor_ohlcv_persisted"] is True
          assert d["no_canonical_mutations"] is True
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          print("XRAY_SIX_GATE_CAUSAL_RESOLVER=PASS_COMPLETE_FIRST_BLOCKER_PARTITION_ZERO_FALSE_AL")
          PY
      - name: Retain SHA-bound causal worklist with no vendor market data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-personal-six-gate-causal-worklist-no-ohlcv
          path: ${{ runner.temp }}/xray_six_gate_causal_breaker.json
          if-no-files-found: warn
          retention-days: 14

  mc-sec-issuer-identity-shadow:
    name: Map exact RTH research cohort to current SEC CIK candidates without MC assertion
    needs: [six-gate-causal-breaker]
    if: ${{ needs.six-gate-causal-breaker.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official Nasdaq session calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Verify exact cohort SHA and no false issuer class market-cap promotion
        run: |
          python -m py_compile nasdaq-xray/personal_sec_current_cik_shadow.py
          python nasdaq-xray/personal_sec_current_cik_shadow.py --selftest
          python -O nasdaq-xray/personal_sec_current_cik_shadow.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: xray-personal-six-gate-causal-worklist-no-ohlcv
          path: ${{ runner.temp }}/causal
      - name: Read once SEC current ticker exchange index for matching CIK candidates
        run: |
          python nasdaq-xray/personal_sec_current_cik_shadow.py \
            --causal "$RUNNER_TEMP/causal/xray_six_gate_causal_breaker.json" \
            --out "$RUNNER_TEMP/xray_sec_current_cik_personal.json"
      - name: Ensure SEC current CIK is never construed as PIT shares or 2 billion MC
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_sec_current_cik_personal.json").read_text())
          assert x["schema"]=="XRAY_SEC_PERSONAL_MC_CURRENT_CIK_ASSOCIATION_SHADOW_V1"
          assert sum(x["classification_counts"].values())==x["scope_count"]==len(x["classifications"])
          assert x["sec_mapping_is_current_only_not_asof_pit"] is True
          assert x["sec_companyfacts_class_share_count_verified"] is False
          assert x["issuer_class_and_corporate_actions_verified"] is False
          assert x["current_mc_2b_attested"] is False
          assert x["c417_price_dv30_primary_attested"] is False
          assert x["technical_pass_attested"] is False
          assert x["registered_R92_count"]==0
          assert x["vendor_ohlcv_persisted"] is False
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          print("XRAY_SEC_CIK_PERSONAL_STAGE4=EVIDENCE_ONLY_NO_MC_OR_R92")
          PY
      - name: Archive issuer CIK candidate classifications only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-personal-sec-current-cik-no-ohlcv-no-mc
          path: ${{ runner.temp }}/xray_sec_current_cik_personal.json
          if-no-files-found: warn
          retention-days: 14

  six-gate-frozen-sip-replay:
    name: Replay immutable completed 14-Oct six-gate inputs without vendor API calls
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact official Nasdaq calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Verify frozen replay is still current Nasdaq ASOF, otherwise safe no-op
        id: epoch
        run: |
          python - <<'PY'
          import sys,datetime as dt,os
          sys.path.insert(0,"nasdaq-xray")
          from source_epoch_freshness_guard import last_complete_session
          same=last_complete_session(dt.datetime.now(dt.timezone.utc))=="2026-10-14"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("current="+("true" if same else "false")+"\n")
