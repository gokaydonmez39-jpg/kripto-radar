name: XRAY Zero-Cost Four-Stage Contract Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/mc_free_successor_contract.py"
      - "nasdaq-xray/sec_official_free_mc_transport_probe.py"
      - "nasdaq-xray/history_transport_cache_guard.py"
      - "nasdaq-xray/manual_decision_report.py"
      - "nasdaq-xray/delivery_prepare.py"
      - "nasdaq-xray/delivery_prepare_selftest.py"
      - ".github/workflows/xray-zero-cost-four-stage-verification.yml"
  schedule:
    - cron: "17 13 * * 1-5"
permissions:
  contents: read
concurrency:
  group: xray-zero-cost-four-stage-contract
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage 1 - free primary successor rights and independent lineage fail-closed
        run: |
          python -m py_compile nasdaq-xray/mc_free_successor_contract.py
          python nasdaq-xray/mc_free_successor_contract.py --selftest
          python nasdaq-xray/sec_official_free_mc_transport_probe.py --selftest
          echo "XRAY_STAGE1_CONTRACT=PASS_PRODUCTION_PRIMARY_NOT_AUTHORIZED"
      - name: Stage 2 - history calendar, official/price and corporate evidence negative guards
        working-directory: nasdaq-xray
        run: |
          python history_transport_cache_guard_selftest.py
          python post_mc_history_legal_reuse_guard_selftest.py
          echo "XRAY_STAGE2_GUARDS=PASS_WITHOUT_MINTING_PRICE_OR_MC"
      - name: Stage 3 - 2-8 session candidate source-to-final safety and actual readiness
        run: |
          python nasdaq-xray/e2e_production_readiness.py --selftest
          python nasdaq-xray/manual_decision_report.py --selftest
          python nasdaq-xray/research_preopen_source_audit.py --selftest
          python nasdaq-xray/research_preopen_source_audit.py --output "$RUNNER_TEMP/xray_zero_cost_stage3_readiness.json"
          echo "XRAY_STAGE3_REAL_CURRENT_EVIDENCE=EVALUATED_FAIL_CLOSED"
      - name: Stage 4 - delivery preconditions, dedup, stop and lifecycle synthetic tests
        working-directory: nasdaq-xray
        run: |
          python delivery_prepare_selftest.py
          python delivery_scheduler_guard_selftest.py
          python manual_signal_lifecycle_shadow.py --selftest
          echo "XRAY_STAGE4_DELIVERY=TESTED_SYNTHETIC_ONLY_NO_DEVICE_RECEIPT"
      - name: Verify no real-world BUY, licence or delivery claim
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_zero_cost_stage3_readiness.json"
          audit=json.loads(p.read_text())
          assert audit["schema"]=="XRAY_PREOPEN_SOURCE_AUDIT_V1"
          assert audit["execution"]=="NONE" and audit["real_money"]=="NO-GO"
          assert audit["research_go"] is False
          assert audit["actual_device_notification_receipt_proven"] is False
          assert audit["shadow_massive_not_primary"] is True
          assert audit["non_display_license_proven_by_this_audit"] is False
          print("XRAY_FOUR_STAGE_FINAL=PASS_GUARDS_ONLY_RESEARCH_PRODUCTION_NO_GO")
          PY
      - name: Archive operational proof only for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: xray-four-stage-zero-cost-readiness-v1
          path: ${{ runner.temp }}/xray_zero_cost_stage3_readiness.json
          retention-days: 14
          if-no-files-found: error
