name: XRAY Personal Current SIP PRICE Unknown Census (Shadow Only)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/current_price_shadow_publication_guard.py"
      - "nasdaq-xray/alpaca_personal_price_current_exact30.py"
      - "nasdaq-xray/alpaca_price_gap_minute_witness.py"
      - ".github/workflows/xray-personal-current-sip-price-unknown-shadow.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/current_price_shadow_publication_guard.py"
      - "nasdaq-xray/alpaca_personal_price_current_exact30.py"
      - "nasdaq-xray/alpaca_price_gap_minute_witness.py"
      - "nasdaq-xray/canonical_current_master_manifest.json"
      - "nasdaq-xray/canonical_current_price_dv30.json"
      - ".github/workflows/xray-personal-current-sip-price-unknown-shadow.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-personal-current-sip-price-shadow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 43
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate exact checkout and regression-only shadow publication
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/current_price_shadow_publication_guard.py
          python nasdaq-xray/current_price_shadow_publication_guard.py --selftest
          python -O nasdaq-xray/current_price_shadow_publication_guard.py --selftest
      - name: Pinned NASDAQ session calendar and existing exact-30 SIP engine selftests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pandas_market_calendars==5.4.0'
          python -m py_compile nasdaq-xray/alpaca_personal_price_current_exact30.py nasdaq-xray/alpaca_price_gap_minute_witness.py
          python nasdaq-xray/alpaca_price_gap_minute_witness.py
          python -O nasdaq-xray/alpaca_price_gap_minute_witness.py
          python nasdaq-xray/alpaca_personal_price_current_exact30.py --selftest
          python -O nasdaq-xray/alpaca_personal_price_current_exact30.py --selftest
      - name: Current main only — bounded private SIP census with counts-only public report
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
          XRAY_ALPACA_API_KEY_ID: ${{ secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_API_SECRET_KEY: ${{ secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/xray_current_sip_public_counts.json"
          private="$RUNNER_TEMP/xray_current_sip_private_status.json"
          if ! python nasdaq-xray/current_price_shadow_publication_guard.py --preflight --out "$public"; then
            echo "XRAY_CURRENT_SIP_MEASUREMENT=NOT_RUN_STALE_OR_INVALID_SOURCE"
            exit 0
          fi
          if [[ -z "${XRAY_ALPACA_DATA_KEY_ID:-${XRAY_ALPACA_API_KEY_ID:-}}" || -z "${XRAY_ALPACA_DATA_SECRET_KEY:-${XRAY_ALPACA_API_SECRET_KEY:-}}" ]]; then
            python nasdaq-xray/current_price_shadow_publication_guard.py --no-keys --out "$public"
            echo "XRAY_CURRENT_SIP_MEASUREMENT=NO_SECRET_NO_NETWORK"
            exit 0
          fi
          # Existing engine: max 1200 calls and 8-symbol batches. Individual
          # ticker classifications remain in RUNNER_TEMP, never uploaded.
          if python nasdaq-xray/alpaca_personal_price_current_exact30.py --out "$private"; then
            python nasdaq-xray/current_price_shadow_publication_guard.py --sanitize "$private" --out "$public"
          else
            python nasdaq-xray/current_price_shadow_publication_guard.py --runtime-error --out "$public"
            echo "XRAY_CURRENT_SIP_MEASUREMENT=PRIVATE_RUNTIME_FAILURE_NO_ALPHA"
          fi
          # No raw OHLCV and no ticker-level class map in public artifacts.
          python - "$public" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j["schema"]=="XRAY_CURRENT_SIP_30MIN_RESEARCH_COUNTS_ONLY_V1"
          assert j["alpha_authority"] is False and j["r92_registered"] is False
          assert j["published_vendor_raw_ohlcv"] is False
          assert j["published_symbol_classifications"] is False
          reasons=j.get("integrity_recheck_unresolved_reason_counts",{})
          assert isinstance(reasons,dict)
          assert all(k in {
              "DAILY_30_SESSION_GAP","RTH_30MIN_SESSION_GAP",
              "DUPLICATE_SOURCE_BAR","OHLCV_SCHEMA_OR_TIMESTAMP_INVALID",
              "RTH_VOLUME_EXCEEDS_DAILY","OTHER_STRUCTURAL_SOURCE_REJECTION",
              "NO_VERIFIABLE_SOURCE_BARS","PROVIDER_AUTH_OR_RATE_LIMIT",
              "PROVIDER_TRANSPORT_FAILURE","UNATTEMPTED_BUDGET_OR_LIMIT",
          } and isinstance(v,int) for k,v in reasons.items())
          details=j.get("integrity_recheck_detail_counts",{})
          assert isinstance(details,dict)
          assert all(k in {
              "RTH_ONE_30MIN_SLOT_MISSING",
              "RTH_MULTIPLE_30MIN_SLOTS_ONE_SESSION",
              "RTH_30MIN_GAPS_ACROSS_SESSIONS",
              "RTH_MISSING_SLOT_TIMESTAMP_UNVERIFIED",
              "RTH_MISSING_SLOT_COUNT_UNVERIFIED",
              "BAR_TIMESTAMP_OR_TIMEZONE_UNVERIFIED",
              "BAR_OHLCV_VALUES_UNVERIFIED",
              "BAR_OTHER_SCHEMA_OR_BOUNDARY_UNVERIFIED",
          } and isinstance(v,int) and v>=0 for k,v in details.items())
          assert sum(details.values()) == (reasons.get("RTH_30MIN_SESSION_GAP",0)
                 + reasons.get("OHLCV_SCHEMA_OR_TIMESTAMP_INVALID",0))
          minute=j.get("minute_witness_counts",{})
          assert isinstance(minute,dict)
          assert all(k in {
              "MINUTE_BAR_PRESENT_COARSE_BAR_MISSING_SHADOW",
              "MINUTE_NO_BAR_OBSERVED_STILL_UNKNOWN",
              "MINUTE_TRANSPORT_OR_SCHEMA_UNKNOWN",
              "MINUTE_GLOBAL_BUDGET_BLOCKED",
          } and isinstance(v,int) and v>=0 for k,v in minute.items())
          assert sum(minute.values())<=reasons.get("RTH_30MIN_SESSION_GAP",0)
          print("XRAY_CURRENT_SIP_COUNTS_ONLY="+json.dumps({
              "asof_et":j["asof_et"],"status":j["status"],
              "scope":j["exact_source_unknown_scope_count"],
              "counts":j["counts"],"source_price_sha":j["source_price_blob_sha"],
              "gap_reasons":reasons,
              "gap_details_counts_only":details,
              "minute_witness_counts_only":minute,
              "isolated_recheck_attempted":j.get("integrity_recheck_attempted",0),
              "isolated_recheck_recovered":j.get("integrity_recheck_recovered",0),
          },sort_keys=True))
          PY
      - name: Archive sanitized counts only; source test success is not AL or R92
        if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-personal-current-sip-price-unknown-counts-only-no-alpha
          path: ${{ runner.temp }}/xray_current_sip_public_counts.json
          if-no-files-found: error
          retention-days: 7
