name: XRAY 260 History Resume Regression - Offline No Source Authority
on:
  push:
    branches: [audit/c417-history-asof-rollover-20261010, audit/c417-partial-history-offline-workflow-20261010, main]
    paths:
      - "nasdaq-xray/massive_grouped_history_resume.py"
      - "nasdaq-xray/grouped_history_full_pipeline_selftest.py"
      - "nasdaq-xray/twelve_data_history_full_pipeline_selftest.py"
      - ".github/workflows/xray-260-history-resume-offline-regression-shadow.yml"
  pull_request:
    paths:
      - "nasdaq-xray/massive_grouped_history_resume.py"
      - "nasdaq-xray/grouped_history_full_pipeline_selftest.py"
      - "nasdaq-xray/twelve_data_history_full_pipeline_selftest.py"
      - ".github/workflows/xray-260-history-resume-offline-regression-shadow.yml"
permissions:
  contents: read
jobs:
  two-provider-transport-control-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      XRAY_MASSIVE_API_KEY: ""
      XRAY_TWELVE_DATA_API_KEY: ""
      XRAY_MASSIVE_NONDISPLAY_LICENSE_OK: "false"
      XRAY_MASSIVE_PRIVATE_CACHE_RIGHTS_OK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned NASDAQ calendar and private fixture crypto, NO vendor calls
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0" "cryptography>=44,<47"
      - name: Massive official-next-session rollover and negative controls
        run: |
          python -m py_compile nasdaq-xray/massive_grouped_history_resume.py
          python nasdaq-xray/massive_grouped_history_resume.py --selftest
          python - <<'PY'
          from pathlib import Path
          p=Path('nasdaq-xray/massive_grouped_history_resume.py').read_text()
          assert 'newer["dates"],newer["weeks"]=expected_dates(newer["asof"])' in p
          assert 'assert newer["dates"][-1]==newer["asof"]' in p
          assert 'newer["dates"],newer["weeks"]=expected_dates("2026-10-09")' not in p
          print('XRAY_NEXT_SESSION_260_52_ASOF_MISMATCH_NEGATIVE_GUARD=PASS')
          PY
          python nasdaq-xray/grouped_history_full_pipeline_selftest.py
      - name: Twelve unknown-safe synthetic 260/52 controls
        run: |
          python -m py_compile nasdaq-xray/twelve_data_history_full_pipeline_selftest.py
          python nasdaq-xray/twelve_data_history_resume.py --selftest
          python nasdaq-xray/twelve_data_history_full_pipeline_selftest.py
      - name: Bind exact current PRICE PASS scope to 260 daily and 52 weekly official dates
        run: |
          python nasdaq-xray/current_history_source_request.py --selftest
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,"nasdaq-xray")
          from current_history_source_request import expected_dates,sha256_lines
          p=json.loads(Path("nasdaq-xray/canonical_current_price_dv30.json").read_text())
          m=json.loads(Path("nasdaq-xray/canonical_current_master_manifest.json").read_text())
          out=Path(os.environ["RUNNER_TEMP"])/"xray_history_current_scope.json"
          if p.get("pass_count")==0:
              assert p.get("pass_symbols")==[]
              assert p.get("pass_hash")==sha256_lines([])
              assert p.get("asof_et")==m.get("asof_et")
              assert p.get("unknown_count",0)>0
              daily,weekly=expected_dates(p["asof_et"])
              blob=subprocess.check_output(["git","hash-object",
                    "nasdaq-xray/canonical_current_price_dv30.json"],
                    text=True).strip()
              data={"status":"BLOCKED_EMPTY_PRICE_PASS","asof_et":p["asof_et"],
                    "source_price_blob_sha":blob,
                    "source_price_pass_count":0,"source_price_pass_hash":p["pass_hash"],
                    "source_price_unknown_count":p["unknown_count"],
                    "source_price_blocked_count":p.get("blocked_count",0),
                    "source_price_unknown_omitted_from_scope":True,
                    "source_price_blocked_omitted_from_scope":True,
                    "symbol_scope":[],"required_daily_official_sessions":daily,
                    "required_completed_week_closes":weekly,
                    "source_entitlement_proven":False,
                    "current_history_authority_proven":False,
                    "canonical_history_pass_created":0,"can_register_R92":False,
                    "execution":"NONE","real_money":"NO-GO"}
              out.write_text(json.dumps(data,sort_keys=True)+"\n")
              print("XRAY_HISTORY_REQUEST=BLOCKED_EMPTY_PRICE_PASS_NO_VENDOR_CALL")
          else:
              subprocess.run([sys.executable,"nasdaq-xray/current_history_source_request.py",
                  "--out",str(out)],check=True)
          PY
          python - <<'PY'
          import json,hashlib,subprocess,os
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_history_current_scope.json").read_text())
          p=json.loads(Path("nasdaq-xray/canonical_current_price_dv30.json").read_text())
          actual=subprocess.check_output(["git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],text=True).strip()
          assert q["source_price_blob_sha"]==actual
          assert q["asof_et"]==p["asof_et"]
          assert q["source_price_unknown_count"]==p["unknown_count"]
          assert q["source_price_blocked_count"]==p["blocked_count"]
          assert q["source_price_unknown_omitted_from_scope"] is True
          assert q["source_price_blocked_omitted_from_scope"] is True
          assert set(q["symbol_scope"]).isdisjoint(p.get("unknown_symbols",[]))
          assert set(q["symbol_scope"]).isdisjoint(p.get("blocked_symbols",[]))
          assert set(p.get("unknown_symbols",[])).isdisjoint(p.get("blocked_symbols",[]))
          assert q["source_price_pass_count"]==p["pass_count"]==len(q["symbol_scope"])
          assert (q["status"]=="BLOCKED_EMPTY_PRICE_PASS") == (p["pass_count"]==0)
          assert q["source_price_pass_hash"]==p["pass_hash"]
          assert len(q["required_daily_official_sessions"])==260
          assert len(q["required_completed_week_closes"])==52
          assert q["required_daily_official_sessions"][-1]==p["asof_et"]
          assert q["source_entitlement_proven"] is False
          assert q["current_history_authority_proven"] is False
          assert q["canonical_history_pass_created"]==0 and q["can_register_R92"] is False
          assert q["execution"]=="NONE" and q["real_money"]=="NO-GO"
          print("XRAY_CURRENT_PRICE_PASS_SCOPE_BOUND_TO_REAL_OFFICIAL_HISTORY_CALENDAR",p["pass_count"],p["asof_et"])
          PY
      - name: No live source, PRIMARY, R92, account, trade or delivery
        run: |
          python - <<'PY'
          import os,json
          assert not os.environ.get("XRAY_MASSIVE_API_KEY")
          assert not os.environ.get("XRAY_TWELVE_DATA_API_KEY")
          print("XRAY_HISTORY_TWO_PROVIDER_OFFLINE_ONLY_NO_VENDOR_DATA_NO_PRIMARY_NO_R92_NO_GO")
          import pathlib,subprocess
          scope=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"xray_history_current_scope.json").read_text())
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"xray_grouped_twelve_offline_regression_witness.json"
          out.write_text(json.dumps({
            "schema":"XRAY_MASSIVE_TWELVE_260_SYNTHETIC_REGRESSION_CI_SHADOW_V1",
            "git_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "massive_offline_selftest":"PASS","twelve_offline_selftest":"PASS",
            "price_pass_count":scope["source_price_pass_count"],
            "price_blob_sha":scope["source_price_blob_sha"],
            "asof_et":scope["asof_et"],
            "official_daily_count":len(scope["required_daily_official_sessions"]),
            "official_weekly_count":len(scope["required_completed_week_closes"]),
            "current_history_scope_ready_no_market_bars":scope["status"]=="RESEARCH_HISTORY_REQUEST_READY_NO_MARKET_HISTORY_MEASURED",
            "blocked_empty_price_pass":scope["status"]=="BLOCKED_EMPTY_PRICE_PASS",
            "current_price_unknown_promoted":False,
            "vendor_request_executed":False,"vendor_entitlement_verified":False,
            "canonical_history_promoted":False,"mc_primary_promoted":False,
            "r92_created":False,"execution":"NONE","real_money":"NO-GO",
            "release_status":"RESEARCH_ONLY"
          },indent=2,sort_keys=True)+"\n")
          PY
      - name: JSON witness independently parses and does not assert live source authority
        run: |
          python - <<'PY'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"xray_grouped_twelve_offline_regression_witness.json").read_text())
          assert x["massive_offline_selftest"]=="PASS" and x["twelve_offline_selftest"]=="PASS"
          assert x["price_pass_count"]>=0 and len(x["price_blob_sha"])==40
          assert x["blocked_empty_price_pass"] is (x["price_pass_count"]==0)
          assert x["official_daily_count"]==260 and x["official_weekly_count"]==52
          assert x["current_history_scope_ready_no_market_bars"] is (x["price_pass_count"]>0)
          for key in ("vendor_request_executed","vendor_entitlement_verified","canonical_history_promoted",
                      "mc_primary_promoted","r92_created","current_price_unknown_promoted"):
              assert x[key] is False,key
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          print("XRAY_OFFLINE_WITNESS_JSON_VALID_AND_NO_FAKE_GO")
          PY
      - name: Upload counts-only synthetic regression witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-massive-twelve-260-offline-regression-only
          path: ${{ runner.temp }}/xray_grouped_twelve_offline_regression_witness.json
          retention-days: 14
          if-no-files-found: warn
