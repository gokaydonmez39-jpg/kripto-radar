name: XRAY Monday Open DST Holiday and Half-Day Acceptance (No AL)
on:
  pull_request:
    paths:
      - "nasdaq-xray/monday_dst_market_calendar_acceptance.py"
      - "nasdaq-xray/root_weekend_quota_guard.py"
      - "nasdaq-xray/source_epoch_freshness_guard.py"
      - "nasdaq-xray/preopen_live_release_gate.py"
      - ".github/workflows/xray-monday-open-calendar-dst-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/monday_dst_market_calendar_acceptance.py"
      - "nasdaq-xray/root_weekend_quota_guard.py"
      - "nasdaq-xray/source_epoch_freshness_guard.py"
      - "nasdaq-xray/preopen_live_release_gate.py"
      - ".github/workflows/xray-monday-open-calendar-dst-acceptance.yml"
permissions:
  contents: read
concurrency:
  group: xray-monday-open-calendar-dst-acceptance
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned official Nasdaq session calendar
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Independently attest 19 Oct Monday ET/TR times, 1 Nov DST, holidays and shortened sessions
        run: |
          python -m py_compile nasdaq-xray/monday_dst_market_calendar_acceptance.py
          python nasdaq-xray/monday_dst_market_calendar_acceptance.py
          python -O nasdaq-xray/monday_dst_market_calendar_acceptance.py
      - name: Recheck original runtime calendar protections
        run: |
          python nasdaq-xray/source_epoch_freshness_guard.py --selftest
          python nasdaq-xray/root_weekend_quota_guard.py --selftest
          python nasdaq-xray/preopen_live_release_gate.py --selftest
      - name: Record research-only session acceptance
        run: |
          echo "## XRAY market session calendar verified (NOT AL acceptance)" >> "$GITHUB_STEP_SUMMARY"
          echo "Mon 19 Oct 2026: 09:30–16:00 EDT / 16:30–23:00 TRT." >> "$GITHUB_STEP_SUMMARY"
          echo "Mon 2 Nov 2026: 09:30–16:00 EST / 17:30–00:00 TRT (next day)." >> "$GITHUB_STEP_SUMMARY"
          echo "Closed Thanksgiving 26 Nov; early 13:00 EST close 27 Nov and 24 Dec." >> "$GITHUB_STEP_SUMMARY"
          echo "Exact latest complete NASDAQ session requires official close +30 minutes." >> "$GITHUB_STEP_SUMMARY"
          echo "No real-money, broker, vendor API, primary MC, R92 or phone delivery attested." >> "$GITHUB_STEP_SUMMARY"