name: XRAY NASDAQ Honest-Backtest DSR Research CI (NO AL)
on:
  pull_request:
    paths:
      - 'research/nasdaq_dsr_research.py'
      - 'research/test_nasdaq_dsr_research.py'
      - '.github/workflows/xray-nasdaq-honest-dsr.yml'
  push:
    branches: [main]
    paths:
      - 'research/nasdaq_dsr_research.py'
      - 'research/test_nasdaq_dsr_research.py'
      - '.github/workflows/xray-nasdaq-honest-dsr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-selection-bias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned MIT honest-backtest evidence library
        run: python -m pip install 'git+https://github.com/jersgcodes/honest-backtest.git@7f63e3228d368f1d86b7ee50651f0236e16de32c'
      - name: Negative controls for backtest selection bias
        run: |
          python -m unittest discover -s research -p 'test_nasdaq_dsr_research.py' -v
          python -O -m unittest discover -s research -p 'test_nasdaq_dsr_research.py' -v
      - name: Research is not an order or real return
        run: echo 'NO_SECRETS; NO_LIVE_MARKET_CALLS; NO_TRADING; NO_AL; NO_SHEETS; NO_DELIVERY'
