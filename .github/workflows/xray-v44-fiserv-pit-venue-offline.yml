name: XRAY v44 Fiserv PIT Venue Evidence Shadow (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/xray_v44_fiserv_venue_pit_shadow.py'
      - 'nasdaq-xray/test_xray_v44_fiserv_venue_pit_shadow.py'
      - '.github/workflows/xray-v44-fiserv-pit-venue-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-v44-venue-pit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-fiserv-venue-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile and run offline negative and positive tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/xray_v44_fiserv_venue_pit_shadow.py nasdaq-xray/test_xray_v44_fiserv_venue_pit_shadow.py
          cd nasdaq-xray
          python -m unittest -v test_xray_v44_fiserv_venue_pit_shadow.py
          python -O -m unittest -v test_xray_v44_fiserv_venue_pit_shadow.py
      - name: Reject network imports and authority promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('nasdaq-xray/xray_v44_fiserv_venue_pit_shadow.py')
          c=p.read_text()
          modules=[]
          for n in ast.walk(ast.parse(c)):
              if isinstance(n,ast.Import):modules.extend(a.name.split('.')[0] for a in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module:modules.append(n.module.split('.')[0])
          forbidden=set(modules)&{'requests','urllib','http','socket','subprocess','alpaca','ccxt','os','pathlib'}
          if forbidden:raise SystemExit('FORBIDDEN_IMPORT: '+str(sorted(forbidden)))
          for invariant in ("'canonical_price_pass': False", "'a1_release_ready': False", "'registered_r92_count': 0", "'execution': 'NONE'", "'real_money': 'NO-GO'"):
              if invariant not in c:raise SystemExit('SAFETY_INVARIANT_MISSING '+invariant)
          print('XRAY_V44_OFFLINE_FAIL_CLOSED=PASS')
          PY