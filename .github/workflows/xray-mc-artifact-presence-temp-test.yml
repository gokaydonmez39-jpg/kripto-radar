name: XRAY MC Presence Exact Grammar TEMP
on:
  push:
    branches: [xray/chain-health-strict-mc-filename-20261015]
    paths:
      - ".github/workflows/xray-mc-artifact-presence-temp-test.yml"
permissions:
  contents: read
jobs:
  negative:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned calendar for existing watchdog dependency
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Compile and run strict canonical MC presence regressions
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/github_native_chain_health.py
          python nasdaq-xray/github_native_chain_health.py --selftest
          echo "XRAY_STRICT_MC_PRESENCE_TEST=EXECUTED_NO_PROVIDER_CALLS_NO_TRADE"
