name: XRAY Merge Rallies Recovery Evidence

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/merge_rallies_parts.py"
      - "nasdaq-xray/rallies_dv20_part*.json"
      - ".github/workflows/xray-rallies-merge.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-rallies-merge
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge exact20 evidence
        run: python nasdaq-xray/merge_rallies_parts.py
      - name: Commit compact summary
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/rallies_recovery_summary.json
          git commit -m "chore(xray): compact Rallies recovery summary [skip ci]" || exit 0
          git pull --rebase origin main
          git push
