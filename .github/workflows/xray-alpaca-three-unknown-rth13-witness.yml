name: XRAY Alpaca Three Canonical UNKNOWN RTH13 Research Witness (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/tests/test_alpaca_connected_three_unknown_rth13.py'
      - 'nasdaq-xray/research/alpaca_connected_sip_three_unknown_20261018_exact13_rth_v1.json'
      - '.github/workflows/xray-alpaca-three-unknown-rth13-witness.yml'
  push:
    branches: [main]
    paths:
      - 'nasdaq-xray/tests/test_alpaca_connected_three_unknown_rth13.py'
      - 'nasdaq-xray/research/alpaca_connected_sip_three_unknown_20261018_exact13_rth_v1.json'
      - '.github/workflows/xray-alpaca-three-unknown-rth13-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-alpaca-three-unknown-rth13-${{ github.ref }}
  cancel-in-progress: true
jobs:
  no-keys-no-vendor-no-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test exact canonical UNKNOWN membership and single-day RTH count twice
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/tests/test_alpaca_connected_three_unknown_rth13.py
          python -m unittest discover -s nasdaq-xray/tests -p test_alpaca_connected_three_unknown_rth13.py -v
          python -O -m unittest discover -s nasdaq-xray/tests -p test_alpaca_connected_three_unknown_rth13.py -v
      - name: No vendor calls no market data published and no broker or AL
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          f=Path("nasdaq-xray/tests/test_alpaca_connected_three_unknown_rth13.py")
          tree=ast.parse(f.read_text())
          names=set()
          for x in ast.walk(tree):
              if isinstance(x,ast.Import):names.update(a.name.split('.')[0] for a in x.names)
              elif isinstance(x,ast.ImportFrom) and x.module:names.add(x.module.split('.')[0])
          assert not names&{"requests","httpx","urllib","socket","subprocess","alpaca","ccxt"}
          print("XRAY_SIP_3_CANONICAL_UNKNOWN=RESEARCH_ONLY_13_OF_13_EACH_NO_AL")
          PY
