name: XRAY Root Stage Relay Regression (No Dispatch)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "nasdaq-xray/github_native_stage_relay.py"
      - ".github/workflows/xray-native-root-stage-relay-selftest.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/github_native_stage_relay.py"
      - ".github/workflows/nasdaq-xray-daily.yml"
      - ".github/workflows/xray-native-root-stage-relay-selftest.yml"
permissions:
  contents: read
jobs:
  source-epoch-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Nasdaq session calendar needed by root watchdog
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pandas_market_calendars==5.4.0
      - name: Compile root/watchdog and zero-alpha stage relay
        run: |
          python -m py_compile nasdaq-xray/github_native_stage_relay.py nasdaq-xray/github_native_root_watchdog.py
          python nasdaq-xray/github_native_stage_relay.py --selftest
      - name: Verify actual root-to-canonical epoch rollover is an audit trigger, not AL
        run: |
          python - <<'PY'
          import json,sys
          from datetime import date,datetime,timezone
          from pathlib import Path
          b=Path("nasdaq-xray")
          sys.path.insert(0,str(b))
          from github_native_stage_relay import classify
          root=json.loads((b/"orchestrator_state.json").read_text())
          master=json.loads((b/"canonical_current_master_manifest.json").read_text())
          price=json.loads((b/"canonical_current_price_dv30.json").read_text())
          terminal=json.loads((b/"canonical_current_terminal.json").read_text())
          assert root["execution"]=="NONE" and root["real_money"]=="NO-GO"
          assert master["unknown_never_pass"] is True
          assert price["unknown_never_pass"] is True
          assert master["asof_et"]==price["asof_et"]
          assert date.fromisoformat(master["asof_et"])<=date.fromisoformat(root["asof_et"])
          reason,eligible=classify(datetime.now(timezone.utc),root,master,price,terminal,[])
          if master["asof_et"]<root["asof_et"]:
              assert (reason,eligible)==("STALE_CANONICAL_EPOCH_PRE_MC_REFRESH_ELIGIBLE",True)
          elif terminal["asof_et"]==root["asof_et"] and terminal.get("full_end_to_end_research_pass") is True:
              assert not eligible
          else:
              assert eligible and reason=="EXACT_SOURCE_EPOCH_PRE_MC_RELAY_ELIGIBLE"
          print("XRAY_ROOT_CURRENT_ASOF="+root["asof_et"])
          print("XRAY_CANONICAL_MASTER_PRICE_ASOF="+master["asof_et"])
          print("XRAY_TERMINAL_LAST_ASOF="+terminal["asof_et"])
          print("XRAY_PREMC_DISPATCH_DECISION="+reason+"; NO_SOURCE_PROMOTION_NO_TRADES")
          PY
