name: XRAY C4.18 SEC-Alpaca Provenance Intersection (No Production)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/xray-c418-sec-alpaca-intersection-shadow.yml"
      - "nasdaq-xray/shadow_source_scope_preflight.py"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/c418_preopen_intersection_guard.py"
      - "nasdaq-xray/shadow_source_scope_preflight.py"
      - "nasdaq-xray/c418_crossfeed_dailybar_shadow.py"
      - ".github/workflows/xray-c418-sec-alpaca-intersection-shadow.yml"
  workflow_run:
    workflows:
      - "XRAY SEC Full PRICE-PASS Vintage Shadow"
      - "XRAY Alpaca 515 Exact-260 SIP Shadow Full Scope (No GO)"
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: xray-c418-sec-alpaca-joined-source-current
  cancel-in-progress: true
jobs:
  exact-provenance-only:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify immutable event source; detect main drift without promoting research
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$remote_sha"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "XRAY_C418_PARTITION_EPOCH=ARCHIVED_EVENT_SNAPSHOT_NO_PRIMARY_AUTHORITY"
          else
            echo "XRAY_C418_PARTITION_EPOCH=CURRENT_AT_PRECHECK_RESEARCH_ONLY"
          fi
          # The downstream join still checks immutable PRICE/MASTER Git blobs,
          # same ASOF, cohort and symbol sets. No canonical writes or R92.
          echo "XRAY_C418_PARTITION_SOURCE_SHA=EXACT_EVENT_SNAPSHOT_NOT_RELEASE_ATTESTATION"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned official calendar and test adversarial partitions
        run: |
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python -m py_compile nasdaq-xray/c418_preopen_intersection_guard.py
          python nasdaq-xray/c418_preopen_intersection_guard.py --selftest
          python -m py_compile nasdaq-xray/c418_crossfeed_dailybar_shadow.py
          python nasdaq-xray/c418_crossfeed_dailybar_shadow.py --selftest
          python -O nasdaq-xray/c418_crossfeed_dailybar_shadow.py --selftest
      - name: Require exact current PRICE scope or explicitly block 0-PASS join
        id: source_scope
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/shadow_source_scope_preflight.py
          python nasdaq-xray/shadow_source_scope_preflight.py --selftest
          python -O nasdaq-xray/shadow_source_scope_preflight.py --selftest
          python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,"nasdaq-xray")
          from shadow_source_scope_preflight import verify
          root=Path("nasdaq-xray")
          master=json.loads((root/"canonical_current_master_manifest.json").read_text())
          price=json.loads((root/"canonical_current_price_dv30.json").read_text())
          try:
              verified=verify(master,price)
          except ValueError as exc:
              if str(exc)!="NO_CANONICAL_PRICE_PASS_SCOPE":
                  raise
              # Only an exact, internally consistent canonical zero-PASS
              # partition is a safe expected NO-JOIN. Never catch a bad
              # SHA, date, execution, missing source, or invented PASS.
              assert price["pass_symbols"]==[] and price["pass_count"]==0
              assert price["pass_hash"]==hashlib.sha256(b"").hexdigest()
              unknown=price["unknown_symbols"]
              blocked=price.get("blocked_symbols",[])
              full=master["pass_symbols"]
              assert isinstance(unknown,list) and unknown==sorted(set(unknown))
              assert len(unknown)==price["unknown_count"]
              assert isinstance(blocked,list) and blocked==sorted(set(blocked))
              assert len(blocked)==price.get("blocked_count",0)
              assert set(unknown).isdisjoint(blocked)
              assert set(unknown)|set(blocked) <= set(full)
              rows=price["results"]
              assert isinstance(rows,dict) and all(
                  isinstance(rows.get(sym),dict) and
                  rows[sym].get("status")!="PASS_PRICE_DV30"
                  for sym in unknown+blocked)
              def sha(path):
                  return subprocess.check_output(
                      ["git","hash-object",str(path)],text=True).strip()
              doc={
                  "schema":"XRAY_C418_PREOPEN_EXACT_PARTITION_SHADOW_V1",
                  "status":"BLOCKED_ZERO_PRICE_PASS_NO_INTERSECTION",
                  "asof_et":price["asof_et"],"price_pass_scope":0,
                  "price_unknown_scope":len(unknown),
                  "source_price_blob_sha":sha(root/"canonical_current_price_dv30.json"),
                  "source_master_blob_sha":sha(root/"canonical_current_master_manifest.json"),
                  "sec_alpaca_join_attempted":False,
                  "technical_intersection":0,
                  "can_create_PRIMARY":False,
                  "can_create_HISTORY_PASS":False,
                  "can_register_R92":False,
                  "production_authority":False,
                  "vendor_raw_bars_exported":False,
                  "raw_share_counts_exported":False,
                  "execution":"NONE","real_money":"NO-GO",
                  "unknown_never_pass":True,
              }
              (Path(os.environ["RUNNER_TEMP"])/"xray_c418_exact_partition.json").write_text(
                  json.dumps(doc,sort_keys=True,indent=2)+"\n")
              with open(os.environ["GITHUB_OUTPUT"],"a") as output:
                  output.write("eligible=false\n")
              print("XRAY_C418_ZERO_PRICE=NO_SEC_ALPACA_JOIN_NO_SOURCE_AUTHORITY_NO_R92")
          else:
              assert verified["price_pass_count"]>0
              with open(os.environ["GITHUB_OUTPUT"],"a") as output:
                  output.write("eligible=true\n")
              print("XRAY_C418_NONEMPTY_COHORT=SOURCE_WITNESSES_STILL_REQUIRED")
          PY
      - name: Download latest matching SANITIZED full-scope SEC and Alpaca source witnesses
        if: steps.source_scope.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for provider in sec alpaca; do
            if [[ "$provider" = sec ]]; then
              workflow="xray-sec-full-price-pass-vintage-shadow.yml"
              artifact="xray-sec-full-price-pass-vintage-shadow-v1"
              target="xray_sec_full_price_pass_vintage_operational.json"
            else
              workflow="xray-alpaca-full-515-260-sip-shadow.yml"
              artifact="xray-515-exact260-sip-status-no-vendor-bars"
              target="xray_alpaca_full_515_shadow.json"
            fi
            found=0
            runs=$(gh run list -R "${{ github.repository }}" --workflow "$workflow" --branch main \
              --status success --limit 50 --json databaseId --jq '.[].databaseId')
            for id in $runs; do
              dir="$RUNNER_TEMP/xray_c418_join/$provider/$id"
              if ! gh run download "$id" -R "${{ github.repository }}" -n "$artifact" -D "$dir" >/dev/null 2>&1; then
                continue
              fi
              if [[ ! -s "$dir/$target" ]]; then continue; fi
              if python - "$dir/$target" "$provider" <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          source=json.loads(Path(sys.argv[1]).read_text())
          kind=sys.argv[2]
          p=Path("nasdaq-xray/canonical_current_price_dv30.json")
          m=Path("nasdaq-xray/canonical_current_master_manifest.json")
          price=json.loads(p.read_text())
          master=json.loads(m.read_text())
          assert price["asof_et"]==master["asof_et"]==source["asof_et"]
          psha=subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
          msha=subprocess.check_output(["git","hash-object",str(m)],text=True).strip()
          if kind=="sec":
              assert source["schema"]=="XRAY_SEC_MULTISYMBOL_PIT_SHADOW_V1"
              assert source["price_git_blob_sha"]==psha
              assert source["master_git_blob_sha"]==msha
              assert source["sample_count"]==price["pass_count"]
              assert set(source["statuses"])==set(price["pass_symbols"])
          else:
              assert source["schema"]=="XRAY_ALPACA_CURRENT_515_EXACT260_SIP_SHADOW_V1"
              assert source["source_price_blob_sha"]==psha
              assert source["source_master_blob_sha"]==msha
              assert source["price_pass_count"]==price["pass_count"]
              assert source["expected_scope_count"]==price["pass_count"]+1
              assert source["measured_scope_count"]==source["expected_scope_count"]
          print("XRAY_C418_SOURCE_ARTIFACT=EXACT_ASOF_SCOPE_SHA")
          PY
              then
                cp "$dir/$target" "$RUNNER_TEMP/xray_c418_$provider.json"
                echo "XRAY_C418_MATCHED_${provider^^}_RUN_ID=$id"
                found=1
                break
              fi
            done
            if [[ "$found" != 1 ]]; then
              echo "XRAY_C418_${provider^^}_NO_SHA_BOUND_SUCCESSFUL_WITNESS" >&2
              exit 2
            fi
          done
      - name: Evaluate current 260x52 and SEC shares-vintage exact set intersection
        if: steps.source_scope.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python nasdaq-xray/c418_preopen_intersection_guard.py \
            --private-alpaca "$RUNNER_TEMP/xray_c418_alpaca.json" \
            --private-sec "$RUNNER_TEMP/xray_c418_sec.json" \
            --out "$RUNNER_TEMP/xray_c418_exact_partition.json"
          status=$?
          set -e
          if [[ "$status" != 2 || ! -s "$RUNNER_TEMP/xray_c418_exact_partition.json" ]]; then
            echo "XRAY_C418_PARTITION_AUTHORITY_OR_SOURCE_INVALID" >&2
            exit 2
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_c418_exact_partition.json").read_text())
          assert x["schema"]=="XRAY_C418_PREOPEN_EXACT_PARTITION_SHADOW_V1"
          assert x["status"]=="EXACT_RESEARCH_PARTITION_ONLY"
          assert x["technical_intersection"]+x["history_observed_sec_unknown"]+x["history_short_in_price_pass"]==x["price_pass_scope"]
          assert x["history_shadow_numeric_complete"]+x["history_short_in_price_pass"]==x["price_pass_scope"]
          assert x["can_create_PRIMARY"] is False and x["can_create_HISTORY_PASS"] is False
          assert x["can_register_R92"] is False and x["production_authority"] is False
          assert x["vendor_raw_bars_exported"] is False and x["raw_share_counts_exported"] is False
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          print("XRAY_C418_SAME_ASOF_INTERSECTION=PASS_RESEARCH_ONLY")
          print("XRAY_C418_INTERSECTION_COUNTS="+json.dumps({
              "technical_intersection":x["technical_intersection"],
              "history_observed_sec_unknown":x["history_observed_sec_unknown"],
              "history_short_in_price_pass":x["history_short_in_price_pass"],
          },sort_keys=True))
          PY
      - name: Retain ONLY sanitized counts, SHA and reason partitions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-c418-sec-alpaca-exact-set-research-only
          path: ${{ runner.temp }}/xray_c418_exact_partition.json
          if-no-files-found: ignore
          retention-days: 14
