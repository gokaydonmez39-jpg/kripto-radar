name: XRAY NASDAQ Preregistered Hypothesis Falsification (NO AI AGENT)
on:
  pull_request:
    paths:
      - 'research/nasdaq_hypothesis_preregistration.py'
      - 'research/test_nasdaq_hypothesis_preregistration.py'
      - '.github/workflows/xray-nasdaq-hypothesis-falsification.yml'
  push:
    branches: [main]
    paths:
      - 'research/nasdaq_hypothesis_preregistration.py'
      - 'research/test_nasdaq_hypothesis_preregistration.py'
      - '.github/workflows/xray-nasdaq-hypothesis-falsification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-preregistration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail closed on survivorship bias, tampering and holdout reuse
        run: |
          python -m unittest discover -s research -p 'test_nasdaq_hypothesis_preregistration.py' -v
          python -O -m unittest discover -s research -p 'test_nasdaq_hypothesis_preregistration.py' -v
      - name: No autonomous strategy search or external service credentials
        run: echo 'NASDAQ_HYPOTHESIS_METHOD_ONLY; NO_AUTONOMOUS_AGENT; NO_AL; NO_ORDERS; NO_PRIVATE_DATA; NO_NOTIFICATIONS'
