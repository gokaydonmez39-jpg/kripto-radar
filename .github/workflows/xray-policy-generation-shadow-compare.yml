name: XRAY Policy Generation Shadow Compare

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/shadow_c417_vs_52_a.py"
      - ".github/workflows/xray-policy-generation-shadow-compare.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-policy-generation-shadow-compare
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt
      - name: Run non-authoritative Family-A policy-generation comparison
        run: python nasdaq-xray/shadow_c417_vs_52_a.py
      - name: Commit diagnostic artifact only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nasdaq-xray/canonical_shadow_c417_vs_52_a.json
          if git diff --cached --quiet; then
            echo "NO_DIAGNOSTIC_CHANGE"
          else
            git commit -m "chore(xray): refresh C4.17 vs 5.2 A shadow diagnostic [skip ci]"
            git push
          fi
