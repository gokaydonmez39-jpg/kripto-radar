name: XRAY Native Root No-Progress Circuit CI (NO DISPATCH)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/root_semantic_stall_circuit.py"
      - "nasdaq-xray/root_compute_run_provenance.py"
      - "nasdaq-xray/test_root_compute_run_provenance.py"
      - "nasdaq-xray/test_root_semantic_stall_circuit.py"
      - "nasdaq-xray/root_schedule_stall_preflight.py"
      - "nasdaq-xray/test_root_schedule_stall_preflight.py"
      - ".github/workflows/nasdaq-xray-daily.yml"
      - "nasdaq-xray/github_native_root_watchdog.py"
      - ".github/workflows/xray-github-native-root-watchdog.yml"
      - ".github/workflows/xray-root-semantic-stall-ci.yml"

permissions:
  contents: read

jobs:
  offline-circuit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deterministic official XNAS session calendar
        run: python -m pip install pandas_market_calendars==5.4.0
      - name: Compile and bounded positive and negative circuit selftests
        run: |
          python -m py_compile nasdaq-xray/root_compute_run_provenance.py nasdaq-xray/test_root_compute_run_provenance.py nasdaq-xray/root_semantic_stall_circuit.py nasdaq-xray/github_native_root_watchdog.py nasdaq-xray/test_root_semantic_stall_circuit.py nasdaq-xray/root_schedule_stall_preflight.py nasdaq-xray/test_root_schedule_stall_preflight.py
          python nasdaq-xray/root_semantic_stall_circuit.py
          python nasdaq-xray/root_compute_run_provenance.py
          python nasdaq-xray/github_native_root_watchdog.py --selftest
          python nasdaq-xray/root_weekend_quota_guard.py --selftest
          python nasdaq-xray/root_checkpoint_semantic_noop.py --selftest
          python -O nasdaq-xray/root_checkpoint_semantic_noop.py --selftest
      - name: Independent falsification normal and optimized
        working-directory: nasdaq-xray
        run: |
          python -m unittest -v test_root_semantic_stall_circuit
          python -m unittest -v test_root_compute_run_provenance
          python -O -m unittest -v test_root_semantic_stall_circuit
          python -O -m unittest -v test_root_compute_run_provenance
          python -m unittest -v test_root_schedule_stall_preflight
          python -O -m unittest -v test_root_schedule_stall_preflight
      - name: No dispatch, broker, private Sheet or new cron
        run: echo "XRAY_STALLED_ROOT_CIRCUIT_CI=OFFLINE_NO_DISPATCH_NO_MUTATION_NO_CRYPTO"
