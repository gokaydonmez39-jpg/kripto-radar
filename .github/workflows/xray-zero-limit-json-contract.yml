name: XRAY Zero Limit JSON Contract (No Vendor)
on:
  push:
    paths:
      - ".github/workflows/xray-zero-limit-json-contract.yml"
      - "nasdaq-xray/zero_limit_core_rebind_readiness.py"
  pull_request:
    paths:
      - ".github/workflows/xray-zero-limit-json-contract.yml"
      - "nasdaq-xray/zero_limit_core_rebind_readiness.py"
permissions:
  contents: read
concurrency:
  group: xray-zero-limit-json-contract-offline
  cancel-in-progress: false
jobs:
  verify-json:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install official calendar dependency
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Negative and optimized-mode contract selftests
        run: |
          python -m py_compile nasdaq-xray/zero_limit_core_rebind_readiness.py
          python nasdaq-xray/zero_limit_core_rebind_readiness.py --selftest
          python -O nasdaq-xray/zero_limit_core_rebind_readiness.py --selftest
      - name: Read current sources and require a valid fail-closed JSON report
        run: |
          python nasdaq-xray/zero_limit_core_rebind_readiness.py --check-current --out "$RUNNER_TEMP/zero_limit_contract.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "zero_limit_contract.json"
          raw = path.read_bytes()
          assert raw.endswith(b"\n") and not raw.endswith(b"\\n")
          report = json.loads(raw.decode("utf-8"))
          assert report["schema"] == "XRAY_ZERO_LIMIT_CORE_REBIND_READINESS_V1"
          assert report["execution"] == "NONE" and report["real_money"] == "NO-GO"
          assert report["unknown_never_pass"] is True
          assert report["api_calls"] == 0 and report["external_http"] is False
          assert report["true_full_go"] is False
          assert report["primary_mc_count_created"] == 0
          assert report["r92_count_created"] == 0
          print("XRAY_ZERO_LIMIT_STRICT_JSON_ROUNDTRIP=PASS_NO_VENDOR_NO_ALPHA")
          PY