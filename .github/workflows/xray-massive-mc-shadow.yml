name: XRAY Massive MC Free-Tier Shadow
# Deprecated hourly live sampling to prevent free-plan quota collision with
# the encrypted resumable Massive MC shadow. Manual diagnostics remain possible.
on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Zero-based current PRICE/DV30 PASS slice index (auto = daily advancing hourly bucket; max five calls)"
        type: string
        required: false
        default: "auto"
permissions:
  contents: read
concurrency:
  group: xray-massive-mc-shadow
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      XRAY_MASSIVE_API_KEY: ${{ secrets.XRAY_MASSIVE_API_KEY }}
      XRAY_MASSIVE_OFFSET: ${{ github.event.inputs.offset || 'auto' }}
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent fail-closed contract self-test
        run: |
          python -m py_compile nasdaq-xray/massive_mc_shadow_probe.py
          python nasdaq-xray/massive_mc_shadow_probe.py --selftest
          python -m py_compile nasdaq-xray/massive_mc_public_telemetry.py
          python nasdaq-xray/massive_mc_public_telemetry.py --selftest
      - name: Research-only Massive reference probe (maximum five calls)
        run: |
          python nasdaq-xray/massive_mc_shadow_probe.py \
            --offset "$XRAY_MASSIVE_OFFSET" \
            --limit 5 \
            --out "$RUNNER_TEMP/xray_massive_mc_shadow.json" > "$RUNNER_TEMP/xray_massive_private_stdout.log"
          echo "MC_SHADOW_PROBE_COMPLETED_PRIVATE_EPHEMERAL"
      - name: Sanitize public telemetry (no vendor market data)
        run: |
          python nasdaq-xray/massive_mc_public_telemetry.py \
            --input "$RUNNER_TEMP/xray_massive_mc_shadow.json" \
            --out "$RUNNER_TEMP/xray_massive_mc_telemetry.json"
      - name: Publish operational telemetry only
        uses: actions/upload-artifact@v4
        with:
          name: xray-massive-mc-operational-telemetry
          path: ${{ runner.temp }}/xray_massive_mc_telemetry.json
          if-no-files-found: error
          retention-days: 14
