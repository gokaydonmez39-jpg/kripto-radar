name: XRAY TEMP Nasdaq Official Historical Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-temp-nasdaq-official-settlement-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe Nasdaq official historical with ISO dates
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for sym in ["AAPL","NVDA","MSFT"]:
              params=urllib.parse.urlencode({
                  "assetclass":"stocks",
                  "fromdate":"2026-10-01",
                  "todate":"2026-10-02",
                  "limit":"50"
              })
              url=f"https://api.nasdaq.com/api/quote/{sym}/historical?{params}"
              req=urllib.request.Request(url,headers={
                  "User-Agent":UA,
                  "Accept":"application/json,text/plain,*/*",
                  "Accept-Language":"en-US,en;q=0.9",
                  "Referer":f"https://www.nasdaq.com/market-activity/stocks/{sym.lower()}/historical"
              })
              with urllib.request.urlopen(req,timeout=30) as resp:
                  obj=json.loads(resp.read().decode("utf-8"))
              rows=(((obj.get("data") or {}).get("tradesTable") or {}).get("rows") or [])
              print("NASDAQ_OFFICIAL_ISO",sym,json.dumps(rows[:10],sort_keys=True))
          PY
