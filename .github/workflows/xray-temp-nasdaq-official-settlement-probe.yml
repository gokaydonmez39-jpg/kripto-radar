name: XRAY TEMP Nasdaq Official Settlement Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-temp-nasdaq-official-settlement-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Nasdaq official historical
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for sym in ["AAPL","NVDA","MSFT"]:
              params=urllib.parse.urlencode({"assetclass":"stocks","fromdate":"10/02/2026","todate":"10/02/2026","limit":"50"})
              url=f"https://api.nasdaq.com/api/quote/{sym}/historical?{params}"
              req=urllib.request.Request(url,headers={
                  "User-Agent":UA,
                  "Accept":"application/json,text/plain,*/*",
                  "Accept-Language":"en-US,en;q=0.9",
                  "Referer":"https://www.nasdaq.com/",
              })
              with urllib.request.urlopen(req,timeout=30) as r:
                  obj=json.loads(r.read().decode("utf-8"))
              rows=(((obj.get("data") or {}).get("tradesTable") or {}).get("rows") or [])
              print("NASDAQ_OFFICIAL",sym,json.dumps(rows[:3],sort_keys=True))
          PY
