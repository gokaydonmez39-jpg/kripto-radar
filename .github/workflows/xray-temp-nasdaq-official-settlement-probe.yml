name: XRAY TEMP C4.15 Migration Dry Run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-temp-nasdaq-official-settlement-probe.yml"
      - "nasdaq-xray/probes/c415_migration_dryrun.py"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install invariant runtime
        run: python -m pip install --disable-pip-version-check akshare==1.18.95 pandas_market_calendars
      - name: Apply migration in worktree only
        run: python nasdaq-xray/probes/c415_migration_dryrun.py
      - name: Compile modified production Python
        run: |
          python -m py_compile \
            nasdaq-xray/build_current_event_request.py \
            nasdaq-xray/build_current_event_state.py \
            nasdaq-xray/build_current_resolver_request.py \
            nasdaq-xray/build_current_terminal.py \
            nasdaq-xray/price_dv20_recover_from_fullstate.py \
            nasdaq-xray/test_dynamic_policy_invariants.py
      - name: Run deterministic alpha invariants
        run: python nasdaq-xray/test_dynamic_policy_invariants.py
      - name: Verify C4.15 policy
        run: |
          python - <<'PY'
          import json, hashlib
          t=json.load(open("nasdaq-xray/chatgpt_compiled_policy_v3.json"))
          p=json.loads(t["payload_json"])
          assert t["schema"]=="XRAY_GITHUB_COMPILED_POLICY_V3"
          assert t["execution"]=="NONE" and t["real_money"]=="NO-GO"
          assert hashlib.sha256(t["payload_json"].encode()).hexdigest()==t["policy_hash"]
          assert t["policy_hash"]=="7454b9156b6161f1bd3f44d150f71e03f99b471466ce364aa5a490e29e39a015"
          assert p["version"]=="C4.15"
          assert p["hard_gates"]["price"]==">10"
          assert p["hard_gates"]["market_cap"]==">=2000000000 USD"
          assert p["hard_gates"]["dv20"]=="median exactly20 completed official-RTH Close*regular-session Volume >=50000000"
          assert p["g9"]["never"]==["IEX","delayed SIP","Nasdaq Basic","Cboe One","single/partial venue","last-only","unknown lineage"]
          assert p["settlement_change"]["id"]=="SETTLEMENT_ZERO_DOLLAR_CROSSCHECK_V2"
          assert p["settlement_change"]["base_policy_version"]=="C4.14"
          assert p["settlement"]["massive_polygon_role"]=="OPTIONAL_DIAGNOSTIC_ONLY_NOT_REQUIRED"
          assert p["settlement"]["zero_dollar_fail_closed"] is True
          print("C415_POLICY_VALIDATION=PASS")
          PY
      - name: Diff integrity
        run: |
          git diff --check
          git diff --stat
          echo "C415_DRY_RUN=PASS"
