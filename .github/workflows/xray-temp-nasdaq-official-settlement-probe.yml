name: XRAY TEMP Nasdaq Same-Day Official Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-temp-nasdaq-official-settlement-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe Nasdaq summary info chart
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for sym in ["AAPL","NVDA","MSFT"]:
              headers={"User-Agent":UA,"Accept":"application/json,text/plain,*/*","Accept-Language":"en-US,en;q=0.9","Referer":f"https://www.nasdaq.com/market-activity/stocks/{sym.lower()}"}
              for endpoint in ["summary","info","chart"]:
                  params={"assetclass":"stocks"}
                  if endpoint=="chart": params["charttype"]="real"
                  url=f"https://api.nasdaq.com/api/quote/{sym}/{endpoint}?"+urllib.parse.urlencode(params)
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=30) as resp:
                          obj=json.loads(resp.read().decode("utf-8"))
                      data=obj.get("data")
                      if endpoint=="summary":
                          print("NASDAQ_SUMMARY",sym,json.dumps(data,sort_keys=True)[:12000])
                      elif endpoint=="info":
                          print("NASDAQ_INFO",sym,json.dumps(data,sort_keys=True)[:12000])
                      else:
                          print("NASDAQ_CHART",sym,json.dumps(data,sort_keys=True)[:12000])
                  except Exception as e:
                      print("NASDAQ_ENDPOINT_ERROR",sym,endpoint,type(e).__name__,str(e)[:300])
          PY
