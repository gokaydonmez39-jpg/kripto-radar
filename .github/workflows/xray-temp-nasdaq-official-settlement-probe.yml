name: XRAY TEMP C4.16 Production Migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-temp-nasdaq-official-settlement-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-c416-production-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install invariant runtime
        run: python -m pip install --disable-pip-version-check akshare==1.18.95 pandas_market_calendars
      - name: Apply validated C4.16 settlement-failover migration atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if python - <<'PYCHECK'
          import json,sys
          t=json.load(open("nasdaq-xray/chatgpt_compiled_policy_v3.json"))
          p=json.loads(t["payload_json"])
          if p.get("version")=="C4.17":
              ok=(t.get("policy_hash")=="26a95745a50b65e85f6ece24b6501af0994764a84ddd886edb70d1fcd770849c"
                  and p.get("mc_identity_correction_change",{}).get("id")=="MC_SEC_SHARE_COUNT_VERIFIED_WATCH_V1"
                  and p.get("settlement_fallback_change",{}).get("id")=="SETTLEMENT_ZERO_DOLLAR_CONNECTOR_FAILOVER_V1")
              sys.exit(0 if ok else 2)
          if p.get("version")=="C4.16":
              ok=(t.get("policy_hash")=="a2bb9e857759e2b1c312fe1ec78ffefb4ac3e81c5c2012c921d245da0bc6a094"
                  and p.get("settlement_fallback_change",{}).get("id")=="SETTLEMENT_ZERO_DOLLAR_CONNECTOR_FAILOVER_V1")
              sys.exit(0 if ok else 2)
          sys.exit(1 if p.get("version")=="C4.15" else 2)
          PYCHECK
            then
              echo "C416_OR_SUCCESSOR_ALREADY_APPLIED=PASS"
              exit 0
            else
              rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "C416_UNEXPECTED_OR_PARTIAL_POLICY_STATE" >&2
                exit 1
              fi
            fi

            python nasdaq-xray/probes/c416_migration_dryrun.py

            python -m py_compile \
              nasdaq-xray/build_current_event_request.py \
              nasdaq-xray/build_current_event_state.py \
              nasdaq-xray/build_current_resolver_request.py \
              nasdaq-xray/build_current_terminal.py \
              nasdaq-xray/price_dv20_recover_from_fullstate.py \
              nasdaq-xray/test_dynamic_policy_invariants.py
            python nasdaq-xray/test_dynamic_policy_invariants.py

            python - <<'PYVERIFY'
          import json,hashlib,subprocess
          from pathlib import Path
          newh="a2bb9e857759e2b1c312fe1ec78ffefb4ac3e81c5c2012c921d245da0bc6a094"
          newb="9e159f46b86f700b66a7eb60886d0a8af8ee9b24"
          oldh="7454b9156b6161f1bd3f44d150f71e03f99b471466ce364aa5a490e29e39a015"
          oldb="a11947566c170d47e4d806a9e17bd8830d7c83fc"
          top=json.load(open("nasdaq-xray/chatgpt_compiled_policy_v3.json"))
          p=json.loads(top["payload_json"])
          assert hashlib.sha256(top["payload_json"].encode()).hexdigest()==top["policy_hash"]==newh
          assert p["version"]=="C4.16"
          assert subprocess.check_output(["git","hash-object","nasdaq-xray/chatgpt_compiled_policy_v3.json"],text=True).strip()==newb
          assert p["settlement_change"]["id"]=="SETTLEMENT_ZERO_DOLLAR_CROSSCHECK_V2"
          assert p["settlement_fallback_change"]["id"]=="SETTLEMENT_ZERO_DOLLAR_CONNECTOR_FAILOVER_V1"
          assert p["settlement"]["primary"]=="ALPACA_HISTORICAL_SIP_DAILY_AFTER_15M"
          assert p["settlement"]["connector_failover"]=="RALLIES_LONGBRIDGE_DUAL_SOURCE_SETTLEMENT_V1"
          targets=[
            "nasdaq-xray/build_current_event_request.py",
            "nasdaq-xray/build_current_event_state.py",
            "nasdaq-xray/build_current_resolver_request.py",
            "nasdaq-xray/build_current_terminal.py",
            "nasdaq-xray/price_dv20_recover_from_fullstate.py",
            ".github/workflows/xray-canonical-current-pre-mc.yml",
            ".github/workflows/xray-canonical-current-post-mc.yml",
            ".github/workflows/xray-canonical-current-final.yml",
          ]
          blob_bound={
            "nasdaq-xray/build_current_event_request.py",
            "nasdaq-xray/build_current_resolver_request.py",
            "nasdaq-xray/price_dv20_recover_from_fullstate.py",
            ".github/workflows/xray-canonical-current-pre-mc.yml",
            ".github/workflows/xray-canonical-current-final.yml",
          }
          for name in targets:
              t=Path(name).read_text()
              assert oldh not in t and oldb not in t
              assert newh in t and "C4.16" in t
              if name in blob_bound:
                  assert newb in t,(name,"missing new blob pin")
          assert 'assert p["version"]=="C4.16"' in Path(".github/workflows/xray-dynamic-policy-invariants.yml").read_text()
          assert "Validate C4.16 settlement connector failover" in Path(".github/workflows/xray-validate-compiled-policy-v3.yml").read_text()
          print("C416_PRECOMMIT_VERIFY=PASS")
          PYVERIFY

            git diff --check
            git add \
              nasdaq-xray/chatgpt_compiled_policy_v3.json \
              nasdaq-xray/build_current_event_request.py \
              nasdaq-xray/build_current_event_state.py \
              nasdaq-xray/build_current_resolver_request.py \
              nasdaq-xray/build_current_terminal.py \
              nasdaq-xray/price_dv20_recover_from_fullstate.py \
              .github/workflows/xray-canonical-current-pre-mc.yml \
              .github/workflows/xray-canonical-current-post-mc.yml \
              .github/workflows/xray-canonical-current-final.yml \
              .github/workflows/xray-dynamic-policy-invariants.yml \
              .github/workflows/xray-validate-compiled-policy-v3.yml
            git commit -m "fix(xray): C4.16 zero-dollar settlement connector failover"
            if git push origin HEAD:main; then
              echo "C416_PRODUCTION_MIGRATION=PASS"
              exit 0
            fi
            echo "C416_PUSH_RACE attempt=$attempt"
            sleep $((attempt*3))
          done
          echo "C416_PRODUCTION_MIGRATION=FAIL" >&2
          exit 1
