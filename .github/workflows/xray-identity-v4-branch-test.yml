name: XRAY Identity V4 Branch Test

on:
  push:
    branches:
      - xray/identity-snapshot-v4-20261007
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt
      - name: Compile identity repair
        run: |
          python -m py_compile             nasdaq-xray/sina_stage.py             nasdaq-xray/build_current_master_manifest.py             nasdaq-xray/build_current_identity_proofs.py             nasdaq-xray/current_identity_proof_selftest.py             nasdaq-xray/test_dynamic_policy_invariants.py
      - name: Identity proof selftest
        working-directory: nasdaq-xray
        run: python current_identity_proof_selftest.py
      - name: Dynamic policy invariants
        working-directory: nasdaq-xray
        run: python test_dynamic_policy_invariants.py
