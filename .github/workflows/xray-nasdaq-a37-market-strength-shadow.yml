name: XRAY Personal NASDAQ A37 Market Strength Shadow (Offline Only)
on:
  pull_request:
    paths:
      - 'personal-swing/research_lab/market_strength_a37.py'
      - 'personal-swing/research_lab/test_market_strength_a37.py'
      - 'personal-swing/research_lab/MARKET_STRENGTH_A37_RESEARCH.md'
      - '.github/workflows/xray-nasdaq-a37-market-strength-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a37-offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r personal-swing/requirements.txt
      - name: Normal and optimized synthetic positive and negative fixtures
        working-directory: personal-swing/research_lab
        run: |
          python -m unittest -q test_market_strength_a37
          python -O -m unittest -q test_market_strength_a37
          python -m py_compile market_strength_a37.py test_market_strength_a37.py
          python -O -m py_compile market_strength_a37.py test_market_strength_a37.py
      - name: Offline-only static denial guard
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('personal-swing/research_lab/market_strength_a37.py').read_text()
          for forbidden in ('import requests','import urllib','import socket','import httpx','subprocess','import ccxt'):
              assert forbidden not in s, forbidden
          for required in ('"may_generate_al": False','"may_change_stops": False',
                           '"may_write_sheets": False','"may_emit_alert": False',
                           '"may_trade": False','"market_strength_site_calls": 0'):
              assert required in s, required
          print('A37_OFFLINE_ONLY=PASS; 477_LIVE_DATA=NOT_CHECKED; NO_AL_OR_ORDERS')
          PY
