name: XRAY Personal 477 Swing Score 4-Nov One-Time Private Seed

# One-shot, controlled historical readback. No schedule, no dispatch,
# no ChatGPT message, no broker, no public stock identities.
# Runs only upon the original addition of THIS workflow file to main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xray-nasdaq-swing-score-seed-20261105.yml'

permissions:
  contents: read

concurrency:
  group: xray-personal-20261104-score-seed-once
  cancel-in-progress: false

jobs:
  private-score-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
      XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
      XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
      XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
    steps:
      - name: Checkout immutable main SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing IEX/calendar and private Sheets dependencies
        run: |
          python -m pip install -r personal-swing/requirements.txt
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3'
      - name: Require private research-only source access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$XRAY_ALPACA_DATA_KEY_ID" && -n "$XRAY_ALPACA_DATA_SECRET_KEY" ]] || exit 3
          [[ -n "$XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON" && -n "$XRAY_PRIVATE_SPREADSHEET_ID" ]] || exit 3
          echo 'XRAY_SCORE_SEED_CREDENTIALS_PRESENT_REDACTED'
      - name: Write exact 4-Nov 477-backed OPEN-only swing score (never AL/STOP)
        working-directory: personal-swing
        shell: bash
        run: |
          set -euo pipefail
          python swing_score_daily.py --asof 2026-11-04
      - name: Never deliver public scores or orders
        run: echo 'PRIVATE_SCORE_ONLY; NO_PUBLIC_SIGNALS; NO_BROKER; NO_ORDER; NO_CHATGPT_SEND; NO_NEW_SCHEDULE'
