name: XRAY Private Research Source Byte Evidence (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/research_numeric_source_bytes_shadow.py'
      - 'nasdaq-xray/tests/test_research_numeric_source_bytes_shadow.py'
      - '.github/workflows/xray-private-numeric-source-bytes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-private-source-bytes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-byte-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check source-byte guard compilation and all positive/negative fixtures
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/research_numeric_provenance_shadow.py nasdaq-xray/research_numeric_source_bytes_shadow.py nasdaq-xray/tests/test_research_numeric_source_bytes_shadow.py
          python -m unittest discover -s nasdaq-xray/tests -p 'test_research_numeric_source_bytes_shadow.py' -v
          python -O -m unittest discover -s nasdaq-xray/tests -p 'test_research_numeric_source_bytes_shadow.py' -v
          python -m unittest discover -s nasdaq-xray/tests -p 'test_research_numeric_provenance_shadow.py' -v
      - name: Verify no imported broker or vendor provider dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("nasdaq-xray/research_numeric_source_bytes_shadow.py").read_text()
          assert "import research_numeric_provenance_shadow as base" in p
          assert "can_register_R92" in p and "vendor_entitlement_verified" in p
          assert 'publisher_signed_data_verified' in p
          for bad in ('import alpaca', 'import yfinance', 'import swarms', 'import ccxt',
                      'import fincept', 'import vibe_trading', 'requests.get(',
                      'urllib.request.urlopen(', 'subprocess.run('):
              assert bad not in p,bad
          print("XRAY_RESEARCH_SOURCE_BYTE_ADMISSION=PASS_NO_EXTERNAL_VENDOR_OR_BROKER_IO")
          PY
      - name: Scope declaration
        if: always()
        run: |
          echo 'Research private source bytes SHA and observations tested with synthetic files; not independently signed provider data.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No market data, license verification, canonical PRICE/MC/HISTORY, R92, user notification or trading permission.' >> "$GITHUB_STEP_SUMMARY"
