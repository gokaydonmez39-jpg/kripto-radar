name: XRAY Zero-Dollar SEC Mirror CIK Shadow
on:
  pull_request:
    branches: [main]
    paths:
      - nasdaq-xray/personal_sec_current_cik_shadow.py
      - nasdaq-xray/sec_mirror_cik_shadow.py
      - .github/workflows/xray-sec-mirror-cik-shadow.yml
  workflow_dispatch:
  schedule:
    - cron: "37 13 * * 1-5"
  push:
    branches: [main]
    paths:
      - nasdaq-xray/sec_mirror_cik_shadow.py
      - nasdaq-xray/personal_sec_current_cik_shadow.py
      - .github/workflows/xray-sec-mirror-cik-shadow.yml
permissions:
  contents: read
jobs:
  offline-sec-403-failover:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      XRAY_ALPACA_DATA_KEY_ID: ""
      XRAY_ALPACA_DATA_SECRET_KEY: ""
      XRAY_MASSIVE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official calendar (offline only)
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pandas_market_calendars==5.4.0
      - name: Compile and verify primary SEC failure / exact-date mirror negatives
        run: |
          set -euo pipefail
          test -z "$XRAY_ALPACA_DATA_KEY_ID"
          python -m py_compile nasdaq-xray/personal_sec_current_cik_shadow.py nasdaq-xray/sec_mirror_cik_shadow.py
          python nasdaq-xray/sec_mirror_cik_shadow.py --selftest
          python nasdaq-xray/personal_sec_current_cik_shadow.py --selftest
          python -O nasdaq-xray/personal_sec_current_cik_shadow.py --selftest
          echo XRAY_SEC_FALLBACK_OFFLINE_PASSED_NOT_LIVE_NO_MC_NO_R92
  no-alpha-sec-mirror:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and prove NO-ALPHA mirror tests
        run: |
          python -m py_compile nasdaq-xray/sec_mirror_cik_shadow.py
          python nasdaq-xray/sec_mirror_cik_shadow.py --selftest
      - name: Exact-ASOF SHA256 mirror audit
        run: |
          python nasdaq-xray/sec_mirror_cik_shadow.py --out "$RUNNER_TEMP/sec_mirror_cik_shadow.json"
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"sec_mirror_cik_shadow.json").read_text())
          assert r["execution"]=="NONE" and r["real_money"]=="NO-GO"
          assert r["alpha_authority"] is False and r["go"] is False
          assert r["approved_alpha_symbols"]==[]
          assert r["ciK_discovered_count"]<=r["unknown_total"]
          print("XRAY_SEC_MIRROR_DIAGNOSTIC_SAFE",r["status"])
          PY
      - name: Publish exact-source CIK shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: xray-sec-mirror-cik-shadow
          path: ${{ runner.temp }}/sec_mirror_cik_shadow.json
          if-no-files-found: error
          retention-days: 14
