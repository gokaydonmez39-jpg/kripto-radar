name: XRAY Zero-Dollar SEC Mirror CIK Shadow
on:
  workflow_dispatch:
  schedule:
    - cron: "37 13 * * 1-5"
  push:
    branches: [main]
    paths:
      - nasdaq-xray/sec_mirror_cik_shadow.py
      - .github/workflows/xray-sec-mirror-cik-shadow.yml
permissions:
  contents: read
jobs:
  no-alpha-sec-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and prove NO-ALPHA mirror tests
        run: |
          python -m py_compile nasdaq-xray/sec_mirror_cik_shadow.py
          python nasdaq-xray/sec_mirror_cik_shadow.py --selftest
      - name: Exact-ASOF SHA256 mirror audit
        run: |
          python nasdaq-xray/sec_mirror_cik_shadow.py --out "$RUNNER_TEMP/sec_mirror_cik_shadow.json"
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"sec_mirror_cik_shadow.json").read_text())
          assert r["execution"]=="NONE" and r["real_money"]=="NO-GO"
          assert r["alpha_authority"] is False and r["go"] is False
          assert r["approved_alpha_symbols"]==[]
          assert r["ciK_discovered_count"]<=r["unknown_total"]
          print("XRAY_SEC_MIRROR_DIAGNOSTIC_SAFE",r["status"])
          PY
      - name: Publish exact-source CIK shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: xray-sec-mirror-cik-shadow
          path: ${{ runner.temp }}/sec_mirror_cik_shadow.json
          if-no-files-found: error
          retention-days: 14
