name: XRAY P0 497 HISTORY 31 Non-Split CA Issuer Risk Localization
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_history_nonsplit_ca_local_497_guard.py"
      - ".github/workflows/xray-p0-history-497-nonsplit-ca-local.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  non-split-ca-risk-source-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Source invoking SHA strict
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download source-epoch pinned full 515 and new non-split CA issuer status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/history_ca/dual" "$RUNNER_TEMP/history_ca/ca"
          gh run download 38178676524 -R "${{ github.repository }}" \
            -n xray-alpaca-515-raw-split-daily-shadow-sanitized \
            -D "$RUNNER_TEMP/history_ca/dual"
          gh run download 38181356461 -R "${{ github.repository }}" \
            -n xray-515-corporate-actions-count-only-no-pit \
            -D "$RUNNER_TEMP/history_ca/ca"
          test -s "$RUNNER_TEMP/history_ca/dual/xray_515_raw_split_research.json"
          test -s "$RUNNER_TEMP/history_ca/ca/xray_515_ca_census_shadow.json"
      - name: Parse and falsify exact symbol-local issuer residual under Python and -O
        run: |
          python -m py_compile nasdaq-xray/p0_history_nonsplit_ca_local_497_guard.py
          python nasdaq-xray/p0_history_nonsplit_ca_local_497_guard.py \
            --dual "$RUNNER_TEMP/history_ca/dual/xray_515_raw_split_research.json" \
            --ca "$RUNNER_TEMP/history_ca/ca/xray_515_ca_census_shadow.json" --selftest
          python -O nasdaq-xray/p0_history_nonsplit_ca_local_497_guard.py \
            --dual "$RUNNER_TEMP/history_ca/dual/xray_515_raw_split_research.json" \
            --ca "$RUNNER_TEMP/history_ca/ca/xray_515_ca_census_shadow.json" --selftest
      - name: Write conservative source-partition witness
        run: |
          python nasdaq-xray/p0_history_nonsplit_ca_local_497_guard.py \
            --dual "$RUNNER_TEMP/history_ca/dual/xray_515_raw_split_research.json" \
            --ca "$RUNNER_TEMP/history_ca/ca/xray_515_ca_census_shadow.json" \
            --out "$RUNNER_TEMP/xray_history_nonsplit_CA_497.json"
      - name: Strict 497=466+31 partition, no PRIMARY, no GO
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_history_nonsplit_CA_497.json").read_text())
          assert d["schema"]=="XRAY_P0_497_31_466_CA_LOCAL_RISK_PARTITION_SHADOW_V1"
          assert d["full_history_stock_count"]==497
          assert d["full_history_no_non_split_event_observed"]==466
          assert d["full_history_non_split_CA_review_required"]==31
          assert d["short_history_official_age_count"]==17
          assert len(d["full_history_non_split_review_symbols"])==31
          assert d["source_price_blob_sha"]==subprocess.check_output([
             "git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],text=True).strip()
          assert d["source_master_blob_sha"]==subprocess.check_output([
             "git","hash-object","nasdaq-xray/canonical_current_master_manifest.json"],text=True).strip()
          assert d["independent_issuer_non_split_CA_asof_PIT_attested"] is False
          assert d["production_C417_PRIMARY_MC_created"]==0
          assert d["production_HISTORY_PASS_created"]==0
          assert d["can_register_R92"] is False and d["GO"] is False
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          print("XRAY_497_HISTORY_NONSPLIT_CA_SOURCE_PARTITION=VERIFIED_466_31_NO_PRIMARY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-497-history-31-nonsplit-issuer-risks-no-go
          path: ${{ runner.temp }}/xray_history_nonsplit_CA_497.json
          retention-days: 14
          if-no-files-found: error
