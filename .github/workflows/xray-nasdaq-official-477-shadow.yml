name: XRAY NASDAQ 477 Official Event Shadow (NO SIGNALS)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-nasdaq-official-477-shadow-private
  cancel-in-progress: false
jobs:
  manual-shadow-research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without persisted Git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail-closed 477 offline + provider compatibility tests
        working-directory: personal-swing/research_lab
        run: |
          python -m unittest -q test_official_477_shadow test_official_provider_raw_once
          python -O -m unittest -q test_official_477_shadow test_official_provider_raw_once
      - name: Bounded 477 Alpaca + SEC ROAD + Nasdaq diagnostic (private in memory)
        working-directory: personal-swing/research_lab
        timeout-minutes: 6
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
          XRAY_SEC_DECLARED_USER_AGENT: ${{ secrets.XRAY_SEC_DECLARED_USER_AGENT }}
        run: python official_477_shadow.py
      - name: Never promote research evidence to AL, Sheets or orders
        run: echo 'SHADOW_477_ONLY; NO_AL_CHANGES; NO_STOPS; NO_BROKER; NO_ORDERS; NO_SHEETS; NO_PUSH; NO_CRON; NOT_PIT_CLEARANCE'
