name: NASDAQ SWING XRAY Data Plane

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/bootstrap.py"
      - ".github/workflows/nasdaq-xray.yml"
  schedule:
    - cron: "40 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasdaq-xray-dataplane
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official Nasdaq universe
        run: python nasdaq-xray/bootstrap.py

      - name: Commit durable XRAY bridge state
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/state.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore(xray): durable universe checkpoint [skip ci]"
            git push
          fi

      - name: Upload state artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-xray-state
          path: nasdaq-xray/state.json
          retention-days: 30
