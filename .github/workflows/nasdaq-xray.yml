name: NASDAQ SWING XRAY Data Plane

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasdaq-xray-repo-writer
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official Nasdaq universe
        run: python nasdaq-xray/bootstrap.py

      - name: Commit durable XRAY bridge state
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/state.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore(xray): durable universe checkpoint [skip ci]"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=1
                break
              fi
              sleep $((attempt * 2))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "XRAY_STATE_PUSH_FAILED" >&2
              exit 1
            fi
          fi

      - name: Upload state artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-xray-state
          path: nasdaq-xray/state.json
          retention-days: 30
