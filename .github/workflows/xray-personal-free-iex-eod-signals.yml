name: XRAY Personal Free IEX EOD Research Signals (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/personal_free_iex_eod_signal_radar.py"
      - ".github/workflows/xray-personal-free-iex-eod-signals.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/personal_free_iex_eod_signal_radar.py"
      - ".github/workflows/xray-personal-free-iex-eod-signals.yml"
  workflow_dispatch:
  schedule:
    - cron: "55 12 * * 1-5"
permissions:
  contents: read
concurrency:
  group: xray-alpaca-historical-sip-account-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
  queue: max
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned Nasdaq regular-session calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Validate free IEX study gates and adversarial cases without provider IO
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/personal_free_iex_eod_signal_radar.py
          python nasdaq-xray/personal_free_iex_eod_signal_radar.py --selftest
          python -O nasdaq-xray/personal_free_iex_eod_signal_radar.py --selftest
  research:
    needs: offline-regression
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install official Nasdaq session calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Require current source before zero-dollar provider IO
        shell: bash
        run: |
          set -euo pipefail
          this="$(git rev-parse HEAD)"
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ -n "$current" && "$this" == "$current" ]] || {
            echo "::error::XRAY_PERSONAL_IEX_STALE_MAIN_NO_VENDOR_IO"
            exit 2
          }
      - name: Measure free personal IEX EOD full source cohort
        shell: bash
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          python nasdaq-xray/personal_free_iex_eod_signal_radar.py \
            --out "$RUNNER_TEMP/xray_personal_iex_eod_private.json"
      - name: Independently reject false R92, public bars or false confidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_personal_iex_eod_private.json").read_text())
          assert x["schema"]=="XRAY_PERSONAL_FREE_IEX_EOD_RESEARCH_V1"
          assert x["source"]=="ALPACA_FREE_IEX_EOD_NONCOMMERCIAL"
          assert x["total_watch_symbols"]==x["attempted_symbols"]==len(x["per_symbol"])
          assert sum(x["state_counts"].values())==x["total_watch_symbols"]
          assert x["max_vendor_requests"]==64 and 0<=x["vendor_requests"]<=64
          assert x["confidence"]["grade"]=="LOW" and x["confidence"]["feed"]=="IEX_SINGLE_EXCHANGE"
          assert x["confidence"]["consolidated_rth_volume_verified"] is False
          assert x["confidence"]["independent_issuer_mc_verified"] is False
          assert x["confidence"]["issuer_event_clearance_verified"] is False
          assert x["canonical_price_promoted"] is False and x["canonical_history_promoted"] is False
          assert x["canonical_mc_promoted"] is False
          assert x["registered_r92_count"]==x["certified_buy_count"]==0
          assert x["broker"] is False and x["orders"]==[]
          assert x["raw_vendor_ohlcv_exported"] is False
          assert x["iphone_receipt_attested"] is False
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          print("XRAY_PERSONAL_IEX_RESULT=PRIVATE_RESEARCH_ONLY_SINGLE_VENUE_LOW_CONFIDENCE_NO_AL")
          PY
      - name: Upload PRIVATE derived classifications only (no raw OHLCV)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-personal-free-iex-eod-study-private-no-ohlcv
          path: ${{ runner.temp }}/xray_personal_iex_eod_private.json
          retention-days: 7
          if-no-files-found: error
