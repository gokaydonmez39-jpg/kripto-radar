name: XRAY Early WATCH Upstream Lineage Offline Regression (No Data)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/personal_watch_run_lineage_guard.py"
      - ".github/workflows/xray-personal-full-cohort-early-watch.yml"
      - ".github/workflows/xray-early-watch-lineage-offline-ci.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/personal_watch_run_lineage_guard.py"
      - ".github/workflows/xray-personal-full-cohort-early-watch.yml"
      - ".github/workflows/xray-early-watch-lineage-offline-ci.yml"
permissions:
  contents: read
jobs:
  guard:
    name: Verify scheduled/push/dispatch/chained producer and reject 13 forged runs
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Negative controls, normal and optimized Python
        run: |
          python -m py_compile nasdaq-xray/personal_watch_run_lineage_guard.py
          python nasdaq-xray/personal_watch_run_lineage_guard.py --selftest
          python -O nasdaq-xray/personal_watch_run_lineage_guard.py --selftest
      - name: Enforce exact validation in actual production WATCH workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path(".github/workflows/xray-personal-full-cohort-early-watch.yml").read_text()
          for required in (
              "from personal_watch_run_lineage_guard import verify_run",
              'verify_run(run,repo,expected_run_id=run_id,',
              'expected_head_sha=os.environ["UPSTREAM_SHA"]',
              'expected_head_sha=run["head_sha"]',
          ):
              assert required in t, required
          assert 'run["event"] in ("push","schedule","workflow_dispatch")' not in t
          for required in (
              'CURRENT_HEAD_SHA: ${{ github.sha }}',
              'r.get("head_sha")==os.environ["CURRENT_HEAD_SHA"]',
              'out.write("ready=false',
              'out.write("ready=true',
              "XRAY_EARLY_WATCH_SAFE_SKIP_PENDING_SAME_SHA_SOURCE",
              "if: steps.source.outputs.ready == 'true'",
              "if: ${{ always() && steps.source.outputs.ready == 'true' }}",
          ):
              assert required in t, required
          assert t.count("if: steps.source.outputs.ready == 'true'")==3
          print("XRAY_EARLY_WATCH_WORKFLOW_WIRING=PASS_CHAINED_SOURCE_AND_SAME_SHA_PUSH_RACE")
          PY
