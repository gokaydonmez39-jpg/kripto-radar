name: XRAY Dynamic Policy Invariants

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/test_dynamic_policy_invariants.py"
      - "nasdaq-xray/test_alpha_semantics.py"
      - "nasdaq-xray/test_deep_repair_regressions.py"
      - ".github/workflows/xray-canonical-current-pre-mc.yml"
      - ".github/workflows/xray-canonical-current-final.yml"
      - "nasdaq-xray/alpha_semantics.py"
      - "nasdaq-xray/stage1_shadow.py"
      - "nasdaq-xray/family_c_engine.py"
      - "nasdaq-xray/final_tech_shadow.py"
      - "nasdaq-xray/build_current_terminal.py"
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/resolve_unknowns_fallback.py"
      - "nasdaq-xray/price_dv20_phase.py"
      - "nasdaq-xray/deep_pre_r1_shadow.py"
      - "nasdaq-xray/history_phase.py"
      - "nasdaq-xray/history_official_identity_evidence.json"
      - "nasdaq-xray/price_dv20_recover_from_fullstate.py"
      - "nasdaq-xray/chatgpt_compiled_policy_v3.json"
      - "nasdaq-xray/account_provider_adapter_contract.json"
      - "nasdaq-xray/account_gate_contract.json"
      - "nasdaq-xray/requirements-runtime.txt"
      - ".github/workflows/xray-dynamic-policy-invariants.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt
      - name: Compile policy-critical code
        run: |
          python -m py_compile \
            nasdaq-xray/alpha_semantics.py \
            nasdaq-xray/test_alpha_semantics.py \
            nasdaq-xray/test_deep_repair_regressions.py \
            nasdaq-xray/stage1_shadow.py \
            nasdaq-xray/family_c_engine.py \
            nasdaq-xray/final_tech_shadow.py \
            nasdaq-xray/build_current_terminal.py \
            nasdaq-xray/sina_stage.py \
            nasdaq-xray/resolve_unknowns_fallback.py \
            nasdaq-xray/price_dv20_phase.py \
            nasdaq-xray/price_dv20_recover_from_fullstate.py \
            nasdaq-xray/deep_pre_r1_shadow.py \
            nasdaq-xray/history_phase.py \
            nasdaq-xray/test_dynamic_policy_invariants.py
      - name: Run deterministic invariants
        run: |
          python nasdaq-xray/test_dynamic_policy_invariants.py
          python nasdaq-xray/test_alpha_semantics.py
          python nasdaq-xray/test_deep_repair_regressions.py
      - name: Verify provider-neutral ACCOUNT final gate
        shell: bash
        run: |
          set -euo pipefail
          # Adapter-registry changes are reconciled by a separate fail-closed workflow.
          # Avoid a false red race on the triggering pre-reconcile SHA: validate the
          # latest main only after the gate binds the exact current adapter blob.
          for attempt in $(seq 1 12); do
            git fetch origin main --quiet
            git show origin/main:nasdaq-xray/account_provider_adapter_contract.json >/tmp/xray_account_adapter.json
            git show origin/main:nasdaq-xray/account_gate_contract.json >/tmp/xray_account_gate.json
            adapter_blob=$(git rev-parse origin/main:nasdaq-xray/account_provider_adapter_contract.json)
            if python - "$adapter_blob" <<'PY'
          import json,sys
          actual_blob=sys.argv[1]
          g=json.load(open("/tmp/xray_account_gate.json"))
          a=json.load(open("/tmp/xray_account_adapter.json"))
          ok=(g.get("adapter_contract",{}).get("blob_sha")==actual_blob and g.get("adapter_registry_count")==len(a.get("adapters") or {}))
          raise SystemExit(0 if ok else 1)
          PY
            then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "XRAY_ACCOUNT_RECONCILE_TIMEOUT" >&2
              exit 1
            fi
            sleep 5
          done
          python - "$adapter_blob" <<'PY'
          import json,sys
          actual_blob=sys.argv[1]
          g=json.load(open("/tmp/xray_account_gate.json"))
          a=json.load(open("/tmp/xray_account_adapter.json"))
          assert g["execution"]=="NONE" and g["real_money"]=="NO-GO"
          assert a["execution"]=="NONE" and a["real_money"]=="NO-GO"
          assert g["provider"]=="PROVIDER_NEUTRAL"
          assert g["primary_adapter"]=="LONGBRIDGE"
          assert g["adapter_contract"]["path"]=="nasdaq-xray/account_provider_adapter_contract.json"
          assert g["adapter_contract"]["blob_sha"]==actual_blob,(g["adapter_contract"]["blob_sha"],actual_blob)
          assert g["adapter_registry_count"]==len(a["adapters"])
          alternates=set((g.get("alternate_adapter_candidates") or {}).keys())
          assert alternates.issubset(set(a["adapters"])),(sorted(alternates-set(a["adapters"])))
          assert all((a["adapters"][k].get("status")!="PASS") for k in alternates)
          assert g.get("current_adapter") in a["adapters"]
          assert a["provider_neutral"] is True
          assert a["adapters"]["LONGBRIDGE"]["status"]!="PASS"
          assert g["current_status"]!="PASS"
          assert "place_order" in a["forbidden_actions"]
          assert a["no_policy_weakening"] is True
          print("XRAY_ACCOUNT_PROVIDER_CONTRACT=PASS")
          PY
      - name: Verify compiled policy hard gate
        run: |
          python - <<'PY'
          import json
          t=json.load(open("nasdaq-xray/chatgpt_compiled_policy_v3.json"))
          p=json.loads(t["payload_json"])
          assert p["version"]=="C4.17"
          assert p["hard_gates"]["dv20"]=="median exactly20 completed official-RTH Close*regular-session Volume >=50000000"
          assert p["unknown_never_pass"] is True
          print({"status":"PASS","policy_hash":t["policy_hash"]})
          PY
# XRAY_READINESS_REVALIDATE_20261005
