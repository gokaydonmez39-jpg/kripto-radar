name: XRAY R92 Candidate-Local PRICE + Buy-Only Contract (Offline)
on:
  pull_request:
    paths:
      - "nasdaq-xray/delivery_prepare.py"
      - "nasdaq-xray/delivery_prepare_selftest.py"
      - "nasdaq-xray/notification_channel_policy_v1.json"
      - ".github/workflows/xray-r92-candidate-local-buy-only-offline.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/delivery_prepare.py"
      - "nasdaq-xray/delivery_prepare_selftest.py"
      - "nasdaq-xray/notification_channel_policy_v1.json"
      - ".github/workflows/xray-r92-candidate-local-buy-only-offline.yml"
permissions:
  contents: read
concurrency:
  group: xray-r92-candidate-local-buy-only
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned
        with:
          python-version: "3.12"
      - name: Assert exact triggering source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Candidate-local allowed only on actual R92 and exact upstream evidence
        run: |
          python -m py_compile nasdaq-xray/delivery_prepare.py nasdaq-xray/delivery_prepare_selftest.py
          python nasdaq-xray/delivery_prepare_selftest.py
      - name: Buy-only user alert contract and safety guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("nasdaq-xray")
          p = json.loads((root/"notification_channel_policy_v1.json").read_text())
          assert p["user_preference"] == "CHATGPT_ONLY"
          assert p["user_visible_event_scope"] == "VERIFIED_REGISTERED_R92_BUY_ONLY"
          assert p["watch_and_early_research_internal_only"] is True
          assert p["source_and_data_faults_internal_only"] is True
          assert p["silent_when_no_new_verified_r92"] is True
          assert p["broker_orders_never_allowed"] is True
          assert p["account_and_g9_not_research_signal_prerequisites"] is True
          assert p["registered_r92_required"] and p["never_emit_unregistered_candidate"]
          assert p["dedup_required"] and p["unknown_never_pass"]
          assert p["execution"]=="NONE" and p["real_money"]=="NO-GO"
          assert p["emoji_alert_contract"]["user_visible_only"] == "🟢 AL — DOĞRULANMIŞ R92"
          assert p["emoji_alert_contract"]["no_user_notification_from_watch_or_health_issues"]
          assert p["emoji_alert_contract"]["registered_r92_candidate_local_full_c417_proof_required"]
          assert p["platform_iphone_receipt_attested"] is False
          manual = json.loads((root/"manual_decision_policy_v1.json").read_text())
          assert manual["broker_access_required"] is False
          assert manual["broker_trade_access_allowed"] is False
          assert manual["g9"]["mandatory_for_research_signal"] is False
          assert manual["account"]["mandatory_for_research_signal"] is False
          assert manual["hard_gates"]["price_min_usd"] == 5
          assert manual["hard_gates"]["dv30_min_usd"] == 50000000
          assert manual["hard_gates"]["mc_min_usd"] == 2000000000
          assert manual["delivery"]["enabled_in_this_shadow"] is False
          print("XRAY_BUY_ONLY_POLICY=PASS_INTERNAL_WATCH_NO_UNREGISTERED_AL_NO_BROKER")
          PY