name: XRAY Manual Decision Research Only
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["XRAY Canonical Current Final Factory"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 21 * * 1-5"
    - cron: "15 13 * * 1-5" # 16:15 TRT preopen research; not a punctual delivery guarantee
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/manual_decision_report.py"
      - "nasdaq-xray/eod_screening_digest.py"
      - "nasdaq-xray/alpaca_sip_eod_b_shadow.py"
      - "nasdaq-xray/manual_workflow_trigger_sha_guard.py"
      - "nasdaq-xray/research_only_start_20261010.json"
      - "nasdaq-xray/research_only_start_guard.py"
      - "nasdaq-xray/manual_signal_lifecycle_shadow.py"
      - "nasdaq-xray/manual_followup_registry.py"
      - "nasdaq-xray/manual_decision_policy_v1.json"
      - ".github/workflows/xray-manual-decision-research-shadow.yml"
permissions:
  contents: read
concurrency:
  group: xray-manual-decision-research-v1
  cancel-in-progress: false
jobs:
  manual-research:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify event checkout SHA and synthetic race regression
        shell: bash
        run: |
          set -euo pipefail
          python nasdaq-xray/workflow_source_epoch_fence_selftest.py
          python -O nasdaq-xray/workflow_source_epoch_fence_selftest.py
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          event=json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          expected=(event["workflow_run"]["head_sha"] if os.environ["GITHUB_EVENT_NAME"]=="workflow_run"
                    else os.environ["GITHUB_SHA"])
          if subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()!=expected:
              raise SystemExit("XRAY_MANUAL_CHECKOUT_SHA_DRIFT")
          print("XRAY_MANUAL_EVENT_SHA=PASS_EXACT")
          PY
      - name: Enforce exact source Final invocation vs current checked-out main
        run: |
          python -m py_compile nasdaq-xray/manual_workflow_trigger_sha_guard.py
          python nasdaq-xray/manual_workflow_trigger_sha_guard.py --selftest
          python nasdaq-xray/manual_workflow_trigger_sha_guard.py --out "$RUNNER_TEMP/xray_manual_invocation_witness.json"
      - name: Validate user-approved RESEARCH_ONLY launch and source epochs
        run: |
          python nasdaq-xray/research_only_start_guard.py --selftest
          python nasdaq-xray/research_only_start_guard.py --out "$RUNNER_TEMP/xray_research_start_witness.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_research_start_witness.json").read_text())
          assert j["operational_status"]=="RESEARCH_MONITORING_START_CONFIGURED"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["alpha_go"] is False and j["orders"]==[]
          assert j["current_signal_release"]=="NOT_ATTESTED"
          print("XRAY_RESEARCH_ONLY_LAUNCH=ACTIVATED_MONITORING_NOT_AL")
          PY
      - name: Run current ASOF EOD liquidity screen (source-bound, not AL)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pandas_market_calendars==5.4.0'
          python -m py_compile nasdaq-xray/eod_screening_digest.py
          python nasdaq-xray/eod_screening_digest.py --selftest
          python -O nasdaq-xray/eod_screening_digest.py --selftest
          python nasdaq-xray/eod_screening_digest.py --out "$RUNNER_TEMP/xray_eod_screen.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_eod_screen.json").read_text())
          assert j["schema"]=="XRAY_EOD_LIQUIDITY_SCREEN_V1"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["research_signals"]==[] and j["qualified_al_count"] is None
          assert j["r92_registered_here"]==0 and j["orders"]==[]
          assert j["alpha_authority"] is False and j["delivery_authority"] is False
          assert j["master_unknown_intersect_screen_count"]==0
          assert len(j["screen_symbols"])==(j["price_dv30_pass_count"] if j["current_screen_ready"] else 0)
          assert j["no_confirmed_setup_asserted"] is False
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("## EOD liquidity screen — independent research (NOT AL)\\n\\n")
              f.write("ASOF: "+str(j["asof_et"])+"; latest completed: "+str(j["latest_completed_official_nasdaq_session"])+"\\n\\n")
              f.write("Source status: **"+j["status"]+"**\\n\\n")
              f.write("PRICE/DV30 screened: **"+str(len(j["screen_symbols"]))+"** / master identity PASS: "+str(j["master_identity_pass_count"])+"\\n\\n")
              f.write("Technical, primary MC, AL and real delivery: **NOT VERIFIED**; no trade or notification.\\n")
          print("XRAY_EOD_SCREEN_READBACK=PASS_SOURCE_EXACT_NO_FAKE_AL")
          PY
      - name: Optional free historical SIP 260d/52w B research (never AL)
        shell: bash
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/alpaca_sip_eod_b_shadow.py
          python nasdaq-xray/alpaca_sip_eod_b_shadow.py --selftest
          python -O nasdaq-xray/alpaca_sip_eod_b_shadow.py --selftest
          python nasdaq-xray/alpaca_sip_eod_b_shadow.py --out "$RUNNER_TEMP/xray_sip_b_research.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_sip_b_research.json"
          j=json.loads(p.read_text())
          assert j["schema"]=="XRAY_SIP_EOD_260_52_B_RESEARCH_SHADOW_V1"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["qualified_al_count"]==0 and j["qualified_al_symbols"]==[]
          assert j["alpha_authority"] is False and j["orders"]==[]
          assert j["source_rights_not_elevated"] is True
          assert j["b_precursor_count"]==len(j["b_precursors"])
          if j["status"]!="B_PRECURSOR_RESEARCH_ONLY_NO_AL":
              assert j["b_precursor_count"]==0 and j["b_precursors"]==[]
          print("XRAY_ALPACA_SIP_PUBLIC_GUARD=PASS_NO_AL")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("\\n## Alpaca historical SIP — private B precursor, never AL\\n\\n")
              f.write("Source status: **"+j["status"]+"**\\n\\n")
              f.write("260-session / 52-completed-week symbols: **"+str(j["260d_52w_verified_count"])+"**\\n\\n")
              f.write("B research precursors: **"+str(j["b_precursor_count"])+"**\\n\\n")
              f.write("Strict C4.17 AL authority: **NO** — MC/R1-RR/legal/G9/account/delivery not promoted.\\n")
          PY
      - name: Compile and regression tests (manual only, no account or orders)
        run: |
          python -m py_compile nasdaq-xray/manual_decision_report.py
          python nasdaq-xray/manual_decision_report.py --selftest
      - name: Verify candidate follow-up state machine without live order or user-delivery claims
        run: |
          python -m py_compile nasdaq-xray/manual_signal_lifecycle_shadow.py
          python nasdaq-xray/manual_signal_lifecycle_shadow.py --selftest
          python -m py_compile nasdaq-xray/manual_followup_registry.py
          python nasdaq-xray/manual_followup_registry.py --selftest
          python nasdaq-xray/manual_signal_lifecycle_shadow.py --out "$RUNNER_TEMP/xray_followup_shadow.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_followup_shadow.json"
          r=json.loads(p.read_text())
          assert r["status"]=="SHADOW_NOT_CONNECTED_TO_CANONICAL_DELIVERY"
          assert r["candidate_count"]==0 and r["orders"]==[]
          assert r["execution"]=="NONE" and r["real_money"]=="NO-GO"
          assert r["user_notification_delivered"] is False
          print("XRAY_MANUAL_FOLLOWUP_NO_DELIVERY_CLAIM=PASS")
          PY
      - name: Block stale main before manual candidate research
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$latest" || "$(git rev-parse HEAD)" != "$latest" ]]; then
            echo "XRAY_MANUAL_SOURCE_EPOCH=BLOCKED_MAIN_ADVANCED" >&2
            exit 1
          fi
          echo "XRAY_MANUAL_SOURCE_EPOCH=CURRENT_EXACT"
      - name: Build exact-source manual-decision research report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python nasdaq-xray/manual_decision_report.py --out "$RUNNER_TEMP/xray_manual_private.json"
      - name: Enforce source bindings and sanitized public status
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])
          r=json.loads((d/"xray_manual_private.json").read_text())
          p=json.loads(Path("nasdaq-xray/manual_decision_policy_v1.json").read_text())
          assert r["schema"]=="XRAY_MANUAL_DECISION_REPORT_V1"
          assert r["manual_decision_only"] is True
          assert r["execution"]=="NONE" and r["real_money"]=="NO-GO"
          assert r["g9_required"] is False
          assert r["broker_or_account_required"] is False
          assert r["full_go_claimed"] is False and r["order_count"]==0
          assert r["delivery_enabled"] is False and p["delivery"]["enabled_in_this_shadow"] is False
          assert r["alpha_authority"] is False and r["unknown_never_pass"] is True
          assert len(r["research_signals"])<=3
          assert r["research_signal_count"]==0 or r["status"]=="QUALIFIED_RESEARCH_SIGNAL_AVAILABLE"
          assert r["research_signal_count"]>0 or r["status"]=="NO_QUALIFIED_TECHNICAL_RESEARCH_SIGNAL"
          assert set(r["source_blob_shas"])=={
              "terminal","manual_policy","final","master","price","history",
              "events","policy","official_halt_guard","mc"}
          # No vendor-derived market data or actionable levels published in public artifacts.
          safe={k:r[k] for k in ("schema","asof_et","status","execution",
              "real_money","manual_decision_only","alpha_authority","g9_required",
              "broker_or_account_required","order_count","research_signal_count",
              "full_finalist_count","pre_g9_technical_pass_count",
              "rejection_reason_counts","source_blob_shas","delivery_enabled")}
          safe["public_market_data"]=False
          safe["ticker_identifiers_published"]=False
          # A successful old-session report NEVER states that the current
          # trading-day pipeline or user notification is production-ready.
          import hashlib
          root=Path("nasdaq-xray")
          master_path=root/"canonical_current_master_manifest.json"
          current_master=json.loads(master_path.read_text())
          bb=master_path.read_bytes()
          master_sha=hashlib.sha1(b"blob "+str(len(bb)).encode()+b"\0"+bb).hexdigest()
          assert current_master.get("execution")=="NONE"
          assert current_master.get("real_money")=="NO-GO"
          assert isinstance(current_master.get("asof_et"),str)
          terminal_master_binding=r["source_blob_shas"]["master"]
          safe["latest_master_asof_et"]=current_master["asof_et"]
          safe["latest_master_blob_sha"]=master_sha
          safe["latest_terminal_master_bound_sha"]=terminal_master_binding
          safe["terminal_epoch_matches_latest_master"]=(
              r["asof_et"]==current_master["asof_et"]
              and terminal_master_binding==master_sha)
          # Release requires every influential LIVE source SHA to equal
          # its exact private terminal binding. Frozen blobs are archival.
          source_files={"final":"canonical_current_final_tech.json",
              "master":"canonical_current_master_manifest.json",
              "price":"canonical_current_price_dv30.json",
              "history":"canonical_current_history.json",
              "events":"canonical_current_event_state.json",
              "policy":"chatgpt_compiled_policy_v3.json"}
          def current_git_sha(filename):
              bb=(root/filename).read_bytes()
              return hashlib.sha1(b"blob "+str(len(bb)).encode()+b"\0"+bb).hexdigest()
          def same_run_release(master_exact, all_blobs_exact, frozen):
              return master_exact and all_blobs_exact and not frozen
          assert same_run_release(True,True,[]) is True
          assert same_run_release(True,False,[]) is False
          assert same_run_release(True,True,["events"]) is False
          assert same_run_release(False,True,[]) is False
          safe["terminal_all_sources_live_exact"]=all(
              current_git_sha(name)==r["source_blob_shas"][key]
              for key,name in source_files.items())
          safe["terminal_release_epoch_and_blobs_exact"]=same_run_release(
              safe["terminal_epoch_matches_latest_master"],
              safe["terminal_all_sources_live_exact"],r["frozen_terminal_sources"])
          safe["research_freshness_class"]=(
              "MATCHING_MASTER_EPOCH_NOT_FULL_RELEASE"
              if safe["terminal_release_epoch_and_blobs_exact"]
              else "HISTORICAL_TERMINAL_ONLY_CURRENT_EPOCH_UNVERIFIED")
          # A historical terminal may be read for diagnostics, but it
          # CANNOT conclude NO_QUALIFIED for the newer master epoch.
          def fail_closed_public_epoch_status(historical_status, historical_count, exact):
              if exact:
                  return historical_status,historical_count
              return "SOURCE_INTEGRITY_BLOCKED",0
          assert fail_closed_public_epoch_status("NO_QUALIFIED_TECHNICAL_RESEARCH_SIGNAL",0,False)==("SOURCE_INTEGRITY_BLOCKED",0)
          assert fail_closed_public_epoch_status("QUALIFIED_RESEARCH_SIGNAL_AVAILABLE",3,False)==("SOURCE_INTEGRITY_BLOCKED",0)
          assert fail_closed_public_epoch_status("NO_QUALIFIED_TECHNICAL_RESEARCH_SIGNAL",0,True)==("NO_QUALIFIED_TECHNICAL_RESEARCH_SIGNAL",0)
          safe["historical_terminal_status"]=r["status"]
          safe["status"],safe["research_signal_count"]=fail_closed_public_epoch_status(
              r["status"],r["research_signal_count"],safe["terminal_release_epoch_and_blobs_exact"])
          safe["source_integrity_blocked_reason"]=(
              None if safe["terminal_release_epoch_and_blobs_exact"]
              else "CURRENT_TERMINAL_ANY_SOURCE_EPOCH_OR_BLOB_SHA_MISMATCH")
          safe["manual_signal_production_ready"]=False
          safe["phone_notification_receipt"]="UNVERIFIED"
          safe["followup_delivery_status"]="NOT_CONNECTED"
          assert not safe["manual_signal_production_ready"]
          assert safe["research_freshness_class"]!="MATCHING_MASTER_EPOCH_NOT_FULL_RELEASE" or safe["terminal_release_epoch_and_blobs_exact"]
          (d/"xray_manual_public_telemetry.json").write_text(json.dumps(safe,indent=2)+"\n")
          print("XRAY_MANUAL_DECISION_REPORT_SAFETY=PASS")
          print("XRAY_MANUAL_DECISION_HISTORICAL_TERMINAL_STATUS="+r["status"])
          print("XRAY_MANUAL_DECISION_PUBLIC_STATUS="+safe["status"])
          print("XRAY_MANUAL_DECISION_PUBLIC_COUNT="+str(safe["research_signal_count"]))
          print("XRAY_MANUAL_DECISION_CURRENT_MASTER_BOUND="+str(safe["terminal_epoch_matches_latest_master"]))
          print("XRAY_MANUAL_DECISION_ALL_SOURCES_LIVE_EXACT="+str(safe["terminal_all_sources_live_exact"]))
          PY
      - name: Record source-integrity fault without disclosing market data
        if: failure()
        env:
          XRAY_RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("nasdaq-xray")
          def read(name):
              try:return json.loads((root/name).read_text())
              except (OSError,ValueError):return {}
          def blob(name):
              try:
                  b=(root/name).read_bytes()
                  return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
              except OSError:return None
          t=read("canonical_current_terminal.json")
          m=read("canonical_current_master_manifest.json")
          expected=(t.get("evidence") or {}).get("master") or {}
          safe={
              "schema":"XRAY_MANUAL_SOURCE_INTEGRITY_FAULT_V1",
              "status":"SOURCE_INTEGRITY_BLOCKED",
              "execution":"NONE","real_money":"NO-GO",
              "manual_decision_only":True,"alpha_authority":False,
              "research_signal_count":0,"delivery_enabled":False,
              "terminal_asof_et":t.get("asof_et"),
              "current_master_asof_et":m.get("asof_et"),
              "terminal_master_blob_sha":expected.get("blob_sha"),
              "current_master_blob_sha":blob("canonical_current_master_manifest.json"),
              "source_epoch_exact":t.get("asof_et")==m.get("asof_et"),
              "source_sha_exact":expected.get("blob_sha")==blob("canonical_current_master_manifest.json"),
              "public_market_data":False,"ticker_identifiers_published":False,
              "notification_delivered":False
          }
          output=Path(os.environ["XRAY_RUNNER_TEMP"])/"xray_manual_public_telemetry.json"
          output.write_text(json.dumps(safe,indent=2,sort_keys=True)+"\n")
          print("XRAY_MANUAL_SOURCE_INTEGRITY=BLOCKED (workflow failure preserved)")
          PY
      - name: Upload read-only EOD price-screen list (not signals)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-eod-screen-research-only
          path: ${{ runner.temp }}/xray_eod_screen.json
          retention-days: 14
          if-no-files-found: warn
      - name: Upload optional SIP derived-only research diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-alpaca-sip-b-research-only
          path: ${{ runner.temp }}/xray_sip_b_research.json
          retention-days: 14
          if-no-files-found: warn
      - name: Upload safe operational telemetry only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-manual-decision-operational-only
          path: ${{ runner.temp }}/xray_manual_public_telemetry.json
          retention-days: 14
          if-no-files-found: error
