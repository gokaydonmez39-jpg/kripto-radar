name: XRAY NASDAQ 477 Required Read-Only PR CI

# Stable status name for eventual main ruleset enforcement.
# Intentionally NO path filter: GitHub required checks cannot remain Pending
# when a PR changes only another part of the shared public repository.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  xray-477-required-ci:
    name: xray-477-required-ci
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout without credential persistence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Offline Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Existing offline regression dependencies only
        run: |
          python -m pip install -r personal-swing/requirements.txt
          python -m pip install 'PyYAML==6.0.2' 'google-auth>=2.35,<3' 'requests>=2.31,<3'
      - name: Personal 477 normal and optimized regression
        working-directory: personal-swing
        run: |
          python -m unittest -q test_ci_v6 test_v6_alpaca_rest test_research_evidence test_research_validation test_handoff_guard test_private_sheet_writer test_private_lifecycle test_panel_reconciler test_al_outbox_producer test_xray_guardian test_provider_read_retry
          python -O -m unittest -q test_ci_v6 test_v6_alpaca_rest test_research_evidence test_research_validation test_handoff_guard test_private_sheet_writer test_private_lifecycle test_panel_reconciler test_al_outbox_producer test_xray_guardian test_provider_read_retry
          python -m unittest -q test_swing_score_daily
          python -O -m unittest -q test_swing_score_daily
          # P0 evidence audit is a fail-closed release gate, not optional.
          python -m unittest -q test_delivery_evidence_audit
          python -O -m unittest -q test_delivery_evidence_audit
          python -m unittest -q test_delivery_reservation
          python -O -m unittest -q test_delivery_reservation
          # A34 must fail required CI on a broken read-only preopen guard.
          python -m unittest -q test_preopen_a34
          python -O -m unittest -q test_preopen_a34
          python -m py_compile swing_score_daily.py delivery_evidence_audit.py preopen_a34.py
          python -m py_compile alert_ledger_contract.py private_lifecycle.py engine.py runner.py
      - name: Personal schedule fallback and official research-shadow negative acceptance
        working-directory: personal-swing
        run: |
          python -m unittest -q test_schedule_failover
          python -O -m unittest -q test_schedule_failover
          python -m py_compile schedule_failover.py
          cd research_lab
          python -m unittest -q test_official_shadow_477 test_official_eod_shadow_receipt test_official_guard_cutoff_select
          python -O -m unittest -q test_official_shadow_477 test_official_eod_shadow_receipt test_official_guard_cutoff_select
          python -m py_compile official_shadow_477.py official_eod_shadow_receipt.py official_guard_cutoff_select.py
      - name: Kronos V2 research contracts normal and optimized (NO model download)
        working-directory: personal-swing
        run: |
          # This status is intended to be the mandatory main-merge check.
          # Independently fail when any Kronos V2 integrity or OOS HOLD test fails.
          # Pure offline tests; no broker/market read, GitHub secrets or Sheets writes.
          python -m unittest -q test_kronos_shadow
          python -O -m unittest -q test_kronos_shadow
          python -m unittest -q test_kronos_oos_audit
          python -O -m unittest -q test_kronos_oos_audit
          python -m unittest -q test_kronos_capacity_probe
          python -O -m unittest -q test_kronos_capacity_probe
          python -m unittest -q test_kronos_real_477_probe
          python -O -m unittest -q test_kronos_real_477_probe
          python -m unittest -q test_kronos_v2
          python -O -m unittest -q test_kronos_v2
          python -m unittest -q test_kronos_eod_scope_order
          python -O -m unittest -q test_kronos_eod_scope_order
          python -m py_compile kronos_shadow.py kronos_oos_audit.py kronos_capacity_probe.py kronos_real_477_probe.py kronos_v2.py
      - name: Cove-method personal research shadow strict contract (offline only)
        working-directory: personal-swing
        run: |
          python -m unittest -q test_cove_shadow test_cove_private_shadow test_cove_roku_pit
          python -O -m unittest -q test_cove_shadow test_cove_private_shadow test_cove_roku_pit
          python -m py_compile cove_shadow.py cove_private_shadow.py test_cove_shadow.py test_cove_private_shadow.py
          # Private IEX/Sheets/alerts/broker not accessed by this CI step.
      - name: P0 original-PIT-order and fail-closed recovery regressions (no secrets)
        working-directory: personal-swing
        run: |
          python -m unittest -q test_p0_source_recovery
          python -O -m unittest -q test_p0_source_recovery
          python -m py_compile test_p0_source_recovery.py
      - name: Independent A14 PIT regression normal and optimized
        working-directory: personal-swing/performance_lab
        run: |
          python -m unittest discover -q -p 'test_private_performance_adapter.py'
          python -O -m unittest discover -q -p 'test_private_performance_adapter.py'
          python -m unittest -q test_roku_performance_cutover
          python -O -m unittest -q test_roku_performance_cutover
          # A34 flight recorder PIT provenance is a mandatory merge gate.
          python -m unittest -q test_private_flight_recorder
          python -O -m unittest -q test_private_flight_recorder
          python -m unittest -q test_roku_flight_cutover
          python -O -m unittest -q test_roku_flight_cutover
      - name: A42 candidate queue contract normal and optimized
        working-directory: nasdaq-candidate-autopilot
        run: |
          python -m unittest -q test_autopilot test_eod_admission test_assessment test_ledger test_queue
          python -O -m unittest -q test_autopilot test_eod_admission test_assessment test_ledger test_queue
      - name: Forward-only GNTX 477 PIT cutover regression
        working-directory: personal-swing
        run: |
          python -m unittest -q test_forward_gntx_pit
          python -O -m unittest -q test_forward_gntx_pit
          python -m py_compile test_forward_gntx_pit.py
          python -c "from pathlib import Path; import runner; s=runner.get_scope(watchlist_file='nasdaq_watchlist_477.json', asof='2026-11-10'); print('GNTX_PIT_SCOPE_SHA='+runner.sha_symbols(s)); print('GNTX_POLICY_SHA='+runner.analysis_fingerprint())"
          # Exact named change only; NO BACKFILL; NO ORDER; no private Sheet access.
      - name: Non-price ROKU corporate-action lifecycle contracts
        working-directory: personal-swing
        run: |
          python -m unittest -q test_roku_corporate_lifecycle
          python -O -m unittest -q test_roku_corporate_lifecycle
          python -m unittest -q test_lifecycle_failure_diagnostics
          python -O -m unittest -q test_lifecycle_failure_diagnostics
          python -m py_compile test_roku_corporate_lifecycle.py
          # No fake ROKU daily bar, no price-target terminal, no fills.
      - name: ROKU last-trade raw-IEX witness with no fabricated 9 Nov price
        working-directory: personal-swing
        run: |
          python -m unittest -q test_raw_corporate_action_witness test_roku_raw_witness_cutover
          python -O -m unittest -q test_raw_corporate_action_witness test_roku_raw_witness_cutover
          python -m py_compile raw_corporate_action_witness.py test_roku_raw_witness_cutover.py
          # Independent read-only review; NO AL release or vendor price stitch.
      - name: Verified EOD origin and no-op downstream admission regression
        working-directory: personal-swing
        run: |
          python -m unittest -q test_downstream_eod_origin
          python -O -m unittest -q test_downstream_eod_origin
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Personal 477 portable reservation parity (offline)
        working-directory: personal-swing
        run: node --test test_delivery_reservation_portable.js
      - name: Fundamental SEC Shadow strict offline contract (NO SEC HTTP)
        working-directory: personal-swing/research_lab
        run: |
          python -m unittest -q test_fundamental_shadow test_fundamental_sec_capture
          python -O -m unittest -q test_fundamental_shadow test_fundamental_sec_capture
          python -m py_compile fundamental_shadow.py fundamental_sec_capture.py test_fundamental_shadow.py test_fundamental_sec_capture.py
          # Offline synthetic claims only; never live EDGAR or production AL.
      - name: Explicit no-trade and no-private-access scope
        run: echo 'XRAY_REQUIRED_PR_CI=PASS_ONLY_IF_ALL_OFFLINE_TESTS_PASS;NO_BROKER;NO_ORDERS;NO_IEX_API;NO_SHEETS_WRITE;NO_CHATGPT_SEND'
