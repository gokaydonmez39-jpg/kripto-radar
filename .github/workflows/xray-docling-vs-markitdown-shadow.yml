name: XRAY Docling vs MarkItDown Offline SEC Research (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/sec_docling_offline_comparison_shadow.py'
      - 'nasdaq-xray/tests/test_sec_docling_offline_comparison_shadow.py'
      - '.github/workflows/xray-docling-vs-markitdown-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'nasdaq-xray/sec_docling_offline_comparison_shadow.py'
      - 'nasdaq-xray/tests/test_sec_docling_offline_comparison_shadow.py'
      - '.github/workflows/xray-docling-vs-markitdown-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-docling-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-secretless-document-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile comparator + tests first (RED when module absent)
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/sec_docling_offline_comparison_shadow.py nasdaq-xray/tests/test_sec_docling_offline_comparison_shadow.py
      - name: Install optional exact-version upstream document parsers in isolated job
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'docling-slim[format-html]==2.140.0' 'markitdown==0.1.8'
          python -m pip check
          python - <<'PY'
          import importlib.metadata as m
          assert m.version("docling-slim") == "2.140.0"
          assert m.version("markitdown") == "0.1.8"
          print("XRAY_OPTIONAL_DOCLING=2.140.0_MARKITDOWN=0.1.8")
          PY
      - name: Verify unchanged source accession/date/number across two real parsers
        run: |
          set -euo pipefail
          python -m unittest discover -s nasdaq-xray/tests -p test_sec_docling_offline_comparison_shadow.py -v
          python -O -m unittest discover -s nasdaq-xray/tests -p test_sec_docling_offline_comparison_shadow.py -v
      - name: No brokerage network or shell dependency in application wrapper
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path('nasdaq-xray/sec_docling_offline_comparison_shadow.py').read_text())
          banned={'urllib','requests','httpx','socket','subprocess','alpaca','ccxt','yfinance'}
          found=set()
          for node in ast.walk(tree):
            if isinstance(node,ast.Import):
              found.update(a.name.split('.')[0] for a in node.names)
            elif isinstance(node,ast.ImportFrom) and node.module:
              found.add(node.module.split('.')[0])
          assert not found & banned,found & banned
          print("XRAY_SEC_DOCLING_RESEARCH_ONLY_NO_MARKET_NO_BROKER=PASS")
          PY
