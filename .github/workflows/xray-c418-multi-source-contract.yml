name: XRAY C4.18 Multi-Source Rights & PIT Contract (No Production)
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/c418_multi_source_guard.py"
      - "nasdaq-xray/c418_provider_inventory_20261012.json"
      - "nasdaq-xray/c418_provider_routing_readiness.py"
      - "nasdaq-xray/c418_daily_mc_capacity_guard.py"
      - "nasdaq-xray/c418_bq_bulk_screener_shadow.py"
      - "nasdaq-xray/c418_historic_mc_vendor_shadow.py"
      - "nasdaq-xray/immutable_action_dependency_guard.py"
      - "nasdaq-xray/rallies_history_shadow_guard.py"
      - "nasdaq-xray/c418_shadow_resilience_guard.py"
      - "nasdaq-xray/c418_duplicate_feed_shadow_guard.py"
      - "nasdaq-xray/c418_history_exact_session_shadow_guard.py"
      - "nasdaq-xray/c418_preopen_intersection_guard.py"
      - "nasdaq-xray/mc_free_successor_contract.py"
      - "nasdaq-xray/c418_canonical_source_sha_selftest.py"
      - "nasdaq-xray/c418_upstream_independence_attestation_selftest.py"
      - "nasdaq-xray/c418_multi_source_profile_v1.json"
      - "nasdaq-xray/source_successor_c418_proposal.json"
      - ".github/workflows/xray-c418-multi-source-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-c418-multi-source-validation
  cancel-in-progress: true
jobs:
  evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - name: Assert runner executes the exact triggering Git commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$GITHUB_SHA" ]]; then
            echo "XRAY_C418_CHECKOUT_SHA_MISMATCH:FAIL_CLOSED" >&2
            exit 1
          fi
          echo "XRAY_C418_CHECKOUT_EXACT_INVOCATION_SHA=PASS"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official Nasdaq calendar for Rallies negative proof
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Verify C4.18 frozen proposal contract and exact provider roles
        run: |
          python nasdaq-xray/immutable_action_dependency_guard.py
          python -m py_compile nasdaq-xray/c418_multi_source_guard.py nasdaq-xray/rallies_history_shadow_guard.py nasdaq-xray/c418_shadow_resilience_guard.py nasdaq-xray/c418_duplicate_feed_shadow_guard.py nasdaq-xray/c418_history_exact_session_shadow_guard.py nasdaq-xray/c418_preopen_intersection_guard.py
          (cd nasdaq-xray && python rallies_history_shadow_guard.py --selftest)
          python nasdaq-xray/source_successor_c418_preflight.py --selftest
          python nasdaq-xray/c418_multi_source_guard.py --selftest
          python nasdaq-xray/c418_shadow_resilience_guard.py --selftest
          python nasdaq-xray/c418_duplicate_feed_shadow_guard.py --selftest
          python nasdaq-xray/c418_history_exact_session_shadow_guard.py --selftest
          python nasdaq-xray/c418_preopen_intersection_guard.py --selftest
          python nasdaq-xray/mc_free_successor_contract.py --selftest
          python nasdaq-xray/c418_canonical_source_sha_selftest.py
          python nasdaq-xray/c418_upstream_independence_attestation_selftest.py
      - name: Finnhub and EODHD historical MC exact-ASOF/non-PIT contract
        run: |
          python -m py_compile nasdaq-xray/c418_historic_mc_vendor_shadow.py
          python nasdaq-xray/c418_historic_mc_vendor_shadow.py --selftest
          python -O nasdaq-xray/c418_historic_mc_vendor_shadow.py --selftest
      - name: Reject BQ latest bulk screener as historic PIT / production MC
        run: |
          python -m py_compile nasdaq-xray/c418_bq_bulk_screener_shadow.py
          python nasdaq-xray/c418_bq_bulk_screener_shadow.py --selftest
          python -O nasdaq-xray/c418_bq_bulk_screener_shadow.py --selftest
      - name: Prove daily free MC quota insufficient before any PRIMARY promotion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/c418_daily_mc_capacity_guard.py
          python nasdaq-xray/c418_daily_mc_capacity_guard.py --selftest
          python -O nasdaq-xray/c418_daily_mc_capacity_guard.py --selftest
          python nasdaq-xray/c418_daily_mc_capacity_guard.py --out "$RUNNER_TEMP/xray_c418_daily_mc_capacity.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path("nasdaq-xray")
          actual=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_c418_daily_mc_capacity.json").read_text())
          price=json.loads((root/"canonical_current_price_dv30.json").read_text())
          master=json.loads((root/"canonical_current_master_manifest.json").read_text())
          inv=json.loads((root/"c418_provider_inventory_20261012.json").read_text())
          bq=next(z for z in inv["sources"] if z["id"]=="BUSINESSQUANT")
          n=len(price["pass_symbols"])
          batch=bq["max_tickers_per_historic_call"]
          daily=bq["daily_requests"]
          calls=(n+batch-1)//batch
          days=(calls+daily-1)//daily
          assert actual["schema"]=="XRAY_C418_DAILY_MC_CAPACITY_GUARD_V1"
          assert actual["asof_et"]==price["asof_et"]==master["asof_et"]
          assert actual["source_cohort_price_pass"]==n==price["pass_count"]
          assert actual["source_master_identity_pass"]==len(master["pass_symbols"])==master["pass_count"]
          assert actual["source_master_identity_unknown"]==len(master["unknown_symbols"])==master["unknown_count"]
          assert actual["provider_rows_unchanged"]==len(inv["sources"])
          assert actual["BQ"]["daily_free_requests"]==daily
          assert actual["BQ"]["tickers_per_historical_mc_call"]==batch
          assert actual["BQ"]["required_full_cohort_calls"]==calls
          assert actual["BQ"]["maximum_tickers_per_day"]==daily*batch
          assert actual["BQ"]["minimum_quota_calendar_days"]==days
          assert actual["BQ"]["full_cohort_daily_refresh_with_this_quota"] is (calls<=daily)
          assert actual["status"]=="SHADOW_DAILY_REFRESH_BLOCKED"
          assert not any(actual[k] for k in ("can_create_PRIMARY","can_register_R92","can_enable_G9","production_go","vendor_raw_data_persisted"))
          assert actual["real_money"]=="NO-GO" and actual["execution"]=="NONE"
          print("XRAY_BQ_DYNAMIC_DAILY_CAPACITY=PASS_NO_PRIMARY_NO_GO")
          PY
      - name: Verify 12-route real current cohort capacity and forbid fake MC rights
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/c418_provider_routing_readiness.py
          python nasdaq-xray/c418_provider_routing_readiness.py --selftest
          python -O nasdaq-xray/c418_provider_routing_readiness.py --selftest
          python nasdaq-xray/c418_provider_routing_readiness.py \
            --out "$RUNNER_TEMP/xray_c418_514_source_router.json"
          python - <<'PY'
          import os,json,datetime as dt
          from pathlib import Path
          root=Path("nasdaq-xray")
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_c418_514_source_router.json").read_text())
          price=json.loads((root/"canonical_current_price_dv30.json").read_text())
          master=json.loads((root/"canonical_current_master_manifest.json").read_text())
          inv=json.loads((root/"c418_provider_inventory_20261012.json").read_text())
          bqconfig=next(s for s in inv["sources"] if s["id"]=="BUSINESSQUANT")
          cohort=len(price["pass_symbols"])
          batch=bqconfig["max_tickers_per_historic_call"]
          quota=bqconfig["daily_requests"]
          calls=(cohort+batch-1)//batch
          days=(calls+quota-1)//quota
          assert j["schema"]=="XRAY_C418_DYNAMIC_MULTI_PROVIDER_ROUTING_READINESS_V2"
          assert j["asof_et"]==price["asof_et"]==master["asof_et"]
          assert j["canonical_price_pass_count"]==cohort==price["pass_count"]
          assert j["master_identity_pass_count"]==len(master["pass_symbols"])==master["pass_count"]
          assert j["master_identity_unknown_count"]==len(master["unknown_symbols"])==master["unknown_count"]
          historic_date=dt.date.fromisoformat(j["historical_3_ticker_sample_asof_et"])
          current_date=dt.date.fromisoformat(price["asof_et"])
          assert historic_date<=current_date
          assert j["historical_3_ticker_sample_is_current_asof"] is (historic_date==current_date)
          assert j["historical_sample_may_grant_primary"] is False
          assert j["identity_unknown_intersect_price_count"]==0
          assert j["discovered_source_rows"]==len(inv["sources"])
          assert j["verified_distinct_market_cap_origin_count"]==0
          bq=j["per_source_capacity_scenarios"]["BUSINESSQUANT"]
          assert bq["documented_tickers_per_call"]==batch
          assert bq["best_case_historical_mc_calls_if_all_symbols_have_data"]==calls
          assert bq["best_case_free_calendar_days"]==days
          assert bq["historical_filing_acceptance_pit_proven"] is False
          assert bq["best_case_only_not_entitled_to_primary"] is True
          assert j["new_primary_mc_authority_count"]==0
          assert j["new_r92_count_created"]==0
          assert j["go"] is False and j["unknown_never_pass"] is True
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["no_vendor_raw_data_exported"] is True
          assert bq["conditional_only_not_scheduled"] is True
          assert bq["actual_same_asof_mc_entitlement"]=="UNVERIFIED"
          print("XRAY_C418_DYNAMIC_ACTUAL_ROUTING=PASS_CURRENT_COHORT_NO_FAKE_PRIMARY")
          PY
      - name: Confirm missing real provider rights cannot become PRIMARY or R92
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python nasdaq-xray/c418_multi_source_guard.py --out "${RUNNER_TEMP}/xray_c418_multi_source_health.json"
          status=$?
          set -e
          if [[ "$status" -ne 2 ]]; then
            echo "XRAY_C418_MISSING_RIGHTS_FAIL_OPEN_STATUS=$status" >&2
            exit 1
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_c418_multi_source_health.json").read_text())
          assert j["schema"]=="XRAY_C418_MULTI_SOURCE_GUARD_REPORT_V1"
          assert j["status"]=="DATA_BLOCKED"
          assert "NO_PRIVATE_LIVE_EVIDENCE" in j["reason_codes"]
          assert j["production_authority"] is False
          assert j["can_create_PRIMARY"] is False and j["can_register_R92"] is False
          assert j["vendor_raw_data_exported"] is False
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          print("XRAY_C418_MULTI_SOURCE_LIVE_READINESS=DATA_BLOCKED_CORRECT_NO_LICENSE")
          PY
      - name: Upload safe code-only source health
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-c418-multi-source-code-preflight
          path: |
            ${{ runner.temp }}/xray_c418_multi_source_health.json
            ${{ runner.temp }}/xray_c418_514_source_router.json
            ${{ runner.temp }}/xray_c418_daily_mc_capacity.json
          retention-days: 14
          if-no-files-found: error
