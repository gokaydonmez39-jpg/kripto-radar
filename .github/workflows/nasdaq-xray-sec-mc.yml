name: NASDAQ SWING XRAY Dual Market Cap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasdaq-xray-repo-writer
  cancel-in-progress: false

jobs:
  dual-mc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XRAY_DUAL_MC_BATCH: "40"
      XRAY_DUAL_MC_MAX_ATTEMPTS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resume free dual-source market-cap checks
        run: python nasdaq-xray/dual_mc.py

      - name: Commit durable dual-MC state
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/dual_mc_state.json
          if git diff --cached --quiet; then
            echo "No dual-MC state change."
          else
            git commit -m "chore(xray): dual-MC checkpoint [skip ci]"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=1
                break
              fi
              sleep $((attempt * 2))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "XRAY_STATE_PUSH_FAILED" >&2
              exit 1
            fi
          fi

      - name: Upload dual-MC state
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-xray-dual-mc-state
          path: nasdaq-xray/dual_mc_state.json
          retention-days: 30
