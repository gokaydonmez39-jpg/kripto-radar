name: NASDAQ SWING XRAY SEC Market Cap

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/sec_mc.py"
      - "nasdaq-xray/sec-trigger.txt"
      - ".github/workflows/nasdaq-xray-sec-mc.yml"
  schedule:
    - cron: "50 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasdaq-xray-sec-mc
  cancel-in-progress: false

jobs:
  sec-mc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XRAY_SEC_MC_BATCH: "35"
      XRAY_SEC_MC_MAX_ATTEMPTS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resume conservative official SEC market-cap checks
        run: python nasdaq-xray/sec_mc.py

      - name: Commit durable SEC MC state
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/sec_mc_state.json
          if git diff --cached --quiet; then
            echo "No SEC MC state change."
          else
            git commit -m "chore(xray): SEC MC checkpoint [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Upload SEC MC state
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-xray-sec-mc-state
          path: nasdaq-xray/sec_mc_state.json
          retention-days: 30
