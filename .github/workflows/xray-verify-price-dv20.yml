name: XRAY Verify PRICE DV20 Recovery

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/verify_price_dv20_recovery.py"
      - "nasdaq-xray/rallies_recovery_summary.json"
      - "nasdaq-xray/longbridge_fallback_recovery.json"
      - ".github/workflows/xray-verify-price-dv20.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasdaq-xray-repo-writer
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify complete PRICE DV20 recovery evidence
        run: python nasdaq-xray/verify_price_dv20_recovery.py
      - name: Commit verified recovery manifest
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/price_dv20_recovery_verified.json
          git commit -m "chore(xray): verified PRICE DV20 recovery manifest [skip ci]" || exit 0
          git pull --rebase origin main
          git push
