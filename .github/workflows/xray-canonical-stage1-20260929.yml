name: XRAY Canonical Stage1 20260929

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-canonical-stage1-20260929.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-canonical-stage1-20260929
  cancel-in-progress: false

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      XRAY_MC_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_mc_input_20260929.json
      XRAY_STAGE1_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_stage1_20260929.json
      XRAY_STAGE1_WORKERS: "8"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile nasdaq-xray/stage1_shadow.py
      - name: Install zero-dollar runtime
        run: python -m pip install --disable-pip-version-check akshare==1.18.95 pandas_market_calendars
      - name: Run frozen Stage1
        run: python nasdaq-xray/stage1_shadow.py
      - name: Validate frozen output
        run: |
          python - <<'PY'
          import json
          p="nasdaq-xray/canonical_stage1_20260929.json"
          j=json.load(open(p))
          assert j["schema"]=="XRAY_STAGE1_SHADOW_V1"
          assert j["task_id"]=="6a825366222081918997094d76e6ae46"
          assert j["asof_et"]=="2026-09-29"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["input_current_core_count"]==449
          assert len(j["results"])==449
          assert j["unknown_count"]==0, j["unknown"]
          print({"weekly_pass_count":j["weekly_pass_count"],"unknown_count":j["unknown_count"]})
          PY
      - name: Commit canonical frozen Stage1
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/canonical_stage1_20260929.json
          git commit -m "chore(xray): canonical Stage1 2026-09-29 [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
