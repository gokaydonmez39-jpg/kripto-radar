name: XRAY NASDAQ A11 Offline Performance Evidence Lab (NO TRADES)
on:
  pull_request:
    paths:
      - 'personal-swing/performance_lab/**'
      - 'personal-swing/research_lab/official_event_risk_shadow.py'
      - 'personal-swing/research_lab/test_official_event_risk_shadow.py'
      - 'personal-swing/research_lab/alpaca_connector_shadow_bridge.py'
      - 'personal-swing/research_lab/test_alpaca_connector_shadow_bridge.py'
      - 'personal-swing/research_lab/official_source_evidence_gate.py'
      - 'personal-swing/research_lab/test_official_source_evidence_gate.py'
      - 'personal-swing/research_lab/README_OFFICIAL_CAPTURE_GATE.md'
      - 'personal-swing/research_lab/README_OFFICIAL_EVENT_SHADOW.md'
      - '.github/workflows/xray-personal-performance-evidence-offline.yml'
  push:
    branches: [main]
    paths:
      - 'personal-swing/performance_lab/**'
      - 'personal-swing/research_lab/official_event_risk_shadow.py'
      - 'personal-swing/research_lab/test_official_event_risk_shadow.py'
      - 'personal-swing/research_lab/alpaca_connector_shadow_bridge.py'
      - 'personal-swing/research_lab/test_alpaca_connector_shadow_bridge.py'
      - 'personal-swing/research_lab/official_source_evidence_gate.py'
      - 'personal-swing/research_lab/test_official_source_evidence_gate.py'
      - 'personal-swing/research_lab/README_OFFICIAL_CAPTURE_GATE.md'
      - 'personal-swing/research_lab/README_OFFICIAL_EVENT_SHADOW.md'
      - '.github/workflows/xray-personal-performance-evidence-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-synthetic-science:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reuse existing XNAS calendar runtime constraint
        run: |
          python -m pip install -r personal-swing/requirements.txt
          python -m pip check
      - name: Ordinary and optimized adversarial tests
        working-directory: personal-swing/performance_lab
        run: |
          python -m unittest discover -v -p 'test_nasdaq_performance_guard.py'
          python -O -m unittest discover -v -p 'test_nasdaq_performance_guard.py'
          python -m py_compile nasdaq_performance_guard.py
      - name: SEC Nasdaq Alpaca Symbol Directory strict offline tests
        working-directory: personal-swing/research_lab
        run: |
          python -m unittest -q test_official_event_risk_shadow
          python -O -m unittest -q test_official_event_risk_shadow
          python -m py_compile official_event_risk_shadow.py
          python official_event_risk_shadow.py
      - name: Alpaca connected-app grouped-CA strict offline bridge tests
        working-directory: personal-swing/research_lab
        run: |
          python -m unittest -q test_alpaca_connector_shadow_bridge
          python -O -m unittest -q test_alpaca_connector_shadow_bridge
          python -m py_compile alpaca_connector_shadow_bridge.py
      - name: Official capture bytes and transport evidence fail-closed offline tests
        working-directory: personal-swing/research_lab
        run: |
          python -m unittest -q test_official_source_evidence_gate
          python -O -m unittest -q test_official_source_evidence_gate
          python -m py_compile official_source_evidence_gate.py
      - name: Explicit research-only termination
        run: echo 'A11=SHADOW_SYNTHETIC_ONLY; NO_ORDERS; NO_MARKET_DATA; NO_GOOGLE_SHEETS; NO_PUSH; NO_NEW_AUTOMATION; NO_PRODUCTION_RULE_CHANGE'
