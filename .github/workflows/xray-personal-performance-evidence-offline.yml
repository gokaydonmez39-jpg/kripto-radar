name: XRAY NASDAQ A11 Offline Performance Evidence Lab (NO TRADES)
on:
  pull_request:
    paths:
      - 'personal-swing/performance_lab/**'
      - '.github/workflows/xray-personal-performance-evidence-offline.yml'
  push:
    branches: [main]
    paths:
      - 'personal-swing/performance_lab/**'
      - '.github/workflows/xray-personal-performance-evidence-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-synthetic-science:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reuse existing XNAS calendar runtime constraint
        run: |
          python -m pip install -r personal-swing/requirements.txt
          python -m pip check
      - name: Ordinary and optimized adversarial tests
        working-directory: personal-swing/performance_lab
        run: |
          python -m unittest discover -v -p 'test_nasdaq_performance_guard.py'
          python -O -m unittest discover -v -p 'test_nasdaq_performance_guard.py'
          python -m py_compile nasdaq_performance_guard.py
      - name: Explicit research-only termination
        run: echo 'A11=SHADOW_SYNTHETIC_ONLY; NO_ORDERS; NO_MARKET_DATA; NO_GOOGLE_SHEETS; NO_PUSH; NO_NEW_AUTOMATION; NO_PRODUCTION_RULE_CHANGE'
