name: XRAY v45 A0 Rights Evidence Intake (Offline No Data No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/xray_v45_a0_rights_evidence_gate.py'
      - 'nasdaq-xray/test_xray_v45_a0_rights_evidence_gate.py'
      - 'nasdaq-xray/xray_v45_a0_empty_rights_evidence.json'
      - '.github/workflows/xray-v45-a0-rights-evidence-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a0-research-failclosed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prove every forged right remains unapproved, including optimized Python
        run: |
          set -euo pipefail
          cd nasdaq-xray
          python -m unittest -v test_xray_v45_a0_rights_evidence_gate.py
          python -O -m unittest -v test_xray_v45_a0_rights_evidence_gate.py
          python xray_v45_a0_rights_evidence_gate.py xray_v45_a0_empty_rights_evidence.json
      - name: Static no-network-no-order-no-credential import guard
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          src=Path('nasdaq-xray/xray_v45_a0_rights_evidence_gate.py').read_text()
          tree=ast.parse(src)
          modules=set()
          for node in ast.walk(tree):
              if isinstance(node,ast.Import):
                  modules.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node,ast.ImportFrom) and node.module:
                  modules.add(node.module.split('.')[0])
          forbidden={'requests','urllib','socket','subprocess','alpaca','ccxt','http','os','httpx'}
          assert not (modules & forbidden),str(modules & forbidden)
          assert "'a0_release_ready': False" in src
          assert "'may_run_vendor_historical_backfill': False" in src
          assert "'registered_r92_count': 0" in src
          print('OFFLINE_A0_FAILCLOSED_NO_MARKET_DATA_OR_AL')
          PY