name: XRAY v31 Historical SIP Closing Auctions and Correction Witness (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/xray_v31_sip_auction_correction_shadow.py'
      - '.github/workflows/xray-v31-sip-auction-correction-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'nasdaq-xray/xray_v31_sip_auction_correction_shadow.py'
      - '.github/workflows/xray-v31-sip-auction-correction-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-auction-3symbol-30session-${{ github.ref }}
  cancel-in-progress: false
jobs:
  no-al-auction-census:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pin existing official NASDAQ calendar dependency
        run: python -m pip install --disable-pip-version-check 'pandas_market_calendars==5.4.0'
      - name: Synthetic auction/close/correction regression, zero provider calls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/xray_v31_sip_auction_correction_shadow.py
          python nasdaq-xray/xray_v31_sip_auction_correction_shadow.py --selftest
          python -O nasdaq-xray/xray_v31_sip_auction_correction_shadow.py --selftest
      - name: Main-only historical SIP auctions, three symbols, bounded max twelve pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          python nasdaq-xray/xray_v31_sip_auction_correction_shadow.py --out "$RUNNER_TEMP/xray_v31_auction_counts_only.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'xray_v31_auction_counts_only.json'
          x=json.loads(p.read_text())
          assert x['schema']=='XRAY_V31_HISTORICAL_SIP_AUCTIONS_CORRECTION_SHADOW_V1'
          assert x['sample_size']==3 and x['official_sessions']==30 and x['api_page_limit']==12
          assert x['execution']=='NONE' and x['real_money']=='NO-GO' and x['unknown_never_pass']
          assert x['canonical_price_pass_authority'] is False and x['r92'] is False
          assert not x['mc_authority'] and not x['g9_pass'] and not x['iphone_receipt']
          assert not x['exact_rth_volume_verified'] and not x['market_data_usage_rights_attested']
          assert not x['correction_full_day_or_30_sessions_proven']
          assert not x['vendor_trades_or_ohlcv_persisted'] and not x['credentials_persisted']
          assert not x['canonical_files_mutated'] and not x['broker']
          assert not any(key in x for key in ('trades','raw_bars','prices','volumes','symbols','credentials'))
          print('XRAY_V31_AUCTION_SAFE_COUNT_REPORT=PASS_RESEARCH_ONLY_'+x['status'])
          PY
      - name: Retain only sanitized counts for seven days
        if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-v31-closing-auction-status-only-no-alpha
          path: ${{ runner.temp }}/xray_v31_auction_counts_only.json
          if-no-files-found: warn
          retention-days: 7