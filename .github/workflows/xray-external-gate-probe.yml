name: XRAY External Gate Probe

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/strict_g9_probe.py"
      - "nasdaq-xray/g9_entitlement_authority.json"
      - "nasdaq-xray/account_gate_contract.json"
      - ".github/workflows/xray-external-gate-probe.yml"
  schedule:
    - cron: "37 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-external-gate-probe
  cancel-in-progress: true

jobs:
  strict-g9:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TRADESTATION_CLIENT_ID: ${{ secrets.TRADESTATION_CLIENT_ID }}
      TRADESTATION_CLIENT_SECRET: ${{ secrets.TRADESTATION_CLIENT_SECRET }}
      TRADESTATION_REFRESH_TOKEN: ${{ secrets.TRADESTATION_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Compile external gate probe
        run: python -m py_compile nasdaq-xray/strict_g9_probe.py
      - name: Run strict G9 probe
        run: python nasdaq-xray/strict_g9_probe.py
      - name: Fail-closed contract audit
        run: |
          python - <<'PY'
          import json
          a=json.load(open("nasdaq-xray/g9_entitlement_authority.json"))
          s=json.load(open("nasdaq-xray/strict_g9_runtime_state.json"))
          c=json.load(open("nasdaq-xray/account_gate_contract.json"))
          assert a["schema"]=="XRAY_G9_ENTITLEMENT_AUTHORITY_V1"
          assert s["schema"]=="XRAY_STRICT_G9_RUNTIME_V1"
          assert c["schema"]=="XRAY_ACCOUNT_GATE_CONTRACT_V1"
          assert s["execution"]=="NONE" and s["real_money"]=="NO-GO"
          assert c["execution"]=="NONE" and c["real_money"]=="NO-GO"
          if s.get("g9_pass") is True:
              assert a.get("status")=="PROVEN"
              assert s.get("status")=="G9_PASS"
              assert s.get("technical_status")=="PASS_AWAITING_ENTITLEMENT_AUTHORITY" or s.get("technical_status")=="PASS"
          if a.get("status")!="PROVEN":
              assert s.get("g9_pass") is not True
          assert c.get("mode")=="READ_ONLY_ONLY"
          print("XRAY_EXTERNAL_GATE_FAIL_CLOSED=PASS")
          PY
      - name: Commit public-safe G9 runtime status
        shell: bash
        run: |
          set -euo pipefail
          # Runtime artifact contains no secrets; technical evidence is market data only.
          git config user.name "xray-gate-bot"
          git config user.email "xray-gate-bot@users.noreply.github.com"
          cp nasdaq-xray/strict_g9_runtime_state.json /tmp/strict_g9_runtime_state.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/strict_g9_runtime_state.json nasdaq-xray/strict_g9_runtime_state.json
            git add nasdaq-xray/strict_g9_runtime_state.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(xray): refresh strict G9 runtime status [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
