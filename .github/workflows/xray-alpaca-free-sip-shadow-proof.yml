name: XRAY Alpaca Free Historical SIP Shadow Contract
on:
  workflow_dispatch:
  # Existing workflow only: at most one weekday quota-bounded opportunity.
  schedule:
    - cron: "10 22 * * 1-5"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_free_sip_shadow_guard.py"
      - "nasdaq-xray/alpaca_root_unknown_rescue_shadow.py"
      - "nasdaq-xray/alpaca_root_history_exact_260_selftest.py"
      - "nasdaq-xray/alpaca_official_30_workflow_preflight.py"
      - "nasdaq-xray/alpaca_strict_daily_shadow_v2.py"
      - "nasdaq-xray/alpaca_root_rescue_strict_dispatch_v2.py"
      - "nasdaq-xray/alpaca_full_scope_260_shadow.py"
      - ".github/workflows/xray-alpaca-free-sip-shadow-proof.yml"
  pull_request:
    paths:
      - "nasdaq-xray/personal_sip_head_preflight.py"
      - "nasdaq-xray/all_workflow_schedule_audit.py"
      - ".github/workflows/xray-personal-full-universe-sip-coverage.yml"
      - "nasdaq-xray/alpaca_root_rescue_strict_dispatch_v2.py"
      - "nasdaq-xray/alpaca_free_sip_shadow_guard.py"
      - "nasdaq-xray/alpaca_strict_daily_shadow_v2.py"
      - ".github/workflows/xray-alpaca-free-sip-shadow-proof.yml"
permissions:
  contents: read
concurrency:
  group: xray-alpaca-historical-sip-account-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
  queue: max
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert exact triggering commit was checked out
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Nasdaq calendar for shadow history proof
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Enforce independent official Nasdaq last-30 calendar before provider access
        run: |
          python -m py_compile nasdaq-xray/alpaca_official_30_workflow_preflight.py
          python nasdaq-xray/alpaca_official_30_workflow_preflight.py --selftest
          python nasdaq-xray/alpaca_official_30_workflow_preflight.py
      - name: Strict free historical source negative and positive gates
        run: |
          python -m py_compile nasdaq-xray/alpaca_free_sip_shadow_guard.py nasdaq-xray/alpaca_root_unknown_rescue_shadow.py
          python nasdaq-xray/alpaca_free_sip_shadow_guard.py --selftest
          python -O nasdaq-xray/alpaca_free_sip_shadow_guard.py --selftest
          python nasdaq-xray/alpaca_root_unknown_rescue_shadow.py --selftest
          python nasdaq-xray/alpaca_root_history_exact_260_selftest.py
          python nasdaq-xray/alpaca_strict_daily_shadow_v2.py --selftest
          python nasdaq-xray/alpaca_root_rescue_strict_dispatch_v2.py --selftest
          python -O nasdaq-xray/alpaca_root_rescue_strict_dispatch_v2.py --selftest
          python -m py_compile nasdaq-xray/alpaca_full_scope_260_shadow.py
          python nasdaq-xray/alpaca_full_scope_260_shadow.py --selftest
          python -O nasdaq-xray/alpaca_full_scope_260_shadow.py --selftest
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"nasdaq-xray")
          from alpaca_free_sip_shadow_guard import scheduled_unknown_cohort,blob_sha
          from alpaca_sip_paginated_transport_shadow import MAX_PAGES
          from current_history_source_request import sha256_lines
          assert MAX_PAGES>=1 and all(callable(x) for x in
              (scheduled_unknown_cohort,blob_sha,sha256_lines))
          workflow=Path(".github/workflows/xray-alpaca-free-sip-shadow-proof.yml").read_text()
          assert 'sys.path.insert(0,"nasdaq-xray")\n          p=json.loads' in workflow
          print("XRAY_260_SCHEDULED_IMPORTS=PASS_OFFLINE_NO_VENDOR")
          PY
      - name: Audit all scheduled workflows and negative fixtures (zero market API calls)
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python -m py_compile nasdaq-xray/all_workflow_schedule_audit.py
          python nasdaq-xray/all_workflow_schedule_audit.py --selftest
          python -m py_compile nasdaq-xray/personal_sip_head_preflight.py
          python nasdaq-xray/personal_sip_head_preflight.py --selftest
      - name: Quota-free scheduled root ASOF and latest-main preflight
        id: scheduled_root
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt,json,os,pathlib,subprocess,sys
          sys.path.insert(0,"nasdaq-xray")
          from source_epoch_freshness_guard import last_complete_session
          from alpaca_root_rescue_strict_dispatch_v2 import scheduled_probe_allowed
          root=pathlib.Path("nasdaq-xray")
          now=dt.datetime.now(dt.timezone.utc)
          latest=last_complete_session(now)
          p=json.loads((root/"canonical_current_price_dv30.json").read_text())
          s=json.loads((root/"sina_state.json").read_text())
          check=subprocess.run(["git","ls-remote","origin","refs/heads/main"],
              text=True,capture_output=True,timeout=15,check=False)
          remote=(check.stdout.split()[0] if check.returncode==0 and check.stdout.split() else "")
          ready=scheduled_probe_allowed(now,latest,p,s,remote,os.environ["GITHUB_SHA"])
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("ready="+str(ready).lower()+"\n")
          print("XRAY_SCHEDULED_ROOT_PREFLIGHT="+(
              "LATEST_OR_PREVIOUS_OFFICIAL_SESSION_RESEARCH_ONLY" if ready
              else "OVER_ONE_SESSION_STALE_OR_HOLIDAY_OR_SHA_DRIFT_ZERO_HTTP_NOOP"))
          print("XRAY_SCHEDULED_ROOT_ASOF="+latest+
                " price="+str(p.get("asof_et"))+
                " root="+str(s.get("asof_et")))
          PY
      - name: Quota-free exact-main one-shot SIP source preflight
        id: push_price
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[sip-probe-once]') }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt,json,os,pathlib,subprocess,sys
          sys.path.insert(0,"nasdaq-xray")
          from alpaca_free_sip_shadow_guard import one_shot_price_probe_allowed,load_scope
          from alpaca_official_30_workflow_preflight import validate
          root=pathlib.Path("nasdaq-xray")
          now=dt.datetime.now(dt.timezone.utc)
          p=json.loads((root/"canonical_current_price_dv30.json").read_text())
          m=json.loads((root/"canonical_current_master_manifest.json").read_text())
          check=subprocess.run(["git","ls-remote","origin","refs/heads/main"],
              text=True,capture_output=True,timeout=15,check=False)
          remote=(check.stdout.split()[0] if check.returncode==0 and check.stdout.split() else "")
          ready=one_shot_price_probe_allowed(now,p,m,remote,os.environ["GITHUB_SHA"])
          ready=ready and validate(p.get("asof_et"),p.get("expected30"))=="EXACT_OFFICIAL_NASDAQ_LAST_30"
          if ready:
              _,_,cohort,_,_,_=load_scope(allow_no_representative=True)
              ready=len(cohort)==3 and all(s in set(p["unknown_symbols"]) for s in cohort)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("ready="+str(ready).lower()+"\n")
          print("XRAY_ONE_SHOT_SIP_PREFLIGHT="+(
              "CURRENT_EXACT_SHA_THREE_UNKNOWN_SOURCE_PROBE" if ready
              else "BLOCKED_NO_API_CALL_STALE_SHA_SCOPE_OR_CALENDAR"))
          PY
      - name: Bounded free historical SIP query only when PRIVATE keys available
        id: price_shadow
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.scheduled_root.outputs.ready == 'true') || (github.event_name == 'push' && steps.push_price.outputs.ready == 'true') }}
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then args+=(--rotate-unknown); fi
          python nasdaq-xray/alpaca_strict_daily_shadow_v2.py "${args[@]}" --output "$RUNNER_TEMP/xray_alpaca_free_sip_shadow.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_alpaca_free_sip_shadow.json").read_text())
          assert j["schema"]=="XRAY_ALPACA_FREE_SIP_SHADOW_GUARD_V1"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["vendor_raw_bars_persisted"] is False
          assert j["primary_mc_authority"] is False and j["c417_price_pass_promoted"] is False
          assert j["candidate_created"] is False and j["device_receipt_proven"] is False
          print("XRAY_ALPACA_SHADOW_SECURITY_CONTRACT=PASS_NO_PRIMARY_NO_TRADES_NO_RAW_BARS")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
              output.write("source_status="+j["status"]+"\n")
          PY
      - name: Bounded root UNKNOWN historical source rescue shadow
        if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.scheduled_root.outputs.ready == 'true')) && (steps.price_shadow.outputs.source_status == 'SHADOW_MEASUREMENT_COMPLETED_NO_PRIMARY_AUTHORITY' || steps.price_shadow.outputs.source_status == 'BLOCKED_NO_REPRESENTATIVE_CURRENT_PRICE_SCOPE') }}
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          python nasdaq-xray/alpaca_root_rescue_strict_dispatch_v2.py --limit 32 --output "$RUNNER_TEMP/xray_alpaca_root_unknown_rescue.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_alpaca_root_unknown_rescue.json").read_text())
          assert j["schema"]=="XRAY_ROOT_UNKNOWN_SIP_RESCUE_SHADOW_V1"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["primary_mc_authority"] is False and j["canonical_history_modified"] is False
          assert j["candidate_created"] is False and j["vendor_raw_bars_persisted"] is False
          print("XRAY_ALPACA_ROOT_RESCUE_GUARDS=PASS_NO_PRIMARY_NO_CANONICAL_WRITE")
          PY
      - name: Bounded 260-day PRICE UNKNOWN source rotation on existing official session cron
        if: ${{ github.event_name == 'schedule' && steps.scheduled_root.outputs.ready == 'true' }}
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,"nasdaq-xray")
          p=json.loads(Path("nasdaq-xray/canonical_current_price_dv30.json").read_text())
          if p["pass_count"]!=0 or p["unknown_count"]==0:
              print("XRAY_260_SCHEDULED_PRICE_UNKNOWN=NOOP_NO_ZERO_PASS_COHORT")
              sys.exit(0)
          target=Path(os.environ["RUNNER_TEMP"])/"xray_alpaca_260_unknown_research.json"
          subprocess.run([sys.executable,"nasdaq-xray/alpaca_full_scope_260_shadow.py",
              "--rotate-unknown","--out",str(target)],check=True)
          j=json.loads(target.read_text())
          required=min(32,p["unknown_count"])
          if (j["schema"]!="XRAY_ALPACA_CURRENT_515_EXACT260_SIP_SHADOW_V1"
              or j["status"]!="SHADOW_ZERO_PRICE_PASS_UNKNOWN_260_SOURCE_MEASURED_NO_AUTHORITY"
              or j["expected_scope_count"]!=required
              or j["measured_scope_count"]!=required
              or j["zero_price_pass_unknown_research_only"] is not True
              or j["source_market_data_rights_independently_attested"] is not False
              or j["current_c417_history_primary_authority"] is not False
              or j["canonical_history_pass_created"]!=0
              or j["r92_created"] is not False
              or j["execution"]!="NONE" or j["real_money"]!="NO-GO"):
              raise RuntimeError("XRAY_260_SCHEDULED_SOURCE_NOT_MEASURED_OR_AUTHORITY_DRIFT")
          from alpaca_free_sip_shadow_guard import scheduled_unknown_cohort,blob_sha
          from alpaca_sip_paginated_transport_shadow import MAX_PAGES
          from current_history_source_request import sha256_lines
          master_path=Path("nasdaq-xray/canonical_current_master_manifest.json")
          price_path=Path("nasdaq-xray/canonical_current_price_dv30.json")
          expected=scheduled_unknown_cohort(
              p["unknown_symbols"],p["asof_et"],batch_size=32,
              rotation_session=j["research_rotation_session"])
          if (j.get("research_symbols")!=expected
              or j.get("research_symbols_sha256")!=sha256_lines(expected)
              or j.get("research_rotation_distinct_from_initial_32")
                 is not (expected!=p["unknown_symbols"][:32])
              or j.get("source_price_blob_sha")!=blob_sha(price_path)
              or j.get("source_master_blob_sha")!=blob_sha(master_path)
              or j.get("api_http_page_budget")!=MAX_PAGES
              or type(j.get("api_http_page_attempts")) is not int
              or not 1<=j["api_http_page_attempts"]<=MAX_PAGES
              or j.get("api_http_min_pacing_interval_seconds",0)<0.65):
              raise RuntimeError("XRAY_260_ROTATION_SHA_OR_HTTP_QUOTA_NOT_PROVEN")
          print("XRAY_260_ROTATION_EVIDENCE=OFFICIAL_SESSION_SELECTED_COHORT_SHA_EXACT_HTTP_PAGE_BUDGET_PASSED")
          print("XRAY_260_SCHEDULED_UNKNOWN_HISTORY="+str(j["measured_scope_count"])+
                "_SIP_SOURCE_DIAGNOSTIC_ONLY_NO_PRIMARY_NO_R92")
          PY
      - name: Enforce actual delayed SIP HTTP measurement before success
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.scheduled_root.outputs.ready == 'true') || (github.event_name == 'push' && steps.push_price.outputs.ready == 'true') }}
        env:
          XRAY_SCHEDULE_ROOT_READY: ${{ steps.scheduled_root.outputs.ready }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          import sys
          sys.path.insert(0,"nasdaq-xray")
          from alpaca_root_rescue_strict_dispatch_v2 import classify_manual_root
          a=json.loads((root/"xray_alpaca_free_sip_shadow.json").read_text())
          b_path=root/"xray_alpaca_root_unknown_rescue.json"
          b=json.loads(b_path.read_text()) if b_path.exists() else None
          result=classify_manual_root(
              os.environ.get("GITHUB_EVENT_NAME",""),a,b,
              scheduled_ready=os.environ.get("XRAY_SCHEDULE_ROOT_READY")=="true")
          print("XRAY_ALPACA_LIVE_TRANSPORT="+result+"_NEVER_PRIMARY_OR_R92")
          print("XRAY_ALPACA_SOURCE_PROBE_STATUS="+str(a.get("status")))
          print("XRAY_ALPACA_SOURCE_PROBE_COUNTS="+json.dumps(a.get("reason_counts") or {},sort_keys=True))
          if os.environ.get("GITHUB_EVENT_NAME")=="push" and a.get("status")!="SHADOW_MEASUREMENT_COMPLETED_NO_PRIMARY_AUTHORITY":
              raise RuntimeError("XRAY_ONE_SHOT_PROVIDER_MEASUREMENT_NOT_COMPLETED")
          PY
      - name: Archive counts-only operational evidence for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-alpaca-free-sip-shadow-counts-v1
          path: |
            ${{ runner.temp }}/xray_alpaca_free_sip_shadow.json
            ${{ runner.temp }}/xray_alpaca_root_unknown_rescue.json
            ${{ runner.temp }}/xray_alpaca_260_unknown_research.json
          retention-days: 14
          if-no-files-found: warn
