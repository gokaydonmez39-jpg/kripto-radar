name: XRAY 406 isolated Witness acceptance
on:
  push:
    branches: [xray-406-witness-acceptance-20261114]
    paths:
      - '.github/workflows/xray-406-witness-acceptance.yml'
      - 'personal-swing/research_lab/xray406_witness_acceptance.py'
      - 'personal-swing/research_lab/test_xray406_witness_acceptance.py'
      - 'personal-swing/research_lab/xray406_witness_handoff.py'
      - 'personal-swing/research_lab/test_xray406_witness_handoff.py'
      - 'personal-swing/research_lab/*xray406_witness_publish*.py'
      - 'personal-swing/research_lab/*xray406_witness_github.py'
      - 'personal-swing/research_lab/*xray406_witness_stage.py'
      - 'personal-swing/research_lab/*xray406_witness_natural_receipt.py'
      - 'personal-swing/research_lab/*xray406_witness_session_window.py'
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  witness-offline:
    if: github.repository == 'gokaydonmez39-jpg/kripto-radar' && github.ref == 'refs/heads/xray-406-witness-acceptance-20261114' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned exchange calendar for isolated cross-check
        run: python3 -m pip install --disable-pip-version-check 'exchange-calendars==4.13.2'
      - name: Normal and optimized offline regression
        env:
          XRAY406_VERIFY_CALENDAR_LIBRARY: "1"
        run: |
          python3 -m unittest discover -s personal-swing/research_lab -p 'test_xray406_witness_*.py' -v
          python3 -O -m unittest discover -s personal-swing/research_lab -p 'test_xray406_witness_*.py' -v
      - name: Verify archived Official Witness commit without republishing it
        shell: bash
        run: |
          set -euo pipefail
          history="$(mktemp -d)"
          trap 'rm -rf "$history"' EXIT
          git -C "$history" init -q
          git -C "$history" remote add origin https://github.com/gokaydonmez39-jpg/kripto-radar.git
          git -C "$history" config remote.origin.promisor true
          git -C "$history" config remote.origin.partialclonefilter blob:none
          export GIT_TERMINAL_PROMPT=0
          base=8fa7a1746193b9c7be0f89c67a2a18eb928f1970
          candidate=3c67b87fe16c9a79f3465c880049dba0ee53e518
          timeout 90s git -C "$history" fetch --no-tags --depth=2 --filter=blob:none origin "$candidate"
          PYTHONPATH=personal-swing/research_lab timeout 100s python3 - "$history" "$base" "$candidate" <<'PY'
          import sys
          from xray406_witness_acceptance import Rejected, check_candidate

          root, base, candidate = sys.argv[1:]
          generated, guard, ledger = check_candidate(root, base, candidate)
          try:
              check_candidate(root, candidate, candidate)
          except Rejected as exc:
              if str(exc) != "STALE_BASE_OR_NOT_SINGLE_PARENT":
                  raise
          else:
              raise RuntimeError("WRONG_BASE_ACCEPTED")
          print(f"ARCHIVE_CANDIDATE_OK head={candidate} base={base} generated={generated.isoformat()}")
          print(f"ARCHIVE_BLOB_IDS guard={guard} ledger={ledger}")
          print("ARCHIVE_ONLY_NO_CURRENT_CI_NO_PUBLICATION_NO_FIRST_VISIBILITY")
          PY
      - name: Validate real GitHub evidence adapter without mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=personal-swing/research_lab python3 - <<'PY'
          from datetime import datetime, timezone
          from xray406_witness_github import GitHubIsolatedTransport, gh, receipt_pair
          from xray406_witness_handoff import ACTOR, CHECK, CI_PATH, REPO

          candidate = "c0cacce6809ec099d98c4788c9c585ef5821a7a4"
          def read_only(path):
              if not path.startswith(f"repos/{REPO}/"):
                  raise RuntimeError("READ_SCOPE_REFUSED")
              return gh(path)
          run, src = receipt_pair(43589985977, 1, candidate, read_only)
          if (run.actor, run.head, run.event, run.workflow, src.job_id,
              src.check.name, src.check.conclusion) != (
                  ACTOR, candidate, "push", CI_PATH, 132432458052, CHECK, "success"):
              raise RuntimeError("ARCHIVED_CHECK_MISMATCH")
          transport = GitHubIsolatedTransport(lambda: datetime.now(timezone.utc), read_only)
          if transport.head("target") != candidate:
              raise RuntimeError("ARCHIVED_TARGET_DRIFT")
          print("REAL_GITHUB_EVIDENCE_ADAPTER_PASS_NO_MUTATION")
          PY
