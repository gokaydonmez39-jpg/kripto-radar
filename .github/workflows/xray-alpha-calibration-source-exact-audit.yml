name: XRAY Alpha Calibration Source-Exact Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/alpha_calibration_audit.py"
      - "nasdaq-xray/canonical_alpha_calibration_audit.json"
      - "nasdaq-xray/canonical_current_terminal.json"
      - "nasdaq-xray/canonical_current_final_tech.json"
      - "nasdaq-xray/canonical_terminal_20*.json"
      - "nasdaq-xray/canonical_final_tech_20*.json"
      - ".github/workflows/xray-alpha-calibration-source-exact-audit.yml"
permissions:
  contents: read
concurrency:
  group: xray-alpha-calibration-source-exact
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify calibration fail-closed and SHA negative tests
        run: |
          python -m py_compile nasdaq-xray/alpha_calibration_audit.py
          python nasdaq-xray/alpha_calibration_audit.py --selftest
      - name: Recompute historical final bottlenecks and independently attest committed artifact
        run: |
          cp nasdaq-xray/canonical_alpha_calibration_audit.json "$RUNNER_TEMP/xray_alpha_committed.json"
          python nasdaq-xray/alpha_calibration_audit.py
          python - <<'PY'
          import json,os
          from pathlib import Path
          old=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_alpha_committed.json").read_text())
          new=json.loads(Path("nasdaq-xray/canonical_alpha_calibration_audit.json").read_text())
          for item in (old,new):
              item.pop("generated_at_utc",None)
          if old != new:
              def find_diff(a,b,p=""):
                  if isinstance(a,dict) and isinstance(b,dict):
                      return sum((find_diff(a.get(k),b.get(k),p+"."+k)
                                  for k in set(a)|set(b)),[])
                  if isinstance(a,list) and isinstance(b,list) and len(a)==len(b):
                      return sum((find_diff(x,y,p+"["+str(i)+"]")
                                  for i,(x,y) in enumerate(zip(a,b))),[])
                  return [(p,repr(a)[:160],repr(b)[:160])] if a!=b else []
              print("XRAY_ALPHA_CALIBRATION_DIFF="+str(find_diff(old,new)[:12]))
              print("XRAY_ALPHA_CALIBRATION_STORED_SNAPSHOT=FAIL_STALE_OR_MANUALLY_MISMATCHED")
              raise SystemExit(1)
          assert not any(x["comparable_to_current_c417"] and
                         x.get("full_end_to_end_research_pass") is not True
                         for x in new["observed_terminal_snapshots"])
          print("XRAY_ALPHA_CALIBRATION_STORED_SNAPSHOT=PASS_EXACT_RECOMPUTED")
          PY
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("nasdaq-xray")
          j=json.loads((root/"canonical_alpha_calibration_audit.json").read_text())
          assert j["schema"]=="XRAY_ALPHA_CALIBRATION_AUDIT_V1"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["alpha_authority"] is False and j["no_threshold_change"] is True
          assert all(x["full_end_to_end_research_pass"] is True
                     for x in j["observed_terminal_snapshots"]
                     if x["comparable_to_current_c417"])
          assert len({x["asof_et"] for x in j["observed_terminal_snapshots"]})==j["observed_snapshot_count"]
          current=[x for x in j["observed_terminal_snapshots"]
                   if x["terminal_path"]=="nasdaq-xray/canonical_current_terminal.json"]
          assert all(x["full_end_to_end_research_pass"] is True
                     or not x["comparable_to_current_c417"] for x in current)
          print("XRAY_ALPHA_CALIBRATION_EVIDENCE="+j["status"])
          print("XRAY_ALPHA_CALIBRATION_COMPLETED_EPOCHS="+str(j["comparable_current_policy_session_count"]))
          print("XRAY_ALPHA_CALIBRATION_TEST_ONLY=NO_ALPHA_PROMOTION")
          PY
      - name: Preserve transparent non-authoritative calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-alpha-calibration-source-exact-v2
          path: nasdaq-xray/canonical_alpha_calibration_audit.json
          retention-days: 14
          if-no-files-found: error
