name: XRAY Nine Issuer Exact SEC Provenance Regression TEMP
on:
  push:
    branches: [xray/sec-nine-issuer-pit-no-promotion-20261015]
    paths:
      - ".github/workflows/xray-nine-issuer-sec-contradiction-regression-temp.yml"
permissions:
  contents: read
jobs:
  provenance-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate frozen nine SEC sources and all adversarial negatives
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/research/validate_sec_nine_unknown_issuer_evidence.py
          python nasdaq-xray/research/validate_sec_nine_unknown_issuer_evidence.py --selftest
          python nasdaq-xray/research/validate_sec_nine_unknown_issuer_evidence.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("nasdaq-xray/research/sec_nine_unknown_issuer_evidence_20261014.json").read_text())
          assert data["can_change_master"] is False
          assert data["can_change_price_dv30"] is False
          assert data["can_change_mc"] is False
          assert data["can_create_r92"] is False
          assert len(data["records"])==9
          print("XRAY_NINE_SEC_FROZEN=NO_API_CALL_NO_MASTER_MUTATION_NO_ALPHA")
          PY
