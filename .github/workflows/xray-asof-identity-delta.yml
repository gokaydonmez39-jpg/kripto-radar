name: XRAY ASOF Identity Delta Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-asof-identity-delta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare frozen 2026-10-05 identity to current identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          old_sha="372e228f89486dedaceb5d784f04817d00944d2c"
          path="nasdaq-xray/canonical_current_full_state.json"
          old=json.loads(subprocess.check_output(["git","show",f"{old_sha}:{path}"],text=True))
          cur=json.load(open(path))
          assert old.get("asof_et")=="2026-10-05" and cur.get("asof_et")=="2026-10-05"
          oq=set(old.get("queue") or []);cq=set(cur.get("queue") or [])
          on=old.get("security_names") or {};cn=cur.get("security_names") or {}
          added=sorted(cq-oq);removed=sorted(oq-cq)
          print(json.dumps({
            "XRAY_ASOF_IDENTITY_DELTA":{
              "old_sha":old_sha,
              "old_ruleset":old.get("identity_ruleset"),
              "current_ruleset":cur.get("identity_ruleset"),
              "old_count":len(oq),"current_count":len(cq),
              "added":[{"symbol":s,"name":cn.get(s)} for s in added],
              "removed":[{"symbol":s,"name":on.get(s)} for s in removed],
            }
          },sort_keys=True))
          PY
