name: XRAY Preopen EOD Research Receipt Offline Security CI
on:
  pull_request:
    branches: [main]
    paths:
      - nasdaq-xray/preopen_personal_research_receipt_guard.py
      - .github/workflows/xray-preopen-source-audit.yml
      - .github/workflows/xray-preopen-watch-receipt-offline-ci.yml
  push:
    branches: [main]
    paths:
      - nasdaq-xray/preopen_personal_research_receipt_guard.py
      - .github/workflows/xray-preopen-watch-receipt-offline-ci.yml
permissions:
  contents: read
jobs:
  source-bound-receipt:
    name: 9 forged release, stale session, next-source proof, no false device ack
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Nasdaq session calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Code, python and optimized python adversarial readback
        run: |
          python -m py_compile nasdaq-xray/preopen_personal_research_receipt_guard.py
          python nasdaq-xray/preopen_personal_research_receipt_guard.py --selftest
          python -O nasdaq-xray/preopen_personal_research_receipt_guard.py --selftest
      - name: Reject market-data calls and reject imaginary live push claims
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path("nasdaq-xray/preopen_personal_research_receipt_guard.py").read_text()
          pre=Path(".github/workflows/xray-preopen-source-audit.yml").read_text()
          assert "XRAY_PREOPEN_EOD_WATCH_RECEIPT_GATE_V1" in code
          assert "RESEARCH_LAST_COMPLETE_ASOF_CROSS_ARTIFACT_VERIFIED" in code
          assert "can_claim_opening_full_go" in code and "False" in code
          assert "iphone_delivery_receipt_attested" in code
          assert "platform_notification_sent_by_this_audit" in code
          assert "XRAY_PREOPEN_WATCH_RECEIPT=NO_FALSE_GO_" in pre
          assert "xray-preopen-research-watch" not in pre
          assert "xray_preopen_research_watch_truth.json" in pre
          assert "gh run download" not in code
          assert "subprocess" not in code
          print("XRAY_PREOPEN_WATCH_RECEIPT_OFFLINE_CI=PASS_CROSS_RUN_SOURCE_WITHOUT_VENDOR_CALLS")
          PY
