name: XRAY Current Source Dependency Diagnostic (No R92)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/xray_source_dependency_diagnostic_v27.py"
      - ".github/workflows/xray-current-source-dependency-diagnostic.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/xray_source_dependency_diagnostic_v27.py"
      - ".github/workflows/xray-current-source-dependency-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-source-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Offline fail-closed mutation tests without market IO
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/xray_source_dependency_diagnostic_v27.py
          python nasdaq-xray/xray_source_dependency_diagnostic_v27.py --selftest
          python -O nasdaq-xray/xray_source_dependency_diagnostic_v27.py --selftest
      - name: Measure actual canonical source blockers, diagnostic never AL
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          python nasdaq-xray/xray_source_dependency_diagnostic_v27.py --out "${RUNNER_TEMP}/xray_dependency_diagnostic.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_dependency_diagnostic.json").read_text())
          if a.get("release_authorized") is not False or a.get("registered_R92_generated") is not False:
              raise SystemExit("RESEARCH_DIAGNOSTIC_NEVER_RELEASE")
          if a.get("status") != "BLOCKED_OR_DIAGNOSTIC_ONLY":
              raise SystemExit("DIAGNOSTIC_STATUS_INVALID")
          print("XRAY_V27_ACTUAL_SOURCE_DIAG="+a["first_blocker"]+" count="+str(a["source_counts"]))
          PY
      - name: Persist small redacted diagnostic only
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-current-dependency-redacted
          path: ${{ runner.temp }}/xray_dependency_diagnostic.json
          retention-days: 7
          if-no-files-found: error
