name: XRAY Experimental HackMyAgent Security Canary (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/xray-hackmyagent-isolated-canary.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/xray-hackmyagent-isolated-canary.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: xray-hma-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-no-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENA2A_TELEMETRY: 'off'
      CI: 'true'
      npm_config_ignore_scripts: 'true'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact HackMyAgent version with all install scripts disabled
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/hma" --ignore-scripts --no-audit --no-fund 'hackmyagent@0.33.2'
          "$RUNNER_TEMP/hma/node_modules/.bin/hackmyagent" --version > "$RUNNER_TEMP/hma-version.txt" 2>&1
          cat "$RUNNER_TEMP/hma-version.txt"
          grep -F "Telemetry: off" "$RUNNER_TEMP/hma-version.txt"
      - name: Run published CLI secure static scan on isolated over-privileged synthetic MCP fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fixture"
          printf '%s\n' '{"mcpServers":{"filesystem":{"command":"npx","args":["-y","@modelcontextprotocol/server-filesystem","/"]}}}' > "$RUNNER_TEMP/fixture/claude_desktop_config.json"
          set +e
          "$RUNNER_TEMP/hma/node_modules/.bin/hackmyagent" secure "$RUNNER_TEMP/fixture" --json --static-only --no-registry > "$RUNNER_TEMP/hma-scan.json" 2> "$RUNNER_TEMP/hma-scan-stderr.txt"
          status=$?
          set -e
          echo "XRAY_HMA_STATIC_SCAN_EXIT_CODE=$status"
          if [[ ! -s "$RUNNER_TEMP/hma-scan.json" ]]; then
            echo "XRAY_HMA_NO_STATIC_SCAN_JSON=BLOCKED"
            head -c 1100 "$RUNNER_TEMP/hma-scan-stderr.txt" || true
            exit 13
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          raw=(root/"hma-scan.json").read_text()
          obj=json.loads(raw)
          assert isinstance(obj,dict),"UNEXPECTED_SCAN_SCHEMA"
          print("XRAY_HMA_STATIC_RESULT_KEYS="+",".join(list(obj)[:15]))
          print("XRAY_HMA_STATIC_RESULT_LENGTH="+str(len(raw)))
          # False positives are not grounds to promote source authority.
          # An actual security finding must originate from scanner output.
          low=raw.lower()
          assert "filesystem" in low or "mcp" in low,"NO_MCP_CHECK_COVERAGE"
          assert ("finding" in low or "critical" in low or "high" in low),"NO_FINDING_EVIDENCE"
          print("XRAY_HMA_REAL_MCP_STATIC_CANARY=PASS_RESEARCH_ONLY")
          PY
      - name: Declare no production authority and no automatic fixes
        run: |
          echo "XRAY_HMA_NO_SECRETS_NO_TRADE_NO_FIX=PASS"
          echo "This is an isolated scanner test; C4.17, market feeds, R92 and notifications are unchanged." >> "$GITHUB_STEP_SUMMARY"
