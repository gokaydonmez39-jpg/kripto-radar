name: XRAY SEC Free MC Transport and PIT Proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/sec_official_free_mc_transport_probe.py"
      - "nasdaq-xray/sec_sgml_acceptance_witness.py"
      - ".github/workflows/xray-sec-free-mc-transport-proof.yml"
permissions:
  contents: read
concurrency:
  group: xray-sec-free-mc-transport-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  official-sec:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reject mixed invocation/source commits before SEC transport
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "XRAY_SEC_TRANSPORT_CHECKOUT_SHA_MISMATCH_FAIL_CLOSED" >&2
            exit 2
          fi
          echo "XRAY_SEC_TRANSPORT_CHECKOUT_EXACT=PASS"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install official-session calendar
        run: python -m pip install pandas_market_calendars==5.4.0
      - name: Compile and test future filing, identity, stale, and tamper guards
        run: |
          python -m py_compile nasdaq-xray/sec_official_free_mc_transport_probe.py
          python nasdaq-xray/sec_official_free_mc_transport_probe.py --selftest
      - name: Verify actual SEC SGML acceptance clock and CIK provenance
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT || vars.XRAY_SEC_USER_AGENT }}
        run: |
          python -m py_compile nasdaq-xray/sec_sgml_acceptance_witness.py
          python nasdaq-xray/sec_sgml_acceptance_witness.py --selftest
          python -O nasdaq-xray/sec_sgml_acceptance_witness.py --selftest
          python nasdaq-xray/sec_sgml_acceptance_witness.py --apple-canary             --out "$RUNNER_TEMP/xray_sec_apple_sgml_clock.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_sec_apple_sgml_clock.json").read_text())
          assert j["schema"]=="XRAY_SEC_SGML_ACCEPTANCE_CLOCK_WITNESS_V1"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["can_register_R92"] is False
          if j["status"].startswith("SGML_"):
              assert j["source_transport_attested"] is True
              assert j["production_mc_primary_pass"] is False
              assert j["issuer_share_class_verified"] is False
              assert j["vendor_bars_or_share_numbers_exported"] is False
              assert j["accession"]=="0000320193-26-000018"
              assert j["status"]=="SGML_ACCEPTED_AFTER_RTH_CLOSE_UNKNOWN"
          else:
              assert j["source_transport_attested"] is False
              assert j["status"].startswith(("BLOCKED_","UNKNOWN_"))
          print("XRAY_SEC_SGML_SOURCE_PROVENANCE=VERIFIED_OR_FAIL_CLOSED_RESEARCH_ONLY")
          PY
      - name: Probe two official SEC endpoints once without paid credits
        env:
          # Prefer repository secret, allow a non-sensitive dedicated-contact
          # repository variable when GitHub's Secret UI cannot save a value.
          # Never print the User-Agent, email address, or variable contents.
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT || vars.XRAY_SEC_USER_AGENT }}
        run: |
          python nasdaq-xray/sec_official_free_mc_transport_probe.py \
            --asof 2026-10-08 \
            --output "$RUNNER_TEMP/xray_sec_free_mc_transport.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_sec_free_mc_transport.json"
          obj=json.loads(p.read_text())
          assert obj["execution"]=="NONE" and obj["real_money"]=="NO-GO"
          assert obj["api_spend_usd"]==0 and obj["production_mc_primary_pass"] is False
          assert obj["alpha_authority"] is False and obj["unknown_never_pass"] is True
          print("SEC_FREE_MC_GUARDS=PASS_NO_PAID_CREDITS_NO_FAKE_PRIMARY")
          PY
      - name: Enforce real official SEC reachability, fail closed
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_sec_free_mc_transport.json").read_text())
          if j["sec_transport"] != "HTTP_200_BOTH":
              print("XRAY_SEC_LIVE_TRANSPORT=BLOCKED:"+str(j["reason"]))
              raise SystemExit(2)
          print("XRAY_SEC_LIVE_TRANSPORT=PASS_OFFICIAL_ENDPOINTS_ONLY_NOT_MC_AUTHORITY")
          PY
      - name: Upload operational-only result without issuer values
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-sec-free-mc-transport-operational-v1
          path: |
            ${{ runner.temp }}/xray_sec_free_mc_transport.json
            ${{ runner.temp }}/xray_sec_apple_sgml_clock.json
          retention-days: 14
          if-no-files-found: error
