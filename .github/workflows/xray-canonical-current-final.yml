      - name: Commit current final artifacts
        if: steps.event.outputs.ready == 'true' && steps.account_vault.outputs.restart_required != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            changed="$(git diff --name-only "$GITHUB_SHA" "$latest" --               .github/workflows/xray-canonical-current-final.yml               nasdaq-xray/canonical_current_history.json               nasdaq-xray/canonical_current_legal.json               nasdaq-xray/canonical_current_stage1_input.json               nasdaq-xray/canonical_current_stage1.json               nasdaq-xray/canonical_current_regime.json               nasdaq-xray/canonical_current_deep_geometry.json               nasdaq-xray/canonical_current_event_request.json               nasdaq-xray/alpha_semantics.py               nasdaq-xray/test_alpha_semantics.py               nasdaq-xray/test_deep_repair_regressions.py               nasdaq-xray/stage1_shadow.py               nasdaq-xray/deep_pre_r1_shadow.py               nasdaq-xray/family_c_engine.py               nasdaq-xray/final_tech_shadow.py               nasdaq-xray/canonical_candidate_legal_guard.json               nasdaq-xray/build_current_terminal.py               nasdaq-xray/official_source_guard.py               nasdaq-xray/resilience_runtime.py               nasdaq-xray/build_final_gate_overlay_v2.py               nasdaq-xray/account_gate_contract.json               nasdaq-xray/account_provider_adapter_contract.json               nasdaq-xray/account_longbridge_openapi_probe.py               nasdaq-xray/account_longbridge_openapi_probe_selftest.py               nasdaq-xray/account_longbridge_mcp_v2_probe.py               nasdaq-xray/account_longbridge_mcp_v2_probe_selftest.py               nasdaq-xray/account_longbridge_mcp_v2_vault.py               nasdaq-xray/account_longbridge_mcp_v2_vault_selftest.py               nasdaq-xray/account_longbridge_mcp_v2_bootstrap.py               nasdaq-xray/account_longbridge_mcp_v2_refresh.py               nasdaq-xray/account_longbridge_mcp_v2_refresh_selftest.py               nasdaq-xray/account_longbridge_mcp_v2_token.enc               nasdaq-xray/select_account_live_probe.py               nasdaq-xray/select_account_live_probe_selftest.py               nasdaq-xray/account_same_run_terminal_selftest.py               nasdaq-xray/chatgpt_compiled_policy_v3.json || true)"
            if [[ -n "$changed" ]]; then
              echo "XRAY_FACTORY_COMMIT=STALE_SOURCE_ABORT"
              printf '%s\n' "$changed"
              exit 0
            fi
          fi
          files=(
            nasdaq-xray/canonical_official_source_guard.json
            nasdaq-xray/canonical_current_event_state.json
            nasdaq-xray/canonical_current_family_c.json
            nasdaq-xray/canonical_current_deep_full.json
            nasdaq-xray/canonical_candidate_lifecycle_registry.json
            nasdaq-xray/canonical_current_final_tech.json
            nasdaq-xray/canonical_current_terminal.json
            nasdaq-xray/canonical_current_final_gate_overlay.json
          )
          if [ -f nasdaq-xray/account_longbridge_mcp_v2_token.enc ]; then
            files+=(nasdaq-xray/account_longbridge_mcp_v2_token.enc)
          fi
          if [ -f nasdaq-xray/account_longbridge_mcp_v2_bootstrap_state.json ]; then
            files+=(nasdaq-xray/account_longbridge_mcp_v2_bootstrap_state.json)
          fi
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for p in "${files[@]}"; do
            if [ -f "$p" ]; then
              mkdir -p "$tmpdir/$(dirname "$p")"
              cp "$p" "$tmpdir/$p"
            fi
          done
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git reset --hard origin/main
            for p in "${files[@]}"; do
              if [ -f "$tmpdir/$p" ]; then
                mkdir -p "$(dirname "$p")"
                cp "$tmpdir/$p" "$p"
              fi
            done
            git add "${files[@]}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "XRAY_FACTORY_COMMIT=NO_CHANGE"
              exit 0
            fi
            git commit -m "chore(xray): current epoch final factory"
            if git push origin HEAD:main; then
              echo "XRAY_FACTORY_COMMIT=PASS"
              exit 0
            fi
            echo "XRAY_FACTORY_PUSH_RACE attempt=$attempt"
            sleep $((attempt*2))
          done
          echo "XRAY_FACTORY_COMMIT=FAIL" >&2
          exit 1

