# XRAY current exact-chain replay trigger 2026-10-07 after settlement-regression repair
name: XRAY Canonical Current Final Factory

# manual exact-current replay trigger: 2026-10-07-post-regression-repair
# exact-current replay after non-preemptive Final regression proof: 2026-10-07-v3
on:
  workflow_run:
    workflows: ["XRAY Resilience + Official Witnesses", "XRAY Canonical Current Post-MC Factory", "XRAY Event Official Primary Promote"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-canonical-current-final.yml"
      - "nasdaq-xray/canonical_event_bridge_*.json"
      - "nasdaq-xray/canonical_current_deep_geometry.json"
      - "nasdaq-xray/canonical_current_event_request.json"
      - "nasdaq-xray/canonical_current_event_state.json"
      - "nasdaq-xray/canonical_benchmark_cache/**"
      - "nasdaq-xray/canonical_deep_history_cache_manifest.json"
      - "nasdaq-xray/build_current_event_state.py"
      - "nasdaq-xray/build_event_provenance_rebind.py"
      - "nasdaq-xray/scheduler_kick_final.json"
      - "nasdaq-xray/scheduler_failover_contract.json"
      - "nasdaq-xray/alpha_semantics.py"
      - "nasdaq-xray/alpha_calibration_audit.py"
      - "nasdaq-xray/family_c_engine.py"
      - "nasdaq-xray/deep_pre_r1_shadow.py"
      - "nasdaq-xray/final_tech_shadow.py"
      - "nasdaq-xray/final_risk_rr_independent_audit.py"
      - "nasdaq-xray/build_candidate_legal_guard.py"
      - "nasdaq-xray/sec_ticker_cik_cache.json"
      - "nasdaq-xray/build_current_terminal.py"
      - "nasdaq-xray/official_source_guard.py"
      - "nasdaq-xray/resilience_runtime.py"
      - "nasdaq-xray/build_final_gate_overlay_v2.py"
      - "nasdaq-xray/semantic_cache_diff.py"
      - "nasdaq-xray/strict_g9_runtime_state.json"
      - "nasdaq-xray/account_gate_contract.json"
      - "nasdaq-xray/account_provider_adapter_contract.json"
      - "nasdaq-xray/account_longbridge_openapi_probe.py"
      - "nasdaq-xray/account_longbridge_openapi_probe_selftest.py"
      - "nasdaq-xray/account_longbridge_mcp_probe.py"
      - "nasdaq-xray/account_longbridge_mcp_probe_selftest.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_probe.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_probe_selftest.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_vault.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_vault_selftest.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_refresh.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_refresh_selftest.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_bootstrap.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_token.enc"
      - "nasdaq-xray/select_account_live_probe.py"
      - "nasdaq-xray/select_account_live_probe_selftest.py"
      - "nasdaq-xray/account_same_run_terminal_selftest.py"
      - "nasdaq-xray/requirements-account-probe.txt"
      - "nasdaq-xray/requirements-account-mcp-probe.txt"
      - "nasdaq-xray/chatgpt_compiled_policy_v3.json"
      - ".github/workflows/xray-canonical-current-final.yml"
  schedule:
    - cron: "53 5-23 * * 1-5"
    - cron: "53 0-3 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Never cancel an in-flight exact Final merely because a newer trigger exists.
  # GitHub retains one pending successor; the commit-stage exact source diff guard
  # already prevents stale writers. This avoids [skip ci]/non-authoritative pushes
  # starving a valid long deep/full Final before publication.
  group: xray-canonical-current-final-c417-v2
  cancel-in-progress: false

jobs:
  final:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}

      # PERSONAL MANUAL SIGNAL-ONLY: account/broker synchronization is not
      # a precondition for independent Nasdaq delayed-EOD research.
      - name: Rebind exact current event provenance without rediscovery
        id: event_rebind
        shell: bash
        run: |
          set -euo pipefail
          python nasdaq-xray/build_event_provenance_rebind.py --selftest
          python nasdaq-xray/build_event_provenance_rebind.py | tee /tmp/event_rebind_out
          cat /tmp/event_rebind_out >> "$GITHUB_OUTPUT"

      - name: Find exact-bound committed event bridge
        id: event
        if: steps.event_rebind.outputs.ready != 'false'
        shell: bash
        run: |
          python - <<'PY' > /tmp/event_out
          import glob,json,pathlib,subprocess
          def bsha(p):
              return subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
          reqp=pathlib.Path("nasdaq-xray/canonical_current_event_request.json")
          if not reqp.exists():
              print("ready=false"); raise SystemExit
          r=json.load(open(reqp))
          if r.get("schema")!="XRAY_EVENT_EPOCH_REQUEST_V1" or r.get("status")!="READY":
              print("ready=false"); raise SystemExit
          # Final is downstream of the current pre-MC epoch. An exact old Event
          # request is not current authority after MASTER/PRICE roll to a newer
          # ASOF. Treat that as a healthy upstream-incomplete no-op, not as a
          # Final data failure and never mix old Deep/Event with new PRICE.
          try:
              m=json.load(open("nasdaq-xray/canonical_current_master_manifest.json"))
              p=json.load(open("nasdaq-xray/canonical_current_price_dv30.json"))
          except Exception:
              print("ready=false"); print("upstream_epoch_drift=true"); raise SystemExit
          # Same-ASOF is insufficient after an upstream policy/source migration.
          # Final may run only when HISTORY is bound through a zero-UNKNOWN MC
          # bridge to the exact current DV30 pass set and current C4.17 hash.
          try:
              h=json.load(open("nasdaq-xray/canonical_current_history.json"))
              mc_rel=str(h.get("source_mc_artifact") or "")
              mc_path=pathlib.Path(mc_rel)
              mc=json.load(open(mc_path)) if mc_rel and mc_path.exists() else {}
              price_pass=set(p.get("pass_symbols") or [])
              primary=set(mc.get("primary_pass_symbols") or [])
              mcfail=set(mc.get("primary_fail_symbols") or [])
              watch=set(mc.get("fallback_watch_symbols") or [])
              fallback_fail=set(mc.get("fallback_fail_symbols") or mc.get("fallback_two_source_fail_symbols") or [])
              mcunk=set(mc.get("unknown_symbols") or [])
              mc_groups=[primary,mcfail,watch,fallback_fail,mcunk]
              mc_counts=mc.get("counts") or {}
              mc_results=mc.get("results") or {}
              mc_partition_exact=(
                all(not (mc_groups[a]&mc_groups[b]) for a in range(len(mc_groups)) for b in range(a+1,len(mc_groups)))
                and primary|mcfail|watch|fallback_fail|mcunk==price_pass
                and set(mc_results)==price_pass
                and int(mc_counts.get("MC_PASS_PRIMARY",-1))==len(primary)
                and int(mc_counts.get("MC_FAIL_PRIMARY",-1))==len(mcfail)
                and int(mc_counts.get("MC_PASS_FALLBACK_WATCH",-1))==len(watch)
                and int(mc_counts.get("MC_FAIL_FALLBACK_TWO_SOURCE",mc_counts.get("MC_FAIL_FALLBACK",-1)))==len(fallback_fail)
                and int(mc_counts.get("MC_UNKNOWN",-1))==len(mcunk)
                and int(mc_counts.get("TOTAL",-1))==len(price_pass)
              )
              current_mc_exact=(
                h.get("asof_et")==p.get("asof_et")
                and h.get("source_mc_policy_hash")=="68684c130849016dd5148c1afdaa888766dc8070506af892420e493629a92fa4"
                and h.get("source_mc_policy_version")=="C4.17"
                and h.get("source_mc_blob_sha")==bsha(mc_path)
                and mc.get("schema")=="XRAY_MC_EPOCH_RESULT_V1"
                and mc.get("status")=="COMMITTED"
                and mc.get("asof_et")==p.get("asof_et")
                and mc.get("policy_hash")=="68684c130849016dd5148c1afdaa888766dc8070506af892420e493629a92fa4"
                and mc.get("policy_version")=="C4.17"
                and mc.get("input_path")=="nasdaq-xray/canonical_current_price_dv30.json"
                and mc.get("input_blob_sha")==bsha(pathlib.Path("nasdaq-xray/canonical_current_price_dv30.json"))
                and mc.get("input_pass_hash")==p.get("pass_hash")
                and int(mc.get("input_count",-1))==int(p.get("pass_count",-2))
                and mc_partition_exact
                and set((mc.get("results") or {}).keys())==set(p.get("pass_symbols") or [])
              )
          except Exception:
              current_mc_exact=False
          if not current_mc_exact:
              print("ready=false")
              print("upstream_epoch_drift=true")
              print("upstream_reason=CURRENT_DV30_MC_CHAIN_NOT_EXACT")
              print("history_source_mc_policy_hash="+str((h if 'h' in locals() else {}).get("source_mc_policy_hash")))
              print("current_price_pass_hash="+str(p.get("pass_hash")))
              raise SystemExit
          req_asof=str(r.get("asof_et") or "")
          master_asof=str(m.get("asof_et") or "")
          price_asof=str(p.get("asof_et") or "")
          if (not req_asof or master_asof!=req_asof or price_asof!=req_asof
              or int(p.get("unknown_count",-1))!=0):
              print("ready=false")
              print("upstream_epoch_drift=true")
              print("request_asof="+req_asof)
              print("master_asof="+master_asof)
              print("price_asof="+price_asof)
              print("price_unknown_count="+str(p.get("unknown_count")))
              raise SystemExit
          current_sources={
            "source_stage1_blob_sha":bsha("nasdaq-xray/canonical_current_stage1.json"),
            "source_regime_blob_sha":bsha("nasdaq-xray/canonical_current_regime.json"),
            "source_deep_geometry_blob_sha":bsha("nasdaq-xray/canonical_current_deep_geometry.json"),
          }
          if any(r.get(k)!=v for k,v in current_sources.items()):
              print("ready=false")
              print("current_source_binding=false")
              for k,v in current_sources.items():
                  print(f"{k}_actual={v}")
                  print(f"{k}_expected={r.get(k)}")
              raise SystemExit
          valid=[]
          for fp in glob.glob("nasdaq-xray/canonical_event_bridge_*.json"):
              try:
                  e=json.load(open(fp))
                  ok=(
                    e.get("schema")=="XRAY_EVENT_EPOCH_RESULT_V1"
                    and e.get("status")=="COMMITTED"
                    and e.get("task_id")=="6a825366222081918997094d76e6ae46"
                    and e.get("execution")=="NONE" and e.get("real_money")=="NO-GO"
                    and e.get("asof_et")==r.get("asof_et")
                    and e.get("weekly_scope_hash")==r.get("weekly_scope_hash")
                    and e.get("geometry_scope_hash")==r.get("geometry_scope_hash")
                    and e.get("source_stage1_blob_sha")==r.get("source_stage1_blob_sha")
                    and e.get("source_regime_blob_sha")==r.get("source_regime_blob_sha")
                    and e.get("source_deep_geometry_blob_sha")==r.get("source_deep_geometry_blob_sha")
                    and e.get("source_request_path")=="nasdaq-xray/canonical_current_event_request.json"
                    and e.get("source_request_blob_sha")==bsha(reqp)
                    and e.get("compiled_policy_hash")==r.get("compiled_policy_hash")=="68684c130849016dd5148c1afdaa888766dc8070506af892420e493629a92fa4"
                    and e.get("compiled_policy_version")==r.get("compiled_policy_version")=="C4.17"
                    and e.get("compiled_policy_blob_sha")==r.get("compiled_policy_blob_sha")=="16c50cc8f887a5234a4be23862d7c8d0e564b0ac"
                  )
                  if ok:
                      valid.append({"path":fp,"obj":e,"blob":bsha(fp)})
              except Exception:
                  pass
          by_path={x["path"]:x for x in valid}
          ordered=[]
          for row in valid:
              e=row["obj"]
              sp=e.get("supersedes_event_bridge_path")
              ss=e.get("supersedes_event_bridge_blob_sha")
              if not sp and not ss:
                  ordered.append(row); continue
              if not sp or not ss:
                  continue
              pred=by_path.get(sp)
              if pred is not None:
                  if pred["blob"]!=ss:
                      continue
              else:
                  pp=pathlib.Path(sp)
                  if not pp.exists() or bsha(pp)!=ss:
                      continue
              ordered.append(row)
          superseded={
              row["obj"].get("supersedes_event_bridge_path")
              for row in ordered
              if row["obj"].get("supersedes_event_bridge_path")
              and row["obj"].get("supersedes_event_bridge_blob_sha")
          }
          active=[row for row in ordered if row["path"] not in superseded]
          if len(active)!=1:
              print("ready=false")
              print("binding_matches="+str(len(valid)))
              print("active_heads="+str(len(active)))
          else:
              print("ready=true"); print("path="+active[0]["path"]); print("asof="+r["asof_et"])
          PY
          cat /tmp/event_out >> "$GITHUB_OUTPUT"
          cat /tmp/event_out

      - name: Annotate source-blocked no-op with exact ASOF (never label SUCCESS as GO)
        if: steps.event_rebind.outputs.ready == 'false' || (steps.event.outputs.ready != 'true' && steps.event.outputs.upstream_epoch_drift == 'true')
        shell: bash
        run: |
          set -euo pipefail
          echo "XRAY_FINAL_UPSTREAM_EPOCH=WAITING_NOOP event_rebind_reason=${{ steps.event_rebind.outputs.pending_reason }}"
          echo "::warning title=XRAY SOURCE-BLOCKED FINAL::Workflow completed safely, but current upstream MC/HISTORY/Event lineage did not qualify for terminal generation. SUCCESS here is not research GO, R92, or notification delivery."
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path("nasdaq-xray")
          def rd(name):
              try: return json.loads((root/name).read_text())
              except (OSError,ValueError,TypeError): return {}
          master=rd("canonical_current_master_manifest.json")
          history=rd("canonical_current_history.json")
          terminal=rd("canonical_current_terminal.json")
          values={
              "status":"BLOCKED_UPSTREAM_NO_NEW_TERMINAL",
              "master_asof":master.get("asof_et") or "UNKNOWN",
              "history_asof":history.get("asof_et") or "UNKNOWN",
              "terminal_asof":terminal.get("asof_et") or "UNKNOWN",
              "terminal_status":terminal.get("status") or "UNKNOWN",
              "current_exact_source_chain_pass":False,
              "new_r92_created":False,
              "phone_delivery_attested":False,
              "execution":"NONE","real_money":"NO-GO",
          }
          rows=["## XRAY Final Factory — source-blocked safe no-op",
                "This run **did not generate a new authoritative terminal**. A green Actions check is not research GO, an AL signal, or device delivery.",
                "| Proof field | Observed |","|---|---|"]
          rows += ["| "+k+" | "+str(v)+" |" for k,v in values.items()]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as fp:
              fp.write("\n".join(rows)+"\n")
          print("XRAY_FINAL_RELEASE_ATTESTATION=BLOCKED_UPSTREAM_NO_NEW_TERMINAL_NO_R92")
          print("XRAY_FINAL_EPOCH_DIAGNOSTIC="+json.dumps(values,sort_keys=True))
          PY

      - name: Fail closed when exact event binding is unavailable
        if: steps.event_rebind.outputs.ready != 'false' && steps.event.outputs.ready != 'true' && steps.event.outputs.upstream_epoch_drift != 'true'
        shell: bash
        run: |
          echo "XRAY_FINAL_EVENT_BINDING=FAIL_CLOSED" >&2
          exit 1

      - name: Compile
        run: |
          python -m py_compile \
            nasdaq-xray/build_current_event_state.py \
            nasdaq-xray/build_event_provenance_rebind.py \
            nasdaq-xray/alpha_semantics.py \
            nasdaq-xray/test_alpha_semantics.py \
            nasdaq-xray/test_deep_repair_regressions.py \
            nasdaq-xray/family_c_engine.py \
            nasdaq-xray/deep_pre_r1_shadow.py \
            nasdaq-xray/build_candidate_legal_guard.py \
            nasdaq-xray/final_tech_shadow.py \
            nasdaq-xray/final_risk_rr_independent_audit.py \
            nasdaq-xray/build_current_terminal.py \
            nasdaq-xray/official_source_guard.py \
            nasdaq-xray/resilience_runtime.py \
            nasdaq-xray/build_final_gate_overlay_v2.py

      - name: Install zero-dollar runtime
        if: steps.event.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt

      - name: Verify deterministic alpha semantics
        if: steps.event.outputs.ready == 'true'
        run: |
          python nasdaq-xray/test_alpha_semantics.py
          python nasdaq-xray/test_deep_repair_regressions.py

      - name: Verify signal-only brokerless boundary without network
        if: steps.event.outputs.ready == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/xray-canonical-current-final.yml")
          s=p.read_text()
          assert "secrets.LONGBRIDGE" not in s
          assert "XRAY_ACCOUNT_LIVE_PROBE_STATE" not in s
          assert "requirements-account-mcp-probe.txt" not in s
          for phrase in ("Run same-run read-only "+"ACCOUNT probe",
                         "Persist restricted MCP v2 "+"vault before account reads",
                         "Synchronize reconciled "+"ACCOUNT control-plane"):
              assert phrase not in s
          print("XRAY_BROKERLESS_FINAL=PASS_ZERO_ACCOUNT_IO")
          PY
      # No Longbridge account bootstrap, token, credential vault or
      # balance/position probing on the user's brokerless signal radar.
      - name: Validate exact committed deep history cache
        if: steps.event.outputs.ready == 'true'
        env:
          XRAY_DEEP_HISTORY_CACHE_DIR: ${{ github.workspace }}/nasdaq-xray/canonical_benchmark_cache
          XRAY_DEEP_CACHE_REQUIRED: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,sys
          root=pathlib.Path("nasdaq-xray")
          d=json.load(open(root/"canonical_current_deep_geometry.json"))
          m=json.load(open(root/"canonical_deep_history_cache_manifest.json"))
          def bsha(path):
              b=path.read_bytes()
              return hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          assert m.get("schema")=="XRAY_CANONICAL_DEEP_HISTORY_CACHE_MANIFEST_V1",m
          assert m.get("execution")=="NONE" and m.get("real_money")=="NO-GO" and m.get("unknown_never_pass") is True,m
          assert m.get("alpha_authority") is False and m.get("no_threshold_change") is True and m.get("no_synthetic_bars") is True,m
          assert m.get("asof_et")==d.get("asof_et"),(m.get("asof_et"),d.get("asof_et"))
          assert m.get("source_deep_geometry_blob_sha")==bsha(root/"canonical_current_deep_geometry.json")
          expected=dict(d.get("history_fingerprint_by_symbol") or {})
          trigger=sorted(set(d.get("weekly_trigger_scope") or []))
          assert set(expected)==set(trigger)
          assert int(m.get("symbol_count",-1))==len(expected)
          assert set(m.get("symbols") or [])==set(expected)
          assert set(m.get("entries") or {})==set(expected)
          h=hashlib.sha256(("\n".join(sorted(expected))+"\n").encode()).hexdigest()
          assert m.get("symbol_hash")==h
          for sym,rec in sorted((m.get("entries") or {}).items()):
              p=pathlib.Path(rec["path"])
              assert p.exists(),("CACHE_FILE_MISSING",sym,rec["path"])
              assert rec.get("blob_sha")==bsha(p),("CACHE_BLOB_MISMATCH",sym)
              assert rec.get("fingerprint")==expected[sym],("CACHE_MANIFEST_FP_MISMATCH",sym)
          for sym,rec in sorted((m.get("support_entries") or {}).items()):
              p=pathlib.Path(rec["path"])
              assert p.exists(),("SUPPORT_CACHE_FILE_MISSING",sym,rec["path"])
              assert rec.get("blob_sha")==bsha(p),("SUPPORT_CACHE_BLOB_MISMATCH",sym)
          q=m.get("qqq") or {}
          qp=pathlib.Path(q.get("path") or "")
          assert qp.exists() and q.get("blob_sha")==bsha(qp)
          assert q.get("fingerprint")==d.get("qqq_history_fingerprint")

          sys.path.insert(0,str(root))
          import deep_pre_r1_shadow as dp
          from alpha_semantics import history_fingerprint
          verified=0
          for sym,exp in sorted(expected.items()):
              x,err=dp.load_history(sym,d["asof_et"])
              assert x is not None,(sym,err)
              assert history_fingerprint(x,d["asof_et"])==exp,sym
              verified+=1
          qdf,qerr=dp.load_history("QQQ",d["asof_et"])
          assert qdf is not None,qerr
          assert history_fingerprint(qdf,d["asof_et"])==d.get("qqq_history_fingerprint")
          print({"XRAY_FINAL_DEEP_HISTORY_CACHE":"PASS","asof":d["asof_et"],"verified":verified,"qqq":True})
          PY

      - name: Normalize event bridge
        if: steps.event.outputs.ready == 'true'
        env:
          XRAY_EVENT_BRIDGE: ${{ github.workspace }}/${{ steps.event.outputs.path }}
          XRAY_EVENT_REQUEST: ${{ github.workspace }}/nasdaq-xray/canonical_current_event_request.json
          XRAY_EVENT_STATE_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_event_state.json
        run: python nasdaq-xray/build_current_event_state.py

      - name: Run Family C
        if: steps.event.outputs.ready == 'true'
        env:
          XRAY_FAMILY_C_STAGE1: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1.json
          XRAY_FAMILY_C_EVENTS: ${{ github.workspace }}/nasdaq-xray/canonical_current_event_state.json
          XRAY_FAMILY_C_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_family_c.json
          XRAY_FAMILY_C_HISTORY_BINDING_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_deep_geometry.json
          XRAY_FAMILY_C_HISTORY_BINDING_REQUIRED: "1"
          XRAY_FAMILY_C_WORKERS: "8"
        run: python nasdaq-xray/family_c_engine.py

      - name: Run deep full
        if: steps.event.outputs.ready == 'true'
        env:
          XRAY_STAGE1_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1.json
          XRAY_REGIME_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_regime.json
          XRAY_EVENT_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_event_state.json
          XRAY_DEEP_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_deep_full.json
          XRAY_DEEP_HISTORY_BINDING_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_deep_geometry.json
          XRAY_DEEP_HISTORY_BINDING_REQUIRED: "1"
