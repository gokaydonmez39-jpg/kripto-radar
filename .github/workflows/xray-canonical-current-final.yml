name: XRAY Canonical Current Final Factory

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/canonical_event_bridge_*.json"
      - "nasdaq-xray/build_current_event_state.py"
      - "nasdaq-xray/family_c_engine.py"
      - "nasdaq-xray/deep_pre_r1_shadow.py"
      - "nasdaq-xray/final_tech_shadow.py"
      - "nasdaq-xray/build_current_terminal.py"
      - "nasdaq-xray/build_final_gate_overlay_v2.py"
      - "nasdaq-xray/strict_g9_runtime_state.json"
      - "nasdaq-xray/account_gate_contract.json"
      - "nasdaq-xray/account_provider_adapter_contract.json"
      - "nasdaq-xray/account_longbridge_openapi_probe.py"
      - "nasdaq-xray/account_longbridge_openapi_probe_selftest.py"
      - "nasdaq-xray/account_longbridge_mcp_probe.py"
      - "nasdaq-xray/account_longbridge_mcp_probe_selftest.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_probe.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_probe_selftest.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_vault.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_vault_selftest.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_refresh.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_refresh_selftest.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_bootstrap.py"
      - "nasdaq-xray/account_longbridge_mcp_v2_token.enc"
      - "nasdaq-xray/select_account_live_probe.py"
      - "nasdaq-xray/select_account_live_probe_selftest.py"
      - "nasdaq-xray/account_same_run_terminal_selftest.py"
      - "nasdaq-xray/requirements-account-probe.txt"
      - "nasdaq-xray/requirements-account-mcp-probe.txt"
      - "nasdaq-xray/chatgpt_compiled_policy_v3.json"
      - ".github/workflows/xray-canonical-current-final.yml"
  schedule:
    - cron: "58 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-canonical-current-final-c417
  cancel-in-progress: true

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Find exact-bound committed event bridge
        id: event
        shell: bash
        run: |
          python - <<'PY' > /tmp/event_out
          import glob,json,pathlib
          reqp=pathlib.Path("nasdaq-xray/canonical_current_event_request.json")
          if not reqp.exists():
              print("ready=false"); raise SystemExit
          r=json.load(open(reqp))
          if r.get("schema")!="XRAY_EVENT_EPOCH_REQUEST_V1" or r.get("status")!="READY":
              print("ready=false"); raise SystemExit
          valid=[]
          for fp in glob.glob("nasdaq-xray/canonical_event_bridge_*.json"):
              try:
                  e=json.load(open(fp))
                  ok=(
                    e.get("schema")=="XRAY_EVENT_EPOCH_RESULT_V1"
                    and e.get("status")=="COMMITTED"
                    and e.get("task_id")=="6a825366222081918997094d76e6ae46"
                    and e.get("execution")=="NONE" and e.get("real_money")=="NO-GO"
                    and e.get("asof_et")==r.get("asof_et")
                    and e.get("weekly_scope_hash")==r.get("weekly_scope_hash")
                    and e.get("geometry_scope_hash")==r.get("geometry_scope_hash")
                    and e.get("source_stage1_blob_sha")==r.get("source_stage1_blob_sha")
                    and e.get("source_regime_blob_sha")==r.get("source_regime_blob_sha")
                    and e.get("source_deep_geometry_blob_sha")==r.get("source_deep_geometry_blob_sha")
                    and e.get("compiled_policy_hash")==r.get("compiled_policy_hash")=="26a95745a50b65e85f6ece24b6501af0994764a84ddd886edb70d1fcd770849c"
                    and e.get("compiled_policy_version")==r.get("compiled_policy_version")=="C4.17"
                    and e.get("compiled_policy_blob_sha")==r.get("compiled_policy_blob_sha")=="10d7af14870dfac0dc4566595d95a06f3faa854d"
                  )
                  if ok: valid.append(fp)
              except Exception:
                  pass
          if len(valid)!=1:
              print("ready=false"); print("binding_matches="+str(len(valid)))
          else:
              print("ready=true"); print("path="+valid[0]); print("asof="+r["asof_et"])
          PY
          cat /tmp/event_out >> "$GITHUB_OUTPUT"
          cat /tmp/event_out

      - name: Compile
        run: |
          python -m py_compile \
            nasdaq-xray/build_current_event_state.py \
            nasdaq-xray/family_c_engine.py \
            nasdaq-xray/deep_pre_r1_shadow.py \
            nasdaq-xray/final_tech_shadow.py \
            nasdaq-xray/build_current_terminal.py \
            nasdaq-xray/build_final_gate_overlay_v2.py \
            nasdaq-xray/account_longbridge_mcp_v2_probe.py \
            nasdaq-xray/account_longbridge_mcp_v2_vault.py \
            nasdaq-xray/account_longbridge_mcp_v2_bootstrap.py \
            nasdaq-xray/account_longbridge_mcp_v2_refresh.py \
            nasdaq-xray/select_account_live_probe.py

      - name: Install zero-dollar runtime
        if: steps.event.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt
          python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-account-mcp-probe.txt

      - name: Verify read-only ACCOUNT probe guard before secrets
        if: steps.event.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python nasdaq-xray/account_longbridge_openapi_probe_selftest.py
          python nasdaq-xray/account_longbridge_mcp_v2_probe_selftest.py
          python nasdaq-xray/account_longbridge_mcp_v2_vault_selftest.py
          python nasdaq-xray/account_longbridge_mcp_v2_refresh_selftest.py
          python nasdaq-xray/select_account_live_probe_selftest.py
          python nasdaq-xray/account_same_run_terminal_selftest.py
          echo "XRAY_ACCOUNT_PRESECRET_GUARD=PASS commit=$GITHUB_SHA"

      - name: Prepare read-only ACCOUNT probe runtime
        if: steps.event.outputs.ready == 'true'
        env:
          XRAY_ACCOUNT_TOKEN_FERNET_KEY: ${{ secrets.XRAY_ACCOUNT_TOKEN_FERNET_KEY }}
          LONGBRIDGE_AGENT_AUTH_CODE: ${{ secrets.LONGBRIDGE_AGENT_AUTH_CODE }}
          LONGBRIDGE_MCP_V2_BEARER_TOKEN: ${{ secrets.LONGBRIDGE_MCP_V2_BEARER_TOKEN }}
          LONGBRIDGE_OAUTH_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_OAUTH_ACCESS_TOKEN }}
          LONGBRIDGE_OAUTH_CLIENT_ID: ${{ secrets.LONGBRIDGE_OAUTH_CLIENT_ID }}
          LONGBRIDGE_OAUTH_REFRESH_TOKEN: ${{ secrets.LONGBRIDGE_OAUTH_REFRESH_TOKEN }}
          LONGBRIDGE_OAUTH_CLIENT_SECRET: ${{ secrets.LONGBRIDGE_OAUTH_CLIENT_SECRET }}
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          XRAY_ALLOW_LEGACY_TRADE_CAPABLE_CREDENTIAL: ${{ secrets.XRAY_ALLOW_LEGACY_TRADE_CAPABLE_CREDENTIAL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "nasdaq-xray/account_longbridge_mcp_v2_token.enc" && ( -n "${XRAY_ACCOUNT_TOKEN_FERNET_KEY}" || -n "${LONGBRIDGE_AGENT_AUTH_CODE}" ) ]]; then
            echo "XRAY_ACCOUNT_V2_RUNTIME=READY_ENCRYPTED_VAULT_ACCOUNT_READ"
          elif [[ ! -f "nasdaq-xray/account_longbridge_mcp_v2_token.enc" && -n "${LONGBRIDGE_AGENT_AUTH_CODE}" ]]; then
            echo "XRAY_ACCOUNT_V2_RUNTIME=READY_ONE_TIME_ACCOUNT_READ_BOOTSTRAP"
          elif [[ -n "${XRAY_ACCOUNT_TOKEN_FERNET_KEY}" ]]; then
            echo "XRAY_ACCOUNT_V2_RUNTIME=BLOCKED_VAULT_FILE_MISSING"
          elif [[ -n "${LONGBRIDGE_MCP_V2_BEARER_TOKEN}" ]]; then
            echo "XRAY_ACCOUNT_V2_RUNTIME=READY_RESTRICTED_MCP_ACCOUNT_READ"
          else
            echo "XRAY_ACCOUNT_V2_RUNTIME=NO_SECRET_NETWORK_FREE"
          fi
          if [[ -n "${LONGBRIDGE_OAUTH_ACCESS_TOKEN}" ]]; then
            echo "XRAY_ACCOUNT_DIRECT_RUNTIME=READY_OAUTH_ACCOUNT_BEARER"
          elif [[ -n "${LONGBRIDGE_OAUTH_CLIENT_ID}" && -n "${LONGBRIDGE_OAUTH_REFRESH_TOKEN}" ]]; then
            echo "XRAY_ACCOUNT_DIRECT_RUNTIME=READY_OAUTH_ACCOUNT_REFRESH"
          elif [[ -n "${LONGBRIDGE_OAUTH_CLIENT_ID}" || -n "${LONGBRIDGE_OAUTH_REFRESH_TOKEN}" || -n "${LONGBRIDGE_OAUTH_CLIENT_SECRET}" ]]; then
            echo "XRAY_ACCOUNT_DIRECT_RUNTIME=BLOCKED_INCOMPLETE_OAUTH_SECRET_SET"
          elif [[ -n "${LONGBRIDGE_APP_KEY}" && -n "${LONGBRIDGE_APP_SECRET}" && -n "${LONGBRIDGE_ACCESS_TOKEN}" && "${XRAY_ALLOW_LEGACY_TRADE_CAPABLE_CREDENTIAL}" == "I_UNDERSTAND_LEGACY_TOKEN_CAN_TRADE" ]]; then
            python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-account-probe.txt
            echo "XRAY_ACCOUNT_DIRECT_RUNTIME=READY_EXPLICIT_HIGH_PRIVILEGE_LEGACY_OPT_IN"
          elif [[ -n "${LONGBRIDGE_APP_KEY}" || -n "${LONGBRIDGE_APP_SECRET}" || -n "${LONGBRIDGE_ACCESS_TOKEN}" ]]; then
            echo "XRAY_ACCOUNT_DIRECT_RUNTIME=BLOCKED_HIGH_PRIVILEGE_LEGACY_NOT_OPTED_IN"
          else
            echo "XRAY_ACCOUNT_DIRECT_RUNTIME=NO_SECRETS_NETWORK_FREE"
          fi

      - name: Persist restricted MCP v2 vault before account reads
        id: account_vault
        if: steps.event.outputs.ready == 'true'
        env:
          XRAY_ACCOUNT_TOKEN_FERNET_KEY: ${{ secrets.XRAY_ACCOUNT_TOKEN_FERNET_KEY }}
          LONGBRIDGE_AGENT_AUTH_CODE: ${{ secrets.LONGBRIDGE_AGENT_AUTH_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          vault="nasdaq-xray/account_longbridge_mcp_v2_token.enc"
          bootstrap_state="nasdaq-xray/account_longbridge_mcp_v2_bootstrap_state.json"

          if [[ ! -f "$vault" && -n "${LONGBRIDGE_AGENT_AUTH_CODE}" ]]; then
            python nasdaq-xray/account_longbridge_mcp_v2_bootstrap.py
          fi
          if [[ -f "$vault" && ( -n "${XRAY_ACCOUNT_TOKEN_FERNET_KEY}" || -n "${LONGBRIDGE_AGENT_AUTH_CODE}" ) ]]; then
            python nasdaq-xray/account_longbridge_mcp_v2_refresh.py
          fi

          if git diff --quiet -- "$vault" "$bootstrap_state" && [[ -z "$(git status --porcelain -- "$vault" "$bootstrap_state")" ]]; then
            echo "restart_required=false" >> "$GITHUB_OUTPUT"
            echo "XRAY_ACCOUNT_VAULT_PERSIST=NO_CHANGE"
            exit 0
          fi

          git config user.name "xray-account-vault-bot"
          git config user.email "xray-account-vault-bot@users.noreply.github.com"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for p in "$vault" "$bootstrap_state"; do
            if [[ -f "$p" ]]; then
              mkdir -p "$tmpdir/$(dirname "$p")"
              cp "$p" "$tmpdir/$p"
            fi
          done

          persisted=false
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git reset --hard origin/main
            for p in "$vault" "$bootstrap_state"; do
              if [[ -f "$tmpdir/$p" ]]; then
                mkdir -p "$(dirname "$p")"
                cp "$tmpdir/$p" "$p"
              fi
            done
            git add "$vault" "$bootstrap_state" 2>/dev/null || true
            if git diff --cached --quiet; then
              persisted=true
              break
            fi
            git commit -m "chore(xray): persist restricted MCP v2 token vault"
            if git push origin HEAD:main; then
              persisted=true
              break
            fi
            echo "XRAY_ACCOUNT_VAULT_PUSH_RACE attempt=$attempt"
            sleep $((attempt*2))
          done
          if [[ "$persisted" != "true" ]]; then
            echo "XRAY_ACCOUNT_VAULT_PERSIST=FAIL" >&2
            exit 1
          fi
          echo "restart_required=true" >> "$GITHUB_OUTPUT"
          echo "XRAY_ACCOUNT_VAULT_PERSIST=PASS_RESTART_REQUIRED"

      - name: Run same-run read-only ACCOUNT probe
        if: steps.event.outputs.ready == 'true' && steps.account_vault.outputs.restart_required != 'true'
        env:
          XRAY_ACCOUNT_TOKEN_FERNET_KEY: ${{ secrets.XRAY_ACCOUNT_TOKEN_FERNET_KEY }}
          LONGBRIDGE_AGENT_AUTH_CODE: ${{ secrets.LONGBRIDGE_AGENT_AUTH_CODE }}
          LONGBRIDGE_MCP_V2_BEARER_TOKEN: ${{ secrets.LONGBRIDGE_MCP_V2_BEARER_TOKEN }}
          LONGBRIDGE_OAUTH_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_OAUTH_ACCESS_TOKEN }}
          LONGBRIDGE_OAUTH_CLIENT_ID: ${{ secrets.LONGBRIDGE_OAUTH_CLIENT_ID }}
          LONGBRIDGE_OAUTH_REFRESH_TOKEN: ${{ secrets.LONGBRIDGE_OAUTH_REFRESH_TOKEN }}
          LONGBRIDGE_OAUTH_CLIENT_SECRET: ${{ secrets.LONGBRIDGE_OAUTH_CLIENT_SECRET }}
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          XRAY_ALLOW_LEGACY_TRADE_CAPABLE_CREDENTIAL: ${{ secrets.XRAY_ALLOW_LEGACY_TRADE_CAPABLE_CREDENTIAL }}
        shell: bash
        run: |
          set -euo pipefail
          python nasdaq-xray/account_longbridge_mcp_v2_probe.py
          v2_status="$(python -c 'import json; print(json.load(open("nasdaq-xray/account_longbridge_mcp_v2_probe_state.json")).get("status",""))')"
          if [[ "$v2_status" == "PASS" ]]; then
            cp nasdaq-xray/account_longbridge_mcp_v2_probe_state.json nasdaq-xray/account_effective_probe_state.json
            echo "XRAY_ACCOUNT_SELECTOR=V2_PASS_DIRECT_NOT_CALLED"
          else
            python nasdaq-xray/account_longbridge_openapi_probe.py
            python nasdaq-xray/select_account_live_probe.py
          fi

      - name: Normalize event bridge
        if: steps.event.outputs.ready == 'true' && steps.account_vault.outputs.restart_required != 'true'
        env:
          XRAY_EVENT_BRIDGE: ${{ github.workspace }}/${{ steps.event.outputs.path }}
          XRAY_EVENT_REQUEST: ${{ github.workspace }}/nasdaq-xray/canonical_current_event_request.json
          XRAY_EVENT_STATE_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_event_state.json
        run: python nasdaq-xray/build_current_event_state.py

      - name: Run Family C
        if: steps.event.outputs.ready == 'true' && steps.account_vault.outputs.restart_required != 'true'
        env:
          XRAY_FAMILY_C_STAGE1: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1.json
          XRAY_FAMILY_C_EVENTS: ${{ github.workspace }}/nasdaq-xray/canonical_current_event_state.json
          XRAY_FAMILY_C_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_family_c.json
          XRAY_FAMILY_C_WORKERS: "8"
        run: python nasdaq-xray/family_c_engine.py

      - name: Run deep full
        if: steps.event.outputs.ready == 'true' && steps.account_vault.outputs.restart_required != 'true'
        env:
          XRAY_STAGE1_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1.json
          XRAY_REGIME_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_regime.json
          XRAY_EVENT_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_event_state.json
          XRAY_DEEP_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_deep_full.json
          XRAY_DEEP_WORKERS: "8"
        run: python nasdaq-xray/deep_pre_r1_shadow.py

      - name: Run final tech
        if: steps.event.outputs.ready == 'true' && steps.account_vault.outputs.restart_required != 'true'
        env:
          XRAY_FINAL_DEEP_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_deep_full.json
          XRAY_FINAL_FAMILY_C_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_family_c.json
          XRAY_FINAL_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_final_tech.json
          XRAY_FINAL_WORKERS: "6"
        run: python nasdaq-xray/final_tech_shadow.py

      - name: Build dynamic terminal
        if: steps.event.outputs.ready == 'true' && steps.account_vault.outputs.restart_required != 'true'
        env:
          XRAY_TERMINAL_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_terminal.json
          XRAY_ACCOUNT_LIVE_PROBE_STATE: ${{ github.workspace }}/nasdaq-xray/account_effective_probe_state.json
        run: python nasdaq-xray/build_current_terminal.py

      - name: Structural terminal gate
        if: steps.event.outputs.ready == 'true' && steps.account_vault.outputs.restart_required != 'true'
        run: |
          python - <<'PY'
          import hashlib,json,os
          def blob(path):
              b=open(path,"rb").read()
              return hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          e=json.load(open("nasdaq-xray/canonical_current_event_state.json"))
          c=json.load(open("nasdaq-xray/canonical_current_family_c.json"))
          d=json.load(open("nasdaq-xray/canonical_current_deep_full.json"))
          f=json.load(open("nasdaq-xray/canonical_current_final_tech.json"))
          t=json.load(open("nasdaq-xray/canonical_current_terminal.json"))
          a=t["asof_et"]
          assert e["asof_et"]==c["asof_et"]==d["asof_et"]==f["asof_et"]==a
          assert d["event_state_fresh"] is True
          assert d["unknown_history_count"]==0,d["unknown_history"]
          assert set(e["event_status_by_symbol"])==set(d["results"])
          assert t["execution"]=="NONE" and t["real_money"]=="NO-GO"
          assert t.get("final_gate_reporting_zero_alpha") is True
          g9=json.load(open("nasdaq-xray/strict_g9_runtime_state.json"))
          ag=json.load(open("nasdaq-xray/account_gate_contract.json"))
          assert g9["execution"]=="NONE" and g9["real_money"]=="NO-GO"
          assert ag["execution"]=="NONE" and ag["real_money"]=="NO-GO" and ag["provider"]=="PROVIDER_NEUTRAL"
          assert t["g9_global_status"]==("G9_PASS" if g9.get("g9_pass") is True else "G9_BLOCKED_FREE_AUTOMATION_PATH")
          lp=json.load(open("nasdaq-xray/account_effective_probe_state.json"))
          allowed={
            "XRAY_ACCOUNT_LONGBRIDGE_OPENAPI_PROBE_V1":"LONGBRIDGE_DIRECT_OPENAPI",
            "XRAY_ACCOUNT_LONGBRIDGE_MCP_V2_PROBE_V1":"LONGBRIDGE_HOSTED_MCP_V2",
          }
          live_pass=(
            lp.get("schema") in allowed
            and lp.get("provider")==allowed[lp.get("schema")]
            and lp.get("status")=="PASS"
            and lp.get("network_attempted") is True
            and lp.get("balance_parseable") is True
            and lp.get("positions_parseable") is True
            and str(lp.get("workflow_run_id") or "")==str(os.environ.get("GITHUB_RUN_ID") or "")
          )
          if live_pass:
              assert t["account_status"]=="ACCOUNT_PASS"
              le=t["evidence"]["account_live_probe"]
              assert le["same_run_attested"] is True
              assert le["workflow_run_id"]==str(os.environ["GITHUB_RUN_ID"])
              assert le["private_values_persisted"] is False and le["secret_values_persisted"] is False
          else:
              assert t["account_status"]==ag["current_status"]
          assert t["evidence"]["g9_runtime"]["blob_sha"]==blob("nasdaq-xray/strict_g9_runtime_state.json")
          assert t["evidence"]["account_gate"]["blob_sha"]==blob("nasdaq-xray/account_gate_contract.json")
          assert t["evidence"]["account_gate"]["adapter_contract_blob_sha"]==blob("nasdaq-xray/account_provider_adapter_contract.json")
          assert t["compiled_policy_hash"]=="26a95745a50b65e85f6ece24b6501af0994764a84ddd886edb70d1fcd770849c"
          assert e.get("compiled_policy_hash")==t["compiled_policy_hash"]
          assert e.get("compiled_policy_version")=="C4.17"
          assert t["terminal_result"] in {"NO_CONFIRMED_SETUP","PRE_G9_SETUP_EXISTS","PARTIAL_UNKNOWN"}
          if t["full_end_to_end_research_pass"]:
              assert all(v==0 for v in t["blockers"].values()),t["blockers"]
              assert t["status"]=="FULL_E2E_RESEARCH_PASS"
          else:
              assert t["status"]=="PARTIAL"
          print({"asof":a,"terminal_status":t["status"],"terminal_result":t["terminal_result"],"pre_g9":t["counts"]["pre_g9_tech_pass"],"blockers":t["blockers"]})
          PY

      - name: Build coherent V2 final-gate overlay
        if: steps.event.outputs.ready == 'true' && steps.account_vault.outputs.restart_required != 'true'
        run: |
          python nasdaq-xray/build_final_gate_overlay_v2.py
          python - <<'PY'
          import hashlib,json
          def blob(path):
              b=open(path,"rb").read()
              return hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          o=json.load(open("nasdaq-xray/canonical_current_final_gate_overlay.json"))
          t=json.load(open("nasdaq-xray/canonical_current_terminal.json"))
          assert o["schema"]=="XRAY_FINAL_GATE_OVERLAY_V2"
          assert o["execution"]=="NONE" and o["real_money"]=="NO-GO"
          assert o["source_terminal"]["blob_sha"]==blob("nasdaq-xray/canonical_current_terminal.json")
          assert o["source_terminal"]["blob_sha"]==blob("nasdaq-xray/canonical_current_terminal.json")
          assert o["asof_et"]==t["asof_et"]
          assert o["binding_integrity"]["fail_closed_safe"] is True
          assert o["true_full_go"]["status"] in {"PASS","BLOCKED"}
          if o["strict_g9"]["g9_pass"]:
              assert o["strict_g9"]["negative_cache_binding_exact"] is True
          if o["account"]["account_pass"]:
              assert o["account"]["adapter_binding_exact"] is True
          print({"overlay":o["schema"],"asof":o["asof_et"],"true_full_go":o["true_full_go"]["status"]})
          PY

      - name: Commit current final artifacts
        if: steps.event.outputs.ready == 'true' && steps.account_vault.outputs.restart_required != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git fetch origin main
          latest="$(git rev-parse origin/main)"
