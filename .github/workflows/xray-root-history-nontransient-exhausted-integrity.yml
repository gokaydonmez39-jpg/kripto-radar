name: XRAY Root Nontransient Exhaustion Integrity (No Market Data)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/root_history_recovery_microaudit.py"
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/tests/test_sina_legacy_rescue_classifier.py"
      - "nasdaq-xray/tests/test_sina_static_reason_pipeline.py"
      - "nasdaq-xray/history_unknown_source_triage.py"
      - "nasdaq-xray/tests/test_sina_stage_parser_retry.py"
      - "nasdaq-xray/sina_transport_rescue.py"
      - "nasdaq-xray/sina_state_hash_guard.py"
      - "nasdaq-xray/alpaca_personal_price_current_exact30.py"
      - "nasdaq-xray/tests/test_alpaca_price_429_cliff_report.py"
      - ".github/workflows/xray-root-history-nontransient-exhausted-integrity.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/root_history_recovery_microaudit.py"
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/tests/test_sina_legacy_rescue_classifier.py"
      - "nasdaq-xray/tests/test_sina_static_reason_pipeline.py"
      - "nasdaq-xray/history_unknown_source_triage.py"
      - "nasdaq-xray/tests/test_sina_stage_parser_retry.py"
      - "nasdaq-xray/sina_transport_rescue.py"
      - "nasdaq-xray/sina_state_hash_guard.py"
      - "nasdaq-xray/alpaca_personal_price_current_exact30.py"
      - "nasdaq-xray/tests/test_alpaca_price_429_cliff_report.py"
      - ".github/workflows/xray-root-history-nontransient-exhausted-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-root-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      XRAY_ALPACA_DATA_KEY_ID: ""
      XRAY_ALPACA_DATA_SECRET_KEY: ""
      XRAY_MASSIVE_API_KEY: ""
      XRAY_TWELVE_DATA_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compile and bind exact commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/root_history_recovery_microaudit.py nasdaq-xray/sina_transport_rescue.py nasdaq-xray/sina_state_hash_guard.py
      - name: Root HISTORY positive, nontransient and malformed negative
        run: |
          set -euo pipefail
          python nasdaq-xray/root_history_recovery_microaudit.py --selftest
          python -O nasdaq-xray/root_history_recovery_microaudit.py --selftest
          python nasdaq-xray/sina_transport_rescue.py
          python - <<'PY'
          import datetime as dt,hashlib,sys
          sys.path.insert(0,"nasdaq-xray")
          from root_history_recovery_microaudit import audit
          from sina_state_hash_guard import seal
          from sina_transport_rescue import choose
          rows={
             "AAA":{"status":"UNKNOWN_RETRY_EXHAUSTED","info":"ValueError:permanent schema mismatch",
                    "attempts":4,"updated_at_utc":"2026-10-14T20:00:00+00:00",
                    "transport_rescue_round":0},
             "BBB":{"status":"UNKNOWN_RETRY_EXHAUSTED","info":"TimeoutError:temporary",
                    "attempts":4,"updated_at_utc":"2026-10-14T20:00:00+00:00",
                    "transport_rescue_round":0},
          }
          queue=sorted(rows)
          state={
              "schema":"XRAY_NASDAQ_SCREENER_SINA_V2",
              "execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
              "asof_et":"2026-10-14","status":"HISTORY_PARTIAL",
              "queue":queue,"queue_total":2,"cursor":2,"results":rows,
              "queue_hash":hashlib.sha256("\n".join(queue).encode()).hexdigest(),
              "counts":{"UNKNOWN_RETRY_EXHAUSTED":2},
              "unknown_count":2,"pending_retry":0}
          seal(state)
          root={"schema":"XRAY_ORCHESTRATOR_V1","asof_et":"2026-10-14",
                "execution":"NONE","real_money":"NO-GO","status":"PARTIAL_HISTORY",
                "unknown_count":2,"pending_retry":0,"history_retryable":False}
          now=dt.datetime(2026,10,15,21,0,tzinfo=dt.timezone.utc)
          measured=audit(state,root,now)
          if (measured["known_status_counts"]!={"UNKNOWN_RETRY_EXHAUSTED":2}
              or measured["source_transport_exception_unknown_count"]!=1
              or measured["source_other_exception_unknown_count"]!=1
              or measured["eligible_single_round_real_provider_retries_now"]!=1
              or measured["unknown_count"]!=2
              or measured["source_unknown_total_still_blocks_go"]!=2
              or measured["independent_history_or_asof_proof_required_count"]!=1
              or measured["registered_r92_attested"] is not False
              or measured["source_proof_full_history_attested"] is not False
              or measured["execution"]!="NONE" or measured["real_money"]!="NO-GO"):
              raise RuntimeError("ROOT_HISTORY_DID_NOT_PRESERVE_BLOCKING_UNKNOWN")
          if choose(state,now)!=["BBB"]:
              raise RuntimeError("NONTRANSIENT_WAS_WRONGLY_ALLOWED_TO_RESCUE")
          print("XRAY_ROOT_HISTORY_NONTRANSIENT_EXHAUSTED=PASS_EXACT_2_UNKNOWNS_ONLY_TRANSIENT_RESCUABLE_NO_ALPHA")
          PY
      - name: Actual Sina parse_hist exception retry regressions (no akshare or HTTP)
        run: |
          set -euo pipefail
          python -m unittest discover -s nasdaq-xray/tests -p test_sina_stage_parser_retry.py -v
          python -O -m unittest discover -s nasdaq-xray/tests -p test_sina_stage_parser_retry.py -v
      - name: Legacy Sina rescue root-cause classification negatives (no market IO)
        run: |
          set -euo pipefail
          python -m unittest discover -s nasdaq-xray/tests -p test_sina_legacy_rescue_classifier.py -v
          python -O -m unittest discover -s nasdaq-xray/tests -p test_sina_legacy_rescue_classifier.py -v
      - name: Sina producer-to-root static UNKNOWN reasons exact contract
        run: |
          set -euo pipefail
          python -m unittest discover -s nasdaq-xray/tests -p test_sina_static_reason_pipeline.py -v
          python -O -m unittest discover -s nasdaq-xray/tests -p test_sina_static_reason_pipeline.py -v
      - name: Offline Alpaca PRICE quota-cliff report negative regression
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
          python -m unittest discover -s nasdaq-xray/tests -p test_alpaca_price_429_cliff_report.py -v
          python -O -m unittest discover -s nasdaq-xray/tests -p test_alpaca_price_429_cliff_report.py -v
      - name: Official ETRA issuer history source and cached unknown regression (offline)
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/official_first_trade_260_history_guard.py nasdaq-xray/sina_stage.py
          python nasdaq-xray/official_first_trade_260_history_guard.py --selftest
          python -O nasdaq-xray/official_first_trade_260_history_guard.py --selftest
          python - <<'PY'
          import json,sys
          sys.path.insert(0,"nasdaq-xray")
          from official_first_trade_260_history_guard import (
              rebind_etra_research_results, rebind_confirmed_ipo_research_results)
          source=json.load(open("nasdaq-xray/sina_state.json"))
          asof=source["asof_et"]
          assert asof>="2026-10-19"
          etra_status=source["results"]["ETRA"]["status"]
          assert etra_status in {"UNKNOWN_STATIC","FAIL_HISTORY"}
          rows={"ETRA":dict(source["results"]["ETRA"])}
          changed=rebind_etra_research_results(rows,asof)
          assert changed==(1 if etra_status=="UNKNOWN_STATIC" else 0)
          assert rows["ETRA"]["status"]=="FAIL_HISTORY"
          assert rows["ETRA"]["info"]["completed_listed_sessions"]<260
          assert rows["ETRA"]["info"]["source_evidence_blob_sha"]
          assert rebind_etra_research_results(rows,asof)==0
          print("XRAY_ETRA_CURRENT_CACHE_FAIL_ONLY=PASS_IDEMPOTENT_ZERO_VENDOR_ZERO_AL")
          symbols=("ACCV","ADRX")
          before={s:source["results"][s]["status"] for s in symbols}
          assert all(v in {"UNKNOWN_STATIC","FAIL_HISTORY"} for v in before.values())
          cohort={s:dict(source["results"][s]) for s in symbols}
          converted=rebind_confirmed_ipo_research_results(cohort,asof)
          assert converted==sum(v=="UNKNOWN_STATIC" for v in before.values())
          assert rebind_confirmed_ipo_research_results(cohort,asof)==0
          assert all(cohort[s]["status"]=="FAIL_HISTORY" for s in symbols)
          assert all(cohort[s]["info"]["bars"]<260 for s in symbols)
          assert all(cohort[s]["info"]["source_evidence_blob_sha"] for s in symbols)
          print("XRAY_ACCV_ADRX_REAL_ROOT_CACHE=PASS_TWO_FAIL_ONLY_NO_PROVIDER_NO_R92")
          from official_first_trade_260_history_guard import rebind_chwm_ads_cached_history
          chwm_prior=source["results"]["CHWM"]["status"]
          assert chwm_prior in {"UNKNOWN_STATIC","FAIL_HISTORY"}
          chwm={"CHWM":dict(source["results"]["CHWM"])}
          expect=1 if chwm_prior=="UNKNOWN_STATIC" else 0
          assert rebind_chwm_ads_cached_history(chwm,asof)==expect
          assert rebind_chwm_ads_cached_history(chwm,asof)==0
          assert chwm["CHWM"]["status"]=="FAIL_HISTORY"
          assert chwm["CHWM"]["info"]["bars"]<260
          assert chwm["CHWM"]["info"]["source_evidence_blob_sha"]
          info=chwm["CHWM"]["info"]
          # A same-ASOF official first-trade hard FAIL takes precedence over
          # older ASX non-inheritance metadata; both keep CHWM non-eligible.
          assert (info.get("asx_ordinary_history_not_inherited") is True or
                  (info.get("reason")=="OFFICIAL_FIRST_TRADE_LT260_HARD_HISTORY_FAIL"
                   and info.get("completed_listed_sessions",260)<260
                   and info.get("first_traded_nasdaq_date") is not None))
          print("XRAY_CHWM_SEC_REAL_CACHED_ROOT=PASS_FAIL_ONLY_ZERO_AL")
          PY
      - name: Never mistake offline-only evidence for a live source
        run: |
          set -euo pipefail
          test -z "$XRAY_ALPACA_DATA_KEY_ID"
          test -z "$XRAY_MASSIVE_API_KEY"
          echo XRAY_ROOT_HISTORY_OFFLINE_PASS_NOT_CANONICAL_NOT_AL_R92_NO_ORDER
