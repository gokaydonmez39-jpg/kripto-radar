name: XRAY SEC META GOOGL Official Dual-Class Filing Acceptance Witness
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_sec_dualclass_pit_shadow.py"
      - "nasdaq-xray/research/p0_sec_meta_googl_multiclass_cover_20261012_v1.json"
      - ".github/workflows/xray-p0-sec-dualclass-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dualclass-asof-sec-time:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Exact source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: SEC calendar and adversarial clock security
        run: |
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python -m py_compile nasdaq-xray/p0_sec_dualclass_pit_shadow.py
          python nasdaq-xray/p0_sec_dualclass_pit_shadow.py --selftest
          python -O nasdaq-xray/p0_sec_dualclass_pit_shadow.py --selftest
      - name: SEC official 10Q filings accession acceptance (2 issuers only)
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT || vars.XRAY_SEC_USER_AGENT }}
        run: |
          python nasdaq-xray/p0_sec_dualclass_pit_shadow.py \
            --out "$RUNNER_TEMP/xray_sec_dualclass_pit_shadow.json"
      - name: Enforce source integrity and explicit MC NO PRIMARY
        run: |
          python - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_sec_dualclass_pit_shadow.json").read_text())
          assert d["schema"]=="XRAY_SEC_DUAL_CLASS_OFFICIAL_ACCESSION_PIT_WITNESS_V1" or d["schema"]=="XRAY_SEC_DUAL_CLASS_OFFICIAL_ACCESSION_PIT_WITNESS_V1"
          assert d["observations"]==2
          assert set(d["outcomes"])=={"GOOGL","META"}
          assert sum(d["counts"].values())==2
          assert d["source_registry_git_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/research/p0_sec_meta_googl_multiclass_cover_20261012_v1.json"],text=True).strip()
          assert d["c417_primary_mc_created"]==0
          assert d["current_class_shares_asof_verified"] is False
          assert d["independent_market_cap_comparator_verified"] is False
          assert d["can_register_R92"] is False and d["GO"] is False
          assert d["raw_SEC_documents_and_shares_persisted"] is False
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          print("XRAY_SEC_DUALCLASS_ACCESSION_TESTED_ZERO_PRIMARY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-p0-meta-googl-official-sec-pit-acceptance-shadow
          path: ${{ runner.temp }}/xray_sec_dualclass_pit_shadow.json
          retention-days: 14
          if-no-files-found: error
