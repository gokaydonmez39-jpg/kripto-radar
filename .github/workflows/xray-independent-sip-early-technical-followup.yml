name: XRAY Independent SIP Early Technical Research WATCH (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/personal_full_cohort_early_technical_watch.py"
      - ".github/workflows/xray-independent-sip-early-technical-followup.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/personal_full_cohort_early_technical_watch.py"
      - ".github/workflows/xray-independent-sip-early-technical-followup.yml"
  workflow_run:
    workflows: ["XRAY Personal Full-Universe SIP EOD Coverage (Research Only)"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: xray-independent-sip-early-technical-${{ github.event.workflow_run.id || github.sha }}
  cancel-in-progress: false

jobs:
  offline-technical-contract:
    name: Test independent WATCH source-gate and no synthetic AL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research dependencies for actual pre-existing engine
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt
      - name: Prove exact-source and no-false-WATCH negative tests
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/personal_full_cohort_early_technical_watch.py
          python nasdaq-xray/personal_full_cohort_early_technical_watch.py --selftest
          python -O nasdaq-xray/personal_full_cohort_early_technical_watch.py --selftest
      - name: Offline verify full-cohort follow-up only fires on successful current main source
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          d=yaml.load(Path(".github/workflows/xray-independent-sip-early-technical-followup.yml").read_text(),Loader=yaml.BaseLoader)
          assert d["on"]["workflow_run"]["workflows"]==[
             "XRAY Personal Full-Universe SIP EOD Coverage (Research Only)"]
          assert d["on"]["workflow_run"]["types"]==["completed"]
          assert d["on"]["workflow_run"]["branches"]==["main"]
          job=d["jobs"]["source-bound-technical-watch"]
          c=job["if"]
          for phrase in ("github.event_name == 'workflow_run'",
                         "github.event.workflow_run.conclusion == 'success'",
                         "github.event.workflow_run.head_branch == 'main'",
                         "github.event.workflow_run.head_repository.full_name == github.repository"):
              assert phrase in c
          assert d["permissions"]=={"actions":"read","contents":"read"}
          steps="\n".join(str(x) for x in job["steps"])
          assert "github.event.workflow_run.head_sha" in steps
          assert "github.event.workflow_run.id" in steps
          assert "actions/download-artifact@v4" in steps
          assert "XRAY_RESEARCH_UPSTREAM_RUN_ID" in steps
          assert "python nasdaq-xray/personal_full_cohort_early_technical_watch.py" in steps
          assert "registered_r92_count" in steps and "user_notification_sent" in steps
          assert "technical_research_watch_symbols" in steps
          print("XRAY_SIP_TECH_FOLLOWUP_TRIGGER=PASS_SAME_RUN_READ_ONLY_NO_R92_NO_FORGED_WATCH")
          PY

  source-bound-technical-watch:
    name: Technical candidate research from exact prior Alpaca source receipts
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned personal research runtime
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt
      - name: Download only parent run's exact SHA-bound causal artifact
        uses: actions/download-artifact@v4
        with:
          name: xray-personal-six-gate-causal-worklist-no-ohlcv
          path: ${{ runner.temp }}/causal
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read exact source and verify no technician can forge AL
        run: |
          set -euo pipefail
          python nasdaq-xray/personal_full_cohort_early_technical_watch.py --selftest
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ["RUNNER_TEMP"])/"causal/xray_six_gate_causal_breaker.json"
          d=json.loads(f.read_text())
          assert d["schema"]=="XRAY_PERSONAL_SIX_GATE_CAUSAL_BREAKER_V1"
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          assert d["registered_r92_count"]==0
          assert not d["c417_price_dv30_primary_attested"]
          assert not d["issuer_class_mc_current_attested"]
          assert not d["technical_a_b_d_r1_event_regime_attested"]
          assert d["no_vendor_ohlcv_persisted"] and d["no_canonical_mutations"]
          print("XRAY_EARLY_TECH_SOURCE_PREFLIGHT=PASS_SHADOW_ONLY_NO_AL")
          PY
      - name: Research only - rerun actual technical families on exact independent cohort
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
          XRAY_RESEARCH_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python nasdaq-xray/personal_full_cohort_early_technical_watch.py \
            --causal "$RUNNER_TEMP/causal/xray_six_gate_causal_breaker.json" \
            --out "$RUNNER_TEMP/xray_independent_early_technical_watch.json"
      - name: Confirm only verified research WATCH observations, never AL or device delivery
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_independent_early_technical_watch.json"
          d=json.loads(p.read_text())
          assert d["schema"]=="XRAY_PERSONAL_FULL_COHORT_EARLY_TECH_WATCH_V1"
          assert d["source_workflow_run_id"]==int(os.environ["GITHUB_EVENT_PATH"] and json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())["workflow_run"]["id"])
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          assert d["registered_r92_count"]==0 and d["orders"]==[] and d["buy_signals"]==[]
          assert not d["user_notification_sent"] and not d["platform_notification_sent"]
          assert not d["source_independent_primary_history_attested"]
          assert not d["source_independent_primary_dv30_attested"]
          assert not d["source_independent_primary_mc_attested"]
          assert not d["source_event_and_regime_release_attested"]
          assert d["no_vendor_ohlcv_or_price_levels_persisted"]
          assert d["all_symbols_classified"]
          assert sum(d["classification_counts"].values())==d["scope_count"]
          assert len(d["technical_research_watch_symbols"])==len(d["technical_setup_family_verified"])
          assert set(d["technical_research_watch_symbols"])==set(d["technical_setup_family_verified"])
          assert d["full_identity_source_partition_checked"]
          assert d["scope_count"]+d["outside_technical_cohort_count"]==d["source_causal_scope_count"]
          print("XRAY_INDEPENDENT_EARLY_TECH_WATCH="+json.dumps({
             "asof":d["asof_et"],"research_cohort":d["scope_count"],
             "verified_watch_count":len(d["technical_research_watch_symbols"]),
             "benchmark":d["benchmark_status"],"AL":0,"notification_sent":False
          },sort_keys=True))
          PY
      - name: Archive research candidate labels only without source OHLCV or price levels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-independent-sip-early-tech-watch-no-ohlcv
          path: ${{ runner.temp }}/xray_independent_early_technical_watch.json
          if-no-files-found: warn
          retention-days: 14
