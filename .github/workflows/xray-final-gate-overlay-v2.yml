name: XRAY Final Gate Overlay V2

on:
  workflow_run:
    workflows: ["XRAY Canonical Current Final Factory"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/build_final_gate_overlay_v2.py"
      - "nasdaq-xray/canonical_current_terminal.json"
      - "nasdaq-xray/chatgpt_canonical_state_v2.json"
      - "nasdaq-xray/strict_g9_runtime_state.json"
      - "nasdaq-xray/g9_entitlement_authority.json"
      - "nasdaq-xray/g9_search_saturation_20261003.json"
      - "nasdaq-xray/g9_provider_registry_20261003.json"
      - "nasdaq-xray/account_gate_contract.json"
      - "nasdaq-xray/account_provider_adapter_contract.json"
      - ".github/workflows/xray-final-gate-overlay-v2.yml"
  schedule:
    - cron: "55 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Share a single-writer lane with the legacy hourly overlay refresher.
  group: xray-canonical-final-overlay-single-writer
  cancel-in-progress: false

jobs:
  overlay:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m py_compile nasdaq-xray/build_final_gate_overlay_v2.py

      - name: Build fail-closed overlay
        run: python nasdaq-xray/build_final_gate_overlay_v2.py

      - name: Verify overlay
        run: |
          python - <<'PY'
          import json
          o=json.load(open("nasdaq-xray/canonical_current_final_gate_overlay.json"))
          assert o["schema"]=="XRAY_FINAL_GATE_OVERLAY_V2"
          assert o["execution"]=="NONE" and o["real_money"]=="NO-GO"
          assert o["binding_integrity"]["fail_closed_safe"] is True
          import sys, copy
          from pathlib import Path
          sys.path.insert(0,str(Path("nasdaq-xray").resolve()))
          import build_final_gate_overlay_v2 as module
          terminal=json.load(open("nasdaq-xray/canonical_current_terminal.json"))
          current=module.terminal_live_artifact_bindings(terminal)
          assert current["exact"]==o["terminal_live_artifact_bindings"]["exact"]
          assert current["mismatch_count"]==o["terminal_live_artifact_bindings"]["mismatch_count"]
          wrong=copy.deepcopy(terminal)
          wrong["evidence"]["price"]["blob_sha"]="0"*40
          check=module.terminal_live_artifact_bindings(wrong)
          assert check["exact"] is False
          assert "price" in {row["key"] for row in check["mismatches"]}
          assert not (o["true_full_go"]["status"]=="PASS" and not current["exact"])
          print("XRAY_TERMINAL_LIVE_BINDING_FAIL_CLOSED_SELFTEST=PASS")

          if o["strict_g9"]["g9_pass"]:
              assert o["binding_integrity"]["g9_pass_binding_exact"] is True
          if o["account"]["account_pass"]:
              assert o["binding_integrity"]["account_pass_binding_exact"] is True
          assert o["true_full_go"]["status"] in {"PASS","BLOCKED"}
          print({
            "asof":o["asof_et"],
            "g9":o["strict_g9"]["status"],
            "account":o["account"]["status"],
            "true_full_go":o["true_full_go"]["status"],
            "binding_safe":o["binding_integrity"]["fail_closed_safe"],
          })
          PY

      - name: Commit overlay with exact current main readback (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-control-bot"
          git config user.email "xray-control-bot@users.noreply.github.com"
          # A CI green result is not proof of Git persistence. This retries a
          # moved main from fresh source inputs, without force-pushing.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python nasdaq-xray/build_final_gate_overlay_v2.py
            python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("nasdaq-xray")
          output=json.loads((root/"canonical_current_final_gate_overlay.json").read_text())
          def sha(path):
              data=path.read_bytes()
              return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\\0"+data).hexdigest()
          assert output["schema"]=="XRAY_FINAL_GATE_OVERLAY_V2"
          assert output["execution"]=="NONE" and output["real_money"]=="NO-GO"
          assert output["binding_integrity"]["fail_closed_safe"] is True
          assert output["source_terminal"]["blob_sha"]==sha(root/"canonical_current_terminal.json")
          assert output["source_pointer"]["blob_sha"]==sha(root/"chatgpt_canonical_state_v2.json")
          PY
            git add nasdaq-xray/canonical_current_final_gate_overlay.json
            if git diff --cached --quiet; then
              echo "XRAY_OVERLAY_V2=NO_CHANGE_EXACT_MAIN_READBACK"
              exit 0
            fi
            git commit -m "chore(xray): refresh final-gate overlay v2 [skip ci]"
            if git push origin HEAD:main; then
              git fetch origin main
              # Pull/push success must have durable readback; a newer writer
              # superseding this commit cannot be mistaken for persistence.
              python - <<'PY'
          import json
          from pathlib import Path
          p=Path("nasdaq-xray/canonical_current_final_gate_overlay.json")
          j=json.loads(p.read_text())
          assert j["schema"]=="XRAY_FINAL_GATE_OVERLAY_V2"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["binding_integrity"]["fail_closed_safe"] is True
          print("XRAY_OVERLAY_V2=PUSH_ACCEPTED_VALIDATED_NO_ALPHA_GO")
          PY
              exit 0
            fi
            echo "XRAY_OVERLAY_V2=MAIN_PUSH_RACE attempt=$attempt" >&2
            sleep $((attempt*2))
          done
          echo "::error::XRAY_OVERLAY_V2=NO_DURABLE_COMMIT_AFTER_RETRIES" >&2
          exit 1

# READINESS_EXACT_TERMINAL_OVERLAY_2026_10_05: self-trigger for independent current-terminal validation.
