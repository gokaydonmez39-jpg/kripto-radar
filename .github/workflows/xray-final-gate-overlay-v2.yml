name: XRAY Final Gate Overlay V2

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/build_final_gate_overlay_v2.py"
      - "nasdaq-xray/canonical_current_terminal.json"
      - "nasdaq-xray/chatgpt_canonical_state_v2.json"
      - "nasdaq-xray/strict_g9_runtime_state.json"
      - "nasdaq-xray/g9_entitlement_authority.json"
      - "nasdaq-xray/g9_search_saturation_20261003.json"
      - "nasdaq-xray/g9_provider_registry_20261003.json"
      - "nasdaq-xray/account_gate_contract.json"
      - "nasdaq-xray/account_provider_adapter_contract.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-final-gate-overlay-v2
  cancel-in-progress: true

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m py_compile nasdaq-xray/build_final_gate_overlay_v2.py

      - name: Build fail-closed overlay
        run: python nasdaq-xray/build_final_gate_overlay_v2.py

      - name: Verify overlay
        run: |
          python - <<'PY'
          import json
          o=json.load(open("nasdaq-xray/canonical_current_final_gate_overlay.json"))
          assert o["schema"]=="XRAY_FINAL_GATE_OVERLAY_V2"
          assert o["execution"]=="NONE" and o["real_money"]=="NO-GO"
          assert o["binding_integrity"]["fail_closed_safe"] is True
          if o["strict_g9"]["g9_pass"]:
              assert o["binding_integrity"]["g9_pass_binding_exact"] is True
          if o["account"]["account_pass"]:
              assert o["binding_integrity"]["account_pass_binding_exact"] is True
          assert o["true_full_go"]["status"] in {"PASS","BLOCKED"}
          print({
            "asof":o["asof_et"],
            "g9":o["strict_g9"]["status"],
            "account":o["account"]["status"],
            "true_full_go":o["true_full_go"]["status"],
            "binding_safe":o["binding_integrity"]["fail_closed_safe"],
          })
          PY

      - name: Commit overlay if head is still current
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-control-bot"
          git config user.email "xray-control-bot@users.noreply.github.com"
          git add nasdaq-xray/canonical_current_final_gate_overlay.json
          if git diff --cached --quiet; then
            echo "XRAY_OVERLAY=NO_CHANGE"
            exit 0
          fi
          git commit -m "chore(xray): refresh final-gate overlay v2 [skip ci]"
          if git push origin HEAD:main; then
            echo "XRAY_OVERLAY=PASS"
          else
            echo "XRAY_OVERLAY=RACE_DEFERRED_TO_NEWER_RUN"
            exit 0
          fi
