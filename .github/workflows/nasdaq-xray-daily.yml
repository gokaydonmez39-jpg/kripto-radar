name: NASDAQ SWING XRAY Autonomous Data Plane
# single-writer recovery trigger

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/orchestrator_run.py"
      - "nasdaq-xray/github_native_stage_relay.py"
      - "nasdaq-xray/orchestrator_partial_invalidation_selftest.py"
      - "nasdaq-xray/scheduler_kick_dataplane.json"
      - "nasdaq-xray/scheduler_failover_contract.json"
      - "nasdaq-xray/scheduler_failover_selftest.py"
      - "nasdaq-xray/root_weekend_quota_guard.py"
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/sina_identity_epoch.py"
      - "nasdaq-xray/sina_late_asof_recheck.py"
      - "nasdaq-xray/mc_zero_key.py"
      - "nasdaq-xray/mc_resolution_overlay.json"
      - "nasdaq-xray/history_resolution_overlay.json"
      - "nasdaq-xray/production_core_build.py"
      - "nasdaq-xray/alpha_semantics.py"
      - "nasdaq-xray/test_alpha_semantics.py"
      - "nasdaq-xray/history_official_identity_evidence.json"
      - "nasdaq-xray/requirements-runtime.txt"
      - "nasdaq-xray/stage1_shadow.py"
      - "nasdaq-xray/regime_breadth_shadow.py"
      - "nasdaq-xray/deep_pre_r1_shadow.py"
      - ".github/workflows/nasdaq-xray-daily.yml"
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nasdaq-xray-autonomous-dataplane
  # Full-universe scans are long-running and resumable. New repair/schedule
  # triggers queue behind the active writer instead of repeatedly discarding it.
  cancel-in-progress: false

jobs:
  dataplane:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XRAY_SINA_HISTORY_BATCH: "250"
      XRAY_SINA_HISTORY_WORKERS: "8"
      XRAY_SINA_RETRY_BATCH: "20"
      XRAY_STAGE1_WORKERS: "8"
      XRAY_BREADTH_WORKERS: "8"
      XRAY_DEEP_WORKERS: "8"
      XRAY_FINAL_WORKERS: "6"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scheduler failover self-test
        run: python nasdaq-xray/scheduler_failover_selftest.py

      - name: U.S. ET weekend provider quota guard regression
        run: python nasdaq-xray/root_weekend_quota_guard.py --selftest

      - name: Root-to-preMC relay negative and positive self-tests
        run: |
          python -m py_compile nasdaq-xray/github_native_stage_relay.py
          python nasdaq-xray/github_native_stage_relay.py --selftest

      - name: Partial-history stale-state self-test
        run: python nasdaq-xray/orchestrator_partial_invalidation_selftest.py

      - name: Static compile gate
        run: python -m py_compile nasdaq-xray/orchestrator_run.py nasdaq-xray/orchestrator_partial_invalidation_selftest.py nasdaq-xray/sina_stage.py nasdaq-xray/sina_identity_epoch.py nasdaq-xray/sina_late_asof_recheck.py nasdaq-xray/mc_zero_key.py nasdaq-xray/production_core_build.py nasdaq-xray/alpha_semantics.py nasdaq-xray/test_alpha_semantics.py nasdaq-xray/stage1_shadow.py nasdaq-xray/regime_breadth_shadow.py nasdaq-xray/deep_pre_r1_shadow.py

      - name: Determine U.S. ET weekend unattended-market quota gate
        id: session
        run: python nasdaq-xray/root_weekend_quota_guard.py --emit

      - name: Install zero-dollar research runtime
        if: steps.session.outputs.allow_compute == 'true'
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt

      - name: Verify deterministic alpha semantics
        if: steps.session.outputs.allow_compute == 'true'
        run: python nasdaq-xray/test_alpha_semantics.py

      - name: Run autonomous XRAY data plane
        if: steps.session.outputs.allow_compute == 'true'
        run: python nasdaq-xray/orchestrator_run.py

      - name: Commit durable XRAY checkpoints
        if: steps.session.outputs.allow_compute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"

          files=(
            nasdaq-xray/sina_state.json
            nasdaq-xray/sina_candidates.json
            nasdaq-xray/mc_zero_key_state.json
            nasdaq-xray/production_core_state.json
            nasdaq-xray/stage1_shadow.json
            nasdaq-xray/regime_breadth_shadow.json
            nasdaq-xray/deep_pre_r1_shadow.json
            nasdaq-xray/orchestrator_state.json
          )

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for p in "${files[@]}"; do
            if [ -f "$p" ]; then
              mkdir -p "$tmpdir/$(dirname "$p")"
              cp "$p" "$tmpdir/$p"
            fi
          done

          pushed=0
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git reset --hard origin/main

            for p in "${files[@]}"; do
              if [ -f "$tmpdir/$p" ]; then
                mkdir -p "$(dirname "$p")"
                cp "$tmpdir/$p" "$p"
              fi
            done

            git add "${files[@]}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "XRAY_DURABLE_COMMIT=NO_CHANGE"
              exit 0
            fi

            git commit -m "chore(xray): autonomous data-plane checkpoint [skip ci]"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "XRAY_DURABLE_PUSH_RACE attempt=$attempt"
            sleep $((attempt * 2))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "XRAY_DURABLE_COMMIT=FAIL" >&2
            exit 1
          fi
          echo "XRAY_DURABLE_COMMIT=PASS"

      - name: Atomically wake pre-MC after root checkpoint, never claim terminal success
        if: success() && steps.session.outputs.allow_compute == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python nasdaq-xray/github_native_stage_relay.py --out /tmp/xray_stage_relay.json

      - name: Upload audit state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-xray-autonomous-state
          path: |
            nasdaq-xray/sina_state.json
            nasdaq-xray/sina_candidates.json
            nasdaq-xray/mc_zero_key_state.json
            nasdaq-xray/production_core_state.json
            nasdaq-xray/stage1_shadow.json
            nasdaq-xray/regime_breadth_shadow.json
            nasdaq-xray/deep_pre_r1_shadow.json
            nasdaq-xray/orchestrator_state.json
            /tmp/xray_stage_relay.json
          retention-days: 30
          if-no-files-found: ignore
