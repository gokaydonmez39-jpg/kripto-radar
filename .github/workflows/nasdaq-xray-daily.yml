name: NASDAQ SWING XRAY Hard Gates

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/eastmoney_stage.py"
      - "nasdaq-xray/trigger.txt"
      - ".github/workflows/nasdaq-xray-daily.yml"
  schedule:
    - cron: "45 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasdaq-xray-repo-writer
  cancel-in-progress: true

jobs:
  hard-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XRAY_EM_HISTORY_BATCH: "30"
      XRAY_EM_HISTORY_WORKERS: "2"
      XRAY_EM_RETRY_BATCH: "10"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exchange calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars

      - name: Resume official-universe PRICE DV20 HISTORY hard gates
        run: python nasdaq-xray/eastmoney_stage.py

      - name: Commit durable hard-gate cursor
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/eastmoney_state.json nasdaq-xray/market_candidates.json
          if git diff --cached --quiet; then
            echo "No hard-gate state change."
          else
            git commit -m "chore(xray): hard-gate cursor checkpoint [skip ci]"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=1
                break
              fi
              sleep $((attempt * 2))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "XRAY_STATE_PUSH_FAILED" >&2
              exit 1
            fi
          fi

      - name: Upload hard-gate state
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-xray-hard-gate-state
          path: |
            nasdaq-xray/eastmoney_state.json
            nasdaq-xray/market_candidates.json
          retention-days: 30
