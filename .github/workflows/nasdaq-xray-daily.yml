name: NASDAQ SWING XRAY Daily Bulk

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/daily_bulk.py"
      - ".github/workflows/nasdaq-xray-daily.yml"
  schedule:
    - cron: "25 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasdaq-xray-daily-bulk
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run zero-key daily hard-gate engine
        run: python nasdaq-xray/daily_bulk.py

      - name: Commit durable daily state
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/daily_state.json
          if git diff --cached --quiet; then
            echo "No daily state change."
          else
            git commit -m "chore(xray): daily hard-gate checkpoint [skip ci]"
            git push
          fi

      - name: Upload daily state artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-xray-daily-state
          path: nasdaq-xray/daily_state.json
          retention-days: 30
