name: NASDAQ SWING XRAY Autonomous Data Plane
# single-writer recovery trigger

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/orchestrator_run.py"
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/mc_zero_key.py"
      - "nasdaq-xray/mc_resolution_overlay.json"
      - "nasdaq-xray/history_resolution_overlay.json"
      - "nasdaq-xray/production_core_build.py"
      - "nasdaq-xray/stage1_shadow.py"
      - "nasdaq-xray/regime_breadth_shadow.py"
      - "nasdaq-xray/deep_pre_r1_shadow.py"
      - "nasdaq-xray/final_tech_shadow.py"
      - ".github/workflows/nasdaq-xray-daily.yml"
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasdaq-xray-autonomous-dataplane
  cancel-in-progress: true

jobs:
  dataplane:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XRAY_SINA_HISTORY_BATCH: "250"
      XRAY_SINA_HISTORY_WORKERS: "8"
      XRAY_SINA_RETRY_BATCH: "20"
      XRAY_STAGE1_WORKERS: "8"
      XRAY_BREADTH_WORKERS: "8"
      XRAY_DEEP_WORKERS: "8"
      XRAY_FINAL_WORKERS: "6"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static compile gate
        run: python -m py_compile nasdaq-xray/orchestrator_run.py nasdaq-xray/sina_stage.py nasdaq-xray/mc_zero_key.py nasdaq-xray/production_core_build.py nasdaq-xray/stage1_shadow.py nasdaq-xray/regime_breadth_shadow.py nasdaq-xray/deep_pre_r1_shadow.py nasdaq-xray/final_tech_shadow.py

      - name: Install zero-dollar research runtime
        run: python -m pip install --disable-pip-version-check akshare==1.18.95 pandas_market_calendars

      - name: Run autonomous XRAY data plane
        run: python nasdaq-xray/orchestrator_run.py

      - name: Commit durable XRAY checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"

          files=(
            nasdaq-xray/sina_state.json
            nasdaq-xray/sina_candidates.json
            nasdaq-xray/mc_zero_key_state.json
            nasdaq-xray/production_core_state.json
            nasdaq-xray/stage1_shadow.json
            nasdaq-xray/regime_breadth_shadow.json
            nasdaq-xray/deep_pre_r1_shadow.json
            nasdaq-xray/final_tech_shadow.json
            nasdaq-xray/orchestrator_state.json
          )

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for p in "${files[@]}"; do
            if [ -f "$p" ]; then
              mkdir -p "$tmpdir/$(dirname "$p")"
              cp "$p" "$tmpdir/$p"
            fi
          done

          pushed=0
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git reset --hard origin/main

            for p in "${files[@]}"; do
              if [ -f "$tmpdir/$p" ]; then
                mkdir -p "$(dirname "$p")"
                cp "$tmpdir/$p" "$p"
              fi
            done

            git add "${files[@]}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "XRAY_DURABLE_COMMIT=NO_CHANGE"
              exit 0
            fi

            git commit -m "chore(xray): autonomous data-plane checkpoint [skip ci]"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "XRAY_DURABLE_PUSH_RACE attempt=$attempt"
            sleep $((attempt * 2))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "XRAY_DURABLE_COMMIT=FAIL" >&2
            exit 1
          fi
          echo "XRAY_DURABLE_COMMIT=PASS"

      - name: Upload audit state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-xray-autonomous-state
          path: |
            nasdaq-xray/sina_state.json
            nasdaq-xray/mc_zero_key_state.json
            nasdaq-xray/production_core_state.json
            nasdaq-xray/stage1_shadow.json
            nasdaq-xray/regime_breadth_shadow.json
            nasdaq-xray/deep_pre_r1_shadow.json
            nasdaq-xray/final_tech_shadow.json
            nasdaq-xray/orchestrator_state.json
          retention-days: 30
          if-no-files-found: ignore
