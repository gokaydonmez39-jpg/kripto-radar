name: XRAY Event Official Primary Promote
on:
  workflow_run:
    workflows: ["XRAY Canonical Current Post-MC Factory"]
    types: [completed]
  push:
    paths:
      - ".github/workflows/xray-event-official-primary-promote.yml"
      - "nasdaq-xray/event_fail_closed_base_builder.py"
      - "nasdaq-xray/event_official_primary_probe.py"
      - "nasdaq-xray/event_official_primary_successor_builder.py"
      - "nasdaq-xray/event_official_primary_successor_selftest.py"
      - "nasdaq-xray/event_ir_seed_registry.json"
      - "nasdaq-xray/canonical_current_event_request.json"
      - "nasdaq-xray/canonical_current_event_state.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xray-event-official-primary-promote
  cancel-in-progress: false
jobs:
  promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap exact-ASOF Event base, probe, and build immutable successor
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            nasdaq-xray/event_fail_closed_base_builder.py \
            nasdaq-xray/build_current_event_state.py \
            nasdaq-xray/event_official_primary_probe.py \
            nasdaq-xray/event_official_primary_successor_builder.py
          python nasdaq-xray/event_fail_closed_base_builder.py --selftest
          python nasdaq-xray/event_official_primary_probe.py --selftest
          python nasdaq-xray/event_official_primary_successor_selftest.py

          base_result="$(python nasdaq-xray/event_fail_closed_base_builder.py)"
          echo "$base_result"
          base_status="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' <<<"$base_result")"
          base_path=""
          if [[ "$base_status" == "BASE_CANDIDATE_WRITTEN_LOCAL_ONLY" ]]; then
            base_path="$(python -c 'import json,sys; print(json.load(sys.stdin)["path"])' <<<"$base_result")"
            cp "$base_path" "$RUNNER_TEMP/event-base.json"
            printf '%s\n' "$base_path" > "$RUNNER_TEMP/event-base-path"
          elif [[ "$base_status" != "EXACT_CURRENT_EVENT_BRIDGE_EXISTS" ]]; then
            echo "XRAY_EVENT_PROMOTE=BASE_$base_status"
            exit 0
          fi

          # Bind canonical_current_event_state to the exact current-ASOF base
          # before probing; successor exact-binding requires request+state ASOF equality.
          python nasdaq-xray/build_current_event_state.py
          python nasdaq-xray/event_official_primary_probe.py

          result="$(python nasdaq-xray/event_official_primary_successor_builder.py)"
          echo "$result"
          status="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' <<<"$result")"
          if [[ "$status" != "SUCCESSOR_CANDIDATE_WRITTEN_LOCAL_ONLY" ]]; then
            echo "XRAY_EVENT_PROMOTE=$status"
            exit 0
          fi
          path="$(python -c 'import json,sys; print(json.load(sys.stdin)["path"])' <<<"$result")"
          cp "$path" "$RUNNER_TEMP/event-successor.json"
          printf '%s\n' "$path" > "$RUNNER_TEMP/event-successor-path"

          git config user.name "xray-event-bot"
          git config user.email "xray-event-bot@users.noreply.github.com"
          base_head="$(git rev-parse HEAD)"
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if [[ "$latest" != "$base_head" ]]; then
            changed="$(git diff --name-only "$base_head" "$latest" -- \
              nasdaq-xray/canonical_current_event_request.json \
              nasdaq-xray/canonical_current_event_state.json \
              'nasdaq-xray/canonical_event_bridge_20261007_c417*.json' \
              nasdaq-xray/event_fail_closed_base_builder.py \
              nasdaq-xray/event_official_primary_probe.py \
              nasdaq-xray/event_official_primary_successor_builder.py \
              nasdaq-xray/event_ir_seed_registry.json || true)"
            if [[ -n "$changed" ]]; then
              echo "XRAY_EVENT_PROMOTE=STALE_SOURCE_ABORT"
              printf '%s\n' "$changed"
              exit 0
            fi
          fi

          path="$(cat "$RUNNER_TEMP/event-successor-path")"
          git reset --hard origin/main

          check_immutable() {
            local target="$1"
            local generated="$2"
            if git ls-files --error-unmatch "$target" >/dev/null 2>&1; then
              current="$(git hash-object "$target")"
              expected="$(git hash-object "$generated")"
              [[ "$current" == "$expected" ]] && return 0
              echo "XRAY_EVENT_PROMOTE=IMMUTABLE_PATH_CONFLICT path=$target" >&2
              exit 1
            fi
            rm -f "$target"
            cp "$generated" "$target"
          }

          if [[ -s "$RUNNER_TEMP/event-base-path" ]]; then
            base_path="$(cat "$RUNNER_TEMP/event-base-path")"
            check_immutable "$base_path" "$RUNNER_TEMP/event-base.json"
            git add "$base_path"
          fi
          check_immutable "$path" "$RUNNER_TEMP/event-successor.json"
          git add "$path"

          if git diff --cached --quiet; then
            echo "XRAY_EVENT_PROMOTE=ALREADY_COMMITTED"
            exit 0
          fi
          git commit -m "feat(xray): promote exact-ASOF issuer-primary Event chain"
          git push origin HEAD:main
          echo "XRAY_EVENT_PROMOTE=PASS path=$path"
