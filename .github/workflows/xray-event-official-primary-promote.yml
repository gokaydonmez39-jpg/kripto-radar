name: XRAY Event Official Primary Promote
on:
  workflow_run:
    workflows: ["XRAY Canonical Current Post-MC Factory"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-event-official-primary-promote.yml"
      - "nasdaq-xray/event_fail_closed_base_builder.py"
      - "nasdaq-xray/build_current_event_state.py"
      - "nasdaq-xray/event_official_primary_probe.py"
      - "nasdaq-xray/event_official_primary_successor_builder.py"
      - "nasdaq-xray/event_official_primary_successor_selftest.py"
      - "nasdaq-xray/event_ir_seed_registry.json"
      - "nasdaq-xray/canonical_current_event_request.json"
      - "nasdaq-xray/canonical_current_event_state.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xray-event-official-primary-promote
  cancel-in-progress: false
jobs:
  promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap, probe, exact-bind, and publish current Event authority
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            nasdaq-xray/event_fail_closed_base_builder.py \
            nasdaq-xray/build_current_event_state.py \
            nasdaq-xray/event_official_primary_probe.py \
            nasdaq-xray/event_official_primary_successor_builder.py \
            nasdaq-xray/event_official_primary_successor_selftest.py
          python nasdaq-xray/event_fail_closed_base_builder.py --selftest
          python nasdaq-xray/event_official_primary_probe.py --selftest
          python nasdaq-xray/event_official_primary_successor_selftest.py

          base_result="$(python nasdaq-xray/event_fail_closed_base_builder.py)"
          echo "$base_result"
          base_status="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' <<<"$base_result")"
          base_path="$(python -c 'import json,sys; print(json.load(sys.stdin).get("path",""))' <<<"$base_result")"
          case "$base_status" in
            BASE_CANDIDATE_WRITTEN_LOCAL_ONLY|EXACT_CURRENT_EVENT_BRIDGE_EXISTS) ;;
            *) echo "XRAY_EVENT_PROMOTE_BASE_INVALID=$base_status" >&2; exit 1 ;;
          esac
          [[ -n "$base_path" && -f "$base_path" ]]
          base_tmp=""
          if [[ "$base_status" == "BASE_CANDIDATE_WRITTEN_LOCAL_ONLY" ]]; then
            base_tmp="$RUNNER_TEMP/event-base.json"
            cp "$base_path" "$base_tmp"
          fi

          XRAY_EVENT_BRIDGE="$base_path" python nasdaq-xray/build_current_event_state.py
          python nasdaq-xray/event_official_primary_probe.py
          successor_result="$(python nasdaq-xray/event_official_primary_successor_builder.py)"
          echo "$successor_result"
          successor_status="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' <<<"$successor_result")"
          successor_path=""
          successor_tmp=""
          case "$successor_status" in
            SUCCESSOR_CANDIDATE_WRITTEN_LOCAL_ONLY)
              successor_path="$(python -c 'import json,sys; print(json.load(sys.stdin).get("path",""))' <<<"$successor_result")"
              [[ -n "$successor_path" && -f "$successor_path" ]]
              successor_tmp="$RUNNER_TEMP/event-successor.json"
              cp "$successor_path" "$successor_tmp"
              final_bridge="$successor_path"
              ;;
            NOOP_NO_PROMOTABLE_UNKNOWN)
              final_bridge="$base_path"
              ;;
            *)
              echo "XRAY_EVENT_PROMOTE_SUCCESSOR_INVALID=$successor_status" >&2
              exit 1
              ;;
          esac

          XRAY_EVENT_BRIDGE="$final_bridge" python nasdaq-xray/build_current_event_state.py
          state_tmp="$RUNNER_TEMP/canonical_current_event_state.json"
          cp nasdaq-xray/canonical_current_event_state.json "$state_tmp"

          python - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path("nasdaq-xray")
          q=json.load(open(root/"canonical_current_event_request.json",encoding="utf-8"))
          s=json.load(open(root/"canonical_current_event_state.json",encoding="utf-8"))
          assert s["asof_et"]==q["asof_et"]
          assert s["weekly_scope_hash"]==q["weekly_scope_hash"]
          assert s["geometry_scope_hash"]==q["geometry_scope_hash"]
          assert s["unknown_never_pass"] is True
          assert s["source_request_blob_sha"]==subprocess.check_output(["git","hash-object",str(root/"canonical_current_event_request.json")],text=True).strip()
          print("XRAY_EVENT_PROMOTE_STATE_BINDING=PASS")
          PY

          git config user.name "xray-event-bot"
          git config user.email "xray-event-bot@users.noreply.github.com"
          baseline="$(git rev-parse HEAD)"

          restore_generated() {
            local path="$1" tmp="$2"
            [[ -n "$path" && -n "$tmp" ]] || return 0
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              current="$(git hash-object "$path")"
              generated="$(git hash-object "$tmp")"
              [[ "$current" == "$generated" ]] || { echo "XRAY_EVENT_PROMOTE=IMMUTABLE_PATH_CONFLICT path=$path" >&2; exit 1; }
            else
              rm -f "$path"
              mkdir -p "$(dirname "$path")"
              cp "$tmp" "$path"
            fi
          }

          for attempt in 1 2 3; do
            git fetch origin main --quiet
            latest="$(git rev-parse origin/main)"
            if [[ "$latest" != "$baseline" ]]; then
              changed="$(git diff --name-only "$baseline" "$latest" -- \
                nasdaq-xray/canonical_current_event_request.json \
                nasdaq-xray/canonical_current_event_state.json \
                'nasdaq-xray/canonical_event_bridge_*.json' \
                nasdaq-xray/event_fail_closed_base_builder.py \
                nasdaq-xray/build_current_event_state.py \
                nasdaq-xray/event_official_primary_probe.py \
                nasdaq-xray/event_official_primary_successor_builder.py \
                nasdaq-xray/event_ir_seed_registry.json \
                .github/workflows/xray-event-official-primary-promote.yml || true)"
              if [[ -n "$changed" ]]; then
                echo "XRAY_EVENT_PROMOTE=STALE_SOURCE_ABORT"
                printf '%s\n' "$changed"
                exit 0
              fi
            fi
            baseline="$latest"
            git reset --hard "$latest" >/dev/null
            restore_generated "$base_path" "$base_tmp"
            restore_generated "$successor_path" "$successor_tmp"
            cp "$state_tmp" nasdaq-xray/canonical_current_event_state.json

            files=(nasdaq-xray/canonical_current_event_state.json)
            [[ -n "$base_tmp" ]] && files+=("$base_path")
            [[ -n "$successor_tmp" ]] && files+=("$successor_path")
            git add "${files[@]}"
            if git diff --cached --quiet; then
              echo "XRAY_EVENT_PROMOTE=ALREADY_EXACT bridge=$final_bridge"
              exit 0
            fi
            git commit -m "feat(xray): publish exact current Event authority" >/dev/null
            if git push origin HEAD:main; then
              echo "XRAY_EVENT_PROMOTE=PASS bridge=$final_bridge"
              exit 0
            fi
            echo "XRAY_EVENT_PROMOTE=PUSH_RACE attempt=$attempt"
          done
          echo "XRAY_EVENT_PROMOTE=PUSH_RACE_EXHAUSTED" >&2
          exit 1
