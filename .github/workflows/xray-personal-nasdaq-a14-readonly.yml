name: XRAY Personal NASDAQ A14 Private Evidence Shadow (No Trades)
# A27 2026-10-28 after-close A14 scientific code-only diagnostic: expanded
# immutable, allowlisted error-code vocabulary, no private-data exposure.
# A26 2026-10-28 protected-main read-only diagnostic: emit ONLY allowlisted
# blocker stage and exception class, never private symbol, price or credentials.
# This comment-only workflow change triggers existing one-time protected push gate.
# A22: existing A21 job now also compares SHA-verified candidate issuance against
# exact AL outbox reservations, rejects missing prior-day alarms and missing
# closed-session terminal event; current-day unreserved AL stays PENDING until
# the existing hourly delivery task runs. One protected-main smoke; no new cron.
# A18 verification: historical issuance SHA fields may be separated by commas,
# periods or semicolons. Exact SHAs, uniqueness, original 477 scope and policy
# still gate every accepted observation; old SHA-free candidates remain excluded.
# This change triggers one already-gated push smoke; it adds no schedule or alerts.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xray-personal-nasdaq-a14-readonly.yml'
  pull_request:
    branches: [main]
    paths:
      - 'personal-swing/performance_lab/**'
      - 'personal-swing/raw_corporate_action_witness.py'
      - 'personal-swing/test_raw_corporate_action_witness.py'
      - '.github/workflows/xray-personal-nasdaq-a14-readonly.yml'
  workflow_run:
    workflows:
      - 'XRAY Personal 477 EOD Daily Health (Research Only)'
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-personal-nasdaq-private-research-shadow
  cancel-in-progress: false
jobs:
  configuration-readiness:
    # No secrets, network calls, private records or new cadence. This attests
    # the actual GitHub job context before any private researcher is allowed.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      XRAY_REF_PROTECTED: ${{ github.ref_protected }}
      XRAY_PRIVATE_FLAG: ${{ vars.XRAY_NASDAQ_RESEARCH_PRIVATE_ENABLED }}
    steps:
      - name: Check activation gates without reading secret or user data
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ "${XRAY_REF_PROTECTED}" == "true" && "${XRAY_PRIVATE_FLAG}" == "true" ]]; then
            echo 'XRAY_A15_SECURITY_GATE=READY_FOR_NEXT_SUCCESSFUL_EOD'
          else
            echo 'XRAY_A15_SECURITY_GATE=HOLD_BRANCH_PROTECTION_OR_REPOSITORY_FLAG'
          fi
          echo 'XRAY_A15_RESEARCH_SOURCE=GITHUB_EVENT_CONTEXT_NO_PRIVATE_API_NO_ORDERS'
  private-one-time-real-source-readback:
    # One protected-main smoke, triggered ONLY by changes to THIS workflow file.
    # Completely separate from existing EOD and notification automations.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      vars.XRAY_NASDAQ_RESEARCH_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: private-nasdaq-research
    permissions:
      contents: read
    env:
      XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
      XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
      XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
      XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing IEX/XNAS and Google read-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python -m pip install -r personal-swing/requirements.txt
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3' >/dev/null
          python -m pip check
      - name: Exact latest official completed XNAS readback; never historical signal replay
        working-directory: personal-swing
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python - <<'PY'
          import engine
          from performance_lab.private_performance_adapter import live_entrypoint
          raise SystemExit(live_entrypoint(asof_override=engine.trading_asof().isoformat()))
          PY
      - name: Explicit research-only evidence semantics
        run: echo 'XRAY_A16=PRIVATE_IEX_SHEETS_READ_ONLY_NO_PRIVATE_ARTIFACTS_NO_ORDERS_NO_DEVICE_DELIVERY'
  private-flight-recorder:
    # A21: user-surprise reliability control. Runs only alongside the EXISTING
    # one-time A14 workflow file push or already existing successful EOD event.
    # OAuth grants google Sheets READONLY; never sends or marks any alert ACK.
    if: >-
      github.ref_protected == true &&
      vars.XRAY_NASDAQ_RESEARCH_PRIVATE_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: private-nasdaq-research
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
      XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only offline math and Google Sheets read-only auth
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python -m pip install -r personal-swing/requirements.txt
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3' >/dev/null
          python -m pip check
      - name: Twice-read exact private episode and outbox; expose counts only
        working-directory: personal-swing
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python -m performance_lab.private_flight_recorder
      - name: Never promote prepared notification to delivered
        run: echo 'XRAY_A21=READ_ONLY_OUTBOX_NO_DEVICE_ACK_NO_SHEET_WRITE_NO_ORDERS'
  offline-scientific-guard:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline A11, A12 and A13 synthetic adversarial tests
        shell: bash
        working-directory: personal-swing/performance_lab
        run: |
          set -euo pipefail
          python -m pip install -r ../requirements.txt
          python -m pip check
          for file in test_nasdaq_performance_guard.py test_private_performance_adapter.py test_nasdaq_challenger_protocol.py test_private_flight_recorder.py; do
            python -m unittest discover -v -p "$file"
            python -O -m unittest discover -v -p "$file"
          done
          python -m unittest discover -v -s .. -p 'test_raw_corporate_action_witness.py'
          python -O -m unittest discover -v -s .. -p 'test_raw_corporate_action_witness.py'
          python -m py_compile nasdaq_performance_guard.py private_performance_adapter.py nasdaq_challenger_protocol.py private_flight_recorder.py ../raw_corporate_action_witness.py
  private-research-after-eod:
    # HARD GATES: origin is successful same-repo non-PR main EOD;
    # no private job at all until main branch protection and admin-enabled
    # private research permission are both demonstrated by GitHub.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.ref_protected == true &&
      vars.XRAY_NASDAQ_RESEARCH_PRIVATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: private-nasdaq-research
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
      XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
      XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
      XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The private reader must use the EXACT original EOD commit,
          # not a later main commit that might alter the scanner.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare private read-only Google OAuth and original Alpaca IEX calendar
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python -m pip install -r personal-swing/requirements.txt
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3' >/dev/null
          python -m pip check
      - name: Independent raw IEX split-like gap and historical issuance source witness
        working-directory: personal-swing
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python raw_corporate_action_witness.py
      - name: Validate completed EOD epoch then perform zero-write scientific audit
        working-directory: personal-swing
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python - <<'PY'
          import sys
          import daily_job
          eligible = daily_job.current_completed_session()
          if eligible is None:
              print('XRAY_A14=SKIPPED_NO_COMPLETED_CURRENT_XNAS_SESSION_NO_DATA_USED')
              sys.exit(0)
          from performance_lab.private_performance_adapter import live_entrypoint
          sys.exit(live_entrypoint())
          PY
      - name: No orders or devices delivered in this research workflow
        run: echo 'XRAY_A14=RESEARCH_ONLY_NO_SHEETS_WRITE_NO_ORDERS_NO_NOTIFICATION_DEVICE_ACK_NO_AL_RULE_CHANGE'
