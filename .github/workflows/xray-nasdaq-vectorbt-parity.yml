name: XRAY NASDAQ VectorBT 1.2.0 Offline Portfolio Parity (NO AL)
on:
  pull_request:
    paths:
      - 'research/test_nasdaq_vectorbt_parity.py'
      - '.github/workflows/xray-nasdaq-vectorbt-parity.yml'
  push:
    branches: [main]
    paths:
      - 'research/test_nasdaq_vectorbt_parity.py'
      - '.github/workflows/xray-nasdaq-vectorbt-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portfolio-accounting-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned community vectorbt (Apache-2.0 with Commons Clause)
        run: python -m pip install 'vectorbt==1.2.0'
      - name: Verify synthetic next-bar orders, fee math and zero-position boundary
        run: |
          python -m unittest discover -s research -p 'test_nasdaq_vectorbt_parity.py' -v
          python -O -m unittest discover -s research -p 'test_nasdaq_vectorbt_parity.py' -v
      - name: No data acquisition, broker, credentials or notification access
        run: echo 'NASDAQ_RESEARCH_ONLY; NO_AL; NO_BROKER; NO_SHEETS; NO_PUSH'
