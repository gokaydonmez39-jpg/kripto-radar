name: NASDAQ SWING XRAY Deep Pre-R1 Shadow

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/deep_pre_r1_shadow.py"
      - ".github/workflows/nasdaq-xray-deep.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasdaq-xray-deep
  cancel-in-progress: true

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XRAY_DEEP_WORKERS: "8"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check akshare==1.18.95 pandas
      - name: Run deep pre-R1 shadow
        run: python nasdaq-xray/deep_pre_r1_shadow.py
      - name: Commit deep state
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/deep_pre_r1_shadow.json
          git commit -m "chore(xray): deep pre-R1 shadow checkpoint [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
