name: XRAY Three Layer Synthetic Browser PR
on:
  pull_request:
    paths:
      - 'personal-swing/research_lab/three_layer_v1/**'
      - '.github/workflows/xray-three-layer-synthetic.yml'
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: personal-swing/research_lab/three_layer_v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test watchdog.test.mjs
      - name: Resolve exact public dependency lock for isolated review
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8")); for(const p of Object.values(lock.packages)){if(p.resolved){const u=new URL(p.resolved); if(u.protocol!=="https:"||u.hostname!=="registry.npmjs.org"||u.username||u.password||u.search||u.hash||!p.integrity)throw Error("UNAPPROVED_DEPENDENCY_RESOLUTION");}} const s=JSON.stringify(lock); console.log("XRAY_LOCK_SHA256 "+crypto.createHash("sha256").update(s).digest("hex")); console.log("XRAY_LOCK_JSON "+s);'
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Public package advisory audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - run: npx --no-install playwright install chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/xray-three-layer-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          npm run test:browser
  synthetic-n8n-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: personal-swing/research_lab/three_layer_v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash n8n-runtime-smoke.sh
