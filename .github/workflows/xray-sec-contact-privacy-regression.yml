name: XRAY SEC Contact Privacy Regression (No Market Data)
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "nasdaq-xray/sec_operator_contact_secret_only_guard.py"
      - "nasdaq-xray/official_source_guard.py"
      - "nasdaq-xray/tests/test_official_security_status_fail_closed.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "nasdaq-xray/sec_operator_contact_secret_only_guard.py"
permissions:
  contents: read
concurrency:
  group: xray-sec-contact-public-workflow-privacy
  cancel-in-progress: true
jobs:
  detect-contact-leaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Prove five malicious contact patterns are rejected
        run: python nasdaq-xray/sec_operator_contact_secret_only_guard.py --selftest
      - name: Official Nasdaq safety negative tests (no network or vendor rights)
        run: |
          python -m unittest discover -s nasdaq-xray/tests -p test_official_security_status_fail_closed.py -v
          python -O -m unittest discover -s nasdaq-xray/tests -p test_official_security_status_fail_closed.py -v
          python nasdaq-xray/official_source_guard_selftest.py
          python -O nasdaq-xray/official_source_guard_selftest.py
      - name: No plaintext operator contact in any workflow
        run: python nasdaq-xray/sec_operator_contact_secret_only_guard.py
