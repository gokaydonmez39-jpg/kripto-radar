name: XRAY Independent Scientific Evidence Lab (NO AL)
on:
  pull_request:
    paths:
      - 'research/scientific_methodology_lab.py'
      - 'research/test_scientific_methodology_lab.py'
      - 'nasdaq-xray/post_mc_source_readiness.py'
      - '.github/workflows/xray-scientific-evidence-lab.yml'
  push:
    branches: [main]
    paths:
      - 'research/scientific_methodology_lab.py'
      - 'research/test_scientific_methodology_lab.py'
      - 'nasdaq-xray/post_mc_source_readiness.py'
      - '.github/workflows/xray-scientific-evidence-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-scientific-methods:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fail-closed scientific evidence and adversarial tests (NO secrets)
        run: |
          python -m unittest discover -s research -p 'test_scientific_methodology_lab.py' -v
          python -O -m unittest discover -s research -p 'test_scientific_methodology_lab.py' -v
      - name: Nasdaq SIP upstream evidence diagnostic (normal + optimized, offline)
        run: |
          python -m py_compile nasdaq-xray/post_mc_source_readiness.py
          python nasdaq-xray/post_mc_source_readiness.py --selftest
          python -O nasdaq-xray/post_mc_source_readiness.py --selftest
      - name: Bind diagnostic to actual tracked PRICE evidence (read-only)
        run: |
          python nasdaq-xray/post_mc_source_readiness.py --out "$RUNNER_TEMP/xray_post_mc_source_readiness.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ["RUNNER_TEMP"]) / "xray_post_mc_source_readiness.json").read_text())
          b = r["upstream_price_blocker"]
          assert b["unknown_count"] == r["price_symbol_local_unknown"]
          assert b["authenticated_sip_required_count"] + b["other_or_unverified_count"] == b["unknown_count"]
          assert r["alpha_authority"] is False
          assert r["current_mc_primary_measured_proven"] is False
          assert r["execution"] == "NONE" and r["real_money"] == "NO-GO"
          assert r["unknown_never_pass"] is True
          print("XRAY_POST_MC_LIVE_TRACKED_PRICE_EVIDENCE=PASS_DIAGNOSTIC_ONLY")
          print("XRAY_POST_MC_LIVE_SIP_BLOCKER_STATUS=" + b["status"])
          print("XRAY_POST_MC_LIVE_SIP_REQUIRED_COUNT=" + str(b["authenticated_sip_required_count"]))
          PY
      - name: No production mutation or delivery
        run: echo 'RESEARCH_ONLY; NO_AL; NO_BROKER; NO_SHEETS_WRITE; NO_NOTIFICATIONS'
