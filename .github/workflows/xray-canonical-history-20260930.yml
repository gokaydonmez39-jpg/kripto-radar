name: XRAY Canonical HISTORY 20260930
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/canonical_mc_input_20260930.json"
      - "nasdaq-xray/history_phase.py"
      - ".github/workflows/xray-canonical-history-20260930.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xray-canonical-history-20260930
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      XRAY_HISTORY_INPUT: ${{ github.workspace }}/nasdaq-xray/canonical_mc_input_20260930.json
      XRAY_HISTORY_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_history_20260930.json
      XRAY_HISTORY_WORKERS: "10"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile nasdaq-xray/history_phase.py
      - run: python -m pip install --disable-pip-version-check akshare==1.18.95
      - name: Run HISTORY
        run: python nasdaq-xray/history_phase.py
      - name: Validate zero unknown
        run: |
          python - <<'PY'
          import json
          j=json.load(open("nasdaq-xray/canonical_history_20260930.json"))
          assert j["schema"]=="XRAY_CANONICAL_HISTORY_V1"
          assert j["asof_et"]=="2026-09-30"
          assert sum(j["counts"].values())==j["input_count"]
          assert j["unknown_count"]==0,j["unknown_symbols"]
          print({"counts":j["counts"],"pass_count":j["pass_count"]})
          PY
      - name: Commit HISTORY
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/canonical_history_20260930.json
          git commit -m "chore(xray): canonical HISTORY 2026-09-30" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
