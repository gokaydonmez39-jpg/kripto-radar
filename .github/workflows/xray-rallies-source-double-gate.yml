name: XRAY Rallies Two-Gate Evidence and Rights Audit (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/rallies_source_double_gate.py'
      - 'nasdaq-xray/tests/test_rallies_source_double_gate.py'
      - '.github/workflows/xray-rallies-source-double-gate.yml'
  push:
    branches: [main]
    paths:
      - 'nasdaq-xray/rallies_source_double_gate.py'
      - 'nasdaq-xray/tests/test_rallies_source_double_gate.py'
      - '.github/workflows/xray-rallies-source-double-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-rallies-double-source-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  no-vendor-no-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and run adversarial source/rights cases under both Python modes
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/rallies_source_double_gate.py nasdaq-xray/tests/test_rallies_source_double_gate.py
          python -m unittest discover -s nasdaq-xray/tests -p test_rallies_source_double_gate.py -v
          python -O -m unittest discover -s nasdaq-xray/tests -p test_rallies_source_double_gate.py -v
      - name: Bind to actual current main canonical artifacts without a vendor call
        run: |
          set -euo pipefail
          python nasdaq-xray/rallies_source_double_gate.py --out "$RUNNER_TEMP/rallies_double_gate.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"rallies_double_gate.json").read_text())
          assert j["schema"]=="XRAY_RALLIES_AUTHORITY_DOUBLE_GATE_AUDIT_V1"
          assert j["status"]=="BLOCKED_SOURCE_EVIDENCE_OR_RIGHTS"
          assert "MISSING_SAME_ASOF_RALLIES_CLASSIFICATION" in j["blockers"]
          assert "RALLIES_AUTOMATED_NONDISPLAY_ENTITLEMENT_UNATTESTED" in j["blockers"]
          assert "RALLIES_RTH_INTEGER_VOLUME_NOT_ATTESTED" in j["blockers"]
          assert j["buy_signals"]==0 and j["may_notify_user"] is False
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          print("XRAY_RALLIES_CURRENT_DOUBLE_GATE=PASS_DIAGNOSTIC_BLOCKED_NO_ALPHA")
          PY
      - name: Refuse forbidden network and brokerage imports
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path("nasdaq-xray/rallies_source_double_gate.py").read_text())
          mods=set()
          for node in ast.walk(tree):
              if isinstance(node,ast.Import): mods.update(n.name.split('.')[0] for n in node.names)
              elif isinstance(node,ast.ImportFrom) and node.module: mods.add(node.module.split('.')[0])
          forbidden={"requests","httpx","urllib","subprocess","socket","alpaca","ccxt","yfinance","websocket"}
          assert not(mods&forbidden),mods&forbidden
          print("XRAY_RALLIES_DOUBLE_GATE=NO_VENDOR_NO_BROKER_NO_NETWORK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xray-rallies-source-and-entitlement-barriers-no-al
          path: ${{ runner.temp }}/rallies_double_gate.json
          retention-days: 14
          if-no-files-found: ignore
