name: XRAY Zero-Key Market Cap

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/mc_zero_key.py"
      - ".github/workflows/nasdaq-xray-mc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve zero-key market cap
        run: python nasdaq-xray/mc_zero_key.py
      - name: Commit MC state
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/mc_zero_key_state.json
          git commit -m "chore(xray): zero-key MC checkpoint [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
