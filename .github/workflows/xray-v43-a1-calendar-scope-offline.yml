name: XRAY v43 A1 Calendar Epoch Scope Offline (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/xray_v43_a1_calendar_scope.py'
      - 'nasdaq-xray/test_xray_v43_a1_calendar_scope.py'
      - 'nasdaq-xray/xray_v43_a1_calendar_snapshot_20261022.json'
      - '.github/workflows/xray-v43-a1-calendar-scope-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-offline-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile and run offline tests incl optimized mode
        run: |
          set -euo pipefail
          cd nasdaq-xray
          python -m py_compile xray_v43_a1_calendar_scope.py test_xray_v43_a1_calendar_scope.py
          python -m unittest -v test_xray_v43_a1_calendar_scope.py
          python -O -m unittest -v test_xray_v43_a1_calendar_scope.py
          python xray_v43_a1_calendar_scope.py xray_v43_a1_calendar_snapshot_20261022.json
      - name: Static side-effect and false-release check
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('nasdaq-xray/xray_v43_a1_calendar_scope.py')
          tree=ast.parse(p.read_text(encoding='utf-8'))
          mods=set()
          for node in ast.walk(tree):
              if isinstance(node,ast.Import):
                  mods.update(z.name.split('.')[0] for z in node.names)
              elif isinstance(node,ast.ImportFrom) and node.module:
                  mods.add(node.module.split('.')[0])
          assert not (mods & {'requests','urllib','http','socket','subprocess','alpaca','ccxt'})
          txt=p.read_text(encoding='utf-8')
          assert "'a1_release_ready': False" in txt
          assert "'canonical_price_pass': False" in txt
          assert "'registered_r92_count': 0" in txt
          print('XRAY_V43_OFFLINE_A1_NO_MARKET_DATA_OR_AL_PASS')
          PY