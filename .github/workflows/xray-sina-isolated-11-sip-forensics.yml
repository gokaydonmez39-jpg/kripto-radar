name: XRAY Sina 11 Source-Local SIP Forensics (Shadow)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_exhausted_sina_isolated_forensics.py"
      - "nasdaq-xray/alpaca_sina_zero_volume_minute_witness.py"
      - ".github/workflows/xray-sina-isolated-11-sip-forensics.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_exhausted_sina_isolated_forensics.py"
      - "nasdaq-xray/alpaca_sina_zero_volume_minute_witness.py"
      - ".github/workflows/xray-sina-isolated-11-sip-forensics.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pin official NASDAQ session calendar
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Offline exact 260/52 adversarial tests including optimized Python
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/alpaca_exhausted_sina_isolated_forensics.py nasdaq-xray/alpaca_sina_zero_volume_minute_witness.py
          python nasdaq-xray/alpaca_sina_zero_volume_minute_witness.py
          python -O nasdaq-xray/alpaca_sina_zero_volume_minute_witness.py
          python nasdaq-xray/alpaca_exhausted_sina_isolated_forensics.py --selftest
          python -O nasdaq-xray/alpaca_exhausted_sina_isolated_forensics.py --selftest
          python nasdaq-xray/alpaca_sip_paginated_transport_shadow.py
      - name: Private bounded remeasurement, no primary history authority
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          set -euo pipefail
          python nasdaq-xray/alpaca_exhausted_sina_isolated_forensics.py --out "$RUNNER_TEMP/xray_sina_isolated_11_counts_only.json"
      - name: Verify exact source blob and counts-only authority veto
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          doc=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_sina_isolated_11_counts_only.json").read_text())
          assert doc["schema"]=="XRAY_EXHAUSTED_SINA_ISOLATED_SIP_FORENSICS_V1"
          for field,source in (
              ("source_sina_state_git_blob_sha","nasdaq-xray/sina_state.json"),
              ("source_master_git_blob_sha","nasdaq-xray/canonical_current_master_manifest.json"),
          ):
              assert doc[field]==subprocess.check_output(["git","hash-object",source],text=True).strip()
          assert sum(doc["first_pass_counts"].values())==doc["selected_exhausted_count"]
          assert sum(doc["isolated_recheck_reason_counts"].values())==doc["first_pass_deficient"]
          assert doc["isolated_attempted"]<=16
          assert doc["requests_attempted"]<=((doc["selected_exhausted_count"]+8)//9)+16
          assert doc["worst_case_page_requests_upper_bound"]<=doc["requests_attempted"]*24+8
          minute=doc.get("zero_volume_minute_counts",{})
          assert isinstance(minute,dict)
          assert doc.get("zero_volume_minute_checks",0)<=8
          assert all(k in {
              "MINUTE_POSITIVE_DAILY_ZERO_DISCREPANCY_SHADOW",
              "MINUTE_NO_RTH_BARS_STILL_UNKNOWN",
              "MINUTE_INVALID_OR_TRANSPORT_UNKNOWN",
              "MINUTE_OFFICIAL_ZERO_DAY_UNVERIFIED",
          } and isinstance(v,int) and v>=0 for k,v in minute.items())
          assert sum(minute.values())<=doc["isolated_recheck_reason_counts"].get("ZERO_VOLUME_DAILY_BAR",0)
          for field in ("source_rights_independently_verified",
                        "source_independent_primary_history_authority",
                        "r92_registered","provider_raw_ohlcv_persisted",
                        "provider_symbols_persisted"):
              assert doc[field] is False,field
          for field in ("canonical_history_pass_created",
                        "canonical_price_pass_created","canonical_mc_pass_created"):
              assert doc[field]==0,field
          assert doc["execution"]=="NONE" and doc["real_money"]=="NO-GO"
          assert doc["unknown_never_pass"] is True
          assert all(type(n) is int for n in doc["isolated_recheck_reason_counts"].values())
          print("XRAY_SINA_ISOLATED_PUBLIC_SUMMARY_COUNTS_ONLY=PASS_NO_PRIMARY_NO_VENDOR_ROWS")
          PY
      - name: Retain sanitized counts without symbol identifiers or OHLCV
        if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-sina-isolated-research-counts-only
          path: ${{ runner.temp }}/xray_sina_isolated_11_counts_only.json
          if-no-files-found: ignore
          retention-days: 7
