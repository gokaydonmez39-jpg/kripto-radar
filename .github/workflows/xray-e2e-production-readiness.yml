name: XRAY E2E Production Readiness (Fail-Closed)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/e2e_production_readiness.py"
      - "nasdaq-xray/blocker_root_dependency_audit.py"
      - "nasdaq-xray/source_epoch_freshness_guard.py"
      - "nasdaq-xray/current_terminal_epoch_forensics.py"
      - "nasdaq-xray/history_17_short_official_bound_selftest.py"
      - "nasdaq-xray/history_official_identity_evidence.json"
      - "nasdaq-xray/chatgpt_only_delivery_mode.py"
      - "nasdaq-xray/notification_channel_policy_v1.json"
      - ".github/workflows/xray-e2e-production-readiness.yml"
  workflow_run:
    workflows:
      - "XRAY Canonical Current Post-MC Factory"
      - "XRAY Canonical Current Final Factory"
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: xray-e2e-readiness-failclosed-v1
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - name: Fence E2E evidence to current main (stale invocation is safe no-op)
        id: epoch_guard
        shell: bash
        env:
          XRAY_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$XRAY_EXPECTED_SHA" ]] || { echo "XRAY_E2E_WRONG_INVOCATION_SHA" >&2; exit 2; }
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ -n "$current_main" ]] || {
            echo "XRAY_E2E_MAIN_HEAD_UNAVAILABLE_FAIL_CLOSED" >&2
            exit 2
          }
          if [[ "$current_main" != "$XRAY_EXPECTED_SHA" ]]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=XRAY E2E stale event::No readiness evidence, no AL, no device receipt"
            printf '## XRAY E2E - stale invocation safe no-op\n\nNo current readiness evidence produced. No AL/R92 or device receipt attested.\n' >> "$GITHUB_STEP_SUMMARY"
            echo "XRAY_E2E_STALE_INVOCATION=SAFE_NOOP_NO_EVIDENCE"
            exit 0
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "XRAY_E2E_SOURCE_SHA_EXACT_AND_MAIN_CURRENT=PASS"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.epoch_guard.outputs.valid == 'true'
        with:
          python-version: "3.12"
      - name: Install pinned official exchange session calendar
        if: steps.epoch_guard.outputs.valid == 'true'
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Compile and regression-test exact C4.17 binding rules
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          python -m py_compile nasdaq-xray/e2e_production_readiness.py
          python nasdaq-xray/e2e_production_readiness.py --selftest
      - name: Verify 17 new-listing HISTORY failures and exclusive ChatGPT user channel
        if: steps.epoch_guard.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/history_17_short_official_bound_selftest.py nasdaq-xray/chatgpt_only_delivery_mode.py
          python nasdaq-xray/history_17_short_official_bound_selftest.py
          python -O nasdaq-xray/history_17_short_official_bound_selftest.py
          python nasdaq-xray/chatgpt_only_delivery_mode.py --selftest
          python -O nasdaq-xray/chatgpt_only_delivery_mode.py --selftest
          python nasdaq-xray/chatgpt_only_delivery_mode.py --check
          echo "XRAY_START_ACCEPTANCE_17_SHORT_HISTORY=PROVEN_FAIL_ONLY_NO_260_52_PASS"
          echo "XRAY_START_ACCEPTANCE_NOTIFICATION=CHATGPT_ONLY_GITHUB_ISSUES_OFF_DEVICE_UNVERIFIED"
          echo "XRAY_START_ACCEPTANCE_MC=SEPARATE_PRODUCTION_AUTHORITY_REQUIRED"

      - name: Assess REAL source epochs and safety gates
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          python nasdaq-xray/e2e_production_readiness.py --output "$RUNNER_TEMP/xray_e2e_readiness.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          o=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_e2e_readiness.json").read_text())
          assert o["schema"]=="XRAY_E2E_PRODUCTION_READINESS_AUDIT_V1"
          assert o["execution"]=="NONE" and o["real_money"]=="NO-GO"
          assert o["alpha_authority"] is False
          assert isinstance(o["ready_for_current_research_signal"],bool)
          if not o["official_nasdaq_session_freshness_attested"]:
              assert "SOURCE_EPOCH_NOT_LATEST_COMPLETED_SESSION" in o["blockers"]
              assert o["ready_for_current_research_signal"] is False
              assert o["full_e2e_research_attested"] is False
          print("XRAY_OFFICIAL_SESSION_LAGS="+json.dumps(o["source_session_lags"],sort_keys=True))
          # Future proven registered candidates must not be rejected solely
          # because an old test asserted that readiness is always False.
          if o["ready_for_current_research_signal"]:
              assert o["current_mc_authority_count"]==1
              assert o["candidate_local_source_chain_attested"] is True
              assert o["candidate_preparation_witness_only"] is True
          assert o["actual_device_delivery_receipt_attested"] is False
          delivery=o["delivery_observability"]
          assert delivery["phase"]=="POST_DELIVERY_INDEPENDENT_ACK"
          assert delivery["status"]=="UNVERIFIED_NO_INDEPENDENT_DEVICE_ACK"
          assert delivery["device_receipt_attested"] is False
          assert delivery["research_release_prerequisite"] is False
          assert delivery["notification_sent_by_this_audit"] is False
          assert "NOTIFICATION_DEVICE_RECEIPT_NOT_PROVEN" not in o["blockers"]
          assert o["no_trading_or_device_receipt_claim"] is True
          print("XRAY_DEVICE_RECEIPT=UNVERIFIED_POST_DELIVERY_NOT_SOURCE_RELEASE_GATE")
          print("XRAY_READINESS_REPORT_CHECK=PASS_FAIL_CLOSED")
          print("XRAY_READINESS_REPORT_RELEASE=NOT_GRANTED")
          PY
      - name: Independent official ASOF and archival terminal SHA witness (never an AL)
        if: steps.epoch_guard.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/current_terminal_epoch_forensics.py
          python nasdaq-xray/current_terminal_epoch_forensics.py --selftest
          python -O nasdaq-xray/current_terminal_epoch_forensics.py --selftest
          python nasdaq-xray/current_terminal_epoch_forensics.py --out "$RUNNER_TEMP/xray_latest_asof_vs_authoritative_terminal.json"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          e=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_latest_asof_vs_authoritative_terminal.json").read_text())
          def require(ok,code):
              if not ok: raise RuntimeError("XRAY_E2E_EPOCH_SOURCE_FAIL_CLOSED_"+code)
          require(e["schema"]=="XRAY_CURRENT_TERMINAL_EPOCH_FORENSICS_V1","SCHEMA")
          require(e["execution"]=="NONE" and e["real_money"]=="NO-GO","SAFETY")
          for key in ("canonical_terminal_overwritten","mc_primary_approved_by_report",
                      "g9_approved_by_report","r92_created_by_report",
                      "iphone_delivery_proven_by_report"):
              require(e[key] is False,"UNAUTHORIZED_"+key)
          require(e["current_asof_terminal_generated"] is False,"SYNTHETIC_CURRENT_TERMINAL")
          require(e["source_asof_et"]<=e["expected_latest_completed_official_asof_et"],"FUTURE_ROOT")
          require(e["last_authoritative_terminal_asof_et"]<=e["source_asof_et"],"FUTURE_TERMINAL")
          require(e["root_is_latest_official_asof"]==(e["source_asof_et"]==
                  e["expected_latest_completed_official_asof_et"]),"CURRENT_FLAG")
          for key,item in e["source_git_blobs"].items():
              actual=subprocess.check_output(
                  ["git","rev-parse","HEAD:"+item["path"]],text=True).strip()
              require(actual==item["git_blob_sha"],"GIT_BLOB_MISMATCH_"+key)
          rows=[
              ("Official last completed XNAS",e["expected_latest_completed_official_asof_et"]),
              ("ROOT ASOF",e["source_asof_et"]),
              ("MASTER ASOF",e["canonical_master_asof_et"]),
              ("PRICE ASOF",e["canonical_price_asof_et"]),
              ("Archival authoritative terminal",e["last_authoritative_terminal_asof_et"]),
              ("PRICE UNKNOWN",str(e["latest_price_unknown_count"])),
              ("MASTER UNKNOWN",str(e["latest_master_unknown_count"])),
              ("ROOT HISTORY UNKNOWN",str(e["root_history_unknown_count"])),
              ("Research release", "NOT ATTESTED; zero R92 created here"),
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a",encoding="utf-8") as out:
              out.write("## Official ASOF vs immutable terminal (read-only)\n\n| Source | Value |\n|---|---|\n")
              for label,value in rows: out.write("| "+label+" | "+value+" |\n")
              out.write("\nOld canonical terminal is NEVER re-dated. UNKNOWN stays UNKNOWN.\n")
          print("XRAY_E2E_OFFICIAL_ASOF_SHA_AUDIT=PASS_"+e["status"]+"_NO_ALPHA")
          PY
      - name: Independent root cause DAG, exact source-SHA, and 12-SPAC scope regression
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          python -m py_compile nasdaq-xray/blocker_root_dependency_audit.py
          python nasdaq-xray/blocker_root_dependency_audit.py --selftest
          python -O nasdaq-xray/blocker_root_dependency_audit.py --selftest
          python nasdaq-xray/blocker_root_dependency_audit.py \
            --e2e-witness "$RUNNER_TEMP/xray_e2e_readiness.json" \
            --out "$RUNNER_TEMP/xray_e2e_causal_dag.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_e2e_causal_dag.json"
          j=json.loads(p.read_text())
          if not (j["schema"]=="XRAY_C417_BLOCKER_CAUSAL_DAG_V1"
                  and j["execution"]=="NONE" and j["real_money"]=="NO-GO"
                  and j["unknown_never_pass"] is True
                  and j["go"] is False and j["alpha_authority"] is False
                  and j["real_device_notification_receipt_attested"] is False
                  and j["candidate_local_identity_disjoint_does_not_prove_mc_or_al"] is True):
              raise SystemExit("XRAY_ROOT_CAUSE_CAUSAL_DAG_SAFETY_FAULT")
          print("XRAY_E2E_BLOCKER_CAUSAL_DAG=PASS_SOURCE_EXACT_NO_GO")
          PY
      - name: Upload operational-only blocker witness (never a trading signal)
        if: steps.epoch_guard.outputs.valid == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-e2e-readiness-failclosed-v1
          path: |
            ${{ runner.temp }}/xray_e2e_readiness.json
            ${{ runner.temp }}/xray_e2e_causal_dag.json
            ${{ runner.temp }}/xray_latest_asof_vs_authoritative_terminal.json
          retention-days: 14
          if-no-files-found: error
      # IMPORTANT: selftest PASS is not production readiness. The artifact is
      # uploaded first, then the *separate* release check fails visibly.
      # No synthetic release, no forced AL signal, no device receipt claim.
      - name: Release gate - fail workflow when actual current research is NO-GO
        if: steps.epoch_guard.outputs.valid == 'true'
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_e2e_readiness.json"
          witness=json.loads(p.read_text())
          assert witness["execution"]=="NONE" and witness["real_money"]=="NO-GO"
          assert witness["no_trading_or_device_receipt_claim"] is True
          blockers=witness["blockers"]
          if witness["ready_for_current_research_signal"] is not True:
              print("XRAY_RELEASE_GATE=NO_GO")
              print("XRAY_RELEASE_GATE_BLOCKERS="+json.dumps(blockers,sort_keys=True))
              print("XRAY_RELEASE_GATE_REPORT=ARTIFACT_SAVED_BUT_PRODUCTION_UNPROVEN")
              sys.exit(2)
          # Audit alone never places an order or attests a device push.
          print("XRAY_RELEASE_GATE=SOURCE_READINESS_ATTESTED_RESEARCH_ONLY")
          PY
