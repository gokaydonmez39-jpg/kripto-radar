name: XRAY E2E Production Readiness (Fail-Closed)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/e2e_production_readiness.py"
      - "nasdaq-xray/source_epoch_freshness_guard.py"
      - ".github/workflows/xray-e2e-production-readiness.yml"
  workflow_run:
    workflows:
      - "XRAY Canonical Current Post-MC Factory"
      - "XRAY Canonical Current Final Factory"
    types: [completed]
    branches: [main]
  schedule:
    - cron: "13 * * * 1-5"

permissions:
  contents: read

concurrency:
  group: xray-e2e-readiness-failclosed-v1
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official exchange session calendar
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Compile and regression-test exact C4.17 binding rules
        run: |
          python -m py_compile nasdaq-xray/e2e_production_readiness.py
          python nasdaq-xray/e2e_production_readiness.py --selftest
      - name: Assess REAL source epochs and safety gates
        run: |
          python nasdaq-xray/e2e_production_readiness.py --output "$RUNNER_TEMP/xray_e2e_readiness.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          o=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_e2e_readiness.json").read_text())
          assert o["schema"]=="XRAY_E2E_PRODUCTION_READINESS_AUDIT_V1"
          assert o["execution"]=="NONE" and o["real_money"]=="NO-GO"
          assert o["alpha_authority"] is False
          assert isinstance(o["ready_for_current_research_signal"],bool)
          if not o["official_nasdaq_session_freshness_attested"]:
              assert "SOURCE_EPOCH_NOT_LATEST_COMPLETED_SESSION" in o["blockers"]
              assert o["ready_for_current_research_signal"] is False
              assert o["full_e2e_research_attested"] is False
          print("XRAY_OFFICIAL_SESSION_LAGS="+json.dumps(o["source_session_lags"],sort_keys=True))
          # Future proven registered candidates must not be rejected solely
          # because an old test asserted that readiness is always False.
          if o["ready_for_current_research_signal"]:
              assert o["current_mc_authority_count"]==1
              assert o["candidate_local_source_chain_attested"] is True
              assert o["candidate_preparation_witness_only"] is True
          assert o["actual_device_delivery_receipt_attested"] is False
          assert "NOTIFICATION_DEVICE_RECEIPT_NOT_PROVEN" in o["blockers"]
          assert o["no_trading_or_device_receipt_claim"] is True
          print("XRAY_READINESS_REPORT_CHECK=PASS_FAIL_CLOSED")
          print("XRAY_READINESS_REPORT_RELEASE=NOT_GRANTED")
          PY
      - name: Upload operational-only blocker witness (never a trading signal)
        uses: actions/upload-artifact@v4
        with:
          name: xray-e2e-readiness-failclosed-v1
          path: ${{ runner.temp }}/xray_e2e_readiness.json
          retention-days: 14
          if-no-files-found: error
      # IMPORTANT: selftest PASS is not production readiness. The artifact is
      # uploaded first, then the *separate* release check fails visibly.
      # No synthetic release, no forced AL signal, no device receipt claim.
      - name: Release gate - fail workflow when actual current research is NO-GO
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_e2e_readiness.json"
          witness=json.loads(p.read_text())
          assert witness["execution"]=="NONE" and witness["real_money"]=="NO-GO"
          assert witness["no_trading_or_device_receipt_claim"] is True
          blockers=witness["blockers"]
          if witness["ready_for_current_research_signal"] is not True:
              print("XRAY_RELEASE_GATE=NO_GO")
              print("XRAY_RELEASE_GATE_BLOCKERS="+json.dumps(blockers,sort_keys=True))
              print("XRAY_RELEASE_GATE_REPORT=ARTIFACT_SAVED_BUT_PRODUCTION_UNPROVEN")
              sys.exit(2)
          # Audit alone never places an order or attests a device push.
          print("XRAY_RELEASE_GATE=SOURCE_READINESS_ATTESTED_RESEARCH_ONLY")
          PY
