name: XRAY SPAC Nonblank SIC Premature PASS Guard
on:
  push:
    branches: [main, audit/c417-premc-identity-verified-asof-fixture-20261010]
    paths:
      - "nasdaq-xray/master_spac_operating_guard.py"
      - "nasdaq-xray/master_sec_identity_manual_seed_registry.json"
      - "nasdaq-xray/nbrg_official_sec_identity_seed_selftest.py"
      - "nasdaq-xray/current_identity_proof_selftest.py"
      - "nasdaq-xray/build_current_identity_proofs.py"
      - ".github/workflows/xray-master-spac-operating-guard-selftest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Nasdaq calendar for producer integration selftest
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Compile and dual positive/negative regression
        run: |
          python -m py_compile nasdaq-xray/master_spac_operating_guard.py nasdaq-xray/build_current_identity_proofs.py
          python nasdaq-xray/master_spac_operating_guard.py
          python nasdaq-xray/nbrg_official_sec_identity_seed_selftest.py
          (cd nasdaq-xray && python current_identity_proof_selftest.py)
      - name: Assert full producer binding, no SEC SIC shortcut
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          s=Path("nasdaq-xray/build_current_identity_proofs.py").read_text()
          ast.parse(s)
          assert "from master_spac_operating_guard import nonblank_requires_completion" in s
          assert 'IDENTITY_DISCOVERY_VERSION="SEC_CURRENT_SUSPECT_DISCOVERY_V9"' in s
          w=Path(".github/workflows/xray-canonical-current-pre-mc.yml").read_text()
          assert w.count('SEC_CURRENT_SUSPECT_DISCOVERY_V9')==2
          for token in [
              "nonblank_requires_completion(True, (old or {}).get('sic'))",
              "nonblank_requires_completion(True, manual.get('sic'))",
              "nonblank_requires_completion(True, row.get('sic'))",
              "nonblank_pending_completion.add(sym)",
              "unresolved_current_suspects.append(sym)",
          ]:
              assert token in s,token
          print("XRAY_SPAC_NONBLANK_OPERATING_PRODUCER_BINDING=PASS")
          PY
