name: XRAY P0 SEC Root Cause 168 Historical MC Unknown No GO
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-p0-mc-168-sec-pit-reprobe.yml"
      - "nasdaq-xray/p0_mc_168_sec_pit_reason_reprobe.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sec-exact-168-reprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check invocation SHA and source-locked negative cases
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python nasdaq-xray/p0_mc_168_sec_pit_reason_reprobe.py --selftest
          python -O nasdaq-xray/p0_mc_168_sec_pit_reason_reprobe.py --selftest
      - name: Download original exact 514-source union, verify GitHub digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIGEST="$(gh api repos/${{ github.repository }}/actions/artifacts/11718354595 --jq '.digest')"
          test "$DIGEST" = "sha256:0d19da570cf17999db18aa69b530d1b63dd13718a267a1fb3e75a252b901bb42"
          RUN="$(gh api repos/${{ github.repository }}/actions/artifacts/11718354595 --jq '.workflow_run.id')"
          test "$RUN" = "38183357135"
          mkdir -p "$RUNNER_TEMP/original"
          gh run download 38183357135 -R "${{ github.repository }}" -n xray-p0-full-514-mc-four-shard-classifications-only -D "$RUNNER_TEMP/original"
          test -s "$RUNNER_TEMP/original/xray_mc_full_514_union.json"
      - name: Re-probe SEC official PIT reasons, never MC PRIMARY
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT || vars.XRAY_SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          python nasdaq-xray/p0_mc_168_sec_pit_reason_reprobe.py \
            --union "$RUNNER_TEMP/original/xray_mc_full_514_union.json" \
            --out "$RUNNER_TEMP/xray_mc_168_sec_reason_reprobe.json"
      - name: Verify exact unknown set and fail-closed artifact semantics
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_mc_168_sec_reason_reprobe.json").read_text())
          assert r["schema"]=="XRAY_P0_MC_168_SEC_PIT_ROOT_CAUSE_REPROBE_V1"
          assert len(r["rows"])==r["original_unknown_count"]==168
          assert r["original_shadow_count"]==346 and r["original_full_price_count"]==514
          assert sum(r["sec_reprobe_reason_counts"].values())==168
          assert r["C417_PRIMARY_MC_created"]==r["canonical_HISTORY_PASS_created"]==0
          assert r["R92_created"] is False and r["GO"] is False
          assert r["raw_shares_prices_filings_accessions_vendor_OHLCV_persisted"] is False
          assert r["later_SEC_reprobe_never_retroactively_proves_20261009"] is True
          assert all(v["C417_PRIMARY_MC"] is False and
                     v["original_20261009_MC_status"]=="UNKNOWN_SEC_DIMENSIONAL_CLASS_OR_PIT_SHARES"
                     and v["historical_listing_class_PIT_confirmed"] is False
                     for v in r["rows"].values())
          print("XRAY_P0_SEC168_REPROBE=PASS_RESEARCH_DIAGNOSTICS_ONLY_NO_GO")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xray-mc-168-official-sec-pit-root-causes-no-primary
          path: ${{ runner.temp }}/xray_mc_168_sec_reason_reprobe.json
          retention-days: 14
          if-no-files-found: error
