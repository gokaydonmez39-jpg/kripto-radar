name: XRAY SEC MarkItDown Offline Research Adapter (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/sec_markitdown_offline_shadow.py'
      - 'nasdaq-xray/tests/test_sec_markitdown_offline_shadow.py'
      - '.github/workflows/xray-sec-markitdown-offline-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'nasdaq-xray/sec_markitdown_offline_shadow.py'
      - 'nasdaq-xray/tests/test_sec_markitdown_offline_shadow.py'
      - '.github/workflows/xray-sec-markitdown-offline-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-sec-markitdown-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-sec-document-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact MIT licensed Microsoft MarkItDown release, isolated from market workflow
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'markitdown==0.1.8'
          python -m pip check
          python - <<'PY'
          import importlib.metadata as m
          assert m.version("markitdown") == "0.1.8"
          print("XRAY_OPTIONAL_MARKITDOWN_VERSION=0.1.8")
          PY
      - name: Compile, execute real converter, and test fail-closed cases twice
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/sec_markitdown_offline_shadow.py nasdaq-xray/tests/test_sec_markitdown_offline_shadow.py
          python -m unittest discover -s nasdaq-xray/tests -p test_sec_markitdown_offline_shadow.py -v
          python -O -m unittest discover -s nasdaq-xray/tests -p test_sec_markitdown_offline_shadow.py -v
      - name: Enforce research only no broker or network code in adapter
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          f=Path("nasdaq-xray/sec_markitdown_offline_shadow.py")
          tree=ast.parse(f.read_text())
          forbidden={"socket","subprocess","urllib","requests","httpx","alpaca","ccxt"}
          imports=set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(z.name.split('.')[0] for z in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module.split('.')[0])
          assert not imports.intersection(forbidden)
          print("XRAY_SEC_MARKITDOWN_ADAPTER_NO_PROVIDER_NO_BROKER_CALL=PASS")
          PY
