# XRAY pointer transition trigger 2026-10-07 terminal ec9655cb
name: XRAY Canonical Pointer Transition

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/canonical_current_terminal.json"
      - "nasdaq-xray/build_canonical_pointer_transition.py"
      - "nasdaq-xray/canonical_pointer_transition_guard.py"
      - "nasdaq-xray/deterministic_replay_guard.py"
      - ".github/workflows/xray-canonical-pointer-transition.yml"
  workflow_run:
    workflows: ["XRAY Canonical Current Final Factory"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: xray-canonical-pointer-transition
  # Do not preempt an in-flight immutable terminal/audit readback on duplicate triggers.
  cancel-in-progress: false

jobs:
  advance:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Compile + deterministic transition selftest
        run: |
          python -m py_compile nasdaq-xray/build_canonical_pointer_transition.py nasdaq-xray/canonical_pointer_transition_guard.py nasdaq-xray/deterministic_replay_guard.py
          python nasdaq-xray/build_canonical_pointer_transition.py --selftest
      - name: Preflight exact-live terminal immutable evidence
        id: terminal_preflight
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,pathlib,subprocess,sys
          root=pathlib.Path("nasdaq-xray")
          repo=pathlib.Path(".")
          t=json.load(open(root/"canonical_current_terminal.json"))
          keys=("master","price","history","legal","stage1_input","stage1","regime","deep_geometry","event_request","events","family_c","deep","final","policy","full_state","mc")
          def bsha(p): return subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
          drift=[]
          for key in keys:
              m=(t.get("evidence") or {}).get(key) or {}
              rel=m.get("path"); exp=m.get("blob_sha")
              if not rel or not exp:
                  drift.append({"key":key,"reason":"MISSING_BINDING"}); continue
              p=repo/rel
              if not p.exists():
                  drift.append({"key":key,"reason":"PATH_MISSING","path":rel}); continue
              act=bsha(p)
              if act!=exp: drift.append({"key":key,"reason":"BLOB_DRIFT","path":rel,"expected":exp,"actual":act})
          # Cross-artifact exactness: an MC blob may itself be byte-current while
          # still internally bound to an older PRICE blob. Treat that as an
          # upstream-incomplete state and do not synthesize a pointer revision.
          pe=(t.get("evidence") or {}).get("price") or {}
          me=(t.get("evidence") or {}).get("mc") or {}
          price_rel=str(pe.get("path") or "")
          price_path=repo/price_rel if price_rel else None
          mc_rel=str(me.get("path") or "")
          mc_path=repo/mc_rel if mc_rel else None
          if not price_path or not price_path.exists():
              drift.append({"key":"mc_price_cross_binding","reason":"PRICE_PATH_MISSING","path":price_rel})
          elif not mc_path or not mc_path.exists():
              drift.append({"key":"mc_price_cross_binding","reason":"MC_PATH_MISSING","path":mc_rel})
          else:
              try:
                  price_obj=json.load(open(price_path))
                  mc_obj=json.load(open(mc_path))
                  price_pass_hash=price_obj.get("pass_hash")
                  if price_rel!="nasdaq-xray/canonical_current_price_dv30.json":
                      drift.append({"key":"mc_price_cross_binding","reason":"PRICE_PATH_NOT_CANONICAL","actual":price_rel})
                  if not price_pass_hash:
                      drift.append({"key":"mc_price_cross_binding","reason":"PRICE_PASS_HASH_MISSING"})
                  if mc_obj.get("input_path")!="nasdaq-xray/canonical_current_price_dv30.json":
                      drift.append({"key":"mc_price_cross_binding","reason":"MC_INPUT_PATH_NOT_CURRENT_PRICE","actual":mc_obj.get("input_path")})
                  if mc_obj.get("input_blob_sha")!=pe.get("blob_sha"):
                      drift.append({"key":"mc_price_cross_binding","reason":"MC_PRICE_BLOB_NOT_EXACT","mc_input_blob_sha":mc_obj.get("input_blob_sha"),"price_blob_sha":pe.get("blob_sha")})
                  if price_pass_hash and mc_obj.get("input_pass_hash")!=price_pass_hash:
                      drift.append({"key":"mc_price_cross_binding","reason":"MC_PRICE_PASS_HASH_NOT_EXACT","mc_input_pass_hash":mc_obj.get("input_pass_hash"),"price_pass_hash":price_pass_hash})
              except Exception as e:
                  drift.append({"key":"mc_price_cross_binding","reason":"MC_OR_PRICE_PARSE_ERROR","error":type(e).__name__})
          sw_rel=str(t.get("settlement_witness_path") or ""); sw_exp=str(t.get("settlement_witness_blob_sha") or "")
          if not sw_rel or not sw_exp:
              drift.append({"key":"settlement_witness","reason":"MISSING_BINDING"})
          else:
              sw=repo/sw_rel
              if not sw.exists(): drift.append({"key":"settlement_witness","reason":"PATH_MISSING","path":sw_rel})
              else:
                  sw_act=bsha(sw)
                  if sw_act!=sw_exp: drift.append({"key":"settlement_witness","reason":"BLOB_DRIFT","path":sw_rel,"expected":sw_exp,"actual":sw_act})
          ready=not drift
          print("ready="+("true" if ready else "false"))
          print("reason="+("EXACT_LIVE_TERMINAL_EVIDENCE" if ready else "UPSTREAM_TERMINAL_EVIDENCE_DRIFT"))
          print("drift_count="+str(len(drift)))
          print("XRAY_POINTER_TERMINAL_PREFLIGHT="+json.dumps({"ready":ready,"drift":drift[:12]},sort_keys=True),file=sys.stderr)
          PY
      - name: Healthy no-op while terminal immutable evidence is stale
        if: steps.terminal_preflight.outputs.ready != 'true'
        run: echo "XRAY_POINTER_TRANSITION=BLOCKED_UPSTREAM_PENDING reason=${{ steps.terminal_preflight.outputs.reason }} drift_count=${{ steps.terminal_preflight.outputs.drift_count }}"
      - name: Build next canonical pointer revision
        id: build
        if: steps.terminal_preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python nasdaq-xray/build_canonical_pointer_transition.py | tee /tmp/pointer_transition
          cat /tmp/pointer_transition
      - name: Verify pointer transition and immutable evidence
        if: steps.terminal_preflight.outputs.ready == 'true'
        run: python nasdaq-xray/canonical_pointer_transition_guard.py
      - name: Build and verify Replay V2
        if: steps.terminal_preflight.outputs.ready == 'true'
        run: |
          python nasdaq-xray/deterministic_replay_guard.py
          python - <<'PY'
          import json
          p=json.load(open("nasdaq-xray/chatgpt_canonical_state_v2.json"))
          t=json.load(open("nasdaq-xray/canonical_current_terminal.json"))
          r=json.load(open("nasdaq-xray/canonical_replay_guard.json"))
          assert r["schema"]=="XRAY_DETERMINISTIC_REPLAY_GUARD_V2"
          assert r["status"]=="PASS",r
          assert r["asof_consistent"] is True,r
          assert r["asof_values"]==[t["asof_et"]],r["asof_values"]
          assert p["state_json"]["asof_et"]==t["asof_et"]
          print("XRAY_POINTER_REPLAY_ACCEPTANCE=PASS revision=%s asof=%s"%(p["revision"],t["asof_et"]))
          PY
      - name: Commit pointer snapshot and Replay V2 with stale-source protection
        if: steps.terminal_preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-pointer-bot"
          git config user.email "xray-pointer-bot@users.noreply.github.com"
          snapshot="$(python - <<'PY'
          import json
          print(json.load(open("nasdaq-xray/chatgpt_canonical_state_v2.json"))["immutable_snapshot_path"])
          PY
          )"
          git add nasdaq-xray/chatgpt_canonical_state_v2.json nasdaq-xray/canonical_replay_guard.json "$snapshot"
          git diff --cached --quiet && exit 0
          git commit -m "chore(xray): advance canonical pointer to current terminal [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            changed="$(git diff --name-only "$GITHUB_SHA" origin/main --               nasdaq-xray/canonical_current_master_manifest.json               nasdaq-xray/canonical_current_price_dv30.json               nasdaq-xray/canonical_mc_bridge_*.json               nasdaq-xray/canonical_current_history.json               nasdaq-xray/canonical_current_legal.json               nasdaq-xray/canonical_current_stage1_input.json               nasdaq-xray/canonical_current_stage1.json               nasdaq-xray/canonical_current_regime.json               nasdaq-xray/canonical_current_deep_geometry.json               nasdaq-xray/canonical_current_event_request.json               nasdaq-xray/canonical_current_event_state.json               nasdaq-xray/canonical_current_deep_full.json               nasdaq-xray/canonical_current_final_tech.json               nasdaq-xray/canonical_current_terminal.json               nasdaq-xray/chatgpt_canonical_state_v2.json || true)"
            if [[ -n "$changed" ]]; then
              if [[ "$changed" == "nasdaq-xray/chatgpt_canonical_state_v2.json" ]]; then
                git show origin/main:nasdaq-xray/chatgpt_canonical_state_v2.json >/tmp/xray_concurrent_pointer.json
                git show origin/main:nasdaq-xray/canonical_current_terminal.json >/tmp/xray_concurrent_terminal.json
                terminal_sha="$(git rev-parse origin/main:nasdaq-xray/canonical_current_terminal.json)"
                if python - "$terminal_sha" <<'PY'
          import json,sys
          p=json.load(open('/tmp/xray_concurrent_pointer.json'))
          t=json.load(open('/tmp/xray_concurrent_terminal.json'))
          assert p['execution']=='NONE' and p['real_money']=='NO-GO'
          assert t['execution']=='NONE' and t['real_money']=='NO-GO'
          assert p['state_json']['asof_et']==t['asof_et']
          assert p['state_json']['deep_final_evidence']['terminal_blob_sha']==sys.argv[1]
          assert p['state_json']['deep_final_evidence']['terminal_result']==t['terminal_result']
          print('XRAY_POINTER_ALREADY_BOUND_CONCURRENT_NOOP')
          PY
                then
                  echo "XRAY_POINTER_TRANSITION=ALREADY_BOUND_LIVE_NOOP"
                  exit 0
                fi
              fi
              echo "XRAY_POINTER_TRANSITION=STALE_SOURCE_ABORT"
              printf '%s\n' "$changed"
              exit 1
            fi
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "XRAY_POINTER_TRANSITION=PASS attempt=$attempt"
              exit 0
            fi
            echo "XRAY_POINTER_TRANSITION=PUSH_RACE attempt=$attempt"
            sleep $((attempt*2))
          done
          echo "XRAY_POINTER_TRANSITION=FAIL_PUSH_RACE_EXHAUSTED" >&2
          exit 1

      - name: Reconcile final gate overlay against exact committed pointer
        if: steps.terminal_preflight.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          live_terminal="$(git rev-parse origin/main:nasdaq-xray/canonical_current_terminal.json)"
          live_pointer="$(git rev-parse origin/main:nasdaq-xray/chatgpt_canonical_state_v2.json)"
          git show origin/main:nasdaq-xray/chatgpt_canonical_state_v2.json >/tmp/xray_overlay_pointer.json
          git show origin/main:nasdaq-xray/canonical_current_terminal.json >/tmp/xray_overlay_terminal.json
          if ! python - "$live_pointer" "$live_terminal" <<'PY'
          import json,sys
          p=json.load(open('/tmp/xray_overlay_pointer.json'))
          t=json.load(open('/tmp/xray_overlay_terminal.json'))
          assert p['execution']=='NONE' and p['real_money']=='NO-GO'
          assert t['execution']=='NONE' and t['real_money']=='NO-GO'
          assert p['state_json']['asof_et']==t['asof_et']
          assert p['state_json']['deep_final_evidence']['terminal_blob_sha']==sys.argv[2]
          assert p['state_json']['deep_final_evidence']['terminal_result']==t['terminal_result']
          print('XRAY_OVERLAY_POINTER_TERMINAL_FENCE=PASS')
          PY
          then
            echo "XRAY_OVERLAY_DISPATCH=EXACT_POINTER_NOT_READY_FAIL_CLOSED"
            exit 0
          fi
          git show origin/main:nasdaq-xray/canonical_current_final_gate_overlay.json >/tmp/xray_overlay_existing.json
          if python - "$live_pointer" "$live_terminal" <<'PY'
          import json,sys
          o=json.load(open('/tmp/xray_overlay_existing.json'))
          assert o['source_pointer']['blob_sha']==sys.argv[1]
          assert o['source_terminal']['blob_sha']==sys.argv[2]
          print('XRAY_OVERLAY_ALREADY_EXACT_NOOP')
          PY
          then
            exit 0
          fi
          gh workflow run xray-final-gate-overlay-v2.yml --ref main
          echo "XRAY_OVERLAY_DISPATCH=REQUESTED_EXACT_CURRENT_READBACK"

