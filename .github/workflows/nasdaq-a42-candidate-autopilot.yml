name: XRAY NASDAQ A42 Candidate Intake Autopilot (No Promotion)

on:
  pull_request:
    paths:
      - 'nasdaq-candidate-autopilot/**'
      - '.github/workflows/nasdaq-a42-candidate-autopilot.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'XRAY Personal 477 EOD Daily Health (Research Only)'
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: xray-nasdaq-a42-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-static-gate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing global schedule and issue-writer policy (fail-closed)
        run: |
          python -m pip install 'PyYAML==6.0.2'
          python nasdaq-xray/all_workflow_schedule_audit.py --selftest
      - name: Registry contract and negative tests
        working-directory: nasdaq-candidate-autopilot
        run: |
          python -m unittest -q test_autopilot test_eod_admission test_assessment test_ledger test_queue
          python -O -m unittest -q test_autopilot test_eod_admission test_assessment test_ledger test_queue
          python -m py_compile autopilot.py test_autopilot.py eod_admission.py test_eod_admission.py assessment.py test_assessment.py ledger.py test_ledger.py candidate_queue.py test_queue.py
      - name: Static 284 source admission and next cohort receipt
        env:
          PROBE_PUBLIC_GITHUB: ${{ github.event_name == 'workflow_run' && 'yes' || 'no' }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_NAME: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_RUN_STATUS: ${{ github.event.workflow_run.status }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROBE_PUBLIC_GITHUB" == "yes" ]]; then
            python nasdaq-candidate-autopilot/eod_admission.py --output "$RUNNER_TEMP/a43-eod-admission.json"
            SESSION_DATE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["asof_et"])' "$RUNNER_TEMP/a43-eod-admission.json")"
            mkdir -p "$RUNNER_TEMP/xray-a46"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=xray-a45-rolling-state&per_page=100" > "$RUNNER_TEMP/xray-a46/prior-index.json"
            PREV_RUN_ID="$(python -c 'import json,sys; a=json.load(open(sys.argv[1])); run=int(sys.argv[2]); xs=[x for x in a.get("artifacts",[]) if not x.get("expired",True) and isinstance(x.get("workflow_run"),dict) and x["workflow_run"].get("id") != run]; print(xs[0]["workflow_run"]["id"] if xs else "")' "$RUNNER_TEMP/xray-a46/prior-index.json" "$GITHUB_RUN_ID")"
            prior=()
            if [[ -n "$PREV_RUN_ID" ]]; then
              mkdir -p "$RUNNER_TEMP/xray-a46/previous"
              gh run download "$PREV_RUN_ID" --repo "$GITHUB_REPOSITORY" --name xray-a45-rolling-state --dir "$RUNNER_TEMP/xray-a46/previous"
              prior=(--previous "$RUNNER_TEMP/xray-a46/previous/a45-state.json")
            fi
            python nasdaq-candidate-autopilot/candidate_queue.py --registry nasdaq-candidate-autopilot/registry.json --asof "$SESSION_DATE" --source-run-id "$SOURCE_RUN_ID" "${prior[@]}" --output "$RUNNER_TEMP/a46-queue.json"
            python nasdaq-candidate-autopilot/autopilot.py --date "$SESSION_DATE" --queue-receipt "$RUNNER_TEMP/a46-queue.json" --network --output "$RUNNER_TEMP/a42-receipt.json"
            python nasdaq-candidate-autopilot/assessment.py --receipt "$RUNNER_TEMP/a42-receipt.json" --network --output "$RUNNER_TEMP/a44-assessment.json"
          else
            python nasdaq-candidate-autopilot/autopilot.py --date 2026-11-02 --output "$RUNNER_TEMP/a42-receipt.json"
            python nasdaq-candidate-autopilot/assessment.py --receipt "$RUNNER_TEMP/a42-receipt.json" --output "$RUNNER_TEMP/a44-assessment.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xray-a42-readonly-candidate-receipt
          path: |
            ${{ runner.temp }}/a42-receipt.json
            ${{ runner.temp }}/a43-eod-admission.json
            ${{ runner.temp }}/a44-assessment.json
            ${{ runner.temp }}/a46-queue.json
          retention-days: 30
          if-no-files-found: error

  candidate-ledger-rollover:
    needs: [candidate-static-gate]
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read only current A42/A43/A44 receipts and previous rolling proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xray-a45"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name xray-a42-readonly-candidate-receipt --dir "$RUNNER_TEMP/xray-a45"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=xray-a45-rolling-state&per_page=100" > "$RUNNER_TEMP/xray-a45/available-artifacts.json"
          PREV_RUN_ID="$(python -c 'import json,sys; a=json.load(open(sys.argv[1])); run=int(sys.argv[2]); xs=[x for x in a.get("artifacts",[]) if not x.get("expired",True) and isinstance(x.get("workflow_run"),dict) and x["workflow_run"].get("id") != run]; print(xs[0]["workflow_run"]["id"] if xs else "")' "$RUNNER_TEMP/xray-a45/available-artifacts.json" "$GITHUB_RUN_ID")"
          prior=()
          if [[ -n "$PREV_RUN_ID" ]]; then
            mkdir -p "$RUNNER_TEMP/xray-a45/previous"
            gh run download "$PREV_RUN_ID" --repo "$GITHUB_REPOSITORY" --name xray-a45-rolling-state --dir "$RUNNER_TEMP/xray-a45/previous"
            prior=(--previous "$RUNNER_TEMP/xray-a45/previous/a45-state.json")
          fi
          python nasdaq-candidate-autopilot/ledger.py \
            --a42 "$RUNNER_TEMP/xray-a45/a42-receipt.json" \
            --a43 "$RUNNER_TEMP/xray-a45/a43-eod-admission.json" \
            --a44 "$RUNNER_TEMP/xray-a45/a44-assessment.json" \
            "${prior[@]}" \
            --output "$RUNNER_TEMP/a45-state.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xray-a45-rolling-state
          path: ${{ runner.temp }}/a45-state.json
          retention-days: 30
          if-no-files-found: error
