name: XRAY Nasdaq Screener PIT Shadow Capture

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/nasdaq_screener_pit_capture.py"
      - "nasdaq-xray/nasdaq_screener_pit_capture_selftest.py"
      - ".github/workflows/xray-nasdaq-screener-pit-capture.yml"
  # Unattended capture disabled: Nasdaq website terms restrict automatic
  # data extraction for analytics without prior written authorization.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-nasdaq-screener-pit-shadow
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and deterministic selftest
        working-directory: nasdaq-xray
        run: |
          python -m py_compile nasdaq_screener_pit_capture.py nasdaq_screener_pit_capture_selftest.py
          python nasdaq_screener_pit_capture_selftest.py

      - name: Demand documented Nasdaq screener automation rights before HTTP
        env:
          XRAY_NASDAQ_SCREENER_LICENSE_OK: ${{ vars.XRAY_NASDAQ_SCREENER_AUTOMATED_LICENSE_OK }}
          XRAY_NASDAQ_SCREENER_LICENSE_EVIDENCE: ${{ secrets.XRAY_NASDAQ_SCREENER_LICENSE_EVIDENCE_SHA256 }}
        run: |
          if [[ "$XRAY_NASDAQ_SCREENER_LICENSE_OK" != "true" ||
                ! "$XRAY_NASDAQ_SCREENER_LICENSE_EVIDENCE" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "XRAY_NASDAQ_CAPTURE=BLOCKED_NO_WRITTEN_AUTOMATION_LICENSE" >&2
            exit 2
          fi
      - name: Capture official Nasdaq screener shadow
        run: python nasdaq-xray/nasdaq_screener_pit_capture.py

      - name: Validate fail-closed current snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("nasdaq-xray")
          state=json.loads((root/"nasdaq_screener_pit_current.json").read_text())
          price=json.loads((root/"canonical_current_price_dv30.json").read_text())
          assert state["schema"]=="XRAY_NASDAQ_SCREENER_PIT_SHADOW_V1"
          assert state["execution"]=="NONE"
          assert state["real_money"]=="NO-GO"
          assert state["unknown_never_pass"] is True
          assert state["alpha_authority"] is False
          assert state["production_mc_authority_changed"] is False
          assert state["asof_et"]==price["asof_et"]
          assert state["scope_count"]==len(set(price.get("pass_symbols") or []))
          assert state["eligible_count"]+state["unknown_count"]==state["scope_count"]
          records=state.get("records") or {}
          assert len(records)==state["scope_count"]
          for sym in state.get("eligible_symbols") or []:
              rec=records[sym]
              assert rec["shadow_eligible"] is True
              assert rec["close_match"] is True
              assert rec["eligible_asof_et"]==state["asof_et"]
              assert rec["nasdaq_market_cap_usd"]>0
          if state["same_session_post_close"] is not True:
              assert state["eligible_count"]==0
          from datetime import datetime,time
          retrieved_et=datetime.fromisoformat(state["retrieved_at_et"])
          post_close_clock=retrieved_et.timetz().replace(tzinfo=None)>=time(16,10)
          raw_matches=[]
          if post_close_clock:
              capture_date=retrieved_et.date().isoformat()
              raw_matches=sorted((root/"evidence"/"nasdaq_screener_raw").glob(
                  "nasdaq_screener_raw_"+capture_date.replace("-","")+"_*.json"
              ))
              assert raw_matches,("RAW_POST_CLOSE_ARCHIVE_MISSING",capture_date)
              exact=[]
              for rp in raw_matches:
                  rj=json.loads(rp.read_text())
                  if rj.get("retrieved_at_utc")==state.get("retrieved_at_utc"):
                      exact.append((rp,rj))
              assert len(exact)==1,("RAW_CAPTURE_EXACT_TIMESTAMP_BINDING",len(exact))
              rp,rj=exact[0]
              assert rj["schema"]=="XRAY_NASDAQ_SCREENER_RAW_CAPTURE_V1"
              assert rj["post_close_clock"] is True
              assert rj["capture_date_et"]==capture_date
              assert rj["alpha_authority"] is False
              assert rj["production_mc_authority_changed"] is False
              assert rj["decision_semantics"]=="RAW_EVIDENCE_ONLY_NO_MC_CLASSIFICATION"
              assert int(rj["record_count"])>=1000
          print(json.dumps({
              "status":"NASDAQ_SCREENER_PIT_CAPTURE_VALID",
              "asof_et":state["asof_et"],
              "same_session_post_close":state["same_session_post_close"],
              "scope_count":state["scope_count"],
              "eligible_count":state["eligible_count"],
              "unknown_count":state["unknown_count"],
              "reason_counts":state["reason_counts"],
              "raw_post_close_clock":post_close_clock,
              "raw_exact_archive_count":1 if post_close_clock else 0,
          },sort_keys=True))
          PY

      - name: Persist PIT shadow evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/nasdaq_screener_pit_current.json
          if [ -d nasdaq-xray/evidence/nasdaq_screener_pit ]; then
            git add nasdaq-xray/evidence/nasdaq_screener_pit
          fi
          if [ -d nasdaq-xray/evidence/nasdaq_screener_raw ]; then
            git add nasdaq-xray/evidence/nasdaq_screener_raw
          fi
          if git diff --cached --quiet; then
            echo "No screener PIT evidence change."
            exit 0
          fi
          git commit -m "chore(xray): Nasdaq screener PIT shadow checkpoint [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "NASDAQ_SCREENER_PIT_PUSH_FAILED" >&2
          exit 1

      - name: Upload PIT shadow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-nasdaq-screener-pit-shadow
          path: |
            nasdaq-xray/nasdaq_screener_pit_current.json
            nasdaq-xray/evidence/nasdaq_screener_pit/
            nasdaq-xray/evidence/nasdaq_screener_raw/
          if-no-files-found: warn
          retention-days: 14
