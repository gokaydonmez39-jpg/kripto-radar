name: XRAY Personal EOD Research Signal Digest (No R92)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/personal_research_signal_digest.py"
      - "nasdaq-xray/personal_research_diagnostics.py"
      - "nasdaq-xray/personal_research_advisory_ledger_guard.py"
      - "nasdaq-xray/personal_research_advisory_ledger.json"
      - ".github/workflows/xray-personal-eod-research-digest.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/personal_research_signal_digest.py"
      - "nasdaq-xray/personal_research_diagnostics.py"
      - "nasdaq-xray/personal_research_advisory_ledger_guard.py"
      - "nasdaq-xray/personal_research_advisory_ledger.json"
      - ".github/workflows/xray-personal-eod-research-digest.yml"
  workflow_run:
    workflows:
      - "NASDAQ SWING XRAY Autonomous Data Plane"
    types: [completed]
  workflow_dispatch:
concurrency:
  group: xray-personal-eod-research-digest-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
  queue: max
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify exact-source candidate math and 10 negative mutations, no vendor IO
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/personal_research_signal_digest.py
          python nasdaq-xray/personal_research_signal_digest.py --selftest
          python -O nasdaq-xray/personal_research_signal_digest.py --selftest
          python -m py_compile nasdaq-xray/personal_research_advisory_ledger_guard.py
          python nasdaq-xray/personal_research_advisory_ledger_guard.py
          python -O nasdaq-xray/personal_research_advisory_ledger_guard.py
          python -m py_compile nasdaq-xray/personal_research_diagnostics.py
          python nasdaq-xray/personal_research_diagnostics.py --selftest
          python -O nasdaq-xray/personal_research_diagnostics.py --selftest
  publish:
    needs: [offline-regression]
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit input commit and build source-bound personal research digest
        id: input
        shell: bash
        run: |
          set -euo pipefail
          here="$(git rev-parse HEAD)"
          fresh="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ -n "$fresh" && "$here" == "$fresh" ]] || {
            echo "XRAY_PERSONAL_DIGEST=NOOP_STALE_MAIN_BEFORE_BUILD"
            exit 0
          }
          python nasdaq-xray/personal_research_signal_digest.py --selftest
          python -O nasdaq-xray/personal_research_signal_digest.py --selftest
          python nasdaq-xray/personal_research_signal_digest.py --out "$RUNNER_TEMP/personal_research_digest.json"
          python nasdaq-xray/personal_research_diagnostics.py \
            --digest "$RUNNER_TEMP/personal_research_digest.json" \
            --out "$RUNNER_TEMP/personal_research_diagnostics.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"personal_research_diagnostics.json").read_text())
          assert d["status"]=="SOURCE_BOUND_RESEARCH_ONLY_NOT_BUY"
          assert d["registered_r92_count"]==0 and not d["automated_alert_authority"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("## XRAY personal research — verified source-bound diagnostics (NOT AL)\n\n")
              f.write("ASOF: "+d["asof_et"]+"; WATCH: "+str(d["watch_count"])+"; rejected technical triggers: "+str(d["rejected_count"])+"; research setup candidates: "+str(d["candidate_count"])+"\n\n")
              f.write("Source confidence: LOW / secondary EOD; no R92 or broker authority.\n\n")
              f.write("| Blocker | Rejected triggers |\n|---|---:|\n")
              for k,v in d["blocker_frequency"].items(): f.write(f"| {k} | {v} |\n")
          PY
          echo "source_head=$here" >> "$GITHUB_OUTPUT"
      - name: Publish only exact still-current main research evidence, no BUY claim
        if: steps.input.outputs.source_head != ''
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ -n "$current" && "$current" == "${{ steps.input.outputs.source_head }}" ]] || {
            echo "XRAY_PERSONAL_DIGEST=NOOP_STALE_MAIN_BEFORE_WRITE"
            exit 0
          }
          cp "$RUNNER_TEMP/personal_research_digest.json" nasdaq-xray/personal_research_signal_digest.json
          git config user.name xray-personal-eod-bot
          git config user.email xray-personal-eod-bot@users.noreply.github.com
          git add nasdaq-xray/personal_research_signal_digest.json
          if git diff --cached --quiet; then
            echo "XRAY_PERSONAL_DIGEST=EXACT_DUPLICATE_NO_WRITE"
            exit 0
          fi
          git commit -m "chore(xray): publish personal research WATCH digest only [skip ci]"
          git push origin HEAD:main || {
            echo "XRAY_PERSONAL_DIGEST=CAS_RACE_NO_FALSE_PUBLICATION"
            exit 0
          }
          echo "XRAY_PERSONAL_DIGEST=PUBLISHED_RESEARCH_ONLY_NO_R92"
      - name: Archive explicit source diagnostics without vendor bars
        if: steps.input.outputs.source_head != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-personal-eod-research-digest-no-ohlcv
          path: |
            ${{ runner.temp }}/personal_research_digest.json
            ${{ runner.temp }}/personal_research_diagnostics.json
          retention-days: 7
          if-no-files-found: ignore
