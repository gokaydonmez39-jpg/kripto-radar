name: XRAY Immutable Delivery Dual-Job Pinned Action Guard
on:
  push:
    paths:
      - "nasdaq-xray/immutable_action_dependency_guard.py"
      - ".github/workflows/xray-immutable-delivery-two-jobs-offline.yml"
  pull_request:
    paths:
      - "nasdaq-xray/immutable_action_dependency_guard.py"
      - ".github/workflows/xray-immutable-delivery-two-jobs-offline.yml"
permissions:
  contents: read
concurrency:
  group: xray-immutable-delivery-two-jobs
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify all 16 critical workflows and both independent delivery jobs
        run: |
          python -m py_compile nasdaq-xray/immutable_action_dependency_guard.py
          python nasdaq-xray/immutable_action_dependency_guard.py
          python -O nasdaq-xray/immutable_action_dependency_guard.py