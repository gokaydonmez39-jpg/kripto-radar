name: XRAY v33 FISV CCC Exact260 SIP History Identity Shadow (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/xray_v33_fisv_ccc_exact260_shadow.py"
      - ".github/workflows/xray-v33-fisv-ccc-260-sip-history-shadow.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/xray_v33_fisv_ccc_exact260_shadow.py"
      - ".github/workflows/xray-v33-fisv-ccc-260-sip-history-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-v33-fisv-ccc-260-sip-shadow-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-readonly-260-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install existing market-calendar dependency
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Verify offline 260-day PIT and mutation guards, no provider IO
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/xray_v33_fisv_ccc_exact260_shadow.py
          python nasdaq-xray/xray_v33_fisv_ccc_exact260_shadow.py --selftest
          python -O nasdaq-xray/xray_v33_fisv_ccc_exact260_shadow.py --selftest
      - name: Probe two current UNKNOWN histories, at most three pages
        if: \${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          XRAY_ALPACA_DATA_KEY_ID: \${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: \${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          python nasdaq-xray/xray_v33_fisv_ccc_exact260_shadow.py --out "$RUNNER_TEMP/xray_v33_fisv_ccc_260_counts_only.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_v33_fisv_ccc_260_counts_only.json"
          d=json.loads(p.read_text())
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO" and d["unknown_never_pass"]
          assert d["page_requests"]<=3 and d["sample_size"]==2
          assert d["C417_PASS"] is False and d["R92_created"] is False
          assert d["canonical_price_or_history_changed"] is False
          assert d["corporate_action_PIT_proven"] is False
          assert d["runner_source_rights_attested"] is False
          assert d["no_raw_vendor_bars_persisted"] is True
          assert set(d["histories"]).issubset({"FISV","CCC"})
          for k,v in d["histories"].items():
              assert v["full_c417_history_authority"] is False
              assert v["requested_official_sessions"]==260
          assert not any(k in d for k in ("bars","trades","ohlcv","credentials","prices"))
          print("XRAY_V33_SIP_HISTORY_SOURCE_COUNTS_ONLY="+json.dumps(d,sort_keys=True))
          PY
      - name: Archive counts and status only
        if: \${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-v33-fisv-ccc-260-research-counts-no-alpha
          path: \${{ runner.temp }}/xray_v33_fisv_ccc_260_counts_only.json
          retention-days: 7
          if-no-files-found: warn
