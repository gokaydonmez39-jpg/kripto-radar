name: XRAY MC Zero-Dollar Successor Shadow Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nasdaq-xray/mc_zero_dollar_successor_shadow_audit.py'
      - 'nasdaq-xray/canonical_current_terminal.json'
      - 'nasdaq-xray/canonical_current_price_dv30.json'
      - 'nasdaq-xray/canonical_mc_bridge_*.json'
      - 'nasdaq-xray/nasdaq_screener_pit_current.json'
      - 'nasdaq-xray/sec_companyfacts_probe.json'
      - '.github/workflows/xray-mc-zero-dollar-successor-shadow-audit.yml'

permissions:
  contents: read

concurrency:
  group: xray-mc-zero-dollar-successor-shadow-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and deterministic selftest
        run: |
          python -m py_compile nasdaq-xray/mc_zero_dollar_successor_shadow_audit.py
          python nasdaq-xray/mc_zero_dollar_successor_shadow_audit.py --selftest
      - name: Build current shadow audit
        run: python nasdaq-xray/mc_zero_dollar_successor_shadow_audit.py
      - name: Fail-closed audit contract
        run: |
          python - <<'PY'
          import json
          p="nasdaq-xray/mc_zero_dollar_successor_shadow_audit.json"
          j=json.load(open(p,encoding="utf-8"))
          assert j["schema"]=="XRAY_MC_ZERO_DOLLAR_SUCCESSOR_SHADOW_AUDIT_V1"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["unknown_never_pass"] is True
          assert j["alpha_authority"] is False
          assert j["production_policy_changed"] is False
          assert j["production_classification_applied"] is False
          assert j["production_changes"]==0
          assert j["successor_activation"]=="FORBIDDEN_SHADOW_ONLY"
          assert j["unknown_count"]==len(j["unknown_symbols"])==len(j["rows"])
          assert set(j["rows"])==set(j["unknown_symbols"])
          assert all(r["production_status_before"]=="MC_UNKNOWN" for r in j["rows"].values())
          assert all(r["production_status_after"]=="MC_UNKNOWN" for r in j["rows"].values())
          print({
            "XRAY_MC_ZERO_DOLLAR_SUCCESSOR_SHADOW_AUDIT":"PASS",
            "unknown_count":j["unknown_count"],
            "production_changes":j["production_changes"],
            "sec_transport_status":j["sec_transport_status"],
            "exact_pit_unknown_count":j["exact_same_asof_post_close_nasdaq_pit_unknown_count"],
            "shadow_candidate_counts":j["shadow_candidate_counts"],
          })
          PY
      - name: Upload shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: xray-mc-zero-dollar-successor-shadow-audit
          path: nasdaq-xray/mc_zero_dollar_successor_shadow_audit.json
          retention-days: 14
