name: XRAY Personal 477 EOD Daily Health (Research Only)
# XRAY_RECOVERY_20261105: controlled one-shot 2026-11-04 XNAS EOD re-entry through EXISTING main push trigger; NO NEW CRON/NO_ORDERS; provenance=push, not schedule.
# XRAY A31 completed-28-Oct EOD idempotency check (existing workflow push):
# replay MUST keep ASOF|SYMBOL key counts constant, preserve immutable stops,
# pass Google Sheet write/readback, lifecycle and full PANEL reconciliation.
# No extra cadence, generated alarms, trading or crypto-related modification.
# XRAY 2026-10-28 after-close controlled START/FINAL activation: comment-only.
# This protected main push is offline-only; no private EOD or Sheet writes.
# Only genuine schedule may start private EOD and lifecycle jobs.
# workflow_dispatch remains an OFFLINE-ONLY diagnostic trigger without vendor
# reads, Sheet writes, recovery epoch ownership or ChatGPT delivery.
# Single cron refresh; EOD signal rules, source hashes and outbox unchanged.
# A19 one-shot workflow_run integration acceptance:
# A protected-main push to this FILE executes only the offline EOD guard;
# it cannot run the 477 data plane, even after the market close (no vendor
# market bars, new AL, Sheet writes or notification). A genuine scheduled
# completed EOD emits workflow_run for the already-installed protected
# A14 research shadow; that downstream job must independently attest its
# origin and emit SKIPPED_NO_COMPLETED_CURRENT_XNAS_SESSION_NO_DATA_USED.
# NO cron added; no production AL or lifecycle code changed.
on:
  pull_request:
    branches: [main]
    paths:
      - 'personal-swing/**'
      - '.github/workflows/xray-personal-477-eod.yml'
  # One offline-only smoke run when this workflow itself changes on main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/xray-personal-477-eod.yml'
  workflow_dispatch:
    inputs:
      asof_et:
        description: 'Optional official XNAS completed session YYYY-MM-DD for verified delayed fallback; empty = auto-current'
        required: false
        type: string
        default: ''
  schedule:
    # 23:16 UTC is safely AFTER official 16:00 NY close+45m;
    # actual margin varies by DST (summer >3h, winter >2h).
    - cron: '16 23 * * 1-5'
permissions:
  contents: read
  actions: read
concurrency:
  # Offline pull requests must not evict a queued scheduled private EOD.
  # Only genuine schedule is production: diagnostics use run-unique groups.
  # Manual workflow_dispatch must never replace a pending natural EOD.
  group: ${{ github.event_name == 'schedule' && github.run_attempt == 1 && 'xray-personal-477-daily-eod' || format('xray-personal-477-daily-eod-test-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  offline-guard:
    outputs:
      natural_eod_eligible: ${{ steps.natural_receipt.outputs.eligible }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # This permits GET of the current scheduled workflow run only.
    # No tag/ref writes, no orders, no extra schedule.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Calendar and regression dependencies
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Independently run clean B note venv import canary (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          # Never borrow installed modules or secrets from another CI job.
          # The same package set and imports are required by natural B proof.
          python3 -m venv "$RUNNER_TEMP/xray-source-note-offline"
          "$RUNNER_TEMP/xray-source-note-offline/bin/python" -m pip install --disable-pip-version-check -r personal-swing/requirements.txt 'google-auth>=2.35,<3' 'requests>=2.31,<3'
          "$RUNNER_TEMP/xray-source-note-offline/bin/python" - <<'PY'
          import sys
          import exchange_calendars
          import google.oauth2.service_account
          sys.path.insert(0, 'personal-swing')
          import private_sheet_writer
          import daily_job
          import publish_b_source_note
          PY
      - name: Static tests before any data API access
        working-directory: personal-swing
        run: |
          python -m unittest -q test_ci_v6 test_v6_alpaca_rest test_research_evidence test_research_validation test_handoff_guard test_private_sheet_writer test_private_lifecycle test_panel_reconciler test_al_outbox_producer test_xray_guardian test_provider_read_retry
          python -O -m unittest -q test_ci_v6 test_v6_alpaca_rest test_research_evidence test_research_validation test_handoff_guard test_private_sheet_writer test_private_lifecycle test_panel_reconciler test_al_outbox_producer test_xray_guardian test_provider_read_retry
          python -m unittest -q test_swing_score_daily
          python -m unittest discover -s ../tests -p test_publish_b_source_note.py
          python -O -m unittest -q test_swing_score_daily
          python -m unittest -q test_xnas_incident_boundaries_202611
          python -O -m unittest -q test_xnas_incident_boundaries_202611
          python -m unittest -q test_delivery_evidence_audit
          python -O -m unittest -q test_delivery_evidence_audit
          python -m unittest -q test_private_ledger_capacity
          python -O -m unittest -q test_private_ledger_capacity
          python -m py_compile delivery_evidence_audit.py
          python -m py_compile swing_score_daily.py
          python -m py_compile alert_ledger_contract.py
          python -O -m py_compile alert_ledger_contract.py
          python -m py_compile engine.py runner.py daily_job.py tracker.py
          python -m py_compile private_sheet_writer.py
          python -m py_compile private_lifecycle.py
          python -m py_compile alert_outbox_producer.py test_al_outbox_producer.py
          python -m py_compile xray_guardian.py test_xray_guardian.py
          python -m py_compile test_provider_read_retry.py
      - name: Personal scheduler and official research-shadow fail-closed contracts
        working-directory: personal-swing
        run: |
          python -m unittest -q test_schedule_failover
          python -O -m unittest -q test_schedule_failover
          python -m unittest -q test_natural_run_readonly_probe
          python -O -m unittest -q test_natural_run_readonly_probe
          python -m unittest -q test_natural_holiday_guard test_downstream_eod_gate
          python -O -m unittest -q test_natural_holiday_guard test_downstream_eod_gate
          python -m py_compile natural_run_readonly_probe.py
          # Fail-closed if GitHub delivers a natural EOD after the safe source window.
          python -m unittest -q test_natural_eod_expiry_guard
          python -O -m unittest -q test_natural_eod_expiry_guard
          # Research-only NEON: real 477 PIT master, 52 XNAS bars, no broker/push.
          python -m unittest -q test_neon_shadow_v3 test_neon_shadow_wiring
          python -O -m unittest -q test_neon_shadow_v3 test_neon_shadow_wiring
          python -m py_compile neon_shadow_v3.py daily_job.py test_neon_shadow_wiring.py
          # NEON 477 full private archive: exact scan/run proof, N/A, dedupe.
          python -m unittest -q test_neon_private_ledger_v3
          python -O -m unittest -q test_neon_private_ledger_v3
          python -m py_compile neon_private_ledger_v3.py
          cd research_lab
          python -m unittest -q test_official_shadow_477 test_official_eod_shadow_receipt test_official_guard_cutoff_select
          python -O -m unittest -q test_official_shadow_477 test_official_eod_shadow_receipt test_official_guard_cutoff_select
          python -m py_compile official_shadow_477.py official_eod_shadow_receipt.py official_guard_cutoff_select.py
      - name: Require real natural EOD GitHub-run receipt (GET only, no tag claim)
        id: natural_receipt
        if: ${{ github.event_name == 'schedule' }}
        working-directory: personal-swing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python natural_run_readonly_probe.py --verify | tee "$RUNNER_TEMP/xray-natural-receipt.json"
          python - <<'PY_GATE'
          import json, os
          from natural_holiday_guard import private_jobs_eligible
          with open(os.path.join(os.environ['RUNNER_TEMP'],'xray-natural-receipt.json'),encoding='utf-8') as f:
              eligible=private_jobs_eligible(json.load(f))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('eligible='+('true' if eligible else 'false')+'\n')
          PY_GATE
      - name: Read-only immutable epoch lease credential witness (no tag writes)
        if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && steps.natural_receipt.outputs.eligible == 'true' }}
        working-directory: personal-swing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Advisory readiness only. Never create tag/ref or permit Sheet/AL.
          # GitHub may hide bypass metadata from this scoped credential;
          # an inconclusive GET must not suppress a valid natural EOD scan.
          if python epoch_lease.py --verify-tag-protection; then
            echo 'EPOCH_LEASE_READINESS=TAG_RULESET_GET_VERIFIED_NOT_ACQUIRED'
          else
            echo 'EPOCH_LEASE_READINESS=HOLD_TAG_RULESET_CREDENTIAL_UNVERIFIED'
          fi
  daily-private-scan:
    needs: offline-guard
    if: github.event_name == 'schedule' && needs.offline-guard.outputs.natural_eod_eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    # This is the ONE existing schedule-only job with Git ref write access.
    # All PR/push/manual jobs and the other five EOD jobs stay read-only.
    permissions:
      contents: write
      actions: read
    # This job does not export signals, raw bars, or journal to public repo.
    env:
      GITHUB_TOKEN: ${{ github.token }}
      XRAY_PERSONAL477_SOURCE_LASTMILE_MODE: ENFORCE_GET
      XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
      XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install XNAS calendar
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Require data-only keys, do not print secrets
        shell: bash
        run: |
          if [[ -z "$XRAY_ALPACA_DATA_KEY_ID" || -z "$XRAY_ALPACA_DATA_SECRET_KEY" ]]; then
            echo 'BLOCKED_MISSING_DATA_ONLY_API_CREDENTIALS' >&2
            exit 3
          fi
      - name: Run no-broker personal EOD scan (ephemeral private data)
        shell: bash
        working-directory: personal-swing
        env:
          REQUESTED_ASOF: ${{ inputs.asof_et }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$REQUESTED_ASOF" ]]; then
            [[ "$REQUESTED_ASOF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'BLOCKED_INVALID_WORKFLOW_DISPATCH_ASOF'; exit 2; }
            args+=(--asof "$REQUESTED_ASOF")
          fi
          python daily_job.py --dir "$RUNNER_TEMP/xray-private-data" --watchlist-file nasdaq_watchlist_477.json --batch-size 10 --github-safe-log --neon-shadow "${args[@]}"
      - name: Verify exact private 477-scoped handoff without publishing signals
        working-directory: personal-swing
        shell: bash
        env:
          REQUESTED_ASOF: ${{ inputs.asof_et }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import runner
          import handoff_guard
          path=Path(os.environ['RUNNER_TEMP'])/'xray-private-data'/'latest.json'
          requested=os.environ.get('REQUESTED_ASOF','').strip()
          if not path.exists():
              # Workflow-file push before the market close is a safe no-op.
              import daily_job
              if requested or daily_job.current_completed_session() is not None:
                  raise RuntimeError('MISSING_PRIVATE_LATEST_WHILE_ELIGIBLE')
              print('XRAY_PERSONAL_NOOP_PRE_SESSION_NO_MARKET_DATA')
              raise SystemExit(0)
          snap=json.loads(path.read_text(encoding='utf-8'))
          if requested and snap.get('asof_et')!=requested:
              raise RuntimeError('WORKFLOW_DISPATCH_ASOF_MISMATCH')
          symbols=runner.get_scope(watchlist_file='nasdaq_watchlist_477.json',asof=snap.get('asof_et'))
          # Explicit exceptions, never Python assert (disabled under -O).
          handoff_guard.validate_snapshot(snap,symbols,
              scope_sha=runner.sha_symbols(symbols),
              policy_sha=runner.analysis_fingerprint())
          print('XRAY_PERSONAL_GITHUB_HANDOFF=PASS_477_477_SOURCE_POLICY_SHA_BOUND_PRIVATE')
          PY
      - name: Bounded natural Git protected-tag first-claim canary
        # Advisory: this step is NOT the Sheet lease release. On any unknown
        # provider outcome the canonical Google CAS EOD still runs as before.
        # No manual source, no retry and no protected-tag re-entry.
        if: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
        working-directory: personal-swing
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python epoch_natural_claim_canary.py --schedule-canary
      - name: Private Google Sheets writer (authorized service account only)
        working-directory: personal-swing
        shell: bash
        env:
          XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
          XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/xray-private-data/latest.json"
          if [[ ! -f "$path" ]]; then
            echo 'PRIVATE_SHEET_SYNC=SKIPPED_NO_COMPLETED_SESSION'
            exit 0
          fi
          if [[ -z "$XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON" || -z "$XRAY_PRIVATE_SPREADSHEET_ID" ]]; then
            echo 'PRIVATE_SHEET_SYNC=BLOCKED_NO_AUTH_OR_PRIVATE_ID_NOT_A_DELIVERY_PASS'
            exit 3
          fi
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3' >/dev/null
          python private_sheet_writer.py --snapshot "$path"
      - name: Reserve verified new AL events PENDING in private outbox (NO PUSH)
        working-directory: personal-swing
        shell: bash
        env:
          XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
          XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/xray-private-data/latest.json"
          if [[ ! -f "$path" ]]; then
            echo 'AL_OUTBOX=SKIPPED_NO_COMPLETED_SESSION'
            exit 0
          fi
          if [[ -z "$XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON" || -z "$XRAY_PRIVATE_SPREADSHEET_ID" ]]; then
            echo 'AL_OUTBOX=BLOCKED_NO_PRIVATE_AUTH; NO_DEVICE_ACK'
            exit 3
          fi
          # Only an overdue prior episode triggers the existing lifecycle
          # before AL reservation. Normal sessions make no extra vendor call.
          # A missing/failed prior history must stop this reservation.
          asof="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["asof_et"])' "$path")"
          python private_lifecycle.py --asof "$asof" --before-al-reservation
          python alert_outbox_producer.py --snapshot "$path"
      - name: No public delivery of private signals
        run: echo 'Only authenticated Google Sheets API can persist private candidate rows; private writer readback is independent of GitHub success; no push/device ACK is claimed.'
      - name: Private NEON 477 full-row archive (advisory; NEVER AL, order or push)
        id: neon_private_archive
        if: github.event_name == 'schedule'
        continue-on-error: true
        working-directory: personal-swing
        shell: bash
        env:
          XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
          XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/xray-private-data/latest.json"
          if [[ ! -f "$snapshot" ]]; then
            echo 'archive_state=SKIPPED_NO_FINAL' >> "$GITHUB_OUTPUT"
            echo 'NEON_LEDGER=SKIPPED_NO_FINAL; DELIVERY=UNKNOWN'
            exit 0
          fi
          # Use exact private snapshot ASOF; never infer an epoch from UTC date.
          asof=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["asof_et"])' "$snapshot")
          shadow="$RUNNER_TEMP/xray-private-data/neon_shadow_v3_${asof}.json"
          python neon_private_ledger_v3.py --snapshot "$snapshot" --shadow "$shadow"
          # Only after the private ledger executable exits zero; this is NOT
          # a ChatGPT/iPhone delivery acknowledgment or a new AL authority.
          echo 'archive_state=PRIVATE_READBACK_RETURNED' >> "$GITHUB_OUTPUT"
      - name: Redacted NEON archive raw outcome (no private rows)
        if: ${{ always() && github.event_name == 'schedule' }}
        shell: bash
        env:
          NEON_RAW_OUTCOME: ${{ steps.neon_private_archive.outcome }}
          NEON_ARCHIVE_STATE: ${{ steps.neon_private_archive.outputs.archive_state }}
        run: |
          set -euo pipefail
          # Raw outcome (NOT conclusion) preserves failure under continue-on-error.
          # Report only fixed literals; never echo private rows, symbols, or URLs.
          if [[ "$NEON_RAW_OUTCOME" == "failure" ]]; then
            echo 'NEON_PRIVATE_ARCHIVE=FAILED_ADVISORY; DELIVERY=UNKNOWN' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$NEON_RAW_OUTCOME" == "success" && "$NEON_ARCHIVE_STATE" == "SKIPPED_NO_FINAL" ]]; then
            echo 'NEON_PRIVATE_ARCHIVE=SKIPPED_NO_FINAL; DELIVERY=UNKNOWN' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$NEON_RAW_OUTCOME" == "success" && "$NEON_ARCHIVE_STATE" == "PRIVATE_READBACK_RETURNED" ]]; then
            echo 'NEON_PRIVATE_ARCHIVE=STEP_SUCCESS_READBACK_REPORTED; DELIVERY=UNKNOWN' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NEON_PRIVATE_ARCHIVE=HOLD_UNVERIFIED_OUTCOME; DELIVERY=UNKNOWN' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Optional official 477 PIT-aware shadow ledger (NO AL, no market provider HTTP, no Sheet)
        # This sidecar is strictly after normal private Sheet readback.
        # No completed EOD => explicit SKIP, never a false 477-shadow PASS.
        # Its failure cannot suppress or alter the original AL decisions.
        continue-on-error: true
        working-directory: personal-swing
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/xray-private-data/latest.json"
          receipt="$RUNNER_TEMP/xray-private-data/official_shadow_477.json"
          if [[ ! -f "$snapshot" ]]; then
            echo 'OFFICIAL_SHADOW=SKIPPED_NO_COMPLETED_SCAN; ROWS=0; PIT=UNKNOWN' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          guard=../nasdaq-xray/canonical_official_source_guard.json
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            guard="$RUNNER_TEMP/xray-private-data/official_guard_at_cutoff.json"
            if ! timeout 60s python research_lab/official_guard_cutoff_select.py \
                --snapshot "$snapshot" --ref "$GITHUB_SHA" --out "$guard"; then
              echo 'OFFICIAL_SHADOW=HOLD_NO_VERIFIED_TIMELY_REPO_WITNESS; ROWS=0; PIT=UNKNOWN; NO_MARKET_CLEARANCE' >> "$GITHUB_STEP_SUMMARY"
              exit 4
            fi
          fi
          if ! python research_lab/official_shadow_477.py \
            --snapshot "$snapshot" \
            --watchlist nasdaq_watchlist_477.json \
            --guard "$guard" \
            --out "$receipt"; then
            echo 'OFFICIAL_SHADOW=FAILED_INDEPENDENT_NOT_MARKET_CLEARANCE' >> "$GITHUB_STEP_SUMMARY"
            exit 4
          fi
          if ! python research_lab/official_eod_shadow_receipt.py \
            --snapshot "$snapshot" \
            --receipt "$receipt" \
            --guard "$guard"; then
            echo 'OFFICIAL_SHADOW=FAILED_INDEPENDENT_NOT_MARKET_CLEARANCE' >> "$GITHUB_STEP_SUMMARY"
            exit 4
          fi
          echo 'OFFICIAL_SHADOW=RECEIPT_VERIFIED_RESEARCH_ONLY; ROWS=477; PIT=UNKNOWN; NO_AL_CHANGES; NO_ORDERS; NO_SHEETS; NO_MARKET_PROVIDER_REQUESTS' >> "$GITHUB_STEP_SUMMARY"

  private-sheets-auth-preflight:
    needs: offline-guard
    if: github.event_name == 'schedule' && needs.offline-guard.outputs.natural_eod_eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
      XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned calendar and Google auth for private metadata read
        run: |
          python -m pip install -r personal-swing/requirements.txt
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3'
      - name: Verify service-account access and private worksheet headers without writes
        working-directory: personal-swing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,sys
          try:
              from private_sheet_writer import (
                  SheetApi,rows_only,CANDIDATE_HEADER,SCAN_HEADER,require)
              from private_lifecycle import ALERT_HEADER
              credential=os.environ.get('XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON','')
              spreadsheet=os.environ.get('XRAY_PRIVATE_SPREADSHEET_ID','')
              require(bool(credential) and bool(spreadsheet),
                      'PRIVATE_AUTH_OR_SHEET_ID_MISSING')
              api=SheetApi(credential)
              api.check_metadata()
              rows_only(api.read('ADAY_GECMISI','M'),CANDIDATE_HEADER)
              rows_only(api.read('TARAMA_KAYITLARI','J'),SCAN_HEADER)
              alert_data=api.read('UYARI_OLAYLARI','T')
              require(bool(alert_data) and tuple(alert_data[0])==ALERT_HEADER,
                      'PRIVATE_ALERT_HEADER_DRIFT')
              print('PRIVATE_SHEETS_PREFLIGHT=READ_PASS_WRITE_NOT_VERIFIED')
          except Exception as exc:
              # Public Actions log must NOT contain credentials, private data,
              # spreadsheet ID, exception message, HTTP body or bearer token.
              print('PRIVATE_SHEETS_PREFLIGHT=BLOCKED_'+type(exc).__name__)
              sys.exit(3)
          PY

  private-episode-followups:
    # Independent even when 477 full-universe producer fails.
    # The single private sheet is read after that job has stopped writing.
    needs: [offline-guard, daily-private-scan]
    if: always() && needs.offline-guard.result == 'success' && github.event_name == 'schedule' && needs.offline-guard.outputs.natural_eod_eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    # Raw step outcome precedes continue-on-error (unlike conclusion).
    outputs:
      swing_score_outcome: ${{ steps.daily_swing_score.outcome }}
      swing_score_status: ${{ steps.daily_swing_score.outputs.score_status }}
      swing_score_asof: ${{ steps.daily_swing_score.outputs.score_asof_et }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      XRAY_PERSONAL477_SOURCE_LASTMILE_MODE: ENFORCE_GET
      XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
      XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
      XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
      XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
      REQUESTED_ASOF: ${{ inputs.asof_et }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install calendar and private Google API dependencies
        run: |
          python -m pip install -r personal-swing/requirements.txt
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3'
      - name: Track each open private episode from exact completed XNAS daily IEX bars
        working-directory: personal-swing
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$REQUESTED_ASOF" ]]; then
            args+=(--asof "$REQUESTED_ASOF")
          fi
          python private_lifecycle.py "${args[@]}"
      - name: Reconcile PANEL from verified private scan and immutable candidate ledger
        working-directory: personal-swing
        run: |
          set -euo pipefail
          python panel_reconciler.py
      - name: Private EOD swing ranking V1 (advisory; never blocks AL or Guardian)
        id: daily_swing_score
        continue-on-error: true
        working-directory: personal-swing
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$REQUESTED_ASOF" ]]; then
            args+=(--asof "$REQUESTED_ASOF")
          fi
          python swing_score_daily.py "${args[@]}"
      - name: Private follow-up does not claim device delivery
        run: echo 'GitHub followup only updates proven dated theoretical status; GitHub verified EOD outbox producer owns AL event reservation; ChatGPT task alone may produce Premium user-facing notifications, and no iPhone/device ACK is claimed.'

  guardian-acceptance:
    # Second independent private readback after EOD/episode/PANEL writers.
    # No new cron, no extra ChatGPT task and no phone delivery claim.
    needs: [offline-guard, daily-private-scan, private-sheets-auth-preflight, private-episode-followups]
    if: ${{ always() && github.event_name == 'schedule' && needs.offline-guard.outputs.natural_eod_eligible == 'true' && needs.daily-private-scan.result == 'success' && needs.private-sheets-auth-preflight.result == 'success' && needs.private-episode-followups.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      XRAY_PERSONAL477_SOURCE_LASTMILE_MODE: ENFORCE_GET
      XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
      XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
      REQUESTED_ASOF: ${{ inputs.asof_et }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned XNAS calendar and authenticated Sheets readback
        run: |
          python -m pip install -r personal-swing/requirements.txt
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3'
      - name: Independent Guardian gates and bounded PANEL-only self-repair
        working-directory: personal-swing
        shell: bash
        run: |
          set -euo pipefail
          args=(--expected-run-id "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/xray-personal-guardian.json")
          if [[ -n "$REQUESTED_ASOF" ]]; then
            [[ "$REQUESTED_ASOF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
              echo 'XRAY_GUARDIAN=BLOCKED_INVALID_REQUESTED_ASOF'
              exit 3
            }
            args+=(--expected-asof "$REQUESTED_ASOF")
          fi
          python xray_guardian.py "${args[@]}"
      - name: Advisory delivery/score audit (read-only; cannot claim ChatGPT ACK)
        continue-on-error: true
        working-directory: personal-swing
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$REQUESTED_ASOF" ]]; then
            args+=(--expected-asof "$REQUESTED_ASOF")
          fi
          python delivery_evidence_audit.py "${args[@]}"
      - name: Publish only redacted aggregate Guardian receipt (no identities)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xray-personal-guardian-redacted
          path: ${{ runner.temp }}/xray-personal-guardian.json
          if-no-files-found: warn
          retention-days: 14

  daily-private-score-acceptance:
    # Guardian remains independently successful even if advisory score fails.
    # An incomplete daily score can never turn the entire EOD green.
    # No IEX, extra cron, orders or delivery here. The optional proof bridge only
    # annotates the verified current SUMMARY link cell. It cannot reserve a delivery.
    needs: [offline-guard, guardian-acceptance, private-episode-followups]
    if: ${{ always() && github.event_name == 'schedule' && needs.offline-guard.outputs.natural_eod_eligible == 'true' && needs.guardian-acceptance.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      XRAY_PERSONAL477_SOURCE_LASTMILE_MODE: ENFORCE_GET
    steps:
      - name: Gate raw score outcome after Guardian (fail closed)
        shell: bash
        env:
          SCORE_OUTCOME: ${{ needs.private-episode-followups.outputs.swing_score_outcome }}
          SCORE_STATUS: ${{ needs.private-episode-followups.outputs.swing_score_status }}
          SCORE_ASOF: ${{ needs.private-episode-followups.outputs.swing_score_asof }}
          EVENT_KIND: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$SCORE_OUTCOME" == "success" ]] || {
            echo 'XRAY_DAILY_SWING_SCORE=HOLD_STEP_FAILURE' >&2
            exit 3
          }
          # A success exit with no completed market session is NOT a verified
          # EOD score. A pre-session code push can remain a safe no-op, but
          # cannot claim EOD readback. A scheduled EOD without data is HOLD.
          if [[ "$SCORE_STATUS" == "SWING_SCORE_NO_COMPLETED_SESSION" ]]; then
            if [[ "$EVENT_KIND" == "push" && -z "$SCORE_ASOF" ]]; then
              echo 'XRAY_DAILY_SWING_SCORE=NOT_DUE_PRE_SESSION_NO_DAILY_ACCEPTANCE'
              exit 0
            fi
            echo 'XRAY_DAILY_SWING_SCORE=HOLD_NO_ELIGIBLE_SCHEDULE_SESSION' >&2
            exit 3
          fi
          if [[ "$SCORE_STATUS" != "SWING_SCORE_PRIVATE_READBACK_PASS" &&
                "$SCORE_STATUS" != "SWING_SCORE_IDEMPOTENT_READBACK_PASS" ]]; then
            echo 'XRAY_DAILY_SWING_SCORE=HOLD_NO_VALID_READBACK_RECEIPT' >&2
            exit 3
          fi
          if [[ ! "$SCORE_ASOF" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo 'XRAY_DAILY_SWING_SCORE=HOLD_INVALID_RECEIPT_ASOF' >&2
            exit 3
          fi
          echo "XRAY_DAILY_SWING_SCORE=PRIVATE_READBACK_PASS_ASOF_${SCORE_ASOF}_NOT_CHATGPT_DELIVERY"
      - name: Load NASDAQ source evidence bridge (schedule only)
        id: source-note-checkout
        if: ${{ success() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare private Sheet proof bridge dependencies (schedule only)
        id: source-note-deps
        if: ${{ success() && steps.source-note-checkout.outcome == 'success' && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
        timeout-minutes: 3
        run: |
          python3 -m venv "$RUNNER_TEMP/xray-source-note"
          # New venv does NOT inherit XNAS scanner packages from another job.
          # The B proof transport authenticates its Google API POST only after
          # daily_job/engine recompute the current official XNAS session.
          "$RUNNER_TEMP/xray-source-note/bin/python" -m pip install --disable-pip-version-check -r personal-swing/requirements.txt 'google-auth>=2.35,<3' 'requests>=2.31,<3'
          # Pure import smoke: no token, provider request, broker or Sheet POST.
          "$RUNNER_TEMP/xray-source-note/bin/python" - <<'PY'
          import sys
          import exchange_calendars
          import google.oauth2.service_account
          sys.path.insert(0, 'personal-swing')
          import private_sheet_writer
          import daily_job
          import publish_b_source_note
          PY
      - name: Attach and verify current B evidence note (schedule only)
        id: source-note-attach
        if: ${{ success() && steps.source-note-deps.outcome == 'success' && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          XRAY_PERSONAL477_SOURCE_LASTMILE_MODE: ENFORCE_GET
          XRAY_SCORE_ASOF: ${{ needs.private-episode-followups.outputs.swing_score_asof }}
          XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
          XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
        run: '"$RUNNER_TEMP/xray-source-note/bin/python" personal-swing/publish_b_source_note.py'
      - name: Publish redacted B evidence acceptance
        if: ${{ always() && github.event_name == 'schedule' }}
        shell: bash
        env:
          B_SOURCE_NOTE_OUTCOME: ${{ steps.source-note-attach.outcome }}
          B_SOURCE_DEPS_OUTCOME: ${{ steps.source-note-deps.outcome }}
          B_SOURCE_CHECKOUT_OUTCOME: ${{ steps.source-note-checkout.outcome }}
        run: |
          set -euo pipefail
          if [[ "$B_SOURCE_NOTE_OUTCOME" == "success" &&
                "$B_SOURCE_DEPS_OUTCOME" == "success" &&
                "$B_SOURCE_CHECKOUT_OUTCOME" == "success" ]]; then
            echo 'XRAY_B_SOURCE_NOTE=PASS_READBACK_NOT_DEVICE_ACK' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'XRAY_B_SOURCE_NOTE=HOLD_NO_READBACK' >> "$GITHUB_STEP_SUMMARY"
          fi
