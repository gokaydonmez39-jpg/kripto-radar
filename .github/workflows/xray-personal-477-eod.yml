name: XRAY Personal 477 EOD Daily Health (Research Only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'personal-swing/**'
      - '.github/workflows/xray-personal-477-eod.yml'
  # One controlled smoke run when this workflow itself changes on main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/xray-personal-477-eod.yml'
  workflow_dispatch:
  schedule:
    # 23:15 UTC is after 16:00 NY RTH close + 45m in both DST seasons.
    - cron: '15 23 * * 1-5'
permissions:
  contents: read
concurrency:
  group: xray-personal-477-daily-eod
  cancel-in-progress: false
jobs:
  offline-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Calendar and regression dependencies
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Static tests before any data API access
        working-directory: personal-swing
        run: |
          python -m unittest -q test_ci_v6 test_v6_alpaca_rest test_research_evidence test_research_validation
          python -O -m unittest -q test_ci_v6 test_v6_alpaca_rest test_research_evidence test_research_validation
  daily-private-scan:
    needs: offline-guard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    # This job does not export signals, raw bars, or journal to public repo.
    env:
      XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
      XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install XNAS calendar
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Require data-only keys, do not print secrets
        shell: bash
        run: |
          if [[ -z "$XRAY_ALPACA_DATA_KEY_ID" || -z "$XRAY_ALPACA_DATA_SECRET_KEY" ]]; then
            echo 'BLOCKED_MISSING_DATA_ONLY_API_CREDENTIALS' >&2
            exit 3
          fi
      - name: Run no-broker personal EOD scan (ephemeral private data)
        shell: bash
        working-directory: personal-swing
        run: |
          python daily_job.py --dir "$RUNNER_TEMP/xray-private-data" --watchlist-file nasdaq_watchlist_477.json --batch-size 10 --github-safe-log
      - name: Verify exact private 477-scoped handoff without publishing signals
        working-directory: personal-swing
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          import runner
          path=Path(os.environ['RUNNER_TEMP'])/'xray-private-data'/'latest.json'
          snap=json.loads(path.read_text(encoding='utf-8'))
          symbols=runner.get_scope(watchlist_file='nasdaq_watchlist_477.json')
          assert len(symbols)==len(set(symbols))==477
          assert snap.get('requested_symbols')==snap.get('processed_symbols')==477
          assert snap.get('valid_data_symbols')==477
          assert snap.get('insufficient_data_symbols')==snap.get('remaining_symbols')==0
          assert snap.get('valid_data_coverage_complete') is True
          assert snap.get('new_signal_publishable') is True
          assert snap.get('scope_sha256')==runner.sha_symbols(symbols)
          assert snap.get('analysis_fingerprint_sha256')==runner.analysis_fingerprint()
          assert len(snap.get('rows',[]))==477
          assert [row['symbol'] for row in snap['rows']]==symbols
          assert all(row.get('asof_et')==snap.get('asof_et') and
                     row.get('decision') in ('AL','IZLE','ELE')
                     for row in snap['rows'])
          print('XRAY_PERSONAL_GITHUB_HANDOFF=PASS_477_477_SOURCE_POLICY_SHA_BOUND_PRIVATE')
          PY
      - name: Data is ephemeral (intentional privacy limitation)
        run: echo 'No public signal JSON, broker API or artifacts published. Only the ChatGPT private Sheet task persists candidate history.'
