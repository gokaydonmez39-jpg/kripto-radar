name: XRAY Personal 477 EOD Daily Health (Research Only)
# A19 one-shot workflow_run integration acceptance:
# A protected-main push to this FILE runs the EXISTING EOD workflow once;
# pre-close it emits SKIPPED_NO_COMPLETED_CURRENT_ET_SESSION (no vendor
# market bars, new AL, Sheet writes or notification). GitHub's successful
# completed EOD emits workflow_run for the already-installed protected
# A14 research shadow; that downstream job must independently attest its
# origin and emit SKIPPED_NO_COMPLETED_CURRENT_XNAS_SESSION_NO_DATA_USED.
# NO cron added; no production AL or lifecycle code changed.
on:
  pull_request:
    branches: [main]
    paths:
      - 'personal-swing/**'
      - '.github/workflows/xray-personal-477-eod.yml'
  # One controlled smoke run when this workflow itself changes on main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/xray-personal-477-eod.yml'
  workflow_dispatch:
    inputs:
      asof_et:
        description: 'Optional official XNAS completed session YYYY-MM-DD for verified delayed fallback; empty = auto-current'
        required: false
        type: string
        default: ''
  schedule:
    # 23:15 UTC is safely AFTER official 16:00 NY close+45m;
    # actual margin varies by DST (summer >3h, winter >2h).
    - cron: '15 23 * * 1-5'
permissions:
  contents: read
concurrency:
  group: xray-personal-477-daily-eod
  cancel-in-progress: false
jobs:
  offline-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Calendar and regression dependencies
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Static tests before any data API access
        working-directory: personal-swing
        run: |
          python -m unittest -q test_ci_v6 test_v6_alpaca_rest test_research_evidence test_research_validation test_handoff_guard test_private_sheet_writer test_private_lifecycle
          python -O -m unittest -q test_ci_v6 test_v6_alpaca_rest test_research_evidence test_research_validation test_handoff_guard test_private_sheet_writer test_private_lifecycle
          python -m py_compile alert_ledger_contract.py
          python -O -m py_compile alert_ledger_contract.py
          python -m py_compile engine.py runner.py daily_job.py tracker.py
          python -m py_compile private_sheet_writer.py
          python -m py_compile private_lifecycle.py
  daily-private-scan:
    needs: offline-guard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    # This job does not export signals, raw bars, or journal to public repo.
    env:
      XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
      XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install XNAS calendar
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Require data-only keys, do not print secrets
        shell: bash
        run: |
          if [[ -z "$XRAY_ALPACA_DATA_KEY_ID" || -z "$XRAY_ALPACA_DATA_SECRET_KEY" ]]; then
            echo 'BLOCKED_MISSING_DATA_ONLY_API_CREDENTIALS' >&2
            exit 3
          fi
      - name: Run no-broker personal EOD scan (ephemeral private data)
        shell: bash
        working-directory: personal-swing
        env:
          REQUESTED_ASOF: ${{ inputs.asof_et }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$REQUESTED_ASOF" ]]; then
            [[ "$REQUESTED_ASOF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'BLOCKED_INVALID_WORKFLOW_DISPATCH_ASOF'; exit 2; }
            args+=(--asof "$REQUESTED_ASOF")
          fi
          python daily_job.py --dir "$RUNNER_TEMP/xray-private-data" --watchlist-file nasdaq_watchlist_477.json --batch-size 10 --github-safe-log "${args[@]}"
      - name: Verify exact private 477-scoped handoff without publishing signals
        working-directory: personal-swing
        shell: bash
        env:
          REQUESTED_ASOF: ${{ inputs.asof_et }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import runner
          import handoff_guard
          path=Path(os.environ['RUNNER_TEMP'])/'xray-private-data'/'latest.json'
          requested=os.environ.get('REQUESTED_ASOF','').strip()
          if not path.exists():
              # Workflow-file push before the market close is a safe no-op.
              import daily_job
              if requested or daily_job.current_completed_session() is not None:
                  raise RuntimeError('MISSING_PRIVATE_LATEST_WHILE_ELIGIBLE')
              print('XRAY_PERSONAL_NOOP_PRE_SESSION_NO_MARKET_DATA')
              raise SystemExit(0)
          snap=json.loads(path.read_text(encoding='utf-8'))
          if requested and snap.get('asof_et')!=requested:
              raise RuntimeError('WORKFLOW_DISPATCH_ASOF_MISMATCH')
          symbols=runner.get_scope(watchlist_file='nasdaq_watchlist_477.json')
          # Explicit exceptions, never Python assert (disabled under -O).
          handoff_guard.validate_snapshot(snap,symbols,
              scope_sha=runner.sha_symbols(symbols),
              policy_sha=runner.analysis_fingerprint())
          print('XRAY_PERSONAL_GITHUB_HANDOFF=PASS_477_477_SOURCE_POLICY_SHA_BOUND_PRIVATE')
          PY
      - name: Private Google Sheets writer (authorized service account only)
        working-directory: personal-swing
        shell: bash
        env:
          XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
          XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/xray-private-data/latest.json"
          if [[ ! -f "$path" ]]; then
            echo 'PRIVATE_SHEET_SYNC=SKIPPED_NO_COMPLETED_SESSION'
            exit 0
          fi
          if [[ -z "$XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON" || -z "$XRAY_PRIVATE_SPREADSHEET_ID" ]]; then
            echo 'PRIVATE_SHEET_SYNC=BLOCKED_NO_AUTH_OR_PRIVATE_ID_NOT_A_DELIVERY_PASS'
            exit 3
          fi
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3' >/dev/null
          python private_sheet_writer.py --snapshot "$path"
      - name: No public delivery of private signals
        run: echo 'Only authenticated Google Sheets API can persist private candidate rows; private writer readback is independent of GitHub success; no push/device ACK is claimed.'

  private-sheets-auth-preflight:
    needs: offline-guard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
      XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned calendar and Google auth for private metadata read
        run: |
          python -m pip install -r personal-swing/requirements.txt
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3'
      - name: Verify service-account access and private worksheet headers without writes
        working-directory: personal-swing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,sys
          try:
              from private_sheet_writer import (
                  SheetApi,rows_only,CANDIDATE_HEADER,SCAN_HEADER,require)
              from private_lifecycle import ALERT_HEADER
              credential=os.environ.get('XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON','')
              spreadsheet=os.environ.get('XRAY_PRIVATE_SPREADSHEET_ID','')
              require(bool(credential) and bool(spreadsheet),
                      'PRIVATE_AUTH_OR_SHEET_ID_MISSING')
              api=SheetApi(credential)
              api.check_metadata()
              rows_only(api.read('ADAY_GECMISI','M'),CANDIDATE_HEADER)
              rows_only(api.read('TARAMA_KAYITLARI','J'),SCAN_HEADER)
              alert_data=api.read('UYARI_OLAYLARI','T')
              require(bool(alert_data) and tuple(alert_data[0])==ALERT_HEADER,
                      'PRIVATE_ALERT_HEADER_DRIFT')
              print('PRIVATE_SHEETS_PREFLIGHT=READ_PASS_WRITE_NOT_VERIFIED')
          except Exception as exc:
              # Public Actions log must NOT contain credentials, private data,
              # spreadsheet ID, exception message, HTTP body or bearer token.
              print('PRIVATE_SHEETS_PREFLIGHT=BLOCKED_'+type(exc).__name__)
              sys.exit(3)
          PY

  private-episode-followups:
    # Independent even when 477 full-universe producer fails.
    # The single private sheet is read after that job has stopped writing.
    needs: [offline-guard, daily-private-scan]
    if: always() && needs.offline-guard.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
      XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
      XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
      XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
      REQUESTED_ASOF: ${{ inputs.asof_et }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install calendar and private Google API dependencies
        run: |
          python -m pip install -r personal-swing/requirements.txt
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3'
      - name: Track each open private episode from exact completed XNAS daily IEX bars
        working-directory: personal-swing
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$REQUESTED_ASOF" ]]; then
            args+=(--asof "$REQUESTED_ASOF")
          fi
          python private_lifecycle.py "${args[@]}"
      - name: Private follow-up does not claim device delivery
        run: echo 'GitHub followup only updates proven dated theoretical status; existing ChatGPT task remains responsible for outbox reservation and iPhone delivery.'
