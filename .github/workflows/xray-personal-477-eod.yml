name: XRAY Personal 477 EOD Daily Health (Research Only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'personal-swing/**'
      - '.github/workflows/xray-personal-477-eod.yml'
  # One controlled smoke run when this workflow itself changes on main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/xray-personal-477-eod.yml'
  workflow_dispatch:
    inputs:
      asof_et:
        description: 'Optional official XNAS completed session YYYY-MM-DD for verified delayed fallback; empty = auto-current'
        required: false
        type: string
        default: ''
  schedule:
    # 23:15 UTC is safely AFTER official 16:00 NY close+45m;
    # actual margin varies by DST (summer >3h, winter >2h).
    - cron: '15 23 * * 1-5'
permissions:
  contents: read
concurrency:
  group: xray-personal-477-daily-eod
  cancel-in-progress: false
jobs:
  offline-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Calendar and regression dependencies
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Static tests before any data API access
        working-directory: personal-swing
        run: |
          python -m unittest -q test_ci_v6 test_v6_alpaca_rest test_research_evidence test_research_validation test_handoff_guard test_private_sheet_writer
          python -O -m unittest -q test_ci_v6 test_v6_alpaca_rest test_research_evidence test_research_validation test_handoff_guard test_private_sheet_writer
          python -m py_compile alert_ledger_contract.py
          python -O -m py_compile alert_ledger_contract.py
          python -m py_compile engine.py runner.py daily_job.py tracker.py
          python -m py_compile private_sheet_writer.py
  daily-private-scan:
    needs: offline-guard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    # This job does not export signals, raw bars, or journal to public repo.
    env:
      XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
      XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install XNAS calendar
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Require data-only keys, do not print secrets
        shell: bash
        run: |
          if [[ -z "$XRAY_ALPACA_DATA_KEY_ID" || -z "$XRAY_ALPACA_DATA_SECRET_KEY" ]]; then
            echo 'BLOCKED_MISSING_DATA_ONLY_API_CREDENTIALS' >&2
            exit 3
          fi
      - name: Run no-broker personal EOD scan (ephemeral private data)
        shell: bash
        working-directory: personal-swing
        env:
          REQUESTED_ASOF: ${{ inputs.asof_et }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$REQUESTED_ASOF" ]]; then
            [[ "$REQUESTED_ASOF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'BLOCKED_INVALID_WORKFLOW_DISPATCH_ASOF'; exit 2; }
            args+=(--asof "$REQUESTED_ASOF")
          fi
          python daily_job.py --dir "$RUNNER_TEMP/xray-private-data" --watchlist-file nasdaq_watchlist_477.json --batch-size 10 --github-safe-log "${args[@]}"
      - name: Verify exact private 477-scoped handoff without publishing signals
        working-directory: personal-swing
        shell: bash
        env:
          REQUESTED_ASOF: ${{ inputs.asof_et }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import runner
          import handoff_guard
          path=Path(os.environ['RUNNER_TEMP'])/'xray-private-data'/'latest.json'
          requested=os.environ.get('REQUESTED_ASOF','').strip()
          if not path.exists():
              # Workflow-file push before the market close is a safe no-op.
              import daily_job
              if requested or daily_job.current_completed_session() is not None:
                  raise RuntimeError('MISSING_PRIVATE_LATEST_WHILE_ELIGIBLE')
              print('XRAY_PERSONAL_NOOP_PRE_SESSION_NO_MARKET_DATA')
              raise SystemExit(0)
          snap=json.loads(path.read_text(encoding='utf-8'))
          if requested and snap.get('asof_et')!=requested:
              raise RuntimeError('WORKFLOW_DISPATCH_ASOF_MISMATCH')
          symbols=runner.get_scope(watchlist_file='nasdaq_watchlist_477.json')
          # Explicit exceptions, never Python assert (disabled under -O).
          handoff_guard.validate_snapshot(snap,symbols,
              scope_sha=runner.sha_symbols(symbols),
              policy_sha=runner.analysis_fingerprint())
          print('XRAY_PERSONAL_GITHUB_HANDOFF=PASS_477_477_SOURCE_POLICY_SHA_BOUND_PRIVATE')
          PY
      - name: Private Google Sheets writer (authorized service account only)
        working-directory: personal-swing
        shell: bash
        env:
          XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/xray-private-data/latest.json"
          if [[ ! -f "$path" ]]; then
            echo 'PRIVATE_SHEET_SYNC=SKIPPED_NO_COMPLETED_SESSION'
            exit 0
          fi
          if [[ -z "$XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON" ]]; then
            echo 'PRIVATE_SHEET_SYNC=BLOCKED_NO_AUTH_NOT_A_DELIVERY_PASS'
            exit 0
          fi
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3' >/dev/null
          python private_sheet_writer.py --snapshot "$path"
      - name: No public delivery of private signals
        run: echo 'Only authenticated Google Sheets API can persist private candidate rows; private writer readback is independent of GitHub success; no push/device ACK is claimed.'
