name: XRAY Eastmoney Zero-Key Probe

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/eastmoney_probe.py"
      - ".github/workflows/xray-eastmoney-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Eastmoney US path
        run: python nasdaq-xray/eastmoney_probe.py
      - name: Commit probe evidence
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/eastmoney_probe.json
          git commit -m "chore(xray): Eastmoney probe evidence [skip ci]" || exit 0
          git pull --rebase origin main
          git push
