name: XRAY Restore Validated Oct1 Epoch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-restore-validated-oct1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-restore-validated-oct1
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact validated epoch artifacts
        shell: bash
        run: |
          set -euo pipefail
          ref="8770a0605ce5c56697bdd34ed440385933e76fda"
          files=(
            nasdaq-xray/canonical_current_full_state.json
            nasdaq-xray/canonical_current_full_candidates.json
            nasdaq-xray/canonical_current_unknowns.json
            nasdaq-xray/canonical_current_resolution_overlay.json
            nasdaq-xray/canonical_current_master_manifest.json
            nasdaq-xray/canonical_current_price_dv20.json
            nasdaq-xray/canonical_current_resolver_request.json
          )
          git cat-file -e "$ref^{commit}"
          git checkout "$ref" -- "${files[@]}"

          declare -A expected=(
            [nasdaq-xray/canonical_current_full_state.json]="a66c063f603da95057b572f4b1828155ad3a0d34"
            [nasdaq-xray/canonical_current_full_candidates.json]="b45ec858ce1686d65dae19c2c530bf42c10ec1c2"
            [nasdaq-xray/canonical_current_unknowns.json]="b7cfddcbbf9de7588062913a5ae4f6386ca105aa"
            [nasdaq-xray/canonical_current_resolution_overlay.json]="9656a2b096e14c7233759971fbfb65790eda80a8"
            [nasdaq-xray/canonical_current_master_manifest.json]="b424dfcb2d3e0b0a18e4c8ae2ea20bbcb11385a7"
            [nasdaq-xray/canonical_current_price_dv20.json]="c968387e6989707174a05e83dd20a07b250ec98f"
            [nasdaq-xray/canonical_current_resolver_request.json]="d1d59c419cbad77943cee3ad74dcb5646c334fcf"
          )
          for p in "${files[@]}"; do
            got="$(git hash-object "$p")"
            test "$got" = "${expected[$p]}"
            echo "$p $got PASS"
          done

          python - <<'PY'
          import json
          m=json.load(open("nasdaq-xray/canonical_current_master_manifest.json"))
          p=json.load(open("nasdaq-xray/canonical_current_price_dv20.json"))
          q=json.load(open("nasdaq-xray/canonical_current_resolver_request.json"))
          assert m["asof_et"]==p["asof_et"]==q["asof_et"]=="2026-10-01"
          assert m["queue_total"]==3400 and m["unknown_count"]==0
          assert p["source_master_count"]==3400 and p["unknown_count"]==0 and p["pass_count"]==358
          assert q["queue_total"]==3400 and q["status"]=="IDLE"
          assert m["queue_hash"]==p["source_master_queue_hash"]==q["queue_hash"]=="364359905320f408f7c897d03230eade4fc35c063279c01f51e51c91481b52c3"
          print("XRAY_OCT1_RESTORE_STRUCTURAL=PASS")
          PY

      - name: Commit exact restore
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-recovery-bot"
          git config user.email "xray-recovery-bot@users.noreply.github.com"
          git add             nasdaq-xray/canonical_current_full_state.json             nasdaq-xray/canonical_current_full_candidates.json             nasdaq-xray/canonical_current_unknowns.json             nasdaq-xray/canonical_current_resolution_overlay.json             nasdaq-xray/canonical_current_master_manifest.json             nasdaq-xray/canonical_current_price_dv20.json             nasdaq-xray/canonical_current_resolver_request.json
          if git diff --cached --quiet; then
            echo "XRAY_OCT1_RESTORE=ALREADY_EXACT"
            exit 0
          fi
          git commit -m "fix(xray): restore validated Oct1 current epoch [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "XRAY_OCT1_RESTORE=PASS"
