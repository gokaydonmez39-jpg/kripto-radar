name: XRAY Alpaca Delayed SIP Research Canary
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_delayed_sip_research_shadow.py"
      - "nasdaq-xray/alpaca_sip_exact30_backup_probe.py"
      - "nasdaq-xray/alpaca_rth_minute_integrity_shadow.py"
      - "nasdaq-xray/alpaca_sip_rth_minute_onecall_shadow.py"
      - "nasdaq-xray/alpaca_540_personal_daily_sip_coverage.py"
      - "nasdaq-xray/alpaca_27_daily_sip_dates_shadow.py"
      - "nasdaq-xray/alpaca_sip_close_auction_condition_shadow.py"
      - "nasdaq-xray/research/continuation_checkpoint_20261013_alpaca_540_anomaly_queue_v1.json"
      - "nasdaq-xray/alpaca_sip_legacy_key_mapping_selftest.py"
      - "nasdaq-xray/evidence/alpaca_connected_historical_sip_20261007_v1.json"
      - "nasdaq-xray/evidence/alpaca_connected_sip_daily_20261013_v1.json"
      - "nasdaq-xray/evidence/alpaca_connected_sip_exact30_20261013_v1.json"
      - "nasdaq-xray/evidence/alpaca_sip_20261012_rth_boundary_20261013_v1.json"
      - ".github/workflows/xray-alpaca-delayed-sip-research.yml"
  schedule:
    - cron: "55 13 * * 1-5"
permissions:
  contents: read
concurrency:
  group: xray-alpaca-delayed-sip-research
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      XRAY_ALPACA_API_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
      XRAY_ALPACA_API_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
      XRAY_ALPACA_SIP_HISTORY_RESEARCH_LICENSE_OK: ${{ vars.XRAY_ALPACA_SIP_HISTORY_RESEARCH_LICENSE_OK }}
      XRAY_ALPACA_SIP_HISTORY_LICENSE_EVIDENCE_SHA256: ${{ secrets.XRAY_ALPACA_SIP_HISTORY_LICENSE_EVIDENCE_SHA256 }}
      # Only metadata-only research, personal noncommercial Basic historical SIP.
      # Independent exchange/non-display license is NOT asserted.
      XRAY_ALPACA_PERSONAL_BASIC_SHADOW_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact invoking SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Nasdaq calendar for exact30 backup verification
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Run negative source and no-trade selftests
        run: |
          python -m py_compile nasdaq-xray/alpaca_delayed_sip_research_shadow.py
          python nasdaq-xray/alpaca_delayed_sip_research_shadow.py --selftest
          python nasdaq-xray/alpaca_sip_legacy_key_mapping_selftest.py
          python -m py_compile nasdaq-xray/alpaca_sip_exact30_backup_probe.py
          python nasdaq-xray/alpaca_sip_exact30_backup_probe.py --selftest
          python -O nasdaq-xray/alpaca_sip_exact30_backup_probe.py --selftest
          python -m py_compile nasdaq-xray/alpaca_rth_minute_integrity_shadow.py
          python nasdaq-xray/alpaca_rth_minute_integrity_shadow.py --selftest
          python -O nasdaq-xray/alpaca_rth_minute_integrity_shadow.py --selftest
          python -m py_compile nasdaq-xray/alpaca_sip_rth_minute_onecall_shadow.py
          python nasdaq-xray/alpaca_sip_rth_minute_onecall_shadow.py --selftest
          python -O nasdaq-xray/alpaca_sip_rth_minute_onecall_shadow.py --selftest
          python -m py_compile nasdaq-xray/alpaca_540_personal_daily_sip_coverage.py
          python nasdaq-xray/alpaca_540_personal_daily_sip_coverage.py --selftest
          python -O nasdaq-xray/alpaca_540_personal_daily_sip_coverage.py --selftest
          python -m py_compile nasdaq-xray/alpaca_27_daily_sip_dates_shadow.py
          python nasdaq-xray/alpaca_27_daily_sip_dates_shadow.py --selftest
          python -O nasdaq-xray/alpaca_27_daily_sip_dates_shadow.py --selftest
          python -m py_compile nasdaq-xray/alpaca_sip_close_auction_condition_shadow.py
          python nasdaq-xray/alpaca_sip_close_auction_condition_shadow.py --selftest
          python -O nasdaq-xray/alpaca_sip_close_auction_condition_shadow.py --selftest
      - name: Research-only bounded exact30 five-symbol historical SIP runner probe
        run: |
          python nasdaq-xray/alpaca_sip_exact30_backup_probe.py --out "$RUNNER_TEMP/xray_alpaca_exact30_backup.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_alpaca_exact30_backup.json").read_text())
          assert x["schema"]=="XRAY_ALPACA_HISTORICAL_SIP_EXACT30_BACKUP_PROBE_V1"
          assert x["feed"]=="sip" and x["requested_symbol_count"]==5
          assert x["api_calls"] in (0,1) and 0<=x["valid_symbols"]<=5
          assert 0<=x["valid_bars"]<=150
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          assert x["unknown_never_pass"] is True
          assert x["interactive_access_not_runner_authority"] is True
          assert x["personal_basic_shadow_opt_in"] is True
          assert x["daily_sip_1day_volume_is_rth"] is False
          assert x["rth_volume_requires_official_session_minutes"] is True
          assert x["close_auction_allocation_verified"] is False
          assert x["c417_dv30_from_daily_sip_allowed"] is False
          for k in ("primary_price_authority","primary_mc_authority","history_pass",
                    "r92_created","strict_g9_pass","account_pass","can_create_primary",
                    "alpha_authority","vendor_raw_data_persisted","secrets_or_request_urls_persisted",
                    "official_rth_only_lineage_attested","license_independently_verified"):
              assert x[k] is False,k
          if x["api_calls"]==0:
              assert x["valid_symbols"]==0 and x["valid_bars"]==0
          if x["status"]=="SHADOW_EXACT30_TRANSPORT_CONFIRMED_NO_PRIMARY":
              assert x["api_calls"]==1 and x["valid_symbols"]==5 and x["valid_bars"]==150
          payload=json.dumps(x)
          for k in ("XRAY_ALPACA_API_KEY_ID","XRAY_ALPACA_API_SECRET_KEY"):
              if os.environ.get(k):assert os.environ[k] not in payload
          print("XRAY_SIP_EXACT30_RUNNER_STATUS="+x["status"])
          print("XRAY_SIP_NO_SOURCE_PRIMARY_OR_R92=PASS")
          PY
      - name: Authorized one-call full RTH minute coverage probe (never DV30)
        run: |
          python nasdaq-xray/alpaca_sip_rth_minute_onecall_shadow.py --out "$RUNNER_TEMP/xray_sip_rth_minute_onecall.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ["RUNNER_TEMP"])/"xray_sip_rth_minute_onecall.json"
          x=json.loads(f.read_text())
          assert x["schema"]=="XRAY_ALPACA_SIP_RTH_MINUTE_ONECALL_SHADOW_V1"
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          assert x["unknown_never_pass"] is True
          assert x["api_calls"] in (0,1)
          assert x["personal_basic_shadow_opt_in"] is True
          assert x["observed_valid_minutes"] in (0,210,390)
          for key in ("license_independently_verified","close_auction_allocation_verified",
                      "trade_conditions_rth_lineage_verified","daily_bar_volume_is_rth_proven",
                      "historical_pit_revision_chain_verified","full_540_symbol_coverage",
                      "coverage_complete","market_volume_persisted","raw_ohlcv_persisted",
                      "api_key_or_url_persisted","primary_price_authority",
                      "primary_mc_authority","dv30_pass_created","history_pass_created",
                      "r92_created","alpha_authority","strict_g9_pass","account_pass"):
              assert x[key] is False,key
          if not x["exact_minute_window_observed"]:
              assert x["observed_valid_minutes"]==0
          if x["status"]=="SHADOW_EXACT_RTH_MINUTE_WINDOW_NO_AUCTION_NO_DV30_AUTHORITY":
              assert x["api_calls"]==1 and x["exact_minute_window_observed"] is True
              assert x["observed_valid_minutes"]==x["expected_official_session_minutes"]
          for k in ("XRAY_ALPACA_API_KEY_ID","XRAY_ALPACA_API_SECRET_KEY"):
              if os.environ.get(k):assert os.environ[k] not in json.dumps(x)
          print("XRAY_RUNNER_SINGLE_SESSION_RTH_MINUTE="+x["status"])
          print("XRAY_RUNNER_NO_DV30_PROMOTION=PASS")
          PY
      - name: One-shot personal 540-symbol daily SIP coverage census (no canonical promotion)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run540shadow]') }}
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          python nasdaq-xray/alpaca_540_personal_daily_sip_coverage.py --out "$RUNNER_TEMP/xray_alpaca_540_metadata.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_alpaca_540_metadata.json"
          x=json.loads(p.read_text())
          assert x["schema"]=="XRAY_PERSONAL_540_EXACT30_DAILY_SIP_COVERAGE_SHADOW_V1"
          assert x["requested"]==540 and x["attempted"]+x["remaining"]==540
          assert 0<=x["api_calls"]<=24
          assert sum(x["counts"].values())==x["attempted"]
          assert sum(x["diagnostic_reasons"].values())==len(x["affected_symbols"])
          assert len(x["affected_symbols"])==x["counts"]["INCOMPLETE"]+x["counts"]["INTEGRITY"]
          assert all(set(item)=={"symbol","classification","reason"}
                     for item in x["affected_symbols"])
          assert all(isinstance(item["symbol"],str) for item in x["affected_symbols"])
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          assert x["unknown_never_pass"] is True
          assert x["vendor_raw_bars_persisted"] is False
          assert x["vendor_price_or_volume_values_persisted"] is False
          assert x["primary_dv30_authority"] is False
          assert x["primary_mc_authority"] is False and x["r92_created"] is False
          if x["status"]!="SHADOW_540_DAILY_SIP_SCOPE_MEASURED_NOT_RTH":
              raise SystemExit("XRAY_540_PERSONAL_SIP_SCOPE_INCOMPLETE_FAIL_CLOSED")
          print("XRAY_540_PERSONAL_SIP_COVERAGE=PASS_NO_RTH_PRIMARY_NO_R92")
          PY
      - name: Targeted only 27 frozen anomalies, one daily SIP page maximum
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run27shadow]') }}
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          python nasdaq-xray/alpaca_27_daily_sip_dates_shadow.py --out "$RUNNER_TEMP/xray_alpaca_27_dates_metadata.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_alpaca_27_dates_metadata.json").read_text())
          assert x["schema"]=="XRAY_PERSONAL_27_SIP_ANOMALOUS_DATES_SHADOW_V1"
          assert x["api_calls"]<=1
          assert x["requested"]==27 and x["completed"]+x["remaining"]==27
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          assert x["unknown_never_pass"] is True
          assert x["raw_vendor_bars_persisted"] is False
          assert x["prices_or_volumes_persisted"] is False
          assert x["primary_dv30_created"]==0
          assert x["primary_mc_created"]==0 and x["r92_created"]==0
          if x["status"]!="SHADOW_27_DATE_DIAGNOSTICS_ONLY_NOT_PRIMARY":
              raise SystemExit("XRAY_27_ONE_CALL_DATE_DIAGNOSTICS_INCOMPLETE")
          assert len(x["details"])==27
          assert all(set(y)=={"symbol","prior_reason","observed_bars",
                 "missing_official_days","nonpositive_volume_days",
                 "bad_shape_days","reason"} for y in x["details"])
          print("XRAY_27_TARGETED_ONE_CALL_DATE_DIAGNOSTICS=PASS_NO_PRIMARY")
          PY
      - name: Validate historical SIP connector research-only proof without prices
        run: |
          python - <<'PY'
          import datetime as dt,json,pathlib
          p=pathlib.Path("nasdaq-xray/evidence/alpaca_connected_historical_sip_20261007_v1.json")
          d=json.loads(p.read_text())
          assert d["schema"]=="XRAY_CONNECTED_HISTORICAL_SIP_RESEARCH_ATTESTATION_V1"
          assert d["source"]=="CONNECTED_ALPACA_TOOL_AD_HOC_ONLY" and d["market_data_feed"]=="sip"
          assert d["market_data_mode"]=="HISTORICAL_OVER_15_MINUTES"
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          assert d["unknown_never_pass"] is True
          for k in ("alpha_authority","strict_g9_pass","account_pass","scheduler_callable_verified","production_classification_changed","prices_or_vendor_quote_bodies_persisted"):
              assert d[k] is False,k
          assert set(d["symbols"])=={"AAPL","PLTR","MSTR"}
          assert d["request_window_utc"]==["2026-10-07T19:57:00Z","2026-10-07T19:58:00Z"]
          first,last=[dt.datetime.fromisoformat(x.replace("Z","+00:00")) for x in d["request_window_utc"]]
          for symbol,row in d["symbols"].items():
              assert set(row)=={"quote_timestamp_utc","trade_timestamp_utc","quote_tape","trade_tape","quote_count","trade_count","quote_valid"}
              assert row["quote_tape"]==row["trade_tape"]=="C"
              assert row["quote_count"]==row["trade_count"]==1 and row["quote_valid"] is True
              q=dt.datetime.fromisoformat(row["quote_timestamp_utc"].replace("Z","+00:00"))
              t=dt.datetime.fromisoformat(row["trade_timestamp_utc"].replace("Z","+00:00"))
              assert first<=q<=last and first<=t<=last and q!=t
          assert not any(k in p.read_text().lower() for k in ('"bid_price"','"ask_price"','"trade_price"','"last_price"','"volume"'))
          print("XRAY_HISTORICAL_SIP_CONNECTOR_METADATA_FAIL_CLOSED=PASS symbols=3")
          PY
      - name: Validate 13-Oct interactive SIP daily transport metadata, no PRICE pass
        run: |
          python - <<'PY'
          import datetime as dt,json,pathlib
          p=pathlib.Path("nasdaq-xray/evidence/alpaca_connected_sip_daily_20261013_v1.json")
          x=json.loads(p.read_text())
          assert x["schema"]=="XRAY_CONNECTED_ALPACA_SIP_DAILY_TRANSPORT_METADATA_V1"
          assert x["source"]=="CONNECTED_ALPACA_CHATGPT_INTERACTIVE_READONLY"
          assert x["api_feed"]=="sip" and x["api_timeframe"]=="1Day"
          assert (x["request_start_date_et"],x["official_last_completed_session_et"],
                  x["request_end_date_et"])==("2026-08-17","2026-10-12","2026-10-13")
          assert (x["independent_connected_calendar_session_count_including_current_date"]==41
                  and x["incomplete_current_date_in_response"]=="2026-10-13"
                  and x["incomplete_date_is_excluded_from_eod_count"] is True)
          assert set(x["symbols"])=={"AAPL","NVDA","MSFT"}
          for sym,row in x["symbols"].items():
              assert row=={
                "daily_rows_returned":41,"completed_dated_rows_by_asof":40,
                "completed_unique_dates":40,
                "completed_volume_values_all_positive_integers":True,
                "last_completed_bar_date":"2026-10-12"}
          for key in ("raw_vendor_prices_or_volumes_persisted",
                      "official_rth_only_lineage_attested",
                      "github_runner_same_access_verified",
                      "unattended_data_and_derived_rights_attested",
                      "complete_540_unknown_universe_coverage_verified",
                      "full_30_session_c417_positive_price_authority",
                      "primary_mc_authority","r92_registration_authority",
                      "strict_g9_authority","account_authority"):
              assert x[key] is False,key
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          assert x["unknown_never_pass"] is True
          # No market data prices, per-bar OHLCV, or API credentials in Git.
          forbidden=('"open":','"high":','"low":','"close":','"volume":',
                     '"api_key":','"api_secret":','"market_cap":')
          assert not any(f in p.read_text().lower() for f in forbidden)
          print("XRAY_CONNECTED_SIP_13OCT=PASS_3_SYMBOLS_40_COMPLETED_DATES_NO_CURRENT_BAR_NO_PRICE_MC_R92")
          PY
      - name: Validate exact30 connected interactive metadata remains nonproduction
        run: |
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path("nasdaq-xray/evidence/alpaca_connected_sip_exact30_20261013_v1.json")
          raw=path.read_text();x=json.loads(raw)
          assert x["schema"]=="XRAY_ALPACA_CONNECTED_SIP_EXACT30_INTERACTIVE_WITNESS_V1"
          assert x["source"]=="CONNECTED_ALPACA_CHATGPT_INTERACTIVE_READONLY"
          assert x["api_method"]=="get_stock_bars" and x["api_feed"]=="sip"
          assert x["last_official_completed_date_et"]=="2026-10-12"
          assert x["observation_date_utc"]=="2026-10-13"
          assert x["date_from_et"]=="2026-08-31"
          assert x["historical_bars_connector_read_succeeded"] is True
          assert x["total_completed_daily_bars_observed"]==150
          assert set(x["observed_symbol_scope"])==set(x["samples"])=={"AAPL","AAON","AAL","AAOI","NVDA"}
          for s,row in x["samples"].items():
              assert row["distinct_completed_et_sessions"]==30
              assert row["all_positive_integer_volume"] is True
              assert row["exact_30_session_date_set"] is True
              assert row["day_30_asof"]=="2026-10-12"
          for k in ("raw_vendor_prices_volumes_quotes_stored","full_540_symbol_evaluated",
                    "rights_attested_for_unattended_runner","official_rth_only_lineage_attested",
                    "corporate_action_adjustment_exact","vendor_response_timestamp_and_revision_chain_attested",
                    "strict_g9_pass","account_pass"):
              assert x[k] is False,k
          for k in ("canonical_price_pass_created","primary_market_cap_created",
                    "history_pass_created","r92_created"):
              assert x[k]==0,k
          assert x["policy"]=="C4.17" and x["control"]=="C4.27"
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          assert x["unknown_never_pass"] is True
          forbidden=('"close":','"volume":','"market_cap":','"api_key":','"api_secret":')
          assert not any(v in raw.lower() for v in forbidden)
          print("XRAY_FIVE_SYMBOL_CONNECTED_SIP_EXACT30_METADATA=PASS_NO_AL_AUTHORITY")
          PY
      - name: Independently verify RTH boundary provenance without raw data
        run: |
          python - <<'PY'
          import json,pathlib
          f=pathlib.Path("nasdaq-xray/evidence/alpaca_sip_20261012_rth_boundary_20261013_v1.json")
          raw=f.read_text();j=json.loads(raw)
          assert j["schema"]=="XRAY_ALPACA_CONNECTED_RTH_VOLUME_BOUNDARY_WITNESS_V1"
          assert j["provider"]=="ALPACA" and j["data_feed"]=="sip"
          assert j["observed_session_date_et"]=="2026-10-12"
          assert j["complete_pre_close_minute_count"]==390
          assert j["all_pre_close_minute_volumes_positive_integer"] is True
          assert j["separate_16_00_et_minute_bar_observed"] is True
          assert j["daily_volume_different_from_09_30_through_15_59_minute_sum"] is True
          for key in ("minute_16_00_contains_close_auction_vs_afterhours_split_verified",
                      "rth_trade_conditions_proven","daily_1day_volume_can_be_rth_dv30",
                      "source_license_and_reproduction_rights_proven",
                      "raw_vendor_ohlcv_or_individual_minute_volumes_persisted"):
              assert j[key] is False,key
          assert j["canonical_price_pass_created"]==j["primary_mc_created"]==j["r92_created"]==0
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["policy"]=="C4.17" and j["control"]=="C4.27"
          assert not any(s in raw.lower() for s in ('"volume":','"close":','"api_key":'))
          print("XRAY_SIP_RTH_BOUNDARY_AUDIT=PASS_390_MINUTES_DAILY_VOLUME_NOT_RTH_NO_GO")
          PY
      - name: Bounded delayed-SIP health readback
        run: |
          python nasdaq-xray/alpaca_delayed_sip_research_shadow.py --out "$RUNNER_TEMP/alpaca_delayed_sip_health.json"
      - name: Enforce zero price publication zero GO
        run: |
          python - <<'PY'
          import json,os,pathlib
          j=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"alpaca_delayed_sip_health.json").read_text())
          assert j["policy"]=="C4.17" and j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["strict_g9_pass"] is False and j["account_pass"] is False
          assert j["alpha_authority"] is False and j["r92_created"] is False and j["orders"]==[]
          assert j["vendor_quotes_persisted"] is False and 0<=j["valid_count"]<=j["expected_count"]==3
          assert "quotes" not in j and "prices" not in j
          print("XRAY_DELAYED_SIP_VENDOR_GUARD=PASS status="+j["status"])
          PY
      - name: Upload health only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-alpaca-delayed-sip-health
          path: |
            ${{ runner.temp }}/alpaca_delayed_sip_health.json
            ${{ runner.temp }}/xray_alpaca_exact30_backup.json
            ${{ runner.temp }}/xray_sip_rth_minute_onecall.json
            ${{ runner.temp }}/xray_alpaca_540_metadata.json
            ${{ runner.temp }}/xray_alpaca_27_dates_metadata.json
          retention-days: 7
          if-no-files-found: error
