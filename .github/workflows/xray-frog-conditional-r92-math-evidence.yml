name: XRAY FROG Conditional R92 Authority and SEC 80pct MC Math Evidence
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/candidate_local_frog_oct13_r92_math_evidence_gate.py"
      - "nasdaq-xray/personal_research_technical_policy_v1.json"
      - "nasdaq-xray/personal_research_policy_guard.py"
      - "nasdaq-xray/personal_research_same_asof_chain_audit.py"
      - ".github/workflows/xray-frog-conditional-r92-math-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: xray-frog-r92-conditional-math
  cancel-in-progress: false
jobs:
  immutable-official-evidence-and-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Exact commit and offline hostile-source regression
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/candidate_local_frog_oct13_r92_math_evidence_gate.py
          python nasdaq-xray/candidate_local_frog_oct13_r92_math_evidence_gate.py --selftest
          python -O nasdaq-xray/candidate_local_frog_oct13_r92_math_evidence_gate.py --selftest
          python nasdaq-xray/personal_research_policy_guard.py --selftest
          python -O nasdaq-xray/personal_research_policy_guard.py --selftest
      - name: Exact GitHub artifact ZIP digests and source artifact checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/11883022323 --jq .digest)" = "sha256:c7fe2fecf1ec6f52e92cfbe126d90d02351aae2bcf274bd73206515b900c51ee"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/11883160799 --jq .digest)" = "sha256:59760fa69090a9f44554cf9eafceb631d5bccd1119950cadb3dfe152beed43c3"
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/11883871692 --jq .digest)" = "sha256:c1a660665bcf57925e5bffa12520487e41a6c25ea68bafc2194cf93f8ba65d34"
          mkdir -p "$RUNNER_TEMP/cover" "$RUNNER_TEMP/priceca" "$RUNNER_TEMP/lastmile"
          gh run download 38542981111 --repo "${{ github.repository }}" --name xray-oct13-frog-real-10q-class-cover-price-mc-research --dir "$RUNNER_TEMP/cover"
          gh run download 38542276318 --repo "${{ github.repository }}" --name xray-oct13-frog-candidate-local-pit-ca-price-sec-legal-halt --dir "$RUNNER_TEMP/priceca"
          gh run download 38544436297 --repo "${{ github.repository }}" --name xray-frog-oct13-last-mile-issuer-form4-ir-halt-auction-no-primary --dir "$RUNNER_TEMP/lastmile"
          echo XRAY_FROG_SOURCE_THREE_IMMUTABLE_ZIP_SHA=PASS
      - name: Compute actual 5x headroom and missing exact source bounds without fabricating primary
        run: |
          python nasdaq-xray/candidate_local_frog_oct13_r92_math_evidence_gate.py \
            --cover "$RUNNER_TEMP/cover/frog_sec_cover_class_mc_shadow.json" \
            --rollup "$RUNNER_TEMP/priceca/xray_frog_reverse_funnel_pit.json" \
            --lastmile "$RUNNER_TEMP/lastmile/frog_last_mile.json" \
            --out "$RUNNER_TEMP/frog_conditional_r92_math.json"
      - name: Independent source observation and no-false-release attestation
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"frog_conditional_r92_math.json").read_text())
          def need(ok,key):
              if not ok:raise ValueError("R92_MATH_INDEPENDENT_"+key)
          need(j["policy_r92_conditional_permission_enabled"] is True,"R92_PERMISSION")
          need(len(j["observed_source_checks"])==5 and
               all(str(v).startswith("PASS_OBSERVED") for v in j["observed_source_checks"].values()),"FIVE_SOURCE_OBSERVATIONS")
          need(j["mathematical_vintage_scenario"]["required_minimum_share_cancellation_at_same_price"]==98641049,"TRUE_MATH")
          need(j["mathematical_vintage_scenario"]["known_independent_current_outstanding_lower_bound_shares"] is None,"NO_FABRICATED_BOUND")
          need(j["eligible_c417_primary"] is False and j["r92_registered"] is False,"NOT_AUTHORIZED")
          need(j["canonical_files_modified"] is False and j["delivery_ledger_modified"] is False,"NO_SYNTHETIC_LEDGER")
          need(j["iphone_delivery_receipt_attested"] is False,"NO_FAKE_IPHONE")
          print("XRAY_FROG_R92_CONDITIONAL_POLICY_UNLOCK=VERIFIED")
          print("XRAY_FROG_R92_FIVE_OBSERVATIONS=VERIFIED_NOT_RELEASE")
          print("XRAY_FROG_R92=FALSE_NO_UNSUPPORTED_CANONICAL_MINT")
          PY
      - name: Preserve derived math and exact source hash evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: xray-frog-conditional-r92-five-source-observations-80pct-math
          path: ${{ runner.temp }}/frog_conditional_r92_math.json
          retention-days: 14
          if-no-files-found: warn
