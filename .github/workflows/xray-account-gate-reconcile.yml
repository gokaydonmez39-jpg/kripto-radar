name: XRAY Account Gate Reconciler

# Broker/account gate is OUTSIDE the user's signal-only radar.
# Keep historical regression on explicit manual invocation only; no cron,
# push-triggered account reconciliation, secret access or GitHub writes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/xray-account-gate-reconcile.yml"

permissions:
  contents: read

concurrency:
  group: xray-account-gate-reconciler
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}

      - name: Exact source SHA and synthetic race regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python nasdaq-xray/workflow_source_epoch_fence_selftest.py
          python -O nasdaq-xray/workflow_source_epoch_fence_selftest.py
          echo "XRAY_ACCOUNT_INVOCATION_SHA=PASS_EXACT"
      - name: Compile
        run: python -m py_compile nasdaq-xray/reconcile_account_gate.py nasdaq-xray/reconcile_account_gate_selftest.py

      - name: Run fail-closed reconciler selftest
        run: |
          python nasdaq-xray/reconcile_account_gate_selftest.py
          python -O nasdaq-xray/reconcile_account_gate_selftest.py

      - name: Enforce no account-state write capability
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/xray-account-gate-reconcile.yml").read_text()
          assert "  "+"schedule:" not in wf
          assert "  "+"push:" not in wf
          assert "contents: "+"write" not in wf
          assert "  "+"workflow_dispatch:" in wf
          assert "git "+"push origin" not in wf
          assert "secret"+"s." not in wf
          print("XRAY_ACCOUNT_RECONCILER=MANUAL_OFFLINE_READ_ONLY")
          PY
