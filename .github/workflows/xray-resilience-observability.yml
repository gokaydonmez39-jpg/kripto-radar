name: XRAY Resilience + Official Witnesses

# manual exact-REV42 structural audit trigger: 2026-10-06T23:17Z

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/canonical_current_event_request.json"
      - "nasdaq-xray/chatgpt_canonical_state_v2.json"
      - "nasdaq-xray/resilience_runtime.py"
      - "nasdaq-xray/resilience_selftest.py"
      - "nasdaq-xray/sec_official_witness.py"
      - "nasdaq-xray/sec_official_witness_selftest.py"
      - "nasdaq-xray/external_health_probe.py"
      - "nasdaq-xray/macro_context_probe.py"
      - "nasdaq-xray/candidate_enrichment.py"
      - "nasdaq-xray/free_solution_candidates.json"
      - "nasdaq-xray/free_solution_verifier.py"
      - "nasdaq-xray/pit_vintage_store.py"
      - "nasdaq-xray/pit_vintage_store_selftest.py"
      - "nasdaq-xray/official_source_guard.py"
      - "nasdaq-xray/official_source_guard_selftest.py"
      - "nasdaq-xray/official_pit_ledger.py"
      - "nasdaq-xray/data_lineage_registry.py"
      - "nasdaq-xray/deterministic_replay_guard.py"
      - "nasdaq-xray/canonical_pointer_transition_guard.py"
      - "nasdaq-xray/guardian_anomaly.py"
      - "nasdaq-xray/guardian_anomaly_selftest.py"
      - "nasdaq-xray/free_core_migration_contract.json"
      - "nasdaq-xray/gem_integration_registry.json"
      - "nasdaq-xray/gem_registry_selftest.py"
      - "nasdaq-xray/provider_automation_governance.json"
      - "nasdaq-xray/provider_automation_governance_selftest.py"
      - "nasdaq-xray/scheduler_failover_selftest.py"
      - "nasdaq-xray/scheduler_failover_contract.json"
      - ".github/workflows/xray-resilience-observability.yml"
  workflow_run:
    workflows: ["XRAY Canonical Pointer Transition"]
    types: [completed]
  schedule:
    - cron: "47 * * * 1-5"
    - cron: "47 */3 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-resilience-observability-v2
  cancel-in-progress: true

jobs:
  resilience:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
      XRAY_SEC_USER_AGENT: "NASDAQ-SWING-XRAY/1.0 research github.com/gokaydonmez39-jpg/kripto-radar"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Compile resilience modules
        run: |
          python -m py_compile \
            nasdaq-xray/resilience_runtime.py \
            nasdaq-xray/sec_official_witness.py \
            nasdaq-xray/sec_official_witness_selftest.py \
            nasdaq-xray/external_health_probe.py \
            nasdaq-xray/macro_context_probe.py \
            nasdaq-xray/candidate_enrichment.py \
            nasdaq-xray/free_solution_verifier.py \
            nasdaq-xray/pit_vintage_store.py \
            nasdaq-xray/pit_vintage_store_selftest.py \
            nasdaq-xray/official_source_guard.py \
            nasdaq-xray/official_source_guard_selftest.py \
            nasdaq-xray/official_pit_ledger.py \
            nasdaq-xray/data_lineage_registry.py \
            nasdaq-xray/deterministic_replay_guard.py \
          nasdaq-xray/canonical_pointer_transition_guard.py \
            nasdaq-xray/guardian_anomaly.py \
            nasdaq-xray/guardian_anomaly_selftest.py \
            nasdaq-xray/gem_registry_selftest.py \
            nasdaq-xray/provider_automation_governance_selftest.py \
            nasdaq-xray/scheduler_failover_selftest.py

      - name: Scheduler failover self-test
        run: python nasdaq-xray/scheduler_failover_selftest.py

      - name: Single-flight + circuit-breaker self-test
        run: python nasdaq-xray/resilience_selftest.py

      - name: SEC official-witness bounded transport self-test
        run: python nasdaq-xray/sec_official_witness_selftest.py

      - name: 36-of-36 gem integration registry self-test
        run: python nasdaq-xray/gem_registry_selftest.py

      - name: Provider automation governance self-test
        run: python nasdaq-xray/provider_automation_governance_selftest.py

      - name: PIT vintage-store self-test
        run: python nasdaq-xray/pit_vintage_store_selftest.py

      - name: Nasdaq Security Status state-machine self-test
        run: python nasdaq-xray/official_source_guard_selftest.py

      - name: Nasdaq official PIT + halt/system guard
        run: python nasdaq-xray/official_source_guard.py

      - name: Append official PIT ledger
        run: python nasdaq-xray/official_pit_ledger.py

      - name: SEC official witness
        run: python nasdaq-xray/sec_official_witness.py

      - name: External health witnesses
        run: python nasdaq-xray/external_health_probe.py

      - name: Macro context
        run: python nasdaq-xray/macro_context_probe.py

      - name: Candidate enrichment
        run: python nasdaq-xray/candidate_enrichment.py

      - name: Verify free/open-source solution references
        run: python nasdaq-xray/free_solution_verifier.py

      - name: Build data-lineage registry
        run: python nasdaq-xray/data_lineage_registry.py

      - name: Deterministic replay guard
        run: python nasdaq-xray/deterministic_replay_guard.py

      - name: Detect source-sensitive live-main supersession
        id: supersession
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          current="$(git rev-parse HEAD)"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$latest" == "$current" ]]; then
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            echo "XRAY_RESILIENCE_SUPERSESSION=NO"
            exit 0
          fi
          changed="$(git diff --name-only "$current" "$latest" -- \
            nasdaq-xray/chatgpt_canonical_state_v2.json \
            nasdaq-xray/canonical_current_terminal.json \
            nasdaq-xray/canonical_current_event_request.json \
            nasdaq-xray/canonical_current_event_state.json \
            nasdaq-xray/chatgpt_compiled_policy_v3.json || true)"
          if [[ -n "$changed" ]]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed<<EOF"
              echo "$changed"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "XRAY_RESILIENCE_SUPERSESSION=HEALTHY_NOOP"
            printf '%s\n' "$changed"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            echo "XRAY_RESILIENCE_SUPERSESSION=NON_SOURCE_DRIFT"
          fi

      - name: Pointer exact-current preflight
        id: pointer_preflight
        if: steps.supersession.outputs.superseded != 'true'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,pathlib,subprocess
          root=pathlib.Path("nasdaq-xray")
          p=json.load(open(root/"chatgpt_canonical_state_v2.json"))
          s=p.get("state_json") or {}
          if isinstance(s,str): s=json.loads(s)
          t=root/"canonical_current_terminal.json"
          terminal=json.load(open(t))
          def blob(path):
              return subprocess.check_output(["git","hash-object",str(path)],text=True).strip()
          current_terminal=blob(t)
          recorded=str(((s.get("deep_final_evidence") or {}).get("terminal_blob_sha") or ""))
          stale=[]
          if not recorded or recorded!=current_terminal:
              stale.append("terminal")
          # A pointer whose terminal blob still matches can nevertheless be stale
          # when a mutable canonical-current upstream file (for example Event)
          # has advanced after that terminal was built. Mirror the strict guard's
          # immutable evidence set here, but classify expected source advancement
          # as upstream-pending instead of throwing a raw assertion.
          immutable_keys={"master","price","history","legal","stage1_input","stage1",
              "regime","deep_geometry","event_request","events","family_c","deep","final",
              "policy","full_state"}
          for key in sorted(immutable_keys):
              meta=(terminal.get("evidence") or {}).get(key) or {}
              rel=str(meta.get("path") or "")
              expected=str(meta.get("blob_sha") or "")
              fp=root.parent/rel if rel else None
              if not rel or not expected or fp is None or not fp.exists() or blob(fp)!=expected:
                  stale.append(key)
          mc=(terminal.get("evidence") or {}).get("mc") or {}
          mc_rel=str(mc.get("path") or "")
          mc_expected=str(mc.get("blob_sha") or "")
          mc_fp=root.parent/mc_rel if mc_rel else None
          if not mc_rel or not mc_expected or mc_fp is None or not mc_fp.exists() or blob(mc_fp)!=mc_expected:
              stale.append("mc")
          # Cheap discriminating tests: event-only drift and terminal-only drift
          # are both pending; an exact synthetic set is ready.
          def readiness(recorded_sha,current_sha,drift):
              return bool(recorded_sha and recorded_sha==current_sha and not drift)
          assert readiness("a","a",[]) is True
          assert readiness("a","a",["events"]) is False
          assert readiness("a","b",[]) is False
          ready=readiness(recorded,current_terminal,stale)
          print("ready="+("true" if ready else "false"))
          print("reason="+("POINTER_EXACT_CURRENT" if ready else "POINTER_OR_EVIDENCE_STALE_UPSTREAM_PENDING"))
          print("stale_keys="+(",".join(stale) if stale else ""))
          print("recorded_terminal="+recorded)
          print("current_terminal="+current_terminal)
          PY

      - name: Healthy no-op while canonical pointer is stale
        if: steps.supersession.outputs.superseded != 'true' && steps.pointer_preflight.outputs.ready != 'true'
        run: echo "XRAY_RESILIENCE=BLOCKED_UPSTREAM_PENDING reason=${{ steps.pointer_preflight.outputs.reason }}"

      - name: Canonical pointer transition guard
        if: steps.supersession.outputs.superseded != 'true' && steps.pointer_preflight.outputs.ready == 'true'
        run: python nasdaq-xray/canonical_pointer_transition_guard.py

      - name: Guardian identity-partition self-test
        if: steps.supersession.outputs.superseded != 'true' && steps.pointer_preflight.outputs.ready == 'true'
        run: python nasdaq-xray/guardian_anomaly_selftest.py

      - name: Guardian anomaly layer
        if: steps.supersession.outputs.superseded != 'true' && steps.pointer_preflight.outputs.ready == 'true'
        run: python nasdaq-xray/guardian_anomaly.py

      - name: Structural fail-closed audit
        if: steps.supersession.outputs.superseded != 'true' && steps.pointer_preflight.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("nasdaq-xray")
          checks={
            "sec":("canonical_sec_official_witness.json","XRAY_SEC_OFFICIAL_WITNESS_V1"),
            "health":("external_health_state.json","XRAY_EXTERNAL_HEALTH_V1"),
            "macro":("canonical_macro_context.json","XRAY_MACRO_CONTEXT_V1"),
            "enrichment":("canonical_candidate_enrichment.json","XRAY_CANDIDATE_ENRICHMENT_V1"),
            "verify":("free_solution_verification.json","XRAY_FREE_SOLUTION_VERIFICATION_V1"),
            "provider_ledger":("provider_health_ledger.json","XRAY_PROVIDER_HEALTH_LEDGER_V1"),
            "official_guard":("canonical_official_source_guard.json","XRAY_OFFICIAL_SOURCE_GUARD_V1"),
            "pit_ledger":("official_pit_ledger.json","XRAY_OFFICIAL_PIT_LEDGER_V1"),
            "lineage":("canonical_data_lineage_registry.json","XRAY_DATA_LINEAGE_REGISTRY_V1"),
            "replay":("canonical_replay_guard.json","XRAY_DETERMINISTIC_REPLAY_GUARD_V2"),
            "guardian":("canonical_guardian_state.json","XRAY_GUARDIAN_STATE_V1"),
          }
          for name,(fn,schema) in checks.items():
              p=root/fn
              assert p.exists(),(name,"missing")
              j=json.load(open(p))
              assert j.get("schema")==schema,(name,j.get("schema"))
              if "execution" in j: assert j["execution"]=="NONE"
              if "real_money" in j: assert j["real_money"]=="NO-GO"
              if "alpha_authority" in j: assert j["alpha_authority"] is False
          ledger=json.load(open(root/"provider_health_ledger.json"))
          for provider,pstate in (ledger.get("providers") or {}).items():
              hs=pstate.get("last_http_status")
              if isinstance(hs,int) and 400 <= hs <= 499 and hs not in {408,425,429}:
                  assert pstate.get("last_error_retryable") is False,(provider,pstate)
                  assert int(pstate.get("consecutive_failures") or 0)==0,(provider,pstate)
                  assert float(pstate.get("open_until_epoch") or 0)==0,(provider,pstate)
          pit=json.load(open(root/"official_pit_ledger.json"))
          assert pit.get("append_only_semantics") is True,pit
          assert pit.get("unknown_never_pass") is True,pit
          assert int(pit.get("snapshot_count") or 0)>0,pit
          replay=json.load(open(root/"canonical_replay_guard.json"))
          assert replay.get("status")=="PASS",replay
          assert replay.get("asof_consistent") is True,replay
          guardian=json.load(open(root/"canonical_guardian_state.json"))
          assert guardian.get("status")!="FAIL_CLOSED",guardian
          sched=json.load(open(root/"scheduler_failover_contract.json"))
          assert sched.get("schema")=="XRAY_SCHEDULER_FAILOVER_CONTRACT_V1",sched
          assert sched.get("max_kicks_per_health_run")==1,sched
          assert int(sched.get("stale_after_seconds") or 0)>=3600,sched
          kick=json.load(open(root/"scheduler_kick_dataplane.json"))
          assert kick.get("schema")=="XRAY_SCHEDULER_KICK_V1",kick
          assert kick.get("execution")=="NONE" and kick.get("real_money")=="NO-GO",kick
          gov=json.load(open(root/"provider_automation_governance.json"))
          assert gov.get("schema")=="XRAY_PROVIDER_AUTOMATION_GOVERNANCE_V1",gov
          assert gov["providers"]["ALPHASTOCKS"]["unattended_automation_allowed"] is False,gov
          assert gov["providers"]["BIGDATA"]["paid_top_up_allowed"] is False,gov
          assert gov["providers"]["ALPACA"]["live_sip_g9_allowed"] is False,gov
          gems=json.load(open(root/"gem_integration_registry.json"))
          assert gems.get("schema")=="XRAY_GEM_INTEGRATION_REGISTRY_V1",gems
          assert gems.get("expected_gem_count")==36 and len(gems.get("gems") or [])==36,gems
          assert [x.get("id") for x in gems["gems"]]==list(range(1,37)),gems
          mig=json.load(open(root/"free_core_migration_contract.json"))
          assert mig.get("execution")=="NONE" and mig.get("real_money")=="NO-GO"
          assert mig["migration_candidates"]["market_cap"]["cutover"] is False
          assert mig["migration_candidates"]["account"]["cutover"] is False
          sec=json.load(open(root/"canonical_sec_official_witness.json"))
          if sec.get("status") in {"READY","READY_WITH_UNKNOWNS"}:
              assert sec.get("absence_never_clean") is True
              assert sec.get("alpha_authority") is False
              req=json.load(open(root/"canonical_current_event_request.json"))
              assert sec.get("asof_et")==req.get("asof_et")
              assert sec.get("geometry_scope_hash")==req.get("geometry_scope_hash")
              assert set(sec.get("results") or {})==set(req.get("geometry_scope") or [])
          print("XRAY_RESILIENCE_STRUCTURAL=PASS")
          PY

      - name: Commit resilience artifacts
        if: steps.supersession.outputs.superseded != 'true' && steps.pointer_preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-resilience-bot"
          git config user.email "xray-resilience-bot@users.noreply.github.com"
          files=(
            nasdaq-xray/canonical_sec_official_witness.json
            nasdaq-xray/external_health_state.json
            nasdaq-xray/canonical_macro_context.json
            nasdaq-xray/canonical_candidate_enrichment.json
            nasdaq-xray/free_solution_verification.json
            nasdaq-xray/provider_health_ledger.json
            nasdaq-xray/canonical_official_source_guard.json
            nasdaq-xray/official_pit_ledger.json
            nasdaq-xray/canonical_data_lineage_registry.json
            nasdaq-xray/canonical_replay_guard.json
            nasdaq-xray/canonical_guardian_state.json
          )
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for p in "${files[@]}"; do
            [ -f "$p" ] || continue
            mkdir -p "$tmpdir/$(dirname "$p")"
            cp "$p" "$tmpdir/$p"
          done
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git reset --hard origin/main
            for p in "${files[@]}"; do
              if [ -f "$tmpdir/$p" ]; then
                mkdir -p "$(dirname "$p")"
                cp "$tmpdir/$p" "$p"
              fi
            done
            git add "${files[@]}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "XRAY_RESILIENCE_COMMIT=NO_CHANGE"
              exit 0
            fi
            git commit -m "chore(xray): resilience witnesses"
            if git push origin HEAD:main; then
              echo "XRAY_RESILIENCE_COMMIT=PASS"
              exit 0
            fi
            sleep $((attempt*2))
          done
          echo "XRAY_RESILIENCE_COMMIT=FAIL" >&2
          exit 1
