name: XRAY Runner Provider Prerequisite Summary Regression (No Vendor IO)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/provider_runtime_readiness_summary.py'
      - 'nasdaq-xray/omni_source_start_falsification_shadow.py'
      - 'nasdaq-xray/tests/test_provider_runtime_readiness_summary.py'
      - '.github/workflows/xray-provider-prerequisite-regression.yml'
      - '.github/workflows/xray-provider-access-observer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-runner-prereq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-offline-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing source and new prerequisite negative tests (no secrets)
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/provider_runner_access_audit.py nasdaq-xray/provider_runtime_readiness_summary.py nasdaq-xray/tests/test_provider_runtime_readiness_summary.py
          python nasdaq-xray/provider_runner_access_audit.py --selftest
          python -O nasdaq-xray/provider_runner_access_audit.py --selftest
          python -m unittest discover -s nasdaq-xray/tests -p 'test_provider_runtime_readiness_summary.py' -v
          python -O -m unittest discover -s nasdaq-xray/tests -p 'test_provider_runtime_readiness_summary.py' -v
      - name: Independent 12-source 7-SHA start/final admission — Python and optimized
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/omni_source_start_falsification_shadow.py
          python nasdaq-xray/omni_source_start_falsification_shadow.py --selftest
          python -O nasdaq-xray/omni_source_start_falsification_shadow.py --selftest
          python nasdaq-xray/omni_source_start_falsification_shadow.py --check-current > "$RUNNER_TEMP/xray_omni_source_shadow.jsonl"
          python -O nasdaq-xray/omni_source_start_falsification_shadow.py --check-current > "$RUNNER_TEMP/xray_omni_source_optimized.jsonl"
          python - <<'PY'
          import json,os,pathlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])
          normal=json.loads((base/"xray_omni_source_shadow.jsonl").read_text().splitlines()[0])
          optimized=json.loads((base/"xray_omni_source_optimized.jsonl").read_text().splitlines()[0])
          assert normal == optimized
          assert normal["provider_count"]==12 and normal["additional_unpromoted_candidate_count"]==11 and normal["exact_git_blob_edges"]==7
          assert normal["research_start"]=="CONFIGURED_READ_ONLY_MONITORING"
          assert normal["final_release"]=="NO_GO"
          assert normal["new_primary_created"] is False
          assert normal["new_r92_created"] is False
          assert normal["notifications_sent"] is False
          assert normal["market_vendor_calls"]==0
          print("XRAY_OMNI_SOURCE_START=PASS_12_SOURCES_11_BACKUPS_7_SHA_23_NEGATIVES_NO_FINAL_GO")
          PY
      - name: Explicitly prohibit vendor calls and any automatic promotion
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('nasdaq-xray/provider_runtime_readiness_summary.py').read_text()
          for f in ('requests.get(', 'urllib.request.urlopen(', 'subprocess.run(', 'api_key', 'order_submit('):
              assert f not in src,f
          for f in ('"can_create_PRIMARY": False', '"can_create_HISTORY_PASS": False',
                    '"can_register_R92": False', '"independently_verified_vendor_license": False'):
              assert f in src,f
          print('XRAY_PROVIDER_RUNNER_PREREQ_NO_DATA_NO_ALPHA=PASS')
          PY
