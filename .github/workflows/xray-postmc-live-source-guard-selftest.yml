name: XRAY Post-MC Live Source Fence Selftest
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/post_mc_live_source_guard.py"
      - ".github/workflows/xray-postmc-live-source-guard-selftest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and independent positive/negative source-SHA regression
        run: |
          python -m py_compile nasdaq-xray/post_mc_live_source_guard.py
          python nasdaq-xray/post_mc_live_source_guard.py --selftest
      - name: Verify early and before-Stage1 fences are both wired to exact MC
        run: |
          python - <<'PY'
          from pathlib import Path
          w=Path(".github/workflows/xray-canonical-current-post-mc.yml").read_text()
          names=[
            "Commit newly built immutable resolver and MC authority before alpha",
            "Before-history exact-live Pre-MC active authority guard",
            "Reuse exact same-ASOF HISTORY and LEGAL",
            "Revalidate reused HISTORY and hydrate same-run technical cache",
            "Early exact-live Pre-MC SHA fence (FAIL CLOSED on staleness)",
            "Run Stage1",
          ]
          positions=[w.index("      - name: "+n) for n in names]
          assert positions==sorted(positions),positions
          for section_title,next_title in [
            (names[1],names[2]),(names[4],names[5])
          ]:
              start=w.index("      - name: "+section_title)
              end=w.index("      - name: "+next_title)
              chunk=w[start:end]
              assert "XRAY_MC_AUTHORITY_PATH: ${{ steps.mc.outputs.path }}" in chunk
              assert "post_mc_live_source_guard.py --check" in chunk
          assert "steps.early_authority.outputs.stale != 'true'" in w
          print("XRAY_POSTMC_DUAL_FENCE_ORDER_SELFTEST=PASS")
          PY
      - name: Validate live active MC supersession and exact source SHA
        run: |
          set -euo pipefail
          export XRAY_ASOF_ET=2026-10-07
          export XRAY_MC_AUTHORITY_PATH="$(python nasdaq-xray/post_mc_live_source_guard.py --discover-active)"
          python nasdaq-xray/post_mc_live_source_guard.py --check
          export XRAY_MC_AUTHORITY_PATH=nasdaq-xray/canonical_mc_bridge_20261007_c417_dv30_v13.json
          if python nasdaq-xray/post_mc_live_source_guard.py --check; then
            echo "SUPERSEDED_MC_ACCEPTED" >&2
            exit 1
          else
            echo "XRAY_POSTMC_SUPERSEDED_MC_NEGATIVE_TEST=PASS"
          fi
