name: XRAY Strict G9 Gate

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/strict_g9_probe.py"
      - "nasdaq-xray/strict_g9_probe_selftest.py"
      - "nasdaq-xray/g9_entitlement_authority.json"
      - "nasdaq-xray/g9_provider_adapter_contract.json"
      - ".github/workflows/xray-strict-g9-gate.yml"
  schedule:
    - cron: "32 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-strict-g9-gate
  cancel-in-progress: true

jobs:
  strict-g9:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TRADESTATION_CLIENT_ID: ${{ secrets.TRADESTATION_CLIENT_ID }}
      TRADESTATION_CLIENT_SECRET: ${{ secrets.TRADESTATION_CLIENT_SECRET }}
      TRADESTATION_REFRESH_TOKEN: ${{ secrets.TRADESTATION_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Compile strict G9 probe
        run: python -m py_compile nasdaq-xray/strict_g9_probe.py nasdaq-xray/strict_g9_probe_selftest.py

      - name: Run strict fail-closed selftest
        run: python nasdaq-xray/strict_g9_probe_selftest.py

      - name: Run strict fail-closed G9 probe
        run: python nasdaq-xray/strict_g9_probe.py

      - name: Structural audit
        run: |
          python - <<'PY'
          import json
          p="nasdaq-xray/strict_g9_runtime_state.json"
          j=json.load(open(p))
          assert j["schema"]=="XRAY_STRICT_G9_RUNTIME_V1"
          assert j["execution"]=="NONE"
          assert j["real_money"]=="NO-GO"
          assert j["alpha_authority"] is False
          assert isinstance(j["g9_pass"],bool)
          adapters=json.load(open("nasdaq-xray/g9_provider_adapter_contract.json"))
          assert j["adapter_contract_schema"]==adapters["schema"]
          if j["g9_pass"]:
              assert j["adapter_status"]=="IMPLEMENTED"
              assert j["status"]=="G9_PASS"
              assert j["authority_status"]=="PROVEN"
              assert j["technical_status"]=="PASS_AWAITING_ENTITLEMENT_AUTHORITY"
              assert set(j.get("technical_evidence",{}))=={"AAPL","NVDA"}
              for sym,v in j["technical_evidence"].items():
                  assert v["is_delayed"] is False
                  assert v["quote_age_seconds"] <= 60
                  assert v["trade_age_seconds"] <= 60
                  assert v["max_quote_trade_skew_seconds"] <= 15
          print("XRAY_STRICT_G9_STRUCTURAL=PASS")
          PY

      - name: Commit only meaningful gate changes or fresh PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-g9-bot"
          git config user.email "xray-g9-bot@users.noreply.github.com"
          old="nasdaq-xray/strict_g9_runtime_state.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$old" /tmp/old_g9.json 2>/dev/null || echo '{}' > /tmp/old_g9.json

            # Recompute from the exact latest-main authority + adapter contract.
            # Never persist a runtime derived from an older push-event snapshot.
            python nasdaq-xray/strict_g9_probe.py

            should_commit="$(python - <<'PY'
          import json
          try: new=json.load(open("nasdaq-xray/strict_g9_runtime_state.json"))
          except Exception: raise SystemExit("new runtime unreadable")
          try: old=json.load(open("/tmp/old_g9.json"))
          except Exception: old={}
          keys=("status","reason","g9_pass","authority_status","technical_status","provider","adapter_contract_schema","adapter_status")
          changed=any(old.get(k)!=new.get(k) for k in keys)
          print("yes" if changed or new.get("g9_pass") is True else "no")
          PY
            )"

            if [ "$should_commit" != "yes" ]; then
              echo "XRAY_STRICT_G9_COMMIT=NO_SEMANTIC_CHANGE"
              git reset --hard origin/main
              exit 0
            fi

            git add "$old"
            git commit -m "chore(xray): refresh strict G9 gate"
            if git push origin HEAD:main; then
              echo "XRAY_STRICT_G9_COMMIT=PASS"
              exit 0
            fi

            echo "XRAY_STRICT_G9_PUSH_RACE attempt=$attempt"
            sleep $((attempt*2))
          done
          echo "XRAY_STRICT_G9_COMMIT=FAIL" >&2
          exit 1
