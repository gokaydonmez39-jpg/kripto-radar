name: XRAY Personal 477 EOD Missing-Schedule Fallback (No Signals)
on:
  pull_request:
    branches: [main]
    paths:
      - 'personal-swing/schedule_failover.py'
      - 'personal-swing/test_schedule_failover.py'
      - 'personal-swing/fallback_source_provenance.py'
      - 'personal-swing/epoch_lease.py'
      - 'personal-swing/test_epoch_lease.py'
      - 'personal-swing/fallback_job_receipt.py'
      - 'personal-swing/test_fallback_job_receipt.py'
      - 'personal-swing/test_fallback_source_provenance.py'
      - '.github/workflows/xray-personal-477-schedule-fallback.yml'
  push:
    branches: [main]
    paths:
      - 'personal-swing/schedule_failover.py'
      - 'personal-swing/test_schedule_failover.py'
      - 'personal-swing/fallback_source_provenance.py'
      - 'personal-swing/epoch_lease.py'
      - 'personal-swing/test_epoch_lease.py'
      - 'personal-swing/fallback_job_receipt.py'
      - 'personal-swing/test_fallback_job_receipt.py'
      - 'personal-swing/test_fallback_source_provenance.py'
      - '.github/workflows/xray-personal-477-schedule-fallback.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'No dispatch for manual checks unless explicitly disabled'
        required: true
        type: boolean
        default: true
  schedule:
    # UTC 00:26 Tue-Sat = Mon-Fri NY evening, after official XNAS close+45m.
    # The fallback only dispatches when NO current-session personal run exists.
    - cron: '26 0 * * 2-6'
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && format('xray-personal-477-scheduler-fallback-test-{0}', github.run_id) || 'xray-personal-477-scheduler-fallback' }}
  cancel-in-progress: false
jobs:
  offline-negative-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official XNAS calendar (offline tests, no vendor data)
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Fail-closed official session and CAS-like duplicate-suppression tests
        working-directory: personal-swing
        run: |
          python -m unittest -q test_schedule_failover test_fallback_source_provenance test_epoch_lease test_fallback_job_receipt
          python -O -m unittest -q test_schedule_failover test_fallback_source_provenance test_epoch_lease test_fallback_job_receipt
          python -m py_compile schedule_failover.py fallback_source_provenance.py epoch_lease.py
      - name: Enforce global NASDAQ workflow-schedule boundary contract
        run: |
          python -m pip install 'PyYAML==6.0.2'
          PYTHONDONTWRITEBYTECODE=1 python nasdaq-xray/all_workflow_schedule_audit.py --selftest
  dispatch-if-missing:
    needs: offline-negative-regression
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official XNAS calendar
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Dispatch personal DATA-ONLY scan only on verified missing scheduler epoch
        id: primary-detect
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$DRY_RUN_INPUT" != "false" ]]; then
            args+=(--dry-run)
          fi
          # Preserve the exact exit status: a missing EOD stays RED.
          python personal-swing/schedule_failover.py "${args[@]}" | tee "$RUNNER_TEMP/xray-fallback-result.json"
          # A green GITHUB scheduler run alone is insufficient; request a
          # second, independent GitHub-only six-job source receipt.
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          try:
              rows=Path(os.environ['RUNNER_TEMP'],'xray-fallback-result.json').read_text().splitlines()
              if len(rows)!=1:
                  raise ValueError('UNTRUSTED_FALLBACK_STATUS')
              status=json.loads(rows[0])
              if status.get('status') in ('NOOP_CURRENT_EPOCH_RUN_EXISTS',
                                           'NOOP_RECHECK_CURRENT_EPOCH_RUN_EXISTS'):
                  asof=status.get('asof_et')
                  if not isinstance(asof,str) or not re.fullmatch(r'20[0-9]{2}-[0-9]{2}-[0-9]{2}',asof):
                      raise ValueError('UNTRUSTED_EOD_ASOF')
                  with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as handle:
                      handle.write('primary_found=true\\n')
                      handle.write('verified_asof='+asof+'\\n')
          except Exception:
              print('BLOCKED_FALLBACK_SOURCE_STATUS_PARSE')
              raise SystemExit(3)
          PY
      - name: Independent natural primary six-job source audit (GH GET only)
        if: ${{ github.event_name == 'schedule' && steps.primary-detect.outputs.primary_found == 'true' }}
        working-directory: personal-swing
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIMARY_ASOF: ${{ steps.primary-detect.outputs.verified_asof }}
        run: |
          set -euo pipefail
          python fallback_job_receipt.py --asof "$PRIMARY_ASOF"
      - name: Explicit safe fallback bounds
        run: echo 'No market bars or signals read here, no Sheets, no broker or user-facing notification.'
