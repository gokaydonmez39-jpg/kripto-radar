name: XRAY Personal 477 EOD Missing-Schedule Fallback (No Signals)
on:
  pull_request:
    branches: [main]
    paths:
      - 'personal-swing/schedule_failover.py'
      - 'personal-swing/test_schedule_failover.py'
      - '.github/workflows/xray-personal-477-schedule-fallback.yml'
  push:
    branches: [main]
    paths:
      - 'personal-swing/schedule_failover.py'
      - 'personal-swing/test_schedule_failover.py'
      - '.github/workflows/xray-personal-477-schedule-fallback.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'No dispatch for manual checks unless explicitly disabled'
        required: true
        type: boolean
        default: true
  schedule:
    # UTC 00:25 Tue-Sat = Mon-Fri NY evening, after official XNAS close+45m.
    # The fallback only dispatches when NO current-session personal run exists.
    - cron: '25 0 * * 2-6'
permissions:
  contents: read
concurrency:
  group: xray-personal-477-scheduler-fallback
  cancel-in-progress: false
jobs:
  offline-negative-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official XNAS calendar (offline tests, no vendor data)
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Fail-closed official session and CAS-like duplicate-suppression tests
        working-directory: personal-swing
        run: |
          python -m unittest -q test_schedule_failover
          python -O -m unittest -q test_schedule_failover
          python -m py_compile schedule_failover.py
  dispatch-if-missing:
    needs: offline-negative-regression
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official XNAS calendar
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Dispatch personal DATA-ONLY scan only on verified missing scheduler epoch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$DRY_RUN_INPUT" != "false" ]]; then
            args+=(--dry-run)
          fi
          python personal-swing/schedule_failover.py "${args[@]}"
      - name: Explicit safe fallback bounds
        run: echo 'No market bars or signals read here, no Sheets, no broker or user-facing notification.'
