name: XRAY v33 FISV-CCC SIP 260-Session History Witness (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/xray_v33_two_symbol_260_sip_shadow.py'
      - '.github/workflows/xray-v33-two-symbol-sip-260-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'nasdaq-xray/xray_v33_two_symbol_260_sip_shadow.py'
      - '.github/workflows/xray-v33-two-symbol-sip-260-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-v33-two-symbol-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  history-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Official Nasdaq calendar dependency
        run: python -m pip install --disable-pip-version-check 'pandas_market_calendars==5.4.0'
      - name: No-vendor synthetic test 260 session and negative cases
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/xray_v33_two_symbol_260_sip_shadow.py
          python nasdaq-xray/xray_v33_two_symbol_260_sip_shadow.py --selftest
          python -O nasdaq-xray/xray_v33_two_symbol_260_sip_shadow.py --selftest
      - name: Existing secrets main-only; FISV CCC 260 official sessions <=3 SIP pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          python nasdaq-xray/xray_v33_two_symbol_260_sip_shadow.py --out "$RUNNER_TEMP/xray_v33_260_counts.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'xray_v33_260_counts.json').read_text())
          assert x['schema']=='XRAY_V33_TWO_SYMBOL_SIP_260_SHADOW_V1'
          assert x['sip_pages_used'] <= 3
          assert x['r92_count']==0 and x['canonical_history_pass_authority'] is False
          assert x['canonical_price_pass_authority'] is False
          assert x['execution']=='NONE' and x['real_money']=='NO-GO' and x['unknown_never_pass'] is True
          assert not x['raw_vendor_bars_persisted'] and not x['secrets_persisted']
          assert not x['corporate_actions_adjustments_proven'] and not x['non_display_automation_rights_proven']
          assert not x['canonical_files_mutated'] and not x['broker']
          assert not any(s in x for s in ('trades','raw_bars','prices','volumes','credentials'))
          print('XRAY_V33_260_SAFE_AGGREGATE=PASS_'+x['status'])
          PY
      - name: Preserve counts only, seven days
        if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-v33-fisv-ccc-history-counts-no-alpha
          path: ${{ runner.temp }}/xray_v33_260_counts.json
          if-no-files-found: warn
          retention-days: 7