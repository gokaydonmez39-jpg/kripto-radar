name: XRAY Strict G9 Gate

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/strict_g9_probe.py"
      - "nasdaq-xray/g9_entitlement_authority.json"
      - "nasdaq-xray/account_gate_contract.json"
      - ".github/workflows/xray-external-gates.yml"
  schedule:
    - cron: "37 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-external-gate-probe
  cancel-in-progress: true

jobs:
  g9:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRADESTATION_CLIENT_ID: ${{ secrets.TRADESTATION_CLIENT_ID }}
      TRADESTATION_CLIENT_SECRET: ${{ secrets.TRADESTATION_CLIENT_SECRET }}
      TRADESTATION_REFRESH_TOKEN: ${{ secrets.TRADESTATION_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Compile strict probe
        run: python -m py_compile nasdaq-xray/strict_g9_probe.py

      - name: Run strict G9 probe
        run: python nasdaq-xray/strict_g9_probe.py

      - name: Structural fail-closed audit
        run: |
          python - <<'PY'
          import json
          p="nasdaq-xray/strict_g9_runtime_state.json"
          j=json.load(open(p))
          assert j["schema"]=="XRAY_STRICT_G9_RUNTIME_V1"
          assert j["execution"]=="NONE"
          assert j["real_money"]=="NO-GO"
          if j.get("g9_pass"):
              auth=json.load(open("nasdaq-xray/g9_entitlement_authority.json"))
              assert auth.get("status")=="PROVEN"
              assert j.get("status")=="G9_PASS"
              assert j.get("reason")=="A_B_C_D_ALL_PROVEN"
              assert set((j.get("technical_evidence") or {}).keys())=={"AAPL","NVDA"}
          else:
              assert j.get("status")!="G9_PASS"
          print("XRAY_EXTERNAL_GATE_STRUCTURAL=PASS")
          PY

      - name: Commit public-safe G9 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-gate-bot"
          git config user.email "xray-gate-bot@users.noreply.github.com"
          cp nasdaq-xray/strict_g9_runtime_state.json /tmp/strict_g9_runtime_state.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/strict_g9_runtime_state.json nasdaq-xray/strict_g9_runtime_state.json
            git add nasdaq-xray/strict_g9_runtime_state.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(xray): reconcile strict external G9 gate [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
