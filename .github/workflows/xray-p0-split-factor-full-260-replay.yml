name: XRAY P0 11 Stock Split Mathematical Replay SIP and CA (No GO)
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_split_factor_full_260_replay_shadow.py"
      - ".github/workflows/xray-p0-split-factor-full-260-replay.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay-11-real-issuer-split-factors:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Enforce exact invoking commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pinned official calendar, dynamic positive and negative split-factor tests
        run: |
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python -m py_compile nasdaq-xray/p0_split_factor_full_260_replay_shadow.py
          python nasdaq-xray/p0_split_factor_full_260_replay_shadow.py --selftest
          python -O nasdaq-xray/p0_split_factor_full_260_replay_shadow.py --selftest
      - name: Read exact previous 515 dual-bar SHA-bound evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ratio"
          gh run download 38178676524 -R "${{ github.repository }}" \
            -n xray-alpaca-515-raw-split-daily-shadow-sanitized -D "$RUNNER_TEMP/ratio"
          test -s "$RUNNER_TEMP/ratio/xray_515_raw_split_research.json"
      - name: Fetch authentic SIP dual bars + actual split rates and replay all 260 sessions
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          python nasdaq-xray/p0_split_factor_full_260_replay_shadow.py \
            --dual "$RUNNER_TEMP/ratio/xray_515_raw_split_research.json" \
            --out "$RUNNER_TEMP/ratio/xray_split_factor_replay_sanitized.json"
      - name: Validate no MC/HISTORY/GO promotion and exact source SHAs
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"ratio/xray_split_factor_replay_sanitized.json"
          d=json.loads(p.read_text())
          assert d["schema"]=="XRAY_P0_11_SPLIT_FACTOR_FULL_260_MATHEMATICAL_REPLAY_SHADOW_V1"
          assert d["full_515_scope_bound"]==515 and d["split_restatement_cohort"]==11
          assert d["verified_split_factor_math"]+d["unresolved_split_factor_math"]==11
          assert len(d["per_symbol_status"])==11
          assert d["source_price_blob_sha"]==subprocess.check_output([
            "git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],text=True).strip()
          assert d["source_master_blob_sha"]==subprocess.check_output([
            "git","hash-object","nasdaq-xray/canonical_current_master_manifest.json"],text=True).strip()
          assert d["vendor_raw_prices_shares_or_CA_event_ids_persisted"] is False
          assert d["C417_PRIMARY_MC_created"]==d["canonical_HISTORY_PASS_created"]==0
          assert d["R92_created"] is False and d["GO"] is False
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          print("XRAY_P0_SPLIT_FACTOR_RESULT="+str(d["verified_split_factor_math"])+"/11_VERIFY_SHADOW")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-p0-eleven-260-split-factor-mathematical-replay-no-go
          path: ${{ runner.temp }}/ratio/xray_split_factor_replay_sanitized.json
          retention-days: 14
          if-no-files-found: error
