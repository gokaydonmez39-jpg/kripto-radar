name: XRAY External Module Admission — Offline Fail-Closed Tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/research/third_party_module_admission_20261018_v1.json'
      - 'nasdaq-xray/tests/test_third_party_module_admission.py'
      - 'nasdaq-xray/external_ohlcv_research_shadow.py'
      - 'nasdaq-xray/tests/test_external_ohlcv_research_shadow.py'
      - '.github/workflows/xray-third-party-module-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-external-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-research-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official session calendar for existing C4.17 regressions
        run: python -m pip install --disable-pip-version-check 'pandas_market_calendars==5.4.0'
      - name: Check external module admission manifest and negative mutations
        run: |
          python -m py_compile nasdaq-xray/tests/test_third_party_module_admission.py
          python -m unittest discover -s nasdaq-xray/tests -p 'test_third_party_module_admission.py' -v
          python -O -m unittest discover -s nasdaq-xray/tests -p 'test_third_party_module_admission.py' -v
      - name: Test OpenBB and Qlib private-export adapter against the exact-260 validator
        run: |
          python -m py_compile nasdaq-xray/external_ohlcv_research_shadow.py nasdaq-xray/tests/test_external_ohlcv_research_shadow.py
          python -m unittest discover -s nasdaq-xray/tests -p 'test_external_ohlcv_research_shadow.py' -v
          python -O -m unittest discover -s nasdaq-xray/tests -p 'test_external_ohlcv_research_shadow.py' -v
      - name: Re-run existing licensed-source fail-closed and exact-session controls
        run: |
          python nasdaq-xray/c418_multi_source_guard.py --selftest
          python nasdaq-xray/c418_history_exact_session_shadow_guard.py --selftest
          python nasdaq-xray/c418_shadow_resilience_guard.py --selftest
          python nasdaq-xray/xray_multi_provider_research.py --selftest
          python nasdaq-xray/source_epoch_freshness_guard.py --selftest
      - name: Re-run existing isolated research memory positive and negative tests
        run: |
          python -m unittest discover -s nasdaq-xray/tests -p 'test_research_candidate_memory.py' -v
          python -m unittest discover -s nasdaq-xray/tests -p 'test_research_candidate_memory_cas.py' -v
      - name: Declare scope precisely
        run: |
          echo '## XRAY external-module selection: offline research protections only' >> "$GITHUB_STEP_SUMMARY"
          echo 'OpenBB/Qlib published export schema adapters tested with synthetic rows; no third-party package or live vendor run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No market data, no vendor credentials, no broker orders, no primary MC/PRICE, no R92, no user notification.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This run cannot authorize production adoption or license rights.' >> "$GITHUB_STEP_SUMMARY"
