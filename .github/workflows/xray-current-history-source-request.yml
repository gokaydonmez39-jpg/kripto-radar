name: XRAY Current PRICE Scope History Source Request (Research Only)
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/current_history_source_request.py"
      - "nasdaq-xray/free_history_source_preflight.py"
      - "nasdaq-xray/qualified_history_ingress_shadow.py"
      - "nasdaq-xray/massive_splits_asof_shadow.py"
      - "nasdaq-xray/twelve_data_history_probe.py"
      - "nasdaq-xray/massive_grouped_one_day.py"
      - "nasdaq-xray/history_transport_cache_guard.py"
      - "nasdaq-xray/canonical_current_price_dv30.json"
      - "nasdaq-xray/canonical_current_master_manifest.json"
      - ".github/workflows/xray-current-history-source-request.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-request:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      XRAY_TWELVE_DATA_API_KEY: ${{ secrets.XRAY_TWELVE_DATA_API_KEY }}
      XRAY_MASSIVE_API_KEY: ${{ secrets.XRAY_MASSIVE_API_KEY }}
      XRAY_MASSIVE_NONDISPLAY_LICENSE_OK: ${{ vars.XRAY_MASSIVE_NONDISPLAY_LICENSE_OK }}
      XRAY_MASSIVE_LICENSE_EVIDENCE_SHA256: ${{ secrets.XRAY_MASSIVE_LICENSE_EVIDENCE_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Exact triggering source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "XRAY_HISTORY_REQUEST_HEAD_EXACT=PASS"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed Nasdaq exchange calendar
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Adversarial positive and negative tests
        run: |
          python -m py_compile nasdaq-xray/current_history_source_request.py
          python nasdaq-xray/current_history_source_request.py --selftest
      - name: Validate $0 Twelve Data quota against exact current PRICE SHA (no API key or vendor calls)
        run: |
          python -m py_compile nasdaq-xray/free_history_source_preflight.py
          python nasdaq-xray/free_history_source_preflight.py --selftest
          python nasdaq-xray/free_history_source_preflight.py --out "$RUNNER_TEMP/xray_twelve_data_free_scope_preflight.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_twelve_data_free_scope_preflight.json").read_text())
          assert x["schema"]=="XRAY_ZERO_DOLLAR_HISTORY_PROVIDER_PREFLIGHT_V1"
          assert x["source_price_blob_sha"]==__import__("subprocess").check_output(
              ["git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],text=True).strip()
          assert x["scope_initial_credit_estimate"]==x["price_pass_count"]
          assert x["scope_fits_published_daily_budget"] is True
          assert x["universe_full_daily_refresh_fits_one_key"] is False
          assert x["history_authoritative"] is False
          assert x["actual_260_daily_52_week_source_proven"] is False
          assert x["can_register_R92"] is False
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          print("XRAY_TWELVE_BASIC_HISTORY_SCOPE_BUDGET_SHA_CHECK=PASS_NONAUTHORITY")
          PY
      - name: Private licensed-source transport stage structural positive and negatives
        run: |
          python -m py_compile nasdaq-xray/qualified_history_ingress_shadow.py
          python nasdaq-xray/qualified_history_ingress_shadow.py --selftest
          python nasdaq-xray/qualified_history_ingress_shadow.py \
            --private-cache-dir "$RUNNER_TEMP/xray-private-vendor-cache-does-not-exist" \
            --out "$RUNNER_TEMP/xray_private_history_intake_shadow.json"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_private_history_intake_shadow.json").read_text())
          assert x["schema"]=="XRAY_PRIVATE_HISTORY_514_TRANSPORT_INTAKE_SHADOW_V1"
          price=json.loads(Path("nasdaq-xray/canonical_current_price_dv30.json").read_text())
          assert x["price_pass_count"]==price["pass_count"]
          assert x["source_price_blob_sha"]==subprocess.check_output(
              ["git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],
              text=True).strip()
          assert x["expected_daily_count"]==260 and x["expected_completed_week_closes"]==52
          assert x["counts"]["missing_file"]==x["private_transport_tickers_checked"]
          assert x["structural_private_transport_complete"] is False
          for k in ("source_vendor_rights_independently_verified",
                    "source_exchangewide_volume_proven",
                    "current_history_authority_proven","can_register_R92"):
              assert x[k] is False,k
          assert x["canonical_history_pass_created"]==0 and x["primary_mc_pass_created"]==0
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          print("XRAY_PRIVATE_CURRENT_SCOPE_HISTORY_INTAKE_HEAD_BOUND=PASS_MISSING_VENDOR_DATA_BLOCKED")
          PY
      - name: Validate free Massive split event ASOF bounds without lookahead or vendor fetch
        run: |
          python -m py_compile nasdaq-xray/massive_splits_asof_shadow.py
          python nasdaq-xray/massive_splits_asof_shadow.py --selftest
          echo "XRAY_CORPORATE_SPLIT_DATA_RESEARCH_ONLY=PASS_NO_REAL_SOURCE_AUTHORITY"

      - name: One-credit Twelve Data real-history probe if free key is configured
        run: |
          python -m py_compile nasdaq-xray/twelve_data_history_probe.py
          python nasdaq-xray/twelve_data_history_probe.py --selftest
          python nasdaq-xray/twelve_data_history_probe.py --output "$RUNNER_TEMP/xray_twelve_data_history_sample.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_twelve_data_history_sample.json").read_text())
          assert x["schema"]=="XRAY_TWELVE_EOD_SINGLE_SAMPLE_V1"
          assert x["api_calls"]<=1 and x["bars_valid"]<=320
          assert x["history_authority"] is False and x["mc_authority"] is False
          assert x["can_register_R92"] is False and x["vendor_data_persisted"] is False
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          print("XRAY_TWELVE_REAL_HISTORY_AUTHORITY=BLOCKED_UNTIL_FULL_LICENSE_AND_SOURCE")
          PY

      - name: Validate Massive Basic grouped one-call full PRICE scope under rights gate
        run: |
          python -m py_compile nasdaq-xray/massive_grouped_one_day.py
          python nasdaq-xray/massive_grouped_one_day.py --selftest
          python nasdaq-xray/massive_grouped_one_day.py --out "$RUNNER_TEMP/xray_massive_grouped_scope.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_massive_grouped_scope.json").read_text())
          assert x["schema"]=="XRAY_MASSIVE_GROUPED_EOD_SHADOW_V1"
          price=json.loads(Path("nasdaq-xray/canonical_current_price_dv30.json").read_text())
          assert x["calls"]<=1 and x["scope_count"]==price["pass_count"]
          assert x["HISTORY_PASS"] is False and x["MC_PASS"] is False and x["R92_AL"] is False
          assert x["source_independent_of_RALLIES"] is False
          assert x["vendor_bars_persisted"] is False
          print("XRAY_MASSIVE_GROUPED_FREE_SINGLE_CALL="+x["status"])
          PY
      - name: Assemble current real Git scope (not market data)
        run: |
          python nasdaq-xray/current_history_source_request.py --out "${RUNNER_TEMP}/xray_current_history_source_request.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          doc=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_current_history_source_request.json").read_text())
          assert doc["schema"]=="XRAY_C417_CURRENT_HISTORY_SOURCE_REQUEST_V1"
          assert doc["status"]=="RESEARCH_HISTORY_REQUEST_READY_NO_MARKET_HISTORY_MEASURED"
          assert doc["source_price_pass_count"]==len(doc["symbol_scope"])
          assert hashlib.sha256(chr(10).join(doc["symbol_scope"]).encode()).hexdigest()==doc["source_price_pass_hash"]
          assert len(doc["required_daily_official_sessions"])==260
          assert len(doc["required_completed_week_closes"])==52
          assert doc["source_entitlement_proven"] is False
          assert doc["current_history_authority_proven"] is False
          assert doc["canonical_history_pass_created"]==0
          assert doc["can_register_R92"] is False
          assert doc["execution"]=="NONE" and doc["real_money"]=="NO-GO"
          print("XRAY_HISTORY_CURRENT_SCOPE_REQUEST_SAFETY=PASS")
          PY
      - name: Persist only public tickers and official calendar schedule
        uses: actions/upload-artifact@v4
        with:
          name: xray-current-history-source-request-no-vendor-bars
          path: |
            ${{ runner.temp }}/xray_current_history_source_request.json
            ${{ runner.temp }}/xray_twelve_data_free_scope_preflight.json
            ${{ runner.temp }}/xray_private_history_intake_shadow.json
            ${{ runner.temp }}/xray_twelve_data_history_sample.json
            ${{ runner.temp }}/xray_massive_grouped_scope.json
          if-no-files-found: error
          retention-days: 14
