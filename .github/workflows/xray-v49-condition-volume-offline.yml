name: XRAY v49 A3 Synthetic Condition Eligibility (No Data No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/xray_v49_condition_volume_shadow.py'
      - 'nasdaq-xray/test_xray_v49_condition_volume_shadow.py'
      - 'nasdaq-xray/xray_v49_condition_counterexamples_synthetic.json'
      - 'nasdaq-xray/xray_v50_au_vv_eod_reconcile_shadow.py'
      - 'nasdaq-xray/test_xray_v50_au_vv_eod_reconcile_shadow.py'
      - 'nasdaq-xray/xray_v50_au_vv_synthetic_fixture.json'
      - '.github/workflows/xray-v49-condition-volume-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-condition-negative-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify 33 adversarial cases normal and optimized and fixture
        shell: bash
        run: |
          set -euo pipefail
          cd nasdaq-xray
          python -m py_compile xray_v49_condition_volume_shadow.py test_xray_v49_condition_volume_shadow.py
          python -m unittest -v test_xray_v49_condition_volume_shadow.py
          python -O -m unittest -v test_xray_v49_condition_volume_shadow.py
          python xray_v49_condition_volume_shadow.py xray_v49_condition_counterexamples_synthetic.json | grep -q OFFLINE_CONDITION_COUNTEREXAMPLES_ONLY_NO_MARKET_AUTHORITY
          python -m py_compile xray_v50_au_vv_eod_reconcile_shadow.py test_xray_v50_au_vv_eod_reconcile_shadow.py
          python -m unittest -v test_xray_v50_au_vv_eod_reconcile_shadow.py
          python -O -m unittest -v test_xray_v50_au_vv_eod_reconcile_shadow.py
          python xray_v50_au_vv_eod_reconcile_shadow.py xray_v50_au_vv_synthetic_fixture.json | grep -q SYNTHETIC_SCOPE_AND_MATH_ONLY_NO_EXTERNAL_EVIDENCE
      - name: Enforce offline and no certified market/trading authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('nasdaq-xray/xray_v49_condition_volume_shadow.py')
          s=p.read_text(encoding='utf-8')
          imported=set()
          for n in ast.walk(ast.parse(s)):
              if isinstance(n,ast.Import):
                  imported.update(z.name.split('.')[0] for z in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module:
                  imported.add(n.module.split('.')[0])
          assert not imported.intersection({'requests','urllib','http','socket','subprocess','alpaca','os','ccxt'})
          for must in ("'a3_release_ready': False", "'canonical_price_pass': False",
                       "'registered_r92_count': 0", "'execution': 'NONE'",
                       "'real_money': 'NO-GO'", "'unknown_never_pass': True",
                       "'actual_sip_trade_cancel_correction_replayed': False",
                       "'official_settled_consolidated_volume_reconciled': False"):
              assert must in s,must
          # Also inspect the v50 module separately rather than trust the v49 check.
          p50=Path('nasdaq-xray/xray_v50_au_vv_eod_reconcile_shadow.py')
          s50=p50.read_text(encoding='utf-8')
          tree50=ast.parse(s50)
          mods50=set()
          for n in ast.walk(tree50):
              if isinstance(n,ast.Import):
                  mods50.update(z.name.split('.')[0] for z in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module:
                  mods50.add(n.module.split('.')[0])
          assert not mods50.intersection({'requests','urllib','http','socket','subprocess','alpaca','os','ccxt'})
          for expected in ("'real_utp_au_final_received': False",
                           "'independent_real_per_issue_reference_verified': False",
                           "'a3_release_ready': False",
                           "'canonical_price_pass': False",
                           "'registered_r92_count': 0",
                           "'execution': 'NONE'", "'real_money': 'NO-GO'"):
              assert expected in s50,expected
          print('XRAY_V49_A3_OFFLINE_NO_VENDOR_NO_ORDER_NO_AL_PASS')
          PY