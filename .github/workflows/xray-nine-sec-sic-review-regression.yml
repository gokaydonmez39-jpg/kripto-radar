name: XRAY Nine SEC SIC Contradiction Review (No Alpha)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/research/master_20261014_nine_sec_sic_review_v1.json"
      - "nasdaq-xray/master_nine_sec_sic_review_guard.py"
      - ".github/workflows/xray-nine-sec-sic-review-regression.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/research/master_20261014_nine_sec_sic_review_v1.json"
      - "nasdaq-xray/master_nine_sec_sic_review_guard.py"
      - ".github/workflows/xray-nine-sec-sic-review-regression.yml"
permissions:
  contents: read
jobs:
  source-date-cik-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Restore immutable 14-Oct master at exact source commit
        shell: bash
        run: |
          set -euo pipefail
          frozen_ref="ab1e1d62cb1b5c3918ad1d7ac2d6d352cd1060e0"
          git fetch --no-tags --depth=1 origin "$frozen_ref"
          git show "$frozen_ref:nasdaq-xray/canonical_current_master_manifest.json" > "$RUNNER_TEMP/xray_oct14_master.json"
          test "$(git hash-object "$RUNNER_TEMP/xray_oct14_master.json")" = "efd55ad9ba7386b5ac6b2a76ee8677fd30b3ed04"
          echo "XRAY_NINE_SEC_MASTER_PROVENANCE=EXACT_IMMUTABLE_OCT14_NO_CURRENT_POINTER"
      - name: Negative source review tests (no current SEC network authority)
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/master_nine_sec_sic_review_guard.py
          python nasdaq-xray/master_nine_sec_sic_review_guard.py --selftest --master-source "$RUNNER_TEMP/xray_oct14_master.json"
          python -O nasdaq-xray/master_nine_sec_sic_review_guard.py --selftest --master-source "$RUNNER_TEMP/xray_oct14_master.json"
      - name: Verify immutable nine UNKNOWN and source date provenance
        run: |
          set -euo pipefail
          python nasdaq-xray/master_nine_sec_sic_review_guard.py --live --master-source "$RUNNER_TEMP/xray_oct14_master.json"
          echo "XRAY_SEC_IDENTITY_MANUAL_REVIEW=NO_PRIMARY_MC_NO_PRICE_PASS_NO_R92_NO_DEVICE_ACK"
