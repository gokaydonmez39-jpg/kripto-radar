name: XRAY Nine SEC SIC Contradiction Review (No Alpha)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/research/master_20261014_nine_sec_sic_review_v1.json"
      - "nasdaq-xray/master_nine_sec_sic_review_guard.py"
      - ".github/workflows/xray-nine-sec-sic-review-regression.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/research/master_20261014_nine_sec_sic_review_v1.json"
      - "nasdaq-xray/master_nine_sec_sic_review_guard.py"
      - ".github/workflows/xray-nine-sec-sic-review-regression.yml"
permissions:
  contents: read
jobs:
  source-date-cik-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Negative source review tests (no current SEC network authority)
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/master_nine_sec_sic_review_guard.py
          python nasdaq-xray/master_nine_sec_sic_review_guard.py --selftest
          python -O nasdaq-xray/master_nine_sec_sic_review_guard.py --selftest
      - name: Verify immutable nine UNKNOWN and source date provenance
        run: |
          set -euo pipefail
          python nasdaq-xray/master_nine_sec_sic_review_guard.py --live
          echo "XRAY_SEC_IDENTITY_MANUAL_REVIEW=NO_PRIMARY_MC_NO_PRICE_PASS_NO_R92_NO_DEVICE_ACK"
