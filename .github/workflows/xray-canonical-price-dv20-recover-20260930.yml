name: XRAY Canonical PRICE DV20 Recovery 20260930
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-canonical-price-dv20-recover-20260930.yml"
      - "nasdaq-xray/price_dv20_recover_from_fullstate.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xray-canonical-price-dv20-recover-20260930
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XRAY_FULLSTATE_INPUT: ${{ github.workspace }}/nasdaq-xray/canonical_full_hard_gate_20260930_state.json
      XRAY_PRICE_DV20_RECOVER_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_price_dv20_20260930_recovered.json
      XRAY_PHASE_WORKERS: "12"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile nasdaq-xray/price_dv20_phase.py nasdaq-xray/price_dv20_recover_from_fullstate.py
      - run: python -m pip install --disable-pip-version-check akshare==1.18.95 pandas_market_calendars
      - name: Recover PRICE DV20
        run: python nasdaq-xray/price_dv20_recover_from_fullstate.py
      - name: Validate
        run: |
          python - <<'PY'
          import json,hashlib
          j=json.load(open("nasdaq-xray/canonical_price_dv20_20260930_recovered.json"))
          assert j["schema"]=="XRAY_CANONICAL_PRICE_DV20_V1"
          assert j["source_master_count"]==3398
          assert sum(j["counts"].values())==3398
          assert j["reused_terminal_count"]+j["reevaluated_count"]==3398
          assert hashlib.sha256("\n".join(j["pass_symbols"]).encode()).hexdigest()==j["pass_hash"]
          print({"reused":j["reused_terminal_count"],"reevaluated":j["reevaluated_count"],"counts":j["counts"],"unknown_count":j["unknown_count"],"pass_count":j["pass_count"],"pass_hash":j["pass_hash"]})
          PY
      - name: Commit recovered artifact
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/canonical_price_dv20_20260930_recovered.json
          git commit -m "chore(xray): recover canonical PRICE DV20 2026-09-30" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
