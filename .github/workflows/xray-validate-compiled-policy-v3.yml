name: XRAY Validate Compiled Policy V3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-validate-compiled-policy-v3.yml"
      - "nasdaq-xray/chatgpt_compiled_policy_v3.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate C4.14 MC fail-evidence-only repair
        run: |
          python - <<'PY'
          import json,hashlib
          top=json.load(open("nasdaq-xray/chatgpt_compiled_policy_v3.json"))
          assert top["schema"]=="XRAY_GITHUB_COMPILED_POLICY_V3"
          assert top["execution"]=="NONE" and top["real_money"]=="NO-GO"
          payload=top["payload_json"]
          h=hashlib.sha256(payload.encode()).hexdigest()
          assert h==top["policy_hash"]
          x=json.loads(payload)
          assert x["schema"]=="XRAY_COMPILED_POLICY_V1"
          assert x["version"]=="C4.14"
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          assert x["unknown_never_pass"] is True and x["zero_dollar_hard_cap"] is True
          e=x["mc_fail_evidence"]
          assert e["no_threshold_change"] is True
          assert e["unknown_never_pass"] is True
          assert "MC_FAIL_FALLBACK_TWO_SOURCE" in e["two_source_subthreshold_fail"]
          assert "$1,800,000,000" in e["two_source_subthreshold_fail"]
          assert "R92-ineligible" in e["fallback_pass_unchanged"]
          pc=x["policy_change"]
          assert pc["id"]=="MC_TWO_SOURCE_SUBTHRESHOLD_FAIL_EVIDENCE_V1"
          assert pc["base_policy_hash"]=="ba5134d39009fca2801d482302150732ba47c5a3f0c474e8764bf412cad49b1a"
          assert pc["base_policy_version"]=="C4.13"
          assert pc["no_alpha_threshold_change"] is True
          assert pc["no_universe_change"] is True
          assert pc["no_price_dv20_change"] is True
          assert pc["no_history_threshold_change"] is True
          assert pc["no_setup_change"] is True
          assert pc["no_g9_change"] is True
          assert pc["no_account_change"] is True
          assert pc["no_execution_change"] is True
          assert pc["fail_evidence_only"] is True
          sp=top["source_proof"]
          assert sp["base_policy_hash"]=="ba5134d39009fca2801d482302150732ba47c5a3f0c474e8764bf412cad49b1a"
          assert sp["base_policy_version"]=="C4.13"
          obs=sp["observed_20261001"]
          for s in ["PARA","SPWR","XRX"]:
              assert obs[s]["rallies_market_cap_usd"]<2_000_000_000
              assert obs[s]["longbridge_market_cap_usd"]<2_000_000_000
          print({"policy_hash":h,"version":x["version"],"status":"PASS"})
          PY
