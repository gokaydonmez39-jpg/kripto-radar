name: XRAY Validate Compiled Policy V3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-validate-compiled-policy-v3.yml"
      - "nasdaq-xray/chatgpt_compiled_policy_v3.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate C4.17 settlement connector failover
        run: |
          python - <<'PYV'
          import json,hashlib
          top=json.load(open("nasdaq-xray/chatgpt_compiled_policy_v3.json"))
          assert top["schema"]=="XRAY_GITHUB_COMPILED_POLICY_V3"
          assert top["execution"]=="NONE" and top["real_money"]=="NO-GO"
          payload=top["payload_json"]; h=hashlib.sha256(payload.encode()).hexdigest()
          assert h==top["policy_hash"]=="68684c130849016dd5148c1afdaa888766dc8070506af892420e493629a92fa4"
          x=json.loads(payload)
          assert x["schema"]=="XRAY_COMPILED_POLICY_V1" and x["version"]=="C4.17"
          assert x["unknown_never_pass"] is True and x["zero_dollar_hard_cap"] is True
          assert x["hard_gates"]["price"]==">=5"
          assert x["hard_gates"]["market_cap"]==">=2000000000 USD"
          assert x["hard_gates"]["dv30"]=="median exactly30 completed official-RTH Close*regular-session Volume >=50000000"
          assert x["price_gate_correction_change"]["id"]=="PRICE_FLOOR_LATEST_USER_SPEC_CORRECTION_V1"
          assert x["price_gate_correction_change"]["corrected_rule"]==">=5"
          assert x["liquidity_gate_correction_change"]["id"]=="DV30_LATEST_USER_SPEC_CORRECTION_V1"
          assert x["liquidity_gate_correction_change"]["corrected_rule"].startswith("DV30 median exactly30")
          assert x["rvol20"]["role"]=="SETUP_CONFIRMATION_ONLY_NOT_ALPHA_LIQUIDITY_GATE"
          assert x["policy_change"]["id"]=="MC_TWO_SOURCE_SUBTHRESHOLD_FAIL_EVIDENCE_V1"
          assert x["settlement_change"]["id"]=="SETTLEMENT_ZERO_DOLLAR_CROSSCHECK_V2"
          m=x["mc_identity_correction_change"]
          assert m["id"]=="MC_SEC_SHARE_COUNT_VERIFIED_WATCH_V1"
          assert m["base_policy_hash"]=="a2bb9e857759e2b1c312fe1ec78ffefb4ac3e81c5c2012c921d245da0bc6a094" and m["base_policy_version"]=="C4.16"
          assert m["classification"]=="MC_PASS_FALLBACK_WATCH" and m["r92_eligible"] is False
          assert m["requirements"]["longbridge_identity"].endswith("<=0.5%.")
          assert "Every available finite USD market-cap observation" in m["requirements"]["threshold_safety"]
          assert m["requirements"]["failure"].endswith("MC_UNKNOWN.")
          mx=m["observed_20261002"]["MXL"]
          assert mx["sec"]["registered_ticker"]=="MXL" and mx["sec"]["registered_exchange"]=="The Nasdaq Stock Market LLC"
          assert mx["sec"]["shares_outstanding"]==mx["longbridge"]["total_shares"]==90693191
          assert mx["minimum_observed_market_cap_usd"]>=2100000000 and mx["r92_eligible"] is False
          f=x["settlement_fallback_change"]
          assert f["id"]=="SETTLEMENT_ZERO_DOLLAR_CONNECTOR_FAILOVER_V1"
          assert f["base_policy_hash"]=="7454b9156b6161f1bd3f44d150f71e03f99b471466ce364aa5a490e29e39a015" and f["base_policy_version"]=="C4.15"
          assert f["fallback"]=="RALLIES_LONGBRIDGE_DUAL_SOURCE_SETTLEMENT_V1"
          assert f["requirements"]["volume"]=="both finite positive; relative difference <=5%"
          assert f["requirements"]["failure"].endswith("settlement UNKNOWN")
          assert f["requirements"]["g9"]=="NON-G9"
          s=x["settlement"]
          assert s["primary"]=="ALPACA_HISTORICAL_SIP_DAILY_AFTER_15M"
          assert s["preferred_primary"]=="ALPACA_HISTORICAL_SIP_DAILY_AFTER_15M"
          assert s["connector_failover"]=="RALLIES_LONGBRIDGE_DUAL_SOURCE_SETTLEMENT_V1"
          assert s["massive_polygon_role"]=="OPTIONAL_DIAGNOSTIC_ONLY_NOT_REQUIRED"
          assert s["zero_dollar_fail_closed"] is True
          sp=top["source_proof"]
          assert sp["base_policy_hash"]=="7454b9156b6161f1bd3f44d150f71e03f99b471466ce364aa5a490e29e39a015"
          assert sp["base_policy_blob_sha"]=="a11947566c170d47e4d806a9e17bd8830d7c83fc"
          assert sp["base_policy_version"]=="C4.15"
          print({"status":"PASS","policy_hash":h,"version":x["version"]})
          PYV
