name: XRAY Connected Alpaca Root 231 Count-only Integrity
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/research/alpaca_connected_root_231_operational_shadow_20261009_v1.json"
      - "nasdaq-xray/research/validate_connected_alpaca_root_231_shadow.py"
      - ".github/workflows/xray-connected-alpaca-root-231-integrity.yml"
      - "nasdaq-xray/sina_state.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-root-231-observability-integrity
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and reconcile live root SHA against research counts
        run: |
          python -m py_compile nasdaq-xray/research/validate_connected_alpaca_root_231_shadow.py
          python nasdaq-xray/research/validate_connected_alpaca_root_231_shadow.py
      - name: Prove canonical history or MC is not promoted by this run
        run: |
          python - <<'PY'
          import json
          p="nasdaq-xray/research/alpaca_connected_root_231_operational_shadow_20261009_v1.json"
          j=json.load(open(p,encoding="utf-8"))
          assert j["canonical_history_pass_created"]==0
          assert j["c417_primary_pass_created"]==0
          assert j["r92_created"]==0
          assert j["market_data_in_public_artifact"] is False
          print("XRAY_CONNECTED_ALPACA_METADATA_ONLY_NO_CANONICAL_PROMOTION=PASS")
          PY
