name: XRAY P0 SEC Alphabet Original XBRL Class Identity No GO
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_sec_alphabet_xbrl_multiclass_canary.py"
      - ".github/workflows/xray-p0-sec-alphabet-original-multiclass.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-sec-r1-multiclass:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source SHA and optimizer-safe negative regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python nasdaq-xray/p0_sec_alphabet_xbrl_multiclass_canary.py --selftest
          python -O nasdaq-xray/p0_sec_alphabet_xbrl_multiclass_canary.py --selftest
      - name: Independent real SEC original R1 and acceptance-date crosscheck
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT || vars.XRAY_SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          python nasdaq-xray/p0_sec_alphabet_xbrl_multiclass_canary.py \
             --out "$RUNNER_TEMP/sec_goog_multiclass.json"
      - name: Verify all safety and class claims, no MC or HISTORY PASS
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"sec_goog_multiclass.json").read_text())
          assert j["schema"]=="XRAY_SEC_MULTICLASS_GOOG_GOOGLE_ORIGINAL_XBRL_R1_V1"
          assert j["asof_et"]=="2026-10-09"
          assert j["verified_common_ticker_classes"]=={"GOOGL":"CLASS_A_COMMON","GOOG":"CLASS_C_CAPITAL"}
          assert j["unlisted_common_class_B_seen"] is True
          assert j["preferred_depositary_symbols"]==["GOOGM","GOOGN"]
          assert j["official_original_SEC_10Q_accepted_before_20261009_close"] is True
          assert j["SEC_R1_table_not_complete_machine_XBRL_context_axis_witness"] is True
          assert j["issuer_total_class_share_composition_unproven_at_asof"] is True
          assert j["C417_PRIMARY_MC_created"]==j["canonical_HISTORY_PASS_created"]==0
          assert j["R92_created"] is False and j["GO"] is False
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          print("XRAY_SEC_GOOG_GOOGL_CLASS=REAL_OFFICIAL_R1_BOUND_NO_PRIMARY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xray-alphabet-sec-original-R1-listedclass-no-primary
          path: ${{ runner.temp }}/sec_goog_multiclass.json
          retention-days: 14
          if-no-files-found: error
