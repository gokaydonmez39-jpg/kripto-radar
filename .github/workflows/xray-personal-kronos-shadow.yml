name: XRAY Personal Kronos Shadow Research
# Research-only post-EOD sidecar; no cron, no broker, no alerts or main EOD changes.
# XRAY_20261107_KRONOS_WEEKEND_ASOF_QA: one-time protected-main research-only recheck of last verified completed XNAS session.
# Runs only after a successful protected main personal 477 EOD workflow.
on:
  # A change to this exact workflow on protected main performs one controlled
  # current-ASOF read-only research recheck, without replaying any core EOD.
  push:
    branches: [main]
    paths:
      - '.github/workflows/xray-personal-kronos-shadow.yml'
  pull_request:
    branches: [main]
    paths:
      - 'personal-swing/kronos_shadow.py'
      - 'personal-swing/test_kronos_shadow.py'
      - 'personal-swing/kronos_oos_audit.py'
      - 'personal-swing/test_kronos_oos_audit.py'
      - 'personal-swing/KRONOS_INTEGRATION.md'
      - '.github/workflows/xray-personal-kronos-shadow.yml'
  workflow_run:
    workflows: [XRAY Personal 477 EOD Daily Health (Research Only)]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: xray-personal-kronos-shadow-${{ github.event_name }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  offline-contract-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Guard deterministic shadow contract
        working-directory: personal-swing
        run: |
          set -euo pipefail
          python -m unittest -q test_kronos_shadow
          python -O -m unittest -q test_kronos_shadow
          python -m unittest -q test_kronos_oos_audit
          python -O -m unittest -q test_kronos_oos_audit
          python -m py_compile kronos_shadow.py test_kronos_shadow.py kronos_oos_audit.py test_kronos_oos_audit.py
  actual-model-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Kronos CPU model dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' >/dev/null
          python -m pip install 'numpy==1.26.4' 'pandas==2.2.2' 'einops==0.8.1' 'huggingface_hub==0.33.1' 'safetensors==0.6.2' 'tqdm==4.67.1' >/dev/null
      - name: Fetch exact audited upstream code for smoke only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kronos-upstream"
          cd "$RUNNER_TEMP/kronos-upstream"
          git init -q
          git remote add origin https://github.com/shiyu-coder/Kronos.git
          git fetch -q --depth=1 origin 67b630e67f6a18c9e9be918d9b4337c960db1e9a
          [[ "$(git rev-parse FETCH_HEAD)" == "67b630e67f6a18c9e9be918d9b4337c960db1e9a" ]] || exit 3
          git checkout -q --detach FETCH_HEAD
      - name: Load pinned real small model and forecast synthetic OHLCV
        shell: bash
        working-directory: personal-swing
        env:
          PYTHONPATH: ${{ runner.temp }}/kronos-upstream
          HF_HOME: ${{ runner.temp }}/kronos-hf
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python - <<'PY'
          import math
          import pandas as pd
          import kronos_shadow as k
          dates = pd.bdate_range('2026-07-01', periods=52)
          bars = []
          for i, day in enumerate(dates):
              op = 100 + i * 0.2 + math.sin(i / 4)
              close = op + math.sin(i / 3) * 0.7
              bars.append({'timestamp':day.date().isoformat(), 'open':op,
                           'high':max(op, close)+1.1, 'low':min(op,close)-1.1,
                           'close':close, 'volume':1_000_000 + i*7000})
          future = [x.date().isoformat() for x in pd.bdate_range(dates[-1] + pd.offsets.BDay(1),periods=12)]
          predictor = k.load_predictor()
          predicted = k.predict_one(predictor,bars,future)
          k.require(len(predicted) == 12, 'KRONOS_SMOKE_NOT_12')
          print('KRONOS_REAL_CHECKPOINT_SYNTHETIC_SMOKE=PASS_12_VALID_CANDLES')
          PY
  independent-private-inference:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
      XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
      XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
      XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Guard required read-only market and private-Sheet credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$XRAY_ALPACA_DATA_KEY_ID" || -z "$XRAY_ALPACA_DATA_SECRET_KEY" || -z "$XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON" || -z "$XRAY_PRIVATE_SPREADSHEET_ID" ]]; then
            echo 'KRONOS_SHADOW=HOLD_MISSING_RESEARCH_CREDENTIALS'
            exit 3
          fi
      - name: Install pinned CPU-only inference and private metadata dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu' >/dev/null
          python -m pip install \
            'numpy==1.26.4' 'pandas==2.2.2' 'einops==0.8.1' \
            'huggingface_hub==0.33.1' 'safetensors==0.6.2' 'tqdm==4.67.1' \
            'google-auth>=2.35,<3' 'requests>=2.31,<3' >/dev/null
          python -m pip install -r personal-swing/requirements.txt >/dev/null
      - name: Fetch and pin audited Kronos upstream code (no floating master)
        shell: bash
        env:
          KRONOS_PIN: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kronos-upstream"
          cd "$RUNNER_TEMP/kronos-upstream"
          git init -q
          git remote add origin https://github.com/shiyu-coder/Kronos.git
          git fetch -q --depth=1 origin "$KRONOS_PIN"
          [[ "$(git rev-parse FETCH_HEAD)" == "$KRONOS_PIN" ]] || { echo 'KRONOS_UPSTREAM_SHA_HOLD'; exit 3; }
          git checkout -q --detach FETCH_HEAD
          [[ -f model/kronos.py && -f model/module.py ]] || { echo 'KRONOS_CODE_INCOMPLETE'; exit 3; }
      - name: Independent private Kronos small EOD forecast and exact Sheet readback
        working-directory: personal-swing
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/kronos-upstream
          HF_HOME: ${{ runner.temp }}/kronos-hf
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python kronos_shadow.py
      - name: Independent matured-horizon OOS audit (read-only; NEVER alpha PASS)
        if: always()
        working-directory: personal-swing
        shell: bash
        run: |
          set -euo pipefail
          python kronos_oos_audit.py
      - name: Explicit no-order/no-alert boundary
        if: always()
        run: |
          echo 'KRONOS_SCOPE=ACTIVE_OPEN_ONLY; NOT_477_AI_COVERAGE; EXECUTION=NONE; NO_ORDER; NO_AL; NO_PUSH; NO_DEVICE_ACK' >> "$GITHUB_STEP_SUMMARY"
