name: XRAY Candidate Local 260 SIP Source Recovery (Shadow Only)
on:
  schedule:
    - cron: "10 23 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-alpaca-historical-sip-account-v1
  cancel-in-progress: false
jobs:
  session-gate:
    name: Fail closed before scheduled SIP vendor IO on Nasdaq holidays
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      allow: ${{ steps.session.outputs.allow_compute }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official Nasdaq session calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Enforce ET exchange session on schedule; manual research explicit
        id: session
        run: python nasdaq-xray/root_weekend_quota_guard.py --emit

  source-recovery:
    needs: [session-gate]
    if: ${{ needs.session-gate.outputs.allow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official Nasdaq session calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Verify exact-source EOD publisher CAS regressions before market-data calls
        run: |
          python -m py_compile nasdaq-xray/personal_eod_github_cas_publisher.py
          python nasdaq-xray/personal_eod_github_cas_publisher.py --selftest
          python -O nasdaq-xray/personal_eod_github_cas_publisher.py --selftest
      - name: Quarantine mixed latest root MASTER PRICE epochs before any SIP request
        id: source_epoch_preflight
        run: |
          python -m py_compile nasdaq-xray/personal_eod_source_epoch_preflight.py
          python nasdaq-xray/personal_eod_source_epoch_preflight.py --selftest
          python -O nasdaq-xray/personal_eod_source_epoch_preflight.py --selftest
          python nasdaq-xray/personal_eod_source_epoch_preflight.py
      - name: Verify source epoch and adversarial candidate-local guards
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/alpaca_candidate_local_260_recovery_shadow.py
          python nasdaq-xray/alpaca_candidate_local_260_recovery_shadow.py --selftest
          python -O nasdaq-xray/alpaca_candidate_local_260_recovery_shadow.py --selftest
          python nasdaq-xray/alpaca_full_scope_260_shadow.py --selftest
          python nasdaq-xray/alpaca_sip_paginated_transport_shadow.py
          python -m py_compile nasdaq-xray/official_first_trade_260_history_guard.py nasdaq-xray/sina_stage.py nasdaq-xray/candidate_local_full_technical_funnel_v1.py
          python nasdaq-xray/official_first_trade_260_history_guard.py --selftest
          python -O nasdaq-xray/official_first_trade_260_history_guard.py --selftest
          python nasdaq-xray/official_first_trade_260_history_guard.py --asof 2026-10-13
          python nasdaq-xray/candidate_local_full_technical_funnel_v1.py --selftest
          python -O nasdaq-xray/candidate_local_full_technical_funnel_v1.py --selftest
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path("nasdaq-xray/sina_stage.py").read_text()
          tree=ast.parse(s)
          funcs=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="parse_hist"]
          assert len(funcs)==1
          body=ast.get_source_segment(s,funcs[0])
          for token in ("official_first_trade_260_history_guard",
                        "own_listed_history_short",
                        "day>=first_trade[\"first_traded_nasdaq_date\"]"):
              assert token in body,token
          print("XRAY_SINA_BSP_FIRST_TRADE_PIT_VETO_BINDING=PASS_NO_FAKE_260")
          PY
      - name: Probe ALL unresolved tracked names using real delayed historical SIP
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          python nasdaq-xray/alpaca_candidate_local_260_recovery_shadow.py --out "$RUNNER_TEMP/xray_candidate_sip_source_availability.json"
      - name: Check no source authority or vendor data was exported
        if: always() && steps.source_epoch_preflight.outcome == 'success'
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_candidate_sip_source_availability.json"
          if not p.is_file():
              print("XRAY_CANDIDATE_SIP_NO_RESULT_FAIL_CLOSED")
              raise SystemExit(1)
          d=json.loads(p.read_text())
          assert d["schema"]=="XRAY_CANDIDATE_LOCAL_REAL_SIP_260_52_RECOVERY_SHADOW_V1"
          assert d["scope_count"]==len(d["scope_symbols"])
          assert d["measured_scope_count"]==len(d["observations"])
          assert sum(d["classification_counts"].values())==d["measured_scope_count"]
          observed=d["research_history_source_observed_symbols"]
          blocked=d["research_history_source_blocked_symbols"]
          if d["measured_scope_count"]==d["scope_count"]:
              assert sorted(set(observed+blocked))==sorted(d["scope_symbols"])
              assert not set(observed)&set(blocked)
              assert d["research_history_source_observed_count"]==len(observed)
              assert d["research_history_source_blocked_count"]==len(blocked)
              digest=lambda values:hashlib.sha256(("\n".join(values)+"\n").encode()).hexdigest()
              assert observed==sorted(observed) and blocked==sorted(blocked)
              assert d["research_history_source_observed_sha256"]==digest(observed)
              assert d["research_history_source_blocked_sha256"]==digest(blocked)
              for sym in observed:
                  row=d["observations"][sym]
                  assert row["source_availability"]=="SHADOW_260_DAILY_52_WEEK_OBSERVED"
                  assert row["observed_official_session_count"]==260
                  assert row["canonical_primary"] is False
              if blocked and not any(k.startswith("UNKNOWN_") for k in d["classification_counts"]):
                  assert d["status"]=="SHADOW_PARTIAL_HISTORY_SOURCE_NO_AUTHORITY"
          else:
              assert d["research_history_source_observed_count"]==0
          assert d["research_source_only_not_technical_pass"] is True
          assert d["research_source_only_not_canonical_history_pass"] is True
          assert d["source_market_data_rights_independently_attested"] is False
          assert d["canonical_history_promoted"] is False
          assert d["canonical_price_promoted"] is False
          assert d["registered_r92_count"]==0 and not d["final_buy_signals"]
          assert d["vendor_raw_bars_persisted"] is False
          assert d["vendor_ohlcv_in_artifact"] is False
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          print("XRAY_CANDIDATE_SIP_SHADOW_RESULT="+d["status"])
          print("XRAY_CANDIDATE_SIP_COUNT_ONLY="+json.dumps(d["classification_counts"],sort_keys=True))
          print("XRAY_CANDIDATE_SIP_RESEARCH_SOURCE_OBSERVED_COUNT="+str(d["research_history_source_observed_count"]))
          print("XRAY_CANDIDATE_SIP_RESEARCH_SOURCE_BLOCKED_COUNT="+str(d["research_history_source_blocked_count"]))
          print("XRAY_CANDIDATE_SIP_NO_TECHNICAL_PRIMARY_OR_R92=PASS")
          PY
      - name: Personal research technical recheck through existing scheduled SIP run
        if: success()
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt
          python nasdaq-xray/alpaca_personal_seven_technical_shadow.py --selftest
          python -O nasdaq-xray/alpaca_personal_seven_technical_shadow.py --selftest
          python nasdaq-xray/alpaca_personal_seven_technical_shadow.py --out "$RUNNER_TEMP/personal_seven_sip_technical_labels.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"personal_seven_sip_technical_labels.json"
          d=json.loads(p.read_text())
          assert d["schema"]=="XRAY_PERSONAL_SEVEN_SIP_TECHNICAL_SHADOW_V1"
          assert d["scope_count"]==len(d["statuses"]) and d["scope_count"]>=0
          assert d["pending_symbol_truncation"] is False
          assert d["api_batch_count"]>=0
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          assert d["no_raw_market_data_exported"] is True
          assert d["canonical_price_promoted"] is False
          assert d["canonical_history_promoted"] is False
          assert d["primary_mc_promoted"] is False
          assert d["true_r92_count"]==0 and not d["final_buy_signals"]
          print("XRAY_SCHEDULED_PERSONAL_TECH_GUARD=PASS_NO_PRIMARY_NO_R92")
          PY
      - name: Validate complete personally research-bound watch cohort
        if: success()
        run: |
          python -m py_compile nasdaq-xray/personal_research_daily_attestation.py
          python nasdaq-xray/personal_research_daily_attestation.py --selftest
          python -O nasdaq-xray/personal_research_daily_attestation.py --selftest
          python nasdaq-xray/personal_research_daily_attestation.py --study "$RUNNER_TEMP/personal_seven_sip_technical_labels.json"
      - name: Archive private personal research classification labels without vendor bars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-scheduled-personal-technical-labels-no-ohlcv
          path: ${{ runner.temp }}/personal_seven_sip_technical_labels.json
          if-no-files-found: warn
          retention-days: 14
      - name: Archive ONLY symbols and source availability classifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-candidate-260-sip-availability-no-vendor-bars
          path: ${{ runner.temp }}/xray_candidate_sip_source_availability.json
          if-no-files-found: warn
          retention-days: 14

  personal-price-current-exact30:
    needs: [session-gate, source-recovery]
    if: ${{ needs.session-gate.outputs.allow == 'true' && needs.source-recovery.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate dynamic Nasdaq completed session, full PRICE unknown set and no fake primary
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
          python -m py_compile nasdaq-xray/alpaca_personal_price_current_exact30.py
          python nasdaq-xray/alpaca_personal_price_current_exact30.py --selftest
          python -O nasdaq-xray/alpaca_personal_price_current_exact30.py --selftest
      - name: Refuse stale mixed-epoch personal PRICE provider requests
        id: price_epoch_preflight
        run: |
          python nasdaq-xray/personal_eod_source_epoch_preflight.py --selftest
          python nasdaq-xray/personal_eod_source_epoch_preflight.py
      - name: Scan every CURRENT same-session canonical PRICE unresolved symbol with personal historical SIP
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          python nasdaq-xray/alpaca_personal_price_current_exact30.py \
            --out "$RUNNER_TEMP/xray_personal_current_price_exact30_no_bars.json"
      - name: Require exact full scope or fail-closed partial; never canonicalize lower bound
        if: always() && steps.price_epoch_preflight.outcome == 'success'
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          output=Path(os.environ["RUNNER_TEMP"])/"xray_personal_current_price_exact30_no_bars.json"
          if not output.exists():raise SystemExit("XRAY_PERSONAL_CURRENT_PRICE_UNAVAILABLE_FAIL_CLOSED")
          report=json.loads(output.read_text())
          assert report["schema"]=="XRAY_PERSONAL_CURRENT_EXACT30_SIP_PRICE_RECHECK_V1"
          assert report["source_master_git_blob_sha"]==subprocess.check_output(
              ["git","hash-object","nasdaq-xray/canonical_current_master_manifest.json"],
              text=True).strip()
          assert report["source_price_git_blob_sha"]==subprocess.check_output(
              ["git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],
              text=True).strip()
          assert report["scope_total"]==len(report["classifications"])
          assert report["scope_total"]==report["source_price_unknown_total"]
          assert report["scope_truncated"] is False
          assert sum(report["counts"].values())==report["scope_total"]
          assert len(report["exact30_dates"])==30
          assert report["exact30_dates"][-1]==report["asof_et"]
          assert report["personal_research_only"] is True
          assert report["price_primary_pass_count"]==0
          assert report["registered_R92_created"] is False
          assert report["canonical_price_promoted"] is False
          assert report["canonical_mc_promoted"] is False
          assert report["vendor_raw_OHLCV_written"] is False
          assert report["execution"]=="NONE" and report["real_money"]=="NO-GO"
          print("XRAY_PERSONAL_DAILY_PRICE_SCOPE="+str(
             report["classified_count"])+"/"+str(report["scope_total"]))
          print("XRAY_PERSONAL_DAILY_PRICE_SHADOW_COUNTS="+json.dumps(
              report["counts"],sort_keys=True))
          print("XRAY_PERSONAL_DAILY_PRICE_NO_CANONICAL_R92=PASS")
          PY
      - name: Archive bounded personal exact30 research classifications, never vendor OHLCV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-personal-daily-current-price-exact30-no-ohlcv
          path: ${{ runner.temp }}/xray_personal_current_price_exact30_no_bars.json
          if-no-files-found: warn
          retention-days: 14

  personal-eod-verified-snapshot:
    name: Publish only complete personal NASDAQ swing research status
    needs: [source-recovery, personal-price-current-exact30]
    if: ${{ needs.source-recovery.result == 'success' && needs.personal-price-current-exact30.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: xray-personal-eod-status-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare exact source-bound personal research
        run: |
          python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
          python -m py_compile nasdaq-xray/personal_swing_radar_daily_snapshot.py
          python nasdaq-xray/personal_swing_radar_daily_snapshot.py --selftest
          python -O nasdaq-xray/personal_swing_radar_daily_snapshot.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: xray-scheduled-personal-technical-labels-no-ohlcv
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: xray-candidate-260-sip-availability-no-vendor-bars
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: xray-personal-daily-current-price-exact30-no-ohlcv
          path: ${{ runner.temp }}
      - name: Combine exact Git blobs, all 474 technical and all 545 PRICE researches
        run: |
          python nasdaq-xray/personal_swing_radar_daily_snapshot.py \
            --technical "$RUNNER_TEMP/personal_seven_sip_technical_labels.json" \
            --availability "$RUNNER_TEMP/xray_candidate_sip_source_availability.json" \
            --price "$RUNNER_TEMP/xray_personal_current_price_exact30_no_bars.json" \
            --out "$RUNNER_TEMP/personal_swing_radar_snapshot_no_vendor.json"
      - name: Persist verified personal status on main, never touch canonical or vendor bars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python nasdaq-xray/personal_eod_github_cas_publisher.py \
            --snapshot "$RUNNER_TEMP/personal_swing_radar_snapshot_no_vendor.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xray-personal-eod-snapshot-aggregate-no-vendor
          path: ${{ runner.temp }}/personal_swing_radar_snapshot_no_vendor.json
          if-no-files-found: warn
          retention-days: 14
