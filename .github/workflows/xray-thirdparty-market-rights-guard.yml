name: XRAY Third Party Source Market Rights Guard (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/provider_automation_governance.json'
      - 'nasdaq-xray/tests/test_thirdparty_market_rights_gate.py'
      - 'nasdaq-xray/provider_automation_governance_selftest.py'
      - '.github/workflows/xray-thirdparty-market-rights-guard.yml'
  push:
    branches: [main]
    paths:
      - 'nasdaq-xray/provider_automation_governance.json'
      - 'nasdaq-xray/tests/test_thirdparty_market_rights_gate.py'
      - 'nasdaq-xray/provider_automation_governance_selftest.py'
      - '.github/workflows/xray-thirdparty-market-rights-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-thirdparty-rights-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-license-nonpromotion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Real governance and adversarial rights promotions under normal and optimized Python
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/tests/test_thirdparty_market_rights_gate.py nasdaq-xray/provider_automation_governance_selftest.py
          python -m unittest discover -s nasdaq-xray/tests -p test_thirdparty_market_rights_gate.py -v
          python -O -m unittest discover -s nasdaq-xray/tests -p test_thirdparty_market_rights_gate.py -v
          python nasdaq-xray/provider_automation_governance_selftest.py
          python -O nasdaq-xray/provider_automation_governance_selftest.py
      - name: No vendor key, market feed, broker, production release or notifications
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          t=ast.parse(Path("nasdaq-xray/tests/test_thirdparty_market_rights_gate.py").read_text())
          mods=set()
          for node in ast.walk(t):
              if isinstance(node,ast.Import): mods.update(n.name.split('.')[0] for n in node.names)
              elif isinstance(node,ast.ImportFrom) and node.module: mods.add(node.module.split('.')[0])
          assert not mods&{"requests","httpx","urllib","socket","subprocess","ccxt","alpaca"},mods
          print("XRAY_THIRDPARTY_UNLICENSED_SOURCES=BLOCKED_NO_DATA_NO_AL")
          PY
