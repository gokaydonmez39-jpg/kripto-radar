name: XRAY P0 497 HISTORY Four-Witness Proof (No GO)
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_history_four_witness_guard.py"
      - ".github/workflows/xray-p0-history-four-witness-guard.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-497-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact invoking commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official NASDAQ calendar
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Retrieve exact four full-scope SANITIZED provider witnesses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/four-witness"
          while read -r slot id artifact file; do
            mkdir -p "$RUNNER_TEMP/four-witness/$slot"
            gh run download "$id" -R "${{ github.repository }}" -n "$artifact" \
              -D "$RUNNER_TEMP/four-witness/$slot"
            test -s "$RUNNER_TEMP/four-witness/$slot/$file"
          done <<'SOURCES'
          full 38178518447 xray-515-exact260-sip-status-no-vendor-bars xray_alpaca_full_515_shadow.json
          dual 38178676524 xray-alpaca-515-raw-split-daily-shadow-sanitized xray_515_raw_split_research.json
          ca 38178327791 xray-515-corporate-actions-count-only-no-pit xray_515_ca_census_shadow.json
          bridge 38178886981 xray-p0-eleven-split-ca-correlation-no-primary xray_11_event_correlations.json
          SOURCES
      - name: Prove original source set equality and 7 adversarial falsifications
        run: |
          python -m py_compile nasdaq-xray/p0_history_four_witness_guard.py
          for mode in normal optimized; do
            opt=()
            if [ "$mode" = optimized ]; then opt=(-O); fi
            python "${opt[@]}" nasdaq-xray/p0_history_four_witness_guard.py \
              --full "$RUNNER_TEMP/four-witness/full/xray_alpaca_full_515_shadow.json" \
              --dual "$RUNNER_TEMP/four-witness/dual/xray_515_raw_split_research.json" \
              --ca "$RUNNER_TEMP/four-witness/ca/xray_515_ca_census_shadow.json" \
              --bridge "$RUNNER_TEMP/four-witness/bridge/xray_11_event_correlations.json" \
              --selftest
          done
      - name: Write source-bound, no licensed prices, no canonical promotion artifact
        run: |
          python nasdaq-xray/p0_history_four_witness_guard.py \
            --full "$RUNNER_TEMP/four-witness/full/xray_alpaca_full_515_shadow.json" \
            --dual "$RUNNER_TEMP/four-witness/dual/xray_515_raw_split_research.json" \
            --ca "$RUNNER_TEMP/four-witness/ca/xray_515_ca_census_shadow.json" \
            --bridge "$RUNNER_TEMP/four-witness/bridge/xray_11_event_correlations.json" \
            --out "$RUNNER_TEMP/xray_497_history_four_witness.json"
      - name: Final artifact guard no GO no monetary execution
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_497_history_four_witness.json").read_text())
          assert j["schema"]=="XRAY_P0_HISTORY_497_4_SOURCE_SYNCHRONIZED_SHADOW_V1"
          assert (j["scope_with_qqq"],j["full_260_52_stock_count"],
                  j["full_260_stocks_numeric_split_restated"],
                  j["full_260_stocks_no_split_restatement_seen"],
                  j["official_IPO_too_young_count"])==(515,497,11,486,17)
          assert j["source_price_blob_sha"]==subprocess.check_output(
               ["git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],text=True).strip()
          assert j["source_master_blob_sha"]==subprocess.check_output(
               ["git","hash-object","nasdaq-xray/canonical_current_master_manifest.json"],text=True).strip()
          assert j["historical_issuer_security_class_and_CA_independent_PIT"] is False
          assert j["production_canonical_history_pass_created"]==0
          assert j["production_C417_primary_mc_pass_created"]==0
          assert j["can_register_R92"] is False and j["GO"] is False
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          print("XRAY_P0_HISTORY_497_NUMERIC_CA_SPLIT_PROOF=PASS_SHADOW_ONLY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-history-497-four-witness-bound-shadow
          path: ${{ runner.temp }}/xray_497_history_four_witness.json
          retention-days: 14
          if-no-files-found: error
