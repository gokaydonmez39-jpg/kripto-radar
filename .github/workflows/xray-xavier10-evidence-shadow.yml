name: XRAY X-listed Ten Repo Numeric Evidence Shadow (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/research_numeric_provenance_shadow.py'
      - 'nasdaq-xray/tests/test_research_numeric_provenance_shadow.py'
      - 'nasdaq-xray/research/xavier10_repo_admission_20261018_v1.json'
      - '.github/workflows/xray-xavier10-evidence-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-xavier10-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and run source-bound numeric figure tests twice
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/research_numeric_provenance_shadow.py nasdaq-xray/tests/test_research_numeric_provenance_shadow.py
          python -m unittest discover -s nasdaq-xray/tests -p 'test_research_numeric_provenance_shadow.py' -v
          python -O -m unittest discover -s nasdaq-xray/tests -p 'test_research_numeric_provenance_shadow.py' -v
      - name: Verify all ten vendor identities and block production promotion
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('nasdaq-xray/research/xavier10_repo_admission_20261018_v1.json')
          d=json.loads(p.read_text())
          assert d["schema"]=="XRAY_XAVIERCODERX_TEN_REPO_ADMISSION_V1"
          assert d["effective_policy"]=="C4.17"
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          assert d["unknown_never_pass"] is True
          for f in ("primary_market_data_source_added","production_package_imported",
                    "api_credentials_fetched","market_data_fetched",
                    "market_data_entitlement_proven","can_create_PRIMARY",
                    "can_create_HISTORY_PASS","can_register_R92","can_notify_user"):
              assert d[f] is False,f
          rows=d["projects"]
          assert len(rows)==10
          assert len({r["id"] for r in rows})==10
          assert all(re.fullmatch(r"[0-9a-f]{40}",r["commit_sha"]) for r in rows)
          assert all(r["production_import"] is False
                     and r["independently_tested_upstream_package"] is False
                     for r in rows)
          byid={r["id"]:r for r in rows}
          assert byid["MISLABELED_CLAWROUTER_CONTEXT_MODE"]["repo"]=="mksglu/context-mode"
          assert byid["MISLABELED_CLAWROUTER_CONTEXT_MODE"]["license"]=="Elastic-2.0"
          assert byid["FINCEPT_TERMINAL"]["license"]=="AGPL-3.0-or-later"
          assert byid["VIBE_TRADING"]["decision"]=="INDEPENDENT_RESEARCH_SHADOW"
          print("XRAY_XAVIER10_TEN_REPO_ADMISSION=PASS_RESEARCH_ONLY_NO_AL")
          PY
      - name: Summary no production authority
        run: |
          echo '## Source-identified research-only evidence guard (no AL)' >> "$GITHUB_STEP_SUMMARY"
          echo 'All market numbers are synthetic; no external package installed; no vendor data, license entitlement or real-world provenance asserted.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production C4.17, 260/DV30, MC, R92, notifications and broker workflows are unchanged.' >> "$GITHUB_STEP_SUMMARY"
