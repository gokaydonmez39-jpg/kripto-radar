name: XRAY Alpaca Connected SIP Research Witness Guard (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/research/alpaca_connected_sip_aapl_20261018_284daily_390rth_research_v1.json'
      - '.github/workflows/xray-alpaca-connected-sip-research-witness.yml'
  push:
    branches: [main]
    paths:
      - 'nasdaq-xray/research/alpaca_connected_sip_aapl_20261018_284daily_390rth_research_v1.json'
      - '.github/workflows/xray-alpaca-connected-sip-research-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-alpaca-sip-interactive-witness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-research-evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate only connected-surface metadata arithmetic and reject false PASS
        run: |
          python - <<'PY'
          from pathlib import Path
          import copy,json
          p=Path('nasdaq-xray/research/alpaca_connected_sip_aapl_20261018_284daily_390rth_research_v1.json')
          d=json.loads(p.read_text())
          def validate(x):
              assert x['schema']=='XRAY_CONNECTED_ALPACA_SIP_AAPL_RESEARCH_WITNESS_V1'
              assert x['source']=='CONNECTED_CHATGPT_ALPACA_READ_ONLY_MARKET_DATA'
              assert x['source_account_entitlement']=='CONNECTED_INTERACTIVE_ONLY_GITHUB_UNATTESTED'
              assert x['query_scope']=='AAPL_ONE_SYMBOL_NO_BROKER_NO_ORDERS'
              assert x['asof_et']=='2026-10-16'
              assert x['execution']=='NONE' and x['real_money']=='NO-GO'
              assert x['unknown_never_pass'] is True
              for key in ('raw_ohlcv_saved','credential_material_saved',
                          'independent_raw_vendor_bytes_SHA_attested',
                          'unattended_automated_use_license_attested',
                          'corporate_actions_adjustment_proven',
                          'secondary_consolidated_feed_independent',
                          'market_cap_asof_proven',
                          'whole_universe_497_recovered','g9_source_attested',
                          'can_create_canonical_price_pass',
                          'can_create_canonical_history_pass',
                          'can_create_primary_mc','can_register_r92',
                          'can_notify_user','vendor_raw_request_data_disclosed_to_repo'):
                  assert x[key] is False,key
              assert x['new_alpha_signals']==0 and x['alerts_sent']==0
              rows=x['observations']
              assert len(rows)==6
              assert set(row['symbol'] for row in rows.values())=={'AAPL'}
              delay=rows['delayed_sip_30m_single_day']
              assert delay['provider_result']=='api_error' and delay['error_root_cause']=='UNKNOWN' and delay['bars_attested']==0
              ix=rows['iex_30m_single_day']
              assert ix['feed']=='iex' and ix['bars_reported']==13 and ix['independent_sip_coverage_proven'] is False
              s=rows['sip_30m_single_day']
              assert s['feed']=='sip' and s['bars_reported']==14
              assert s['expected_regular_rth_bars']==13 and s['close_bar_trade_conditions_proven'] is False
              day=rows['sip_daily_284_sessions']
              assert day['feed']=='sip' and day['bars_reported']==day['calendar_sessions']==day['unique_sessions']==284
              assert day['missing_sessions']==day['non_calendar_bars']==day['invalid_ohlcv_rows']==0
              assert day['last_260_sessions_present'] is True
              h=rows['sip_half_hour_30_sessions']
              assert h['chunk_counts']==[384,352,224]
              assert max(h['chunk_counts'])<h['limit_per_chunk']==1000
              assert h['total_vendor_bars_observed']==sum(h['chunk_counts'])==960
              assert h['official_sessions']==30 and h['expected_rth_bars']==30*13
              assert h['verified_rth_bars']==390 and h['missing_rth_bars']==0
              assert h['outside_rth_or_other']==960-390==570
              assert h['duplicate_rth_stamps']==h['invalid_rth_ohlcv']==0
              assert h['qualified_for_c417_primary'] is False
              extra=x['additional_unknown_symbol_sip_30_session_canaries']
              assert extra['observed_date']=='2026-10-18'
              assert extra['source_account_entitlement']=='CONNECTED_INTERACTIVE_ONLY_GITHUB_UNATTESTED'
              assert extra['automated_non_display_permission_proven'] is False
              assert extra['primary_price_authority'] is False
              assert extra['can_notify_user'] is False
              samples=extra['symbols']
              assert set(samples)=={'AAL','AAON','ABVX'}
              expected={
                'AAL':([384,350,224],958,568,30),
                'AAON':([236,198,128],562,172,24),
                'ABVX':([294,274,156],724,334,29)
              }
              for sym,(chunks,raw,excluded,days50) in expected.items():
                  k=samples[sym]
                  assert k['feed']=='sip'
                  assert k['from']=='2026-09-04' and k['to']=='2026-10-16'
                  assert k['official_sessions']==30
                  assert k['chunk_counts']==chunks and sum(chunks)==raw
                  assert k['raw_bars_observed']==raw
                  assert k['rth_bars_observed']==390
                  assert k['expected_rth_bars']==390
                  assert k['other_bars_excluded']==excluded
                  assert raw==excluded+390
                  assert k['missing_official_sessions']==0
                  assert k['invalid_rth_volume']==0
                  assert k['days_research_rth_dv_lower_bound_ge50m']==days50
                  assert k['canonical_dv30_pass'] is False
                  assert max(chunks)<1000

              minute=rows['sip_minute_one_session']
              assert minute['feed']=='sip' and minute['observed_rth_minutes']==minute['expected_rth_minutes']==390
              assert minute['missing_rth_minutes']==minute['duplicate_rth_stamps']==minute['invalid_rth_ohlcv']==0
              assert minute['auction_16et_not_included'] is True
              assert minute['qualified_for_primary_r92'] is False
          validate(d)
          mutations=[
            ('license', lambda x: x.__setitem__('unattended_automated_use_license_attested',True)),
            ('r92', lambda x: x.__setitem__('can_register_r92',True)),
            ('price', lambda x: x.__setitem__('can_create_canonical_price_pass',True)),
            ('global', lambda x: x.__setitem__('whole_universe_497_recovered',True)),
            ('missing', lambda x: x['observations']['sip_half_hour_30_sessions'].__setitem__('missing_rth_bars',1)),
            ('noninteger', lambda x: x['observations']['sip_minute_one_session'].__setitem__('invalid_rth_ohlcv',1)),
          ]
          for label, mutate in mutations:
              x=copy.deepcopy(d);mutate(x)
              try: validate(x)
              except AssertionError: continue
              raise RuntimeError('XRAY_ALPACA_SIP_FALSE_PROMOTION_'+label)
          x=copy.deepcopy(d);x['additional_unknown_symbol_sip_30_session_canaries']['symbols']['AAON']['rth_bars_observed']=389
          try: validate(x)
          except AssertionError: pass
          else: raise RuntimeError('XRAY_ALPACA_SIP_FALSE_COHORT_390')
          print('XRAY_ALPACA_CONNECTED_SIP_RESEARCH=PASS_284_DAILY_30X13_RTH_390_MINUTE_SIX_NEGATIVE_NO_PRIMARY')
          print('XRAY_ALPACA_RUNNER_NONDISPLAY_LICENSE=BLOCKED_UNATTESTED')
          print('XRAY_ALPACA_REAL_R92_AL=0')
          PY
