name: XRAY P0 Official SEC 12 Original Split Documents PIT and HTTP Witness
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_sec_12_split_original_documents_shadow.py"
      - ".github/workflows/xray-p0-sec-12-original-split-documents.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-sec-original-12:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Exact Git source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Official exchange calendar and negative SEC provenance tests
        run: |
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python -m py_compile nasdaq-xray/p0_sec_12_split_original_documents_shadow.py
          python nasdaq-xray/p0_sec_12_split_original_documents_shadow.py --selftest
          python -O nasdaq-xray/p0_sec_12_split_original_documents_shadow.py --selftest
      - name: Query SEC official accession archives fairly, no private share data persisted
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT || vars.XRAY_SEC_USER_AGENT }}
        run: |
          python nasdaq-xray/p0_sec_12_split_original_documents_shadow.py \
            --out "$RUNNER_TEMP/xray_sec_12_split_original_documents_shadow.json"
      - name: Verify no fake official success, source SHA and ZERO MC/HISTORY primary
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_sec_12_split_original_documents_shadow.json"
          d=json.loads(p.read_text())
          assert d["schema"]=="XRAY_SEC_12_OFFICIAL_SPLIT_DOC_AND_SUBMISSION_PIT_CANARY_V1"
          assert d["source_events"]==len(d["event_statuses"])==12
          assert d["SEC_document_and_acceptance_verified_count"]+d["SEC_document_or_acceptance_unknown_count"]==12
          assert d["SEC_document_and_acceptance_verified_count"]==12, "EXACT_12_OFFICIAL_SOURCE_RATIO_UNPROVEN"
          assert d["SEC_document_or_acceptance_unknown_count"]==0
          assert d["all_ratio_strings_machine_parsed_and_verified"] is True
          assert d["source_registry_git_blob_sha"]==subprocess.check_output(
           ["git","hash-object","nasdaq-xray/research/p0_11_split_events_official_sec_issuer_registry_20261012.json"],
            text=True).strip()
          assert d["all_ratio_strings_machine_parsed_and_verified"] == (d["SEC_document_and_acceptance_verified_count"] == 12)
          assert d["canonical_HISTORY_PASS_created"]==d["C417_PRIMARY_MC_created"]==0
          assert d["GO"] is False and d["R92_created"] is False
          assert d["raw_SEC_HTML_prices_or_shares_persisted"] is False
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          print("XRAY_SEC_SPLIT_DOCS_OFFICIAL_GUARDED_RESEARCH_ONLY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-p0-twelve-official-sec-split-originals-sanitized
          path: ${{ runner.temp }}/xray_sec_12_split_original_documents_shadow.json
          retention-days: 14
          if-no-files-found: error
