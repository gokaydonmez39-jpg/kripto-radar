name: XRAY v36 Offline SIP Trade Correction Lineage (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/xray_v36_trade_correction_lineage.py'
      - 'nasdaq-xray/test_xray_v36_trade_correction_lineage.py'
      - '.github/workflows/xray-v36-trade-correction-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-v36-offline-lineage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-evidence-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile and run all offline synthetic positive and negative checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/xray_v36_trade_correction_lineage.py nasdaq-xray/test_xray_v36_trade_correction_lineage.py
          cd nasdaq-xray
          python -m unittest -v test_xray_v36_trade_correction_lineage.py
          python -O -m unittest -v test_xray_v36_trade_correction_lineage.py
      - name: Reject any false market authority or network / broker imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path('nasdaq-xray/xray_v36_trade_correction_lineage.py')
          t = ast.parse(p.read_text())
          modules = []
          for node in ast.walk(t):
              if isinstance(node, ast.Import):
                  modules += [alias.name.split('.')[0] for alias in node.names]
              elif isinstance(node, ast.ImportFrom) and node.module:
                  modules.append(node.module.split('.')[0])
          forbidden = set(modules) & {'requests','urllib','http','socket','subprocess','alpaca','ccxt','os','pathlib'}
          if forbidden: raise SystemExit('FORBIDDEN_SIDE_EFFECT_IMPORT: '+str(sorted(forbidden)))
          assert not any(x in p.read_text() for x in ('api.alpaca.markets/v2/orders','secrets.', 'EXECUTION=LIVE'))
          print('XRAY_V36_OFFLINE_NO_HTTP_NO_ORDER_IMPORT=PASS')
          PY