name: XRAY Personal Same-ASOF SHA Chain Truth
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/personal_research_same_asof_chain_audit.py"
      - "nasdaq-xray/research/health_runtime_reenable_20261014_v1.json"
      - ".github/workflows/xray-personal-same-asof-chain-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate selftest and live source chain SHA evidence
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/personal_research_same_asof_chain_audit.py
          python nasdaq-xray/personal_research_same_asof_chain_audit.py --selftest
          python -O nasdaq-xray/personal_research_same_asof_chain_audit.py --selftest
          python nasdaq-xray/personal_research_same_asof_chain_audit.py --out "$RUNNER_TEMP/xray_same_asof_sha_chain_truth.json"
      - name: Assert real R92 gating not bypassed
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_same_asof_sha_chain_truth.json").read_text())
          assert r["schema"]=="XRAY_PERSONAL_SAME_ASOF_CHAIN_AUDIT_V1"
          assert r["execution"]=="NONE" and r["real_money"]=="NO-GO"
          assert r["unknown_never_pass"] is True
          assert r["r92_created"] is False
          assert r["production_pointer_written"] is False
          assert r["root_source_health_enabled_control_verified"] is True
          assert all(len(s)==40 for s in r["canonical_source_git_blob_shas"].values())
          for role,filename in {
           "MASTER":"canonical_current_master_manifest.json",
           "PRICE":"canonical_current_price_dv30.json",
           "HISTORY":"canonical_current_history.json",
           "LEGAL":"canonical_current_legal.json",
           "EVENT":"canonical_current_event_state.json",
           "FINAL":"canonical_current_final_tech.json",
           "TERMINAL":"canonical_current_terminal.json"}.items():
              actual=subprocess.check_output(["git","hash-object",
                               "nasdaq-xray/"+filename],text=True).strip()
              assert actual==r["canonical_source_git_blob_shas"][role],role
          print("XRAY_SAME_ASOF_AUDIT="+"EXACT" if r["exact_same_asof"] else "XRAY_SAME_ASOF_AUDIT=MIXED_NO_R92")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xray-personal-same-asof-sha-chain-no-r92
          path: ${{ runner.temp }}/xray_same_asof_sha_chain_truth.json
          if-no-files-found: error
          retention-days: 14
