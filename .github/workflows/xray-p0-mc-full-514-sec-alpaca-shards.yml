name: XRAY Free Personal MC Exact 514 SEC Alpaca Four Shards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-p0-mc-full-514-sec-alpaca-shards.yml"
permissions:
  contents: read
jobs:
  four-way-exact-mc-measure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Check invocation SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source and shard negative tests
        run: |
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python nasdaq-xray/p0_sec_alpaca_64_spread_shadow.py --selftest
          python -O nasdaq-xray/p0_sec_alpaca_64_spread_shadow.py --selftest
      - name: Measure one exact 514-symbol quarter without vendor persistence
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT || vars.XRAY_SEC_USER_AGENT }}
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          python nasdaq-xray/p0_sec_alpaca_64_spread_shadow.py \
            --full-shard ${{ matrix.shard }} --out "$RUNNER_TEMP/mc514_${{ matrix.shard }}.json"
      - name: Verify source and strict no-Go
        env:
          INDEX: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/("mc514_"+os.environ["INDEX"]+".json")).read_text())
          assert j["schema"]=="XRAY_PERSONAL_SEC_ALPACA_FULL_514_MC_FOUR_SHARD_SHADOW_V1"
          assert j["shard"]==int(os.environ["INDEX"]) and j["shard_total"]==4
          assert j["source_scope_pass_count"]==514
          assert j["sampled_count"] in (128,129)
          assert j["sampled_count"]==len(j["outcomes"])==len(j["sampled_symbols"])
          assert sum(j["status_counts"].values())==j["sampled_count"]
          assert j["price_source_git_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],text=True).strip()
          assert j["master_source_git_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/canonical_current_master_manifest.json"],text=True).strip()
          assert j["full_514_PRIMARY_claim"] is False
          assert j["production_C417_PRIMARY_MC_created"]==0
          assert j["production_HISTORY_PASS_created"]==0
          assert j["AL_R92_created"] is False and j["GO"] is False
          assert j["raw_vendor_OHLCV_SEC_share_counts_archived"] is False
          print("XRAY_MC_FULL_514_SHARD_SOURCE_BOUNDED="+os.environ["INDEX"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xray-mc-514-shard-${{ matrix.shard }}-no-primary
          path: ${{ runner.temp }}/mc514_${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: error
