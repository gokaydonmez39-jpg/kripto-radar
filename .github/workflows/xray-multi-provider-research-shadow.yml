name: XRAY Multi-Provider Fail-Closed Research Shadow
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/xray_multi_provider_research.py"
      - "nasdaq-xray/tauric_tradingagents_advisory_shadow.py"
      - "nasdaq-xray/bq_history_onecall_shadow.py"
      - ".github/workflows/xray-multi-provider-research-shadow.yml"
  workflow_dispatch:
  schedule:
    - cron: "07 21 * * 1-5"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/xray_multi_provider_research.py"
      - "nasdaq-xray/tauric_tradingagents_advisory_shadow.py"
      - "nasdaq-xray/c418_provider_inventory_20261012.json"
      - "nasdaq-xray/c418_provider_routing_readiness.py"
      - "nasdaq-xray/source_epoch_freshness_guard.py"
      - "nasdaq-xray/source_successor_c418_proposal.json"
      - "nasdaq-xray/bq_history_onecall_shadow.py"
      - "nasdaq-xray/bq_mc_exact_asof_shadow_probe.py"
      - ".github/workflows/xray-multi-provider-research-shadow.yml"

permissions:
  contents: read

concurrency:
  group: xray-multi-provider-research-shadow-v1
  cancel-in-progress: false

jobs:
  provider-failover-offline:
    # PR never receives external vendor credentials or licensed sources.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pinned official clock library for synthetic pre-MC safety fixtures
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Normal and optimized synthetic Massive 429/403 to BQ batching
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/xray_multi_provider_research.py
          python nasdaq-xray/xray_multi_provider_research.py --selftest
          python -O nasdaq-xray/xray_multi_provider_research.py --selftest
          python -m py_compile nasdaq-xray/bq_history_onecall_shadow.py
          python nasdaq-xray/bq_history_onecall_shadow.py --selftest
          python -O nasdaq-xray/bq_history_onecall_shadow.py --selftest
          echo 'XRAY_BQ_FAILOVER_CREDIT_GUARD=PASS_OFFLINE_NO_VENDOR_NO_ALPHA'
      - name: TradingAgents v0.7 pinned advisory ingress - offline red/green and real canonical smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/tauric_tradingagents_advisory_shadow.py
          python nasdaq-xray/tauric_tradingagents_advisory_shadow.py --selftest
          python -O nasdaq-xray/tauric_tradingagents_advisory_shadow.py --selftest
          python nasdaq-xray/tauric_tradingagents_advisory_shadow.py --out "$RUNNER_TEMP/xray_tauric_research_shadow.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_tauric_research_shadow.json").read_text())
          assert x["schema"]=="XRAY_TAURIC_ADVISORY_SHADOW_V1"
          assert x["report_status"]=="NO_UPSTREAM_REPORT_PROVIDED"
          assert x["policy_hash"] and x["asof_et"]
          assert x["source_git_blob_shas"]["master"]
          assert x["source_git_blob_shas"]["price"]
          assert x["research_only"] is True
          assert x["decision"]=="NO_GO_ADVISORY_CANNOT_RELEASE"
          assert x["r92_created"] is False and x["notification_queued"] is False
          assert x["alpha_authority"] is False
          assert x["api_calls"]==x["llm_calls"]==0
          assert x["upstream_code_executed"] is False
          print("XRAY_TAURIC_REAL_CANONICAL_ADVISORY=PASS_ZERO_PRIMARY_ZERO_R92")
          PY
  graphify-ast-pilot-no-alpha:
    # One-off PR evaluation only. Never run third-party parsers in production
    # or in a job carrying API keys / delivery credentials.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Graphify 0.9.92 isolated local AST canary, no vendor or LLM credentials
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
          XRAY_ALPACA_DATA_KEY_ID: ""
          XRAY_ALPACA_DATA_SECRET_KEY: ""
          XRAY_MASSIVE_API_KEY: ""
          XRAY_BQ_API_KEY: ""
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check 'graphifyy==0.9.92'
          graphify --help >/dev/null
          python - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path("nasdaq-xray")
          dst=Path(os.environ["RUNNER_TEMP"])/"graphify-xray-input"
          dst.mkdir(parents=True,exist_ok=False)
          focus=[
              "sina_stage.py",
              "official_first_trade_260_history_guard.py",
              "price_dv30_phase.py",
              "price_dv30_recover_from_fullstate.py",
              "rth_official_proof_deficit.py",
              "build_current_resolver_request.py",
              "build_current_terminal.py",
              "e2e_production_readiness.py",
              "source_epoch_freshness_guard.py",
              "alpaca_sip_close_auction_condition_shadow.py",
              "alpaca_rth_minute_integrity_shadow.py",
              "alpaca_rth_trade_gap_witness.py",
              "delivery_prepare.py",
              "tauric_tradingagents_advisory_shadow.py",
              "personal_research_primary_engine_v1.py",
              "personal_research_primary_engine_v2.py",
          ]
          for name in focus:
              p=root/name
              if not p.is_file() or p.is_symlink():
                  raise SystemExit("MISSING_OR_UNSAFE_FOCUS_FILE:"+name)
              shutil.copyfile(p,dst/name)
          print("XRAY_GRAPHIFY_PILOT_SOURCE_COUNT="+str(len(focus)))
          PY
          graphify extract "$RUNNER_TEMP/graphify-xray-input" \
            --code-only --no-cluster --no-dedup \
            --out "$RUNNER_TEMP/graphify-xray-result"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"graphify-xray-result"
          matches=list(root.rglob("graph.json"))
          if len(matches)!=1:
              raise SystemExit("GRAPHIFY_OUTPUT_COUNT_INVALID:"+str(len(matches)))
          obj=json.loads(matches[0].read_text())
          nodes=obj.get("nodes") or []
          edges=obj.get("links",obj.get("edges",[]))
          if not isinstance(nodes,list) or not isinstance(edges,list):
              raise SystemExit("GRAPHIFY_SCHEMA_INVALID")
          conf={}
          rel={}
          for e in edges:
              if not isinstance(e,dict):raise SystemExit("GRAPHIFY_EDGE_NOT_OBJECT")
              c=e.get("confidence","UNSPECIFIED")
              if c not in ("EXTRACTED","INFERRED","AMBIGUOUS","UNSPECIFIED"):
                  raise SystemExit("GRAPHIFY_UNEXPECTED_CONFIDENCE")
              conf[c]=conf.get(c,0)+1
              k=str(e.get("relation","unknown"));rel[k]=rel.get(k,0)+1
          if len(nodes)<20 or len(edges)<10:
              raise SystemExit("GRAPHIFY_EMPTY_OR_INCOMPLETE_CODE_GRAPH")
          if not any(k in rel for k in ("calls","imports","references","contains")):
              raise SystemExit("GRAPHIFY_NO_CODE_RELATION")
          # AST graph does not attest GitHub workflow callbacks, provider
          # rights, ASOF, raw OHLCV or the C4.17 release DAG.
          print("XRAY_GRAPHIFY_AST_PILOT="+json.dumps({
              "source_python_files":16,"nodes":len(nodes),"edges":len(edges),
              "confidence_counts":conf,"relation_counts":rel,
              "workflow_dependency_edges_attested":False,
              "source_rights_attested":False,
              "no_trading":True,"alpha_authority":False,"r92_created":False,
              "api_market_calls":0,"llm_calls":0},sort_keys=True))
          PY

      - name: Resolve declared Actions needs and workflow_run edges separately from AST (offline)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python -m py_compile nasdaq-xray/research/graphify_workflow_dag_audit.py
          python nasdaq-xray/research/graphify_workflow_dag_audit.py --selftest
          python -O nasdaq-xray/research/graphify_workflow_dag_audit.py --selftest
          python nasdaq-xray/research/graphify_workflow_dag_audit.py > "$RUNNER_TEMP/xray_graphify_actions_dag.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_graphify_actions_dag.json").read_text())
          if j["schema"]!="XRAY_GRAPHIFY_ACTIONS_DAG_RESEARCH_V1":
              raise SystemExit("SCHEMA_BAD")
          if j["workflow_count"]<200 or j["declared_edge_count"]<20:
              raise SystemExit("DAG_DISAPPEARED")
          if j["r92_created"] or j["primary_pass_created"] or j["vendor_market_calls"]:
              raise SystemExit("ALPHA_OR_VENDOR_SIDE_EFFECT")
          print("XRAY_GRAPHIFY_ACTIONS_DAG_MEASURED="+json.dumps(j,sort_keys=True))
          PY
  provider-shadow:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      XRAY_MASSIVE_API_KEY: ${{ secrets.XRAY_MASSIVE_API_KEY }}
      XRAY_BQ_API_KEY: ${{ secrets.XRAY_BQ_API_KEY }}
      # Research-only provider grants; mere API key presence does not
      # authorize unattended vendor calls or data storage.
      XRAY_MASSIVE_UNATTENDED_RESEARCH_LICENSE_OK: ${{ vars.XRAY_MASSIVE_UNATTENDED_RESEARCH_LICENSE_OK }}
      XRAY_MASSIVE_LICENSE_EVIDENCE_SHA256: ${{ secrets.XRAY_MASSIVE_LICENSE_EVIDENCE_SHA256 }}
      XRAY_BQ_UNATTENDED_RESEARCH_LICENSE_OK: ${{ vars.XRAY_BQ_UNATTENDED_RESEARCH_LICENSE_OK }}
      XRAY_BQ_LICENSE_EVIDENCE_SHA256: ${{ secrets.XRAY_BQ_LICENSE_EVIDENCE_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install official NASDAQ calendar for pre-MC latest-session safety
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Check official completed-session clock regression
        run: |
          python nasdaq-xray/source_epoch_freshness_guard.py --selftest
      - name: Same-ASOF 12-provider router and independent zero-authority check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/c418_provider_routing_readiness.py
          python nasdaq-xray/c418_provider_routing_readiness.py --selftest
          python -O nasdaq-xray/c418_provider_routing_readiness.py --selftest
          python nasdaq-xray/c418_provider_routing_readiness.py --out "$RUNNER_TEMP/xray_12_provider_routing_readiness.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ["RUNNER_TEMP"])/"xray_12_provider_routing_readiness.json"
          j=json.loads(f.read_text())
          root=Path("nasdaq-xray")
          price=json.loads((root/"canonical_current_price_dv30.json").read_text())
          master=json.loads((root/"canonical_current_master_manifest.json").read_text())
          inventory=json.loads((root/"c418_provider_inventory_20261012.json").read_text())
          cfg=next(x for x in inventory["sources"] if x["id"]=="BUSINESSQUANT")
          cohort=len(price["pass_symbols"])
          batch=cfg["max_tickers_per_historic_call"]
          daily=cfg["daily_requests"]
          expected_calls=(cohort+batch-1)//batch
          expected_days=(expected_calls+daily-1)//daily
          assert j["schema"]=="XRAY_C418_DYNAMIC_MULTI_PROVIDER_ROUTING_READINESS_V2"
          assert j["asof_et"]==price["asof_et"]==master["asof_et"]
          assert j["canonical_price_pass_count"]==price["pass_count"]==cohort
          assert j["master_identity_pass_count"]==master["pass_count"]==len(master["pass_symbols"])
          assert j["master_identity_unknown_count"]==master["unknown_count"]==len(master["unknown_symbols"])
          assert j["discovered_source_rows"]==len(inventory["sources"])
          assert j["verified_distinct_market_cap_origin_count"]==0
          bq=j["per_source_capacity_scenarios"]["BUSINESSQUANT"]
          assert bq["documented_tickers_per_call"]==batch
          assert bq["best_case_historical_mc_calls_if_all_symbols_have_data"]==expected_calls
          assert bq["best_case_free_calendar_days"]==expected_days
          assert bq["historical_filing_acceptance_pit_proven"] is False
          assert bq["best_case_only_not_entitled_to_primary"] is True
          assert j["new_primary_mc_authority_count"]==0
          assert j["new_r92_count_created"]==0
          assert j["effective_policy"]=="C4.17"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["go"] is False and j["unknown_never_pass"] is True
          assert j["no_vendor_raw_data_exported"] is True
          print("XRAY_12_SOURCE_ADMISSION=PASS_NO_FALSE_PRIMARY_NO_GO")
          PY
      - name: Bound and inspect optional official Business Quant EOD response (one sample, never alpha)
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/bq_history_onecall_shadow.py
          python nasdaq-xray/bq_history_onecall_shadow.py --selftest
          python -O nasdaq-xray/bq_history_onecall_shadow.py --selftest
          # Independently enforce no HTTP call merely because key is present.
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          module_path=Path("nasdaq-xray/bq_history_onecall_shadow.py")
          spec=importlib.util.spec_from_file_location("bq_shadow_safety",module_path)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          called=[]
          def no_call(*args):
              called.append(args)
              raise RuntimeError("ILLEGAL_UNLICENSED_CALL")
          result=m.run("2026-10-09","a-present-key",no_call,research_grant_ok=False)
          if result["status"]!="BLOCKED_UNATTESTED_RESEARCH_LICENSE" or called or result["api_call_count"]!=0:
              raise SystemExit("XRAY_BQ_UNLICENSED_NETWORK_CALL_FAIL_OPEN")
          print("XRAY_BQ_API_KEY_ALONE_CANNOT_TRIGGER_UNATTENDED_REQUEST=PASS")
          PY
          python nasdaq-xray/bq_history_onecall_shadow.py --out "$RUNNER_TEMP/xray_bq_history_onecall_shadow.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_bq_history_onecall_shadow.json").read_text())
          assert x["schema"]=="XRAY_BQ_ONECALL_EOD_RESEARCH_SHADOW_V1"
          assert x["symbol_count_requested"]<=1 and x["api_call_count"]<=1
          assert x["bar_rows_validated"]<=12
          for k in ("production_history_authority","primary_mc_authority","can_register_R92",
                    "raw_prices_or_volumes_persisted","api_key_or_request_url_reported"):
              assert x[k] is False,k
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          print("XRAY_BQ_OFFICIAL_EOD_PROBE_FAIL_CLOSED=PASS_NONAUTHORITY")
          PY
      - name: Date-scoped BusinessQuant MC shadow works despite PRICE UNKNOWN
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/bq_mc_exact_asof_shadow_probe.py
          python nasdaq-xray/bq_mc_exact_asof_shadow_probe.py --selftest
          python -O nasdaq-xray/bq_mc_exact_asof_shadow_probe.py --selftest
          python nasdaq-xray/bq_mc_exact_asof_shadow_probe.py --out "$RUNNER_TEMP/xray_bq_mc_price_independent.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_bq_mc_price_independent.json").read_text())
          assert x["schema"]=="XRAY_BQ_MC_EXACT_ASOF_PRICE_INDEPENDENT_SHADOW_V1"
          assert x["policy"]=="C4.17" and x["control"]=="C4.27"
          assert x["research_only"] is True and x["unknown_never_pass"] is True
          assert x["api_calls"] in (0,1) and 0<=x["sample_symbols_requested"]<=5
          assert 0<=x["dated_metric_rows_present"]<=x["sample_symbols_requested"]
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          for k in ("market_cap_values_persisted","vendor_raw_data_persisted",
                    "request_url_or_key_persisted","filing_acceptance_pit_attested",
                    "license_independently_verified","current_primary_market_cap_created",
                    "history_pass_created","r92_created","alpha_authority",
                    "strict_g9_pass","account_pass","can_create_primary"):
              assert x[k] is False,k
          if x["api_calls"]==0:assert x["dated_metric_rows_present"]==0
          for secret_name in ("XRAY_BQ_API_KEY",):
              if os.environ.get(secret_name):
                  assert os.environ[secret_name] not in json.dumps(x)
          print("XRAY_BUSINESSQUANT_REAL_RUNNER_STATUS="+x["status"])
          print("XRAY_BQ_PRICE_UNKNOWN_INDEPENDENCE=PASS_NO_MC_PRIMARY_R92")
          PY
      - name: Compile and negative/positive fail-closed regression
        run: |
          python -m py_compile nasdaq-xray/xray_multi_provider_research.py
          python nasdaq-xray/xray_multi_provider_research.py --selftest
          python -O nasdaq-xray/xray_multi_provider_research.py --selftest
      - name: Probe all three lanes with shared per-run budgets (non-authoritative)
        run: |
          python nasdaq-xray/xray_multi_provider_research.py \
            --limit 5 \
            --pre-mc-recovery \
            --out "$RUNNER_TEMP/xray_multi_provider_shadow.json"
      - name: Independently validate public operational telemetry only
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ["RUNNER_TEMP"])/"xray_multi_provider_shadow.json"
          x=json.loads(f.read_text())
          assert x["schema"]=="XRAY_MULTI_PROVIDER_RESEARCH_SHADOW_V1"
          assert x["execution"]=="NONE" and x["real_money"]=="NO-GO"
          assert x["policy"]=="C4.17" and x["control"]=="C4.27"
          assert x["unknown_never_pass"] is True
          assert x["research_only"] is True and x["alpha_authority"] is False
          for flag in ["mc_pass_created","g9_pass","account_pass","canonical_status_changed","raw_market_data_persisted"]:
              assert x[flag] is False,flag
          assert set(x["lanes"])=={"MASTER","MC","EVENT"}
          source_keys={"MASTER","MC","HISTORY","EVENT","TERMINAL"}
          if x.get("pre_mc_recovery_source_exact") is True:
              source_keys.add("PRICE")
          assert set(x["source_blobs"])==source_keys
          assert all(0<=r["sample_attempted"]<=5 for r in x["lanes"].values())
          assert all(v<=3 for k,v in x["invocation_counts"].items() if k=="MASSIVE")
          if x.get("pre_mc_recovery_source_exact") is True:
              assert x["source_epoch_exact"] is False
              assert x["result"]=="PRE_MC_SOURCE_EXACT_SHADOW_ONLY_NO_PRIMARY_NO_AL"
              assert x["source_blobs"]["MC"] is None
              assert x["source_blobs"]["PRICE"]
              assert x["lanes"]["EVENT"]["scope_unverified"] is True
              assert x["lanes"]["EVENT"]["sample_attempted"]==0
              assert x["mc_pass_created"] is False and x["alpha_authority"] is False
              print("XRAY_MULTIPROVIDER_PRE_MC_RECOVERY=EXACT_MASTER_PRICE_RESEARCH_ONLY")
          elif x.get("source_epoch_exact") is False:
              assert x["result"]=="BLOCKED_SOURCE_EPOCH_NO_CALLS_NO_ALPHA"
              assert not x["invocation_counts"]
              assert all(v["sample_attempted"]==0 and v["scope_unverified"] is True
                         for v in x["lanes"].values())
              print("XRAY_MULTIPROVIDER_SAME_ASOF=BLOCKED_ZERO_CALLS_NO_FALSE_PASS")
          else:
              assert x.get("source_epoch_exact") is True
              print("XRAY_MULTIPROVIDER_SAME_ASOF=EXACT_SHADOW_ONLY")
          payload=f.read_text()
          for key in ["XRAY_MASSIVE_API_KEY","XRAY_BQ_API_KEY"]:
              secret=os.getenv(key,"")
              if secret:
                  assert secret not in payload,"SECRET_LEAK:"+key
          print("XRAY_MULTIPROVIDER_PRODUCTION_NONAUTHORITY=PASS")
          print("XRAY_MULTI_PROVIDER_SCOPE_COUNTS="+str({
              k:v["scope_count"] for k,v in x["lanes"].items()}))
          print("XRAY_MULTI_PROVIDER_STATE="+str({
              k:v["status_counts"] for k,v in x["lanes"].items()}))
          PY
      - name: TradingAgents advisory canonical report (zero vendor calls, never alpha)
        shell: bash
        run: |
          set -euo pipefail
          python nasdaq-xray/tauric_tradingagents_advisory_shadow.py --selftest
          python -O nasdaq-xray/tauric_tradingagents_advisory_shadow.py --selftest
          python nasdaq-xray/tauric_tradingagents_advisory_shadow.py --out "$RUNNER_TEMP/xray_tauric_research_shadow.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_tauric_research_shadow.json").read_text())
          assert j["schema"]=="XRAY_TAURIC_ADVISORY_SHADOW_V1"
          assert j["upstream_code_executed"] is False
          assert j["report_status"]=="NO_UPSTREAM_REPORT_PROVIDED"
          assert j["api_calls"]==j["llm_calls"]==0
          assert j["decision"]=="NO_GO_ADVISORY_CANNOT_RELEASE"
          assert not j["r92_created"] and not j["alpha_authority"] and not j["notification_queued"]
          print("XRAY_TAURIC_NO_SIGNAL_AUTHORITY=PASS")
          PY
      - name: Upload sanitized research-only operational telemetry
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-multi-provider-operational-only
          path: |
            ${{ runner.temp }}/xray_multi_provider_shadow.json
            ${{ runner.temp }}/xray_tauric_research_shadow.json
            ${{ runner.temp }}/xray_bq_history_onecall_shadow.json
            ${{ runner.temp }}/xray_bq_mc_price_independent.json
            ${{ runner.temp }}/xray_12_provider_routing_readiness.json
          retention-days: 14
          if-no-files-found: error
