name: XRAY Candidate SIP Pending Exact Partition (No AL)
on:
  pull_request:
    paths:
      - "nasdaq-xray/alpaca_candidate_local_260_recovery_shadow.py"
      - "nasdaq-xray/personal_research_daily_attestation.py"
      - "nasdaq-xray/build_current_terminal.py"
      - "nasdaq-xray/terminal_price_partition_selftest.py"
      - "nasdaq-xray/price_snapshot_integrity.py"
      - "nasdaq-xray/price_dv30_recover_from_fullstate.py"
      - ".github/workflows/xray-candidate-sip-pending-partition-offline.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_candidate_local_260_recovery_shadow.py"
      - "nasdaq-xray/personal_research_daily_attestation.py"
      - "nasdaq-xray/build_current_terminal.py"
      - "nasdaq-xray/terminal_price_partition_selftest.py"
      - "nasdaq-xray/price_snapshot_integrity.py"
      - "nasdaq-xray/price_dv30_recover_from_fullstate.py"
      - ".github/workflows/xray-candidate-sip-pending-partition-offline.yml"
permissions:
  contents: read
concurrency:
  group: xray-candidate-sip-pending-partition
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned Nasdaq session calendar only
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Prove normal and optimized source-scope tests (no API)
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/alpaca_candidate_local_260_recovery_shadow.py
          python nasdaq-xray/alpaca_candidate_local_260_recovery_shadow.py --selftest
          python -O nasdaq-xray/alpaca_candidate_local_260_recovery_shadow.py --selftest
          python -m py_compile nasdaq-xray/personal_research_daily_attestation.py
          python nasdaq-xray/personal_research_daily_attestation.py --selftest
          python -O nasdaq-xray/personal_research_daily_attestation.py --selftest
      - name: Validate terminal candidate-local PRICE partial partition (no provider IO)
        run: |
          python -m py_compile nasdaq-xray/price_snapshot_integrity.py nasdaq-xray/build_current_terminal.py nasdaq-xray/terminal_price_partition_selftest.py
          python nasdaq-xray/terminal_price_partition_selftest.py
          python -O nasdaq-xray/terminal_price_partition_selftest.py
          echo "XRAY TERMINAL PRICE partial UNKNOWN partition was checked without PRIMARY, R92 or market API calls."
      - name: Verify exact LIVE main-source partial candidate partition if session is current
        run: |
          python - <<'PY'
          import datetime as dt,json,sys
          from pathlib import Path
          sys.path.insert(0,"nasdaq-xray")
          from alpaca_candidate_local_260_recovery_shadow import source_scope,ROOT
          from source_epoch_freshness_guard import last_complete_session
          root=json.loads((ROOT/"orchestrator_state.json").read_text())
          now=dt.datetime.now(dt.timezone.utc)
          # If the pushed code lands after next completion, stale roots must
          # remain NO-GO. This CI validates static provenance, never advances
          # source ASOF or changes any production artifact.
          if root["asof_et"]!=last_complete_session(now):
              print("XRAY_PARTIAL_FUNNEL=STALE_ROOT_FAIL_CLOSED_NO_ALPHA")
          else:
              asof,targets,daily,weeks=source_scope(root,now)
              w=root["watch_radar"]
              f=root["candidate_technical_funnel"]
              unknowns={s for s,v in f["results"].items()
                        if v["status"].startswith("UNKNOWN_")}
              missing={row["symbol"] for row in w["watchlist"]}-set(f["results"])
              assert set(targets)==unknowns|missing
              assert f["attempted_count"]+len(missing)==len(w["watchlist"])
              if missing:
                  assert set(f["pending_symbols"])==unknowns|missing
              assert len(daily)==260 and len(weeks)==52
              print("XRAY_PARTIAL_FUNNEL=PASS_EXACT_PENDING_"+str(len(missing))+
                    "_TARGETS_"+str(len(targets))+"_NO_ALPHA")
          PY
      - name: State execution and source provenance truth
        run: |
          echo "Candidate-local 260 SIP source recovery may probe explicitly pending, unattempted technical names." >> "$GITHUB_STEP_SUMMARY"
          echo "NO technical PASS, canonical HISTORY PASS, MC, R92, trade or phone alert created by these tests." >> "$GITHUB_STEP_SUMMARY"