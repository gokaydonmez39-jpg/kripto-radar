name: XRAY E2E Delivery Contract Isolated Regression TEMP
on:
  push:
    branches: [xray/e2e-delivery-observability-separation-20261015]
    paths:
      - ".github/workflows/xray-e2e-delivery-contract-test-temp.yml"
permissions:
  contents: read
concurrency:
  group: xray-e2e-delivery-contract-temp
  cancel-in-progress: true
jobs:
  negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned calendar only
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Python compilation, exact C4.17 regressions
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/e2e_production_readiness.py nasdaq-xray/blocker_root_dependency_audit.py
          python nasdaq-xray/e2e_production_readiness.py --selftest
          python nasdaq-xray/blocker_root_dependency_audit.py --selftest
      - name: Read-only current snapshot, independent causal DAG, and fail-closed
        run: |
          set -euo pipefail
          python nasdaq-xray/e2e_production_readiness.py --output "$RUNNER_TEMP/xray_delivery_contract_e2e.json"
          python nasdaq-xray/blocker_root_dependency_audit.py --e2e-witness "$RUNNER_TEMP/xray_delivery_contract_e2e.json" --out "$RUNNER_TEMP/xray_delivery_contract_dag.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          e=json.loads((root/"xray_delivery_contract_e2e.json").read_text())
          d=json.loads((root/"xray_delivery_contract_dag.json").read_text())
          obs=e["delivery_observability"]
          assert obs["phase"]=="POST_DELIVERY_INDEPENDENT_ACK"
          assert obs["status"]=="UNVERIFIED_NO_INDEPENDENT_DEVICE_ACK"
          assert obs["device_receipt_attested"] is False
          assert obs["research_release_prerequisite"] is False
          assert obs["notification_sent_by_this_audit"] is False
          assert e["actual_device_delivery_receipt_attested"] is False
          assert "NOTIFICATION_DEVICE_RECEIPT_NOT_PROVEN" not in e["blockers"]
          assert d["root_cause_classes"]["P0_DEVICE_RECEIPT_EVIDENCE"] is True
          assert d["real_device_notification_receipt_attested"] is False
          assert e["ready_for_current_research_signal"] is False
          assert d["go"] is False and d["alpha_authority"] is False
          assert e["execution"]=="NONE" and e["real_money"]=="NO-GO"
          print("XRAY_DEVICE_RELEASE_SEPARATION=PASS_REAL_GITHUB_RUN_NO_FAKE_ACK_NO_ALPHA")
          print("XRAY_FUTURE_READY_LOCAL_CHAIN_TEST=EVALUATED_IN_CAUSAL_SELFTEST_EXACT_MC_FILENAME_FIX")
          print("XRAY_RETAINED_SOURCE_BLOCKERS="+str(e["blockers"]))
          PY
