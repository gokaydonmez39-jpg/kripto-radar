name: XRAY NASDAQ EdgarTools Offline SEC PIT Gate
on:
  pull_request:
    paths:
      - 'research/nasdaq_edgar_pit_header_gate.py'
      - 'research/test_nasdaq_edgar_pit_header_gate.py'
      - '.github/workflows/xray-nasdaq-edgartools-pit.yml'
  push:
    branches: [main]
    paths:
      - 'research/nasdaq_edgar_pit_header_gate.py'
      - 'research/test_nasdaq_edgar_pit_header_gate.py'
      - '.github/workflows/xray-nasdaq-edgartools-pit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-sec-pit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed MIT EdgarTools, no external service authentication
        run: python -m pip install 'edgartools==5.62.1'
      - name: Offline filing header PIT / CIK / accession tests
        run: |
          python -m unittest discover -s research -p 'test_nasdaq_edgar_pit_header_gate.py' -v
          python -O -m unittest discover -s research -p 'test_nasdaq_edgar_pit_header_gate.py' -v
      - name: No SEC network or NASDAQ alert mutation
        run: echo 'NASDAQ_EDGAR_SYNTHETIC_ONLY; NO_AL; NO_TRADES; NO_PRIVATE_SHEETS; NO_PUSH'
