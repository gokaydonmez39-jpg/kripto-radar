name: XRAY v30 Three-Symbol Historical SIP Exact30 Presence (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/xray_v30_sip_exact30_three_canary.py"
      - ".github/workflows/xray-v30-historical-sip-3symbol-exact30-canary.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/xray_v30_sip_exact30_three_canary.py"
      - ".github/workflows/xray-v30-historical-sip-3symbol-exact30-canary.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-historical-sip-3symbol-exact30-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-source-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install existing approved calendar dependency only
        run: python -m pip install --disable-pip-version-check 'pandas_market_calendars==5.4.0'
      - name: Confirm git SHA and offline contract, no network/secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/xray_v30_sip_exact30_three_canary.py
          python nasdaq-xray/xray_v30_sip_exact30_three_canary.py --selftest
          python -O nasdaq-xray/xray_v30_sip_exact30_three_canary.py --selftest
      - name: Main-only exact ASOF 30-official-session SIP bounded probe (max 16 HTTP pages)
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          python nasdaq-xray/xray_v30_sip_exact30_three_canary.py --out "$RUNNER_TEMP/xray_v30_sip_exact30_counts_only.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'xray_v30_sip_exact30_counts_only.json'
          d=json.loads(p.read_text())
          assert d['schema']=='XRAY_SIP_EXACT30_THREE_SYMBOL_SHADOW_V1'
          assert d['execution']=='NONE' and d['real_money']=='NO-GO' and d['unknown_never_pass'] is True
          assert d['full_c417_price_dv30_authority'] is False and d['registered_r92'] is False
          assert d['market_data_usage_rights_attested'] is False
          assert d['closing_auction_and_trade_corrections_attested'] is False
          assert d['exact_daily_RTH_integer_volume_attested'] is False
          assert d['g9_pass'] is False and d['canonical_files_changed'] is False
          assert d['no_vendor_ohlcv_persisted'] and d['no_credentials_persisted']
          assert d['page_requests']<=16 and d['sample_size']==3
          assert not any(k in d for k in ('bars','prices','volumes','ohlcv','credentials','symbols'))
          print('XRAY_V30_COUNTS_ONLY_NO_ALPHA='+json.dumps({
              'status':d['status'], 'daily_complete_symbol_count':d['daily_complete_symbol_count'],
              'rth_30min_complete_symbol_count':d['rth_30min_complete_symbol_count'],
              'days':d['official_sessions'], 'expected_slots_per_symbol':d['expected_halfhour_slots_per_symbol'],
              'pages':d['page_requests'], 'no_alpha':True},sort_keys=True))
          PY
      - name: Archive sanitized research counts for seven days
        if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-v30-exact30-three-sip-research-counts-no-alpha
          path: ${{ runner.temp }}/xray_v30_sip_exact30_counts_only.json
          retention-days: 7
          if-no-files-found: warn