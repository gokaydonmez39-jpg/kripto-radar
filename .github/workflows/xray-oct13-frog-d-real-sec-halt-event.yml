name: XRAY Oct13 FROG Official Legal Halt
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/candidate_local_oct13_frog_official_event_halt_sec.py"
      - ".github/workflows/xray-oct13-frog-d-real-sec-halt-event.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pandas_market_calendars==5.4.0
      - name: Compile and verify official historical halt negative and trigger guard
        run: |
          python -m py_compile nasdaq-xray/candidate_local_oct13_frog_official_event_halt_sec.py
          python nasdaq-xray/candidate_local_oct13_frog_official_event_halt_sec.py --selftest
          python -O nasdaq-xray/candidate_local_oct13_frog_official_event_halt_sec.py --selftest
      - name: Download true FROG D risk and R1 RR pass source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/frog"
          gh run download 38535687938 --repo "${{ github.repository }}" --name xray-oct13-deep-277-page-3 --dir "$RUNNER_TEMP/frog"
      - name: Inspect real official SEC historical filings and NasdaqTrader halt records
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT || vars.XRAY_SEC_USER_AGENT }}
        run: |
          python nasdaq-xray/candidate_local_oct13_frog_official_event_halt_sec.py --deep "$RUNNER_TEMP/frog/xray_deep_page.json" --out "$RUNNER_TEMP/xray_frog_official.json"
      - name: Preserve adverse unknowns and no fabricated R92
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_frog_official.json").read_text())
          assert d["asof_et"]=="2026-10-13" and d["symbol"]=="FROG"
          assert d["deep_R1RR_pass"] is True
          assert len(d["nasdaq_halt_diagnostic_by_date"])==4
          assert not d["nasdaq_halt_clear_primary_attested"]
          assert d["r92_registered"]==0 and not d["canonical_mutated"]
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          print("XRAY_FROG_TRUE_RR_OFFICIAL_SEC_NASDAQ_HALTS=PASS_FROZEN_SOURCE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xray-oct13-frog-real-sec-legal-nasdaq-halt-witness
          path: ${{ runner.temp }}/xray_frog_official.json
          if-no-files-found: warn
          retention-days: 14
