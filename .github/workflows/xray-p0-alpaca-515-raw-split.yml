name: XRAY Alpaca 515 Raw vs Split Adjusted 260 History Shadow
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_alpaca_515_raw_split_shadow.py"
      - ".github/workflows/xray-p0-alpaca-515-raw-split.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-dual-adjustment:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Exact source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official calendar and falsification tests
        run: |
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python -m py_compile nasdaq-xray/p0_alpaca_515_raw_split_shadow.py
          python nasdaq-xray/p0_alpaca_515_raw_split_shadow.py --selftest
          python -O nasdaq-xray/p0_alpaca_515_raw_split_shadow.py --selftest
      - name: Measure current 515 raw + split pairs with same session mapping ASOF
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          python nasdaq-xray/p0_alpaca_515_raw_split_shadow.py \
             --out "$RUNNER_TEMP/xray_515_raw_split_research.json"
      - name: Verify exact current PRICE+MASTER source and keep authority false
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_515_raw_split_research.json"
          j=json.loads(p.read_text())
          assert j["schema"]=="XRAY_ALPACA_515_DUAL_RAW_SPLIT_SHADOW_V1"
          assert j["scope_with_qqq"]==515 and j["measured_scope"]==515
          assert j["status"]=="SHADOW_DUAL_ADJUSTMENT_SCOPE_MEASURED_NO_PIT_AUTHORITY"
          assert j["ticker_identity_mapping_asof_et"]==j["asof_et"]
          assert sum(j["counts"].values())==515
          assert j["source_price_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],text=True).strip()
          assert j["source_master_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/canonical_current_master_manifest.json"],text=True).strip()
          assert j["production_HISTORY_PASS_created"]==0
          assert j["C417_PRIMARY_MC_created"]==0
          assert j["R92_created"] is False and j["GO"] is False
          assert j["price_volume_bars_or_event_data_persisted"] is False
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          print("XRAY_DUAL_515_PROVIDER_MEASURED_NO_C417_AUTHORITY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-alpaca-515-raw-split-daily-shadow-sanitized
          path: ${{ runner.temp }}/xray_515_raw_split_research.json
          retention-days: 14
          if-no-files-found: error
