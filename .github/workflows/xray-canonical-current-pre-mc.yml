          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,"nasdaq-xray")
          from price_dv30_recover_from_fullstate import current_price_baseline_valid

          full=json.load(open("nasdaq-xray/canonical_current_full_state.json"))
