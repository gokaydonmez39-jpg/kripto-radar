        run: python nasdaq-xray/build_current_resolver_request.py
      - name: Structural gate
        if: steps.rollover.outputs.build == 'true' || steps.rollover.outputs.policy_replay == 'true' || steps.rollover.outputs.coverage_repair == 'true' || steps.rollover.outputs.resolver_refresh == 'true' || steps.rollover.outputs.bridge_refresh == 'true' || steps.rollover.outputs.publication_replay == 'true'
        run: |
          python - <<'PY'
          import json
          m=json.load(open("nasdaq-xray/canonical_current_master_manifest.json"))
          p=json.load(open("nasdaq-xray/canonical_current_price_dv30.json"))
          q=json.load(open("nasdaq-xray/canonical_current_resolver_request.json"))
          cm=json.load(open("nasdaq-xray/canonical_current_resolver_chunk_manifest.json"))
          assert m["task_id"]==p["task_id"]==q["task_id"]=="6a825366222081918997094d76e6ae46"
          assert m["phase"]=="MASTER_IDENTITY" and m["status"] in {"HISTORY_COMPLETE","PARTIAL_UNKNOWN"}
          assert (m["status"]=="HISTORY_COMPLETE")== (m["unknown_count"]==0)
          assert m["pass_count"]==m["queue_total"]
          assert m["raw_identity_total"]==m["queue_total"]+m["unknown_count"]
          assert len(m.get("unknown_symbols") or [])==m["unknown_count"]
          assert not (set(m.get("unknown_symbols") or []) & set(m.get("pass_symbols") or []))
          assert m["asof_et"]==p["asof_et"]==q["asof_et"]
          assert q["compiled_policy_path"]=="nasdaq-xray/chatgpt_compiled_policy_v3.json"
          assert q["compiled_policy_blob_sha"]=="16c50cc8f887a5234a4be23862d7c8d0e564b0ac"
          assert q["compiled_policy_hash"]=="68684c130849016dd5148c1afdaa888766dc8070506af892420e493629a92fa4"
          assert q["compiled_policy_version"]=="C4.17"
          assert cm["schema"]=="XRAY_RESOLVER_REQUEST_CHUNK_MANIFEST_V1"
          assert cm["task_id"]==q["task_id"] and cm["asof_et"]==q["asof_et"]
          assert cm["execution"]=="NONE" and cm["real_money"]=="NO-GO" and cm["unknown_never_pass"] is True
          assert cm["compiled_policy_blob_sha"]==q["compiled_policy_blob_sha"] and cm["compiled_policy_hash"]==q["compiled_policy_hash"] and cm["compiled_policy_version"]==q["compiled_policy_version"]
          assert cm["queue_hash"]==q["queue_hash"] and cm["symbol_hash"]==q["symbol_hash"] and cm["symbol_count"]==q["symbol_count"]
          assert cm["coverage_complete"] is True and cm["chunk_size"]<=100
          assert cm["chunk_count"]==len(cm["chunks"])
          import hashlib,pathlib
          rb=pathlib.Path("nasdaq-xray/canonical_current_resolver_request.json").read_bytes()
          rsha=hashlib.sha1(b"blob "+str(len(rb)).encode()+b"\0"+rb).hexdigest()
          assert cm["request_blob_sha"]==rsha
          rebuilt=[]
          for i,row in enumerate(cm["chunks"],1):
              cp=pathlib.Path(row["path"]); cb=cp.read_bytes(); csha=hashlib.sha1(b"blob "+str(len(cb)).encode()+b"\0"+cb).hexdigest()
              cj=json.loads(cb)
              assert row["chunk_index"]==i and row["blob_sha"]==csha
              assert cj["request_blob_sha"]==rsha and cj["queue_hash"]==q["queue_hash"] and cj["symbol_hash"]==q["symbol_hash"]
              assert cj["chunk_index"]==i and cj["chunk_total"]==cm["chunk_count"] and cj["symbol_count"]==len(cj["symbols"])<=100
              assert row["symbol_count"]==cj["symbol_count"] and row["chunk_symbol_hash"]==cj["chunk_symbol_hash"]
              rebuilt.extend(cj["symbols"])
          assert rebuilt==q["symbols"] and len(rebuilt)==len(set(rebuilt))==q["symbol_count"]
          assert q["queue_hash"]==m["queue_hash"] and q["queue_total"]==m["queue_total"]
          assert q["symbol_count"]==len(q["symbols"])==len(set(q["symbols"]))
          assert q["master_unknown_count"]==len(q["master_unknown_symbols"])==m["unknown_count"]
          assert set(q["master_unknown_symbols"])==set(m.get("unknown_symbols") or [])
          assert set(q.get("master_unknown_detail") or {})==set(q["master_unknown_symbols"])
          assert not (set(q["master_unknown_symbols"]) & set(q["symbols"]))
          assert q["price_unknown_count"]==len(q["price_unknown_symbols"])
          assert q.get("price_blocked_count",0)==len(q.get("price_blocked_symbols") or [])
          assert set(q["symbols"])==set(q["price_unknown_symbols"])|set(q.get("price_blocked_symbols") or [])
          if q["settlement_required"]:
              assert q["pointer_asof_et"] < q["asof_et"]
              assert len(q["settlement_symbols"])==3 and len(set(q["settlement_symbols"]))==3
              assert {"AAPL","NVDA"}<=set(q["settlement_symbols"])
              assert q["settlement_core_symbol"] not in {"AAPL","NVDA"}
              assert q["settlement_core_source_path"] and q["settlement_core_source_blob_sha"]
          assert p["source_master_queue_hash"]==m["queue_hash"]
          assert p["source_master_count"]==m["queue_total"]
          assert len(p["results"])==m["queue_total"]
          assert sum(p["counts"].values())==m["queue_total"]
          assert p["pass_count"]==len(p["pass_symbols"])==len(set(p["pass_symbols"]))
          print({"asof":m["asof_et"],"master_status":m["status"],"master_unknown":m["unknown_count"],"price_dv30_unknown":p["unknown_count"],"price_dv30_blocked":p.get("blocked_count",(p.get("counts") or {}).get("BLOCK_CURRENT_RUN",0)),"price_dv30_pass":p["pass_count"],"resolver_request_status":q["status"],"settlement_required":q["settlement_required"]})
          PY
      - name: Commit current pre-MC artifacts
        if: steps.rollover.outputs.build == 'true' || steps.rollover.outputs.policy_replay == 'true' || steps.rollover.outputs.coverage_repair == 'true' || steps.rollover.outputs.resolver_refresh == 'true' || steps.rollover.outputs.bridge_refresh == 'true' || steps.rollover.outputs.publication_replay == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          files=(
            nasdaq-xray/canonical_current_full_state.json
            nasdaq-xray/canonical_current_full_candidates.json
            nasdaq-xray/canonical_current_unknowns.json
            nasdaq-xray/canonical_current_resolution_overlay.json
            nasdaq-xray/canonical_current_master_manifest.json
            nasdaq-xray/canonical_current_price_dv30.json
            nasdaq-xray/canonical_current_resolver_request.json
            nasdaq-xray/canonical_current_resolver_chunk_manifest.json
          )
          while IFS= read -r p; do files+=("$p"); done < <(find nasdaq-xray -maxdepth 1 -type f -name "canonical_current_resolver_chunk_[0-9][0-9][0-9][0-9].json" | sort)
          while IFS= read -r p; do files+=("$p"); done < <(find nasdaq-xray -maxdepth 1 -type f \( -name "master_asof_identity_proof_*.json" -o -name "master_sec_spac_proof_*.json" \) | sort)
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for p in "${files[@]}"; do
            if [ -f "$p" ]; then
              mkdir -p "$tmpdir/$(dirname "$p")"
              cp "$p" "$tmpdir/$p"
            fi
          done
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git reset --hard origin/main
            rm -f nasdaq-xray/canonical_current_resolver_chunk_[0-9][0-9][0-9][0-9].json
            for p in "${files[@]}"; do
              if [ -f "$tmpdir/$p" ]; then
                mkdir -p "$(dirname "$p")"
                cp "$tmpdir/$p" "$p"
              fi
            done
            git add -A -- "${files[@]}" 'nasdaq-xray/canonical_current_resolver_chunk_*.json' 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "XRAY_FACTORY_COMMIT=NO_CHANGE"
              exit 0
            fi
            git commit -m "chore(xray): current epoch pre-MC factory [skip ci]"
            if git push origin HEAD:main; then
              echo "XRAY_FACTORY_COMMIT=PASS"
              exit 0
            fi
            echo "XRAY_FACTORY_PUSH_RACE attempt=$attempt"
            sleep $((attempt*2))
          done
          echo "XRAY_FACTORY_COMMIT=FAIL" >&2
          exit 1
