name: XRAY Canonical Current Pre-MC Factory
# XRAY_SCHEDULE_REGISTRATION_REFRESH=20261002

on:
  workflow_run:
    workflows: ["NASDAQ SWING XRAY Autonomous Data Plane"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "35 * * * 1-5"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/resolve_unknowns_fallback.py"
      - "nasdaq-xray/extract_unknown_manifest.py"
      - "nasdaq-xray/build_current_master_manifest.py"
      - "nasdaq-xray/price_dv20_phase.py"
      - "nasdaq-xray/price_dv20_recover_from_fullstate.py"
      - "nasdaq-xray/build_current_resolver_request.py"
      - "nasdaq-xray/recover_pre_mc_snapshot.py"
      - "nasdaq-xray/canonical_resolver_bridge_*.json"
      - "nasdaq-xray/chatgpt_compiled_policy_v3.json"
      - ".github/workflows/xray-canonical-current-pre-mc.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-canonical-current-pre-mc
  cancel-in-progress: true

jobs:
  pre-mc:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      XRAY_FULL_IDENTITY: "1"
      XRAY_IDENTITY_ONLY: "1"
      XRAY_DYNAMIC_AUTHENTICATED_PRICE_BRIDGE: "1"
      XRAY_SINA_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_state.json
      XRAY_SINA_CAND: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_candidates.json
      XRAY_HISTORY_RESOLUTION_OVERLAY: ${{ github.workspace }}/nasdaq-xray/canonical_current_resolution_overlay.json
      XRAY_SINA_HISTORY_BATCH: "5000"
      XRAY_SINA_RETRY_BATCH: "5000"
      XRAY_SINA_HISTORY_WORKERS: "12"
      XRAY_SINA_MAX_ATTEMPTS: "4"
      XRAY_UNKNOWN_SOURCE: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_state.json
      XRAY_UNKNOWN_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_unknowns.json
      XRAY_UNKNOWN_MANIFEST: ${{ github.workspace }}/nasdaq-xray/canonical_current_unknowns.json
      XRAY_RESOLUTION_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_resolution_overlay.json
      XRAY_MASTER_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_state.json
      XRAY_MASTER_MANIFEST: ${{ github.workspace }}/nasdaq-xray/canonical_current_master_manifest.json
      XRAY_FULLSTATE_INPUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_state.json
      XRAY_PRICE_DV20_RECOVER_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_price_dv20.json
      XRAY_PHASE_WORKERS: "12"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Compile factory
        run: |
          python -m py_compile \
            nasdaq-xray/sina_stage.py \
            nasdaq-xray/resolve_unknowns_fallback.py \
            nasdaq-xray/extract_unknown_manifest.py \
            nasdaq-xray/build_current_master_manifest.py \
            nasdaq-xray/price_dv20_phase.py \
            nasdaq-xray/price_dv20_recover_from_fullstate.py \
            nasdaq-xray/build_current_resolver_request.py \
            nasdaq-xray/recover_pre_mc_snapshot.py
      - name: Install zero-dollar runtime
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt
      - name: Completed-session epoch rollover guard
        id: rollover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          import pandas_market_calendars as mcal

          ptr=json.load(open("nasdaq-xray/chatgpt_canonical_state_v2.json"))
          ps=ptr.get("state_json") or {}
          if isinstance(ps,str): ps=json.loads(ps)
          term=json.load(open("nasdaq-xray/canonical_current_terminal.json"))
          pointer_asof=str(ps.get("asof_et") or "")
          terminal_asof=str(term.get("asof_et") or "")
          phase=((ps.get("work_cursor") or {}).get("PHASE") or "")
          now=datetime.now(timezone.utc)
          cal=mcal.get_calendar("NASDAQ")
          sched=cal.schedule(
              start_date=(now.date()-timedelta(days=15)).isoformat(),
              end_date=(now.date()+timedelta(days=1)).isoformat(),
          )
          completed=[]
          for idx,row in sched.iterrows():
              if row["market_close"].to_pydatetime()<=now:
                  completed.append(idx.date().isoformat())
          if not completed:
              raise RuntimeError("NO_COMPLETED_NASDAQ_SESSION")
          latest_completed=completed[-1]
          if pointer_asof and pointer_asof>latest_completed:
              raise RuntimeError(f"POINTER_ASOF_FUTURE:{pointer_asof}>{latest_completed}")

          same_completed_epoch=bool(pointer_asof and latest_completed==pointer_asof)
          # A validated completed-session PRICE/DV20 snapshot is immutable even
          # while the production pointer is still on the prior ASOF waiting for
          # resolver/MC/Post-MC. Pointer lag must never force a same-ASOF rebuild.
          price_ok=False
          price_asof=""
          try:
              px=json.load(open("nasdaq-xray/canonical_current_price_dv20.json"))
              price_asof=str(px.get("asof_et") or "")
          except Exception:
              px={}
              price_asof=""
          current_epoch_artifact_exists=bool(price_asof and price_asof==latest_completed)
          active_completed_epoch=bool(same_completed_epoch or current_epoch_artifact_exists)
          frozen_asof=(pointer_asof if same_completed_epoch else latest_completed if current_epoch_artifact_exists else "")
          try:
              price_ok=(
                  bool(frozen_asof) and px.get("asof_et")==frozen_asof
                  and px.get("execution")=="NONE" and px.get("real_money")=="NO-GO"
                  and int(px.get("unknown_count",-1))==0
                  and int(px.get("pass_count",0))>0
              )
          except Exception:
              price_ok=False
          recover=bool(active_completed_epoch and not price_ok)
          blocked_count=0
          block_recovery_attempted=False
          try:
              px=json.load(open("nasdaq-xray/canonical_current_price_dv20.json"))
              blocked_count=int(px.get("blocked_count",(px.get("counts") or {}).get("BLOCK_CURRENT_RUN",0)) or 0)
              block_recovery_attempted=px.get("block_recovery_attempted") is True
          except Exception:
              pass
          coverage_repair=bool(
              active_completed_epoch and price_ok and blocked_count>0 and not block_recovery_attempted
          )
          resolver_refresh=False
          if active_completed_epoch and price_ok and blocked_count>0 and block_recovery_attempted:
              try:
                  rq=json.load(open("nasdaq-xray/canonical_current_resolver_request.json"))
                  resolver_refresh=set(rq.get("price_blocked_symbols") or [])!=set(px.get("blocked_symbols") or [])
              except Exception:
                  resolver_refresh=True
          bridge_refresh=False
          if active_completed_epoch and price_ok and blocked_count>0:
              try:
                  import glob
                  blocked=set(px.get("blocked_symbols") or [])
                  qh=px.get("source_master_queue_hash")
                  for fp in glob.glob("nasdaq-xray/canonical_resolver_bridge_*.json"):
                      try:
                          b=json.load(open(fp))
                          if (
                              b.get("schema")=="XRAY_RESOLVER_EPOCH_RESULT_V1"
                              and b.get("status")=="COMMITTED"
                              and b.get("asof_et")==frozen_asof
                              and b.get("queue_hash")==qh
                              and b.get("compiled_policy_version")=="C4.17"
                              and b.get("compiled_policy_hash")=="26a95745a50b65e85f6ece24b6501af0994764a84ddd886edb70d1fcd770849c"
                              and blocked & set((b.get("terminal_overrides") or {}).keys())
                          ):
                              bridge_refresh=True
                              break
                      except Exception:
                          pass
              except Exception:
                  bridge_refresh=False
          build=not active_completed_epoch
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"build={'true' if build else 'false'}\n")
              out.write(f"recover={'true' if recover else 'false'}\n")
              out.write(f"coverage_repair={'true' if coverage_repair else 'false'}\n")
              out.write(f"resolver_refresh={'true' if resolver_refresh else 'false'}\n")
              out.write(f"bridge_refresh={'true' if bridge_refresh else 'false'}\n")
              out.write(f"latest_completed={latest_completed}\n")
              out.write(f"pointer_asof={pointer_asof}\n")
              out.write(f"recovery_asof={frozen_asof}\n")
          print({
              "build":build,
              "recover":recover,
              "coverage_repair":coverage_repair,
              "resolver_refresh":resolver_refresh,
              "bridge_refresh":bridge_refresh,
              "price_ok":price_ok,
              "blocked_count":blocked_count,
              "block_recovery_attempted":block_recovery_attempted,
              "latest_completed":latest_completed,
              "pointer_asof":pointer_asof,
              "price_asof":price_asof,
              "frozen_asof":frozen_asof,
              "current_epoch_artifact_exists":current_epoch_artifact_exists,
              "active_completed_epoch":active_completed_epoch,
              "terminal_asof":terminal_asof,
              "phase":phase,
              "reason":(
                  "RECOVER_FROZEN_COMPLETED_EPOCH" if recover else
                  "REPAIR_BLOCKED_PRICE_DV20_COVERAGE" if coverage_repair else
                  "REFRESH_BLOCKED_RESOLVER_REQUEST" if resolver_refresh else
                  "APPLY_TERMINAL_OVERRIDE_BRIDGE" if bridge_refresh else
                  "FREEZE_COMPLETED_EPOCH_UNTIL_NEXT_RTH_CLOSE" if active_completed_epoch else
                  "NEW_COMPLETED_EPOCH"
              ),
          })
          PY
      - name: Recover corrupted frozen pre-MC snapshot
        if: steps.rollover.outputs.recover == 'true'
        env:
          XRAY_RECOVERY_ASOF: ${{ steps.rollover.outputs.recovery_asof }}
        run: python nasdaq-xray/recover_pre_mc_snapshot.py

      - name: Frozen completed epoch healthy no-op
        if: steps.rollover.outputs.build != 'true' && steps.rollover.outputs.recover != 'true' && steps.rollover.outputs.coverage_repair != 'true' && steps.rollover.outputs.resolver_refresh != 'true' && steps.rollover.outputs.bridge_refresh != 'true'
        run: echo "XRAY_PRE_MC=HEALTHY_NOOP_COMPLETED_EPOCH pointer_asof=${{ steps.rollover.outputs.pointer_asof }} latest_completed=${{ steps.rollover.outputs.latest_completed }}"
      - name: Build identity-only full universe
        if: steps.rollover.outputs.build == 'true'
        timeout-minutes: 8
        run: python nasdaq-xray/sina_stage.py
      - name: Extract unresolved set
        if: steps.rollover.outputs.build == 'true'
        run: python nasdaq-xray/extract_unknown_manifest.py
      - name: Prepare identity-only no-op overlay
        if: steps.rollover.outputs.build == 'true'
        run: |
          python - <<'PY'
          import json,pathlib
          from datetime import datetime,timezone
          root=pathlib.Path("nasdaq-xray")
          s=json.load(open(root/"canonical_current_full_state.json"))
          obj={
            "schema":"XRAY_HISTORY_IDENTITY_RESOLUTION_OVERLAY_V1",
            "task_id":"6a825366222081918997094d76e6ae46",
            "execution":"NONE","real_money":"NO-GO",
            "base_asof_et":s["asof_et"],
            "resolver":"IDENTITY_ONLY_NOOP_MARKET_GATES_DEFERRED",
            "generated_at_utc":datetime.now(timezone.utc).isoformat(),
            "max_age_hours":24,
            "manifest_unknown_count":0,
            "current_resolution_count":0,
            "current_unresolved_count":0,
            "resolution_count":0,
            "unresolved_count":0,
            "resolutions":{},"unresolved":{},
          }
          (root/"canonical_current_resolution_overlay.json").write_text(json.dumps(obj,sort_keys=True,indent=2)+"\n")
          PY
      - name: Build current master manifest
        if: steps.rollover.outputs.build == 'true'
        run: python nasdaq-xray/build_current_master_manifest.py
      - name: Build policy-ordered PRICE-DV20
        if: steps.rollover.outputs.build == 'true' || steps.rollover.outputs.coverage_repair == 'true' || steps.rollover.outputs.bridge_refresh == 'true'
        run: python nasdaq-xray/price_dv20_recover_from_fullstate.py
      - name: Build resolver bridge request
        if: steps.rollover.outputs.build == 'true' || steps.rollover.outputs.coverage_repair == 'true' || steps.rollover.outputs.resolver_refresh == 'true' || steps.rollover.outputs.bridge_refresh == 'true'
        run: python nasdaq-xray/build_current_resolver_request.py
      - name: Structural gate
        if: steps.rollover.outputs.build == 'true' || steps.rollover.outputs.coverage_repair == 'true' || steps.rollover.outputs.resolver_refresh == 'true' || steps.rollover.outputs.bridge_refresh == 'true'
        run: |
          python - <<'PY'
          import json
          m=json.load(open("nasdaq-xray/canonical_current_master_manifest.json"))
          p=json.load(open("nasdaq-xray/canonical_current_price_dv20.json"))
          q=json.load(open("nasdaq-xray/canonical_current_resolver_request.json"))
          cm=json.load(open("nasdaq-xray/canonical_current_resolver_chunk_manifest.json"))
          assert m["task_id"]==p["task_id"]==q["task_id"]=="6a825366222081918997094d76e6ae46"
          assert m["phase"]=="MASTER_IDENTITY" and m["status"]=="HISTORY_COMPLETE"
          assert m["unknown_count"]==0 and m["pass_count"]==m["queue_total"]
          assert m["asof_et"]==p["asof_et"]==q["asof_et"]
          assert q["compiled_policy_path"]=="nasdaq-xray/chatgpt_compiled_policy_v3.json"
          assert q["compiled_policy_blob_sha"]=="10d7af14870dfac0dc4566595d95a06f3faa854d"
          assert q["compiled_policy_hash"]=="26a95745a50b65e85f6ece24b6501af0994764a84ddd886edb70d1fcd770849c"
          assert q["compiled_policy_version"]=="C4.17"
          assert cm["schema"]=="XRAY_RESOLVER_REQUEST_CHUNK_MANIFEST_V1"
          assert cm["task_id"]==q["task_id"] and cm["asof_et"]==q["asof_et"]
          assert cm["execution"]=="NONE" and cm["real_money"]=="NO-GO" and cm["unknown_never_pass"] is True
          assert cm["compiled_policy_blob_sha"]==q["compiled_policy_blob_sha"] and cm["compiled_policy_hash"]==q["compiled_policy_hash"] and cm["compiled_policy_version"]==q["compiled_policy_version"]
          assert cm["queue_hash"]==q["queue_hash"] and cm["symbol_hash"]==q["symbol_hash"] and cm["symbol_count"]==q["symbol_count"]
          assert cm["coverage_complete"] is True and cm["chunk_size"]<=100
          assert cm["chunk_count"]==len(cm["chunks"])
          import hashlib,pathlib
          rb=pathlib.Path("nasdaq-xray/canonical_current_resolver_request.json").read_bytes()
          rsha=hashlib.sha1(b"blob "+str(len(rb)).encode()+b"\0"+rb).hexdigest()
          assert cm["request_blob_sha"]==rsha
          rebuilt=[]
          for i,row in enumerate(cm["chunks"],1):
              cp=pathlib.Path(row["path"]); cb=cp.read_bytes(); csha=hashlib.sha1(b"blob "+str(len(cb)).encode()+b"\0"+cb).hexdigest()
              cj=json.loads(cb)
              assert row["chunk_index"]==i and row["blob_sha"]==csha
              assert cj["request_blob_sha"]==rsha and cj["queue_hash"]==q["queue_hash"] and cj["symbol_hash"]==q["symbol_hash"]
              assert cj["chunk_index"]==i and cj["chunk_total"]==cm["chunk_count"] and cj["symbol_count"]==len(cj["symbols"])<=100
              assert row["symbol_count"]==cj["symbol_count"] and row["chunk_symbol_hash"]==cj["chunk_symbol_hash"]
              rebuilt.extend(cj["symbols"])
          assert rebuilt==q["symbols"] and len(rebuilt)==len(set(rebuilt))==q["symbol_count"]
          assert q["queue_hash"]==m["queue_hash"] and q["queue_total"]==m["queue_total"]
          assert q["symbol_count"]==len(q["symbols"])==len(set(q["symbols"]))
          assert q["master_unknown_count"]==len(q["master_unknown_symbols"])==0
          assert q["price_unknown_count"]==len(q["price_unknown_symbols"])
          assert q.get("price_blocked_count",0)==len(q.get("price_blocked_symbols") or [])
          assert set(q["symbols"])==set(q["master_unknown_symbols"])|set(q["price_unknown_symbols"])|set(q.get("price_blocked_symbols") or [])
          if q["settlement_required"]:
              assert q["pointer_asof_et"] < q["asof_et"]
              assert len(q["settlement_symbols"])==3 and len(set(q["settlement_symbols"]))==3
              assert {"AAPL","NVDA"}<=set(q["settlement_symbols"])
              assert q["settlement_core_symbol"] not in {"AAPL","NVDA"}
              assert q["settlement_core_source_path"] and q["settlement_core_source_blob_sha"]
          assert p["source_master_queue_hash"]==m["queue_hash"]
          assert p["source_master_count"]==m["queue_total"]
          assert len(p["results"])==m["queue_total"]
          assert sum(p["counts"].values())==m["queue_total"]
          assert p["pass_count"]==len(p["pass_symbols"])==len(set(p["pass_symbols"]))
          print({"asof":m["asof_et"],"master_status":m["status"],"master_unknown":m["unknown_count"],"price_dv20_unknown":p["unknown_count"],"price_dv20_blocked":p.get("blocked_count",(p.get("counts") or {}).get("BLOCK_CURRENT_RUN",0)),"price_dv20_pass":p["pass_count"],"resolver_request_status":q["status"],"settlement_required":q["settlement_required"]})
          PY
      - name: Commit current pre-MC artifacts
        if: steps.rollover.outputs.build == 'true' || steps.rollover.outputs.coverage_repair == 'true' || steps.rollover.outputs.resolver_refresh == 'true' || steps.rollover.outputs.bridge_refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          files=(
            nasdaq-xray/canonical_current_full_state.json
            nasdaq-xray/canonical_current_full_candidates.json
            nasdaq-xray/canonical_current_unknowns.json
            nasdaq-xray/canonical_current_resolution_overlay.json
            nasdaq-xray/canonical_current_master_manifest.json
            nasdaq-xray/canonical_current_price_dv20.json
            nasdaq-xray/canonical_current_resolver_request.json
            nasdaq-xray/canonical_current_resolver_chunk_manifest.json
          )
          while IFS= read -r p; do files+=("$p"); done < <(find nasdaq-xray -maxdepth 1 -type f -name "canonical_current_resolver_chunk_[0-9][0-9][0-9][0-9].json" | sort)
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for p in "${files[@]}"; do
            if [ -f "$p" ]; then
              mkdir -p "$tmpdir/$(dirname "$p")"
              cp "$p" "$tmpdir/$p"
            fi
          done
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git reset --hard origin/main
            rm -f nasdaq-xray/canonical_current_resolver_chunk_[0-9][0-9][0-9][0-9].json
            for p in "${files[@]}"; do
              if [ -f "$tmpdir/$p" ]; then
                mkdir -p "$(dirname "$p")"
                cp "$tmpdir/$p" "$p"
              fi
            done
            git add -A -- "${files[@]}" 'nasdaq-xray/canonical_current_resolver_chunk_*.json' 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "XRAY_FACTORY_COMMIT=NO_CHANGE"
              exit 0
            fi
            git commit -m "chore(xray): current epoch pre-MC factory [skip ci]"
            if git push origin HEAD:main; then
              echo "XRAY_FACTORY_COMMIT=PASS"
              exit 0
            fi
            echo "XRAY_FACTORY_PUSH_RACE attempt=$attempt"
            sleep $((attempt*2))
          done
          echo "XRAY_FACTORY_COMMIT=FAIL" >&2
          exit 1
# XRAY_CONTROL_KICK_20261003_PREMC_NO_SEMANTIC_CHANGE
