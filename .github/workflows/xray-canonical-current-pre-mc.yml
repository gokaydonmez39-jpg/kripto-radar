                  prior=json.load(open(prior_path))
                  reuse=current_price_baseline_valid(prior,full,full.get("asof_et"),queue)
                  reason="EXACT_SAME_ASOF_QUEUE_POLICY_BASELINE" if reuse else "BASELINE_BINDING_CHANGED"
