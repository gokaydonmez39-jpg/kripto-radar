      - name: Gate downstream PRICE/resolver work on exact identity manifest
        id: identity_gate
        if: steps.rollover.outputs.build == 'true' || steps.rollover.outputs.policy_replay == 'true' || steps.rollover.outputs.coverage_repair == 'true' || steps.rollover.outputs.resolver_refresh == 'true' || steps.rollover.outputs.bridge_refresh == 'true' || steps.rollover.outputs.publication_replay == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os

          def ready(m):
              try:
                  unknown=int(m.get("unknown_count",-1))
                  queue_total=int(m.get("queue_total",-1))
                  pass_count=int(m.get("pass_count",-1))
                  raw_total=int(m.get("raw_identity_total",-1))
                  status=m.get("status")
                  passes=list(m.get("pass_symbols") or [])
                  unknowns=list(m.get("unknown_symbols") or [])
                  return bool(
                      m.get("phase")=="MASTER_IDENTITY"
                      and status in {"HISTORY_COMPLETE","PARTIAL_UNKNOWN"}
                      and ((status=="HISTORY_COMPLETE") == (unknown==0))
                      and queue_total>0
                      and pass_count==queue_total
                      and raw_total==queue_total+unknown
                      and len(passes)==len(set(passes))==queue_total
                      and len(unknowns)==len(set(unknowns))==unknown
                      and not (set(passes)&set(unknowns))
                  )
              except Exception:
                  return False

          good={
            "phase":"MASTER_IDENTITY","status":"PARTIAL_UNKNOWN",
            "queue_total":2,"pass_count":2,"raw_identity_total":3,
            "unknown_count":1,"pass_symbols":["AAA","BBB"],"unknown_symbols":["CCC"],
          }
          bad=dict(good); bad["status"]="PARTIAL"; bad["pass_count"]=0
          assert ready(good) is True
          assert ready(bad) is False

          m=json.load(open("nasdaq-xray/canonical_current_master_manifest.json"))
          ok=ready(m)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"ready={'true' if ok else 'false'}\n")
              out.write(f"status={m.get('status')}\n")
              out.write(f"queue_total={m.get('queue_total')}\n")
              out.write(f"unknown_count={m.get('unknown_count')}\n")
          print({
            "XRAY_IDENTITY_TO_PRICE_GATE":"READY" if ok else "PENDING_FAIL_CLOSED",
            "status":m.get("status"),
            "status_semantics":m.get("status_semantics"),
            "queue_total":m.get("queue_total"),
            "identity_pass":m.get("pass_count"),
            "identity_unknown":m.get("unknown_count"),
          })
          PY
