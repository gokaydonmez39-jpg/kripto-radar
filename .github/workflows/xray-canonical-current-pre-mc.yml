          assert q.get("price_blocked_count",0)==len(q.get("price_blocked_symbols") or [])
          assert set(q["symbols"])==set(q["price_unknown_symbols"])|set(q.get("price_blocked_symbols") or [])
          if q["settlement_required"]:
              assert q["pointer_asof_et"] < q["asof_et"]
              assert len(q["settlement_symbols"])==3 and len(set(q["settlement_symbols"]))==3
              assert {"AAPL","NVDA"}<=set(q["settlement_symbols"])
              assert q["settlement_core_symbol"] not in {"AAPL","NVDA"}
              assert q["settlement_core_source_path"] and q["settlement_core_source_blob_sha"]
          assert p["source_master_queue_hash"]==m["queue_hash"]
          assert p["source_master_count"]==m["queue_total"]
          assert len(p["results"])==m["queue_total"]
          assert sum(p["counts"].values())==m["queue_total"]
          assert p["pass_count"]==len(p["pass_symbols"])==len(set(p["pass_symbols"]))
          print({"asof":m["asof_et"],"master_status":m["status"],"master_unknown":m["unknown_count"],"price_dv30_unknown":p["unknown_count"],"price_dv30_blocked":p.get("blocked_count",(p.get("counts") or {}).get("BLOCK_CURRENT_RUN",0)),"price_dv30_pass":p["pass_count"],"resolver_request_status":q["status"],"settlement_required":q["settlement_required"]})
          PY
      - name: Build exact current full-scope resolver handoff
        id: full_scope
        if: steps.identity_gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python nasdaq-xray/build_resolver_full_scope_handoff.py --selftest
          build="$(python - <<'PY'
          import json
          p=json.load(open("nasdaq-xray/canonical_current_price_dv30.json"))
          q=json.load(open("nasdaq-xray/canonical_current_resolver_request.json"))
          ready=(
              int(p.get("unknown_count",-1))==0
              and len(p.get("unknown_symbols") or [])==0
              and int(p.get("blocked_count",-1))==0
              and len(p.get("blocked_symbols") or [])==0
              and q.get("status")=="IDLE"
              and int(q.get("symbol_count",-1))==0
              and len(q.get("symbols") or [])==0
              and int(q.get("price_unknown_count",-1))==0
              and int(q.get("price_blocked_count",-1))==0
              and q.get("settlement_required") is False
          )
          print("true" if ready else "false")
          PY
          )"
          if [[ "$build" != "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "reason=PRICE_OR_RESIDUAL_NOT_TERMINAL" >> "$GITHUB_OUTPUT"
            echo "XRAY_FULL_SCOPE_HANDOFF=NOT_APPLICABLE"
            exit 0
          fi
          python nasdaq-xray/build_resolver_full_scope_handoff.py | tee /tmp/xray_full_scope_out
          while IFS= read -r line; do
            case "$line" in
              ready=*|created=*|path=*|generated_blob_sha=*|predecessor_path=*|predecessor_blob_sha=*|residual_authority_path=*|residual_authority_blob_sha=*|settlement_witness_path=*|settlement_witness_blob_sha=*|settlement_witness_relation=*|price_blob_sha=*|pass_count=*|queue_total=*|reason=*)
                echo "$line" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < /tmp/xray_full_scope_out

      - name: Commit current pre-MC artifacts
        if: steps.identity_gate.outputs.ready == 'true' && (steps.rollover.outputs.build == 'true' || steps.rollover.outputs.policy_replay == 'true' || steps.rollover.outputs.coverage_repair == 'true' || steps.rollover.outputs.resolver_refresh == 'true' || steps.rollover.outputs.bridge_refresh == 'true' || steps.rollover.outputs.publication_replay == 'true' || steps.full_scope.outputs.created == 'true')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          files=(
            nasdaq-xray/canonical_current_full_state.json
            nasdaq-xray/canonical_current_full_candidates.json
            nasdaq-xray/canonical_current_unknowns.json
            nasdaq-xray/canonical_current_resolution_overlay.json
            nasdaq-xray/canonical_current_master_manifest.json
            nasdaq-xray/canonical_current_price_dv30.json
            nasdaq-xray/canonical_current_resolver_request.json
            nasdaq-xray/canonical_current_resolver_chunk_manifest.json
          )
          while IFS= read -r p; do files+=("$p"); done < <(find nasdaq-xray -maxdepth 1 -type f -name "canonical_current_resolver_chunk_[0-9][0-9][0-9][0-9].json" | sort)
          while IFS= read -r p; do files+=("$p"); done < <(find nasdaq-xray -maxdepth 1 -type f \( -name "master_asof_identity_proof_*.json" -o -name "master_sec_spac_proof_*.json" \) | sort)
          new_resolver_bridges=()
          while IFS= read -r p; do
            if ! git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              files+=("$p")
              new_resolver_bridges+=("$p")
            fi
          done < <(find nasdaq-xray -maxdepth 1 -type f -name "canonical_resolver_bridge_*.json" | sort)
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for p in "${files[@]}"; do
            if [ -f "$p" ]; then
              mkdir -p "$tmpdir/$(dirname "$p")"
              cp "$p" "$tmpdir/$p"
            fi
          done
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git reset --hard origin/main
            rm -f nasdaq-xray/canonical_current_resolver_chunk_[0-9][0-9][0-9][0-9].json
            for p in "${new_resolver_bridges[@]}"; do
              if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
                if [[ -f "$tmpdir/$p" ]] && cmp -s "$tmpdir/$p" "$p"; then
                  echo "RESOLVER_SUCCESSOR_ALREADY_PRESENT_IDENTICAL path=$p"
                else
                  echo "RESOLVER_SUCCESSOR_COLLISION_REFETCH_REBUILD_REQUIRED path=$p" >&2
                  exit 1
                fi
              fi
            done
            for p in "${files[@]}"; do
              if [ -f "$tmpdir/$p" ]; then
                mkdir -p "$(dirname "$p")"
                cp "$tmpdir/$p" "$p"
              fi
            done
            git add -A -- "${files[@]}" 'nasdaq-xray/canonical_current_resolver_chunk_*.json' 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "XRAY_FACTORY_COMMIT=NO_CHANGE"
              exit 0
            fi
            git commit -m "chore(xray): current epoch pre-MC factory [skip ci]"
            if git push origin HEAD:main; then
              echo "XRAY_FACTORY_COMMIT=PASS"
              exit 0
            fi
            echo "XRAY_FACTORY_PUSH_RACE attempt=$attempt"
            sleep $((attempt*2))
          done
          echo "XRAY_FACTORY_COMMIT=FAIL" >&2
          exit 1
      # Do not assume workflow_run reaches Post-MC after a delegated root
      # workflow_dispatch. Explicit bounded relay keeps [skip ci] checkpoint
      # commits and GitHub chain-depth suppression from swallowing the handoff.
      - name: Atomically wake Post-MC from exact current Pre-MC sources
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python nasdaq-xray/github_native_stage_relay.py --selftest
          python nasdaq-xray/github_native_stage_relay.py --target post-mc --out /tmp/xray_postmc_relay.json
      - name: Store Pre-MC to Post-MC dispatch operational witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-premc-to-postmc-relay
          path: /tmp/xray_postmc_relay.json
          retention-days: 7
          if-no-files-found: warn

# XRAY_CONTROL_KICK_20261003_PREMC_NO_SEMANTIC_CHANGE
