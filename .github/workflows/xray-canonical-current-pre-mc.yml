name: XRAY Canonical Current Pre-MC Factory
# MANUAL_IDENTITY_V4_REPLAY_TRIGGER_20261007_V1
# MANUAL_RECENT_LISTING_UNKNOWN_REPLAY_TRIGGER_20261007_V2
# XRAY_SCHEDULE_REGISTRATION_REFRESH=20261002

on:
  # Upstream uses immutable-main double-read and explicit workflow_dispatch.
  # Schedule remains an independent fallback; avoid duplicate workflow_run jobs.
  schedule:
    - cron: "35 * * * 1-5"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/master_sec_spac_proof_*.json"
      - "nasdaq-xray/master_sec_identity_manual_seed_registry.json"
      - "nasdaq-xray/master_asof_identity_proof_*.json"
      - "nasdaq-xray/master_nasdaq_directory_snapshot_*.json"
      - "nasdaq-xray/build_current_identity_proofs.py"
      - "nasdaq-xray/master_spac_operating_guard.py"
      - "nasdaq-xray/current_identity_proof_selftest.py"
      - "nasdaq-xray/resolve_unknowns_fallback.py"
      - "nasdaq-xray/extract_unknown_manifest.py"
      - "nasdaq-xray/build_current_master_manifest.py"
      - "nasdaq-xray/price_dv30_phase.py"
      - "nasdaq-xray/price_dv30_recover_from_fullstate.py"
      - "nasdaq-xray/historical_halt_fail_only.py"
      - "nasdaq-xray/evidence/nasdaq_gral_20260923_full_session_halt_v1.json"
      - "nasdaq-xray/price_dv30_authority_selftest.py"
      - "nasdaq-xray/evidence/rallies_dv30_*_classification.json"
      - "nasdaq-xray/evidence/rallies_dv30_*_rollforward_*.json"
      - "nasdaq-xray/price_official_listing_registry.json"
      - "nasdaq-xray/price_official_listing_selftest.py"
      - "nasdaq-xray/price_official_halt_selftest.py"
      - "nasdaq-xray/official_source_guard.py"
      - "nasdaq-xray/build_current_resolver_request.py"
      - "nasdaq-xray/sip_settlement_witness_guard.py"
      - "nasdaq-xray/build_resolver_full_scope_handoff.py"
      - "nasdaq-xray/recover_pre_mc_snapshot.py"
      - "nasdaq-xray/pre_mc_identity_replay_session_guard.py"
      - "nasdaq-xray/github_native_stage_relay.py"
      - "nasdaq-xray/canonical_resolver_bridge_*.json"
      - "nasdaq-xray/chatgpt_compiled_policy_v3.json"
      - ".github/workflows/xray-canonical-current-pre-mc.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # New root dispatch/push during a long identity/price refresh must NOT
  # terminate its in-flight exact-ASOF rebuild. At most one successor queues;
  # commit-stage source SHA checks remain fail-closed.
  group: xray-canonical-current-pre-mc
  cancel-in-progress: false

jobs:
  pre-mc:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      XRAY_FULL_IDENTITY: "1"
      XRAY_IDENTITY_ONLY: "1"
      XRAY_DYNAMIC_AUTHENTICATED_PRICE_BRIDGE: "1"
      XRAY_SINA_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_state.json
      XRAY_SINA_CAND: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_candidates.json
      XRAY_HISTORY_RESOLUTION_OVERLAY: ${{ github.workspace }}/nasdaq-xray/canonical_current_resolution_overlay.json
      XRAY_SINA_HISTORY_BATCH: "5000"
      XRAY_SINA_RETRY_BATCH: "5000"
      XRAY_SINA_HISTORY_WORKERS: "12"
      XRAY_SINA_MAX_ATTEMPTS: "4"
      XRAY_UNKNOWN_SOURCE: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_state.json
      XRAY_UNKNOWN_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_unknowns.json
      XRAY_UNKNOWN_MANIFEST: ${{ github.workspace }}/nasdaq-xray/canonical_current_unknowns.json
      XRAY_RESOLUTION_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_resolution_overlay.json
      XRAY_MASTER_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_state.json
      XRAY_MASTER_MANIFEST: ${{ github.workspace }}/nasdaq-xray/canonical_current_master_manifest.json
      XRAY_FULLSTATE_INPUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_state.json
      XRAY_PRICE_DV30_RECOVER_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_price_dv30.json
      XRAY_PHASE_WORKERS: "12"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Enforce immutable resolver authority artifacts
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$before"
          bad=0
          while read -r status path rest; do
            [[ -z "${status:-}" ]] && continue
            case "$status" in
              A*) ;;
              *)
                echo "RESOLVER_AUTHORITY_ARTIFACT_MUTATION_FORBIDDEN_USE_SUCCESSOR status=$status path=$path" >&2
                bad=1
                ;;
            esac
          done < <(git diff --name-status "$before" "$after" -- 'nasdaq-xray/canonical_resolver_bridge_*.json')
          [[ "$bad" -eq 0 ]]
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Compile factory
        run: |
          python -m py_compile \
            nasdaq-xray/build_current_identity_proofs.py \
            nasdaq-xray/current_identity_proof_selftest.py \
            nasdaq-xray/sina_stage.py \
            nasdaq-xray/resolve_unknowns_fallback.py \
            nasdaq-xray/extract_unknown_manifest.py \
            nasdaq-xray/build_current_master_manifest.py \
            nasdaq-xray/price_dv30_phase.py \
            nasdaq-xray/price_dv30_recover_from_fullstate.py \
            nasdaq-xray/price_dv30_authority_selftest.py \
            nasdaq-xray/price_official_listing_selftest.py \
            nasdaq-xray/price_official_halt_selftest.py \
            nasdaq-xray/official_source_guard.py \
            nasdaq-xray/build_current_resolver_request.py \
            nasdaq-xray/build_resolver_full_scope_handoff.py \
            nasdaq-xray/recover_pre_mc_snapshot.py
      - name: Verify historical SIP settlement source evidence and mutation guards
        run: |
          python -m py_compile nasdaq-xray/sip_settlement_witness_guard.py
          python nasdaq-xray/sip_settlement_witness_guard.py --selftest
          python nasdaq-xray/sip_settlement_witness_guard.py --check-current
      - name: Install zero-dollar runtime
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt
      - name: Identity proof regression self-test
        run: |
          cd nasdaq-xray
          python current_identity_proof_selftest.py
      - name: PRICE C4.17 Rallies-primary exact30 authority self-test
        run: |
          cd nasdaq-xray
          python price_dv30_authority_selftest.py
      - name: PRICE official full-session halt self-test
        run: |
          cd nasdaq-xray
          python price_official_halt_selftest.py
      - name: PRICE official recent-listing exact30 self-test
        run: |
          cd nasdaq-xray
          python price_official_listing_selftest.py
      - name: Verify current-directory PIT eligibility regressions
        run: python nasdaq-xray/pre_mc_identity_replay_session_guard.py --selftest
      - name: Completed-session epoch rollover guard
        id: rollover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, sys
          from datetime import datetime, timezone, timedelta
          import pandas_market_calendars as mcal
          sys.path.insert(0,"nasdaq-xray")
          from pre_mc_identity_replay_session_guard import defer_live_identity_replay
          from price_dv30_recover_from_fullstate import (
              price_snapshot_integrity, bridge_refresh_relevant, deferred_bootstrap_artifact,
              publication_lag_artifact, publication_recheck,
              load_official_listing_registry, official_recent_listing_terminal,
              load_c417_rallies_primary, load_persistent_terminal_fail_overrides,
          )

          ptr=json.load(open("nasdaq-xray/chatgpt_canonical_state_v2.json"))
          ps=ptr.get("state_json") or {}
          if isinstance(ps,str): ps=json.loads(ps)
          term=json.load(open("nasdaq-xray/canonical_current_terminal.json"))
          pointer_asof=str(ps.get("asof_et") or "")
          terminal_asof=str(term.get("asof_et") or "")
          phase=((ps.get("work_cursor") or {}).get("PHASE") or "")
          now=datetime.now(timezone.utc)
          cal=mcal.get_calendar("NASDAQ")
          sched=cal.schedule(
              start_date=(now.date()-timedelta(days=15)).isoformat(),
              end_date=(now.date()+timedelta(days=1)).isoformat(),
          )
          completed=[]
          for idx,row in sched.iterrows():
              if row["market_close"].to_pydatetime()<=now:
                  completed.append(idx.date().isoformat())
          if not completed:
              raise RuntimeError("NO_COMPLETED_NASDAQ_SESSION")
          latest_completed=completed[-1]
          if pointer_asof and pointer_asof>latest_completed:
              raise RuntimeError(f"POINTER_ASOF_FUTURE:{pointer_asof}>{latest_completed}")

          same_completed_epoch=bool(pointer_asof and latest_completed==pointer_asof)
          # A validated completed-session PRICE/DV30 snapshot is immutable even
          # while the production pointer is still on the prior ASOF waiting for
          # resolver/MC/Post-MC. Pointer lag must never force a same-ASOF rebuild.
          price_ok=False
          price_integrity_ok=False
          price_semantics_ok=False
          policy_replay=False
          identity_replay=False
          price_asof=""
          try:
              px=json.load(open("nasdaq-xray/canonical_current_price_dv30.json"))
              price_asof=str(px.get("asof_et") or "")
          except Exception:
              px={}
              price_asof=""
          current_epoch_artifact_exists=bool(price_asof and price_asof==latest_completed)
          active_completed_epoch=bool(same_completed_epoch or current_epoch_artifact_exists)
          frozen_asof=(pointer_asof if same_completed_epoch else latest_completed if current_epoch_artifact_exists else "")
          try:
              price_integrity_ok=price_snapshot_integrity(px,frozen_asof)
              price_semantics_ok=(
                  (px.get("thresholds") or {}).get("price")==">=5"
                  and (px.get("thresholds") or {}).get("dv30")==">=50000000 exact30 median"
                  and px.get("gate_order")==["PRICE","DV30"]
              )
              price_ok=bool(price_integrity_ok and price_semantics_ok)
          except Exception:
              price_integrity_ok=False
              price_semantics_ok=False
              price_ok=False
          policy_replay=bool(active_completed_epoch and price_integrity_ok and not price_semantics_ok)
          publication_replay=False
          publication_probe={"status":"NOT_APPLICABLE"}
          if active_completed_epoch and price_ok and publication_lag_artifact(px,latest_completed):
              publication_replay,publication_probe=publication_recheck(
                  latest_completed,list(px.get("expected30") or [])
              )
          rallies_primary_refresh=False
          rallies_primary_refresh_mismatch_count=0
          rallies_primary_status="NOT_APPLICABLE"
          if active_completed_epoch and price_ok:
              try:
                  primary,primary_meta=load_c417_rallies_primary(latest_completed)
                  rallies_primary_status=str((primary_meta or {}).get("status") or "UNKNOWN")
                  if primary is not None:
                      current_results=px.get("results") or {}
                      primary_groups={
                        "FAIL_PRICE":set((primary.get("fail_price") or {}).keys()),
                        "FAIL_DV30":set((primary.get("fail_dv30") or {}).keys()),
                        "PASS_PRICE_DV30":set((primary.get("pass_price_dv30") or {}).keys()),
                        "BLOCK_CURRENT_RUN":set((primary.get("block_current_run") or {}).keys()),
                      }
                      covered=set(current_results) & set().union(*primary_groups.values())
                      block_allowed={
                        "BLOCK_CURRENT_RUN","FAIL_PRICE","FAIL_DV30","FAIL_PRICE_NO_ASOF_BAR",
                        "FAIL_DV30_INSUFFICIENT_SESSIONS","BLOCK_POST_ASOF_LISTING",
                      }
                      mismatches=[]
                      for sym in sorted(covered):
                          got=(current_results.get(sym) or {}).get("status")
                          if sym in primary_groups["PASS_PRICE_DV30"]:
                              bad=(got!="PASS_PRICE_DV30")
                          elif sym in primary_groups["FAIL_PRICE"]:
                              bad=(got!="FAIL_PRICE")
                          elif sym in primary_groups["FAIL_DV30"]:
                              bad=(got!="FAIL_DV30")
                          else:
                              bad=(got not in block_allowed)
                          if bad:
                              mismatches.append(sym)
                      rallies_primary_refresh_mismatch_count=len(mismatches)
                      rallies_primary_refresh=bool(mismatches)
              except Exception as e:
                  rallies_primary_status="ERROR:"+type(e).__name__+":"+str(e)[:120]
                  rallies_primary_refresh=False
          policy_replay=bool(policy_replay or rallies_primary_refresh)

          try:
              mf=json.load(open("nasdaq-xray/canonical_current_master_manifest.json"))
              stamp=latest_completed.replace("-","")
              proof_path=pathlib.Path(f"nasdaq-xray/master_sec_spac_proof_{stamp}.json")
              proof_blob=None
              proof_count=0
              proof_discovery_version=""
              proof_coverage_complete=False
              proof_unresolved_count=-1
              proof_seed_registry_blob=None
              seed_registry_path=pathlib.Path("nasdaq-xray/master_sec_identity_manual_seed_registry.json")
              seed_registry_blob=None
              if seed_registry_path.exists():
                  sb=seed_registry_path.read_bytes()
                  seed_registry_blob=hashlib.sha1(b"blob "+str(len(sb)).encode()+b"\0"+sb).hexdigest()
              if proof_path.exists():
                  proof=json.load(open(proof_path))
                  if proof.get("asof_et")==latest_completed:
                      proof_bytes=proof_path.read_bytes()
                      proof_blob=hashlib.sha1(b"blob "+str(len(proof_bytes)).encode()+b"\0"+proof_bytes).hexdigest()
                      proof_count=len(proof.get("proofs") or {})
                      proof_discovery_version=str(proof.get("discovery_version") or "")
                      pcov=proof.get("discovery_coverage") or {}
                      proof_seed_registry_blob=pcov.get("manual_seed_registry_blob_sha")
                      proof_unresolved_count=int(pcov.get("unresolved_current_suspect_count",-1))
                      proof_coverage_complete=bool(
                          pcov.get("coverage_complete") is True
                          and proof_unresolved_count==0
                          and not (pcov.get("unresolved_current_suspects") or [])
                      )
              asof_path=pathlib.Path(f"nasdaq-xray/master_asof_identity_proof_{stamp}.json")
              asof_proof=json.load(open(asof_path))
              asof_bytes=asof_path.read_bytes()
              asof_blob=hashlib.sha1(b"blob "+str(len(asof_bytes)).encode()+b"\0"+asof_bytes).hexdigest()
              asof_counts={k:len(asof_proof.get(k) or {}) for k in ("restore_to_asof","remove_from_asof","operating_overrides")} if asof_proof.get("asof_et")==latest_completed else {}
              asof_discovery_version=str(asof_proof.get("discovery_version") or "")
              msec=mf.get("sec_spac_proof") or {}
              masof=mf.get("asof_identity_proof") or {}
              mcp=mf.get("completion_proof") or {}
              spac_suspect_unknown=any(
                  (row or {}).get("reason")=="SPAC_NAME_SUSPECT_OFFICIAL_CLASSIFICATION_UNRESOLVED"
                  for row in (mf.get("unknown_detail") or {}).values()
              )
              official_zero_spac_proof_bound=bool(
                  mcp.get("sec_spac_proof_binding") is True
                  and int(msec.get("count",-1))==0
                  and msec.get("path") is None
                  and msec.get("blob_sha") is None
                  and msec.get("symbol_hash")==hashlib.sha256(b"").hexdigest()
              )
              identity_replay=bool(
                  active_completed_epoch
                  and (
                      (spac_suspect_unknown and not proof_path.exists())
                      or proof_discovery_version!="SEC_CURRENT_SUSPECT_DISCOVERY_V9"
                      or proof_seed_registry_blob!=seed_registry_blob
                      or (
                          spac_suspect_unknown
                          and os.getenv("GITHUB_EVENT_NAME") in {"schedule","workflow_dispatch"}
                          and not proof_coverage_complete
                      )
                      or mf.get("identity_ruleset")!="V6_ASOF_IDENTITY_AND_SPAC_PROOF_AT_MASTER"
                      or mf.get("identity_authority")!="NASDAQTRADER_EXPLICIT_TYPE_FILTER_V6_ASOF_IDENTITY_AND_SPAC_PROOF_AT_MASTER"
                      or mf.get("identity_partition_policy")!="MASTER_SPAC_OFFICIAL_BLANK_EXCLUDE_V4_EXACT_ASOF_SNAPSHOT_GUARD"
                      or asof_discovery_version!="SEC_CURRENT_SUSPECT_DISCOVERY_V9"
                      or mcp.get("identity_partition_policy_exact") is not True
                      or mcp.get("identity_unknown_partition_exact") is not True
                      or mcp.get("sec_spac_proof_binding") is not True
                      or mcp.get("asof_identity_proof_binding") is not True
                      or msec.get("blob_sha")!=(proof_blob if proof_count else None)
                      or int(msec.get("count",-1))!=proof_count
                      or masof.get("blob_sha")!=(asof_blob if asof_counts else None)
                      or (masof.get("counts") or {})!=asof_counts
                  )
              )
          except Exception:
              identity_replay=bool(active_completed_epoch)
          # A historical ASOF remains frozen after midnight in New York.
          # Today's Nasdaq live directory is NOT an 8-Oct PIT identity input.
          # Do not repeatedly rebuild a prior completed epoch from the
          # next day's directory, or silently promote unresolved symbols.
          identity_replay_deferred=defer_live_identity_replay(
              now,latest_completed,active_completed_epoch,price_integrity_ok,
              identity_replay)
          if identity_replay_deferred:
              identity_replay=False
          bootstrap_rebuild=bool(
              current_epoch_artifact_exists
              and price_semantics_ok
              and deferred_bootstrap_artifact(px,latest_completed)
          )
          recover=bool(active_completed_epoch and not price_integrity_ok and not bootstrap_rebuild)
          blocked_count=0
          block_recovery_attempted=False
          try:
              px=json.load(open("nasdaq-xray/canonical_current_price_dv30.json"))
              blocked_count=int(px.get("blocked_count",(px.get("counts") or {}).get("BLOCK_CURRENT_RUN",0)) or 0)
              block_recovery_attempted=px.get("block_recovery_attempted") is True
          except Exception:
              pass
          official_listing_fail_only_symbols=[]
          if active_completed_epoch and price_ok:
              try:
                  listing_registry,_listing_meta=load_official_listing_registry()
                  exact30=list(px.get("expected30") or [])
                  unresolved_scope=sorted(
                      set(px.get("unknown_symbols") or []) | set(px.get("blocked_symbols") or [])
                  )
                  for sym in unresolved_scope:
                      if official_recent_listing_terminal(
                          listing_registry,sym,latest_completed,exact30
                      ):
                          official_listing_fail_only_symbols.append(sym)
              except Exception:
                  official_listing_fail_only_symbols=[]
          official_listing_fail_only_replay=bool(official_listing_fail_only_symbols)
          # A new exact-ASOF official historical halt witness is a
          # decision-bearing FAIL, even when a provider retry ran previously.
          historical_halt_fail_only_symbols=[]
          if active_completed_epoch and price_ok:
              try:
                  from historical_halt_fail_only import load_witness, evaluate
                  hw=load_witness(latest_completed)
                  hs=(hw or {}).get("symbol")
                  if hs in set(px.get("blocked_symbols") or []):
                      he=evaluate(hw,hs,latest_completed,list(px.get("expected30") or []),
                                  (px.get("results") or {}).get(hs))
                      if he and he.get("decision_direction")=="FAIL_ONLY_NEVER_PASS":
                          historical_halt_fail_only_symbols=[hs]
              except Exception:
                  historical_halt_fail_only_symbols=[]
          historical_halt_fail_only_replay=bool(historical_halt_fail_only_symbols)
          coverage_repair=bool(
              (active_completed_epoch and price_ok and blocked_count>0 and not block_recovery_attempted)
              or official_listing_fail_only_replay
              or historical_halt_fail_only_replay
          )
          resolver_refresh=False
          if active_completed_epoch and price_ok and block_recovery_attempted:
              try:
                  import glob
                  rq_path=pathlib.Path("nasdaq-xray/canonical_current_resolver_request.json")
                  rq=json.load(open(rq_path))
                  resolver_refresh=(
                    set(rq.get("price_unknown_symbols") or [])!=set(px.get("unknown_symbols") or [])
                    or set(rq.get("price_blocked_symbols") or [])!=set(px.get("blocked_symbols") or [])
                  )
                  # The exact master Git blob is mandatory E2E provenance.
                  # An unchanged PRICE scope does NOT justify a stale resolver
                  # request bound to a prior master manifest revision.
                  mp=pathlib.Path("nasdaq-xray/canonical_current_master_manifest.json")
                  mb=mp.read_bytes()
                  master_sha=hashlib.sha1(b"blob "+str(len(mb)).encode()+b"\0"+mb).hexdigest()
                  if rq.get("source_master_blob_sha")!=master_sha:
                      resolver_refresh=True
                  # A newly committed same-policy resolver witness is a
                  # decision-bearing current-provenance input even when the symbol
                  # scope is unchanged and settlement_required=false (same-ASOF,
                  # block-only residual). Do not freeze a stale
                  # settlement_already_proven=false request.
                  if (
                    not resolver_refresh
                    and rq.get("settlement_already_proven") is not True
                  ):
                      pp=pathlib.Path("nasdaq-xray/canonical_current_price_dv30.json")
                      pb=pp.read_bytes()
                      current_price_blob=hashlib.sha1(b"blob "+str(len(pb)).encode()+b"\0"+pb).hexdigest()
                      rb=rq_path.read_bytes()
                      current_request_blob=hashlib.sha1(b"blob "+str(len(rb)).encode()+b"\0"+rb).hexdigest()
                      rows=[]
                      for fp in glob.glob(f"nasdaq-xray/canonical_resolver_bridge_{latest_completed.replace('-','')}*.json"):
                          try:
                              br=json.load(open(fp))
                              if (
                                br.get("schema")=="XRAY_RESOLVER_EPOCH_RESULT_V1"
                                and br.get("status")=="COMMITTED"
                                and br.get("task_id")=="6a825366222081918997094d76e6ae46"
                                and br.get("execution")=="NONE" and br.get("real_money")=="NO-GO"
                                and br.get("unknown_never_pass") is True
                                and br.get("asof_et")==latest_completed
                                and br.get("queue_hash")==rq.get("queue_hash")
                                and br.get("compiled_policy_hash")==rq.get("compiled_policy_hash")
                                and br.get("compiled_policy_version")==rq.get("compiled_policy_version")
                                and br.get("compiled_policy_blob_sha")==rq.get("compiled_policy_blob_sha")
                                and br.get("settlement_status")=="PASS"
                              ):
                                  rows.append((fp,br))
                          except Exception:
                              pass
                      exact_price=[
                        row for row in rows
                        if row[1].get("source_price_path")=="nasdaq-xray/canonical_current_price_dv30.json"
                        and row[1].get("source_price_blob_sha")==current_price_blob
                      ]
                      if len(exact_price)>1:
                          raise RuntimeError("AMBIGUOUS_CURRENT_POLICY_RESOLVER_BRIDGE_EXACT_PRICE")
                      if exact_price:
                          resolver_refresh=True
                      else:
                          exact_request=[
                            row for row in rows
                            if row[1].get("source_request_path")=="nasdaq-xray/canonical_current_resolver_request.json"
                            and row[1].get("source_request_blob_sha")==current_request_blob
                          ]
                          if len(exact_request)>1:
                              raise RuntimeError("AMBIGUOUS_CURRENT_POLICY_RESOLVER_BRIDGE_EXACT_REQUEST")
                          resolver_refresh=bool(exact_request)
              except Exception:
                  resolver_refresh=True
          bridge_refresh=False
          persistent_terminal_fail_replay=False
          persistent_terminal_fail_symbols=[]
          if active_completed_epoch and price_ok:
              try:
                  import glob,hashlib,pathlib
                  pp=pathlib.Path("nasdaq-xray/canonical_current_price_dv30.json")
                  pb=pp.read_bytes()
                  current_price_blob=hashlib.sha1(b"blob "+str(len(pb)).encode()+b"\0"+pb).hexdigest()
                  for fp in glob.glob("nasdaq-xray/canonical_resolver_bridge_*.json"):
