name: XRAY Canonical Current Pre-MC Factory

on:
  schedule:
    - cron: "35 * * * 1-5"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/sina_stage.py"
      - "nasdaq-xray/resolve_unknowns_fallback.py"
      - "nasdaq-xray/extract_unknown_manifest.py"
      - "nasdaq-xray/build_current_master_manifest.py"
      - "nasdaq-xray/price_dv20_phase.py"
      - "nasdaq-xray/price_dv20_recover_from_fullstate.py"
      - "nasdaq-xray/build_current_resolver_request.py"
      - "nasdaq-xray/canonical_resolver_bridge_*.json"
      - "nasdaq-xray/chatgpt_compiled_policy_v3.json"
      - ".github/workflows/xray-canonical-current-pre-mc.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-canonical-current-pre-mc
  cancel-in-progress: true

jobs:
  pre-mc:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      XRAY_FULL_IDENTITY: "1"
      XRAY_IDENTITY_ONLY: "1"
      XRAY_DYNAMIC_AUTHENTICATED_PRICE_BRIDGE: "1"
      XRAY_SINA_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_state.json
      XRAY_SINA_CAND: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_candidates.json
      XRAY_HISTORY_RESOLUTION_OVERLAY: ${{ github.workspace }}/nasdaq-xray/canonical_current_resolution_overlay.json
      XRAY_SINA_HISTORY_BATCH: "5000"
      XRAY_SINA_RETRY_BATCH: "5000"
      XRAY_SINA_HISTORY_WORKERS: "12"
      XRAY_SINA_MAX_ATTEMPTS: "4"
      XRAY_UNKNOWN_SOURCE: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_state.json
      XRAY_UNKNOWN_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_unknowns.json
      XRAY_UNKNOWN_MANIFEST: ${{ github.workspace }}/nasdaq-xray/canonical_current_unknowns.json
      XRAY_RESOLUTION_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_resolution_overlay.json
      XRAY_MASTER_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_state.json
      XRAY_MASTER_MANIFEST: ${{ github.workspace }}/nasdaq-xray/canonical_current_master_manifest.json
      XRAY_FULLSTATE_INPUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_full_state.json
      XRAY_PRICE_DV20_RECOVER_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_price_dv20.json
      XRAY_PHASE_WORKERS: "12"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Compile factory
        run: |
          python -m py_compile \
            nasdaq-xray/sina_stage.py \
            nasdaq-xray/resolve_unknowns_fallback.py \
            nasdaq-xray/extract_unknown_manifest.py \
            nasdaq-xray/build_current_master_manifest.py \
            nasdaq-xray/price_dv20_phase.py \
            nasdaq-xray/price_dv20_recover_from_fullstate.py \
            nasdaq-xray/build_current_resolver_request.py
      - name: Install zero-dollar runtime
        run: python -m pip install --disable-pip-version-check akshare==1.18.95 pandas_market_calendars
      - name: Completed-session epoch rollover guard
        id: rollover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          import pandas_market_calendars as mcal

          ptr=json.load(open("nasdaq-xray/chatgpt_canonical_state_v2.json"))
          ps=ptr.get("state_json") or {}
          if isinstance(ps,str): ps=json.loads(ps)
          term=json.load(open("nasdaq-xray/canonical_current_terminal.json"))
          pointer_asof=str(ps.get("asof_et") or "")
          terminal_asof=str(term.get("asof_et") or "")
          phase=((ps.get("work_cursor") or {}).get("PHASE") or "")
          now=datetime.now(timezone.utc)
          cal=mcal.get_calendar("NASDAQ")
          sched=cal.schedule(
              start_date=(now.date()-timedelta(days=15)).isoformat(),
              end_date=(now.date()+timedelta(days=1)).isoformat(),
          )
          completed=[]
          for idx,row in sched.iterrows():
              if row["market_close"].to_pydatetime()<=now:
                  completed.append(idx.date().isoformat())
          if not completed:
              raise RuntimeError("NO_COMPLETED_NASDAQ_SESSION")
          latest_completed=completed[-1]
          if pointer_asof and pointer_asof>latest_completed:
              raise RuntimeError(f"POINTER_ASOF_FUTURE:{pointer_asof}>{latest_completed}")

          frozen=(
              phase=="TERMINAL"
              and pointer_asof
              and terminal_asof==pointer_asof
              and term.get("full_end_to_end_research_pass") is True
              and term.get("status")=="FULL_E2E_RESEARCH_PASS"
              and latest_completed==pointer_asof
          )
          build=not frozen
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"build={'true' if build else 'false'}\n")
              out.write(f"latest_completed={latest_completed}\n")
              out.write(f"pointer_asof={pointer_asof}\n")
          print({
              "build":build,
              "latest_completed":latest_completed,
              "pointer_asof":pointer_asof,
              "terminal_asof":terminal_asof,
              "phase":phase,
              "reason":"FREEZE_COMPLETED_TERMINAL_EPOCH_UNTIL_NEXT_RTH_CLOSE" if frozen else "NEW_OR_INCOMPLETE_EPOCH",
          })
          PY
      - name: Frozen completed epoch healthy no-op
        if: steps.rollover.outputs.build != 'true'
        run: echo "XRAY_PRE_MC=HEALTHY_NOOP_COMPLETED_EPOCH pointer_asof=${{ steps.rollover.outputs.pointer_asof }} latest_completed=${{ steps.rollover.outputs.latest_completed }}"
      - name: Build identity-only full universe
        if: steps.rollover.outputs.build == 'true'
        timeout-minutes: 8
        run: python nasdaq-xray/sina_stage.py
      - name: Extract unresolved set
        if: steps.rollover.outputs.build == 'true'
        run: python nasdaq-xray/extract_unknown_manifest.py
      - name: Prepare identity-only no-op overlay
        if: steps.rollover.outputs.build == 'true'
        run: |
          python - <<'PY'
          import json,pathlib
          from datetime import datetime,timezone
          root=pathlib.Path("nasdaq-xray")
          s=json.load(open(root/"canonical_current_full_state.json"))
          obj={
            "schema":"XRAY_HISTORY_IDENTITY_RESOLUTION_OVERLAY_V1",
            "task_id":"6a825366222081918997094d76e6ae46",
            "execution":"NONE","real_money":"NO-GO",
            "base_asof_et":s["asof_et"],
            "resolver":"IDENTITY_ONLY_NOOP_MARKET_GATES_DEFERRED",
            "generated_at_utc":datetime.now(timezone.utc).isoformat(),
            "max_age_hours":24,
            "manifest_unknown_count":0,
            "current_resolution_count":0,
            "current_unresolved_count":0,
            "resolution_count":0,
            "unresolved_count":0,
            "resolutions":{},"unresolved":{},
          }
          (root/"canonical_current_resolution_overlay.json").write_text(json.dumps(obj,sort_keys=True,indent=2)+"\n")
          PY
      - name: Build current master manifest
        if: steps.rollover.outputs.build == 'true'
        run: python nasdaq-xray/build_current_master_manifest.py
      - name: Build policy-ordered PRICE-DV20
        if: steps.rollover.outputs.build == 'true'
        run: python nasdaq-xray/price_dv20_recover_from_fullstate.py
      - name: Build resolver bridge request
        if: steps.rollover.outputs.build == 'true'
        run: python nasdaq-xray/build_current_resolver_request.py
      - name: Structural gate
        if: steps.rollover.outputs.build == 'true'
        run: |
          python - <<'PY'
          import json
          m=json.load(open("nasdaq-xray/canonical_current_master_manifest.json"))
          p=json.load(open("nasdaq-xray/canonical_current_price_dv20.json"))
          q=json.load(open("nasdaq-xray/canonical_current_resolver_request.json"))
          assert m["task_id"]==p["task_id"]==q["task_id"]=="6a825366222081918997094d76e6ae46"
          assert m["phase"]=="MASTER_IDENTITY" and m["status"]=="HISTORY_COMPLETE"
          assert m["unknown_count"]==0 and m["pass_count"]==m["queue_total"]
          assert m["asof_et"]==p["asof_et"]==q["asof_et"]
          assert q["compiled_policy_path"]=="nasdaq-xray/chatgpt_compiled_policy_v3.json"
          assert q["compiled_policy_blob_sha"]=="b41a40403c03e8884ee90d5cce2e0844d2bea0cd"
          assert q["compiled_policy_hash"]=="bc4ad11c4029bf5feb5399ae3aa7af9c9c8dd7ad6c44119bac4e5734287b931e"
          assert q["compiled_policy_version"]=="C4.14"
          assert q["queue_hash"]==m["queue_hash"] and q["queue_total"]==m["queue_total"]
          assert q["symbol_count"]==len(q["symbols"])==len(set(q["symbols"]))
          assert q["master_unknown_count"]==len(q["master_unknown_symbols"])==0
          assert q["price_unknown_count"]==len(q["price_unknown_symbols"])
          assert set(q["symbols"])==set(q["master_unknown_symbols"])|set(q["price_unknown_symbols"])
          if q["settlement_required"]:
              assert q["pointer_asof_et"] < q["asof_et"]
              assert len(q["settlement_symbols"])==3 and len(set(q["settlement_symbols"]))==3
              assert {"AAPL","NVDA"}<=set(q["settlement_symbols"])
              assert q["settlement_core_symbol"] not in {"AAPL","NVDA"}
              assert q["settlement_core_source_path"] and q["settlement_core_source_blob_sha"]
          assert p["source_master_queue_hash"]==m["queue_hash"]
          assert p["source_master_count"]==m["queue_total"]
          assert len(p["results"])==m["queue_total"]
          assert sum(p["counts"].values())==m["queue_total"]
          assert p["pass_count"]==len(p["pass_symbols"])==len(set(p["pass_symbols"]))
          print({"asof":m["asof_et"],"master_status":m["status"],"master_unknown":m["unknown_count"],"price_dv20_unknown":p["unknown_count"],"price_dv20_pass":p["pass_count"],"resolver_request_status":q["status"],"settlement_required":q["settlement_required"]})
          PY
      - name: Commit current pre-MC artifacts
        if: steps.rollover.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          files=(
            nasdaq-xray/canonical_current_full_state.json
            nasdaq-xray/canonical_current_full_candidates.json
            nasdaq-xray/canonical_current_unknowns.json
            nasdaq-xray/canonical_current_resolution_overlay.json
            nasdaq-xray/canonical_current_master_manifest.json
            nasdaq-xray/canonical_current_price_dv20.json
            nasdaq-xray/canonical_current_resolver_request.json
          )
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for p in "${files[@]}"; do
            if [ -f "$p" ]; then
              mkdir -p "$tmpdir/$(dirname "$p")"
              cp "$p" "$tmpdir/$p"
            fi
          done
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            git reset --hard origin/main
            for p in "${files[@]}"; do
              if [ -f "$tmpdir/$p" ]; then
                mkdir -p "$(dirname "$p")"
                cp "$tmpdir/$p" "$p"
              fi
            done
            git add "${files[@]}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "XRAY_FACTORY_COMMIT=NO_CHANGE"
              exit 0
            fi
            git commit -m "chore(xray): current epoch pre-MC factory [skip ci]"
            if git push origin HEAD:main; then
              echo "XRAY_FACTORY_COMMIT=PASS"
              exit 0
            fi
            echo "XRAY_FACTORY_PUSH_RACE attempt=$attempt"
            sleep $((attempt*2))
          done
          echo "XRAY_FACTORY_COMMIT=FAIL" >&2
          exit 1
