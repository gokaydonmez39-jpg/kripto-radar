name: XRAY Research Source Lab (Read-Only)
on:
  pull_request:
    paths:
      - 'personal-swing/research_lab/**'
      - '.github/workflows/xray-research-source-lab.yml'
  push:
    branches: [main]
    paths:
      - 'personal-swing/research_lab/**'
      - '.github/workflows/xray-research-source-lab.yml'
  workflow_dispatch:
  schedule:
    # Daily public GitHub project-metadata freshness audit; NOT a price scan.
    - cron: '41 5 * * *'
permissions:
  contents: read
concurrency:
  # PR/push runs are isolated: they cannot cancel the naturally scheduled source audit.
  # All natural/explicit source audits retain one serialized production group.
  group: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && format('xray-research-source-lab-test-{0}', github.run_id) || 'xray-research-source-lab-natural' }}
  cancel-in-progress: false
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official XNAS calendar dependency for offline research tests
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Fail-closed registry and synthetic comparison tests
        run: |
          python -m unittest discover -v -s personal-swing/research_lab -p 'test_*.py'
          python -O -m unittest discover -v -s personal-swing/research_lab -p 'test_*.py'
          python personal-swing/research_lab/research_runner.py --mode catalogue
          python personal-swing/research_lab/source_inventory_reconcile.py --registry personal-swing/research_lab/unified_research_88.json
  github-source-freshness:
    needs: offline-contracts
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Public GitHub repository metadata ONLY, no vendor data access
        run: python personal-swing/research_lab/research_runner.py --mode github-watch --require-all-available

  source-health-natural:
    # EXACT existing 05:41 UTC research-lab schedule; no new cron or event.
    # Four source acknowledgements stay independent of A/B notification paths.
    needs: offline-contracts
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.XRAY_PRIVATE_SHEET_SERVICE_ACCOUNT_JSON }}
      XRAY_PRIVATE_SPREADSHEET_ID: ${{ secrets.XRAY_PRIVATE_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install calendar and private Google read-only adapter
        run: |
          python -m pip install -r personal-swing/requirements.txt
          python -m pip install 'google-auth>=2.35,<3' 'requests>=2.31,<3'
      - name: Verify four exact-natural-EOD aggregate receipts (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python personal-swing/research_lab/source_health_live.py
      - name: Explicitly forbid AL, STOP, score, orders, Sheets writes and delivery claims
        if: always()
        run: echo 'SOURCE_HEALTH_OBSERVER=RESEARCH_READONLY;NO_ORDER;NO_SHEET_WRITE;NO_A_B_DELIVERY_CLAIM'
