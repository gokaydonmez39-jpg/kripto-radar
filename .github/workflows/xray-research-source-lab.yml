name: XRAY Research Source Lab (Read-Only)
on:
  pull_request:
    paths:
      - 'personal-swing/research_lab/**'
      - '.github/workflows/xray-research-source-lab.yml'
  push:
    branches: [main]
    paths:
      - 'personal-swing/research_lab/**'
      - '.github/workflows/xray-research-source-lab.yml'
  workflow_dispatch:
  schedule:
    # Daily public GitHub project-metadata freshness audit; NOT a price scan.
    - cron: '41 5 * * *'
permissions:
  contents: read
concurrency:
  group: xray-research-source-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official XNAS calendar dependency for offline research tests
        run: python -m pip install -r personal-swing/requirements.txt
      - name: Fail-closed registry and synthetic comparison tests
        run: |
          python -m unittest discover -v -s personal-swing/research_lab -p 'test_*.py'
          python -O -m unittest discover -v -s personal-swing/research_lab -p 'test_*.py'
          python personal-swing/research_lab/research_runner.py --mode catalogue
          python personal-swing/research_lab/source_inventory_reconcile.py --registry personal-swing/research_lab/unified_research_88.json
  github-source-freshness:
    needs: offline-contracts
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Public GitHub repository metadata ONLY, no vendor data access
        run: python personal-swing/research_lab/research_runner.py --mode github-watch --require-all-available

  strong-four-real-sdk-synthetic-only:
    # Only this draft research PR. NEVER EOD, cron, workflow_dispatch or main push.
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'research/nasdaq-strong4-kronos-shadow-20261107' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: pydantic
            package: pydantic==2.14.3
          - sdk: quantstats
            package: quantstats==0.0.86
          - sdk: vectorbt
            package: vectorbt==1.2.0
          - sdk: duckdb
            package: duckdb==2.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download fixed distribution wheels only; no sdist execution
        shell: bash
        env:
          SDK_PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xray-strong4/wheels"
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --dest "$RUNNER_TEMP/xray-strong4/wheels" "$SDK_PACKAGE"
      - name: SHA256 verify all downloaded wheels against reviewed lock
        shell: bash
        env:
          SDK_NAME: ${{ matrix.sdk }}
        run: |
          set -euo pipefail
          python personal-swing/research_lab/strong4_wheelhouse_receipt.py \
            --wheel-dir "$RUNNER_TEMP/xray-strong4/wheels" --sdk "$SDK_NAME" \
            --lock-file personal-swing/research_lab/strong4_wheelhouse_lock.json
      - name: Build SDK wheelhouse only; Docker build has no network
        shell: bash
        env:
          SDK_PACKAGE: ${{ matrix.package }}
          SDK_NAME: ${{ matrix.sdk }}
        run: |
          set -euo pipefail
          cp personal-swing/research_lab/strong4_wheelhouse_receipt.py "$RUNNER_TEMP/xray-strong4/checker.py"
          cp personal-swing/research_lab/strong4_wheelhouse_lock.json "$RUNNER_TEMP/xray-strong4/lock.json"
          cat > "$RUNNER_TEMP/xray-strong4/Dockerfile" <<'DOCKER'
          FROM python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54
          COPY wheels /wheels
          COPY checker.py /checker.py
          COPY lock.json /lock.json
          ARG SDK_PACKAGE
          ARG SDK_NAME
          RUN python /checker.py --wheel-dir /wheels --sdk "$SDK_NAME" --lock-file /lock.json \
              && python -m pip install --no-index --no-cache-dir --only-binary=:all: \
                --find-links=/wheels "$SDK_PACKAGE" && python -m pip check && rm -rf /wheels
          USER 65534:65534
          ENV PYTHONDONTWRITEBYTECODE=1
          DOCKER
          docker build --network none --build-arg SDK_PACKAGE="$SDK_PACKAGE" \
            --build-arg SDK_NAME="$SDK_NAME" \
            -t "xray-strong4-${SDK_NAME}:pr" "$RUNNER_TEMP/xray-strong4"
      - name: Actual synthetic SDK smoke; read-only and no network
        shell: bash
        env:
          SDK_NAME: ${{ matrix.sdk }}
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 100 --cpus 2 --memory 3g \
            --tmpfs /tmp:rw,nosuid,noexec,size=256m \
            --mount "type=bind,source=$GITHUB_WORKSPACE/personal-swing/research_lab,target=/lab,readonly" \
            --workdir /lab -e HOME=/tmp -e MPLCONFIGDIR=/tmp -e XDG_CACHE_HOME=/tmp/.cache \
            -e PYTHONDONTWRITEBYTECODE=1 -e XRAY_DOCKER_NO_NETWORK=1 \
            -e XRAY_DOCKER_NO_SECRETS=1 -e NUMBA_NUM_THREADS=2 \
            "xray-strong4-${SDK_NAME}:pr" \
            python -I /lab/strong4_real_sdk_smoke.py --sdk "$SDK_NAME"
