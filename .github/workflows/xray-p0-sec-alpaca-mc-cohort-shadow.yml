name: XRAY P0 SEC + Alpaca 8 Issuer MC Personal Shadow (No GO)
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_sec_alpaca_mc_cohort_shadow.py"
      - "nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py"
      - ".github/workflows/xray-p0-sec-alpaca-mc-cohort-shadow.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eight-issuer-cik-sec-acceptance-alpaca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Source commit must be exactly the trigger commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install exact official calendar and test all fail-closed invariants
        run: |
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python -m py_compile nasdaq-xray/p0_sec_alpaca_mc_cohort_shadow.py
          python nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py --selftest
          python -O nasdaq-xray/p0_sec_alpaca_personal_mc_canary.py --selftest
          python nasdaq-xray/p0_sec_alpaca_mc_cohort_shadow.py --selftest
          python -O nasdaq-xray/p0_sec_alpaca_mc_cohort_shadow.py --selftest
      - name: Official SEC CIK/share timestamp plus free delayed SIP close, private ephemeral only
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT || vars.XRAY_SEC_USER_AGENT }}
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          python nasdaq-xray/p0_sec_alpaca_mc_cohort_shadow.py \
            --out "$RUNNER_TEMP/xray_personal_mc_8_cohort.json"
      - name: Fail closed on source absence and all vendor raw/PRIMARY leaks
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_personal_mc_8_cohort.json"
          j=json.loads(p.read_text())
          assert j["schema"]=="XRAY_PERSONAL_SEC_ALPACA_8_ISSUER_MC_SHADOW_V1"
          assert j["status"]=="RESEARCH_EXACT_COHORT_COMPLETED_SHADOW_ONLY",j["status"]
          assert j["requested_count"]==j["attempted_count"]==len(j["requested_tickers"])
          assert j["requested_count"]>=4
          assert set(j["outcomes"])==set(j["requested_tickers"])
          assert sum(j["status_counts"].values())==j["requested_count"]
          assert j["source_price_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],text=True).strip()
          assert j["source_master_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/canonical_current_master_manifest.json"],text=True).strip()
          assert j["primary_mc_created"]==j["alpha_candidate_created"]==0
          assert j["vendor_price_shares_and_derived_marketcap_archived"] is False
          assert j["can_register_R92"] is False
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          print("XRAY_8_PERSONAL_MC_COHORT=COMPLETE_REAL_ISSUER_ATTEMPTS_ZERO_PRIMARY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-sec-alpaca-eight-issuer-personal-shadow
          path: ${{ runner.temp }}/xray_personal_mc_8_cohort.json
          retention-days: 14
          if-no-files-found: error
