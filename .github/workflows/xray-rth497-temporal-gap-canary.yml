name: XRAY RTH497 Temporal SIP Gap Canary (8 Symbols, No Alpha)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_rth497_temporal_gap_canary.py"
      - "nasdaq-xray/alpaca_rth_trade_gap_witness.py"
      - "nasdaq-xray/alpaca_closing_auction_research_probe.py"
      - ".github/workflows/xray-rth497-temporal-gap-canary.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_rth497_temporal_gap_canary.py"
      - "nasdaq-xray/alpaca_rth_trade_gap_witness.py"
      - "nasdaq-xray/alpaca_closing_auction_research_probe.py"
      - ".github/workflows/xray-rth497-temporal-gap-canary.yml"
  workflow_run:
    workflows: ["XRAY Personal Full-Universe SIP EOD Coverage (Research Only)"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: xray-alpaca-historical-sip-account-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
  queue: max
jobs:
  offline:
    name: SHA-bound 8-symbol canary adversarial regressions (no API)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official Nasdaq calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Enforce trade-witness file present in BOTH PR and main push triggers
        run: |
          python - <<'PY'
          from pathlib import Path
          file=Path(".github/workflows/xray-rth497-temporal-gap-canary.yml").read_text()
          marker='      - "nasdaq-xray/alpaca_rth_trade_gap_'+'witness.py"'
          if file.count(marker)!=2:
              raise RuntimeError("XRAY_TRADE_SOURCE_PR_PUSH_TRIGGER_SYMMETRY_BROKEN")
          print("XRAY_TRADE_SOURCE_PR_PUSH_TRIGGER_SYMMETRY=PASS")
          PY
      - name: Enforce trusted parent completion chain with positive and negative gate cases
        run: |
          python - <<'PY'
          from pathlib import Path
          file=Path(".github/workflows/xray-rth497-temporal-gap-canary.yml").read_text()
          required=(
              'workflows: ["XRAY Personal Full-Universe SIP EOD Coverage (Research Only)"]',
              'types: [completed]',
              "github.event.workflow_run.conclusion == 'success'",
              "github.event.workflow_run.head_branch == 'main'",
              "github.event.workflow_run.head_repository.full_name == github.repository",
              "github.event.workflow_run.repository.full_name == github.repository",
              "github.event.workflow_run.path == '.github/workflows/xray-personal-full-universe-sip-coverage.yml'",
              "XRAY_EXPECTED_PARENT_RUN_ID",
              "if expected_id is not None and rid!=expected_id:continue",
          )
          for marker in required:
              if marker not in file:
                  raise AssertionError("XRAY_WORKFLOW_CHAIN_GUARD_MISSING")
          repo="gokaydonmez39-jpg/kripto-radar"
          def allowed(event,conclusion,branch,head_repo,source_repo,path):
              return (event=="push" or
                      (event=="workflow_run" and conclusion=="success" and
                       branch=="main" and head_repo==repo and source_repo==repo and
                       path==".github/workflows/xray-personal-full-universe-sip-coverage.yml"))
          good=("workflow_run","success","main",repo,repo,
                ".github/workflows/xray-personal-full-universe-sip-coverage.yml")
          if not allowed(*good) or not allowed("push",None,None,None,None,None):
              raise AssertionError("XRAY_TRUSTED_PARENT_POSITIVE_BLOCKED")
          for i,bad_value in ((1,"failure"),(2,"foreign"),(3,"attacker/repo"),
                              (4,"attacker/repo"),(5,"attacker/repo"),
                              (5,".github/workflows/other.yml")):
              bad=list(good);bad[i]=bad_value
              if allowed(*bad):
                  raise AssertionError("XRAY_UNTRUSTED_PARENT_ACCEPTED")
          if allowed("pull_request",*good[1:]):
              raise AssertionError("XRAY_PR_CREDENTIAL_GATE_BYPASS")
          print("XRAY_PARENT_WORKFLOW_CHAIN=PASS_2_POSITIVE_7_NEGATIVE_NO_API")
          PY
      - name: Test sample bounds, timestamp duplicates, stale epoch, market GO guards
        run: |
          python -m py_compile nasdaq-xray/alpaca_rth497_temporal_gap_canary.py nasdaq-xray/alpaca_rth_trade_gap_witness.py
          python nasdaq-xray/alpaca_rth_trade_gap_witness.py
          python -O nasdaq-xray/alpaca_rth_trade_gap_witness.py
          python nasdaq-xray/alpaca_rth497_temporal_gap_canary.py --selftest
          python -O nasdaq-xray/alpaca_rth497_temporal_gap_canary.py --selftest
          python -m py_compile nasdaq-xray/alpaca_closing_auction_research_probe.py
          python nasdaq-xray/alpaca_closing_auction_research_probe.py --selftest
          python -O nasdaq-xray/alpaca_closing_auction_research_probe.py --selftest
      - name: Keep only aggregate research evidence, never signal or trade
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("nasdaq-xray/alpaca_rth497_temporal_gap_canary.py").read_text()
          for evidence in ("CANARY=8","MAX_CALLS=16",
                           '"official_rth_integrity_pass":False',
                           '"no_missing_bar_zero_fill":True',
                           '"registered_R92_count":0',
                           '"execution":"NONE","real_money":"NO-GO"'):
              assert evidence in s,evidence
          print("XRAY_RTH497_CANARY_GUARDS=PASS_NO_PRIMARY_NO_R92")
          PY
  bounded-live:
    name: Bounded 4-gap SIP 30Min + 1Min + historical trade-presence comparison
    needs: offline
    if: >-
      ${{ github.event_name == 'push' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.repository.full_name == github.repository &&
           github.event.workflow_run.path == '.github/workflows/xray-personal-full-universe-sip-coverage.yml') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official Nasdaq calendar
        run: python -m pip install --disable-pip-version-check pandas_market_calendars==5.4.0
      - name: Authenticate current successful main full-universe RTH parent and download exact source artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          XRAY_TRIGGER_EVENT: ${{ github.event_name }}
          XRAY_EXPECTED_PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt,json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,str(Path("nasdaq-xray").resolve()))
          from source_epoch_freshness_guard import last_complete_session
          repo=os.environ["REPO"]
          event=os.environ.get("XRAY_TRIGGER_EVENT","")
          parent_id_text=os.environ.get("XRAY_EXPECTED_PARENT_RUN_ID","").strip()
          if event=="workflow_run":
              if not (parent_id_text.isascii() and parent_id_text.isdecimal() and
                      int(parent_id_text)>0):
                  raise RuntimeError("XRAY_RTH_CANARY_INVALID_TRIGGER_PARENT_ID")
              expected_id=int(parent_id_text)
          elif event=="push" and not parent_id_text:
              expected_id=None
          else:
              raise RuntimeError("XRAY_RTH_CANARY_UNTRUSTED_TRIGGER_EVENT")
          if repo!="gokaydonmez39-jpg/kripto-radar":
              raise RuntimeError("XRAY_RTH_CANARY_FOREIGN_REPO")
          asof=last_complete_session(dt.datetime.now(dt.timezone.utc))
          def api(route):
              return json.loads(subprocess.check_output([
                  "gh","api",f"repos/{repo}/{route}"],text=True,timeout=40))
          path="xray-personal-full-universe-sip-coverage.yml"
          label="xray-personal-joint-260-daily30-rth30-no-ohlcv"
          runs=api("actions/workflows/"+path+
              "/runs?branch=main&status=success&per_page=8")["workflow_runs"]
          chosen=None
          out=Path(os.environ["RUNNER_TEMP"])/"parent"
          out.mkdir(exist_ok=True)
          for run in runs:
              if not (run.get("name")==
                      "XRAY Personal Full-Universe SIP EOD Coverage (Research Only)" and
                      run.get("path")==".github/workflows/"+path and
                      run.get("status")=="completed" and
                      run.get("conclusion")=="success" and
                      run.get("head_branch")=="main" and
                      (run.get("repository") or {}).get("full_name")==repo and
                      (run.get("head_repository") or {}).get("full_name")==repo):
                  continue
              rid=run["id"]
              if expected_id is not None and rid!=expected_id:continue
              arts=api("actions/runs/"+str(rid)+"/artifacts")["artifacts"]
              matching=[x for x in arts if x.get("name")==label and
                  x.get("expired") is False and
                  (x.get("workflow_run") or {}).get("id")==rid and
                  type(x.get("size_in_bytes")) is int and
                  200<x["size_in_bytes"]<400000]
              if len(matching)!=1:continue
              subprocess.check_output(["gh","run","download",str(rid),
                  "--repo",repo,"-n",label,"-D",str(out)],timeout=60)
              files=list(out.rglob("*.json"))
              if len(files)!=1:raise RuntimeError("XRAY_RTH_CANARY_ONE_JSON_ONLY")
              source=json.loads(files[0].read_bytes())
              if source.get("asof_et")!=asof:
                  # Fail closed on stale report: do not query old session.
                  files[0].unlink()
                  continue
              # Do not freeze market-derived cohort counts in workflow YAML.
              # One shared validator checks authoritative main parent identity,
              # exact current ASOF, SHA-bound complete disjoint class partition,
              # four actual gaps and zero primary/trading authority.
              from alpaca_rth497_temporal_gap_canary import sample_from_parent
              try:
                  observed_asof,observed_sample,_=sample_from_parent(
                      source,dt.datetime.now(dt.timezone.utc))
                  if observed_asof!=asof or len(observed_sample)!=8:
                      raise ValueError("INCONSISTENT_ASOF_OR_TARGET_COUNT")
              except ValueError as exc:
                  raise RuntimeError(
                      "XRAY_RTH_CANARY_UNTRUSTED_PARENT_COHORT_CONTRACT") from exc
              chosen=rid
              (out/"xray_personal_joint_rth30_shadow.json").write_text(
                  json.dumps(source,sort_keys=True)+chr(10))
              break
          if chosen is None:
              raise RuntimeError("XRAY_RTH_CANARY_NO_CURRENT_TRUSTED_PARENT")
          with open(os.environ["GITHUB_OUTPUT"],"a") as handle:
              handle.write("run_id="+str(chosen)+chr(10))
          print("XRAY_RTH_CANARY_AUTHENTICATED_PARENT_RUN="+str(chosen))
          print("XRAY_RTH_CANARY_CURRENT_ASOF="+asof)
          PY
      - name: Diagnose latest-session and earlier RTH missing slot clustering
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
          XRAY_AUTHENTICATED_RTH_PARENT_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          python nasdaq-xray/alpaca_rth497_temporal_gap_canary.py \
            --parent "$RUNNER_TEMP/parent/xray_personal_joint_rth30_shadow.json" \
            --out "$RUNNER_TEMP/xray_rth497_temporal_canary.json"
      - name: Require bounded aggregated evidence without C4.17 or technical promotion
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_rth497_temporal_canary.json").read_text())
          assert r["schema"]=="XRAY_RTH497_TEMPORAL_CLUSTER_RESEARCH_V1"
          assert r["sample_size"]==8 and r["source_api_calls"]<=16
          assert r["sample_missing_30min_slots"]==r["latest_session_missing_slots"]+r["earlier_sessions_missing_slots"]
          assert r["historical_trade_witness_source_api_calls"]<=8
          assert r["historical_trade_witness_call_budget"]==8
          assert sum(r["historical_trade_witness_result_counts"].values())==r["minute_witness_30min_missing_slots_total"]
          assert r["historical_trade_prints_vendor_rows_persisted"] is False
          assert r["historical_trade_source_rights_and_sale_conditions_verified"] is False
          assert r["historical_trade_witness_can_upgrade_c417_or_r92"] is False
          assert (r["source_api_calls"]+r["minute_witness_source_api_calls"]
                 +r["historical_trade_witness_source_api_calls"])<=36
          assert r["minute_witness_source_api_calls"]<=12
          assert r["source_api_calls"]+r["minute_witness_source_api_calls"]<=28
          assert r["minute_witness_call_budget"]==12
          assert r["minute_witness_target_group"]=="FOUR_RTH_INTEGRITY_GAPS_ONLY"
          assert sum(r["minute_witness_result_counts"].values())==r["minute_witness_30min_missing_slots_total"]
          assert r["minute_witness_can_upgrade_c417_or_r92"] is False
          assert r["minute_witness_vendor_rows_persisted"] is False
          assert r["minute_witness_no_independent_venue_or_trade_conditions"] is True
          assert r["raw_vendor_ohlcv_stored"] is False
          assert r["official_rth_integrity_pass"] is False
          assert r["watch_created"] is False and r["registered_R92_count"]==0
          assert r["execution"]=="NONE" and r["real_money"]=="NO-GO"
          print("XRAY_RTH497_TEMPORAL_LIVE_CANARY=SAFE_AGGREGATES_ONLY")
          PY
      - name: Probe official SIP historical-auction endpoint for four authenticated missing-bar symbols
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || secrets.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || secrets.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          python nasdaq-xray/alpaca_closing_auction_research_probe.py \
            --parent "$RUNNER_TEMP/parent/xray_personal_joint_rth30_shadow.json" \
            --out "$RUNNER_TEMP/xray_rth_auction_four_gap_research.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray_rth_auction_four_gap_research.json"
          r=json.loads(p.read_text())
          assert r["schema"]=="XRAY_PERSONAL_SIP_AUCTION_ACCESSIBILITY_WITNESS_V1"
          assert r["target_count"]==4 and r["api_calls"]<=1
          assert r["source_endpoint"]=="https://data.alpaca.markets/v2/stocks/auctions"
          assert r["no_vendor_auction_prices_or_volumes_persisted"] is True
          assert r["source_rights_not_inferred"] is True
          assert r["official_auction_correction_and_sale_conditions_attested"] is False
          assert r["official_c417_primary_dv30_attested"] is False
          assert r["registered_R92_count"]==0 and r["orders"]==[]
          assert r["execution"]=="NONE" and r["real_money"]=="NO-GO"
          print("XRAY_FOUR_GAP_AUCTION_SHADOW=BOUNDED_ONE_CALL_RESEARCH_ONLY")
          PY
      - name: Upload separate symbolic auction availability diagnostic; never vendor rows or rights attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-sip-auction-four-gap-research-no-raw-prices
          path: ${{ runner.temp }}/xray_rth_auction_four_gap_research.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload only aggregate 30Min/1Min/trade-presence evidence; no OHLCV or ticker identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-rth497-temporal-gap-canary-no-ohlcv
          path: ${{ runner.temp }}/xray_rth497_temporal_canary.json
          if-no-files-found: warn
          retention-days: 7
