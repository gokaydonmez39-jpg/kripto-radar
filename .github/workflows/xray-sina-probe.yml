name: XRAY Sina History Probe

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/sina_probe.py"
      - ".github/workflows/xray-sina-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AKShare
        run: python -m pip install --disable-pip-version-check akshare==1.18.95
      - name: Probe Sina US daily history
        run: python nasdaq-xray/sina_probe.py
      - name: Commit probe evidence
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/sina_probe.json
          git commit -m "chore(xray): Sina history probe evidence [skip ci]" || exit 0
          git pull --rebase origin main
          git push
