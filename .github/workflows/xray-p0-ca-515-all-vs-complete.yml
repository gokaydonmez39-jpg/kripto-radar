name: XRAY 515 Corporate Actions Complete vs All Early Events Shadow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_ca_515_complete_all_quality_delta.py"
      - ".github/workflows/xray-p0-ca-515-all-vs-complete.yml"
permissions:
  contents: read
jobs:
  show-early-incomplete-ca:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Exact invoking SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Calendar and negative quality regression
        run: |
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python -m py_compile nasdaq-xray/p0_ca_515_complete_all_quality_delta.py
          python nasdaq-xray/p0_ca_515_complete_all_quality_delta.py --selftest
          python -O nasdaq-xray/p0_ca_515_complete_all_quality_delta.py --selftest
      - name: Compare actual Alpaca complete and all provider quality
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: python nasdaq-xray/p0_ca_515_complete_all_quality_delta.py --out "$RUNNER_TEMP/xray_ca_515_all_complete.json"
      - name: Verify exact scope, nonpromotion, and no data leakage
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_ca_515_all_complete.json").read_text())
          assert d["schema"]=="XRAY_515_CA_COMPLETE_ALL_INCOMPLETE_SHADOW_V1"
          assert d["source_scope_with_qqq"]==515
          assert d["status"]=="SHADOW_QUALITY_BOTH_515_SCOPES_CLOSED"
          assert d["complete_missing_from_all"]==0
          assert d["source_price_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],text=True).strip()
          assert d["source_master_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/canonical_current_master_manifest.json"],text=True).strip()
          assert d["canonical_HISTORY_PASS_created"]==d["C417_PRIMARY_MC_created"]==0
          assert d["R92_created"] is False and d["GO"] is False
          assert d["provider_raw_events_ids_prices_not_persisted"] is True
          assert d["execution"]=="NONE" and d["real_money"]=="NO-GO"
          print("XRAY_CA_QUALITY_ALL_515=BOUNDED_SHADOW_NO_PRIMARY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xray-515-ca-complete-all-data-quality-shadow
          path: ${{ runner.temp }}/xray_ca_515_all_complete.json
          retention-days: 14
          if-no-files-found: error
