name: XRAY Extract Canonical Unknowns 20260930

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-extract-canonical-unknowns-20260930.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-extract-canonical-unknowns-20260930
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Extract compact unknown manifest
        run: |
          python - <<'PY'
          import json, hashlib
          src="nasdaq-xray/canonical_full_hard_gate_20260930_state.json"
          out="nasdaq-xray/canonical_full_hard_gate_20260930_unknowns.json"
          s=json.load(open(src))
          unknowns={}
          for sym,r in sorted((s.get("results") or {}).items()):
              st=str(r.get("status") or "")
              if not st.startswith("UNKNOWN"):
                  continue
              unknowns[sym]={
                  "status":st,
                  "attempts":r.get("attempts"),
                  "info":r.get("info"),
                  "security_name":(s.get("security_names") or {}).get(sym),
                  "discovery":(s.get("discovery") or {}).get(sym),
              }
          by_status={}
          by_reason={}
          for sym,r in unknowns.items():
              by_status[r["status"]]=by_status.get(r["status"],0)+1
              info=r.get("info")
              reason=info.get("reason") if isinstance(info,dict) else str(info)
              reason=str(reason)
              by_reason[reason]=by_reason.get(reason,0)+1
          obj={
              "schema":"XRAY_CANONICAL_UNKNOWN_MANIFEST_V1",
              "task_id":s.get("task_id"),
              "asof_et":s.get("asof_et"),
              "execution":"NONE",
              "real_money":"NO-GO",
              "source_state_hash":s.get("state_hash"),
              "source_queue_hash":s.get("queue_hash"),
              "source_unknown_count":s.get("unknown_count"),
              "source_counts":s.get("counts"),
              "official_footer":s.get("official_footer"),
              "unknown_count":len(unknowns),
              "by_status":dict(sorted(by_status.items())),
              "by_reason":dict(sorted(by_reason.items())),
              "unknowns":unknowns,
          }
          raw=json.dumps(obj,ensure_ascii=False,sort_keys=True,indent=2)+"\n"
          open(out,"w").write(raw)
          print(json.dumps({"unknown_count":len(unknowns),"by_status":obj["by_status"],"by_reason":obj["by_reason"]},sort_keys=True))
          PY
      - name: Validate
        run: |
          python - <<'PY'
          import json
          j=json.load(open("nasdaq-xray/canonical_full_hard_gate_20260930_unknowns.json"))
          assert j["schema"]=="XRAY_CANONICAL_UNKNOWN_MANIFEST_V1"
          assert j["task_id"]=="6a825366222081918997094d76e6ae46"
          assert j["asof_et"]=="2026-09-30"
          assert j["unknown_count"]==j["source_unknown_count"]==60
          assert sum(j["by_status"].values())==60
          print("UNKNOWN_MANIFEST_PASS")
          PY
      - name: Commit manifest
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/canonical_full_hard_gate_20260930_unknowns.json
          git commit -m "chore(xray): extract canonical hard-gate unknowns 2026-09-30 [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
