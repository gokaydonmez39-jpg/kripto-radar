name: XRAY P0 11 Split Adjustments vs Alpaca CA Event Shadow
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/p0_ca_split_restatement_bridge.py"
      - ".github/workflows/xray-p0-ca-split-restatement-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  match-observed-adjustments-to-ca:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Exact source epoch
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pinned calendar and adversarial split/event crosschecks
        run: |
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python -m py_compile nasdaq-xray/p0_ca_split_restatement_bridge.py
          python nasdaq-xray/p0_ca_split_restatement_bridge.py --selftest
          python -O nasdaq-xray/p0_ca_split_restatement_bridge.py --selftest
      - name: Download exact previous 515 raw/split sanitized evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xray-ca-bridge"
          gh run download 38178676524 -R "${{ github.repository }}" \
            -n xray-alpaca-515-raw-split-daily-shadow-sanitized \
            -D "$RUNNER_TEMP/xray-ca-bridge"
          test -s "$RUNNER_TEMP/xray-ca-bridge/xray_515_raw_split_research.json"
      - name: Bind the 11 changed tickers to real corporate-action event types
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY }}
        run: |
          python nasdaq-xray/p0_ca_split_restatement_bridge.py \
            --raw-split "$RUNNER_TEMP/xray-ca-bridge/xray_515_raw_split_research.json" \
            --out "$RUNNER_TEMP/xray-ca-bridge/xray_11_event_correlations.json"
      - name: Verify source/partition with zero authority
        run: |
          python - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"xray-ca-bridge/xray_11_event_correlations.json"
          j=json.loads(p.read_text())
          assert j["schema"]=="XRAY_P0_SPLIT_EVENT_RESTATEMENT_BRIDGE_SHADOW_V1"
          assert j["status"]=="SAME_PROVIDER_EVENT_EXISTENCE_RESEARCH_ONLY"
          assert j["full_515_raw_split_measured"]==515
          assert j["numerically_restated_symbols"]==11
          assert len(j["correlations"])==len(j["actual_changed_symbols"])==11
          assert sum(j["status_counts"].values())==11
          assert j["source_price_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/canonical_current_price_dv30.json"],text=True).strip()
          assert j["source_master_blob_sha"]==subprocess.check_output(
            ["git","hash-object","nasdaq-xray/canonical_current_master_manifest.json"],text=True).strip()
          assert j["can_create_HISTORY_PASS"] is False
          assert j["can_create_C417_PRIMARY_MC"] is False
          assert j["can_register_R92"] is False and j["GO"] is False
          assert j["raw_vendor_events_saved"] is False
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          print("XRAY_CA_SPLIT_MATCHED_11=RESEARCH_ONLY_NO_ISSUER_INDEPENDENCE")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-p0-eleven-split-ca-correlation-no-primary
          path: ${{ runner.temp }}/xray-ca-bridge/xray_11_event_correlations.json
          retention-days: 14
          if-no-files-found: error
