name: XRAY Oct13 FROG SEC Form4 IR Halt SIP Close Last Mile
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/candidate_local_frog_oct13_last_mile_forensics.py"
      - ".github/workflows/xray-oct13-frog-last-mile-form4-ir-halt-close.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: xray-frog-last-mile-20261013
  cancel-in-progress: false
jobs:
  exact-candidate-pit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned offline calendar and source dependencies
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt
      - name: Ensure real commit and exercise offline fail-closed controls
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/candidate_local_frog_oct13_last_mile_forensics.py
          python nasdaq-xray/candidate_local_frog_oct13_last_mile_forensics.py --selftest
          python -O nasdaq-xray/candidate_local_frog_oct13_last_mile_forensics.py --selftest
          echo XRAY_FROG_LAST_MILE_CHECKOUT_SHA=PASS
      - name: Verify immutable true FROG Deep and SEC witnesses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$(gh api repos/${{ github.repository }}/actions/artifacts/11880391086 --jq .digest)"
          f="$(gh api repos/${{ github.repository }}/actions/artifacts/11880402289 --jq .digest)"
          test "$d" = "sha256:e4f755b04f1b571ca3dcb0be0c47f3815f557b7130d35f6d646c02efaf563eee"
          test "$f" = "sha256:b90ba335c930e877acf69fe62a776189f92dbc5fd84a803f98d8b72d8d707729"
          mkdir -p "$RUNNER_TEMP/deep" "$RUNNER_TEMP/frog"
          gh run download 38536372509 --repo "${{ github.repository }}" \
            --name xray-20261013-full277-stage1-deep-abd-r1rr-real --dir "$RUNNER_TEMP/deep"
          gh run download 38537058724 --repo "${{ github.repository }}" \
            --name xray-oct13-frog-true-trigger-sec-pit-halt-ir-evidence --dir "$RUNNER_TEMP/frog"
          echo XRAY_FROG_LAST_MILE_IMMUTABLE_SOURCES=PASS
      - name: Scan actual SEC issuer Form4 8K registration, official IR, Nasdaq and thirty SIP close samples
        env:
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT }}
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || vars.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || vars.XRAY_ALPACA_DATA_SECRET_KEY }}
          XRAY_ALPACA_API_KEY_ID: ${{ secrets.XRAY_ALPACA_API_KEY_ID || vars.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_API_SECRET_KEY: ${{ secrets.XRAY_ALPACA_API_SECRET_KEY || vars.XRAY_ALPACA_API_SECRET_KEY }}
        run: |
          python nasdaq-xray/candidate_local_frog_oct13_last_mile_forensics.py \
            --deep "$RUNNER_TEMP/deep/xray_deep277_real_full.json" \
            --frog "$RUNNER_TEMP/frog/frog_oct13_official_source.json" \
            --out "$RUNNER_TEMP/frog_last_mile.json"
      - name: Independently verify sources and refuse evidence-free canonical or phone registration
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"frog_last_mile.json").read_text())
          def need(x,key):
              if not x:raise RuntimeError("XRAY_FROG_LAST_MILE_VERIFY_"+key)
          need(j["schema"]=="XRAY_FROG_OCT13_LAST_MILE_SEC_FORM4_CA_EVENT_HALT_TRADE_SHADOW_V1","SCHEMA")
          need(j["symbol"]=="FROG" and j["asof_et"]=="2026-10-13","EXACT_ASOF")
          need(len(j["event_forward_8_official_sessions"])==8,"EIGHT_SESSIONS")
          need(j["price"]["requested_sessions"]==30,"PRICE_SCOPE")
          need(not j["sec"]["current_class_shares_reconciled"],"NO_FICTITIOUS_SHARE_ROLLFORWARD")
          need(not j["issuer_event"]["eight_day_event_calendar_clear"],"NO_FAKE_IR")
          need(not j["halt"]["historical_complete_clear_pass"],"NO_HALT_NEGATIVE_INFERENCE")
          need(j["decision"]["eligible_primary"] is False,"PRIMARY_DENIED")
          need(j["decision"]["registered_r92"] is False,"R92_DENIED")
          need(j["iphone_delivery_receipt_verified"] is False,"PHONE_RECEIPT_DENIED")
          need(j["execution"]=="NONE" and j["real_money"]=="NO-GO","SAFETY")
          need(j["canonical_files_mutated"] is False and j["delivery_ledger_mutated"] is False,"NO_CANONICAL_MUTATION")
          print("XRAY_FROG_LAST_MILE_REAL_SOURCES=INDEPENDENT_FAIL_CLOSED_VALIDATION_PASS")
          PY
      - name: Preserve only scoped derived metadata, no price/share amounts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xray-frog-oct13-last-mile-issuer-form4-ir-halt-auction-no-primary
          path: ${{ runner.temp }}/frog_last_mile.json
          retention-days: 14
          if-no-files-found: warn
