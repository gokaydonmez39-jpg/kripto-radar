name: XRAY Oct13 FROG D Inverted Funnel Real PIT Sources
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/candidate_local_frog_oct13_pit_reconciliation_v1.py"
      - ".github/workflows/xray-oct13-frog-inverted-funnel-pit-reconciliation.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: xray-oct13-frog-reverse-funnel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-sources-no-false-r92:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned runtime with official Nasdaq session calendar
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt
      - name: Compile and independently negative-test candidate-local source engine
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile nasdaq-xray/candidate_local_frog_oct13_pit_reconciliation_v1.py
          python nasdaq-xray/candidate_local_frog_oct13_pit_reconciliation_v1.py --selftest
          python -O nasdaq-xray/candidate_local_frog_oct13_pit_reconciliation_v1.py --selftest
          echo XRAY_FROG_REVERSE_FUNNEL_CHECKOUT=EXACT_GITHUB_SHA
      - name: Verify frozen deep and issuer artifact ZIP SHA before read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$(gh api repos/${{ github.repository }}/actions/artifacts/11880391086 --jq .digest)"
          f="$(gh api repos/${{ github.repository }}/actions/artifacts/11880402289 --jq .digest)"
          test "$d" = "sha256:e4f755b04f1b571ca3dcb0be0c47f3815f557b7130d35f6d646c02efaf563eee"
          test "$f" = "sha256:b90ba335c930e877acf69fe62a776189f92dbc5fd84a803f98d8b72d8d707729"
          mkdir -p "$RUNNER_TEMP/deep" "$RUNNER_TEMP/frog"
          gh run download 38536372509 --repo "${{ github.repository }}" \
            --name xray-20261013-full277-stage1-deep-abd-r1rr-real \
            --dir "$RUNNER_TEMP/deep"
          gh run download 38537058724 --repo "${{ github.repository }}" \
            --name xray-oct13-frog-true-trigger-sec-pit-halt-ir-evidence \
            --dir "$RUNNER_TEMP/frog"
          echo XRAY_FROG_FROZEN_TWO_ARTIFACT_SHA256=PASS
      - name: Query candidate-local SIP raw-adjusted prices CA SEC 10K 10Q 8K and Nasdaq historical halts
        env:
          XRAY_ALPACA_DATA_KEY_ID: ${{ secrets.XRAY_ALPACA_DATA_KEY_ID || vars.XRAY_ALPACA_DATA_KEY_ID }}
          XRAY_ALPACA_DATA_SECRET_KEY: ${{ secrets.XRAY_ALPACA_DATA_SECRET_KEY || vars.XRAY_ALPACA_DATA_SECRET_KEY }}
          XRAY_ALPACA_API_KEY_ID: ${{ secrets.XRAY_ALPACA_API_KEY_ID || vars.XRAY_ALPACA_API_KEY_ID }}
          XRAY_ALPACA_API_SECRET_KEY: ${{ secrets.XRAY_ALPACA_API_SECRET_KEY || vars.XRAY_ALPACA_API_SECRET_KEY }}
          XRAY_SEC_USER_AGENT: ${{ secrets.XRAY_SEC_USER_AGENT }}
        run: |
          python nasdaq-xray/candidate_local_frog_oct13_pit_reconciliation_v1.py \
            --deep "$RUNNER_TEMP/deep/xray_deep277_real_full.json" \
            --frog "$RUNNER_TEMP/frog/frog_oct13_official_source.json" \
            --out "$RUNNER_TEMP/xray_frog_reverse_funnel_pit.json"
      - name: Forbid R92 or canonical mutation when current source proof is incomplete
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"xray_frog_reverse_funnel_pit.json").read_text())
          def require(ok,code):
              if not ok: raise ValueError("XRAY_REVERSE_FUNNEL_WITNESS_"+code)
          require(j["asof_et"]=="2026-10-13" and j["symbol"]=="FROG","ASOF_SYMBOL")
          require(j["risk_rr_geometry_pass"] is True,"TRUE_TECH")
          require(j["r92_registered"]==0 and j["canonical_primary_created"] is False,"NO_FALSE_RELEASE")
          require(j["iphone_push_receipt_verified"] is False,"NO_FAKE_DEVICE_RECEIPT")
          require(j["execution"]=="NONE" and j["real_money"]=="NO-GO","NO_EXECUTION")
          require(j["canonical_files_modified"] is False,"CANONICAL_MUTATION")
          require(j["raw_vendor_ohlcv_persisted"] is False and
                  j["raw_sec_share_values_persisted"] is False,"NO_RAW_VENDOR_PERSIST")
          for key,path in (("master_git_blob_sha","nasdaq-xray/canonical_current_master_manifest.json"),
                           ("official_source_guard_git_blob_sha","nasdaq-xray/canonical_official_source_guard.json")):
              actual=subprocess.check_output(["git","hash-object",path],text=True).strip()
              require(actual==j[key],"GIT_BLOB_SOURCE")
          require(j["class_aware_mc_2b_primary_pass"] is False and
                  j["price_primary_pass"] is False and
                  j["candidate_local_c417_complete"] is False,"UNSUPPORTED_PROMOTION")
          require(j["alpaca_http_requests"]>=0 and j["alpaca_http_requests"]<=24,"HTTP_BUDGET")
          print("XRAY_FROG_INVERTED_FUNNEL_REAL_SOURCE_WITNESS=PASS_NO_FALSE_R92")
          print("XRAY_FROG_INVERTED_FUNNEL_VENDOR_CALLS="+str(j["alpaca_http_requests"]))
          PY
      - name: Archive counts, proof states and SHA only, not licensed market data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-oct13-frog-candidate-local-pit-ca-price-sec-legal-halt
          path: ${{ runner.temp }}/xray_frog_reverse_funnel_pit.json
          retention-days: 14
          if-no-files-found: warn
