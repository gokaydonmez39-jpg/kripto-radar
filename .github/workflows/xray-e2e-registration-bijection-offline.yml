name: XRAY R92 Registration Bijection Offline Negative CI (No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/e2e_production_readiness.py"
      - "nasdaq-xray/tests/test_e2e_registration_membership.py"
      - ".github/workflows/xray-e2e-registration-bijection-offline.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/e2e_production_readiness.py"
      - "nasdaq-xray/tests/test_e2e_registration_membership.py"
      - ".github/workflows/xray-e2e-registration-bijection-offline.yml"

permissions:
  contents: read

concurrency:
  group: xray-r92-registration-negative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-synthetic-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Negative-only no vendor, no keys, no market or broker access
        run: |
          set -euo pipefail
          python -m py_compile nasdaq-xray/e2e_production_readiness.py nasdaq-xray/tests/test_e2e_registration_membership.py
          python -m unittest discover -s nasdaq-xray/tests -p 'test_e2e_registration_membership.py' -v
          python -O -m unittest discover -s nasdaq-xray/tests -p 'test_e2e_registration_membership.py' -v
          echo 'XRAY_R92_REGISTRATION_EXACT_PARTITION=OFFLINE_POSITIVE_AND_NEGATIVE_TESTS_PASS_NO_AL'
