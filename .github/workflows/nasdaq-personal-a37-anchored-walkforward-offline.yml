name: XRAY NASDAQ A37 Anchored Walk-Forward Offline Admission

on:
  pull_request:
    branches: [main]
    paths:
      - 'personal-swing/research_lab/qlib_pit_readiness_shadow.py'
      - 'personal-swing/research_lab/test_qlib_pit_readiness_shadow.py'
      - 'personal-swing/research_lab/a37_anchored_walkforward_shadow.py'
      - 'personal-swing/research_lab/test_a37_anchored_walkforward_shadow.py'
      - 'personal-swing/research_lab/A37_WALKFORWARD_ADMISSION_README.md'
      - '.github/workflows/nasdaq-personal-a37-anchored-walkforward-offline.yml'
  push:
    branches: [main]
    paths:
      - 'personal-swing/research_lab/qlib_pit_readiness_shadow.py'
      - 'personal-swing/research_lab/test_qlib_pit_readiness_shadow.py'
      - 'personal-swing/research_lab/a37_anchored_walkforward_shadow.py'
      - 'personal-swing/research_lab/test_a37_anchored_walkforward_shadow.py'
      - 'personal-swing/research_lab/A37_WALKFORWARD_ADMISSION_README.md'
      - '.github/workflows/nasdaq-personal-a37-anchored-walkforward-offline.yml'

permissions:
  contents: read

jobs:
  offline-a37-scientific-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing PIT and A37 synthetic negative regressions
        working-directory: personal-swing/research_lab
        run: python -m unittest -v test_qlib_pit_readiness_shadow test_a37_anchored_walkforward_shadow
      - name: Repeat with optimized Python to prevent assert bypass
        working-directory: personal-swing/research_lab
        run: python -O -m unittest -v test_qlib_pit_readiness_shadow test_a37_anchored_walkforward_shadow
      - name: Bounded, synthetic-only structural witness
        working-directory: personal-swing/research_lab
        run: python a37_anchored_walkforward_shadow.py
