name: XRAY SIP HTTP Attempt Budget (Offline No Vendor)
on:
  push:
    paths:
      - ".github/workflows/xray-sip-http-attempt-budget-offline.yml"
      - "nasdaq-xray/alpaca_full_universe_asof_sip_availability.py"
  pull_request:
    paths:
      - ".github/workflows/xray-sip-http-attempt-budget-offline.yml"
      - "nasdaq-xray/alpaca_full_universe_asof_sip_availability.py"
permissions:
  contents: read
concurrency:
  group: xray-sip-http-budget-offline
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install official exchange calendar
        run: python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
      - name: Verify mock HTTP requests are capped in optimized and normal runtimes
        run: |
          python -m py_compile nasdaq-xray/alpaca_full_universe_asof_sip_availability.py
          python nasdaq-xray/alpaca_full_universe_asof_sip_availability.py --selftest
          python -O nasdaq-xray/alpaca_full_universe_asof_sip_availability.py --selftest
      - name: Confirm regression remains offline and safe
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path("nasdaq-xray/alpaca_full_universe_asof_sip_availability.py")
          code = ast.parse(p.read_text())
          classes = {n.name for n in code.body if isinstance(n, ast.ClassDef)}
          assert "RequestBudget" in classes
          funcs = {n.name for n in code.body if isinstance(n, ast.FunctionDef)}
          assert {"query_sip", "classify", "census", "selftest"}.issubset(funcs)
          print("XRAY_SIP_HTTP_OFFLINE_CONTRACT=PASS_NO_KEYS_NO_MARKET_DATA_NO_TRADES")
          PY