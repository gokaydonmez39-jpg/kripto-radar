name: XRAY Stooq Symbol Probe

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/stooq_symbol_probe.py"
      - ".github/workflows/xray-stooq-symbol-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-stooq-symbol-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Stooq per-symbol CSV
        run: python nasdaq-xray/stooq_symbol_probe.py
      - name: Commit probe evidence
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/stooq_symbol_probe.json
          git commit -m "chore(xray): Stooq symbol probe evidence [skip ci]" || exit 0
          git pull --rebase origin main
          git push
