name: XRAY Canonical Stage1 20260930
# force latest-main stage1 rerun
# C4.14 primary-only stage1 rerun
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/canonical_legal_20260930.json"
      - "nasdaq-xray/stage1_shadow.py"
      - ".github/workflows/xray-canonical-stage1-20260930.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xray-canonical-stage1-20260930
  cancel-in-progress: false
jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      XRAY_MC_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_stage1_input_20260930.json
      XRAY_STAGE1_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_stage1_20260930.json
      XRAY_STAGE1_WORKERS: "10"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build legal-pass Stage1 input
        run: |
          python - <<'PY'
          import json
          h=json.load(open("nasdaq-xray/canonical_history_20260930.json"))
          l=json.load(open("nasdaq-xray/canonical_legal_20260930.json"))
          assert l["counts"]["UNKNOWN_LEGAL"]==0
          caps=h.get("state_caps") or {}
          r92=set(h.get("r92_ineligible") or [])
          syms=l["pass_symbols"]
          o={
            "schema":"XRAY_CANONICAL_STAGE1_INPUT_V1",
            "task_id":"6a825366222081918997094d76e6ae46",
            "asof_et":"2026-09-30","execution":"NONE","real_money":"NO-GO",
            "current_core_mc_pass":syms,
            "state_caps":{s:caps.get(s,"NORMAL") for s in syms},
            "r92_ineligible":sorted(r92 & set(syms))
          }
          open("nasdaq-xray/canonical_stage1_input_20260930.json","w").write(json.dumps(o,sort_keys=True,indent=2)+"\n")
          PY
      - run: python -m py_compile nasdaq-xray/stage1_shadow.py
      - run: python -m pip install --disable-pip-version-check akshare==1.18.95 pandas_market_calendars
      - name: Run Stage1
        run: python nasdaq-xray/stage1_shadow.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          j=json.load(open("nasdaq-xray/canonical_stage1_20260930.json"))
          assert j["schema"]=="XRAY_STAGE1_SHADOW_V1"
          assert j["asof_et"]=="2026-09-30"
          assert j["unknown_count"]==0,j["unknown"]
          print({k:j[k] for k in ["input_current_core_count","weekly_pass_count","a_trend_pool_count","b_tight_base_pool_count","d_drawdown_pool_count","unknown_count"]})
          PY
      - name: Commit Stage1
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/canonical_stage1_input_20260930.json nasdaq-xray/canonical_stage1_20260930.json
          git commit -m "chore(xray): canonical Stage1 2026-09-30" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
