name: XRAY Canonical Stage1 20260930

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xray-canonical-stage1-20260930.yml"
      - "nasdaq-xray/canonical_mc_input_20260930.json"
      - "nasdaq-xray/stage1_shadow.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-canonical-stage1-20260930
  cancel-in-progress: false

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XRAY_MC_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_mc_input_20260930.json
      XRAY_STAGE1_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_stage1_20260930.json
      XRAY_STAGE1_WORKERS: "10"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned MC input
        run: |
          python - <<'PY'
          import hashlib, pathlib, json
          p=pathlib.Path("nasdaq-xray/canonical_mc_input_20260930.json")
          b=p.read_bytes()
          h=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          assert h=="8f85665989a58a965bd104e7645dab4541a18ab0",(h,)
          j=json.loads(b)
          assert j["schema"]=="XRAY_CANONICAL_MC_INPUT_V1"
          assert j["task_id"]=="6a825366222081918997094d76e6ae46"
          assert j["asof_et"]=="2026-09-30"
          assert j["current_core_count"]==460
          assert j["excluded_watch_only_count"]==18
          print("MC_INPUT_PIN_PASS")
          PY
      - name: Compile
        run: python -m py_compile nasdaq-xray/stage1_shadow.py
      - name: Install zero-dollar runtime
        run: python -m pip install --disable-pip-version-check akshare==1.18.95 pandas_market_calendars
      - name: Run Stage1
        run: python nasdaq-xray/stage1_shadow.py
      - name: Structural validation
        run: |
          python - <<'PY'
          import json
          j=json.load(open("nasdaq-xray/canonical_stage1_20260930.json"))
          assert j["schema"]=="XRAY_STAGE1_SHADOW_V1"
          assert j["task_id"]=="6a825366222081918997094d76e6ae46"
          assert j["asof_et"]=="2026-09-30"
          assert j["execution"]=="NONE" and j["real_money"]=="NO-GO"
          assert j["input_current_core_count"]==460
          assert len(j["results"])==460
          assert j["weekly_pass_count"]==len(j["weekly_pass"])
          assert j["unknown_count"]==len(j["unknown"])
          print({k:j[k] for k in ["input_current_core_count","weekly_pass_count","a_trend_pool_count","b_tight_base_pool_count","d_drawdown_pool_count","unknown_count"]})
          PY
      - name: Commit bounded Stage1 artifact
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/canonical_stage1_20260930.json
          git commit -m "chore(xray): canonical Stage1 2026-09-30 [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
      - name: Strict Stage1 completion
        run: |
          python - <<'PY'
          import json
          j=json.load(open("nasdaq-xray/canonical_stage1_20260930.json"))
          assert j["unknown_count"]==0, j["unknown"]
          print("CANONICAL_STAGE1_COMPLETE")
          PY
