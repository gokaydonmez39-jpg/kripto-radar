name: XRAY Alpaca Frozen Root ASOF Regression (No Alpha)
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_root_asof_260_four_symbol_shadow.py"
      - ".github/workflows/xray-alpaca-root-asof-frozen-selftest-regression.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_root_asof_260_four_symbol_shadow.py"
      - ".github/workflows/xray-alpaca-root-asof-frozen-selftest-regression.yml"
permissions:
  contents: read
jobs:
  frozen-source-with-current-root-unchanged:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check SHA and frozen offline source with adversarial ASOF gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0"
          python -m py_compile nasdaq-xray/alpaca_root_asof_260_four_symbol_shadow.py
          python nasdaq-xray/alpaca_root_asof_260_four_symbol_shadow.py --selftest
          python -O nasdaq-xray/alpaca_root_asof_260_four_symbol_shadow.py --selftest
          echo "XRAY_ARCHIVED_TEST_ONLY=PASS_NO_LIVE_PROVIDER_NO_PRIMARY_NO_R92"
