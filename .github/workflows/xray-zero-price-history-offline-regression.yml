name: XRAY Zero PRICE History Alpaca Massive Source Regression
on:
  pull_request:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_full_scope_260_shadow.py"
      - "nasdaq-xray/grouped_history_full_pipeline_selftest.py"
      - ".github/workflows/xray-zero-price-history-offline-regression.yml"
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/alpaca_full_scope_260_shadow.py"
      - "nasdaq-xray/grouped_history_full_pipeline_selftest.py"
      - ".github/workflows/xray-zero-price-history-offline-regression.yml"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Reproduce current 0-PRICE scope safely and test 260/52 synthetic positives
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check "pandas_market_calendars==5.4.0" "cryptography>=44,<47"
          python -m py_compile nasdaq-xray/alpaca_full_scope_260_shadow.py nasdaq-xray/grouped_history_full_pipeline_selftest.py
          python nasdaq-xray/alpaca_full_scope_260_shadow.py --selftest
          python nasdaq-xray/grouped_history_full_pipeline_selftest.py
          echo "XRAY_ALPACA_MASSIVE_ZERO_PASS_OFFLINE=PASS_NO_NETWORK_NO_PRIMARY_NO_R92"
