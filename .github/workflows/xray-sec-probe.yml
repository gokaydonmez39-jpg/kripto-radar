name: XRAY SEC Host Probe
on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/sec_companyfacts_probe.py"
      - ".github/workflows/xray-sec-probe.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nasdaq-xray/sec_companyfacts_probe.py
      - name: Commit evidence
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add nasdaq-xray/sec_companyfacts_probe.json
          git commit -m "chore(xray): SEC host probe evidence [skip ci]" || exit 0
          git pull --rebase origin main
          git push
