name: XRAY Canonical Current Post-MC Factory
# MANUAL_3159_509_FULL_SCOPE_REBIND_TRIGGER_20261007
# FULL_SCOPE_RESOLVER_V16_9BLOCK_REBIND_TRIGGER_20261007
# CURRENT_PRICE_9_BLOCK_PROVENANCE_REBIND_TRIGGER_20261007
# CURRENT_MASTER_85_IDENTITY_EXACT_REPLAY_TRIGGER_20261007
# MANUAL_CURRENT_MC_PROVENANCE_REBIND_TRIGGER_20261007
# CURRENT_PRICE_509_ZERO_BLOCK_POST_MC_REBIND_TRIGGER_20261007
# CURRENT_PRICE_BBCI_FAIL_REBIND_TRIGGER_20261008

# EVENT_DISCOVERY_OPTIONAL_OFFICIAL_PRIMARY_REPLAY_20261006

# manual deep-cache persistence replay trigger: 2026-10-06T22:52Z
# CURRENT_HEAD_RECOVERY_TRIGGER_2026_10_06_V6_EXACT_ASOF_FINAL_REPLAY

on:
  # Upstream uses immutable-main double-read and explicit workflow_dispatch.
  # Schedule remains an independent fallback; avoid duplicate workflow_run jobs.
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/canonical_current_price_dv30.json"
      - "nasdaq-xray/canonical_resolver_bridge_*.json"
      - "nasdaq-xray/build_resolver_full_scope_handoff.py"
      - "nasdaq-xray/canonical_mc_bridge_*.json"
      - "nasdaq-xray/build_mc_provenance_rebind.py"
      - "nasdaq-xray/post_mc_source_readiness.py"
      - "nasdaq-xray/history_phase.py"
      - "nasdaq-xray/post_mc_history_legal_reuse_guard.py"
      - "nasdaq-xray/post_mc_live_source_guard.py"
      - "nasdaq-xray/history_official_identity_evidence.json"
      - "nasdaq-xray/canonical_history_evidence_bridge_*.json"
      - "nasdaq-xray/legal_phase.py"
      - "nasdaq-xray/build_stage1_input.py"
      - "nasdaq-xray/alpha_semantics.py"
      - "nasdaq-xray/stage1_shadow.py"
      - "nasdaq-xray/regime_breadth_shadow.py"
      - "nasdaq-xray/deep_pre_r1_shadow.py"
      - "nasdaq-xray/build_current_event_request.py"
      - "nasdaq-xray/chatgpt_compiled_policy_v3.json"
      - ".github/workflows/xray-canonical-current-post-mc.yml"
  schedule:
    - cron: "50 5-23 * * 1-5"
    - cron: "50 0-3 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight exact rebuild merely because a newer trigger exists.
  # GitHub keeps at most one pending successor in this group; any source drift is
  # fail-closed again at the commit-stage exact diff guard (STALE_SOURCE_ABORT).
  # This prevents skipped/non-authoritative workflow_run events from starving the
  # long HISTORY/Stage1 rebuild by repeatedly cancelling it before publication.
  group: xray-canonical-current-post-mc-v12
  cancel-in-progress: false

jobs:
  post-mc:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Enforce immutable resolver and MC authority artifacts
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if not before or set(before)=={"0"}:
              raise SystemExit(0)
          subprocess.run(["git","fetch","--no-tags","--depth=1","origin",before],check=True)
          out=subprocess.check_output(
              ["git","diff","--name-status",before,after,"--",
               "nasdaq-xray/canonical_resolver_bridge_*.json",
               "nasdaq-xray/canonical_mc_bridge_*.json"],
              text=True,
          )
          for line in out.splitlines():
              parts=line.split(maxsplit=2)
              if len(parts)<2:
                  continue
              status,path=parts[0],parts[1]
              immutable=(
                  (path.startswith("nasdaq-xray/canonical_resolver_bridge_")
                   or path.startswith("nasdaq-xray/canonical_mc_bridge_"))
                  and path.endswith(".json")
              )
              if immutable and not status.startswith("A"):
                  raise SystemExit(
                      "IMMUTABLE_AUTHORITY_ARTIFACT_MUTATION_FORBIDDEN_USE_SUCCESSOR "
                      f"status={status} path={path}"
                  )
          PY
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Frozen exact terminal no-op guard
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib,json,os,pathlib
          root=pathlib.Path("nasdaq-xray")
          def blob_sha(p):
              b=p.read_bytes()
              return hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          try:
              t=json.load(open(root/"canonical_current_terminal.json"))
              p=json.load(open(root/"chatgpt_canonical_state_v2.json"))
              ps=p.get("state_json") or {}
              if isinstance(ps,str): ps=json.loads(ps)
              evidence=t.get("evidence") or {}
              checks=[
                ("master","canonical_current_master_manifest.json"),
                ("price","canonical_current_price_dv30.json"),
                ("history","canonical_current_history.json"),
                ("legal","canonical_current_legal.json"),
                ("stage1_input","canonical_current_stage1_input.json"),
                ("stage1","canonical_current_stage1.json"),
                ("regime","canonical_current_regime.json"),
                ("deep_geometry","canonical_current_deep_geometry.json"),
                ("event_request","canonical_current_event_request.json"),
              ]
              exact=(
                t.get("status")=="FULL_E2E_RESEARCH_PASS"
                and t.get("full_end_to_end_research_pass") is True
                and str(t.get("asof_et") or "")==str(ps.get("asof_et") or "")
                and ((ps.get("work_cursor") or {}).get("PHASE")=="TERMINAL")
              )
              for key,fn in checks:
                  fp=root/fn
                  ev=evidence.get(key) or {}
                  exact=exact and fp.exists() and ev.get("blob_sha")==blob_sha(fp)
              mc=evidence.get("mc") or {}
              mcp=pathlib.Path(mc.get("path") or "")
              exact=exact and mcp.exists() and mc.get("blob_sha")==blob_sha(mcp)
              # Any push reaching this workflow means a declared Post-MC input
              # (MC bridge, policy, history/legal/alpha source, or this workflow)
              # changed. Never reuse a frozen snapshot on such a push; rebuild once
              # and let later schedule/dispatch runs no-op only after exact artifacts exist.
              if os.getenv("GITHUB_EVENT_NAME")=="push":
                  exact=False
              # A FULL artifact snapshot is frozen only while the alpha source
              # implementation that produced it is still exact-current.
              try:
                  ft=json.load(open(root/"canonical_current_final_tech.json"))
                  impl=ft.get("semantic_impl_blobs") or {}
                  for fn in ("alpha_semantics.py","stage1_shadow.py","regime_breadth_shadow.py","deep_pre_r1_shadow.py"):
                      exact=exact and impl.get(fn)==blob_sha(root/fn)
              except Exception:
                  exact=False
              print("frozen="+("true" if exact else "false"))
              print("reason="+("FROZEN_EXACT_COMPLETED_TERMINAL" if exact else "REBUILD_REQUIRED_OR_BINDING_DRIFT"))
          except Exception as e:
              print("frozen=false")
              print("reason=FREEZE_GUARD_ERROR_"+type(e).__name__)
          PY

      - name: Frozen completed epoch healthy no-op
        if: steps.freeze.outputs.frozen == 'true'
        run: echo "XRAY_POST_MC=HEALTHY_NOOP_EXACT_TERMINAL"

      - name: Check full-scope resolver handoff eligibility
        id: resolver_gate
        if: steps.freeze.outputs.frozen != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib,json,pathlib
          root=pathlib.Path("nasdaq-xray")
          p=json.load(open(root/"canonical_current_price_dv30.json"))
          q=json.load(open(root/"canonical_current_resolver_request.json"))
          cm=json.load(open(root/"canonical_current_resolver_chunk_manifest.json"))
          def bsha(path):
              b=path.read_bytes()
              return hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          def hlines(values):
              return hashlib.sha256("\n".join(values).encode()).hexdigest()
          def eligibility(unknown,blocked,symbols,settlement_ok):
              return bool(len(unknown)==0 and symbols==blocked and settlement_ok)
          # Expected upstream UNKNOWN is a valid fail-closed pending state, not
          # an invariant failure. Prove both pending and terminal paths are live.
          assert eligibility(["AAA"],[],["AAA"],False) is False
          assert eligibility([],["BBB"],["BBB"],True) is True
          required=True; already_proven=True
          assert ((required is not True) or already_proven) is True

          unknown=list(p.get("unknown_symbols") or [])
          blocked=list(p.get("blocked_symbols") or [])
          assert int(p.get("unknown_count",len(unknown)))==len(unknown),"PRICE_UNKNOWN_COUNT_MISMATCH"
          assert int(p.get("blocked_count",len(blocked)))==len(blocked),"PRICE_BLOCKED_COUNT_MISMATCH"
          assert unknown==sorted(unknown) and len(unknown)==len(set(unknown)),"PRICE_UNKNOWN_SET_INVALID"
          assert blocked==sorted(blocked) and len(blocked)==len(set(blocked)),"PRICE_BLOCKED_SET_INVALID"
          symbols=list(q.get("symbols") or [])
          expected_scope=sorted(set(unknown)|set(blocked))
          assert symbols==expected_scope,"RESOLVER_REQUEST_SCOPE_NOT_PRICE_UNKNOWN_UNION_BLOCKED"
          assert int(q.get("symbol_count",len(symbols)))==len(symbols),"RESOLVER_REQUEST_SYMBOL_COUNT_MISMATCH"
          assert q.get("source_price_path")=="nasdaq-xray/canonical_current_price_dv30.json"
          assert q.get("source_price_blob_sha")==bsha(root/"canonical_current_price_dv30.json"),"RESOLVER_REQUEST_PRICE_BINDING_DRIFT"
          assert int(q.get("source_price_pass_count",-1))==int(p.get("pass_count",-2)),"RESOLVER_REQUEST_PASS_COUNT_DRIFT"
          assert q.get("source_price_pass_hash")==p.get("pass_hash"),"RESOLVER_REQUEST_PASS_HASH_DRIFT"
          assert int(q.get("price_unknown_count",-1))==len(unknown),"RESOLVER_REQUEST_UNKNOWN_COUNT_DRIFT"
          assert int(q.get("price_blocked_count",-1))==len(blocked),"RESOLVER_REQUEST_BLOCKED_COUNT_DRIFT"
          assert cm.get("request_blob_sha")==bsha(root/"canonical_current_resolver_request.json"),"RESOLVER_MANIFEST_REQUEST_BINDING_DRIFT"
          assert cm.get("coverage_complete") is True,"RESOLVER_MANIFEST_COVERAGE_INCOMPLETE"
          assert int(cm.get("symbol_count",-1))==len(symbols),"RESOLVER_MANIFEST_SCOPE_COUNT_DRIFT"
          assert cm.get("symbol_hash")==hlines(symbols),"RESOLVER_MANIFEST_SCOPE_HASH_DRIFT"
          ca=cm.get("compact_authority") or {}
          assert ca.get("source_price_blob_sha")==bsha(root/"canonical_current_price_dv30.json"),"COMPACT_PRICE_BINDING_DRIFT"
          assert int(ca.get("price_unknown_count",-1))==len(unknown),"COMPACT_UNKNOWN_COUNT_DRIFT"
          assert int(ca.get("price_blocked_count",-1))==len(blocked),"COMPACT_BLOCKED_COUNT_DRIFT"
          assert int(ca.get("resolver_symbol_count",-1))==len(symbols),"COMPACT_RESOLVER_COUNT_DRIFT"
          assert ca.get("resolver_symbol_hash")==hlines(symbols),"COMPACT_RESOLVER_HASH_DRIFT"
          residual_exact=(symbols==blocked)
          settlement_ok=(
              q.get("settlement_required") is not True
              or q.get("settlement_already_proven") is True
          )
          eligible=eligibility(unknown,blocked,symbols,settlement_ok)
          print("eligible="+("true" if eligible else "false"))
          print("price_unknown_count="+str(len(unknown)))
          print("price_blocked_count="+str(len(blocked)))
          print("residual_symbol_count="+str(len(symbols)))
          print("residual_exact="+("true" if residual_exact else "false"))
          def operational_reason(unknown, blocked, symbols, settlement_ok):
              if unknown:
                  return "CURRENT_PRICE_UNKNOWN_NEVER_PASS"
              if symbols!=blocked:
                  return "RESIDUAL_SCOPE_MISMATCH_FAIL_CLOSED"
              if not settlement_ok:
                  return "SETTLEMENT_REQUIRED_NOT_PROVEN_FAIL_CLOSED"
              return ("CURRENT_FAIL_ONLY_RESIDUAL_READY_FOR_FULL_SCOPE_HANDOFF" if blocked
                      else "CURRENT_COMPLETE_PRICE_READY_FOR_FULL_SCOPE_HANDOFF")
          assert operational_reason([],["T"],["T"],False)=="SETTLEMENT_REQUIRED_NOT_PROVEN_FAIL_CLOSED"
          assert operational_reason(["T"],["T"],["T"],True)=="CURRENT_PRICE_UNKNOWN_NEVER_PASS"
          assert operational_reason([],["T"],[],True)=="RESIDUAL_SCOPE_MISMATCH_FAIL_CLOSED"
          assert operational_reason([],["T"],["T"],True)=="CURRENT_FAIL_ONLY_RESIDUAL_READY_FOR_FULL_SCOPE_HANDOFF"
          print("reason="+operational_reason(unknown,blocked,symbols,settlement_ok))
          PY

      - name: Build exact current full-scope resolver handoff
        id: resolver_handoff
        if: steps.freeze.outputs.frozen != 'true' && steps.resolver_gate.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python nasdaq-xray/build_resolver_full_scope_handoff.py --selftest
          python nasdaq-xray/build_resolver_full_scope_handoff.py | tee /tmp/resolver_handoff_out
          cat /tmp/resolver_handoff_out >> "$GITHUB_OUTPUT"

      - name: Rebind exact current MC provenance without remeasurement
        id: mc_rebind
        if: steps.freeze.outputs.frozen != 'true' && steps.resolver_gate.outputs.eligible == 'true' && steps.resolver_handoff.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python nasdaq-xray/build_mc_provenance_rebind.py --selftest
          python nasdaq-xray/build_mc_provenance_rebind.py | tee /tmp/mc_rebind_out
          cat /tmp/mc_rebind_out >> "$GITHUB_OUTPUT"
      - name: Validate full immutable MC chain head selector
        if: steps.freeze.outputs.frozen != 'true' && steps.resolver_gate.outputs.eligible == 'true' && steps.resolver_handoff.outputs.ready == 'true' && steps.mc_rebind.outputs.ready != 'false'
        shell: bash
        run: |
          python nasdaq-xray/mc_zero_dollar_successor_shadow_audit.py --selftest
          python - <<'PY'
          import sys
          sys.path.insert(0,"nasdaq-xray")
          from mc_zero_dollar_successor_shadow_audit import select_active_mc_row
          root={"rel":"r","blob":"a","obj":{}}
          middle={"rel":"m","blob":"b","obj":{"supersedes_mc_bridge_path":"r","supersedes_mc_bridge_blob_sha":"a"}}
          tip={"rel":"t","blob":"c","obj":{"supersedes_mc_bridge_path":"m","supersedes_mc_bridge_blob_sha":"b"}}
          assert select_active_mc_row([root,middle,tip])["rel"]=="t"
          try:
              select_active_mc_row([root,tip])
          except AssertionError as exc:
              assert "MC_SUPERSESSION_PREDECESSOR_MISMATCH" in str(exc)
          else:
              raise AssertionError("FILTERED_CHAIN_MUST_NOT_PROMOTE")
          fork={"rel":"fork","blob":"d","obj":{"supersedes_mc_bridge_path":"m","supersedes_mc_bridge_blob_sha":"b"}}
          try:
              select_active_mc_row([root,middle,tip,fork])
          except AssertionError as exc:
              assert "MC_ACTIVE_HEAD_COUNT:2" in str(exc)
          else:
              raise AssertionError("INDEPENDENT_FORK_MUST_FAIL_CLOSED")
          print("XRAY_MC_GLOBAL_LINEAGE_SELECTION_SELFTEST=PASS")
          PY
      - name: Find exact-bound committed MC bridge
        id: mc
        if: steps.freeze.outputs.frozen != 'true' && steps.resolver_gate.outputs.eligible == 'true' && steps.resolver_handoff.outputs.ready == 'true' && steps.mc_rebind.outputs.ready != 'false'
        shell: bash
        run: |
          set -e
          python - <<'PY' > /tmp/mc_out
          import glob,hashlib,json,pathlib,sys
          sys.path.insert(0,"nasdaq-xray")
          from mc_zero_dollar_successor_shadow_audit import select_active_mc_row
          price_path=pathlib.Path("nasdaq-xray/canonical_current_price_dv30.json")
          master_path=pathlib.Path("nasdaq-xray/canonical_current_master_manifest.json")
          pointer_path=pathlib.Path("nasdaq-xray/chatgpt_canonical_state_v2.json")
          if not price_path.exists() or not master_path.exists() or not pointer_path.exists():
              print("ready=false")
              raise SystemExit
          p=json.load(open(price_path)); m=json.load(open(master_path)); ptr=json.load(open(pointer_path))
          ps=ptr.get("state_json") or {}
          if isinstance(ps,str): ps=json.loads(ps)
          if not isinstance(ps,dict): print("ready=false"); raise SystemExit
          if p.get("schema")!="XRAY_CANONICAL_PRICE_DV30_V1" or m.get("schema")!="XRAY_CANONICAL_CURRENT_MASTER_MANIFEST_V1":
              print("ready=false"); print("binding_fault=false"); print("pending_reason=PRICE_OR_MASTER_SCHEMA_MISMATCH"); raise SystemExit
          if p.get("asof_et")!=m.get("asof_et") or p.get("source_master_queue_hash")!=m.get("queue_hash") or p.get("source_master_count")!=m.get("queue_total"):
              print("ready=false"); print("binding_fault=false"); print("pending_reason=PRICE_MASTER_BINDING_DRIFT"); raise SystemExit
          price_unknown=int(p.get("unknown_count",len(p.get("unknown_symbols") or [])))
          if price_unknown!=len(p.get("unknown_symbols") or []):
              print("ready=false"); print("binding_fault=true"); print("pending_reason=PRICE_UNKNOWN_COUNT_MISMATCH"); raise SystemExit
          if price_unknown:
              print("ready=false"); print("binding_fault=false"); print("pending_reason=PRICE_DV30_UNKNOWN"); print("price_unknown_count="+str(price_unknown)); raise SystemExit
          b=price_path.read_bytes()
          price_blob=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          expected_asof=p["asof_et"]; expected_hash=p["pass_hash"]; expected_count=p["pass_count"]
          pointer_asof=str(ps.get("asof_et") or "")
          settlement_required=bool(pointer_asof and expected_asof>pointer_asof)
          expected_path="nasdaq-xray/canonical_current_price_dv30.json"
          rows=[]
          # Collect complete same-ASOF immutable lineage before filtering current
          # PRICE matches; intermediate predecessors may have older price blobs.
          all_mc=[]
          # Scope the immutable MC graph to the exact frozen ASOF+policy family.
          # Other filename epochs must never create a second current MC head.
          epoch=expected_asof.replace("-","")
          for fp in sorted(glob.glob(f"nasdaq-xray/canonical_mc_bridge_{epoch}_c417_dv30_v*.json")):
              try:
                  j=json.load(open(fp))
                  if (j.get("schema")=="XRAY_MC_EPOCH_RESULT_V1"
                      and j.get("status")=="COMMITTED"
                      and j.get("asof_et")==expected_asof
                      and j.get("task_id")=="6a825366222081918997094d76e6ae46"
                      and j.get("execution")=="NONE"
                      and j.get("real_money")=="NO-GO"
                      and j.get("unknown_never_pass") is True):
                      bb=pathlib.Path(fp).read_bytes()
                      ss=hashlib.sha1(f"blob {len(bb)}\0".encode()+bb).hexdigest()
                      all_mc.append({"rel":fp,"obj":j,"blob":ss})
                  expected_set=set(p.get("pass_symbols") or [])
                  primary=set(j.get("primary_pass_symbols") or [])
                  mcfail=set(j.get("primary_fail_symbols") or [])
                  watch=set(j.get("fallback_watch_symbols") or [])
                  fallback_fail=set(j.get("fallback_fail_symbols") or j.get("fallback_two_source_fail_symbols") or [])
                  mcunk=set(j.get("unknown_symbols") or [])
                  groups=[primary,mcfail,watch,fallback_fail,mcunk]
                  counts=j.get("counts") or {}
                  results=j.get("results") or {}
                  disjoint=all(not (groups[a]&groups[b]) for a in range(len(groups)) for b in range(a+1,len(groups)))
                  partition_ok=(
                    disjoint
                    and primary|mcfail|watch|fallback_fail|mcunk==expected_set
                    and set(results)==expected_set
                    and int(counts.get("MC_PASS_PRIMARY",-1))==len(primary)
                    and int(counts.get("MC_FAIL_PRIMARY",-1))==len(mcfail)
                    and int(counts.get("MC_PASS_FALLBACK_WATCH",-1))==len(watch)
                    and int(counts.get("MC_FAIL_FALLBACK_TWO_SOURCE",counts.get("MC_FAIL_FALLBACK",-1)))==len(fallback_fail)
                    and int(counts.get("MC_UNKNOWN",-1))==len(mcunk)
                    and int(counts.get("TOTAL",-1))==len(expected_set)
                    and all((results.get(s) or {}).get("status")=="MC_PASS_PRIMARY" for s in primary)
                    and all((results.get(s) or {}).get("status")=="MC_FAIL_PRIMARY" for s in mcfail)
                    and all((results.get(s) or {}).get("status")=="MC_PASS_FALLBACK_WATCH" for s in watch)
                    and all((results.get(s) or {}).get("status")=="MC_FAIL_FALLBACK_TWO_SOURCE" for s in fallback_fail)
                    and all((results.get(s) or {}).get("status")=="MC_UNKNOWN" for s in mcunk)
                  )
                  ok=(
                    j.get("schema")=="XRAY_MC_EPOCH_RESULT_V1"
                    and j.get("status")=="COMMITTED"
                    and j.get("task_id")=="6a825366222081918997094d76e6ae46"
                    and j.get("execution")=="NONE" and j.get("real_money")=="NO-GO"
                    and j.get("asof_et")==expected_asof
                    and j.get("input_path")==expected_path
                    and j.get("input_pass_hash")==expected_hash
                    and j.get("policy_hash")=="68684c130849016dd5148c1afdaa888766dc8070506af892420e493629a92fa4"
                    and j.get("policy_version")=="C4.17"
                    and int(j.get("input_count",-1))==int(expected_count)
                    and (j.get("counts") or {}).get("TOTAL")==expected_count
                    and partition_ok
                    and set((j.get("results") or {}).keys())==set(p.get("pass_symbols") or [])
                    and (
                      (not settlement_required and j.get("settlement_witness_status") in (None,"NOT_REQUIRED_POINTER_ASOF","PASS"))
                      or (
                        settlement_required
                        and j.get("settlement_witness_status")=="PASS"
                        and bool(j.get("settlement_witness_path"))
                        and bool(j.get("settlement_witness_blob_sha"))
                      )
                    )
                  )
                  if ok and settlement_required:
                      sw=pathlib.Path(j["settlement_witness_path"])
                      if not sw.exists():
                          ok=False
                      else:
                          sb=sw.read_bytes()
                          ssha=hashlib.sha1(f"blob {len(sb)}\0".encode()+sb).hexdigest()
                          try: sj=json.loads(sb)
                          except Exception: sj={}
                          ok=(
                            ssha==j["settlement_witness_blob_sha"]
                            and sj.get("schema")=="XRAY_RESOLVER_EPOCH_RESULT_V1"
                            and sj.get("status")=="COMMITTED"
                            and sj.get("asof_et")==expected_asof
                            and sj.get("queue_hash")==m.get("queue_hash")
                            and sj.get("compiled_policy_hash")=="68684c130849016dd5148c1afdaa888766dc8070506af892420e493629a92fa4"
                            and sj.get("compiled_policy_version")=="C4.17"
                            and sj.get("settlement_status")=="PASS"
                          )
                  if ok:
                      fb=pathlib.Path(fp).read_bytes()
                      fsha=hashlib.sha1(f"blob {len(fb)}\0".encode()+fb).hexdigest()
                      rows.append((fp,j,j.get("input_blob_sha")==price_blob,fsha))
              except Exception:
                  pass
          # Resolve the globally single immutable head, NOT locally filtered
          # rows. A legitimate predecessor can have an older same-policy PRICE
          # blob; filtering it first splits one SHA-verified chain into two
          # spurious active heads (DUPLICATE_MC_BINDING).
          # If two independent immutable heads exist, retain fail-closed.
          # Diagnostic-only immutable lineage audit: file names and SHA
          # relations, never market data or private account state.
          all_idx={row["rel"]:row for row in all_mc}
          superseded_edges=set()
          invalid_links=[]
          for link in all_mc:
              parent=link["obj"].get("supersedes_mc_bridge_path")
              witness=link["obj"].get("supersedes_mc_bridge_blob_sha")
              if parent or witness:
                  pred=all_idx.get(parent)
                  if pred is None or pred["blob"]!=witness:
                      invalid_links.append({"child":link["rel"],"parent":parent,
                                            "reason":"MISSING_OR_SHA_MISMATCH"})
                  else:
                      superseded_edges.add(parent)
          heads=sorted(row["rel"] for row in all_mc if row["rel"] not in superseded_edges)
          print("XRAY_MC_GLOBAL_HEAD_DIAGNOSTIC="+json.dumps({
              "scanned":len(all_mc),"heads":heads,"invalid_links":invalid_links},sort_keys=True))
          try:
              canonical_head=select_active_mc_row(all_mc)["rel"]
          except AssertionError as e:
              print("ready=false")
              print("binding_fault=true")
              print("pending_reason=AMBIGUOUS_IMMUTABLE_MC_HEAD")
              print("mc_chain_guard="+str(e))
              raise SystemExit
          eligible=[row for row in rows if row[0]==canonical_head]
          exact=[row[0] for row in eligible if row[2]]
          semantic=[row[0] for row in eligible if not row[2]]
          if len(exact)==1:
              fp=exact[0]
          elif len(exact)>1:
              fp=None
          elif len(semantic)==1:
              fp=semantic[0]
          else:
              fp=None
          if fp is None:
              duplicate=bool(len(exact)>1 or len(semantic)>1)
              print("ready=false")
              print("binding_fault="+("true" if duplicate else "false"))
              print("pending_reason="+("DUPLICATE_MC_BINDING" if duplicate else "EXACT_MC_NOT_COMMITTED_YET"))
              print("expected_asof="+str(expected_asof))
              print("exact_binding_matches="+str(len(exact)))
              print("semantic_binding_matches="+str(len(semantic)))
          else:
              print("ready=true")
              print("binding_fault=false")
              print("pending_reason=NONE")
              print("path="+fp)
              print("asof="+expected_asof)
              try:
                  chosen=json.load(open(fp))
                  input_blob_exact=(chosen.get("input_blob_sha")==price_blob)
              except Exception:
                  input_blob_exact=False
              print("price_blob_sha="+price_blob)
              print("input_pass_hash="+expected_hash)
              print("mc_input_blob_exact="+("true" if input_blob_exact else "false"))
              print("mc_semantic_rebind="+("false" if input_blob_exact else "true"))
          PY
          cat /tmp/mc_out >> "$GITHUB_OUTPUT"
          cat /tmp/mc_out

      - name: Commit newly built immutable resolver and MC authority before alpha
        id: early_authority
        if: steps.resolver_handoff.outputs.created == 'true' || (steps.mc.outputs.ready == 'true' && steps.mc_rebind.outputs.created == 'true')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          files=()
          if [[ "${{ steps.resolver_handoff.outputs.created }}" == "true" && -n "${{ steps.resolver_handoff.outputs.path }}" ]]; then
            files+=("${{ steps.resolver_handoff.outputs.path }}")
          fi
          if [[ "${{ steps.mc_rebind.outputs.created }}" == "true" && -n "${{ steps.mc_rebind.outputs.path }}" ]]; then
            files+=("${{ steps.mc_rebind.outputs.path }}")
          fi
          [[ "${#files[@]}" -gt 0 ]] || {
            echo "XRAY_EARLY_AUTHORITY_COMMIT=NO_NEW_AUTHORITY"
            echo "baseline_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          declare -A expected_blob
          for p in "${files[@]}"; do
            [[ -f "$p" ]] || { echo "XRAY_EARLY_AUTHORITY_COMMIT=MISSING_GENERATED_FILE:$p" >&2; exit 1; }
            mkdir -p "$tmpdir/$(dirname "$p")"
            cp "$p" "$tmpdir/$p"
            expected_blob["$p"]="$(git hash-object "$p")"
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            latest="$(git rev-parse origin/main)"
            if [[ "$latest" != "$GITHUB_SHA" ]]; then
              changed="$(git diff --name-only "$GITHUB_SHA" "$latest" -- \
                .github/workflows/xray-canonical-current-post-mc.yml \
                nasdaq-xray/canonical_current_master_manifest.json \
                nasdaq-xray/canonical_current_price_dv30.json \
                nasdaq-xray/canonical_current_resolver_request.json \
                nasdaq-xray/canonical_current_resolver_chunk_manifest.json \
                nasdaq-xray/canonical_resolver_bridge_*.json \
                nasdaq-xray/build_resolver_full_scope_handoff.py \
                nasdaq-xray/canonical_mc_bridge_*.json \
                nasdaq-xray/build_mc_provenance_rebind.py \
                nasdaq-xray/chatgpt_compiled_policy_v3.json || true)"
              if [[ -n "$changed" ]]; then
                echo "XRAY_EARLY_AUTHORITY_COMMIT=STALE_SOURCE_ABORT"
                printf '%s\n' "$changed"
                echo "baseline_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
                echo "stale=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            git reset --hard origin/main
            collision=false
            for p in "${files[@]}"; do
              if [[ -f "$p" ]]; then
                actual="$(git hash-object "$p")"
                if [[ "$actual" != "${expected_blob[$p]}" ]]; then
                  echo "XRAY_EARLY_AUTHORITY_COMMIT=IMMUTABLE_PATH_COLLISION:$p expected=${expected_blob[$p]} actual=$actual" >&2
                  collision=true
                  break
                fi
              else
                mkdir -p "$(dirname "$p")"
                cp "$tmpdir/$p" "$p"
              fi
            done
            [[ "$collision" == "false" ]] || exit 1
            git add "${files[@]}"
            if git diff --cached --quiet; then
              echo "XRAY_EARLY_AUTHORITY_COMMIT=ALREADY_EXACT"
              echo "baseline_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "stale=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore(xray): commit immutable current resolver MC authority"
            if git push origin HEAD:main; then
              echo "XRAY_EARLY_AUTHORITY_COMMIT=PASS"
              for p in "${files[@]}"; do
                [[ "$(git hash-object "$p")" == "${expected_blob[$p]}" ]] || exit 1
              done
              echo "baseline_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "stale=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "XRAY_EARLY_AUTHORITY_COMMIT=PUSH_RACE attempt=$attempt"
            sleep $((attempt*2))
          done
          echo "XRAY_EARLY_AUTHORITY_COMMIT=FAIL" >&2
          exit 1

      - name: Fail closed on ambiguous MC binding
        if: steps.freeze.outputs.frozen != 'true' && steps.mc.outputs.ready != 'true' && steps.mc.outputs.binding_fault == 'true'
        shell: bash
        run: |
          echo "XRAY_POST_MC_BINDING=FAIL_CLOSED_DUPLICATE" >&2
          exit 1

      - name: Diagnose current PRICE to MC scope delta
        if: steps.freeze.outputs.frozen != 'true' && steps.mc.outputs.ready != 'true' && steps.mc.outputs.binding_fault != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import glob,json
          p=json.load(open("nasdaq-xray/canonical_current_price_dv30.json"))
          cur=set(p.get("pass_symbols") or [])
          rows=[]
          for fp in sorted(glob.glob("nasdaq-xray/canonical_mc_bridge_*.json")):
              try:
                  j=json.load(open(fp))
                  if not (
                    j.get("schema")=="XRAY_MC_EPOCH_RESULT_V1"
                    and j.get("status")=="COMMITTED"
                    and j.get("asof_et")==p.get("asof_et")
                    and j.get("policy_hash")=="68684c130849016dd5148c1afdaa888766dc8070506af892420e493629a92fa4"
                    and j.get("policy_version")=="C4.17"
                  ):
                      continue
                  old=set(j.get("input_pass_symbols") or (j.get("results") or {}).keys())
                  rows.append({
                    "path":fp,
                    "input_pass_hash":j.get("input_pass_hash"),
                    "current_pass_hash":p.get("pass_hash"),
                    "old_count":len(old),"current_count":len(cur),"overlap":len(old&cur),
                    "added_to_mc":sorted(cur-old),
                    "removed_from_mc":sorted(old-cur),
                  })
              except Exception:
                  pass
          print(json.dumps({"XRAY_MC_SCOPE_DELTA":rows},sort_keys=True))
          PY

      - name: Healthy no-op while resolver or MC commit is pending
        if: steps.freeze.outputs.frozen != 'true' && steps.mc.outputs.ready != 'true' && steps.mc.outputs.binding_fault != 'true'
        run: echo "XRAY_POST_MC=BLOCKED_UPSTREAM_PENDING resolver_gate=${{ steps.resolver_gate.outputs.reason }} resolver_handoff=${{ steps.resolver_handoff.outputs.reason }} mc_reason=${{ steps.mc.outputs.pending_reason }} rebind_reason=${{ steps.mc_rebind.outputs.pending_reason }}"

      - name: Fail closed immediately on stale early authority
        if: steps.early_authority.outputs.stale == 'true'
        run: |
          echo "XRAY_POSTMC_EARLY_AUTHORITY_STALE_FAIL_CLOSED" >&2
          exit 1
      - name: Before-history exact-live Pre-MC active authority guard
        if: steps.mc.outputs.ready == 'true' && steps.early_authority.outputs.stale != 'true'
        env:
          XRAY_MC_AUTHORITY_PATH: ${{ steps.mc.outputs.path }}
        run: |
          set -euo pipefail
          python nasdaq-xray/post_mc_live_source_guard.py --check
      - name: Reuse exact same-ASOF HISTORY and LEGAL
        id: reuse_hl
        if: steps.mc.outputs.ready == 'true'
        shell: bash
        env:
          XRAY_SELECTED_MC: ${{ steps.mc.outputs.path }}
        run: |
          set -euo pipefail
          python nasdaq-xray/post_mc_history_legal_reuse_guard.py \
            --repo-root . \
            --price nasdaq-xray/canonical_current_price_dv30.json \
            --mc "$XRAY_SELECTED_MC" \
            --history nasdaq-xray/canonical_current_history.json \
            --legal nasdaq-xray/canonical_current_legal.json >> "$GITHUB_OUTPUT"

      - name: Compile
        run: |
          python -m py_compile \
            nasdaq-xray/history_phase.py \
            nasdaq-xray/post_mc_history_legal_reuse_guard.py \
            nasdaq-xray/post_mc_history_legal_reuse_guard_selftest.py \
            nasdaq-xray/legal_phase.py \
            nasdaq-xray/build_stage1_input.py \
            nasdaq-xray/alpha_semantics.py \
            nasdaq-xray/test_alpha_semantics.py \
            nasdaq-xray/stage1_shadow.py \
            nasdaq-xray/regime_breadth_shadow.py \
            nasdaq-xray/deep_pre_r1_shadow.py \
            nasdaq-xray/build_current_event_request.py
      - name: Install zero-dollar runtime
        if: steps.mc.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check -r nasdaq-xray/requirements-runtime.txt
      - name: Verify deterministic alpha semantics and semantic reuse guard
        if: steps.mc.outputs.ready == 'true'
        run: |
          python nasdaq-xray/test_alpha_semantics.py
          python nasdaq-xray/post_mc_history_legal_reuse_guard_selftest.py
      - name: Run HISTORY
        if: steps.mc.outputs.ready == 'true' && steps.reuse_hl.outputs.reuse != 'true'
        timeout-minutes: 12
        shell: bash
        run: |
          XRAY_HISTORY_INPUT="$GITHUB_WORKSPACE/${{ steps.mc.outputs.path }}" \
          XRAY_HISTORY_CACHE_DIR="$RUNNER_TEMP/xray-history-cache" \
          XRAY_HISTORY_OUT="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_history.json" \
          XRAY_HISTORY_HTTP_TIMEOUT_SECONDS="20" XRAY_HISTORY_PROVIDER_MAX_INFLIGHT="6" \
          XRAY_ASOF="${{ steps.mc.outputs.asof }}" XRAY_HISTORY_WORKERS="8" \
          python nasdaq-xray/history_phase.py
      - name: Revalidate reused HISTORY and hydrate same-run technical cache
        id: history_revalidate
        if: steps.mc.outputs.ready == 'true' && steps.reuse_hl.outputs.reuse == 'true'
        timeout-minutes: 12
        shell: bash
        env:
          XRAY_HISTORY_CACHE_DIR: ${{ runner.temp }}/xray-history-cache
        run: |
          set -euo pipefail
          XRAY_HISTORY_INPUT="$GITHUB_WORKSPACE/${{ steps.mc.outputs.path }}" \
          XRAY_HISTORY_CACHE_DIR="$RUNNER_TEMP/xray-history-cache" \
          XRAY_HISTORY_OUT="$RUNNER_TEMP/xray-history-revalidated.json" \
          XRAY_HISTORY_HTTP_TIMEOUT_SECONDS="20" XRAY_HISTORY_PROVIDER_MAX_INFLIGHT="6" \
          XRAY_ASOF="${{ steps.mc.outputs.asof }}" XRAY_HISTORY_WORKERS="8" \
          python nasdaq-xray/history_phase.py
          python - <<'PY'
          import json,os,pathlib,subprocess
          def blob_sha(p):
              return subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
          canonical=pathlib.Path("nasdaq-xray/canonical_current_history.json")
          revalidated=pathlib.Path(os.environ["RUNNER_TEMP"])/"xray-history-revalidated.json"
          current_mc=pathlib.Path("${{ steps.mc.outputs.path }}")
          expected_mc_rel="${{ steps.mc.outputs.path }}"
          old=json.load(open(canonical))
          new=json.load(open(revalidated))
          assert old.get("asof_et")==new.get("asof_et"),(old.get("asof_et"),new.get("asof_et"))
          # Exact-ASOF missing provider bars are UNKNOWN, not a candidate PASS.
          unknown=sorted(set(new.get("unknown_symbols") or []))
          assert int(new.get("unknown_count",-1))==len(unknown),"UNKNOWN_COUNT_DRIFT"
          assert old.get("input_count")==new.get("input_count"),(old.get("input_count"),new.get("input_count"))
          assert (new.get("source_mc_artifact") or new.get("source_mc_path"))==expected_mc_rel
          assert new.get("source_mc_blob_sha")==blob_sha(current_mc)
          if unknown:
              diag={"schema":"XRAY_HISTORY_REVALIDATION_PENDING_V1",
                    "asof_et":new["asof_et"],
                    "status":"PENDING_PROVIDER_EXACT_ASOF",
                    "execution":"NONE","real_money":"NO-GO",
                    "unknown_never_pass":True,"alpha_authority":False,
                    "old_history_unchanged":True,
                    "source_mc_blob_sha":new.get("source_mc_blob_sha"),
                    "unknown_count":len(unknown),"unknown_symbols":unknown}
              path=pathlib.Path(os.environ["RUNNER_TEMP"])/"xray-history-revalidation-pending.json"
              path.write_text(json.dumps(diag,sort_keys=True,indent=2)+"\n")
              with open(os.environ["GITHUB_OUTPUT"],"a") as f:
                  f.write("ready=false\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
                  f.write("### HISTORY revalidation PENDING — no promotion\n\n")
                  f.write("Unresolved exact-ASOF: "+", ".join(unknown)+"\n\n")
                  f.write("Downstream technical rebuild skipped; no invented bars.\n")
              print("XRAY_HISTORY_REVALIDATION=PENDING_PROVIDER_EXACT_ASOF",unknown)
              raise SystemExit(0)
          assert old.get("pass_hash")==new.get("pass_hash"),(old.get("pass_hash"),new.get("pass_hash"))
          assert set(old.get("pass_symbols") or [])==set(new.get("pass_symbols") or [])
          old_status={k:(v or {}).get("status") for k,v in (old.get("results") or {}).items()}
          new_status={k:(v or {}).get("status") for k,v in (new.get("results") or {}).items()}
          assert old_status==new_status
          canonical.write_bytes(revalidated.read_bytes())
          promoted=json.load(open(canonical))
          assert promoted.get("source_mc_blob_sha")==blob_sha(current_mc)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("ready=true\n")
          print({"XRAY_REUSED_HISTORY_REVALIDATION":"PASS",
                 "XRAY_REUSED_HISTORY_PROMOTION":"EXACT_CURRENT_MC",
                 "history_blob_sha":blob_sha(canonical),
                 "source_mc_blob_sha":promoted.get("source_mc_blob_sha"),
                 "pass_count":promoted.get("pass_count")})
          PY

      - name: Preserve HISTORY provider-lag evidence
        if: steps.history_revalidate.outputs.ready == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: xray-history-revalidation-pending
          path: ${{ runner.temp }}/xray-history-revalidation-pending.json
          if-no-files-found: error
          retention-days: 7
      - name: Hydrate technical benchmark and ticker-continuity cache
        if: steps.mc.outputs.ready == 'true' && steps.history_revalidate.outputs.ready != 'false'
        shell: bash
        env:
          XRAY_HISTORY_CACHE_DIR: ${{ runner.temp }}/xray-history-cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, sys
          import pandas as pd
          sys.path.insert(0,"nasdaq-xray")
          import akshare as ak
          import history_phase as hp
          h=json.load(open("nasdaq-xray/canonical_current_history.json"))
          asof=str(h["asof_et"])
          passed=set(h.get("pass_symbols") or [])

          need=["date","open","high","low","close","volume"]
          def read_qqq_cache():
              qp=hp._history_cache_path("QQQ")
              if qp is None or not qp.exists():
                  return None
              q=pd.read_csv(qp,compression="gzip")
              cols={str(c).lower():c for c in q.columns}
              if any(k not in cols for k in need):
                  return None
              q=q[[cols[k] for k in need]].copy(); q.columns=need
              q["date"]=pd.to_datetime(q["date"],errors="coerce")
              for k in need[1:]: q[k]=pd.to_numeric(q[k],errors="coerce")
              q=q.dropna().drop_duplicates("date",keep="last").sort_values("date")
              return q[q["date"]<=pd.Timestamp(asof)].reset_index(drop=True)
          def qqq_valid(q):
              return bool(q is not None and len(q)>=260 and not q.empty
                          and q["date"].dt.date.max().isoformat()==asof)

          qdf,_=hp._call_with_retry(lambda: ak.stock_us_daily(symbol="QQQ",adjust=""))
          hp._write_sina_cache("QQQ",qdf)
          q=read_qqq_cache(); qsource="SINA_US_DAILY"
          if not qqq_valid(q):
              ydf,ymeta=hp.yahoo_ohlcv("QQQ",asof)
              hp._write_sina_cache("QQQ",ydf)
              q=read_qqq_cache(); qsource=str((ymeta or {}).get("source") or "YAHOO_CHART_FREE_RAW_OHLCV")
          if not qqq_valid(q):
              raise RuntimeError("TECHNICAL_BENCHMARK_CACHE_ASOF_OR_HISTORY:QQQ")
          print({"XRAY_TECHNICAL_BENCHMARK_CACHE":"PASS","symbol":"QQQ",
                 "bars":len(q),"asof":asof,"source":qsource})

          warmed=[]
          for sym,rec in sorted((hp.OFFICIAL_RECORDS or {}).items()):
              if sym not in passed: continue
              if rec.get("mode")!="OFFICIAL_TICKER_CONTINUITY_COMPOSITE_HISTORY" or rec.get("cusip_unchanged") is not True:
                  continue
              pred=rec.get("predecessor_symbol")
              if not pred: raise RuntimeError("CONTINUITY_PREDECESSOR_MISSING:"+sym)
              df,_=hp._call_with_retry(lambda p=pred: ak.stock_us_daily(symbol=p,adjust=""))
              hp._write_sina_cache(pred,df)
              cp=hp._history_cache_path(pred)
              if cp is None or not cp.exists():
                  raise RuntimeError("CONTINUITY_PREDECESSOR_CACHE_MISSING:"+sym+":"+pred)
              warmed.append(sym+"<-"+pred)
          print({"XRAY_CONTINUITY_PREDECESSOR_CACHE":"PASS","warmed":warmed})
          PY

      - name: Run LEGAL
        if: steps.mc.outputs.ready == 'true' && steps.history_revalidate.outputs.ready != 'false'
        shell: bash
        run: |
          XRAY_LEGAL_HISTORY="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_history.json" \
          XRAY_LEGAL_MASTER="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_full_state.json" \
          XRAY_LEGAL_PROOF="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_legal_proof.json" \
          XRAY_LEGAL_OUT="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_legal.json" \
          XRAY_ASOF="${{ steps.mc.outputs.asof }}" python nasdaq-xray/legal_phase.py
      - name: Build exact Stage1 input
        if: steps.mc.outputs.ready == 'true' && steps.history_revalidate.outputs.ready != 'false'
        shell: bash
        run: |
          XRAY_POST_MC="$GITHUB_WORKSPACE/${{ steps.mc.outputs.path }}" \
          XRAY_POST_HISTORY="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_history.json" \
          XRAY_POST_LEGAL="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_legal.json" \
          XRAY_STAGE1_INPUT_OUT="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_stage1_input.json" \
          python nasdaq-xray/build_stage1_input.py
      - name: Early exact-live Pre-MC SHA fence (FAIL CLOSED on staleness)
        if: steps.mc.outputs.ready == 'true' && steps.history_revalidate.outputs.ready != 'false'
        env:
          XRAY_MC_AUTHORITY_PATH: ${{ steps.mc.outputs.path }}
        run: |
          python nasdaq-xray/post_mc_live_source_guard.py --selftest
          python nasdaq-xray/post_mc_live_source_guard.py --check
      - name: Run Stage1
        if: steps.mc.outputs.ready == 'true' && steps.history_revalidate.outputs.ready != 'false'
        env:
          XRAY_MC_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1_input.json
          XRAY_STAGE1_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1.json
          XRAY_STAGE1_HISTORY_CACHE_DIR: ${{ runner.temp }}/xray-history-cache
          XRAY_STAGE1_CACHE_REQUIRED: "1"
          XRAY_STAGE1_WORKERS: "8"
          XRAY_SPLIT_HTTP_TIMEOUT_SECONDS: "4"
          XRAY_SPLIT_HTTP_RETRIES: "1"
        run: python nasdaq-xray/stage1_shadow.py
      - name: Run regime breadth
        if: steps.mc.outputs.ready == 'true' && steps.history_revalidate.outputs.ready != 'false'
        env:
          XRAY_MC_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1_input.json
          XRAY_REGIME_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_regime.json
          XRAY_BREADTH_HISTORY_CACHE_DIR: ${{ runner.temp }}/xray-history-cache
          XRAY_BREADTH_CACHE_REQUIRED: "1"
          XRAY_BREADTH_WORKERS: "8"
        run: python nasdaq-xray/regime_breadth_shadow.py
      - name: Run deep geometry only
        if: steps.mc.outputs.ready == 'true' && steps.history_revalidate.outputs.ready != 'false'
        env:
          XRAY_STAGE1_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1.json
          XRAY_DEEP_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_deep_geometry.json
          XRAY_DEEP_GEOMETRY_ONLY: "1"
          XRAY_DEEP_HISTORY_CACHE_DIR: ${{ runner.temp }}/xray-history-cache
          XRAY_DEEP_CACHE_REQUIRED: "1"
          XRAY_DEEP_WORKERS: "8"
          XRAY_SPLIT_HTTP_TIMEOUT_SECONDS: "4"
          XRAY_SPLIT_HTTP_RETRIES: "1"
        run: python nasdaq-xray/deep_pre_r1_shadow.py
      - name: Persist exact trigger-scope history snapshots
        if: steps.mc.outputs.ready == 'true' && steps.history_revalidate.outputs.ready != 'false'
        env:
          XRAY_SOURCE_HISTORY_CACHE_DIR: ${{ runner.temp }}/xray-history-cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil,sys
          import pandas as pd

          root=pathlib.Path("nasdaq-xray")
          srcdir=pathlib.Path(os.environ["XRAY_SOURCE_HISTORY_CACHE_DIR"])
          d=json.load(open(root/"canonical_current_deep_geometry.json"))
          asof=str(d["asof_et"])
          expected=dict(d.get("history_fingerprint_by_symbol") or {})
          trigger=sorted(set(d.get("weekly_trigger_scope") or []))
          assert set(expected)==set(trigger),(len(expected),len(trigger),sorted(set(trigger)-set(expected))[:10])
          assert int(d.get("unknown_history_count",-1))==0,d.get("unknown_history")
          assert len(expected)>0

          dstdir=root/"canonical_benchmark_cache"
          dstdir.mkdir(parents=True,exist_ok=True)
          def hpath(base,sym):
              return base/(hashlib.sha256(sym.encode()).hexdigest()+".csv.gz")
          def git_blob_sha(path):
              b=path.read_bytes()
              return hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()

          # Import only after binding Deep to the destination cache. The module
          # will then reconstruct ticker-continuity composites from these exact
          # immutable transport snapshots.
          os.environ["XRAY_DEEP_HISTORY_CACHE_DIR"]=str(dstdir)
          os.environ["XRAY_DEEP_CACHE_REQUIRED"]="1"
          sys.path.insert(0,str(root))
          import deep_pre_r1_shadow as dp
          from alpha_semantics import history_fingerprint

          copied={}
          support={}
          for sym in sorted(expected):
              src=hpath(srcdir,sym)
              if not src.exists():
                  raise RuntimeError("POST_MC_TRIGGER_CACHE_SOURCE_MISSING:"+sym)
              dst=hpath(dstdir,sym)
              shutil.copy2(src,dst)
              copied[sym]={"path":str(dst).replace("\\","/"),"blob_sha":git_blob_sha(dst),"fingerprint":expected[sym]}
              rec=(dp.OFFICIAL_RECORDS or {}).get(sym) or {}
              if rec.get("mode")=="OFFICIAL_TICKER_CONTINUITY_COMPOSITE_HISTORY" and rec.get("cusip_unchanged") is True:
                  pred=str(rec.get("predecessor_symbol") or "")
                  if not pred:
                      raise RuntimeError("POST_MC_CONTINUITY_PREDECESSOR_MISSING:"+sym)
                  psrc=hpath(srcdir,pred)
                  if not psrc.exists():
                      raise RuntimeError("POST_MC_CONTINUITY_CACHE_SOURCE_MISSING:"+sym+":"+pred)
                  pdst=hpath(dstdir,pred)
                  shutil.copy2(psrc,pdst)
                  support[pred]={"path":str(pdst).replace("\\","/"),"blob_sha":git_blob_sha(pdst),"role":"TICKER_CONTINUITY_PREDECESSOR"}

          qsrc=hpath(srcdir,"QQQ")
          if not qsrc.exists():
              raise RuntimeError("POST_MC_QQQ_CACHE_SOURCE_MISSING")
          qdst=hpath(dstdir,"QQQ")
          shutil.copy2(qsrc,qdst)

          verified={}
          for sym,exp in sorted(expected.items()):
              x,err=dp.load_history(sym,asof)
              if x is None:
                  raise RuntimeError("POST_MC_CANONICAL_CACHE_LOAD_FAIL:"+sym+":"+str(err))
              fp=history_fingerprint(x,asof)
              if fp!=exp:
                  raise RuntimeError("POST_MC_CANONICAL_CACHE_FINGERPRINT_MISMATCH:"+sym)
              verified[sym]=fp

          q,qe=dp.load_history("QQQ",asof)
          if q is None:
              raise RuntimeError("POST_MC_QQQ_CANONICAL_CACHE_LOAD_FAIL:"+str(qe))
          qfp=history_fingerprint(q,asof)
          if qfp!=d.get("qqq_history_fingerprint"):
              raise RuntimeError("POST_MC_QQQ_CANONICAL_CACHE_FINGERPRINT_MISMATCH")

          symbol_hash=hashlib.sha256(("\n".join(sorted(expected))+"\n").encode()).hexdigest()
          deep_path=root/"canonical_current_deep_geometry.json"
          manifest={
            "schema":"XRAY_CANONICAL_DEEP_HISTORY_CACHE_MANIFEST_V1",
            "task_id":d.get("task_id"),
            "asof_et":asof,
            "execution":"NONE","real_money":"NO-GO","unknown_never_pass":True,
            "authority":"POST_MC_EXACT_FINGERPRINT_CACHE_TRANSPORT_ONLY",
            "source_deep_geometry_path":"nasdaq-xray/canonical_current_deep_geometry.json",
            "source_deep_geometry_blob_sha":git_blob_sha(deep_path),
            "symbol_count":len(expected),"symbol_hash":symbol_hash,
            "symbols":sorted(expected),
            "entries":copied,
            "support_entries":support,
            "qqq":{"path":str(qdst).replace("\\","/"),"blob_sha":git_blob_sha(qdst),"fingerprint":qfp},
            "fingerprint_semantics":d.get("history_fingerprint_semantics"),
            "alpha_authority":False,
            "no_threshold_change":True,
            "no_synthetic_bars":True,
          }
          mp=root/"canonical_deep_history_cache_manifest.json"
          mp.write_text(json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          assert set(verified)==set(expected)
          print({"XRAY_POST_MC_DEEP_HISTORY_CACHE":"PASS","asof":asof,
                 "symbols":len(expected),"support":len(support),"qqq":True})
          PY

      - name: Build dynamic event request
        if: steps.mc.outputs.ready == 'true' && steps.history_revalidate.outputs.ready != 'false'
        env:
          XRAY_EVENT_STAGE1: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1.json
          XRAY_EVENT_REGIME: ${{ github.workspace }}/nasdaq-xray/canonical_current_regime.json
          XRAY_EVENT_DEEP: ${{ github.workspace }}/nasdaq-xray/canonical_current_deep_geometry.json
