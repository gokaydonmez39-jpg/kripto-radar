        run: python nasdaq-xray/build_current_event_request.py
      - name: Structural post-MC gate
        if: steps.mc.outputs.ready == 'true' && steps.history_revalidate.outputs.ready != 'false'
        run: |
          python - <<'PY'
          import json,os
          h=json.load(open("nasdaq-xray/canonical_current_history.json"))
          l=json.load(open("nasdaq-xray/canonical_current_legal.json"))
          s=json.load(open("nasdaq-xray/canonical_current_stage1.json"))
          r=json.load(open("nasdaq-xray/canonical_current_regime.json"))
          d=json.load(open("nasdaq-xray/canonical_current_deep_geometry.json"))
          e=json.load(open("nasdaq-xray/canonical_current_event_request.json"))
          asof="${{ steps.mc.outputs.asof }}"
          assert h["asof_et"]==l["asof_et"]==s["asof_et"]==r["asof_et"]==d["asof_et"]==e["asof_et"]==asof
          import pathlib,subprocess
          def bsha(p):
              return subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
          mc_path=pathlib.Path("${{ steps.mc.outputs.path }}")
          hp=pathlib.Path("nasdaq-xray/canonical_current_history.json")
          lp=pathlib.Path("nasdaq-xray/canonical_current_legal.json")
          sip=pathlib.Path("nasdaq-xray/canonical_current_stage1_input.json")
          sp=pathlib.Path("nasdaq-xray/canonical_current_stage1.json")
          rp=pathlib.Path("nasdaq-xray/canonical_current_regime.json")
          dp=pathlib.Path("nasdaq-xray/canonical_current_deep_geometry.json")
          si=json.load(open(sip))
          mc_rel="${{ steps.mc.outputs.path }}"
          assert (h.get("source_mc_artifact") or h.get("source_mc_path"))==mc_rel
          assert h.get("source_mc_blob_sha")==bsha(mc_path)
          assert l.get("source_history_blob_sha")==bsha(hp)
          assert si.get("source_mc_path")==mc_rel and si.get("source_mc_blob_sha")==bsha(mc_path)
          assert si.get("source_history_blob_sha")==bsha(hp)
          assert si.get("source_legal_blob_sha")==bsha(lp)
          assert s.get("source_input_blob_sha")==bsha(sip)
          assert r.get("source_input_blob_sha")==bsha(sip)
          assert d.get("source_stage1_blob_sha")==bsha(sp)
          assert e.get("source_stage1_blob_sha")==bsha(sp)
          assert e.get("source_regime_blob_sha")==bsha(rp)
          assert e.get("source_deep_geometry_blob_sha")==bsha(dp)
          print({"POST_MC_EXACT_SOURCE_CHAIN":"PASS",
                 "mc":bsha(mc_path),"history":bsha(hp),"legal":bsha(lp),
                 "stage1_input":bsha(sip),"stage1":bsha(sp),"regime":bsha(rp),"deep":bsha(dp)})
          assert h["unknown_count"]==0,h["unknown_symbols"]
          assert l["counts"]["UNKNOWN_LEGAL"]==0,l["unknown_symbols"]
          stage1_unknown=set(s.get("unknown") or [])
          breadth_missing=set(r.get("breadth_missing") or [])
          deep_history_unknown=set(d.get("unknown_history") or [])
          assert len(stage1_unknown)==int(s.get("unknown_count",len(stage1_unknown)))
          assert len(breadth_missing)==int(r.get("breadth_missing_count",len(breadth_missing)))
          assert len(deep_history_unknown)==int(d.get("unknown_history_count",len(deep_history_unknown)))
          assert s["input_current_core_count"]==l["counts"]["PASS_LEGAL"]
          assert r["current_core_count"]==l["counts"]["PASS_LEGAL"]
          assert d["input_weekly_pass_count"]==s["weekly_pass_count"]
          trigger_weekly=set(s.get("recent_weekly_scope") or s["weekly_pass"])
          assert d["input_weekly_trigger_scope_count"]==len(trigger_weekly)
          assert set(d.get("weekly_trigger_scope") or [])==trigger_weekly
          assert e["weekly_scope_count"]==len(trigger_weekly)
          assert set(e["weekly_scope"])==trigger_weekly
          assert set(e.get("current_weekly_scope") or [])==set(s["weekly_pass"])
          assert not (stage1_unknown & trigger_weekly),"UNKNOWN_STAGE1_LEAKED_INTO_TRIGGER_SCOPE"
          cov=e.get("coverage_unknowns") or {}
          assert set((cov.get("stage1") or {}).get("symbols") or [])==stage1_unknown
          assert int((cov.get("stage1") or {}).get("count",-1))==len(stage1_unknown)
          assert set((cov.get("breadth") or {}).get("symbols") or [])==breadth_missing
          assert int((cov.get("breadth") or {}).get("count",-1))==len(breadth_missing)
          assert set((cov.get("deep_history") or {}).get("symbols") or [])==deep_history_unknown
          assert int((cov.get("deep_history") or {}).get("count",-1))==len(deep_history_unknown)
          assert e.get("upstream_coverage_complete") is (not (stage1_unknown or breadth_missing or deep_history_unknown))
          assert e.get("request_scope_complete") is True
          fresh=set(e.get("fresh_geometry_scope") or [])
          lifecycle=set(e.get("lifecycle_scope") or [])
          geometry=set(e["geometry_scope"])
          assert e["geometry_scope_count"]==len(geometry)
          assert fresh<=set(e["weekly_scope"])
          assert lifecycle<=set(l["pass_symbols"])
          assert geometry==fresh|lifecycle
          print({"asof":asof,"history_pass":h["pass_count"],"legal_pass":l["counts"]["PASS_LEGAL"],
                 "stage1_unknown":len(stage1_unknown),"breadth_missing":len(breadth_missing),
                 "deep_history_unknown":len(deep_history_unknown),
                 "weekly_pass":s["weekly_pass_count"],"weekly_trigger_scope":len(trigger_weekly),
                 "regime":r["regime"],"A":d["a_geometry_count"],"B_breakout":d["b_breakout_count"],
                 "B_armed":d["b_armed_count"],"D":d["d_geometry_rs_count"],
                 "fresh_geometry":len(fresh),"lifecycle_scope":len(lifecycle),
                 "event_request_geometry":e["geometry_scope_count"],
                 "upstream_coverage_complete":e.get("upstream_coverage_complete")})
          PY
      - name: Commit current post-MC artifacts
        if: steps.mc.outputs.ready == 'true' && steps.history_revalidate.outputs.ready != 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          baseline="${{ steps.early_authority.outputs.baseline_sha }}"
          [[ -n "$baseline" ]] || baseline="$GITHUB_SHA"
          git cat-file -e "$baseline^{commit}"
          echo "XRAY_POST_MC_CAS_BASELINE=$baseline latest=$latest"
          if [[ "$latest" != "$baseline" ]]; then
            changed="$(git diff --name-only "$baseline" "$latest" -- \
              .github/workflows/xray-canonical-current-post-mc.yml \
              nasdaq-xray/canonical_current_full_state.json \
              nasdaq-xray/canonical_current_resolver_request.json \
              nasdaq-xray/canonical_current_resolver_chunk_manifest.json \
              nasdaq-xray/chatgpt_canonical_state_v2.json \
              nasdaq-xray/canonical_current_master_manifest.json \
              nasdaq-xray/canonical_current_price_dv30.json \
              nasdaq-xray/canonical_resolver_bridge_*.json \
              nasdaq-xray/build_resolver_full_scope_handoff.py \
              nasdaq-xray/canonical_mc_bridge_*.json \
              nasdaq-xray/build_mc_provenance_rebind.py \
              nasdaq-xray/history_official_identity_evidence.json \
              nasdaq-xray/canonical_history_evidence_bridge_*.json \
              nasdaq-xray/alpha_semantics.py \
              nasdaq-xray/history_phase.py \
              nasdaq-xray/legal_phase.py \
              nasdaq-xray/build_stage1_input.py \
              nasdaq-xray/stage1_shadow.py \
              nasdaq-xray/regime_breadth_shadow.py \
              nasdaq-xray/deep_pre_r1_shadow.py \
              nasdaq-xray/build_current_event_request.py \
              nasdaq-xray/chatgpt_compiled_policy_v3.json || true)"
            if [[ -n "$changed" ]]; then
              echo "XRAY_POST_MC_COMMIT=STALE_SOURCE_ABORT"
              printf '%s\n' "$changed"
              exit 0
            fi
          fi
          files=(
            nasdaq-xray/canonical_current_history.json
            nasdaq-xray/canonical_current_legal.json
            nasdaq-xray/canonical_current_stage1_input.json
            nasdaq-xray/canonical_current_stage1.json
            nasdaq-xray/canonical_current_regime.json
            nasdaq-xray/canonical_current_deep_geometry.json
            nasdaq-xray/canonical_deep_history_cache_manifest.json
            nasdaq-xray/canonical_current_event_request.json
          )
          if [[ "${{ steps.resolver_handoff.outputs.created }}" == "true" && -n "${{ steps.resolver_handoff.outputs.path }}" ]]; then
            files+=("${{ steps.resolver_handoff.outputs.path }}")
          fi
          if [[ "${{ steps.mc_rebind.outputs.created }}" == "true" && -n "${{ steps.mc_rebind.outputs.path }}" ]]; then
            files+=("${{ steps.mc_rebind.outputs.path }}")
          fi
          mapfile -t cache_files < <(python - <<'PY'
          import json
          m=json.load(open("nasdaq-xray/canonical_deep_history_cache_manifest.json"))
          paths=[(m.get("qqq") or {}).get("path")]
          paths += [v.get("path") for v in (m.get("entries") or {}).values()]
          paths += [v.get("path") for v in (m.get("support_entries") or {}).values()]
          for p in sorted(set(x for x in paths if x)):
              print(p)
          PY
          )
          files+=("${cache_files[@]}")
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for p in "${files[@]}"; do
            if [ -f "$p" ]; then
              mkdir -p "$tmpdir/$(dirname "$p")"
              cp "$p" "$tmpdir/$p"
            fi
          done
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            # CAS retry must revalidate the exact authority source set.
            # A concurrent Pre-MC/MC/pointer commit is never silently rebased.
            retry_latest="$(git rev-parse origin/main)"
            if [[ "$retry_latest" != "$baseline" ]]; then
              retry_changed="$(git diff --name-only "$baseline" "$retry_latest" -- \
              .github/workflows/xray-canonical-current-post-mc.yml \
              nasdaq-xray/canonical_current_full_state.json \
              nasdaq-xray/canonical_current_resolver_request.json \
              nasdaq-xray/canonical_current_resolver_chunk_manifest.json \
              nasdaq-xray/chatgpt_canonical_state_v2.json \
              nasdaq-xray/canonical_current_master_manifest.json \
              nasdaq-xray/canonical_current_price_dv30.json \
              nasdaq-xray/canonical_resolver_bridge_*.json \
              nasdaq-xray/build_resolver_full_scope_handoff.py \
              nasdaq-xray/canonical_mc_bridge_*.json \
              nasdaq-xray/build_mc_provenance_rebind.py \
              nasdaq-xray/history_official_identity_evidence.json \
              nasdaq-xray/canonical_history_evidence_bridge_*.json \
              nasdaq-xray/alpha_semantics.py \
              nasdaq-xray/history_phase.py \
              nasdaq-xray/legal_phase.py \
              nasdaq-xray/build_stage1_input.py \
              nasdaq-xray/stage1_shadow.py \
              nasdaq-xray/regime_breadth_shadow.py \
              nasdaq-xray/deep_pre_r1_shadow.py \
              nasdaq-xray/build_current_event_request.py \
              nasdaq-xray/chatgpt_compiled_policy_v3.json || true)"
              if [[ -n "$retry_changed" ]]; then
                echo "XRAY_POST_MC_COMMIT=STALE_SOURCE_ABORT_RETRY"
                printf '%s\n' "$retry_changed"
                exit 0
              fi
            fi
            git reset --hard origin/main
            for p in "${files[@]}"; do
              if [ -f "$tmpdir/$p" ]; then
                mkdir -p "$(dirname "$p")"
                cp "$tmpdir/$p" "$p"
              fi
            done
            git add "${files[@]}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "XRAY_FACTORY_COMMIT=NO_CHANGE"
              exit 0
            fi
            git commit -m "chore(xray): current epoch post-MC factory"
            if git push origin HEAD:main; then
              echo "XRAY_FACTORY_COMMIT=PASS"
              exit 0
            fi
            echo "XRAY_FACTORY_PUSH_RACE attempt=$attempt"
            sleep $((attempt*2))
          done
          echo "XRAY_FACTORY_COMMIT=FAIL" >&2
          exit 1

      # A pending MC source means the stage is NOT complete. Publish the
      # operational diagnostic above, then report a visible NO-GO instead of
      # a misleading green job that wakes Final as if authority existed.
      - name: Diagnose exact source authority before blocked Post-MC release
        if: always() && steps.freeze.outputs.frozen != 'true' && steps.mc.outputs.ready != 'true'
        run: |
          python -m py_compile nasdaq-xray/post_mc_source_readiness.py
          python nasdaq-xray/post_mc_source_readiness.py --selftest
          python nasdaq-xray/post_mc_source_readiness.py --out /tmp/xray_post_mc_source_readiness.json
      - name: Upload source-blocker witness before fail-closed release
        if: always() && steps.freeze.outputs.frozen != 'true' && steps.mc.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xray-post-mc-source-readiness
          path: /tmp/xray_post_mc_source_readiness.json
          retention-days: 14
          if-no-files-found: warn

      - name: Enforce actual current MC authority before Post-MC SUCCESS
        if: steps.freeze.outputs.frozen != 'true' && steps.mc.outputs.ready != 'true'
        run: |
          echo "XRAY_POST_MC_RELEASE=BLOCKED_CURRENT_MC_AUTHORITY_REQUIRED"
          echo "XRAY_POST_MC_NEXT=DO_NOT_PROMOTE_SHADOW_OR_REUSE_STALE_TERMINAL"
          exit 2

