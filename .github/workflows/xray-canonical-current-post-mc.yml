name: XRAY Canonical Current Post-MC Factory

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/canonical_mc_bridge_*.json"
      - "nasdaq-xray/history_phase.py"
      - "nasdaq-xray/legal_phase.py"
      - "nasdaq-xray/build_stage1_input.py"
      - "nasdaq-xray/stage1_shadow.py"
      - "nasdaq-xray/regime_breadth_shadow.py"
      - "nasdaq-xray/deep_pre_r1_shadow.py"
      - ".github/workflows/xray-canonical-current-post-mc.yml"
  schedule:
    - cron: "55 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-canonical-current-post-mc
  cancel-in-progress: false

jobs:
  post-mc:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Find exact-bound committed MC bridge
        id: mc
        shell: bash
        run: |
          set -e
          python - <<'PY' > /tmp/mc_out
          import glob,hashlib,json,pathlib
          price_path=pathlib.Path("nasdaq-xray/canonical_current_price_dv20.json")
          master_path=pathlib.Path("nasdaq-xray/canonical_current_master_manifest.json")
          pointer_path=pathlib.Path("nasdaq-xray/chatgpt_canonical_state_v2.json")
          if not price_path.exists() or not master_path.exists() or not pointer_path.exists():
              print("ready=false")
              raise SystemExit
          p=json.load(open(price_path)); m=json.load(open(master_path)); ptr=json.load(open(pointer_path))
          ps=ptr.get("state_json") or {}
          if isinstance(ps,str): ps=json.loads(ps)
          if not isinstance(ps,dict): print("ready=false"); raise SystemExit
          if p.get("schema")!="XRAY_CANONICAL_PRICE_DV20_V1" or m.get("schema")!="XRAY_CANONICAL_CURRENT_MASTER_MANIFEST_V1":
              print("ready=false"); raise SystemExit
          if p.get("asof_et")!=m.get("asof_et") or p.get("source_master_queue_hash")!=m.get("queue_hash") or p.get("source_master_count")!=m.get("queue_total"):
              print("ready=false"); raise SystemExit
          b=price_path.read_bytes()
          price_blob=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          expected_asof=p["asof_et"]; expected_hash=p["pass_hash"]; expected_count=p["pass_count"]
          pointer_asof=str(ps.get("asof_et") or "")
          settlement_required=bool(pointer_asof and expected_asof>pointer_asof)
          expected_path="nasdaq-xray/canonical_current_price_dv20.json"
          valid=[]
          for fp in glob.glob("nasdaq-xray/canonical_mc_bridge_*.json"):
              try:
                  j=json.load(open(fp))
                  ok=(
                    j.get("schema")=="XRAY_MC_EPOCH_RESULT_V1"
                    and j.get("status")=="COMMITTED"
                    and j.get("task_id")=="6a825366222081918997094d76e6ae46"
                    and j.get("execution")=="NONE" and j.get("real_money")=="NO-GO"
                    and j.get("asof_et")==expected_asof
                    and j.get("input_path")==expected_path
                    and j.get("input_blob_sha")==price_blob
                    and j.get("input_pass_hash")==expected_hash
                    and j.get("policy_hash")=="987982f0d17fc0f01a28fe22540fc3e09d4e2f28e3aa1b40c0113e3112b44c16"
                    and j.get("policy_version")=="C4.11"
                    and int(j.get("input_count",-1))==int(expected_count)
                    and (j.get("counts") or {}).get("TOTAL")==expected_count
                    and set((j.get("results") or {}).keys())==set(p.get("pass_symbols") or [])
                    and (
                      (not settlement_required and j.get("settlement_witness_status") in (None,"NOT_REQUIRED_POINTER_ASOF","PASS"))
                      or (
                        settlement_required
                        and j.get("settlement_witness_status")=="PASS"
                        and bool(j.get("settlement_witness_path"))
                        and bool(j.get("settlement_witness_blob_sha"))
                      )
                    )
                  )
                  if ok and settlement_required:
                      sw=pathlib.Path(j["settlement_witness_path"])
                      if not sw.exists():
                          ok=False
                      else:
                          sb=sw.read_bytes()
                          ssha=hashlib.sha1(f"blob {len(sb)}\0".encode()+sb).hexdigest()
                          try: sj=json.loads(sb)
                          except Exception: sj={}
                          ok=(
                            ssha==j["settlement_witness_blob_sha"]
                            and sj.get("schema")=="XRAY_RESOLVER_EPOCH_RESULT_V1"
                            and sj.get("status")=="COMMITTED"
                            and sj.get("asof_et")==expected_asof
                            and sj.get("queue_hash")==m.get("queue_hash")
                            and sj.get("compiled_policy_hash")=="987982f0d17fc0f01a28fe22540fc3e09d4e2f28e3aa1b40c0113e3112b44c16"
                            and sj.get("compiled_policy_version")=="C4.11"
                            and sj.get("settlement_status")=="PASS"
                          )
                  if ok: valid.append(fp)
              except Exception:
                  pass
          if len(valid)!=1:
              print("ready=false")
              print("expected_asof="+str(expected_asof))
              print("binding_matches="+str(len(valid)))
          else:
              fp=valid[0]
              print("ready=true")
              print("path="+fp)
              print("asof="+expected_asof)
              print("price_blob_sha="+price_blob)
              print("input_pass_hash="+expected_hash)
          PY
          cat /tmp/mc_out >> "$GITHUB_OUTPUT"
          cat /tmp/mc_out
      - name: Compile
        if: steps.mc.outputs.ready == 'true'
        run: |
          python -m py_compile \
            nasdaq-xray/history_phase.py \
            nasdaq-xray/legal_phase.py \
            nasdaq-xray/build_stage1_input.py \
            nasdaq-xray/stage1_shadow.py \
            nasdaq-xray/regime_breadth_shadow.py \
            nasdaq-xray/deep_pre_r1_shadow.py \
            nasdaq-xray/build_current_event_request.py
      - name: Install zero-dollar runtime
        if: steps.mc.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check akshare==1.18.95 pandas pandas_market_calendars
      - name: Run HISTORY
        if: steps.mc.outputs.ready == 'true'
        shell: bash
        run: |
          XRAY_HISTORY_INPUT="$GITHUB_WORKSPACE/${{ steps.mc.outputs.path }}" \
          XRAY_HISTORY_OUT="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_history.json" \
          XRAY_ASOF="${{ steps.mc.outputs.asof }}" XRAY_HISTORY_WORKERS="10" \
          python nasdaq-xray/history_phase.py
      - name: Run LEGAL
        if: steps.mc.outputs.ready == 'true'
        shell: bash
        run: |
          XRAY_LEGAL_HISTORY="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_history.json" \
          XRAY_LEGAL_MASTER="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_full_state.json" \
          XRAY_LEGAL_PROOF="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_legal_proof.json" \
          XRAY_LEGAL_OUT="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_legal.json" \
          XRAY_ASOF="${{ steps.mc.outputs.asof }}" python nasdaq-xray/legal_phase.py
      - name: Build exact Stage1 input
        if: steps.mc.outputs.ready == 'true'
        shell: bash
        run: |
          XRAY_POST_MC="$GITHUB_WORKSPACE/${{ steps.mc.outputs.path }}" \
          XRAY_POST_HISTORY="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_history.json" \
          XRAY_POST_LEGAL="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_legal.json" \
          XRAY_STAGE1_INPUT_OUT="$GITHUB_WORKSPACE/nasdaq-xray/canonical_current_stage1_input.json" \
          python nasdaq-xray/build_stage1_input.py
      - name: Run Stage1
        if: steps.mc.outputs.ready == 'true'
        env:
          XRAY_MC_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1_input.json
          XRAY_STAGE1_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1.json
          XRAY_STAGE1_WORKERS: "8"
        run: python nasdaq-xray/stage1_shadow.py
      - name: Run regime breadth
        if: steps.mc.outputs.ready == 'true'
        env:
          XRAY_MC_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1_input.json
          XRAY_REGIME_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_regime.json
          XRAY_BREADTH_WORKERS: "8"
        run: python nasdaq-xray/regime_breadth_shadow.py
      - name: Run deep geometry only
        if: steps.mc.outputs.ready == 'true'
        env:
          XRAY_STAGE1_STATE: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1.json
          XRAY_DEEP_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_deep_geometry.json
          XRAY_DEEP_GEOMETRY_ONLY: "1"
          XRAY_DEEP_WORKERS: "8"
        run: python nasdaq-xray/deep_pre_r1_shadow.py
      - name: Build dynamic event request
        if: steps.mc.outputs.ready == 'true'
        env:
          XRAY_EVENT_STAGE1: ${{ github.workspace }}/nasdaq-xray/canonical_current_stage1.json
          XRAY_EVENT_REGIME: ${{ github.workspace }}/nasdaq-xray/canonical_current_regime.json
          XRAY_EVENT_DEEP: ${{ github.workspace }}/nasdaq-xray/canonical_current_deep_geometry.json
          XRAY_EVENT_REQUEST_OUT: ${{ github.workspace }}/nasdaq-xray/canonical_current_event_request.json
        run: python nasdaq-xray/build_current_event_request.py
      - name: Structural post-MC gate
        if: steps.mc.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json,os
          h=json.load(open("nasdaq-xray/canonical_current_history.json"))
          l=json.load(open("nasdaq-xray/canonical_current_legal.json"))
          s=json.load(open("nasdaq-xray/canonical_current_stage1.json"))
          r=json.load(open("nasdaq-xray/canonical_current_regime.json"))
          d=json.load(open("nasdaq-xray/canonical_current_deep_geometry.json"))
          e=json.load(open("nasdaq-xray/canonical_current_event_request.json"))
          asof="${{ steps.mc.outputs.asof }}"
          assert h["asof_et"]==l["asof_et"]==s["asof_et"]==r["asof_et"]==d["asof_et"]==e["asof_et"]==asof
          assert h["unknown_count"]==0,h["unknown_symbols"]
          assert l["counts"]["UNKNOWN_LEGAL"]==0,l["unknown_symbols"]
          assert s["unknown_count"]==0,s["unknown"]
          assert r["breadth_missing_count"]==0,r["breadth_missing"]
          assert d["unknown_history_count"]==0,d["unknown_history"]
          assert s["input_current_core_count"]==l["counts"]["PASS_LEGAL"]
          assert r["current_core_count"]==l["counts"]["PASS_LEGAL"]
          assert d["input_weekly_pass_count"]==s["weekly_pass_count"]
          assert e["weekly_scope_count"]==s["weekly_pass_count"]
          assert set(e["weekly_scope"])==set(s["weekly_pass"])
          assert e["geometry_scope_count"]==len(set(e["geometry_scope"]))
          assert set(e["geometry_scope"])<=set(e["weekly_scope"])
          print({"asof":asof,"history_pass":h["pass_count"],"legal_pass":l["counts"]["PASS_LEGAL"],"weekly_pass":s["weekly_pass_count"],"regime":r["regime"],"A":d["a_geometry_count"],"B_breakout":d["b_breakout_count"],"B_armed":d["b_armed_count"],"D":d["d_geometry_rs_count"],"event_request_geometry":e["geometry_scope_count"]})
          PY
      - name: Commit current post-MC artifacts
        if: steps.mc.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          git config user.name "xray-dataplane-bot"
          git config user.email "xray-dataplane-bot@users.noreply.github.com"
          git add \
            nasdaq-xray/canonical_current_history.json \
            nasdaq-xray/canonical_current_legal.json \
            nasdaq-xray/canonical_current_stage1_input.json \
            nasdaq-xray/canonical_current_stage1.json \
            nasdaq-xray/canonical_current_regime.json \
            nasdaq-xray/canonical_current_deep_geometry.json \
            nasdaq-xray/canonical_current_event_request.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(xray): current epoch post-MC factory [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
