name: XRAY Replay V2 Refresh

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/chatgpt_canonical_state_v2.json"
      - "nasdaq-xray/deterministic_replay_guard.py"
      - ".github/workflows/xray-replay-v2-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-replay-v2-refresh
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build replay V2
        run: python nasdaq-xray/deterministic_replay_guard.py
      - name: Verify replay V2
        run: |
          python - <<'PY'
          import json
          r=json.load(open("nasdaq-xray/canonical_replay_guard.json"))
          assert r["schema"]=="XRAY_DETERMINISTIC_REPLAY_GUARD_V2",r
          assert r["status"]=="PASS",r
          assert r["asof_consistent"] is True,r
          print("XRAY_REPLAY_V2_VERIFY=PASS")
          PY
      - name: Commit replay V2
        run: |
          set -euo pipefail
          git config user.name "xray-replay-bot"
          git config user.email "xray-replay-bot@users.noreply.github.com"
          git add nasdaq-xray/canonical_replay_guard.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(xray): refresh deterministic replay v2 [skip ci]"
          git push origin HEAD:main
