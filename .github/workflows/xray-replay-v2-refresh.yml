name: XRAY Replay V2 Refresh

on:
  push:
    branches: [main]
    paths:
      - "nasdaq-xray/chatgpt_canonical_state_v2.json"
      - "nasdaq-xray/deterministic_replay_guard.py"
      - ".github/workflows/xray-replay-v2-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xray-replay-v2-refresh
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build replay V2
        run: python nasdaq-xray/deterministic_replay_guard.py
      - name: Verify replay V2
        run: |
          python - <<'PY'
          import json
          r=json.load(open("nasdaq-xray/canonical_replay_guard.json"))
          assert r["schema"]=="XRAY_DETERMINISTIC_REPLAY_GUARD_V2",r
          assert r["status"]=="PASS",r
          assert r["asof_consistent"] is True,r
          print("XRAY_REPLAY_V2_VERIFY=PASS")
          PY
      - name: Commit replay V2
        run: |
          set -euo pipefail
          git config user.name "xray-replay-bot"
          git config user.email "xray-replay-bot@users.noreply.github.com"
          git add nasdaq-xray/canonical_replay_guard.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(xray): refresh deterministic replay v2 [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            changed="$(git diff --name-only "$GITHUB_SHA" origin/main -- \
              nasdaq-xray/chatgpt_compiled_policy_v3.json \
              nasdaq-xray/canonical_current_master_manifest.json \
              nasdaq-xray/canonical_current_price_dv30.json \
              nasdaq-xray/canonical_current_history.json \
              nasdaq-xray/canonical_current_legal.json \
              nasdaq-xray/canonical_current_stage1.json \
              nasdaq-xray/canonical_current_regime.json \
              nasdaq-xray/canonical_current_deep_geometry.json \
              nasdaq-xray/canonical_current_event_state.json \
              nasdaq-xray/canonical_current_final_tech.json \
              nasdaq-xray/canonical_current_terminal.json \
              nasdaq-xray/chatgpt_canonical_state_v2.json \
              nasdaq-xray/deterministic_replay_guard.py || true)"
            if [[ -n "$changed" ]]; then
              echo "XRAY_REPLAY_V2_COMMIT=STALE_SOURCE_ABORT"
              printf '%s\n' "$changed"
              exit 1
            fi
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "XRAY_REPLAY_V2_COMMIT=PASS"
              exit 0
            fi
            sleep $((attempt*2))
          done
          echo "XRAY_REPLAY_V2_COMMIT=FAIL" >&2
          exit 1
