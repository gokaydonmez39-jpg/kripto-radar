name: XRAY v47 PIT Symbol Alias Offline (No Data No AL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'nasdaq-xray/xray_v47_pit_symbol_mapping_shadow.py'
      - 'nasdaq-xray/test_xray_v47_pit_symbol_mapping_shadow.py'
      - 'nasdaq-xray/xray_v47_hypothetical_fisv_cross_transition.json'
      - '.github/workflows/xray-v47-pit-alias-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strictly-offline-symbol-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate future-asof, renamed symbol and no-go scenarios
        shell: bash
        run: |
          set -euo pipefail
          cd nasdaq-xray
          python -m py_compile xray_v47_pit_symbol_mapping_shadow.py test_xray_v47_pit_symbol_mapping_shadow.py
          python -m unittest -v test_xray_v47_pit_symbol_mapping_shadow.py
          python -O -m unittest -v test_xray_v47_pit_symbol_mapping_shadow.py
          python xray_v47_pit_symbol_mapping_shadow.py xray_v47_hypothetical_fisv_cross_transition.json | grep -q 'CROSS_TRANSITION_VENUE_PARTITION_REQUIRED'
      - name: Static reject network, orders, rights and premature price authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('nasdaq-xray/xray_v47_pit_symbol_mapping_shadow.py')
          s=p.read_text(encoding='utf-8')
          tree=ast.parse(s)
          imported=set()
          for n in ast.walk(tree):
              if isinstance(n,ast.Import):
                  imported.update(a.name.split('.')[0] for a in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module:
                  imported.add(n.module.split('.')[0])
          assert not imported.intersection({'requests','urllib','http','socket','subprocess','alpaca','os','ccxt'})
          for fixed in ("'a0_account_rights_verified': False",
                        "'a1_listing_scope_release_ready': False",
                        "'canonical_price_pass': False",
                        "'registered_r92_count': 0",
                        "'execution': 'NONE'",
                        "'real_money': 'NO-GO'"):
              assert fixed in s, fixed
          print('XRAY_V47_NO_PROVIDER_NO_BROKER_NO_AL=PASS')
          PY