name: XRAY 406 Writer Ownership Isolated CI

on:
  push:
    branches:
      - xray-406-ownership-offline-20261114
    paths:
      - '.github/workflows/xray-406-ownership-offline.yml'
      - 'personal-swing/research_lab/xray406-fixtures/ownership-20261114.patch'

permissions:
  contents: read

jobs:
  isolated-writer-ownership:
    if: github.event_name == 'push' && github.ref == 'refs/heads/xray-406-ownership-offline-20261114' && github.repository == 'gokaydonmez39-jpg/kripto-radar' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply candidate to exact pinned source without starting any production workflow
        shell: bash
        run: |
          set -euo pipefail
          base='0e7d4302a556857b30c042bfa25b08f48dc92893'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$base"
          patch="$PWD/personal-swing/research_lab/xray406-fixtures/ownership-20261114.patch"
          printf '%s  %s\n' '59324494fdd8d40c2a06f2a03b67bc675bc8024a7d6a8bb4ad9f5a277d1eb09f' "$patch" | sha256sum --check
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT
          git archive "$base" -- \
            .github/workflows/xray-canonical-current-final.yml \
            .github/workflows/xray-live-truth-attestation.yml \
            .github/workflows/xray-resilience-observability.yml \
            nasdaq-xray/build_current_terminal.py \
            nasdaq-xray/manual_decision_report.py \
            nasdaq-xray/official_source_guard.py | tar -xf - -C "$sandbox"
          cd "$sandbox"
          git apply --check "$patch"
          git apply "$patch"
          python -m pip install 'PyYAML==6.0.2'
          python -m unittest discover -s tests -v
          python -O -m unittest discover -s tests -v
          python nasdaq-xray/manual_decision_report.py --selftest
          python -m py_compile nasdaq-xray/*.py
          echo 'XRAY_406_OWNERSHIP_ISOLATED=PASS NO_PRODUCTION_RUN'
